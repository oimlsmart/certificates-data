name: scrape

on:
  schedule:
    # Weekly, Monday 03:17 UTC. The cadence is the maintainer's decision;
    # adjust here. Every run preserves the previous manifest as a dated
    # snapshot before the register is re-read.
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests

      - name: Snapshot the current manifest
        run: |
          mkdir -p "snapshots/$(date +%Y%m%d)"
          cp manifest.jsonl "snapshots/$(date +%Y%m%d)/manifest.jsonl"

      - name: Scrape the register
        run: |
          # The preserved scraper resolves its output roots from its own
          # location; run it from the repository root so the raw tier and
          # manifest update in place. The copy is removed after the run.
          cp pipeline-work/download_oiml_certs.py ./download_oiml_certs.py
          python download_oiml_certs.py
          rm download_oiml_certs.py

      - name: Commit snapshot and scrape
        run: |
          git config user.name "certificates-data scrape"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.jsonl snapshots certificates
          git commit -m "scrape $(date +%Y%m%d): manifest snapshot + register refresh" || echo "nothing to commit"
          git push
