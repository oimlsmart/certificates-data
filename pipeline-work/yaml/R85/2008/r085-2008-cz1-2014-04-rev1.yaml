  module_designation:
  description: >-
    The level sensor 924B is done by a shaft in stainless steel and nickel coated brass cap with nitrophyl or stainless steel
    floats. Body of the probe must not be electrically grounded. The level sensor XMT-SI-485 is done by a shaft in stainless
    steel, by a head in stainless steel IP68 with composite material caps, a circular connection M12 or 7/8" and fuel resistant
    cable, floats in Stainless Steel or in special expanded closed cell PVC or NBR. The level sensor XMT is done by a shaft
    in stainless steel, by a head in die cast Alluminium IP67, a a cable gland and a fuel resistant cable, a sliding tank
    connection and floats in Stainless Steel or in special expanded closed cell PVC or NBR. Normal cabinet dimensions of SiteSentinel
    Nano: height 180 mm; width 300 mm; depth 65 mm with 178 mm touch screen display."
