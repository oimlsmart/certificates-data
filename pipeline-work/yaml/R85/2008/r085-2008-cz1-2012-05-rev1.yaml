  description: >-
    Magnetostrictive level gauge comprising the SiteSentinel Integra 100/500 controller with one of the
    following probe types: 924B; VSmart probe sensor controller with 7100V probe; or XMT-SI-485 or XMT
    probe. The level sensor 924B is a shaft in stainless steel and nickel coated brass cap with nitrophyl
    or stainless steel floats; the body of the probe must not be electrically grounded. The level sensor
    7100V is a flexible shaft in PVDF with nitrophyl or stainless steel floats. The level sensor XMT-SI-485
    has a shaft in stainless steel, a head in stainless steel IP68 with composite material caps, a circular
    connection M12 or 7/8" and a fuel resistant cable, with floats in stainless steel or special expanded
    closed cell PVC or NBR. The level sensor XMT has a shaft in stainless steel, a head in die cast aluminium
    IP67, a cable gland and a fuel resistant cable, a sliding tank connection and floats in stainless
    steel or special expanded closed cell PVC or NBR.
