certified_type:
  category: Automatic level gauge
  type_designations:
  - Unimep Tank Probe MTL-11 with Zenner barrier
  module_designation: N/A
  description: >-
    The level sensor MTL-11 consists of shielded shaft which includes steel probe tube inside shaft, 2 floats and electronic
    at top of the shaft. Due to movement of floats there is voltage induction which is evaluated by electronic at top of the
    shaft. The measured level is transferred to PC program by 4-wire connection (2-wire for data, 2-wire for supply) through
    the Zenner barrier.
