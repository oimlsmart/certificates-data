certified_type:
  category: Field-interface
  type_designations:
  - CIU 888
  module_designation:
  description: >-
    Field-interface for use as part of a liquid automatic level gauge (OIML R 85-1&2). The CIU 888 is
    the interface between the tank gauging instruments on bulk liquid storage tanks and computer systems
    in the tank farm control room, providing accurate gauge data and process data. All measured data including
    level, temperature, pressure, density, alarm status, interface level, vapor temperature and other
    data is scanned continuously and stored in a local real-time database. Produced at Honeywell Enraf,
    Delftechpark 39, 2628 XJ Delft, The Netherlands and Honeywell international (India) Private Ltd.,
    Plot No. 2, Gat No. 181, village Fulgaon, Tal-Haveli, PUNE-412261, India.
