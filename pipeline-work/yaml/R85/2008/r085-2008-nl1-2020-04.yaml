certified_type:
  category: Automatic level gauge
  type_designations:
  - SmartRadar FlexLine XP
  - SmartRadar FlexLine HP
  description: >-
    Automatic level gauge (ALG), type SmartRadar FlexLine XP and SmartRadar FlexLine HP, with the antennas
    F06, F08, W06, H04, S06, S08, S10 and S12, with indicating device SmartView and/or indicating device
    HART SmartView, with field interface 880 CIU-Prime and/or 880 CIU-Plus and/or CIU 880, with remote
    calculating and indicating system EntisPro, with indicating and memory device ENTIS.
