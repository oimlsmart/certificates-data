  - CIU 888
  module_designation: N/A
  description: >-
    A field-interface for use as part of a liquid automatic level gauge. The CIU 888 is the interface between the tank gauging
    instruments on bulk liquid storage tanks and computer systems in the tank farm control room providing accurate gauge data
    and process data. 1 up to 50 tanks (up to 80 tanks with CIU Plus compliant Modbus) can be connected to a single CIU 888.
    All measured data including level, temperature, pressure, density, alarm status, interface level, vapor temperature and
    other data is scanned continuously. The data is stored in a local real-time database.
