certified_type:
  category: Fuel dispenser
  type_designations:
  - QUANTIUM XXXX AdBlue
  module_designation:
  description: >-
    Dispenser for AdBlue under OIML R 117-1 (2007) 'Dynamic measuring systems for liquids other than water'.
    Uni-directional flow. Each measuring instrument consists at least of one combined submerged pump or
    a barrel pump, one or more measurement transducers (meters) and one calculating/indicating device
    (calculator). Several installations for measuring AdBlue can be connected to one calculating/indicating
    device and one submerged pump can be connected to several meters. The calculator/indicating device
    can be used as common part for several fuel- and/or LPG-dispensers and/or measuring systems for AdBlue
    placed in the same housing. For multi-product dispensers it is only possible to deliver one product
    at the same time on one side of the dispenser. 'XXXX' in the type designation are the 'frame models'
    and are a non-essential indication. This measuring instrument may bear the producer name DFS Netherlands
    B.V. after 1 May 2019, replacing the producer name Tokheim Netherlands B.V.
