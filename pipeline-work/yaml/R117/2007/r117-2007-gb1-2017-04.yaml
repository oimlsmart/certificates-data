certified_type:
  category: Fuel dispenser
  type_designations:
  - Sprint
  module_designation: Not applicable
  description: >-
    Liquids other than water dispenser (fuel dispenser), pattern Sprint. Each hydraulic circuit consists
    of one or two meters (types V, V+, C or C+), a GPU90 pump and gas separator (except for use in pressurized
    (STP) systems), and one or two delivery hose circuits. Two hydraulic circuits must be combined for
    dispensing at the highest flowrate (130 l/min). Up to four hydraulic circuits are housed in a single
    enclosure with one common calculator (Tulip, Sandpiper-2 or Sandpiper-Apollo); alternatively there
    may be two calculators each controlling one or two hydraulic circuits in a single enclosure (4 active
    hose model). Optional features and functions: communications (remote automation); electronics for
    payment at the dispenser, printer; optical or magnetic pulsers; encrypted communication (128 bit minimum,
    TEA/AES) between the CPU and the pulsers, displays and keypad; vapour recovery systems; temperature
    compensation (with Sandpiper-2 or Sandpiper-Apollo); delivery speed selection by pushbutton or nozzle
    selection; electronic and/or electromechanical totalizers; speakers, preset, keypad and pushbutton
    options; slave displays and/or master-satellite operation; additional displays with alternative number
    of display digits and display size (minimum 6 digits money and volume, 4 digits unit price, minimum
    height 25 mm), discrete displays for money, volume and unit price or combined into a single display;
    multimedia display; NC3 Payment Terminal (alternative name M7); GSM modem for electronic receipts
    (non metrological).
