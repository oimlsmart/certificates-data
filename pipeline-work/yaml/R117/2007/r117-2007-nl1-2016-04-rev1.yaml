certified_type:
  category: Fuel dispenser
  type_designations:
  - Global Century
  description: >-
    Fuel dispenser. Each measuring instrument consists at least of one combined pump and gas eliminator
    device (gas separator), one measurement transducer (meter) and one calculating/indicating device (calculator).
    The same housing of the dispenser can comprise one or more measuring systems; when more than one measuring
    system is in one housing, one calculating/indicating device may be a common part of the measuring
    systems. For multi-product dispensers it is only possible to deliver one product at the same time
    on one side of the dispenser.
