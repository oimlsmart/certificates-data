certified_type:
  category: Calculator and indicator
  type_designations:
  - EM6
  module_designation:
  description: >-
    Electronic calculator with indicator for use on road tanker systems or static installations for measurement
    of liquids other than water. The volume may be temperature compensated. Has built-in preset functionality
    and is capable of monitoring and pre-setting two flow meters simultaneously. Temperature compensation
    may be implemented using a temperature sensor installed in the fuel delivery pipe within one metre
    from the flow meter; any sensor complying with the accuracy and response times specified in OIML R117
    Edition 2007 (E) may be installed. Programming procedures are described in the EM6 Calibration and
    Verification Manual. Ancillary devices: zero-setting device (automatic at start of each delivery),
    printing device (authorised printer per section 4), memory device, price indicating device (optional),
    conversion device (temperature compensation to reference conditions), pre-setting device (quantity
    only).
