certified_type:
  category: Measurement transducer
  type_designations:
  - LEFM 2xxCi [RN][LT][-R]
  - LEFM / SVM 289Ci [RN][LT][-R]
  - LEFM 240Ci [RN][LT][-R]
  - LEFM 244Ci [RN][LT][-R]
  - LEFM 280Ci [RN][LT][-R]
  - LEFM 288Ci [RN][LT][-R]
  module_designation:
  description: >-
    Measurement transducer (ultrasonic sensor and associated electronics), brand Caldon. Consists of G3
    electronics in combination with either full bore or reduced bore spool piece design. The full-bore
    design is a cylindrical spool piece with 4 or 8 distinct chord locations for custody transfer metering;
    the reduced bore spool piece consists of a nozzle-shaped convergent section, a cylindrical throat
    piece with 4 or 8 distinct chord locations and a divergent section. RTD input (Pt-100) is used for
    correction of the thermal expansion of the meter body, calculation of the liquid density (this density
    shall not be used for calculating the delivered mass from the measured volume) and calculation of
    the viscosity of the liquid; the 244Ci and 244CiRN meters can have two Pt-100 elements, one for each
    4-path meter. Variants: [RN] = reducing nozzle variant; [LT] = low temperature variant; [-R] = remote
    mounted electronics variant. Construction recorded in documentation folder no. TC7381-7.
