  - F200y
  - F300y
  - F300y Enhanced version
  - F400y
  - MVD series electronics
  - 5700 electronics
  module_designation:
  description: >-
    Measurement transducer for dynamic measuring systems for liquids other than water, consisting of an
    Fxxx measurement sensor combined with MVD series electronics or 5700 electronics. Accuracy classes
    0.3, 0.5, 1.0 and 1.5; intended for oil and oil products, chemicals, potable liquids, liquefied gases
    under pressure and cryogenic liquids.
