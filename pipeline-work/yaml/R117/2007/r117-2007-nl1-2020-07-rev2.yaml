certified_type:
  category: Measurement sensor
  type_designations:
  - DM
  - M(S)xxx
  - BMxxx
  description: >-
    Measurement sensor for dynamic measuring systems for liquids other than water. Types DM, M(S)xxx and
    BMxxx, where xxx indicates the meter size and (S) the use of a pressure containing sphere as either
    S, SAA, SC or SB. Meter types BMxx and DMxx are no longer produced by Liquid Controls LLC (effective
    1 January 2021); they were previously placed on the market under the name "Avery Hardoll" until 1
    January 2021.
