certified_type:
  category: Turbine meter
  type_designations:
  - ADRIANE DN 50-30 GPL
  - ADRIANE DN 50-40
  - ADRIANE DN 50-50
  - ADRIANE DN 80-80
  - ADRIANE DN 100-80
  - ADRIANE DN 100-150
  - ADRIANE DN 150-600
  module_designation:
  description: >-
    Turbine meters ALMA type ADRIANE, designed to be fitted to measuring systems for liquids other than
    water. They fulfil the requirements of OIML R117-1 (2007) and R117-2 / R117-3 (2014). Each ALMA turbine
    meter ADRIANE comprises: a body (each ADRIANE turbine meter has an identical body shape and internal
    shape); a flow straightener mounted upstream of the propeller, either an internal honeycomb or a separate
    ALMA tube flow straightener mounted upstream of the meter for concerned models; and an internal diametric
    hub supporting the fixed axis, around which the propeller revolves. The ALMA turbine meters ADRIANE
    can be associated to a two-way pulse emitter system such as: ALMA pulse emitter 2H00 or 2HP0; two
    separate induction coils fixed to a calculator connected to the meter; or two separate induction coils
    connected to a calculator deported to the meter.
