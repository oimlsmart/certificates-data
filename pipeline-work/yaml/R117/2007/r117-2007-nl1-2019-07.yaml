certified_type:
  category: Density sensor
  type_designations:
  - CDM100M
  - CDM100P
  description: >-
    Density sensor (a sensor as a part of a densitometer): in the metal housing, two parallel tubes are
    mounted which are set into a vibrating motion by a drive coil controlled by the transmitter. The two
    pick-off coils generate signals representative of the frequency of motion of the measurement tubes;
    the resonance frequency depends, among other things, on the density of the liquid in the measurement
    tubes. The transmitter can output this resonance frequency either directly or via serial communication.
    For software version 2.11 onwards, the transmitter when connected to an external pressure and temperature
    transmitter via HART is capable of calculating the line density and converting it to density at reference
    conditions; these density values can be output via RS-485 Modbus serial communication, BELL 202 HART
    protocol or 4...20 mA analog signal. Line density is calculated using Mobrey/Solatron density formulas;
    conversion to density at reference conditions (0 kPa, 15 °C) uses Tables 53A/53B/53D and to (0 kPa,
    20 °C) uses Tables 59A/59B/59D as specified in API Manual of Petroleum Measurements Standards, Chapter
    11, Section 1 (ASTM D1250-07). Also capable of concentration measurement calculations of alcohol according
    to OIML R22, density conversion for Fatty Acid Methyl Ester (FAME) according to EN14214:2008+A1:2009
    and density conversion for Methyl Ester. If the time period signal of the device is used as the output,
    the density sensor, along with pressure and temperature sensors, needs to be connected to a flow computer
    in which the actual density calculations and conversions take place. For software version 2.10 and
    lower, together with the calibration constants, a connected flow computer (optionally with external
    process pressure and temperature transmitters) can calculate the liquid density under line conditions
    and/or under standard conditions.
