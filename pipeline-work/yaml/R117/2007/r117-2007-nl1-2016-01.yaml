certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  - TQM
  - EPZ
  - TQP-RS
  - TK80
  - TQP-HS (PAS V3)
  - WWC v4
  - WWV v7
  - TQCL-C
  - TQCL
  module_designation:
  description: >-
    A fuel dispenser comprising one or more measuring systems in the same housing. Each measuring system
    consists of one Tokheim combined pump and gas elimination device (TQP-RS, TK80 or TQP-HS (PAS V3)),
    one Tokheim TQM measurement transducer and one Tokheim calculating/indicating device (WWC v4, WWV
    v7 or TQCL-C). One Tokheim combined pump and gas eliminator can be connected with two measurement
    transducers, each measuring transducer being considered as a part of a measuring system. When more
    than one measuring system is in one housing, the calculating/indicating device may be a common part
    of the measuring systems. A Qmax of 130 L/min can be reached by connecting two gas separators (or
    one gas separator if the Qmax is sufficient) and two measurement transducers in parallel with delivery
    via one hose with nozzle. For multi-product dispensers it is only possible to deliver one product
    at the same time on one side of the dispenser. The construction of the measuring instrument is recorded
    in Documentation folder no. T10003-7.
