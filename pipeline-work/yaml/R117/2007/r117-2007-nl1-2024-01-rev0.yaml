certified_type:
  category: Fuel dispenser
  type_designations:
  - SK700-2
  - Horizon 2
  - SK700-2/Frontier
  - SK700-2/Endura
  module_designation: Not applicable
  description: >-
    Fuel dispenser consisting at least of one measurement transducer (meter) and one calculating/indicating
    device (calculator). The same housing of the dispenser can comprise one or more measuring systems;
    when more than one measuring system is in one housing, one calculating/indicating device may be a
    common part of the measuring systems. For multi-product dispensers it is only possible to deliver
    one product at the same time on one side of the dispenser.
characteristics:
  type_level:
