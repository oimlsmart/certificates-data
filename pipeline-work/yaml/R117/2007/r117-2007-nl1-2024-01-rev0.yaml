        min: 0.4
        max: 4.5
      unit_symbol: mPa·s
  config_level:
  - attribute: flow_rate_range
    axis: viscosity_range
    values:
    - condition: 0.4-1.0 mPa·s
      value:
        min: 1.6
        max: 40
      unit_symbol: L/min
    - condition: 1.1-4.5 mPa·s
      value:
        min: 2.0
        max: 80
      unit_symbol: L/min
  - attribute: ambient_temperature_range
    axis: heater_in_calculator_cpu_and_display_housing
