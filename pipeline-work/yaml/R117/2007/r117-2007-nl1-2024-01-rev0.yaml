        min: -25
        max: 55
      unit_symbol: "°C"
    - condition: with heater
      value:
        min: -40
        max: 55
      unit_symbol: "°C"
  - attribute: minimum_measured_quantity
    axis: max_flow_rate
    values:
    - condition: less than 60 L/min
      value:
        min:
        max: 5
      unit_symbol: L
