certified_type:
  category: Density sensor
  type_designations:
  - CDM100M
  - CDM100P
  module_designation:
  description: >-
    A density sensor (a sensor as a part of a densitometer) based on the Coriolis principle for the determination
    of the density of the liquid. The only approved output of the density sensor is the tube period. Together
    with the calibration constants, a flow computer, to which the density sensor is connected and to which
    optionally external process pressure and temperature transmitters are connected, can calculate the
    liquid density under metering conditions and/or under standard conditions.
