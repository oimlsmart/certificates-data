certified_type:
  category: Measurement device (Coriolis)
  type_designations:
  - LNGmass DN08
  - LNGmass DN15
  - LNGmass DN25
  module_designation:
  description: >-
    A Coriolis measurement device intended to be used as a part of a measuring instrument, for the measurement
    of Liquified Natural Gas (LNG). The measurement sensor consists of a housing in which two parallel
    measuring tubes are mounted, set into vibrating motion by a drive coil controlled by the measurement
    transducer; two measuring coils generate signals representative of the frequency of the tubes (representative
    for the density of the liquid), and the time shift between the two signals is representative of the
    mass flow rate. The electronic module in the measurement transducer consists of an amplifier board
    and a connection (IO) board. LNGmass can be used as the measuring device in the main cryogenic liquid
    system or in the vapor return line, to measure and compensate for the mass of gas returned from the
    receiving tank. Certified type LNGmass DNxx, where xx denotes the size of the meter (diameter of the
    in- and outlet in mm); sizes covered: DN08, DN15, DN25. The construction of the measuring instrument
    is recorded in the Documentation folder no. TC8502-1.
