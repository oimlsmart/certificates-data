certified_type:
  category: Fuel dispenser
  type_designations:
  - Alpha FC10
  module_designation:
  description: >-
    The Hytek Alpha FC10 fuel dispenser is an interruptible meter measuring system and integrated fuel
    management system. The Self-Service Device (SSD) can have various user access methods including, but
    not limited to, RFID Tag Reader, Swipe Card Reader, Data Disk Reader, Identitag reader. The integrated
    dispenser housing comprises a hydraulics enclosure with an electronics enclosure above it. Non-essential
    parts that may be included within the hydraulic circuits: shear valves for use on dispensers, non-return
    valves separate from the pump and gas separator, swivels and/or safety breaks in the hose assembly
    circuit.
