footnotes:
- marker: 1)
  text: >-
    The gas eliminator is mounted on top of the filter. Depending on the size, one or more gas eliminators
    are used.
- marker: 2)
  text: Types 42100, 42101, 42104, A8170, A8180, A8200 and A8340A
- marker: 3)
  text: FD filter is only used for the 4 inch diameter.
- marker: 4)
  text: >-
    A two stage valve is used which is either pneumatically or hydraulically controlled. For the EGS_2
    a so called air check valve is required. See the documentation folder 7329-5.
- marker: 5)
  text: The LC-sound gas indicator operates on the ultra sonic principle.
