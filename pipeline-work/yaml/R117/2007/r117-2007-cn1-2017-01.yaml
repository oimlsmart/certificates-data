certified_type:
  category: Fuel dispenser
  type_designations:
  - EG5-111
  - EG5-212
  - EG5-222
  - EG5-424
  module_designation:
  description: >-
    Fuel dispenser family EG5 with four model variants differing in number of nozzles, displays and pumps:
    EG5-111 (1 nozzle, 1 display, 1 pump), EG5-212 (2 nozzles, 2 displays, 1 pump), EG5-222 (2 nozzles,
    2 displays, 2 pumps), EG5-424 (4 nozzles, 4 displays, 2 pumps). The type EG5-222 comprises two ZCB-90
    pumps, two MJ-65 flow meters, two EM5X solenoid valves, two 3/4 inch nozzles and two 3/4 inch hoses.
