  rows:
  - gas_separators: 1
    meter_sensors: 1
    meter_sensor_types: C+, V or V+
    flow_rate_min: 1.6
    flow_rate_max: 40
    viscosity_range: 0.4-1.0
    remarks: Intended for the measurement of hydrocarbon oils with viscosity range 0.4-1.0 mPa·s.
  - gas_separators: 1
    meter_sensors: 1
    meter_sensor_types: C+, V or V+
    flow_rate_min: 2.0
    flow_rate_max: 80
    viscosity_range: 1.1-8.0
    remarks: >-
      Intended for the measurement of hydrocarbon oils with viscosity range 1.1-8.0 mPa·s. Optionally
      a feature to allow Qmax to be limited to 40 L/min.
  - gas_separators: 1
    meter_sensors: 2
    meter_sensor_types: C+, V or V+ (one per dispenser side)
    flow_rate_min: 1.6
    flow_rate_max: 40
    viscosity_range: 0.4-1.0
    remarks: >-
      Gas separator suitable for two meter sensors; each meter sensor is part of an individual measuring
      system. Flowrate reduces to 40 L/min with both meter sensors operating. Optionally Qmax limited
      to 40 L/min with a single meter sensor operating.
  - gas_separators: 1
    meter_sensors: 2
    meter_sensor_types: C+, V or V+ (one per dispenser side)
    flow_rate_min: 2.0
    flow_rate_max: 80
    viscosity_range: 1.1-8.0
    remarks: >-
      Gas separator suitable for two meter sensors; each meter sensor is part of an individual measuring
      system. Flowrate reduces to 40 L/min with both meter sensors operating.
  - gas_separators: 2
    meter_sensors: 2
    meter_sensor_types: C+, V or V+
    flow_rate_min: 2.0
    flow_rate_max: 130
    viscosity_range: 1.1-8.0
    remarks: >-
      Qmax of 130 L/min reached by connecting two gas separators and two meter sensors in parallel with
      delivery through a single transfer point. Optionally Qmax limited to 80 L/min. Optionally one gas
      separator and one meter sensor operate as the 1 x gas separator / 2 x meter sensors configuration.
  description: >-
    The complete family of dispensers consists of one family of similar construction with the flow characteristics
    indicated; flow rates per configuration depend on the viscosity range of the measured product.
