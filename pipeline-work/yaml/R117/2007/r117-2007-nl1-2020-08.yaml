certified_type:
  category: Fuel dispenser
  type_designations:
  - Latitude
  description: >-
    Fuel dispenser type Latitude. Each measuring system consists at least of one combined pump and gas
    eliminator device (gas separator), one or more meter sensors (type C+, V or V+) and one calculating/indicating
    device (calculator, type Apollo-II). The same housing can comprise one or more measuring systems;
    with more than one measuring system in one housing, one calculating/indicating device may be common.
    Multi-product dispensers deliver only one product at a time per dispenser side. When installed, the
    maximum flow rate shall be greater than 10 times the minimum flow rate.
