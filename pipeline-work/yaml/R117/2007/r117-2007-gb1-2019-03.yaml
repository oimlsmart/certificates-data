certified_type:
  category: Fuel dispenser
  type_designations:
  - FT4000
  module_designation: Not applicable
  description: >-
    FT4000 Fuel Dispenser with an option of an integrated SSD and remote fuel management system and data
    storage device. Interruptible meter measuring system, single or twin dispenser. The housing comprises
    a hydraulics enclosure with an electronics enclosure above it. The base and internal dispenser frame
    are constructed from riveted angled stainless steel and stainless-steel panelling; the dispenser enclosure
    may be constructed of steel, aluminium, GRP or a combination of these materials. The graphics display
    and logic board which form the calculator are mounted in the upper head. The pump unit and meter are
    supported on the internal dispenser frame. The meter, encoder, gas separator and calculator are secured
    with wire and seal; the data plate is destroyed when removed.
