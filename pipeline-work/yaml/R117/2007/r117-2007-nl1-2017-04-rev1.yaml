certified_type:
  category: Measurement transducer
  type_designations:
  - Promass Q 300 DNxxx
  - Promass Q 500 DNxxx
  description: >-
    Measurement transducer (Coriolis flow transmitter) comprising the Promass Q measurement sensor (sizes
    DN25, DN50, DN80, DN100) with Promass 300 or Promass 500 electronics; to be used solely in combination
    with dynamic mass meters (Coriolis meters) of brand Endress + Hauser. Construction recorded in documentation
    folders TC7149-7 (measurement sensor) and TC10822-2 (electronics).
