footnotes:
- marker: '1'
  text: With xxx denoting the size of the measurement sensor.
- marker: "y"
  text: >-
    y is a letter which indicates the type of material the meter is built of. Where there are different
    possibilities for a characteristic, the actual letter is indicated in superscript (A, B, H, J, P,
    S).
- marker: M/D/V
  text: 'The approved measurements are indicated with: M for Mass, D for Density and V for Volume.'
- marker: note_class_1_5
  text: For accuracy class 1.5, the F-sensors are approved for mass measurement only.
- marker: "*"
  text: >-
    Software versions for the 1700 / 2700 which do not have a checksum (MVD series electronics software
    table).
- marker: "**"
  text: Software versions for the 2500 which do not have a checksum (MVD series electronics software table).
- marker: "* (Table 6)"
  text: >-
    The transmitter software and the Weights & Measures (W&M) software form a matched set. Please note
    that the W&M software does not have a checksum and means W&M is licensed.
- marker: "** (Table 6)"
  text: The number between brackets is the transmitter software which belongs to the stated checksum.
