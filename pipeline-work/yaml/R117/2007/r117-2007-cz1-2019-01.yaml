certified_type:
  category: Fuel dispenser
  type_designations:
  - SK
  description: >-
    The SK series fuel dispensers are designed for measurement of liquid fuel volumes and are used for
    the refuelling of motor vehicles. This certificate covers all of the types of SK series. All of them
    consist of the same components and differ only in frame construction and design that do not influence
    a metrological function. The SK measuring systems consist at least of pipes, pumping unit with incorporated
    gas separator (optional), non-return valve, measuring transducer consisting of a positive displacement
    measurement sensor and pulse transmitter, solenoid valve, electronic calculator with indicating device,
    keypad (optional), sight glass (optional) and hose with dispensing nozzle representing a transfer
    point.
