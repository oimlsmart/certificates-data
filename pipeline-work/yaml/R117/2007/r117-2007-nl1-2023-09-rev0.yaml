certified_type:
  category: Electromagnetic meter
  type_designations:
  - OPTIFLUX x300C
  - OPTIFLUX x000F + IFC300y
  module_designation: Not applicable
  description: >-
    Electromagnetic meter intended to be used as part of a measuring system, destined for the measurement
    of liquid food and chemical products in liquid state with a minimum conductivity of 20 µS/cm. Configurations:
    OPTIFLUX x300C (compact) and OPTIFLUX x000F + IFC300y (remote), where x is 1, 2, 4, 5 or 6 and y is
    F or W. The construction of the measuring instrument is recorded in documentation folder no. TC7161-12.
