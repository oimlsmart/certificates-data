    description: 24 VAC/DC + no option
  - position: b
    code: '1'
    description: Standard Display
  - position: b
    code: A
    description: Eastern Europe Display
  - position: b
    code: B
    description: Northern Europe Display
  - position: b
    code: C
    description: Southern Europe Display
  - position: x
    code: '1'
    description: Basic I/O module
  - position: x
    code: '2'
    description: EXI I/O module (Active current output + passive pulse output)
  - position: x
    code: '3'
    description: EXI I/O module (Passive current output + passive pulse output)
  - position: x
    code: '4'
    description: Modular I/O module
  - position: y/z
    code: '0'
    description: No module possible
  - position: y/z
    code: '2'
    description: >-
      EXI I/O module (Passive current output + passive pulse output / passive control input). When this
      module is used, the z position is unused
  - position: y/z
    code: '8'
    description: No module placed
  - position: y/z
    code: A
    description: Current output (active)
  - position: y/z
    code: B
    description: Current output (passive)
  - position: y/z
    code: C
    description: Pulse output (active)
  - position: y/z
    code: E
    description: Pulse output (passive)
  description: >-
    The CG number CG300 ab xyz details the electronics module and input/output variants: a = power supply
    and virtual reference; b = approved display languages; x = approved input/output version; y and z
    = approved 1st and 2nd optional input/output module.
