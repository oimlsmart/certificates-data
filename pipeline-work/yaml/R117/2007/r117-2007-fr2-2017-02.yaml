certified_type:
  category: Indicator
  type_designations:
  - MICROCOMPT+
  module_designation: Not applicable
  description: >-
    Electronic calculator-indicator and conversion device ALMA type MICROCOMPT+ designed to be fitted
    to measuring systems for liquids other than water; available in two versions (flameproof case EJBA
    version and Rack version). Calculates and displays volume in metering conditions or mass, applies
    correction coefficients according to flowrate and/or type of liquid, converts volume to base conditions
    (using a Pt 100 temperature sensor and density acquired prior to metering or via a frequency-output
    or serial-link density transducer), and computes pure alcoholic strength by volume and pure alcoholic
    volume of water-alcohol mixtures per OIML R22. DUAL version operates with two measuring devices simultaneously.
    DC version is designed for interruptible measuring systems of accuracy class 0.5 or above; AC versions
    for interruptible or non-interruptible systems of accuracy class 0.3 or above. Conversion formulas
    per API-ASTM-IP tables 53 and 54 and French standards NF M 08-009 and NF M 08-017. Fulfills OIML R117-1
    (2007) and R117-2 / R117-3 (2014).
