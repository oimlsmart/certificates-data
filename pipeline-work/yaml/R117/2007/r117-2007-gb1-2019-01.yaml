certified_type:
  category: Fuel dispenser
  type_designations:
  - Orion
  - Frontier II
  - Frontier F2
  description: >-
    Liquid fuel dispenser type Orion, alternative name Frontier II or Frontier F2. Each hydraulic module
    consists of one or two measurement sensors (types C+, V or V+ from the C series family of positive
    displacement meters) and one GPU90 pump and gas separator, except for use in pressurized systems.
    The dispenser chassis is primarily manufactured from sheet steel, with glass or plastic windows providing
    visibility of the indicators. Two dispenser chassis sizes are available: the smaller housing may contain
    one or two hydraulic modules (1 to 4 measuring systems) and the larger housing may contain up to four
    hydraulic modules (1 to 8 measuring systems). Fuel is transferred by a hose and nozzle assembly. All
    measuring transducers share a common calculator, type Apollo-2. Indicators allow a maximum of 7 digits
    for price to pay, 7 digits for volume, and 6 digits for unit price; decimal positions are programmable.
    When temperature compensation is used, the temperature probe shall meet the requirements in R117-1
    (2007) clause 3.7.7 and be located in close vicinity of the sensors. Optional features and functions:
    communications (remote automation), temperature conversion (ATC), keypads for preset control or use
    by site attendants, delivery speed selection either by pushbutton or nozzle selection, electronic
    or electromechanical totalizers, 4 active hose dispenser allowing dispensing from 4 transfer points
    simultaneously and having 4 associated indicators (displays).
