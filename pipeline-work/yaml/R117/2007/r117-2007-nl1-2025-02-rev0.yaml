certified_type:
  category: Density sensor
  type_designations:
  - CDM100M
  - CDM100P
  module_designation:
  description: >-
    Density sensor (a sensor as part of a densitometer). In the metal housing, two parallel tubes are
    mounted which are set into a vibrating motion by a drive coil controlled by the transmitter. The two
    pick-off coils generate signals representative for the frequency of motion of the measurement tubes;
    the resonance frequency depends, among other things, on the density of the liquid in the measurement
    tubes. The transmitter can output this resonance frequency either directly or via serial communication.
    For software version 2.11 onwards, the transmitter when connected to an external pressure and temperature
    transmitter via HART is capable of calculating the line density and converting it to density at reference
    conditions (0 kPa, 15 °C via API Table 53A/53B/53D; 0 kPa, 20 °C via API Table 59A/59B/59D, as specified
    in API MPMS Chapter 11 Section 1, also known as ASTM D1250-07). These density values can be output
    via RS-485 Modbus serial communication, BELL 202 HART protocol or 4-20 mA analog signal. The density
    sensor is also capable of alcohol concentration measurement calculations according to OIML R22, density
    conversion for Fatty Acid Methyl Ester (FAME) according to EN14214:2008 + A1:2009 and density conversion
    for Methyl Ester. If the time period signal of the device is used as the output, the density sensor
    together with a pressure and temperature sensor must be connected to a flow computer, in which the
    actual density calculations and conversions then take place. For software version 2.10 and lower,
    together with the calibration constants, a connected flow computer (with optionally connected external
    process pressure and temperature transmitters) can calculate the liquid density under line conditions
    and/or under standard conditions.
