certified_type:
  category: Fuel dispenser
  type_designations:
  - Global Century Oil Mix
  module_designation: Not applicable
  description: >-
    Fuel dispenser for the measurement of gasoline and gasoline-oil mixtures (Two Stroke Oil). Each measuring
    instrument consists at least of one combined pump and gas eliminator device (gas separator), one measurement
    transducer (meter) for gasoline, one measurement transducer (meter) for two stroke oil and one calculating/indicating
    device (calculator). The same housing of the dispenser can comprise one or more measuring systems;
    when more than one measuring system is in one housing, one calculating/indicating device may be a
    common part of the measuring systems. The combined pump/gas elimination device may be replaced by
    a submersible remote pumping unit; the gas elimination device may only be omitted if the measuring
    system is constructed and installed so that during normal operation neither air intake nor gas release
    will occur in the liquid upstream of the meter.
