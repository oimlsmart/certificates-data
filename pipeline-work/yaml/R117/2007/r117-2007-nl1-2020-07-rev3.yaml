certified_type:
  category: Measurement sensor
  type_designations:
  - DM
  - M(S)xxx
  - BMxxx
  module_designation: Measurement sensor
  description: >-
    Measurement sensors of types DM, M(S)xxx and BMxxx, where xxx indicates the meter size and (S) indicates
    the use of a pressure containing sphere as S, SAA, SC or SB. The complete family of meters consists
    of one family of similar construction. Meter types BMxx and DMxx are no longer produced by Liquid
    Controls LLC (effective 1 January 2021); they were previously placed on the market under the name
    "Avery Hardoll" until 1 January 2021. In BM type designations the letter in brackets stands for Single
    (S), Double (D) or Triple (T) chamber configuration; in M(S) and DM(S) types, (S) stands for Single
    chamber configuration. Production locations of the electronic calculating and indicating device: Liquid
    Controls LLC, 105 Albrecht Drive, Lake Bluff, IL-60044, United States of America; Liquid Controls
    LLC, 9201 N I-35 Service Rd, Oklahoma City, OK 73131, United States of America; SAMPI SpA, Via A.
    Verspucci 1, 55011 Altopascio, Lucca, Italy.
