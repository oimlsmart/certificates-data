    BMxxx, where xxx indicates the meter size and (S) the use of a pressure containing sphere as either
    S, SAA, SC or SB. Meter types BMxx and DMxx are no longer produced by Liquid Controls LLC. The complete
    family of meters consists of one family of similar construction.
