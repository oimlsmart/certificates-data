footnotes:
- marker: 1)
  text: >-
    Maximum pressure for meter model: M: 1034 kPa or 1965 kPa; MS: 1896 kPa; MSAA: 1965 kPa; MSB: 5102
    kPa; MSC: 10204 kPa.
- marker: H
  text: Indicates accuracy class approved on High viscosity oil of 18 cSt at 20 °C.
- marker: L
  text: Indicates accuracy class approved on Low viscosity oil of 0.82 cSt at 20 °C.
- marker: 1 (tables 2 and 3)
  text: >-
    This measuring sensor was previously placed on the market under the name "Avery Hardoll" until 1 January
    2021. It is no longer produced by Liquid Controls LLC.
- marker: note (table 2)
  text: S, D or T between brackets stands for respectively Single, Double or Triple Chamber configuration.
- marker: note (table 3)
  text: "(S) between brackets stands for Single Chamber configuration."
