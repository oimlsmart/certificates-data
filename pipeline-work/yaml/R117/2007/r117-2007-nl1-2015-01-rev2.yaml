certified_type:
  category: Density sensor
  type_designations:
  - CDM100M
  - CDM100P
  module_designation:
  description: >-
    A density sensor (a sensor as part of a densitometer). In the metal housing two parallel tubes are
    mounted which are set into vibrating motion by a drive coil controlled by the transmitter. Two pick-off
    coils generate signals representative of the frequency of motion of the measurement tubes; the resonance
    frequency depends, among other things, on the density of the liquid in the tubes. The transmitter
    can output the resonance frequency directly or via serial communication. Together with the calibration
    constants, a connected flow computer (optionally with external process pressure and temperature transmitters)
    can calculate the liquid density under metering conditions and/or under standard conditions.
