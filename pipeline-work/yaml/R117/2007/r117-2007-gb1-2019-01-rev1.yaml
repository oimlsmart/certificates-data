certified_type:
  category: Fuel dispenser
  type_designations:
  - Alpha Fuel Dispenser
  module_designation: Not applicable
  description: >-
    The Alpha is an interruptible meter measuring system for use in the presence of both trading parties
    when used in standalone mode. The base and internal dispenser frame is constructed from riveted angled
    stainless steel and stainless-steel panel work, clad with stainless steel panels; the hinged front
    doors are secured with two key locks (one lower, one upper). The dispenser enclosure may be constructed
    of steel, aluminium, GRP or a combination of these materials, and may be used to house an approved
    self-service device. The graphics display and logic board which form the calculator are mounted in
    the upper head; the display can be viewed through a clear window in the front panel. The pump unit
    and meter are supported on the internal dispenser frame; the nozzle holster is made from cast aluminium
    and mounted on the dispenser side panel. Conditional characteristics: the combination of hose type
    and length is selected to ensure hose dilation does not result in a displayed quantity at the start
    of a transaction prior to the nozzle being operated; nozzle with built-in non-return valve. Non-essential
    parts that may be included within the hydraulic circuits: shear valves for use on dispensers, non-return
    valves separate from the pump and gas separator, swivels and/or safety breaks in the hose assembly
    circuit. Sealing: the data plate is located on the dispenser enclosure and is destroyed when removed;
    the meter, encoder, gas separator and calculator are secured with a wire and seal (see documentation
    file No. P02336-01-D). The software version and checksum number are displayed on the LCD display for
    four seconds after lifting the nozzle and replacing without drawing fuel; access to software is secured
    by wire and seal.
