certified_type:
  category: Measurement transducer
  type_designations:
  - Promass Q 300 DNxxx
  - Promass Q 500 DNxxx
  description: >-
    Flow transmitter (measurement transducer) for dynamic measuring systems for liquids other than water,
    consisting of a Promass Q measurement sensor and Promass 300 or Promass 500 electronics. The Promass
    300 and Promass 500 flow transmitter is solely to be used in combination with dynamic mass meters
    (Coriolis meters) of brand Endress + Hauser.
