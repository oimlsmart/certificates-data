certified_type:
  category: Density sensor
  type_designations:
  - CDM100M
  - CDM100P
  module_designation:
  description: >-
    A density sensor (a sensor as a part of a densitometer). In the metal housing of the density sensor,
    two parallel tubes are mounted which are set into a vibrating motion by a drive coil controlled by
    the transmitter. The two pick-off coils generate signals representative for the frequency of motion
    of the measurement tubes; the resonance frequency depends, among other things, on the density of the
    liquid in the measurement tubes. The transmitter can output this resonance frequency either directly
    or via serial communication. For software version 2.11 onwards, when connected to an external pressure
    and temperature transmitter via HART, the transmitter can calculate line density and convert it to
    density at reference conditions: 0 kPa / 15 °C using API MPMS Ch. 11.1 (ASTM D1250-07) Tables 53A/53B/53D,
    and 0 kPa / 20 °C using Tables 59A/59B/59D. Outputs via RS-485 Modbus serial communication, BELL 202
    HART protocol or 4-20 mA analog signal. Also capable of alcohol concentration measurement calculations
    according to OIML R22 and density conversion for FAME according to EN14214:2008+A1:2009.
