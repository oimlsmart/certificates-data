  module_designation:
  description: >-
    Measurement sensor for dynamic measuring systems for liquids other than water. Type: DM; M(S)xxx;
    BMxxx, where xxx indicates the meter size and (S) the use of a pressure containing sphere as either
    S, SAA, SC or SB. For BM types, S, D or T between brackets stands for respectively Single, Double
    or Triple Chamber configuration; for the DM type, (S) between brackets stands for Single Chamber configuration.
    The complete family of meters consists of one family of similar construction. Types tested: DM; M(S)75;
    M5; M10; M25; M60; BM250; BM450; BM650 (Documentation folder TC11255-1).
