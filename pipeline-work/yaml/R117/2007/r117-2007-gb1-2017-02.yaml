  description: >-
    CamCor CT Coriolis flow meters for liquids, accuracy classes 0.3 and 0.5 (volumetric and mass flow).
    Interfaces: ModBus, ProfiBus, Foundation FieldBus, Hart. Sealing: parameter write protect switch positioned
