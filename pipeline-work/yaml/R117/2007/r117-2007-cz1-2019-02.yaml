certified_type:
  category: Fuel dispenser
  type_designations:
  - RT-B
  - RT-C
  - RT-V
  module_designation:
  description: >-
    The RT-B, RT-C and RT-V fuel dispensers are designed for measurement of liquid fuel volumes and are
    used for the refuelling of motor vehicles, small boats and small aircrafts. The RT measuring system
    consists of a pumping unit with incorporated gas separator (optional), measuring transducer consisting
    of piston PD measurement sensor and pulse transmitter, solenoid valve, electronic calculating and
    indicating device, keypad (optional), sight glass (optional) and hose with dispensing nozzle.
