  - G3 electronics
  alternatives:
  characteristics:
    software_versions:
    - SW000070
    - SW000082
    software_viewable: The software version is viewable on the display immediately after power on
    parameter_protection: >-
      Essential parameters are unable to be altered if switch 4 of dipswitch SW1 on the CTC board is in
      the closed position
- role: ultrasonic transducers
  type_designations: []
  alternatives:
  characteristics:
    frequency: 0.5 MHz, 1 MHz or 1.6 MHz
- role: spool piece
  type_designations: []
  alternatives: OR
  characteristics:
    full_bore_design: cylindrical spool piece with 4 or 8 distinct chord locations for custody transfer
      metering
    reduced_bore_design: >-
      nozzle-shaped convergent section, a cylindrical throat piece with 4 or 8 distinct chord locations
      for custody transfer metering and a divergent section
- role: RTD temperature input
  type_designations:
  - Pt-100
  alternatives:
  characteristics:
    used_for:
    - Correction of the thermal expansion of the meter body
    - >-
      Calculation of the liquid density (shall not be used for calculating the delivered mass from the
      measured volume)
    - Calculation of the viscosity of the liquid
