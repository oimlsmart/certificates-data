certified_type:
  category: Measurement transducer
  type_designations:
  - Caldon
  - LEFM 2xxCi [RN][LT][-R]
  - LEFM 240Ci
  - LEFM 240CiRN
  - LEFM 244Ci
  - LEFM 244CiRN
  - LEFM 280Ci
  - LEFM 280CiRN
  module_designation:
  description: >-
    A measurement transducer (ultrasonic sensor and associated electronics) for dynamic measuring systems
    for liquids other than water. The LEFM 240Ci [RN][LT][-R] is a four-path ultrasonic meter. The LEFM
    244Ci [RN][LT][-R] is an eight-path ultrasonic meter, it consists of 2 LEFM 240Ci [RN][LT][-R] which
    are mounted in one spool piece. The LEFM 280Ci [RN][LT][-R] is an eight-path ultrasonic meter. [RN]
    = reducing nozzle variant; [LT] = low temperature variant; [-R] = remote mounted electronics variant.
    The measurement transducer consists of G3 electronics in combination with either full bore or reduced
    bore spool piece design. The full-bore design consists of a cylindrical spool piece with 4 or 8 distinct
    chord locations for custody transfer metering. The reduced bore spool piece consists of a nozzle-shaped
    convergent section, a cylindrical throat piece with 4 or 8 distinct chord locations for custody transfer
    metering and a divergent section.
