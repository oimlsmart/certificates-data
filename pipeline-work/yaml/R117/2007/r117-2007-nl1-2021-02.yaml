  category: Measurement transducer
  type_designations:
  - CMFxxx
  - CMFHCx
  description: >-
    Measurement transducer consisting of a CMF or CMFHC series measurement sensor with MVD series electronics
    or 5700 electronics, for dynamic measuring systems for liquids other than water. Intended for the
    measurement of oil and oil products, alcohol, chemicals, potable liquids and cryogenic liquids. With
    xxx or x denoting the size of the measurement sensor.
