- marker: '1'
  text: With xxx or x denoting the size of the measurement sensor.
- marker: "y"
  text: >-
    y is a letter which indicates the type of material the meter is built of. Where there are different
    possibilities for a characteristic, the actual letter is indicated in superscript.
- marker: i
  text: Serial number up to 411000 (CMF400 mechanical improvement distinction).
- marker: ii
  text: Serial number from 411000 up to 14200000 (CMF400 mechanical improvement distinction).
- marker: iii
  text: Serial number higher than 14200000 (CMF400 mechanical improvement distinction).
