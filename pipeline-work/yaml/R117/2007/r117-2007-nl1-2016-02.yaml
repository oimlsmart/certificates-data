certified_type:
  category: Fuel dispenser
  type_designations:
  - Global Century Oil Mix
  module_designation: Not applicable
  description: >-
    Fuel dispenser for the dynamic measurement of gasoline and gasoline-oil mixtures (Two Stroke Oil).
    Each measuring instrument consists at least of one combined pump and gas eliminator device (gas separator),
    one measurement transducer (meter) for gasoline, one measurement transducer (meter) for two stroke
    oil and one calculating/indicating device (calculator). The same housing can comprise one or more
    measuring systems, which may share a common calculating/indicating device. The combined pump/gas elimination
    device may be replaced by a submersible remote pumping unit serving several dispensers.
