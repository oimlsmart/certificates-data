footnotes:
- marker: 1)
  text: With xxx or x denoting the size of the measurement sensor.
- marker: y)
  text: >-
    y is a letter which indicates the type of material the meter is built of. Where there are different
    possibilities for a characteristic, the actual letter is indicated in superscript.
- marker: i)
  text: 'CMF400: serial number up to 411000.'
- marker: ii)
  text: 'CMF400: serial number from 411000 up to 14200000.'
- marker: iii)
  text: 'CMF400: serial number higher than 14200000.'
- marker: "*)"
  text: >-
    Table 5 (MVD series electronics): software versions for the 1700 / 2700 which do not have a checksum.
    Table 7 (5700 electronics): the transmitter software and the Weights & Measures (W&M) software form
    a matched set; the W&M software does not have a checksum and means W&M is licensed.
- marker: "**)"
  text: >-
    Table 5 (MVD series electronics): software versions for the 2500 which do not have a checksum. Table
    7 (5700 electronics): the number between brackets is the transmitter software which belongs to the
    stated checksum.
