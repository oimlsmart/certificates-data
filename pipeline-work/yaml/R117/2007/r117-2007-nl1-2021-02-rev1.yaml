certified_type:
  category: Measurement transducer
  type_designations:
  - CMFxxx
  - CMFHCx
  - CMF100y
  - CMF200y
  - CMF300y
  - CMF350y
  - CMF400y
  - CMFHC2y
  - CMFHC3y
  - CMFHC4y
  module_designation:
  description: >-
    Measurement transducer consisting of a CMF or CMFHC series measurement sensor combined with MVD series
    electronics (types 700, 800, 820, 1700, 2700, 2500, 3500, 3700) or 5700 electronics. Intended for
    the measurement of oil and oil products, alcohol, chemicals, potable liquids, liquefied gases under
    pressure, and cryogenic liquids. In the type designation xxx or x denotes the size of the measurement
    sensor and y denotes the material the meter is built of.
