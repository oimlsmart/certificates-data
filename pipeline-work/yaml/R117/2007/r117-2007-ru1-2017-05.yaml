certified_type:
  category: Fuel dispenser
  type_designations:
  - SureFill
  - AccueFill
  description: >-
    MIDCO Fuel Dispensing Units, SureFill/AccueFill Series, suction type and remote (pressurized) type.
    Comprising one or more systems in every enclosure; each subsystem consists of hydraulics (flow meter
    with integrated combined optical/magnetic pulser, oil metering pump, combined pump and gas eliminator
    other than in pressurized system, break valve, hose, nozzle and flow indicator) and electronics (Electronic
    Register Assembly calculator with optional electronic interfaces such as payment card reader, printer,
    keypad, combined or separate display, pump authentication device, electronic or electro-mechanical
    totalizer, RFID, payment terminal, touch screen, etc.).
