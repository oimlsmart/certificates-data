certified_type:
  category: Fuel dispenser
  type_designations:
  - Alpha FC10
  module_designation: Not applicable
  description: >-
    The Hytek Alpha FC10 fuel dispenser is an interruptible meter measuring system and integrated fuel
    management system with an integrated Self-Service Device (SSD), remote fuel management system and
    data storage device (FC Online). The SSD supports various user access methods including, but not limited
    to, RFID tag reader, swipe card reader, data disk reader and Identitag reader. The integrated dispenser
    housing comprises a hydraulics enclosure with an electronics enclosure above it. Interfaces: RS485,
    RS232. SSD compatible fuel dispenser protocols: Fueltek FT4000, Hytek Alpha, Pumptronics. Non-essential
    parts that may be included in the hydraulic circuits: shear valves for use on dispensers, non-return
    valves separate from the pump and gas separator, swivels and/or safety breaks in the hose assembly
    circuit.
