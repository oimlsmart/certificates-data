certified_type:
  category: Fuel dispenser
  type_designations:
  - Frontier
  description: >-
    Liquids other than water dispenser (Frontier). Each hydraulic circuit consists of: one or two meters,
    types V, V+, C, C+ or Ecometer; a GPU90 or GPU140 pump and gas separator, except for use in pressurized
    (STP) systems; and one or two delivery hose circuits. Two hydraulic circuits may be combined for dispensing
    at the highest flowrate. Up to four hydraulic circuits are housed in a single enclosure with one common
    calculator; alternatively there may be two calculators each controlling one or two hydraulic circuits
    in a single enclosure (4 active hose model). Optional features and functions: communications (remote
    automation), electronics for payment at the dispenser, printer, vapour recovery systems, temperature
    compensation, delivery speed selection by pushbutton or nozzle selection, electronic and/or electromechanical
    totalizers, speakers, preset, keypad, pushbutton options, slave displays and/or master-satellite operation,
    additional displays, multimedia display as described in GB-1487, and NC3 Payment Terminal (alternative
    name M7).
