footnotes:
- marker: "*"
  text: >-
    This is outside of the scope of the recommendation. Utilising the C+ meter only, the meter has been
    shown to measure within the accuracy limits defined by OIML R117-1 2007 (E) at a minimum delivery
    of 1 litre. Any dispenser quoting a minimum delivery of 1 litre shall limit Qmax and hose length,
    and provide appropriate pulser and display resolution, in order to ensure compliance with limits for
    hose expansion masking at the start of delivery, preset handling, pulser check periods and maximum
    increments of quantity registration.
- marker: "**"
  text: Currency Unit according to national legislation.
