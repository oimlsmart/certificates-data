- marker: 6)
  text: y) = A, B, C or E
- marker: "(A)"
  text: 'CMF400: serial number up to 411000'
- marker: "(B)"
  text: 'CMF400: serial number from 411000 up to 14200000'
- marker: "(C)"
  text: 'CMF400: serial number higher than 14200000'
- marker: "[1]"
  text: >-
    The transmitter software and the Weights & Measures (W&M) software form a matched set. Please note
    that the W&M software does not have a checksum and means W&M is licensed.
- marker: "*)"
  text: Between brackets the transmitter software is mentioned which belongs to the stated checksum.
