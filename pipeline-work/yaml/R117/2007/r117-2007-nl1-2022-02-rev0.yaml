  module_designation:
  description: >-
    Measuring system composed of a measurement transducer (meter types DM, BMxxx, Silea Liquid Transfer),
    a measurement sensor (types CMFxxxy, DS600, Emerson Process Management Flow) and a core processor
    (MVD series 700-3700, Emerson Process Management Flow). A printer of any brand and type, equipped
    with paper out detection, can be connected to the flow computer for printing reports (deliveries),
    events and alarms. A non-return valve can be fitted upstream of the measurement sensor to prevent
    reverse flow being measured.
