certified_type:
  category: Measurement transducer
  type_designations:
  - Promass Q 300 DNxxx
  - Promass Q 500 DNxxx
  module_designation: Not applicable
  description: >-
    A measurement transducer (flow transmitter) consisting of the Promass Q measurement sensor with Promass
    300 or Promass 500 electronics; xxx denotes the size of the Promass Q measurement sensor (see footnote
    1). The construction is recorded in documentation folders TC7149-7 for the measurement sensor and
    TC10822-3 for the electronics. The Promass 300 and Promass 500 flow transmitter is solely to be used
    in combination with dynamic mass meters (Coriolis meters) of brand Endress + Hauser.
