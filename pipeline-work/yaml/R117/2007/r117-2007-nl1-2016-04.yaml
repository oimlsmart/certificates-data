matrix_tables:
- name: Flow characteristics of the configurations
  columns:
  - configuration
  - flow_rate_range
  - remarks
  column_units:
  -
  - L/min
  -
  rows:
  - configuration: 1 x gas separator, 1 x meter
    flow_rate_range:
      min: 4
      max: 70
    remarks: Intended for the measurement of gasoline/gasoil.
  - configuration: 1 x gas separator, 1 x meter
    flow_rate_range:
      min: 4
      max: 40
    remarks: Intended for the measurement of blending product.
  - configuration: 1 x gas separator, 1 x meter
    flow_rate_range:
      min: 4
      max: 40
    remarks: >-
      Intended for the measurement of gasoline/gasoil. The gas separator of this measuring system is suitable
      for use with two measurement transducers. Each measuring transducer is considered as a part of a
      measuring system.
  - configuration: 1 x gas separator, 2 x meter
    flow_rate_range:
      min: 4
      max: 90
    remarks: >-
      Intended for the measurement of gasoil. A Qmax of 90 L/min can also be reached by connecting two
      gas separators and two measurement transducers in parallel with delivery via one hose with nozzle.
      This configuration allows a delivery from two nozzles simultaneously at 90 L/min.
  - configuration: 2 x gas separator, 2 x meter
    flow_rate_range:
      min: 13
      max: 130
    remarks: >-
      Intended for the measurement of gasoil. A Qmax of 90 L/min can be reached by connecting two measurement
      transducers in parallel with delivery via one hose with nozzle. This configuration does not allow
      a delivery from two nozzles simultaneously at 130 L/min (except when the remote pump is used).
  - configuration: 3 x gas separator, 4 x meter
    flow_rate_range:
      min: 13
      max: 130
    remarks: >-
      Intended for the measurement of gasoil. This configuration allows a delivery from two nozzles at
      130 L/min simultaneously.
  description: Overview of flow characteristics of the configurations of the family of instruments (Table
    2).
  footnotes: []
