certified_type:
  category: Measurement transducer
  type_designations:
  - SB25x
  - B27x
  - B28x
  - B29x
  - B30x
  - B31x
  - B32x
  - B38x
  module_designation:
  description: >-
    Measurement transducer for dynamic measuring systems for liquids other than water. In the type designations
    x is a code for the pressure rating; in B3zx, z is a code for the flange size (0 = 6", 1 = 8", 2 =
    10" flanges). The SB25x meter is constructed as a single case housing; all other types are constructed
    as a double case housing. The B28x and B29x meters can be used for different liquids without adjustment;
    all other types need adjustment when used for a different liquid. The construction of the measurement
    transducer is recorded in documentation folder number TC7295-6.
