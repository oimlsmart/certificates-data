certified_type:
  category: Calculator and indicator
  type_designations:
  - Masterload II
  module_designation: Not applicable
  description: >-
    Vehicle-mounted electronic calculating/indicating device (meter register) for interruptible systems
    for measuring liquids other than water, accuracy class 0.5. Suitable for use with any compatible approved
    meters. May implement temperature compensation using a PRT probe (model BEMY1115, part number ZEMZ0309-02).
    The PSU provides a permanent signal to the deadman circuit; if an error occurs the signal is lost
    and the switch is activated.
