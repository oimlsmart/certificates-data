certified_type:
  category: Measuring device (Coriolis)
  type_designations:
  - LNGmass
  module_designation:
  description: >-
    Coriolis measurement device intended to be used as a part of a measuring instrument. The measurement
    sensor consists of a housing in which the two parallel measuring tubes are mounted. The measurement
    tubes are set into a vibrating motion by a drive coil, which is controlled by means of an alternating
    current generated by the measurement transducer. Two measuring coils are also mounted on the measurement
    tubes, which generate signals representative of the frequency of the measurement tubes. The frequency
    of the measurement tubes is representative for the density of the liquid; the time shift between the
    two signals is representative of the mass flow rate. The electronic module in the measurement transducer
    consists of an amplifier board and a connection board. LNGmass can be used as the measuring device
    in the main cryogenic liquid system or in the vapor return line to measure and compensate for the
    mass of gas returned from the receiving tank. Type designation LNGmass DNxx, where xx denotes the
    size of the meter (diameter of the in- and outlet in mm).
