certified_type:
  category: Fuel dispenser
  type_designations:
  - RT-NS
  description: >-
    AdBlue dispenser for measurement of AdBlue (NOx reduction agent AUS 32 - 32.5 % aqueous urea solution
    according to ISO 22241) volumes as a legal measuring device, used for filling separate storage tanks
    of heavy-duty vehicles with SCR-technology diesel engines. The RT-NS measuring system consists of
    a non-return valve, filter, measurement transducer (volumetric piston measurement sensor and pulse
    transmitter), solenoid valve, hose with dispensing nozzle and electronic calculator with indicating
    device and optional keypad. Intended to be used with an external submersible pump placed at the bottom
    of a storage tank; a level detection system shall be installed, each delivery delayed until the submerged
    pump has run for at least 3 seconds, and pipelines installed with a positive slope of at least 1 %.
