revision_history:
- revision: '3'
- revision: Initial
  date: '2021-09-30'
  changes:
- revision: '1'
  date: '2022-11-14'
  changes: >-
    Addition of liquefied gases. Increased maximum pressure. Lowered minimum density. Mistake in documentation
    folder number for the measurement sensors corrected. Mistake in minimum flow rates for the CMFHC family
    of measurement sensors corrected.
- revision: '2'
  date: '2022-11-23'
  changes: Addition of the CMF010, CMF025 and CMF050 sensors.
- revision: '3'
  date: '2024-09-11'
  changes: >-
    Lowering Qmin in combination with the MVD800 Enhanced Core Processor or 5700 internal core processor.
