certified_type:
  category: Measurement transducer
  type_designations:
  - Promass F 300 DNxxx
  - Promass F 500 DNxxx
  - Promass O 300 DNxxx
  - Promass O 500 DNxxx
  - Promass X 300 DNxxx
  - Promass X 500 DNxxx
  - Promass Q 300 DNxxx
  - Promass Q 500 DNxxx
  module_designation:
  description: >-
    Measurement transducer for dynamic measuring systems for liquids other than water, consisting of a
    Promass measurement sensor (F, O, X or Q) combined with Promass 300 or Promass 500 electronics (flow
    transmitter). The Promass 300 and Promass 500 flow transmitter is solely to be used in combination
    with dynamic mass meters (Coriolis meters) of brand Endress+Hauser. Construction recorded in documentation
    folders TC7149-7 (measurement sensor) and TC10822-3 (electronics). With xxx denoting the size of the
    measurement sensor (footnote 1).
