components:
- role: electronics
  type_designations:
  - G3
  alternatives:
  characteristics: {}
- role: spool piece
  type_designations:
  - full bore spool piece
  - reduced bore spool piece
  alternatives: OR
  characteristics:
    full_bore_design: cylindrical spool piece with 4 or 8 distinct chord locations for custody transfer
      metering
    reduced_bore_design: >-
      nozzle-shaped convergent section, cylindrical throat piece with 4 or 8 distinct chord locations
      for custody transfer metering and a divergent section
- role: ultrasonic transducer
  type_designations: []
  alternatives:
  characteristics:
    frequency:
      value: 0.5, 1 or 1.6
      unit_symbol: MHz
      unit_id:
      footnote_markers: []
- role: temperature sensor (RTD)
  type_designations:
  - Pt-100
  alternatives:
  characteristics:
    used_for: >-
      correction of the thermal expansion of the meter body; calculation of the liquid density (shall
      not be used for calculating the delivered mass from the measured volume); calculation of the viscosity
      of the liquid
    note: The 244Ci and 244CiRN meter can have two Pt-100 elements, one for each 4-path meter
footnotes:
- marker: "[1]"
  text: >-
    xx = 40: 4-path meter; xx = 44: dual 4-path meter; xx = 80: 8-path meter. [RN] = reducing nozzle variant;
    [LT] = low temperature variant; [-R] = remote mounted electronics variant.
