certified_type:
  category: Density sensor
  type_designations:
  - CDM100M
  - CDM100P
  module_designation:
  description: >-
    A density sensor (a sensor as a part of a densitometer). In the metal housing of the density sensor,
    two parallel tubes are mounted which are set into a vibrating motion by a drive coil controlled by
    the transmitter. The two pick-off coils generate signals representative for the frequency of motion
    of the measurement tubes. The resonance frequency depends, among other things, on the density of the
    liquid in the measurement tubes. The transmitter can output this resonance frequency either directly
    or via serial communication. Together with the calibration constants, a flow computer, to which the
    density sensor is connected and to which optionally external process pressure and temperature transmitters
    are connected, can calculate the liquid density under metering conditions and/or under standard conditions.
