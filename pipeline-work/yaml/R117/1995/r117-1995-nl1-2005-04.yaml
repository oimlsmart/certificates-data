certified_type:
  category: Fuel dispenser
  type_designations:
  - Global Vista
  module_designation:
  description: >-
    Fuel dispensers for Motor Vehicles, model "Global Vista" with a Qmax of 40, 70, 90, or 130 L/min.
    In case of blending the Qmax is 40 L/min. Comprising of one or more measuring systems in the same
    housing. Each measuring system consists of one Dresser Wayne AB CPU (Compact Pumping Unit) combined
    pump and gas eliminator device, one Dresser Wayne AB measurement transducer and one Dresser Wayne
    AB iGEM calculating/indicating device. One CPU combined pump and gas eliminator can be connected with
    two measurement transducers, each measurement transducer is considered as a part of a measuring system.
    When more than one measuring system in one housing the iGEM calculating/indicating device may be a
    common part of the measuring systems. A Qmax of 130 L/min can be reached by connecting two gas separators
    and two measurement transducers in parallel with delivery via one hose with nozzle. For multi-product
    dispensers it is only possible to deliver one product at the same time on one side of the dispenser.
