certified_type:
  category: Fuel dispenser
  type_designations:
  - Sprint Series
  - Z-Line Series
  - PaceMaker-IV Series
  module_designation:
  description: >-
    L&T Fuel Dispensing Pump comprising one or more systems in every enclosure. Each subsystem consists
    of: (1) L&T Flow Meter Type A or Type B (mechanical/electronic calibration), with gears or without
    gears; oil meter in mix pumps; (2) L&T Pump and Gas Eliminator Type A or Type CPU (vane/gear), other
    than in pressurized systems. The enclosure also includes: (3) L&T Calculator - Electronic Register
    Assembly (ERA); (4) L&T Measuring Transducer (Pulsar Assembly), integrated or separate; (5) Electronics
    Customer Interface (card reader, printer, keypad, electronic/electro-mechanical totaliser, push buttons,
    RFID, speaker, payment terminal, remote automation, touch screen, preset), which may be present or
    absent based on requirement. Conformity established with OIML R 117 (1995) for accuracy class 0.5
    and OIML R 118 (1995).
