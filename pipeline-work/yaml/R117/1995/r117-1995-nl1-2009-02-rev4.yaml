certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  description: >-
    Fuel dispenser for motor vehicles, model 'Quantium XXXX', comprising one or more measuring systems
    in the same housing. Each measuring system consists of one Tokheim combined pump and gas elimination
    device, one 'TQM' measurement transducer and one 'TQC' calculating/indicating device. One Tokheim
    combined pump and gas eliminator can be connected with two measurement transducers; each measuring
    transducer is considered as a part of a measuring system. When more than one measuring system in one
    housing the 'TQC' calculating/indicating device may be a common part of the measuring systems. A Qmax
    of 80 L/min can be reached by connecting two gas separators and two measurement transducers in parallel
    with delivery via one hose with nozzle. For multi-product dispensers it is only possible to deliver
    one product at the same time on one side of the dispenser. Liquids: gasoline/gasoil.
