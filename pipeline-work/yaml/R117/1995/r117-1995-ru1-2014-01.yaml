certified_type:
  category: Fuel dispenser
  type_designations:
  - SureFill
  - AccueFill
  module_designation: Not applicable
  description: >-
    MIDCO SureFill/AccueFill fuel dispensers of suction and remote types. Each dispenser consists of one
    or more systems in each housing, and each subsystem consists of: A. Hydraulics - MIDCO flowmeter (one
    for flow rates 50 and 80, two for flow rate 140) including integrated/combined pulser; MIDCO fuel
    pump; MIDCO combined pump and gas separator (other than pressure system); breakaway valve, hose, nozzle
    and flow indicator. B. Electronics - MIDCO calculator, Electronic Registering Assembly (ERA); MIDCO
    customer electronic interfaces (payment card reader, printer, keyboard, combined or separate display,
    electronic or electromechanical totalizer, density and oil percentage reading, buttons, RFID, speaker,
    payment terminal, automation, remote automation, touch screen, preset, IFSF provision, provision for
    advertising or remote display, provision for temperature/pressure sensors, delivery rate), which may
    be present or absent according to customer requirements.
