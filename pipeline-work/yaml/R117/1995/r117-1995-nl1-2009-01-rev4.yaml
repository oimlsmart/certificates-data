certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  description: >-
    Fuel Dispenser for Motor Vehicles, type Quantium XXXX, comprising one or more measuring systems in
    the same housing. Each measuring system consists of one Tokheim combined pump and gas elimination
    device (TQP-RS (EPZ with high cover or EPZ with lower top cover), TK80 or TQP-HS (PAS V3)), one Tokheim
    TQM measurement transducer and one Tokheim WWC v4 or WWV v7 calculating/indicating device. One Tokheim
    combined pump and gas eliminator can be connected with two measurement transducers, each measuring
    transducer is considered as a part of a measuring system. When more than one measuring system in one
    housing the WWC v4 or WWV v7 calculating/indicating device may be a common part of the measuring systems.
    For multi-product dispensers it is only possible to deliver one product at the same time on one side
    of the dispenser. Conformity attested with OIML R117 (Edition 1995) for accuracy class 0.5 and OIML
    R118 (Edition 1995).
