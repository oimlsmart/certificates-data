  - CFS Fuel Star Series
  module_designation:
  description: >-
    The CFS Fuel Star Series fuel dispensers consist of a FSU pumping unit with gas elimination device,
    FMU measuring transducer, CPS electronic calculator, electromagnetic valve, sight glass and house
    with delivery nozzle. There is version for installation in centrally pumped system. Satellite delivery
    point can be present.
