certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  description: >-
    Fuel dispenser for motor vehicles, model Quantium XXXX, comprising one or more measuring systems in
    the same housing. Each measuring system consists of one combined pump and gas elimination device,
    one measurement transducer and one calculating/indicating device. One combined pump and gas eliminator
    can be connected with two measurement transducers, each measuring transducer being considered as part
    of a measuring system. When more than one measuring system is in one housing, the WWC v4 calculating/indicating
    device may be a common part of the measuring systems. A Qmax of 80 L/min can be reached by connecting
    two gas separators and two measurement transducers in parallel with delivery via one hose with nozzle.
    For multi-product dispensers it is only possible to deliver one product at the same time on one side
    of the dispenser.
