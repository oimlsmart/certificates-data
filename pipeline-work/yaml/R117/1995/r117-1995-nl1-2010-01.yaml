certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  module_designation:
  description: >-
    A Fuel Dispenser for Motor Vehicles, model Quantium XXXX, comprising one or more measuring systems
    in the same housing. Each measuring system consists of one Tokheim TQP-RS (EPZ) combined pump and
    gas elimination device, one Tokheim TQM measurement transducer and one Tokheim TMC calculating/indicating
    device. One Tokheim combined pump and gas eliminator can be connected with two measurement transducers,
    each measuring transducer being considered as a part of a measuring system. When more than one measuring
    system in one housing, the TMC calculating/indicating device may be a common part of the measuring
    systems. For multi-product dispensers it is only possible to deliver one product at the same time
    on one side of the dispenser.
