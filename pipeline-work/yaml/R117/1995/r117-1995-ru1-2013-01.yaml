certified_type:
  category: Fuel dispenser
  type_designations:
  - Sunny XE Series Suction type
  - Sunny XE Series Remote type
  module_designation: Not applicable
  description: >-
    Tatsuno Fuel Dispensing Units Sunny XE Series, comprising one or more systems in every enclosure;
    each subsystem consists of: rotary lobe meters including pulser; pump and gas eliminator Type I or
    Type II (gear type), other than in pressurised systems; break valve, hose, nozzle; calculator – Electronic
    Register Assembly (ERA); electronics customer interface (card reader, printer, keypad, electronic/electro-mechanical
    totaliser, push buttons, RFID, speaker, payment terminal, remote automation, touch screen, preset).
    These interfaces may be present or absent based on requirement.
