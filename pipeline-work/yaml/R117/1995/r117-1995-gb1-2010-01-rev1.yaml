certified_type:
  category: Fuel dispenser
  type_designations:
  - Frontier
  module_designation:
  description: >-
    Liquids other than water dispenser, designation Frontier. Each hydraulic circuit consists of one or
    two meters (types V, V+ with mechanical or electronic calibration options, C, C+, or Ecometer) and
    a GPU90 or GPU140 pump and gas separator (except for use in pressurized (STP) systems). Two hydraulic
    circuits may be combined for dispensing at the highest flowrate. Up to four hydraulic circuits are
    housed in a single enclosure with one common calculator (Tulip or Sandpiper) and measuring transducers
    (Tulip pulser or Sandpiper). Optional features and functions: communications (remote automation),
    electronics for payment at the dispenser, printer, delivery speed selection by pushbutton or nozzle
    selection, electronic or electromechanical totalizers, speakers, preset, keypad, pushbutton options,
    slave displays and/or master-satellite operation, additional displays (minimum 6 digits money and
    volume, 4 digits unit price, minimum digit height 25 mm).
