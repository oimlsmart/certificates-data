  module_designation:
  description: >-
    Fuel dispensers of accuracy class 0.5 for gasoline, diesel oil and kerosene; maximum flowrate 50 L/min,
    minimum flowrate 5 L/min, minimum measured quantity 5 L. Composition of type RT-C 224: two JBL-50
    combined pumps and gas eliminator devices, two DSF-20 solenoid valves, two YBB3341EA motors (220 V,
    0.75 kW), two J100 flow meters, two BLS-22KQ-3NM electronic controller devices and two B-TY sensors.
