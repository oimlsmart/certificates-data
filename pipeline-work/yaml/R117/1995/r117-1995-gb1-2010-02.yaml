certified_type:
  category: Fuel dispenser
  type_designations:
  - Sprint
  description: >-
    Liquids other than water dispenser, designation Sprint, accuracy class 0.5. Each hydraulic circuit
    consists of one or two meters (types V or V+ with mechanical or electronic calibration options, or
    type C+global) and a CPU or GPU90g pump with gas separator (except for use in pressurized (STP) systems).
    Two hydraulic circuits may be combined for dispensing at the highest flowrate. Up to four hydraulic
    circuits are housed in a single enclosure with one common Tulip or 4GDE calculator and Tulip pulser
    or Type 4GDE measuring transducers. Optional features: communications (remote automation), electronics
    for payment at the dispenser, printer, delivery speed selection by pushbutton or nozzle selection,
    electronic or electromechanical totalizers, speakers, preset, keypad and pushbutton options, slave
    displays and/or master-satellite operation, and additional displays (number of display digits and
    display size).
