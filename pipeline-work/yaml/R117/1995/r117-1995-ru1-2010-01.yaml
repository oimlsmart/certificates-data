certified_type:
  category: Fuel dispenser
  type_designations:
  - SPRINT series
  - Z-Line series
  - PaceMaker-IV series
  module_designation:
  description: >-
    GILBARCO VEEDER ROOT INDIA PRIVATE LIMITED (GVR) Petrol Dispensing Pumps and Systems, Fuel Dispensing
    Pump 'Sprint Series' / 'Z-Line Series' / 'PaceMaker-IV' Series, comprising one or more systems in
    every enclosure. Each sub-system consists of a GVR Flow Meter (Type A or B, mechanical or electronic
    calibration, with or without gears, oil meter in mix pumps) and a GVR Pump and Gas Eliminator (Type
    A or Type CPU, vane/gear, other than in pressurized systems). These are housed in an enclosure which
    also includes: GVR Calculator - Electronic Register Assembly ERA; GVR Measuring Transducer (Pulsar
    Assembly), integrated or separate; and Electronics Customer Interface (card reader, printer, keypad,
    electronic/electro-mechanical totaliser, push buttons, RFID, speaker, payment terminal, remote automation,
    touch screen, preset), which may be present or absent based on requirement. Conformity attested with
    OIML R 117 (Edition 1995) for accuracy class 0.5; tests carried out in accordance with OIML R 118
    (Edition 1995).
