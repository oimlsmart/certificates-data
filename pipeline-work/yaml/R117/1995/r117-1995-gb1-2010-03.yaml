certified_type:
  category: Fuel dispenser
  type_designations:
  - Horizon
  description: >-
    Liquids other than water dispenser (fuel dispenser), designation Horizon, accuracy class 0.5. Each
    hydraulic circuit consists of one or two meters (types V, V+ with mechanical or electronic calibration
    options, or C global, C+ global, or Ecometer) and a GPU90g or GPU140g pump and gas separator (except
    for use in pressurized (STP) systems). Up to four hydraulic circuits are housed in a single enclosure
    with one common E101g calculator and measuring transducers of type E101 pulser or Eltomatic ME01-04.
    Optional features and functions: communications (remote automation), temperature compensation, vapour
    recovery systems, electronics for payment at the dispenser, delivery speed selection by pushbutton
    or nozzle selection, electronic or electromechanical totalizers, speakers, preset, keypad, pushbutton
    options, slave displays and/or master-satellite operation, additional displays (minimum 6 digits money
    and volume, 4 digits unit price, minimum digit height 25 mm).
