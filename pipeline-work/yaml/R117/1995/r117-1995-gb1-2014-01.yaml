certified_type:
  category: Fuel dispenser
  type_designations:
  - Encore
  module_designation: Not applicable
  description: >-
    Liquids other than water dispenser, Encore family. Each hydraulic circuit consists of one or two meters,
    types V, V+, C, or C+; a GPU90 or GPU140 pump and gas separator, except for use in pressurized (STP)
    systems; and one or two delivery hose circuits. Up to four hydraulic circuits are housed in a single
    enclosure with one common calculator. Optional features and functions: communications (remote automation),
    vapour recovery systems, delivery speed selection either by pushbutton or nozzle selection, electronic
    or electromechanical totalizers, preset, keypad, pushbutton options, slave displays and/or master-satellite
    operation, additional displays with alternative number of display digits and display size (minimum
    6 digits money and volume, 4 digits unit price, and minimum height 25 mm).
