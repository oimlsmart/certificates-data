components:
- role: combined pump and gas elimination device
  type_designations:
  - Wayne Compact Pumping Unit
  - CPU
  alternatives:
  characteristics:
    description: >-
      Combined pump and gas eliminator device, known from SP OIML Test report 99V21784. May be replaced
      by a submersible remote pumping unit; the submerged pump may serve several dispensers. The gas elimination
      device may only be omitted if the measuring system is constructed and installed so that during normal
      operation, neither air intake nor gas release will occur in the liquid upstream of the meter.
- role: measurement transducer for gasoline
  type_designations:
