certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  description: >-
    Fuel Dispenser for Motor Vehicles, model "Quantium XXXX", with one "EPZ", "TQP-RS" or "TK80" gas elimination
    device and one "TQM" measurement transducer and one "TQC" calculating/indicating device. Comprising
    one or more measuring systems in the same housing; when more than one measuring system in one housing
    the "TQC" calculating/indicating device may be a common part of the measuring systems. One Tokheim
    combined pump and gas eliminator can be connected with two measurement transducers. A Qmax of 80 L/min
    can be reached by connecting two gas separators and two measurement transducers in parallel with delivery
    via one hose with nozzle. For multi-product dispensers it is only possible to deliver one product
    at the same time on one side of the dispenser. Conformity also attested with OIML R118, Edition 1995.
