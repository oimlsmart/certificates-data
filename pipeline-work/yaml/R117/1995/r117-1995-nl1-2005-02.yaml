certified_type:
  category: Fuel dispenser
  type_designations:
  - QUANTIUM-xxxT
  module_designation:
  description: >-
    Fuel Dispensers for Motor Vehicles, model QUANTIUM-xxxT (with EPZ gas elimination device). Comprises
    one or more systems in the same housing with one common calculator and indicating device, brand Tokheim,
    model World Wide Calculator (WWC). Each system consists of a Tokheim EPZ combined pump and gas eliminator
    device, a Tokheim SM80 volume sensor, a Tokheim MP-T1 pulser and a measuring part for oil (optional).
    If the dispenser is equipped with a measuring part for oil, the oil injection system is directly driven
    by the outgoing shaft of the measurement transducer.
