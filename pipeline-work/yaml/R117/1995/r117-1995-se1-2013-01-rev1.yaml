components:
- role: electronic_module
  type_designations:
  - iGEM
  characteristics:
    description: >-
      Electronic subsystem consisting mainly of calculator, indicating device and keyboard with preset;
      able to serve up to two customers at a time
    max_motors: 6
    max_pulse_transmitters: 6
    max_nozzles: 12
    max_solenoid_valves: 14
    max_customers_served_simultaneously: 2
- role: measurement_transducer
  type_designations:
  - iMeter
  - iMeter2
  - iMeter DM2-X UREA
  - Xflo
  alternatives: OR
  characteristics:
    sub_assemblies:
    - volume sensor (single equipped side A, single equipped side B or duplex)
    - pulse transmitter
- role: pump_and_air_separator
  type_designations:
  - CPU (Compact Pumping Unit)
  characteristics:
    includes:
    - air separator
    - motor
    - non-return valve
    max_flow_rate_per_air_separator:
      value: 90
      unit_symbol: l/min
- role: regulating_function
  characteristics:
    includes:
    - solenoid valves for flow rate regulation, blending and on/off
- role: delivery_function
  characteristics:
    includes:
    - hoses
    - nozzles
    - nozzle switch
    - satellite function
- role: central_pump
  characteristics:
    description: >-
      Optional central pump (additional 'R'): an external (central) pump is used instead of an internal
      pump; delivers air-free liquid according to OIML R117 item 5.1.3; includes security valve
- role: payment_terminal
  type_designations:
  - Wayne iXPay
  characteristics:
    optional: true
- role: media_display
  type_designations:
  - Wayne iX
  characteristics:
    optional: true
- role: printer
  characteristics:
    optional: true
    location: at the pump/dispenser
- role: vapour_recovery_system
  characteristics:
    optional: true
    includes:
    - vapour pump
    - regulating proportional valves
    - electronic board connected to the iGEM CPU board
    optional_monitoring_system: vapour meter and belonging intrinsic safe barrier
matrix_tables:
- name: Product designation code legend
  description: >-
    Sample product designation code: X(XX/XXX-XX//////X — fields in order: Design, Orientation, # Hoses/Nozzle
    positions per side, Style, Basic technical features, # Grades in, # Hydraulic positions, # Grades
    out, Hydraulic cabinet module
  columns:
  - design
  - orientation
  - hoses_nozzle_positions_per_side
  - style
  - basic_technical_features
  - grades_in
  - hydraulic_positions
  - grades_out
  - hydraulic_cabinet_module
  rows:
  - design: W = Wide; N = Narrow; H = High Hose; L = Low Hose
    orientation: ID = Island Dual Sided UI; IS = Island Single Sided UI; LM = Lane Mirrored; LU = Lane
      UnMirrored
    hoses_nozzle_positions_per_side: >-
      1 digit = symmetric (same number, solution and flows on both sides A and B); 2 digits = asymmetric
      (different number, solutions or flows on side A and B; 1st digit = side A, 2nd digit = side B)
    style: C = C-style; H = H-style; S = Small style
    basic_technical_features: >-
      L = LPG; M = Media; P = Payment; R = Remote; S = Suction; Y = Master (Satellite); Z = SAT (Satellite)
    grades_in: 1-5
    hydraulic_positions: 0-5
    grades_out: 1-8 (if blender, count up +1 per each blending possibility between 2 grades)
    hydraulic_cabinet_module: 'T = ATC; # = number of'
  footnotes: []
additional_recommendations:
- id: R118
  edition: 1995
