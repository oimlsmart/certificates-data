certified_type:
  category: Fuel dispenser
  type_designations:
  - Wayne Helix 1000
  - Wayne Helix 2000
  - Wayne Helix 4000
  - Wayne Helix 5000
  - Wayne Helix 6000
  module_designation: Not applicable
  description: >-
    One or two sided fuel pumps/dispensers for motor vehicles for one or two customers per side. May be
    equipped with a built-in payment terminal (Wayne iXPay secure payment platform), preset function,
    Wayne iX Media display and a printer for receipt printing at the pump/dispenser. For DEF, heating
    is installed to keep the liquid from freezing; optionally a pump circulates liquid downstream of the
    meter through the coax hose (max volume 2.55 litre in circulation system) to avoid freezing. May be
    equipped with a vapour recovery system with vapour pump, regulating proportional valves and an electronic
    board connected to the iGEM CPU board; optionally a vapour recovery monitoring system consisting of
    a vapour meter and belonging intrinsic safe barrier. A complete measuring system consists of one or
    two electronic modules and one to six hydraulic modules in the same housing.
