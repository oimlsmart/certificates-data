certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  module_designation:
  description: >-
    Fuel Dispenser for Motor Vehicles, model Quantium XXXX, comprising one or more measuring systems in
    the same housing. Each measuring system consists of one combined pump and gas elimination device (Tokheim
    TQP-RS (EPZ with a high cover), TQP-RS (EPZ with a lower top cover) or TK80), one Tokheim TQM measurement
    transducer and one Tokheim WWC v4 calculating/indicating device. One Tokheim combined pump and gas
    eliminator can be connected with two measurement transducers, each measuring transducer being considered
    as part of a measuring system. When more than one measuring system is in one housing, the WWC v4 calculating/indicating
    device may be a common part of the measuring systems. For multi-product dispensers it is only possible
    to deliver one product at the same time on one side of the dispenser.
