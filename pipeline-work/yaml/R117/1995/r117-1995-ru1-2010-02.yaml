certified_type:
  category: Fuel dispenser
  type_designations:
  - GVR Extra Heavy Duty Pump-SPRINT Series
  module_designation: Not applicable
  description: >-
    GILBARCO VEEDER ROOT INDIA PRIVATE LIMITED (GVR) Petrol Dispensing Pump 'Sprint Series', Type Extra
    Heavy Duty, made by combining two Hydraulic Systems to get a combined output; one or more hydraulic
    systems can be housed in a Dispenser enclosure. Each hydraulic system consists of a GVR Flow Meter
    (Type A or B, mechanical/electronic calibration, with gears or without gears) and a GVR Pump and Gas
    Eliminator (Type A or Type CPU, vane/gear, other than in pressurized systems). The enclosure also
    includes: GVR Calculator (Electronic Register Assembly ERA), GVR Measuring Transducer (Pulsar Assembly,
    integrated or separate) and optional Electronics Customer Interface (Card Reader, Printer, Keypad,
    Electronic/Electro-Mechanical Totaliser, Push Buttons, RFID, Speaker, Payment Terminal, Remote Automation,
    Touch Screen, Preset), which may be present or absent based on requirement. Conformity attested with
    OIML R 117 (Edition 1995) for accuracy class 0.5 and with OIML R 118 (Edition 1995).
