  - Quantium XXXX
  module_designation:
  description: >-
    Fuel Dispenser for Motor Vehicles, comprising one or more measuring systems in the same housing. Each
    measuring system consists of one Tokheim TQP-RS (EPZ with a high cover or EPZ with a lower top cover)
    combined pump and gas elimination device, one Tokheim TQM measurement transducer and one Tokheim TMC
    calculating/indicating device. One Tokheim combined pump and gas eliminator can be connected with
    two measurement transducers; each measurement transducer is considered as a part of a measuring system.
    When more than one measuring system in one housing, the TMC calculating/indicating device may be a
    common part of the measuring systems. A Qmax of 80 L/min can be reached by connecting two gas separators
    and two measurement transducers in parallel with delivery via one hose with nozzle. For multi-product
    dispensers it is only possible to deliver one product at the same time on one side of the dispenser.
    OIML Test Reports: No. CPC-702138 for the TQM Measurement Transducer; No. CPC-702138-1 for the EPZ
    or TQP-RS gas elimination device; No. CPC-505007 for the TMC calculating/indicating device.
