  module_designation:
  description: >-
    Fuel dispenser for Motor Vehicles, model Global Century, comprising one or more hydraulic subsystems
    in the same housing, with one common electronics, iGEM, able to serve up to two customers at a time.
    The hydraulic modules included in following description may be duplicated within the same measuring
    assembly. The limiting numbers for the iGEM to handle is 4 motors, 4 pulse generators (each handling
    a single or a duplex), 8 nozzles and 10 solenoid valves. Some of the measuring assemblies can be equipped
    as dispenser variant D (central pump design) and is then designated with an additional "D", e.g. Global
    Century Duo 40/40 island D (3/G2203 D). If the model is a dispenser variant (with the additional marking
    "D") an external (central) pump is used instead of an internal pump/air separator. The external system
    must comply with OIML 117, item 5.1.3 (i.e. it shall be equipped with an arrangement that prevents
    air to come into the system).
