  description: >-
    Fuel dispenser model DPX-X comprising one or more measuring systems in the same housing. Each measuring
    system consists of one Dresser Wayne AB CPU (Compact Pumping Unit) combined pump and gas eliminator
    device, one Dresser Wayne AB measurement transducer, and one Dresser Wayne AB iGEM calculating/indicating
    device. One CPU combined pump and gas eliminator can be connected with two measurement transducers;
    each measurement transducer is considered as a part of a measuring system. When more than one measuring
    system is in one housing the iGEM calculating/indicating device may be a common part of the measuring
    systems. For multi-product dispensers it is only possible to deliver one product at the same time
    on one side of the dispenser.
  footnotes:
  - marker: "*"
    text: The gas separator of this measuring system is suitable for use with two measurement transducers.
  - marker: "**"
    text: >-
      A Qmax of 90 L/min can be reached by connecting two measurement transducers in parallel with delivery
      via one hose with nozzle. This configuration does not allow a delivery from two nozzles simultaneously
      at 130 L/min (except when the remote pump is used).
  - marker: "***"
    text: >-
      A Qmax of 90 L/min can also be reached by connecting two gas separators and two measurement transducers
      in parallel with delivery via one hose with nozzle. This configuration allows a delivery from two
      nozzles simultaneously at 90 L/min.
  - marker: "****"
    text: This configuration allows a delivery from two nozzles at 130 L/min simultaneously.
