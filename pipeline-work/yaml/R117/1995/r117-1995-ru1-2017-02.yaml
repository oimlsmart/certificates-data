certified_type:
  category: Fuel dispenser
  type_designations:
  - SNS/Space Fill System of Non-Space dispensing unit series
  module_designation:
  description: >-
    Fuel dispenser SNS/Space Fill System of Non-Space dispensing unit series — Suction type and Remote
    type. Comprising one or more systems in every enclosure (but maximum of 3 nozzles). Each sub-system
    consists of pump and gas elimination device Type I or Type II (gear type), flow meter, measuring transducer
    (magnetic pulser), display unit, control unit, hose reel, break valve, hose and nozzle. Tatsuno calculator
    electronic customer interface comprising payment card reader, printer, electronic and/or electro-mechanical/mechanical
    totaliser, push-buttons, RFID, payment terminal, remote automation IFSF provision, preset/non-preset,
    OTP for pulser validation and electronic calibration, programming/registration through OEM-supplied
    remote control unit and RS 485 communication port; these interfaces may be present or absent based
    on customer requirement.
