certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantum Q120T
  - Quantum Q220T
  - Quantum Q320T
  - Quantum Q420T
  - Quantum Q520T
  - Quantum XXXX
  module_designation:
  description: >-
    A Fuel Dispenser for Motor Vehicles, comprising one or more measuring systems in the same housing.
    Each measuring system consists of one combined pump and gas elimination device, one measurement transducer
    and one calculating/indicating device. One Tokheim combined pump and gas eliminator can be connected
    with two measurement transducers, each measuring transducer being considered as a part of a measuring
    system. When more than one measuring system is in one housing, the TMC or TMC-X calculating/indicating
    device may be a common part of the measuring systems. A Qmax of 80 L/min can be reached by connecting
    two gas separators and two measurement transducers in parallel with delivery via one hose with nozzle.
    For multi-product dispensers it is only possible to deliver one product at the same time on one side
    of the dispenser. The certificate also attests conformity with OIML R118, Edition 1995.
