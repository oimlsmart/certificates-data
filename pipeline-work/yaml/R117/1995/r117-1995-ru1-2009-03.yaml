certified_type:
  category: Fuel dispenser
  type_designations:
  - L&T Extra Heavy Duty Pump-SPRINT Series
  module_designation:
  description: >-
    Larsen & Toubro (L&T) Petrol Dispensing Pumps and Systems make Fuel Dispensing Pump "Sprint Series",
    Type - Extra Heavy Duty by combining two Hydraulic Systems to get a combined output. These can be
    one or more in a Dispenser enclosure. Each Hydraulic System consists of: (L&T) Flow Meter Types A
    or B (Mechanical/Electronic Calibration) with Gears/without Gears; and (L&T) Pump and Gas Eliminator
    Type A or Type CPU (Vane/Gear), other than in pressurized systems. These are housed in an enclosure
    which also includes one or more of the following systems: (L&T) Calculator - Electronic Register Assembly
    ERA; (L&T) Measuring Transducer (Pulsar Assembly) Integrated/Separate; and Electronics Customer Interface
    (Card Reader, Printer, Keypad, Electronic/Electro-Mechanical Totaliser etc., Push Buttons, RFID, Speaker,
    Payment Terminal, Remote Automation, Touch Screen, Preset), which may be present or absent based on
    requirement. Conformity attested with OIML R 117 (1995) for accuracy class 0.5 and OIML R 118 (1995).
