certified_type:
  category: Fuel dispenser
  type_designations:
  - Frontier
  module_designation: Not applicable
  description: >-
    Liquids other than water dispenser, designated Frontier, accuracy class 0.5. Each hydraulic circuit
    consists of one or two meters (types V, V+ with mechanical or electronic calibration options, Cglobal,
    C+global, or Ecometer) and a GPU90g or GPU140g pump and gas separator (except for use in pressurized
    (STP) systems). Up to four hydraulic circuits are housed in a single enclosure with one common Tulip
    calculator and measuring transducers of type Tulip pulser or Eltomatic ME01-04. Optional features
    and functions: communications (remote automation), electronics for payment at the dispenser, printer,
    delivery speed selection by pushbutton or nozzle selection, electronic or electromechanical totalizers,
    speakers, preset, keypad, pushbutton options, slave displays and/or master-satellite operation, additional
    displays (minimum 6 digits money and volume, 4 digits unit price, minimum digit height 25 mm).
