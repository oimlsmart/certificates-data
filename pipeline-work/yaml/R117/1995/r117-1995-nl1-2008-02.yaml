certified_type:
  category: Fuel dispenser
  type_designations:
  - Global Vision
  description: >-
    Fuel dispensers for motor vehicles, model "Global Vision", with a Qmax of 40, 70, 90 or 130 L/min;
    in case of blending the Qmax is 40 L/min. Comprising one or more measuring systems in the same housing;
    each measuring system consists of one Dresser Wayne AB "CPU" (Compact Pumping Unit) combined pump
    and gas eliminator device, one Dresser Wayne AB "iMeter" or "XFlo" measurement transducer and one
    Dresser Wayne AB "iGEM" calculating/indicating device. One CPU combined pump and gas eliminator can
    be connected with two measurement transducers; each measurement transducer is considered as part of
    a measuring system. When more than one measuring system is in one housing, the iGEM calculating/indicating
    device may be a common part of the measuring systems. For multi-product dispensers it is only possible
    to deliver one product at the same time on one side of the dispenser. The components of the "Global
    Vision" dispenser are exactly the same as fitted in the "Global Vista" dispenser (OIML Certificate
    of Conformity No. R117/1995-NL1-05-04, dated 5 June 2007), only the housing is different. Conformity
    is attested with OIML R117 (Edition 1995) and OIML R118 (Edition 1995) for accuracy class 0.5.
