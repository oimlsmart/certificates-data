certified_type:
  category: Fuel dispenser
  type_designations:
  - EURO 1000 VI R
  module_designation: Not applicable
  description: >-
    Fuel dispenser for motor vehicles consisting of one Gas Elimination Device (Petrotec type RTF), one
    Measurement Transducer (Petrotec or Stork, type PTF) and one Electronic Calculator/Indicating device
    (Petrotec type CEM 01 or CEM 03). Optional change-up of the flowrate up to 80 L/min (high speed) or
    130 L/min (ultra high speed) by pushing a button; combinations of the listed flowrates are possible.
