certified_type:
  category: Fuel dispenser
  type_designations:
  - V-line 899x.xxx
  - V-line 46xx.xxx
  - V-line 47xx.xxx
  module_designation:
  description: >-
    The V-line 899x.xxx, V-line 46xx.xxx and V-line 47xx.xxx fuel dispensers for motor vehicles consist
    of a P64x.50 or P64x.100 pumping unit with gas elimination device, M403.25P, M403.25EP, M403.32P or
    M403.32EP meter, ADPxxx/T electronic calculator with adjustment device, ME 01-05 measuring transducer
    (pulser), electromagnetic valve and housing with delivery nozzle. A sight glass is installed for Qmax
    > 60 L/min. The fuel dispensers can be equipped with a vapour recovery system; there is a version
    for installation in centrally pumped systems and a satellite delivery point can be present. The ADPxxx/T
    electronic calculator has an ATC conversion function converting measurement data to reference conditions
    (volume at 15 °C) and requires a Pt100 temperature transducer of class B minimum according to EN IEC
    751.
