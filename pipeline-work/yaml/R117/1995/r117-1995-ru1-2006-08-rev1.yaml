certified_type:
  category: Fuel dispenser
  type_designations:
  - SWADES I
  - SWADES II
  module_designation: Not applicable
  description: >-
    Fuel Dispensers SWADES I AND SWADES II SERIES comprising of one or two systems in every enclosure.
    Each sub-system consists of: four-cylinder positive displacement flow meter types EXSD-1012 or PTF
    25-80; pump and gas eliminator RTF or EXSD-1011; calculator - Electronic Register Assembly ERA: SERA
    Series; measuring transducer (pulsar assembly) EXSD-8001 or FBCGQ-3; electronics customer interface
    (Card Reader, Printer, Keypad, Electronic/Electro-Mechanical Totaliser, Push Buttons, RFID, Speaker,
    Payment Terminal, Remote Automation, Preset) which may be present or absent based on requirement.
