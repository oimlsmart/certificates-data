  module_designation:
  description: >-
    MIDCO make fuel dispensing pump MEB SERIES / MPD SERIES / MMS SERIES / MIDCO SureFill SERIES, comprising
    of one or more systems in every enclosure; each sub-system consists of all or some of the following:
    a MIDCO flow meter; a MIDCO oil metering pump with Oil% selector; a MIDCO combined pump and gas eliminator
    or pump with integrated gas eliminator (other than in pressurized system); a MIDCO calculator (combined
    assembly of ERA and keypad assembly) and printer with/without payment terminal / card readers; a MIDCO
    measuring transducer (pulsar assembly), integrated or combined. Conformity attested with OIML R117
    (1995) for accuracy class 0.5 and with OIML R118 (1995).
