certified_type:
  category: Fuel dispenser
  type_designations:
  - 397G
  module_designation: Not applicable
  description: >-
    Liquids other than water dispenser, designation 397G. Mechanical environment class M2, electromagnetic
    environment class E1. Each hydraulic circuit consists of one or two meters (types V, V+, C, C+ or
    Ecometer) and a GPU90 or GPU140 pump and gas separator, except for use in pressurized (STP) systems.
    One or two hydraulic circuits are housed in a single enclosure with one common Sandpiper 2 (E101)
    calculator and measuring transducers of type E101 pulser or Eltomatic ME01-04. Optional features and
    functions: communications (remote automation), vapour recovery systems, temperature compensation,
    delivery speed selection either by pushbutton or nozzle selection, electronic or electromechanical
    totalizers, preset/keypad/pushbutton options, slave displays and/or master-satellite operation, additional
    displays with alternative number of display digits and display size (minimum 6 digits money and volume,
    4 digits unit price, minimum height 25 mm).
