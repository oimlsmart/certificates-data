components:
- role: combined pump and gas eliminator device
  type_designations:
  - Dresser Wayne AB "CPU"
  characteristics:
    description: CPU = Compact Pumping Unit; serves as gas elimination device (gas separator)
- role: measurement transducer
  type_designations:
  - Dresser Wayne AB "iMeter"
  - Dresser Wayne AB "Xflo"
  alternatives: OR
  characteristics:
    description: One CPU combined pump and gas eliminator can be connected with two measurement transducers
- role: calculating / indicating device
  type_designations:
  - Dresser Wayne AB "iGEM"
  characteristics:
    description: May be a common part of the measuring systems when more than one measuring system is
      in one housing
footnotes:
- marker: "*"
  text: The gas separator of this measuring system is suitable for use with two measurement transducers.
- marker: "**"
  text: >-
    A Qmax of 90 L/min can be reached by connecting two measurement transducers in parallel with delivery
    via one hose with nozzle. This configuration does not allow a delivery from two nozzles simultaneously
    at 130 L/min (except when the remote pump is used).
- marker: "***"
  text: >-
    A Qmax of 90 L/min can be reached by connecting two gas separators and two measurement transducers
    in parallel with delivery via one hose with nozzle. This configuration allows a delivery from two
    nozzles simultaneously at 90 L/min.
- marker: "****"
  text: This configuration allows a delivery from two nozzles simultaneously at 130 L/min.
