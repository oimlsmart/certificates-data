certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  module_designation:
  description: >-
    A Fuel Dispenser for Motor Vehicles. Comprising one or more measuring systems in the same housing;
    each measuring system consists of one Tokheim 'TQP-RS' (EPZ) combined pump and gas elimination device,
    one Tokheim 'TQM' measurement transducer and one Tokheim 'TMC' or 'TQC-China' calculating/indicating
    device. When more than one measuring system in one housing, the 'TMC' or 'TQC-China' calculating/indicating
    device may be a common part of the measuring systems. For multi-product dispensers it is only possible
    to deliver one product at the same time on one side of the dispenser. Conformity attested with OIML
    R117 Edition 1995 (accuracy class 0.5) and OIML R118 Edition 1995.
