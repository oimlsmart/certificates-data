certified_type:
  category: Fuel dispenser
  type_designations:
  - Sprint
  module_designation:
  description: >-
    Liquids-other-than-water dispenser, designation Sprint. Each hydraulic circuit consists of one or
    two meters (types V, V+ with mechanical or electronic calibration options, or type C+) and a CPU or
    GPU90 pump and gas separator (except for use in pressurized (STP) systems). Two hydraulic circuits
    may be combined for dispensing at the highest flowrate. Up to four hydraulic circuits are housed in
    a single enclosure with one common calculator (Tulip, 4GDE or Sandpiper) and measuring transducers
    (Tulip pulser, Type 4GDE or Sandpiper). Optional features and functions: communications (remote automation);
    electronics for payment at the dispenser, printer; delivery speed selection either by pushbutton or
    nozzle selection; electronic or electromechanical totalizers; speakers, preset, keypad, pushbutton
    options; slave displays and/or master-satellite operation; additional displays, number of display
    digits and display size.
