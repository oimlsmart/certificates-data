  - SK700-II
  - SK700-II/Horizon
  - SK700-II/IOD
  - SK700-II/Frontier
  - Endura
  module_designation: Not applicable
  description: >-
    Liquids other than water dispenser, SK700-II family including SK700-II, SK700-II/Horizon, SK700-II/IOD,
    SK700-II/Frontier and Endura models. Optional features and functions: communications (remote automation);
    vapour recovery systems; temperature compensation; delivery speed selection either by pushbutton or
    nozzle selection; electronic or electromechanical totalizers; preset, keypad, pushbutton options;
    slave displays and/or master-satellite operation; additional displays, alternative number of display
    digits and display size (minimum 6 digits money and volume, 4 digits unit price, and minimum height
    25 mm).
