certified_type:
  category: Fuel dispenser
  type_designations:
  - CFS Fuel Star Series
  description: >-
    Fuel dispenser for motor vehicles. The CFS Fuel Star Series fuel dispensers consist of a FSU pumping
    unit with gas elimination device, FMU measuring transducer, CPS electronic calculator, electromagnetic
    valve, sight glass and hose with delivery nozzle. There is a version for installation in a centrally
    pumped system; a satellite delivery point can be present.
