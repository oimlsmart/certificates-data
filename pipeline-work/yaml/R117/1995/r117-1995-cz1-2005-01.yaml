certified_type:
  category: Fuel dispenser
  type_designations:
  - SHARK BMP 5xx.S
  - SHARK BMP 2xxx.S
  module_designation:
  description: >-
    Fuel dispenser for motor vehicles. The SHARK BMP 5xx.S, 2xxx.S fuel dispensers consist of a FP-1001
    pumping unit with gas elimination device, FM-1007 meter with adjustment device, PDE electronic calculator
    with adjustment device, EK-1025 measuring transducer (pulser), electromagnetic valve, sight glass
    and hose with delivery nozzle. These fuel dispensers can be equipped with a vapour recovery system.
    There is a version available for installation of the dispenser in a centrally pumped system. Satellite
    delivery point can be installed on request as well.
