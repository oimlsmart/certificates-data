certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantum XXXX
  - Quantium XXXX
  module_designation:
  description: >-
    A Fuel Dispenser for Motor Vehicles comprising one or more measuring systems in the same housing.
    Each measuring system consists of one Tokheim 'TQP-RS' (EPZ) combined pump and gas elimination device,
    one Tokheim 'TQM' measurement transducer and one Tokheim 'TMC' calculating/indicating device. When
    more than one measuring system is in one housing, the 'TMC' calculating/indicating device may be a
    common part of the measuring systems. A Qmax of 80 L/min can be reached by connecting two gas separators
    and two measurement transducers in parallel with delivery via one hose with nozzle. For multi-product
    dispensers it is only possible to deliver one product at the same time on one side of the dispenser.
