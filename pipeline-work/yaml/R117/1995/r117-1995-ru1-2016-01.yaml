certified_type:
  category: Fuel dispenser
  type_designations:
  - Sure-Fill
  - AccueFill
  description: >-
    MIDCO Fuel Dispensing Units, Sure-Fill/AccueFill Series, Suction type and Remote type. Comprising
    one or more systems in every enclosure; each subsystem consists of: A. Hydraulics - a MIDCO flow meter
    (one each for the 50 and 80 flow rate, two for the 140 flow rate) with integrated and combined optical/magnetic
    pulsar (openable and non-openable with open-close detection), a MIDCO oil metering pump, a MIDCO combined
    pump and gas eliminator (other than in pressurized system), break valve, hose, nozzle and flow indicator.
    B. Electronics - a MIDCO calculator (Electronic Register Assembly, ERA) and a MIDCO electronic customer
    interface (payment card reader, printer, keypad, combined or separate display, electronic or electro-mechanical
    totalizer, density and oil % readout, push buttons, RFID, speaker, payment terminal, automation, remote
    automation enable/disable through OTP, touch screen, preset/non-preset, IFSF provision, advertisement
    or remote display interfacing provision, provision of temperature/pressure probes, delivery speed,
    OTP for pulsar validation and process of electronic calibration); these interfaces may be present
    or absent based on customer requirement.
