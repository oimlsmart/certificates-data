certified_type:
  category: Fuel dispenser
  type_designations:
  - Quantium XXXX
  description: >-
    Fuel dispenser for motor vehicles, comprising one or more measuring systems in the same housing. Each
    measuring system consists of a Tokheim combined pump and gas elimination device, a Tokheim 'TQM' measurement
    transducer and a Tokheim 'TQC' calculating/indicating device. A Qmax of 80 L/min can be reached by
    connecting two gas separators and two measurement transducers in parallel with delivery via one hose
    with nozzle. For multi-product dispensers it is only possible to deliver one product at the same time
    on one side of the dispenser.
