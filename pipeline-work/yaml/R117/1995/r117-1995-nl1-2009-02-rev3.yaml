    Extension with the 'TK 80' Gas separator, based on NMO Evaluation Report number 'P00882 TK 80 Gas
    separator' and OIML R117 Test Report number SN 1221.
- revision: '3'
  date: '2013-06-25'
  changes: >-
    Extension with the 'TQP-HS (PAS V3)' Gas Elimination Device, based on OIML Evaluation report No. R117/1995-NL1-01.04.
    to make it possible that the Qmax = 130 L/min and 160 L/min
components:
- role: combined pump and gas elimination device
  type_designations:
  - EPZ
  - TQP-RS
  - TK80
  - TQP-HS (PAS V3)
  alternatives: OR
  characteristics:
    note: >-
      'EPZ' is the 'TQP-RS' with a high cover; the 'TQP-RS' is also available with a lower top cover;
      the 'TQP-HS (PAS V3)' is used in the Qmax = 130 L/min and 160 L/min configurations
- role: measurement transducer
  type_designations:
  - TQM
  alternatives:
  characteristics:
    note: >-
      One Tokheim combined pump and gas eliminator can be connected with two measurement transducers;
      each measurement transducer is considered as a part of a measuring system
- role: calculating/indicating device
  type_designations:
  - TQC
  alternatives:
  characteristics:
    note: >-
      When more than one measuring system is in one housing, the 'TQC' calculating/indicating device may
      be a common part of the measuring systems
footnotes:
