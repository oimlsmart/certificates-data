certified_type:
  category: Fuel dispenser
  type_designations:
  - Tatsuno Fuel Dispensing Units Sunny XE Series
  module_designation: Not applicable
  description: >-
    Tatsuno Fuel Dispensing Units Sunny XE Series, Suction type and Remote type. Comprising of one or
    more system in every enclosure; each subsystem consists of rotary lobe meters including pulser; pump
    and gas eliminator Type I or Type II (gear type) other than in pressurized systems; break valve, hose,
    nozzle; calculator - Electronic Register Assembly (ERA); electronic customer interface (card reader,
    printer, keypad, electronic/electro-mechanical totaliser, push buttons, RFID, speaker, payment terminal,
    remote automation, touch screen, preset, LAN card, temperature sensor card, electronic access control
    lock, fuel indication lamp). These interfaces may be present/absent based on customer requirement.
