certified_type:
  category: Fuel dispenser
  type_designations:
  - Wayne Helix 2000
  - Wayne Helix 4000
  - Wayne Helix 5000
  - Wayne Helix 6000
  module_designation:
  description: >-
    One or two sided fuel pumps/dispensers for motor vehicles for one customer per side. Optionally equipped
    with a built-in payment terminal (Wayne iXPay secure payment platform) for cards, a preset function,
    and a display (Wayne iX Media platform) at the same position as the payment terminal. May be equipped
    with a vapour recovery system with vapour pump, regulating proportional valves and an electronic board
    (e.g. VR Driver board WM029182-0001) connected to the iGEM CPU board; optionally a vapour recovery
    monitoring system consisting of a vapour meter and belonging intrinsic safe barrier. A complete measuring
    system consists of one electronic module (iGEM) and one to four hydraulic modules in the same housing.
    If one pump and air separator serves more than one nozzle simultaneously, the total maximum flow rate
    through these nozzles is limited by the air separator (90 l/min per air separator) and the volume
    sensor.
