certified_type:
  category: Fuel dispenser
  type_designations:
  - SK700
  description: >-
    Fuel Dispenser for Motor Vehicles, model SK700, comprising one or more measuring systems in the same
    housing with one common calculator and indicating device (model Sandpiper, manufacturer Gilbarco GmbH
    & Co. KG). Each configuration consists of a Blackmer GD-090 or GD-140, or a Gilbarco GPU-90 combined
    pump and gas elimination device, one or two measurement transducers (type ECO-meter or C+) and one
    or two matching pulsers (ME 01-02 for ECO-meter; 94Q032 or SK700 for C+). Optionally the combined
    pump and gas elimination device is replaced by a submerge pump (Red Jacket Petroleum Systems or FE-Petro),
    which can serve multiple measuring systems. Two measuring systems (two dispensers) can use one common
    pump and one gas elimination device, in which case there are two measurement transducers both delivering
    the same fuel to two delivery points that can be used at the same time. In the high flow configuration
    the dispenser contains two measurement transducers in parallel and fuel is dispensed by one nozzle;
    optionally one (with or without high speed switch) or more extra delivery points with corresponding
    valves can be used but not simultaneously. If one measurement transducer is connected to more than
    one delivery point, simultaneous delivery of liquid with these points is not possible.
