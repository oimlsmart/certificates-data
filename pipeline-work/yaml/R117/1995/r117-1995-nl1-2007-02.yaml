components:
- role: combined pump and gas eliminator device
  type_designations:
  - CPU (Compact Pumping Unit)
  characteristics:
    manufacturer: Dresser Wayne AB
    also_referred_to_as: CPU Gas Elimination Device
- role: measurement transducer
  type_designations: []
  characteristics:
    manufacturer: Dresser Wayne AB
    note: >-
      One CPU combined pump and gas eliminator can be connected with two measurement transducers; each
      measurement transducer is considered as a part of a measuring system
- role: calculating/indicating device
  type_designations:
  - iGEM
  characteristics:
    manufacturer: Dresser Wayne AB
    note: May be a common part of the measuring systems when more than one measuring system is in one
      housing
footnotes:
- marker: "*"
  text: The gas separator of this measuring system is suitable for use with two measurement transducers
- marker: "**"
  text: >-
    A Qmax of 90 L/min can be reached by connecting two measurement transducers in parallel with delivery
    via one hose with nozzle. This configuration does not allow a delivery from two nozzles simultaneously
    at 130 L/min (except when the remote pump is used).
- marker: "***"
  text: >-
    A Qmax of 90 L/min can also be reached by connecting two gas separators and two measurement transducers
    in parallel with delivery via one hose with nozzle. This configuration allows a delivery from two
    nozzles simultaneously at 90 L/min.
- marker: "****"
  text: This configuration allows a delivery from two nozzles at 130 L/min simultaneously.
