certified_type:
  category: Measuring system
  type_designations:
  - TCS 3000
  - TCS 3000EX
  module_designation: N/A
  description: >-
    An electronic calculating and indicating device intended to be used as a part of an interruptible dynamic measuring systems
    for liquids other than water. TCS 3000 can calculate the product volume at reference conditions using the measured volume
    at measured conditions, measured product temperature, the manually input density at reference conditions and the conversion
    method. Both the manually input density and the conversion method are protected by a seal. TCS 3000EX is the variation
    in explosion proof enclosure. It shares the same main board as the TCS 3000, however it has distinct features from TCS
    3000 in the interface board, keyboard barrier board and power supply stabilization board.
