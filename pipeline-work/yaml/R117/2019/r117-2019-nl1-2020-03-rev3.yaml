matrix_tables:
- name: Flow characteristics of the configurations
  columns:
  - configuration
  - flow_rate_range
  - remarks
  rows:
  - configuration:
      value: 1x gas separator*1x meter sensor,type C+,V or V+
    flow_rate_range:
      value: 1.6-40L/min
    remarks:
      value: Intended for the measurement of hydrocarbon oils with viscosity range 0.4-1.0mPa.s.
  - configuration:
      value: 1x gas separator*1x meter sensor,type C+,V or V+
    flow_rate_range:
      value: 2.0-80L/min
    remarks:
      value: >-
        Intended for the measurement of hydrocarbon oils with viscosity range 1.1-8.0mPa.s. Optionally a feature to allow
        Qmax to be limited to 40L/min
  - configuration:
      value: 1x gas separator*2x meter sensors,type C+,V or V+,one per dispenser side.
    flow_rate_range:
      value: 1.6-40L/min
    remarks:
      value: >-
        Intended for the measurement of hydrocarbon oils with viscosity range 0.4-1.0mPa.s. The gas separator of this measuring
        system is suitable for use with two-meter sensors. Each meter sensor is considered as part of an individual measuring
        system. Flowrate reduces to 40L/min with both meter sensors operating Optionally a feature to allow Qmax to be limited
        to 40L/min with a single meter sensor operating.
  - configuration:
      value: 1x gas separator*2x meter sensors,type C+,V or V+,one per dispenser side
    flow_rate_range:
      value: 2.0-80L/min
    remarks:
      value: >-
        Intended for the measurement of hydrocarbon oils with viscosity range 1.1-8.0mPa.s. The gas separator of this measuring
        system is suitable for use with two-meter sensors. Each meter sensor is considered as part of an individual measuring
        system. Flowrate reduces to 40L/min with both meter sensors operating.
  - configuration:
      value: 2x gas separators*2x meter sensors,type C+,V or V+.
    flow_rate_range:
      value: 2.0-130L/min
    remarks:
      value: >-
        Intended for the measurement of hydrocarbon oils with viscosity range 1.1-8.0mPa.s. A Qmax of 130L/min is reached
        by connecting two gas separators and two-meter sensors in parallel with delivery through a single transfer point Optionally
        a feature to allow Qmax to be limited to 80L/min Optionally a feature to allow one of the gas separators and one of
        the meter sensors to operate as the configuration described above.
  footnotes: []
