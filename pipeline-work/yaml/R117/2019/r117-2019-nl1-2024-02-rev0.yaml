- marker: 3)
  text: >-
    If ControlEdge RTU controller loads and runs a calculation project file in the ControlEdge Builder software, The unique
    "Code version number" of the project file will be made. This code version number is recalculated when the project is built,
    or when there is an intentional or accidental parameter change. Changes on the code version number are logged in the audit
    trail.
