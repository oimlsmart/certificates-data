certified_type:
  category: Fuel dispenser
  type_designations:
  - Smartline
  - Cosmic
  - MEPBLUE
  description: >-
    Fuel and AdBlue dispensers of type series Smartline, Cosmic and MEPBLUE, produced under trademarks
    MEPSAN or MITES. Versions differ only in housing appearance and have identical internal components;
    instruments may be fuel dispensers, AdBlue dispensers, or a combination of both. Applications: refuelling
    of motor vehicles, small boats and small aircraft (fuels); refilling of SCR tanks for NOx reduction
    in diesel engines (AdBlue). When no gas separator is installed, a level detection system for the minimum
    tank level and a non-return valve upstream of each measurement transducer are required.
