certified_type:
  category: Fuel dispenser
  type_designations:
  - AXON
  - Axxxxx xx
  module_designation:
  description: >-
    Fuel dispenser, manufacturers mark: Petrotec, type AXON, model types Axxxxx xx. Each measuring instrument
    consists at least of one combined pump and gas eliminator device (gas separator), one measurement
    transducer (meter), and one calculating/indicating device (calculator). The gas elimination device
    is optional in the case that either air intake or gas release will not occur in the liquid upstream
    of the meter (e.g. in case a submerged pump is used); a check valve or non-return valve is mandatory
    if the gas elimination device is not present. The same housing of the dispenser can comprise one or
    more measuring systems; when more than one measuring system is in one housing, one calculating/indicating
    device may be a common part of the measuring systems. For multi-product dispensers it is only possible
    to deliver one product at the same time on one side of the dispenser. Production location: Petrotec
    Retail Petroleum Equipment (India) Pvt. Ltd., E-109/110, GIDC Electronic Estate, Sector 26, Gandhinagar,
    Gujarat 382028.
