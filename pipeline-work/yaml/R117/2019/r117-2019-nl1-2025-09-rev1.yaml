    Intended for the measurement of low-viscosity mineral oils with a viscosity of 0.4 mPa·s – 8 mPa·s.
    For measuring systems with parallel measurement transducers or gas separators, Qmin shall not be smaller
    than any Qmin of the components, Qmax shall not exceed 160 L/min (for liquid temperature range -40
    °C / +50 °C) or 200 L/min for a viscosity range of 1.1 – 8.0 mPa·s, and measures shall be taken to
