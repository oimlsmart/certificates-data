  module_designation:
  description: >-
    The SG 01 (B-E-EC-I), SG 02 (B-E), SG 03 (H) and SG 04 (L-M) fuel dispensers are designed for measurement of liquid fuel
    volumes and are used for the refuelling of motor vehicles, small boats and small aircrafts. SG measuring system consists
    measuring transducer consisting of piston PD measurement sensor and pulse transmitter, solenoid valve, electronic calculating
    and indicating device, keypad, sight glass (optional) and hose with dispensing nozzle. The system is intended to be used
    with an external submersible pump placed at the bottom of a storage tank.
