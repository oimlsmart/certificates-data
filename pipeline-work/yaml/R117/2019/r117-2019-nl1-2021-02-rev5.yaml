- name: Table 2 Flow characteristics of the configurations
  columns:
  - Configuration fuel dispenser
  - Flow rate range
  - Remarks
  rows:
  - Configuration fuel dispenser:
      value: 1x gas separator*1x meter sensor,type C+,V or V+
    Flow rate range:
      value: 1,6-40L/min
    Remarks:
      value: Intended for the measurement of hydrocarbon oils with viscosity range 0,4-1,0mPa.s.
  - Configuration fuel dispenser:
      value: 1x gas separator*1x meter sensor,type C+,V or V+
    Flow rate range:
      value: 2,0-80L/min
    Remarks:
      value: >-
        Intended for the measurement of hydrocarbon oils with viscosity range 1,1-8,0mPa.s.Optionally a feature to allow Qmax
        to be limited to 40L/min.
  - Configuration fuel dispenser:
      value: 1x gas separator*2x meter sensors,type C+,V or V+,one per dispenser side
    Flow rate range:
      value: 1,6-40L/min
    Remarks:
      value: >-
        Intended for the measurement of hydrocarbon oils with viscosity range 0,4-1,0mPa.s.The gas separator of this measuring
        system is suitable for use with two meter sensors.Each meter sensor is considered as part of an individual measuring
        system.Flowrate reduces to 40L/min with both meter sensors operating.Optionally a feature to allow Qmax to be limited
        to 40L/min with a single meter sensor operating.
  - Configuration fuel dispenser:
      value: 1x gas separator*2x meter sensors,type C+,V or V+,one per dispenser side
    Flow rate range:
      value: 2,0-80L/min
    Remarks:
      value: >-
        Intended for the measurement of hydrocarbon oils with viscosity range 1,1-8,0mPa.s.The gas separator of this measuring
        system is suitable for use with two meter sensors.Each meter sensor is considered as part of an individual measuring
        system.Flowrate reduces to 40L/min with both meter sensors operating.
  description: Flow characteristics of the fuel dispenser configurations
  footnotes: []
