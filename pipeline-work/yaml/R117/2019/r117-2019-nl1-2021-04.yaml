certified_type:
  category: gas separator
  type_designations:
  - RTF
  module_designation:
  description: >-
    A gas separator intended to be used as a part of a fuel dispenser. The gas separator is a mechanical gas separator based
    on the centrifugal principle and positioned after the gear pump in series with the bypass valve. As a result of the lateral
    injection of the liquid into a pipe the liquid will flow towards the exit of this pipe in a spiral movement. The heavier
    liquid is pressed to the exterior of the pipe and any present air or vapour bubbles will be collected in the centre. The
    air discharge pipe placed in the centre conducts the flow through a device called vortex valves, which is an internal
    leakage when there is no air. The liquid without air leaves the centrifugal vent by an opening on the outside of the pipe
    and flows into the high-pressure chamber.
