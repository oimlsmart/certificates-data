certified_type:
  category: Fuel dispenser
  type_designations:
  - ENCORE
  module_designation: Not applicable
  description: >-
    Fuel dispenser in which each measuring system consists at least of a combined pump and gas eliminator
    device (gas separator), one or more meter sensors, and a calculating/indicating device (calculator).
    The same housing can comprise one or more measuring systems sharing a common calculating/indicating
    device; multi-product dispensers can deliver only one product at a time per dispenser side.
