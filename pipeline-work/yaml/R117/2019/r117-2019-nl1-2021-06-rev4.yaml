- marker: "*"
  text: >-
    If no gas separator is used on the measurement system, provision shall be taken to prevent gas passing
    through the meter sensor.
matrix_tables:
- name: Flow characteristics of the configurations
  columns:
  - configuration
  - min_flow_rate
  - max_flow_rate
  - viscosity_range
  - remarks
  column_units:
  -
  - L/min
  - L/min
  - mPa·s
  -
  description: >-
    The maximum flow rate once installed may be limited but shall be greater than 10 times the minimum
    flow rate. Each configuration consists of 1 x gas separator plus one or two meter sensors type C+,
    V or V+.
  rows:
  - configuration: 1 x gas separator; 1 x meter sensor type C+, V or V+
    min_flow_rate: 1.6
    max_flow_rate: 40
    viscosity_range:
      min: 0.4
      max: 1.0
    remarks: Intended for the measurement of hydrocarbon oils with viscosity range 0.4 - 1.0 mPa·s.
  - configuration: 1 x gas separator; 1 x meter sensor type C+, V or V+
    min_flow_rate: 2.0
    max_flow_rate: 80
    viscosity_range:
      min: 1.1
      max: 8.0
    remarks: >-
      Intended for the measurement of hydrocarbon oils with viscosity range 1.1 - 8.0 mPa·s. Optionally
      a feature to allow Qmax to be limited to 40 L/min.
  - configuration: 1 x gas separator; 2 x meter sensors type C+, V or V+, one per dispenser side
    min_flow_rate: 1.6
    max_flow_rate: 40
    viscosity_range:
      min: 0.4
      max: 1.0
    remarks: >-
      The gas separator is suitable for use with two meter sensors; each meter sensor is considered part
      of an individual measuring system. Flow rate reduces to 40 L/min with both meter sensors operating.
      Optionally a feature to allow Qmax to be limited to 40 L/min with a single meter sensor operating.
  - configuration: 1 x gas separator; 2 x meter sensors type C+, V or V+, one per dispenser side
    min_flow_rate: 2.0
    max_flow_rate: 80
    viscosity_range:
      min: 1.1
      max: 8.0
    remarks: >-
      The gas separator is suitable for use with two meter sensors; each meter sensor is considered part
      of an individual measuring system. Flow rate reduces to 40 L/min with both meter sensors operating.
  footnotes:
  - >-
    * If no gas separator is used on the measurement system, provision shall be taken to prevent gas passing
    through the meter sensor.
