certified_type:
  category: Continuous totalising automatic weighing instrument (belt weigher)
  type_designations:
  - Milltronics MSI
  - Milltronics MMI
  module_designation:
  description: >-
    Automatic continuous totaliser (belt weigher) designed to weigh large quantities of loose material
    from bulk to bulk. Comprises a weighing platform type MSI or MMI, a speed sensor, and an integrator
    type BW 500. The MMI weighing platform comprises two or three MSI weighing platforms installed in
    succession. Provided devices: main totalising device, semi-automatic zero-setting device, indication
    of the flow rate (Q), indication of the belt speed, indication of the totalised weight, error messages
    and alarms. Available interfaces: load cell connection (hardwired), speed sensor, RS232, RS485, digital
    I/O, Modbus connection.
