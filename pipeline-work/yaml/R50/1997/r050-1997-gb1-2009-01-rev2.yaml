certified_type:
  category: Automatic continuous totaliser (beltweigher)
  type_designations:
  - Milltronics MSI
  - Milltronics MMI
  module_designation: Not applicable
  description: >-
    Automatic continuous totaliser (beltweigher), designed to weigh large quantities of loose material
    from bulk to bulk. Comprises a weighing platform type MSI or MMI, a speed sensor, and an integrator
    type BW 500. The MMI weighing platform comprises two or three MSI weighing platforms installed in
    succession. Load cells are single-ended beam (bending) G4-TBSP models manufactured by Group Four Transducers,
    as described in OIML Certificate of Conformity R60/2000-GB-01.02.
