certified_type:
  category: Automatic continuous totaliser (belt weigher)
  type_designations:
  - Milltronics MSI
  - Milltronics MMI
  module_designation:
  description: >-
    Automatic continuous totaliser (belt weigher) designed to weigh large quantities of loose material
    from bulk to bulk. Comprises a weighing platform type MSI or MMI, a speed sensor, and an integrator
    type BW 500. The MMI weighing platform comprises two or three MSI weighing platforms installed in
    succession. Load cells are single-ended beam (bending) G4-TBSP models manufactured by Group Four Transducers
    as described in OIML Certificate of Conformity R60/2000-GB-01.02. Provided devices: main totalising
    device, semi-automatic zero-setting device, indication of flow rate (Q), indication of belt speed,
    indication of totalised weight, error messages and alarms. Interfaces: load cell connection (hardwired),
    speed sensor, RS232, RS485, digital I/O, Modbus connection.
