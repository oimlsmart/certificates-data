certified_type:
  category: Continuous totalizing automatic weighing instrument
  type_designations:
  - M2400-B04-FB02-xxx
  module_designation: Continuous totalizing automatic weighing instrument
  description: >-
    The M2400-B04-FB02-xxx according to OIML R50:2014 is a continuous totalizing automatic weighing instrument. It consists
    of a weighing controller designated M2400-B04 with two analog load cell inputs and a FB02 belt unit with a rigid plastic
    link belt. The center part of FB02 is the load receptor consisting of two plates fixed in the outer ends and resting end
    to end in the centre on two individual measured load cells, one in each side of the belt, using wire-rope hangers. The
    belt width is 922mm (FB02-900). The weighing instruments comes also in a version with 615 mm belt width (FB02-600). The
    belt speed is measured by a 12 tooth sprocket wheel and a sensor, mounted to the end of the motor drive axle. The belt
    is pulled over the weighbridge. The software of the tested M2400-B04 has firmware version 1.03-01, checksum 3FBCEF7D,
    Weighing module version 100 and application version "B4000 v1.06".
