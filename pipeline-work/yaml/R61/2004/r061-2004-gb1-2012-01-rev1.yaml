components:
- role: feeding_device
  type_designations:
  - Gravity Feeder
  - Gravity Feeder with Agitator
  - Screw Feeder
  - Belt Feeder
  - Vibratory Feeder
  - Cone Feeder
  alternatives: OR
  characteristics:
    note: Any other type of feeding device may also be used.
- role: weighing_unit
  type_designations: []
  alternatives:
  characteristics:
    load_cells: >-
      Any compatible load cell(s) may be used provided a respective OIML R60 Certificate of Conformity
      exists, containing the load cell types and data required for the manufacturer's declaration of compatibility
      of modules. A load cell marked NH is allowed only if humidity testing to R76 has been conducted.
      Load cell transmission must conform to a standard type.
    air_cylinders: >-
      Double acting type used with directional control valves having solenoid-pilot actuators and spring
      or pilot air return actuators.
- role: controller
  type_designations:
  - SpeedAC NXT
  alternatives:
  characteristics:
    housing_material: stainless steel plate
    mount_configurations: universal, wall, panel or desk-top
    display: backlit LCD panel
    keyboard: twenty-seven key keyboard, five programmable software keys
    expansion_board: two-card expansion board (six-card on the wall mount model)
    optional_cards:
    - Analogue output card
    - Dual channel serial expansion card
    - 24 channel digital I/O card
    - Profibus DP card
