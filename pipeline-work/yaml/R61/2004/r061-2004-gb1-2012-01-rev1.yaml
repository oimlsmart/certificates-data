certified_type:
  category: Automatic gravimetric filling instrument
  type_designations:
  - SpeedAC NXT
  module_designation:
  description: >-
    Automatic gravimetric filling instrument for dispensing predetermined loads of powdered or granular
    materials, consisting of a feeding device, a weighing unit, and a SpeedAC NXT controller incorporating
    a microprocessor. May be used for Gross or Net weighing. The SpeedAC NXT controller housing is fabricated
    from stainless steel plate and can be provided in a universal, wall, panel or desk-top mount configuration.
    The front panel has a backlit LCD panel and a twenty-seven key keyboard, five of which are programmable
    software keys.
