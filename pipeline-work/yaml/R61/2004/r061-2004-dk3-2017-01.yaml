certified_type:
  category: Automatic gravimetric filling instrument
  type_designations:
  - BX13
  module_designation:
  description: >-
    Weighing controller BX13 for automatic gravimetric filling instruments, single-interval, with module
    fractional factor 0.5 for the indicator. Permitted feeders: gravity feeder, screw feeder, belt feeder,
    vibratory feeder. Permitted devices: initial zero setting device; semi-automatic zero setting; zero
    tracking; automatic zero setting; semi-automatic subtractive tare; automatic subtractive tare; zero
    indicator; indication of stable equilibrium; net indicator; net/gross indication device; gravity compensation
    device; extended resolution device; target weight; coarse feeding device; fine feeding device.
