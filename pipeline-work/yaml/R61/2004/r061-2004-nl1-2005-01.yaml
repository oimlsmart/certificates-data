certified_type:
  category: Gravimetric filling instrument
  type_designations:
  - Cxx-x series
  module_designation:
  description: >-
    Automatic gravimetric filling instrument. The actual class shall be determined at initial verification.
    Maximum of 4 weighing heads. Not to be used as a selective combination weighing instrument. Per weighing
    head: 25 g <= Max <= 30 kg; n <= the number of scale intervals mentioned in the test certificates
    involved. The actual maximum filling rate shall be determined at initial verification. The time interval
    of the automatic zero-setting <= 1 hour. Temperature range +5 °C / +40 °C.
