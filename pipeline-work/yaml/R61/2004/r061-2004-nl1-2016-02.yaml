certified_type:
  category: Automatic gravimetric filling instrument
  type_designations:
  - ITx000E-............ AGFI
  - ITx000ET-............. AGFI
  - ITx000M-............. AGFI
  module_designation:
  description: >-
    Automatic gravimetric filling instruments of types ITx000E-..., ITx000ET-... and ITx000M-... AGFI
    with x = 3, 4, 6 or 8. Maximum capacity and minimum capacity specifications depend on the modules
    used; the compatibility of the modules shall be checked using R 76 (2006) annex F and the necessary
    data can be found in the applicable OIML Test Report. Other load cells may be used provided there
    is an OIML Certificate of Conformity (R 60) issued for the load cell by a Notified Body responsible
    for type examination. The reference accuracy class is Ref(0.2); the operational accuracy class X(x)
    is determined at the time of putting into use.
