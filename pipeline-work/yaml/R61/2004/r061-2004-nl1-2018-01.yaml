  module_designation:
  description: >-
    Automatic gravimetric filling instruments of types ITx000E, ITx000ET and ITx000M AGFI with x = 3,
    4, 6 or 8. Maximum capacity, minimum capacity, number of scale intervals and software identification
    depend on the modules used; the compatibility of the modules shall be checked using R 76 (2006) annex
    F and the necessary data can be found in the applicable OIML Test Reports listed on the certificate.
    Other load cells than the types listed in the OIML Test Reports may be used provided there is an OIML
    Certificate of Conformity (R 60) issued for the load cell by an OIML Issuing Authority.
