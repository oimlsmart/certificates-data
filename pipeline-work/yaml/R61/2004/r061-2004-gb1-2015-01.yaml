certified_type:
  category: Automatic gravimetric filling instrument
  type_designations:
  - 290 Series
  module_designation:
  description: >-
    Automatic gravimetric filling instrument for dispensing predetermined loads of powdered, granular
    or liquid materials, consisting of a feeding device, a weighing unit and a 290 Series weighing controller.
    Protected interfaces: load cell connection, analogue output with RS232, CAN bus, Profibus DP, Ethernet
    TCP/IP, Ethernet IP, Profinet, EtherCAT, relay output (3), digital input (2). Firmware held on circuit
    board with identification number V4.xx; download only possible via the sealed USB port; access to
    legally relevant parameters password-protected with a non-editable Calibration Number counter.
