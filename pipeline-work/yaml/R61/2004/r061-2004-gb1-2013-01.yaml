certified_type:
  category: Automatic gravimetric filling instrument
  type_designations:
  - CCW-R
  - CCW-RS
  - CCW-RV
  module_designation:
  description: >-
    This family of automatic gravimetric filling instruments, designated the CCW-R, CCW-RS and CCW-RV,
    is designed for dispensing predetermined loads of powdered, granular or liquid materials. The instruments
    consist of a feeding device, a number of weighing units, and a weighing controller. Each model is
    designated the CCW-xx-2nn, with xx the type of instrument (R, RS or RV) and nn the number of weighing
    units. The instruments operate as associative (selective combination) weighers, and derive the most
    appropriate combination of loads in one or more weighing unit for discharge as a fill so that the
    target weight selected by the user is achieved.
