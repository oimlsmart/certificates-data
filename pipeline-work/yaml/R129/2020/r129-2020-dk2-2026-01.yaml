certified_type:
  category: Multi-Dimensional Measuring Instrument
  type_designations:
  - MV-DLxxxx-0yy-y
  module_designation: Multi-Dimensional Measuring Instrument
  description: >-
    Automatic multi-dimensional measuring instrument (MDMI) designated MV-DLxxxx-0yy-y, where x and y
    may be 0-9 or A-Z and represent models with different housing colour, baseline or scan rate. Intended
    for scanning the dimensions of rectangular boxes moved on a transport belt below the camera. The instrument
    can measure objects of different colours and sizes but does not measure irregular objects. Consists
    of a 3D laser camera placed on a portal or mounted in the ceiling; the pictures from the camera of
    the object are transmitted to a PC, which analyses them and calculates the dimensions. The PC software
    includes a data storage device working as an alibi memory in which all performed measurements are
    stored; alternatively measurements are sent to a central system.
