certified_type:
  category: Multi-dimensional measuring instrument
  type_designations:
  - DM3610-1200
  - DM3610-2200
  - DM3610-3200
  - DM3610-4200
  description: >-
    Multi-dimensional measuring instrument for measuring length, width and height of objects. Single measuring
    head without controller PC, or two measuring heads with a controller PC. Displacement sensor: incremental
    encoder for conveyor belt, or PGD100 with sensor array (2-16 sensors) for cross belt sorter or tilt
    tray sorter.
