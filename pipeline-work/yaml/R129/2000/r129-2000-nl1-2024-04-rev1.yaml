footnotes:
- marker: 1)
  text: With this setting the object is measured on the floor in the field of measurement
- marker: 2)
  text: >-
    With this setting the object is measured while being lifted by the forklift. The pallet must be lifted
    with 5 to 30 cm from the floor. The pallets dimensions are included in the measurement.
- marker: 3)
  text: The multi-dimensional measuring instrument detects automatically the principle of operation.
