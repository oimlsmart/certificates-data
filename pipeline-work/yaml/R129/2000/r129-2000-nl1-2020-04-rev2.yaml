model_family:
  family_name: VIPAC D
  models:
  - model_id: VIPAC D BNVS
    label: VIPAC D BNVS
    attributes:
      conveyor: belt conveyors and any conveyor that has a flat surface
      speed_measurement: shaft encoder
  - model_id: VIPAC D BNVS Flex
    label: VIPAC D BNVS Flex
    attributes:
      conveyor: belt conveyors and any conveyor that has a flat surface
      speed_measurement: shaft encoder
  - model_id: VIPAC D CNVS
    label: VIPAC D CNVS
    attributes:
      conveyor: crossbelt sorters or any sorter-like conveyor that has a flat surface
      speed_measurement: SSMD device or RIO2 CBS
  - model_id: VIPAC D CNVS Flex
    label: VIPAC D CNVS Flex
    attributes:
      conveyor: crossbelt sorters or any sorter-like conveyor that has a flat surface
      speed_measurement: SSMD device or RIO2 CBS
  - model_id: VIPAC D TNVS
    label: VIPAC D TNVS
    attributes:
      conveyor: tray-equipped conveyors with entirely or partially visible and uniform trays of any shape
      speed_measurement: SSMD device or RIO2 CBS
      note: Objects may extend across multiple trays (if configured)
  - model_id: VIPAC D TNVS Flex
    label: VIPAC D TNVS Flex
    attributes:
      conveyor: tray-equipped conveyors with entirely or partially visible and uniform trays of any shape
      speed_measurement: SSMD device or RIO2 CBS
      note: Objects may extend across multiple trays (if configured)
