    width_max: 1000
    width_min: 50
    width_scale_interval: 5
    height_small_max: 50
    height_large_min: 50
    height_large_max: 1000
    height_min: 20
    height_scale_interval_small: 2
    height_scale_interval_large: 5
  description: >-
    Maximum/minimum dimensions and scale intervals per model configuration. Scale interval values are
    lower bounds (d must be greater than or equal to the listed value). Height is split into two cases:
    small objects with height up to 50 mm and large objects with height from 50 mm up to the listed maximum.
    BNVS: belt conveyors, speed measured via shaft encoder; CNVS: crossbelt sorters, speed measured via
    SSMD device; TNVS: tray-equipped conveyors, speed measured via SSMD device, objects may extend across
    multiple trays if configured.
  footnotes: []
