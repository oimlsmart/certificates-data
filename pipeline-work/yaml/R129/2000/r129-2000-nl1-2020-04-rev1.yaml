model_family:
  family_name: VIPAC D xNVS
  models:
  - model_id: VIPAC D BNVS
    label: Configuration for belt conveyors and any conveyor that has a flat surface
    attributes:
      application: belt conveyors and any conveyor that has a flat surface
      speed_measurement_method: shaft encoder
  - model_id: VIPAC D CNVS
    label: Configuration for crossbelt sorters or any sorter-like conveyor that has a flat surface
    attributes:
      application: crossbelt sorters or any sorter-like conveyor that has a flat surface
      speed_measurement_method: SSMD device
  - model_id: VIPAC D TNVS
    label: >-
      Configuration for tray-equipped conveyors with entirely or partially visible and uniform trays of
      any shape
    attributes:
      application: tray-equipped conveyors with entirely or partially visible and uniform trays of any
        shape
      speed_measurement_method: SSMD device
      objects_may_extend_across_multiple_trays: if configured
