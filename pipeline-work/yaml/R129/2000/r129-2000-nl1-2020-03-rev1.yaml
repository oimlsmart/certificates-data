      application: For belt conveyors and any conveyor that has a flat surface
      speed_measurement: shaft encoder
  - model_id: VIPAC D CCVS
    attributes:
      application: For crossbelt sorters or any sorter-like conveyor that has a flat surface
      speed_measurement: SSMD device
  - model_id: VIPAC D TCVS
    attributes:
      application: For tray-equipped conveyors with entirely or partially visible and uniform trays of
