certified_type:
  category: Multi-dimensional measuring instrument
  type_designations:
  - VIPAC D BCVS
  - VIPAC D CCVS
  - VIPAC D TCVS
  description: >-
    The VIPAC D xCVS uses one or two VOLUMEC HD 3.x sensor heads to record the dimension of objects. Measurement
    of objects on a conveyor band may be done dynamically or statically in a start-stop scenario.
