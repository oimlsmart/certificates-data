certified_type:
  category: Multi-dimensional measuring instrument
  type_designations:
  - QubeVu®
  - QubeVu® WS
  - QubeVu® Industrial
  - QubeVu® DimStation™
  module_designation:
  description: >-
    Multi-dimensional measuring instrument designated QubeVu® for measuring square or rectangular boxes
    only. Mounted to the metal chassis within the head: two cameras (one fixed to a zoom lens), three
    custom printed circuit boards, a 3D sensor and an OEM single-board computer (which includes other
    boards within its assembly). The associated software may be installed on any CE Marked PC; if required
    any CE Marked LAN hub may be used.
