certified_type:
  category: Multi-dimensional measuring instrument
  type_designations:
  - VMS 510
  description: >-
    Multi-dimensional measuring instrument for measuring cubic and rectangular, non-irregular shaped,
    non-reflective and opaque boxes. The smallest rectangular box that fully encloses the object shall
    be determined. May be connected to an automatic weighing instrument provided this fulfils OIML R51.
