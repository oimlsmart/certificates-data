certified_type:
  category: Multi Dimensional Measuring Instrument
  type_designations:
  - EasyCube S
  - EasyCube SD
  module_designation: Multi Dimensional Measuring Instrument
  description: >-
    The EasyCube is a Multi Dimensional Measuring Instrument used for measuring rectangular and irregular
    objects. The measuring dimensions of the static objects by the multi-dimensional measuring instruments
    is performed by a dimensioner head – called EasyCube SD. The dimensioner head can be placed mounted
    on a wall or on a table or in the ceiling. Differently, it can be used mounted on a post which is
    assembled together with a platform on which the objects are measured. This version of the instrument
    is called EasyCube S.
