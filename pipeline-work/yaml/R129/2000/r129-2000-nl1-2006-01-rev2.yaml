matrix_tables:
- name: Measuring range and dimension steps
  columns:
  - quantity
  - length
  - width
  - height
  column_units:
  -
  - mm
  - mm
  - mm
  rows:
  - quantity: max
    length: 2000
    width: 1000
    height: 1000
  - quantity: min (Vmax ≤ 1.2 m/s)
    length: 50
    width: 50
    height: 50
  - quantity: d (Vmax ≤ 1.2 m/s)
    length: 5
    width: 5
    height: 5
  - quantity: min (Vmax ≤ 2 m/s)
    length: 100
    width: 100
    height: 50
  - quantity: d (Vmax ≤ 2 m/s)
    length: 10
    width: 10
    height: 5
  description: >-
    Maximum object dimensions L ≤ 2000 mm, W ≤ 1000 mm, H ≤ 1000 mm apply to both conveyor-speed configurations.
    For Vmax ≤ 1.2 m/s the minimum object dimensions are 50/50/50 mm with dimension step d = 5 mm in each
    direction; for Vmax ≤ 2 m/s the minimum dimensions are 100/100/50 mm with d = 10/10/5 mm.
  footnotes: []
- name: Data fields for obligatory calibration part
  columns:
  - field
  - meaning
  column_units:
  -
  -
  rows:
  - field: M
    meaning: Unit ["M"] for metric
  - field: LLLL
    meaning: Length [mm] of the smallest fully-envoloping cube
  - field: WWWW
    meaning: Width [mm] of the smallest fully-envoloping cube
  - field: HHHH
    meaning: Height [mm] of the smallest fully-envoloping cube
  - field: AAAAAAAA
    meaning: The unique serial number of the master
  - field: BBBBBBBB
    meaning: The unique serial number of the slave (for VMS 520, in VMS510 = 00000000)
  - field: CCCC
    meaning: Index (object counter)
  - field: DDDD
    meaning: Measuring status
  - field: EEEE
    meaning: CRC16 for the above-mentioned data fields
  description: >-
    Obligatory telegram part for data string transmission to a computer: M;LLLL;WWWW;HHHH;AAAAAAAA;BBBBBBBB;CCCC;DDDD;EEEE.
    All data fields are of fixed length.
  footnotes: []
