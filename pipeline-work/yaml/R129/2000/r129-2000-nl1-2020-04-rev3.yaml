- revision: '1'
  date: '2021-07-13'
  changes: >-
    Version with tray-equipped conveyor tested, software versions detailed, earlier test reports moved
    into the latest test report.
- revision: '2'
  date: '2025-10-24'
  changes: >-
    Changing hardware setup to remove housing of controller PC and add RIO2 CBS for speed measurement.
    Adding additional sensor firmware checksums.
