certified_type:
  category: Multi-dimensional measuring instrument
  type_designations:
  - DM3610-1200
  - DM3610-2200
  - DM3610-3200
  - DM3610-4200
  module_designation:
  description: >-
    Multi-dimensional measuring instrument operating by reflection of light, for measuring length, width
    and height of objects conveyed on a conveyor belt, cross belt sorter, tilt tray sorter or AGV. Single-interval
    or multi-interval; configurations with one, two or three measurement heads, optionally with controller
    PC.
