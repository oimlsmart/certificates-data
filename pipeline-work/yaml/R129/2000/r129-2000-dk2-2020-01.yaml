certified_type:
  category: Multi-dimensional measuring instrument
  type_designations:
  - BeeVision 270
  - BeeVision 182
  module_designation: Multi-dimensional measuring instrument
  description: >-
    The measurement of the multi-dimensional measuring instruments is performed by a dimensioner head
    – named BeeVision 270. The dimensioner head can be placed mounted on a wall or in the ceiling. Alternately
    it can be delivered mounted on a pole which is mounted together with a platform for the objects to
    be measured. The platform may be a scale for determine the weight of the objects. This model is called
    BeeVision 182. The instrument can measure rectangular, non-rectangular and irregular objects.
