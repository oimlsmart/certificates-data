certified_type:
  category: Multi-Dimensional Measuring instrument
  type_designations:
  - VIPAC D BCVS
  - VIPAC D CCVS
  module_designation:
  description: >-
    Multi-dimensional measuring instrument based on reflection of light for automatic dimensioning (length,
    width, height) of rectangular objects. The VIPAC D xCVS uses one or two VOLUMEC HD 3.x sensor heads
    to record the dimensions of objects.
