certified_type:
  category: Taximeter
  type_designations:
  - M1-MDT
  module_designation:
  description: >-
    The pattern is a taximeter designated the M1-MDT designed to be installed in a road vehicle for the calculation of fares.
    The fares are calculated based on measurement of distance and time; the instrument operates in calculation modes S (single
    application of tariff) or D (double application of tariff). The instrument is powered via the vehicle battery.
