        max: 2
      unit_symbol: "%"
    - condition: class 2, water temperature > 30 °C
      value:
        min: -3
        max: 3
      unit_symbol: "%"
    - condition: class 1, water temperature ≤ 30 °C
      value:
        min: -1
        max: 1
      unit_symbol: "%"
    - condition: class 1, water temperature > 30 °C
      value:
        min: -2
        max: 2
      unit_symbol: "%"
