certified_type:
  category: Magnetic flow meter
  type_designations:
  - '8732'
  - '8705'
  - '8711'
  description: >-
    Water meters (magnetic flow meters) intended for metering cold and hot potable water, based on the
    electromagnetic principle. They consist of a flow sensor (type 8705 with standard flanges, or type
    8711 flangeless/wafer) and a measuring transducer with electronic calculator (type 8732). The sensor
    body is made of stainless and carbon steel with lining of polyurethane or PTFE and is fitted with
    measurement electrodes. The transmitter is housed in a stainless steel box with transparent sight
    hole for a two-row LCD display and four buttons, and includes two connector cables for supply and
    for communication via impulse output and current output. Remote mount design (connected via cable)
    or compact design.
