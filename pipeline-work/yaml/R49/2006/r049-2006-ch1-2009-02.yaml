certified_type:
  category: Water meter
  type_designations:
  - ISOMAG
  description: >-
    Family of electromagnetic flow meters (water meters) intended for the metering of cold water. Covers
    the nominal diameters DN25 to DN200 consisting of 10 nominal diameters. Designed for a nominal pressure
    of 16 bar and a maximal water temperature of 60 °C. Measures the flow of electrically conductive mediums
    (water) by means of the electromagnetic flow measuring system. Versions: compact flow meter (converter
    and flow sensor fixed together) or split version (converter and flow sensor connected via cable).
