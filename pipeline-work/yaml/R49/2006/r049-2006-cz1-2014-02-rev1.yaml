  description: >-
    Horizontal Woltman water meter. Cast body of iron, brass or bronze with connecting flanges or groove
    connection; interchangeable wet measuring unit with adjusting device; dry mechanical indicating device
    or super dry mechanical indicating device (Copper Can Calculator). Measuring unit comprises inlet
    and outlet flow straighteners with stainless steel shafts with tungsten carbide ends, a plastic turbine
    with two composite axial bearings and two radial sapphire bearings, and a transmission shaft with
    magnetic coupling of two or four cube-shaped magnets.
