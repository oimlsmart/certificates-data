certified_type:
  category: Water meter
  type_designations:
  - ISOMAG
  module_designation:
  description: >-
    Family of electromagnetic flow meters intended for the metering of cold water. The family covers nominal
    diameters DN25 to DN200 (10 nominal diameters) and is designed for a nominal pressure of 16 bar and
    a maximal water temperature of 60 °C. Measures the flow of electrically conductive media (water) by
    means of an electromagnetic flow measuring system; the converter manages the input and output signals
    and converts the data. Versions: Compact flow meter (converter and flow sensor fixed together) and
    Split version (converter and flow sensor connected via cable). The converter corrects the sensor linearly
    with the k-factor. Accessory components: none.
