  description: >-
    Volumetric water meter ITRON type P1, linear and concentric (manifold) versions, with plastic registers
    (TSN, CC4 or WTR) or glass & metal register (TVM). Note: manifold meters in composite version exist
    only with a DN15 nominal diameter.
