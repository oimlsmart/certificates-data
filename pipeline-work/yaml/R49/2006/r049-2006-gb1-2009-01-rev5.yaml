components:
- role: optional sensor unit
  type_designations:
  - Inductive or resonant pointer and sensor unit
  characteristics:
    optional: true
    applicable_models:
    - V200
    - V210
    - V220
    description: >-
      Meter register equipped with a metallic pointer on the first element of the verification scale;
      two bosses and two holes on the shroud enable the option of an inductive sensor to be fitted to
      the meter shroud.
- role: optional sensor unit
  type_designations:
  - Reed switch sensor
  characteristics:
    optional: true
    applicable_models:
    - V200
    - V210
    - V220
    description: >-
      Meter register equipped with a magnetic pointer on the first element of the verification scale;
      the reed switch sensor is fitted to the meter shroud.
- role: optional sensor unit
  type_designations:
  - Reed switch sensor
  characteristics:
    optional: true
    applicable_models:
    - V100
    - V110
    description: >-
      Meter register equipped with a magnet on the first element of the verification scale; the reed switch
      sensor is fitted in a pocket within the meter housing, in close proximity to the magnet.
