certified_type:
  category: Water meter
  type_designations:
  - V100
  - V110
  - V200
  - V210
  - V220
  description: >-
    Family of cold-water meters utilising a common, volumetric measuring element, with a nominal capacity
    of 16.5 revs/litre and having a rated permanent flowrate Q3 of 1.6 m³/h (R100), 2.5 m³/h (R250) or
    4.0 m³/h (R400).
