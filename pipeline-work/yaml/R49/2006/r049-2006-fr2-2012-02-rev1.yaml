  text: >-
    For a given nominal flowrate (Q3) values of Q3/Q1 lower than those listed in the table above are permitted.
    However the values of this ratio cannot be below 10.
- marker: 2)
  text: >-
    The 99 999 999 m³ range indicating device (verification scale interval 20 dm³) can be used up to Q1
    = 3.125 m³/h included.
- marker: 3)
  text: >-
    The water meter is not designed to measure reverse flow but can withstand an accidental reverse flow
    without any deterioration or change in metrological properties.
