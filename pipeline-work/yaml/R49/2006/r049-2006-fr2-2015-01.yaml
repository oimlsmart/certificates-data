footnotes:
- marker: "*"
  text: >-
    La version de totalisateur avec la portée de 99 999 999 m³ (échelon de vérification 20 dm³) est utilisable
    jusqu'à Q1 = 3,125 m³/h inclus.
- marker: "**"
  text: >-
    Le compteur n'est pas conçu pour mesurer des flux inversés mais résiste à un flux inversé accidentel
    sans subir aucune détérioration ou modification des propriétés métrologiques.
