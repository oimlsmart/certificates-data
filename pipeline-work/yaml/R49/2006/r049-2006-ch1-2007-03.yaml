  description: >-
    Family of electromagnetic flow meters intended for the metering of cold water, covering nominal diameters
    DN25 to DN200 (10 nominal diameters), designed for a nominal pressure of 16 bar and a maximum water
    temperature of 60 °C. Versions: compact flow meter (converter and flow sensor fixed together) or split
    version (converter and flow sensor connected via cable).
