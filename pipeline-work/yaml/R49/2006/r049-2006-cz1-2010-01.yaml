certified_type:
  category: Volumetric water meter
  type_designations:
  - PD-LFC
  description: >-
    The water meters type PD-LFC are positive displacement meters with rotary piston. The water meters
    type PD-LFC with brass or bronze body consist of a lower and upper covers with connecting threads,
    a inlet strainer (optional), a wet measuring unit, a clamp frame, a transmission shaft, a semi dry
    mechanical indicating device, a non-return valve, a brass head ring and rubber o-ring. There are water
    meters with plastic body also. The water meters with plastic body consist of a lower and upper covers
    with connecting threads, a inlet strainer (optional), a wet measuring unit, a clamp frame, a transmission
    shaft, a semi dry mechanical indicating device, a non-return valve, and rubber o-ring. The measuring
    unit consists of an internal strainer, a piston chamber with plastic shaft with stainless steel holder,
    a bush, a plate, a piston with stainless steel shaft, a piston chamber lid with, a transmission shaft.
