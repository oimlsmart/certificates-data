components:
- role: measuring element
  type_designations: []
  characteristics:
    principle: volumetric, semi-positive displacement
    nominal_capacity: 36 revs/litre
    common_to_all_models: true
- role: inductive pointer and sensor unit (optional)
  type_designations: []
  alternatives: OR
  characteristics:
    applicable_models: V200, V210
    detail: >-
      register equipped with a metallic pointer on the first element of the verification scale; two bosses
      and two holes on the shroud enable fitting of an inductive sensor
- role: reed switch sensor (optional)
  type_designations: []
  alternatives: OR
  characteristics:
    applicable_models: V100, V110, V200, V210
    detail: >-
      V200/V210: register equipped with a magnetic pointer on the first element of the verification scale,
      sensor fitted to the meter shroud; V100/V110: sensor fitted in a pocket within the meter housing
      in close proximity to the magnet
- role: electronic register
  type_designations:
  - V200H
  - V210H
  characteristics:
    type: electronic non-resettable totalising register
    power_supply: lithium cell
    display: 6+5 digit liquid crystal display
