certified_type:
  category: Water meter
  type_designations:
  - PROMAG W800
  module_designation:
  description: >-
    Water meter intended for the metering of cold potable water and hot water. Electromagnetic measuring
    principle (Faraday law): the conductive medium flows through a magnetic field which induces a voltage
    signal between the electrodes proportional to the mean flow velocity; the converter controls the magnetic
    field parameters, acquires the electrode signal, calculates and displays the flow rate. The type PROMAG
    W800 covers nominal diameters in the range DN 25 up to DN 800 and includes 18 nominal diameters. Composed
    of sensor PROMAG W (full welded carbon steel sensor housing) and converter ML255.
