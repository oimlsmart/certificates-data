certified_type:
  category: Water meter
  type_designations:
  - FLOMIC FL5024
  - FLOMIC FL5044
  description: >-
    Ultrasound water meters for metering cold potable water, based on the ultrasonic principle. Consist
    of a flow sensor and a measuring transducer with electronic calculator in compact version, powered
    by battery. The flow sensor body is made by shaped casting from ductile iron with standard flanges,
    fitted with one pair of ultrasonic sensors for the single-beam model (type FL5024) or two pairs for
    the double-beam model (type FL5044). The measuring transducer is an aluminium box with plastic lid,
    transparent sight hole for LCD display, button, pressure-equalization valve, plate for communication
    by optical probe and three connectors for RS232, impulse output and current output; unused connectors
    must be blind; maximum communication cable length 2 m. The water meter type FL5024 with nominal diameter
    DN32 must be installed with a cross type of flow straightener.
