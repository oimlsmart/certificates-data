certified_type:
  category: Water meter
  type_designations:
  - OPTIFLUX x300C
  - OPTIFLUX x000F + IFC300y
  description: >-
    Water meter intended for metering cold potable water, based on an electromagnetic principle, designed
    to measure reverse flow, with straight inlet and outlet length, with no flow conditioner and equipped
    with an electronic calculating/indicating device. OPTIFLUX x300C is a complete water meter; OPTIFLUX
    x000F + IFC300y is a combined water meter. With x being 1, 2, 4, 5 or 6 and with y being F or W (footnote
    1).
