certified_type:
  category: Water meter
  type_designations:
  - MJ-SDC PLUS
  description: >-
    Multijet water meter. Multi jet rotary vane wheel water meters with dry mechanical indicating device.
    Brass body with connecting screw threads, inlet strainer and adjusting screw, rubber gasket, plastic
    casing for an impeller with multiple inlets and outlets, stainless steel shaft with plastic tip, rotary
    vane impeller with agate bearing and magnetic ring, plastic casing for an indicating device with rubber
    O-ring, antimagnetic protection ring, plastic shaft with magnetic ring, dry mechanical indicating
    device, plastic ring, rubber O-ring, glass window and brass screw head ring with plastic sliding gasket
    and plastic lid. Indicating device available in two variants (5 numbered rollers and 4 rotary pointers,
    or 8 numbered rollers and 1 rotary pointer) with a star wheel with 6 arms for rapid testing. Optionally
    equipped with a reed impulse transmitter for remote reading.
