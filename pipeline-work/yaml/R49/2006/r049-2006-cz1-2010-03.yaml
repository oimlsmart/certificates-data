    ratio Q2/Q1 = 1.6, ratio Q4/Q3 = 1.25, temperature classes T30 and T50, pressure class MAP 16, flow
    profile sensitivity classes U10 D5, orientation limitation V and H, and connection type Flange or
    Groove Connection apply to all diameters.
  footnotes:
  - marker: 1)
    text: The value of Q3 shall be chosen from the R5 line of ISO 3:1973.
  - marker: 2)
    text: >-
      The ratio Q3 / Q1 shall be chosen from the R10 line from ISO 3:1973 and this value shall be higher
      than 10.
