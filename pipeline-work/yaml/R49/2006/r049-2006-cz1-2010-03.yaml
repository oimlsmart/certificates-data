  description: >-
    Horizontal Woltman water meter consisting of an iron, brass or bronze casted body with connecting
    flanges or groove connection, an interchangeable wet measuring unit with adjusting device and a semi
    dry mechanical indicating device (Liquid Filled Calculator) with protected register drums. There is
    a water meter flange cover connected by screws and sealed by a silicon o-ring on the measuring unit.
    The measuring unit consists of an inlet flow straightener with stainless steel shaft with tungsten
    carbide end, a plastic turbine with two composite axial bearings and two radial sapphire bearings,
    an outlet flow straightener with stainless steel shaft with tungsten carbide end, a transmission shaft
    protected by a shaft tube, a water meter flange cover, an adjusting screw sealed by a silicon o-ring
    with adjusting slide, a semi dry indicating device (Liquid Filled Calculator), an upper glass disc
    and a brass closing ring with rubber sealing.
