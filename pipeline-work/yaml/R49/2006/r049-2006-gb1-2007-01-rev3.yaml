components:
- role: optional sensor unit
  type_designations:
  - Inductive or resonant pointer and sensor unit
  alternatives: OR
  characteristics:
    applicable_models:
    - V200
    - V210
    description: >-
      The meter register is equipped with a metallic pointer on the first element of the verification
      scale. Two bosses and two holes on the shroud enable the option of an inductive sensor to be fitted
      to the meter shroud.
- role: optional sensor unit
  type_designations:
  - Reed switch sensor
  alternatives: OR
  characteristics:
    applicable_models:
    - V200
    - V210
    description: >-
      The meter register is equipped with a magnetic pointer on the first element of the verification
      scale. The reed switch sensor is fitted to the meter shroud.
- role: optional sensor unit
  type_designations:
  - Reed switch sensor
  alternatives:
  characteristics:
    applicable_models:
    - V230
    description: >-
      The meter register is equipped with a magnetic pointer on the largest fractional element of the
      verification scale. The reed switch sensor is fitted to the meter shroud.
- role: optional sensor unit
  type_designations:
  - Reed switch sensor
  alternatives:
  characteristics:
    applicable_models:
    - V100
    - V110
    description: >-
      The meter register is equipped with a magnet on the first element of the verification scale. The
      reed switch sensor is fitted in a pocket within the meter housing, in close proximity to the magnet.
- role: electronic register
  type_designations:
  - Electronic non-resettable totalising register
  alternatives:
  characteristics:
    applicable_models:
    - V200H
    - V210H
    power_supply: lithium cell
    display: 6+5 digit liquid crystal display
    resettable: false
