certified_type:
  category: Water meter
  type_designations:
  - ISOMAG MS2500
  - ML255
  module_designation: ISOMAG FAMILY Model MS2500 DN 25 up to DN 250 with ML255 Model Converter
  description: >-
    Electromagnetic flow meter for water metering. The ISOMAG family of water meters covers nominal diameters
    from DN 25 up to DN 250, consisting of 11 nominal diameters. Measuring principle: the conductive medium
    flows through a magnetic field which induces a voltage signal between the electrodes proportional
    to the mean flow velocity (Faraday law); the converter (electronic unit) controls magnetic field parameters,
    acquires the electrode signal, calculates and displays the flow rate.
