certified_type:
  category: Water meter
  type_designations:
  - SJ-SDC
  description: >-
    Single jet rotary vane wheel water meter with dry mechanical indicating device (Plastic Can Calculator)
    or super dry mechanical indicating device (Copper Can Calculator). Body of brass, bronze or plastic
    with connecting threads and inlet strainer. Construction variants SJ-SDC (D3) and SJ-SDC (D7), the
    latter with an adjusting screw. Three calculator variants (5 drums with 4 rotary pointers, 8 drums
    with 1 pointer, 7 drums with 2 pointers), each with a star wheel (6 or 20 arms) for rapid testing.
    Optionally equipped with a reed impulse transmitter for remote reading. Installed in arbitrary positions
    with indicating device on the top or on the side.
