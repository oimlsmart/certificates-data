certified_type:
  category: Water meter
  type_designations:
  - SJ-SDC PLUS
  - SJ-SDC PLUS D2
  - SJ-SDC PLUS D4
  description: >-
    Single jet rotary vane wheel water meters with dry mechanical indicating device (Plastic Can Calculator).
    Variant D2: brass body with connecting threads and inlet strainer, regulating plate, bush for impeller
    with agate bearing, rotary vane impeller with magnetic ring and stainless steel shaft, rubber O-ring,
    pressure plate with agate bearing, brass inner screw ring, plastic gasket (optional), two antimagnetic
    protection rings, dry mechanical indicating device, and plastic cover with a closing ring or a plastic
    clamp-on cover. Variant D4: as D2 but with adjusting screw, plastic gasket, and plastic cover with
    a closing ring. Optionally equipped with a reed impulse transmitter for remote reading.
