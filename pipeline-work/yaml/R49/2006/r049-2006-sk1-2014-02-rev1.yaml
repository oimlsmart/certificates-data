certified_type:
  category: Water meter
  type_designations:
  - MD-A
  - MD-AP
  module_designation:
  description: >-
    Mechanical multi-jet dry dial water meter intended for metering the volumes (consumption) of clean
    cold water in residential (households) and commercial use, installed into pipe lines in horizontal
    installation positions. Essential parts: measuring mechanism (impeller with axle perpendicular to
    flow direction, lower and upper tightening plates with bearing hubs); mechanical register (dry type,
    digital drum with gearing mechanism, 5 digits indication and 4 pointers of analog device, for DN40
    and DN50 6 digits and 4 pointers); housing (brass body for type MD-A or plastic body for type MD-AP);
    adjustment device if any (regulated by hinge plug screw); magnetic coupling. Non-essential parts:
    strainer in the inlet, non-return valve (optional). Optional integrated function: pulse output with
    reed sensor switch.
