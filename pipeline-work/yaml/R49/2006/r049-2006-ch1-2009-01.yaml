certified_type:
  category: Water meter
  type_designations:
  - ISOMAG
  - MS 2500
  - ML 110
  - ML 210
  module_designation: Not applicable
  description: >-
    Family of electromagnetic flow meters intended for the metering of cold water. Covers nominal diameters
    DN25 to DN200 (10 nominal diameters). Designed for a nominal pressure of 16 bar and a maximal water
    temperature of 60 °C. Measures the flow of electrically conductive mediums (water) by means of the
    electromagnetic flow measuring system; the conductive medium flows through a magnetic field which
    induces a voltage proportional to the mean flow speed. The converter of the sensor manages the input
    and output signals and converts the data. Versions: compact flow meter (converter and flow sensor
    fixed together) and split version (converter and flow sensor connected via cable). Accessory components:
    none.
