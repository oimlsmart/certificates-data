certified_type:
  category: Water meter
  type_designations:
  - AMFLO MAG Pro
  description: >-
    Family of electromagnetic flow meters intended for the metering of cold water. Covers the nominal
    diameters DN25 to DN200 consisting of 10 nominal diameters, designed for a nominal pressure of 16
    bar and a maximum water temperature of 60 °C. Measures the flow of electrically conductive mediums
    (water) by means of an electromagnetic flow measuring system. Versions: compact (converter and flow
    sensor fixed together) and split (converter and flow sensor connected via cable).
