components:
- role: Inductive or resonant pointer and sensor unit (optional)
  type_designations: []
  alternatives:
  characteristics:
    applicable_models:
    - V200
    - V210
    - V220
    description: >-
      The meter register is equipped with a metallic pointer on the first element of the verification
      scale. Two bosses and two holes on the shroud enable the option of an inductive sensor to be fitted
      to the meter shroud.
- role: Reed switch sensor (optional)
  type_designations: []
  alternatives:
  characteristics:
    applicable_models:
    - V100
    - V110
    - V200
    - V210
    - V220
    description: >-
      For V200, V210 and V220 the meter register is equipped with a magnetic pointer on the first element
      of the verification scale and the reed switch sensor is fitted to the meter shroud; for V100 and
      V110 the meter register is equipped with a magnet on the first element of the verification scale
      and the reed switch sensor is fitted in a pocket within the meter housing, in close proximity to
      the magnet.
