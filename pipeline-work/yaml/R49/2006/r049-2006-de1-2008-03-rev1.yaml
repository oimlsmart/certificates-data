certified_type:
  category: Water meter
  type_designations:
  - Promag 51 P/W
  description: >-
    Electromagnetic flow meter with electronical register. The measuring system consists of a transmitter
    and a sensor. Two versions are available: compact version (transmitter and sensor form a single mechanical
    unit) and remote version (transmitter and sensor installed separately). Sensor Promag P: DN 15 to
    DN 600, PFA or PTFE lining; Sensor Promag W: DN 25 to DN 800, hard rubber or polyurethane lining.
