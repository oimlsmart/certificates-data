certified_type:
  category: Water meter
  type_designations:
  - MULTI
  - MULTI E
  - MULTI G
  module_designation:
  description: >-
    Multijet rotary vane wheel water meters with dry mechanical indicating device. Brass or bronze body
    with connecting screw threads, inlet strainer and adjusting screw; plastic casing for an impeller
    with multiple inlets and outlets, protecting strainer and a stainless steel shaft with plastic tip;
    rotary vane impeller with agate bearing and magnetic ring. Variant MULTI E: plastic casing for indicating
    device with rubber O-ring separating wet and dry parts, antimagnetic protection ring, dry mechanical
    indicating device with 5 drums and 4 pointers. Variant MULTI G: plastic cover separating wet and dry
    parts fixed by a brass, steel or plastic inner head ring, antimagnetic protection ring, plastic capsule
    containing plastic shaft with magnetic ring and dry mechanical indicating device (combinations of
    5 rollers + 4 pointers, 7 rollers + 2 pointers or 8 rollers + 1 pointer; two variants with reading
    of the drums from the top and one variant with inclined reading). Optional reed impulse transmitter
    for remote reading. To be installed in horizontal position only with the indicating device positioned
    at the top.
