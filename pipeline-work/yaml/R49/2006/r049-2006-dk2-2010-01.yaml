  module_designation:
  description: >-
    Water meter intended for metering cold potable water and hot water, based on an electromagnetic principle,
    designed to measure forward and reverse flow in all orientations, with straight inlet and outlet length,
    with no conditioner and equipped with an electronic calculating/indicating device. The construction
    consists of an electromagnetic flow sensor, MAG5100W, and a signal transmitter, MAG8000CT.
