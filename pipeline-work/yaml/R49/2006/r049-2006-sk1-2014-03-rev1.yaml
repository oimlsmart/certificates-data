certified_type:
  category: Water meter
  type_designations:
  - ML-A
  - ML-AP
  module_designation:
  description: >-
    Mechanical multi-jet dry dial water meter intended for metering the volumes (consumption) of clean
    cold water in residential (households) and commercial use, installed into pipe lines in horizontal
    installation positions. Essential parts: measuring mechanism (impeller with an axle perpendicular
    to the flow direction, lower and upper tightening plates with bearing hubs), mechanical register (dry
    type, digital drum with gearing mechanism for all figures, 5 digits indication, 4 pointers of analog
    device; 6 digits and 4 pointers for DN40 and DN50), housing (brass body for type ML-A, plastic body
    for type ML-AP), adjustment device if any (adjustment enabled by hinge plug screw to regulate flow),
    magnetic coupling. Non-essential parts: strainer in the inlet, non-return valve (optional). Optional
    integrated equipment: pulse output with reed sensor switch.
