  text: With x being 1, 2, 4, 5 or 6 and with y being F or W.
- marker: "[2]"
  text: The indicating range is programmable, stated here is the minimum indicating range.
- marker: "[3]"
  text: The verification scale interval is programmable, stated here is the maximum value.
