certified_type:
  category: Water meter
  type_designations:
  - PD-A
  - PD-AP
  module_designation:
  description: >-
    Family of mechanical volumetric (rotary piston) water meters for metering the volumes (consumption)
    of clean cold water in residential (household) and commercial use, installed into pipe lines in all
    installation positions. Essential parts: measuring chamber (chamber, rotary piston and top plate with
    transmission shaft for connection of measuring part with register); mechanical register (digital drum
    with gearing mechanism, semi-dry-dial counter with glycerine, 8 digits indication); housing (PD-A:
    brass body, PD-AP: plastic body); non-return valve. Non-essential part: sieve in the inlet of the
    water meter. Optional integrated equipment: pulse output with reed sensor switch, K-factor 2 impulses
    per litre. Software: not applicable.
