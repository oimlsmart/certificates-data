certified_type:
  category: Water meter
  type_designations:
  - C4000
  module_designation:
  description: >-
    Water meter intended for the metering of cold potable water; combination meter with mechanical register.
    The measuring system consists of a large meter of the Woltman parallel type and a small meter of the
    piston type (Q3 4 m³/h) in conjunction with a change over valve and dry running registers.
