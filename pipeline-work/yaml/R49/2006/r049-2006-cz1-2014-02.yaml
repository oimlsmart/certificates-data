  description: >-
    Horizontal Woltman water meter. The water meters type turbo consist of an iron, brass or bronze casted
    body with connecting flanges or groove connection, an interchangeable wet measuring unit with adjusting
    device and a dry mechanical indicating device or super dry mechanical indicating device (Copper Can
    Calculator). There is a water meter flange cover connected by screws and sealed by silicon o-ring
    on the measuring unit. The measuring unit consists of an inlet flow straightner with stainless steel
    shaft with tungsten carbide end, a plastic turbine with two composite axial bearings and two radial
    sapphire bearings, an outlet flow straightner with stainless steel shaft with tungsten carbide end,
    a transmission shaft with a magnetic coupling formed by two or four cube shape magnets protected by
    shaft tube, water meter flange cover, an adjusting screw sealed by silicon o-ring with adjusting slide,
    a dry indicating device (Plastic or Copper Can Calculator), plastic cup with rotary plate, bracket
    with copper can or plastic register, plastic sealed ring with plastic cover.
