certified_type:
  category: Water meter
  type_designations:
  - MJ-LFC
  - MJ-WDC
  description: >-
    Multi jet rotary vane wheel water meters. Type MJ-WDC: multi jet rotary vane wheel water meter with
    wet mechanical indicating device. Type MJ-LFC: multi jet rotary vane wheel water meter with semi dry
    (Liquid Filled Calculator) indicating device with protected registered drums. The meters consist of
    a brass, bronze, iron or plastic body, an inlet strainer, a wet measuring unit with a plastic distributor
    with tangential holes, a rotary vane wheel and gears, a mechanical indicating device with pointers
    and registered drums, a glass and a brass or plastic head ring with a plastic cover. The numbered
    drums are installed in a capsule filled by special liquid; adjustment is realized by an adjusting
    screw protected by a sealed screw. The mechanical indicating device has five drums for DN 15 to DN
    32 and six drums for DN 40 and DN 50, plus four pointers. Optionally equipped with a reed impulse
    transmitter for remote reading. Installed in horizontal or vertical position only, with the indicating
    device positioned at the top, according to the used meter body.
