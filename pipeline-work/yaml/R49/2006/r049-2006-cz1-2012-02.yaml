certified_type:
  category: Water meter
  type_designations:
  - SJ-LFC
  - SJ-WDC
  description: >-
    Single jet rotary vane wheel water meters. Type SJ-WDC has a wet mechanical indicating device; type
    SJ-LFC has a semi-dry (Liquid Filled Calculator) indicating device with protected registered drums.
    The meters consist of a brass, bronze or plastic body with connecting threads, an inlet strainer,
    an optional adjusting screw, an adjusting button plate, a stainless steel shaft with plastic pivot,
    a rotary vane wheel and gears, and a mechanical indicating device formed by numbered rollers with
    5 drums and 4 rotary pointers (for SJ-LFC the drums are installed in a capsule filled with special
    liquid), a black star wheel with 6 arms for rapid testing, a rubber O-ring, a glass or plastic disc,
    a rubber gasket and a brass, bronze, steel or plastic head ring with a plastic cover. Optionally equipped
    with a reed impulse transmitter for remote reading, or pre-equipped for further installation. To be
    installed in horizontal position only with the indicating device on top.
