  category: Water meter
  type_designations:
  - ML-A
  - ML-AP
  description: >-
    Mechanical multi-jet dry dial water meter type ML-A; ML-AP intended for metering the volumes (consumption)
    of clean cold water in residential (households) and commercial use. Installed into pipe lines in horizontal
    installation positions. Housing: brass body for type ML-A or plastic body for type ML-AP.
