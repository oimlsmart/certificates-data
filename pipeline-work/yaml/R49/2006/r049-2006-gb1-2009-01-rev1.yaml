components:
- role: sensor
  type_designations:
  - Inductive pointer and sensor unit
  alternatives: OR
  characteristics:
    optional: true
    applicable_models:
    - V200
    - V210
    - V220
    description: >-
      Meter register is equipped with a metallic pointer on the first element of the verification scale.
      Two bosses and two holes on the shroud enable the option of an inductive sensor to be fitted to
      the meter shroud.
- role: sensor
  type_designations:
  - Reed switch sensor
  alternatives: OR
  characteristics:
    optional: true
    applicable_models:
    - V100
    - V110
    - V200
    - V210
    - V220
    description: >-
      Meter register is equipped with a magnetic pointer (magnet for V100/V110) on the first element of
      the verification scale. The reed switch sensor is fitted to the meter shroud (fitted in a pocket
      within the meter housing, in close proximity to the magnet, for V100/V110).
