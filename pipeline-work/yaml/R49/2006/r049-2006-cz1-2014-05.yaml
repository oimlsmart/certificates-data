certified_type:
  category: Water meter
  type_designations:
  - WPI-SDC
  module_designation:
  description: >-
    Single jet vane wheel water meters with the axis of the vane wheel perpendicular to the flow direction.
    Cast iron or ductile iron body with connecting flanges and an exchangeable measuring unit connected
    by a flange cover fixed by four screws and sealed by a rubber o-ring. The measuring unit consists
    of a plastic holder with bushes for an impeller, an impeller with a stainless steel shaft, a calibration
    plate, a transmission, a center gear with a magnetic coupling, an iron and brass (or full brass) flange
    cover with an adjusting screw, a turning plastic register house, and an upper plastic cover. Indicating
    device with six numbered drums, two rotary pointers and a star wheel with six arms for rapid testing
    (dry mechanical indicating device with plastic register or super dry mechanical indicating device
    with copper can register). Optionally equipped with a reed impulse transmitter for remote reading.
    To be installed in horizontal position with the indicating device positioned at the top.
