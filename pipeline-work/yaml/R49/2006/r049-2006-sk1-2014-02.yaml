certified_type:
  category: Water meter
  type_designations:
  - MD-A
  - MD-AP
  description: >-
    Mechanical multi-jet dry dial water meter intended for metering the volumes (consumption) of clean
    cold water in residential (households) and commercial use; installed into pipe lines in horizontal
    installation positions. Measuring mechanism: impeller with an axle perpendicular to the flow direction,
    lower and upper tightening plates with bearing hubs. Mechanical register: dry type, digital drum with
    gearing mechanism for all figures, 5 digits indication, 4 pointers of analog device. Housing: brass
    body (type MD-A) or plastic body (type MD-AP). Adjustment device enabled by hinge plug screw to regulate
    flow. Magnetic coupling. Non-essential parts: strainer in the inlet, optional non-return valve. Optional
    integrated equipment: pulse output with reed sensor switch. Software: not applicable.
