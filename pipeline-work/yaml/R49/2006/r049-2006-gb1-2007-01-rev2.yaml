components:
- role: inductive pointer and sensor unit
  type_designations: []
  alternatives:
  characteristics:
    optional: true
    applicable_models:
    - V200
    - V210
    description: >-
      The meter register is equipped with a metallic pointer on the first element of the verification
      scale. Two bosses and two holes on the shroud enable the option of an inductive sensor to be fitted
      to the meter shroud.
- role: reed switch sensor
  type_designations: []
  alternatives:
  characteristics:
    optional: true
    applicable_models:
    - V100
    - V110
    - V200
    - V210
    - V230
    description: >-
      The meter register is equipped with a magnetic pointer (V200, V210, V230) or magnet (V100, V110)
      on the verification scale. The reed switch sensor is fitted to the meter shroud (V200, V210, V230)
      or in a pocket within the meter housing in close proximity to the magnet (V100, V110).
- role: electronic non-resettable totalising register
  type_designations: []
  alternatives:
  characteristics:
    applicable_models:
    - V200H
    - V210H
    power_source: lithium cell
    display: 6+5 digit liquid crystal display
