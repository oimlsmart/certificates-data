certified_type:
  category: Water meter
  type_designations:
  - MJ-SDC
  - MJ-SDC (E)
  - MJ-SDC (E5)
  - MJ-SDC (G)
  - MJ-SDC (Z)
  description: >-
    Multi jet rotary vane wheel water meters with dry mechanical indicating device (Plastic Can Calculator)
    or super dry mechanical indicating device (Copper Can Calculator). Body variants: MJ-SDC (E), MJ-SDC
    (E5), MJ-SDC (G) and MJ-SDC (Z), each consisting of a brass, bronze, iron or plastic body with connecting
    threads or flanges, optional inlet strainer, adjusting screw, wet measuring unit, register chamber
    with magnetic protection ring(s), agate bearings, and a dry or super dry mechanical indicating device.
    The measuring unit consists of an internal strainer, a plastic distributor with tangential holes,
    a stainless shaft with plastic pivot and a rotary vane wheel with magnetic holder and plastic shaft.
    Indicating devices: numbered rollers with five drums and four rotary pointers (DN 15 to DN 32) or
    six drums and three or four pointers (DN 40 and DN 50), or eight drums with one/two rotary pointers.
    Optional reed impulse transmitter for remote reading. Installation in horizontal or vertical positions
    according to used meter body.
