components:
- role: optional register sensor
  type_designations:
  - Inductive pointer and sensor unit
  alternatives:
  characteristics:
    optional: true
    applicable_models:
    - V200
    description: >-
      The meter register is equipped with a metallic pointer on the first element of the verification
      scale. Two bosses and two holes on the shroud enable the option of an inductive sensor to be fitted
      to the meter shroud.
- role: optional register sensor
  type_designations:
  - Reed switch sensor
  alternatives:
  characteristics:
    optional: true
    applicable_models:
    - V200
    - V100
    description: >-
      The meter register is equipped with a magnetic pointer on the first element of the verification
      scale. The reed switch sensor is fitted to the meter shroud.
    description_v100: >-
      The meter register is equipped with a magnet on the first element of the verification scale. The
      reed switch sensor is fitted in a pocket within the meter housing, in close proximity to the magnet.
