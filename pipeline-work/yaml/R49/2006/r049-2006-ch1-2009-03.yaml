certified_type:
  category: Water meter
  type_designations:
  - AMFLO MAG Pro
  description: >-
    Family of electromagnetic flow meters intended for the metering of cold water. The family of water
    meters AMFLO MAG Pro covers the nominal diameters in the range of DN25 to DN200 consisting of 10 nominal
    diameters. The water meters are designed for a nominal pressure of 16 bar and a maximal water temperature
    of 60 °C. Designed for measuring the flow of electrically conductive mediums (water) by means of the
    electromagnetic flow measuring system. The conductive medium flows through a magnetic field which
    induces a voltage proportional to the mean flow speed as the magnitude of the magnetic field is kept
    constant and the nominal pipe diameter is a constant factor. The converter of the sensor manages the
    input and output signals and converts the data. Versions: Compact flow meter (converter and flow sensor
    fixed together) and Splitversion (converter and flow sensor connected via cable). The converter corrects
    the sensor linearly with the k-factor.
