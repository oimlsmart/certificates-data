certified_type:
  category: Water meter
  type_designations:
  - UW50
  description: >-
    Microprocessor controlled ultrasonic water meter intended for the metering of cold water (T30), in
    complete version or split version for the separate installation of the flow sensor and calculator
    on-site. The determination of the flow rate is based on the principle of the entrainment of ultrasonic
    waves; the path of the waves is continuously reflected and cyclic synchronized as the ultrasonic converter
    acts alternately as transmitter and receiver. The runtime difference allows the calculation of the
    flow rate, which is displayed by means of the software controlled microprocessor on the indicating
    device.
