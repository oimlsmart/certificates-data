certified_type:
  category: Water meter
  type_designations:
  - VK-12
  module_designation: Mechanical volumetric water meter
  description: >-
    Mechanical volumetric (rotary piston) water meter with dry-type mechanical indication device, designed
    to measure, memorize and display the volume of clean water passing through the measuring chamber at
    metering conditions; intended for residential use. Can be installed in horizontal and vertical positions;
    not designed to measure reverse flow. Brass body with inlet and outlet connections; magnetic coupling
    between register and measuring mechanism; optional integrated equipment (RF, M-Bus, Modbus, GPRS or
    Smart card and pulse output).
