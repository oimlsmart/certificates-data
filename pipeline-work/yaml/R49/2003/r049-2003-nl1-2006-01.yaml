certified_type:
  category: Water meter
  type_designations:
  - OPTIFLUX 2300C
  - OPTIFLUX 4300C
  - OPTIFLUX 2000F + IFC300
  - OPTIFLUX 4000F + IFC300
  description: >-
    Water meter intended for metering cold potable water, based on an electromagnetic principle, designed
    to measure reverse flow, with straight inlet and outlet lengths, with no flow conditioner, equipped
    with an electronic calculating/indicating device. Supplied as complete water meter (OPTIFLUX x300C)
    or combined water meter (OPTIFLUX x000F + IFC300), with x being 2 or 4.
