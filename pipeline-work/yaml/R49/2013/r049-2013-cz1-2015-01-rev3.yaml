certified_type:
  category: Water meter
  type_designations:
  - 280W-…
  - 280W-R
  module_designation:
  description: >-
    The ultrasonic water meters type 280W-R intended for metering cold potable water, based on an ultrasonic
    transit-time principle, with straight inlet (5 times the diameter) and outlet (3 times the diameter)
    length, without flow conditioner and equipped with an electronic calculating/indicating device. The
    display shows the measurements in cubic meter volume and cubic meter per hour flow rate. The meter
    is not designed to measure reverse flow. The meter does not require any extra-mechanical housing or
    adjustments. The meter is intended for mount to the connecting horizontal, vertical and diagonal pipework
    with the flow axis in the horizontal, vertical and diagonal plane and with the indicating device positioned
    at the top and at the side. The meter is equipped with the electronic indicating device. The display
    is a digital type, and can show up to 9 digits. The meter has two indication modes: high resolution
    mode (used during calibration) and normal resolution mode. In the high resolution mode the water meter
    displays the volume resolution of 0.000001 m³ on the digital display. In the normal resolution mode
    the water meter displays up to 000000.001 m³/h flow rate and 0000000.01 m³ volume on the digital display.
    The water meters type 280W-R can be equipped by M-bus transmitter which can be used for remote reading.
