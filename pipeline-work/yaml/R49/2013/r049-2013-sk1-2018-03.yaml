certified_type:
  category: Water meter
  type_designations:
  - SP
  module_designation: Multi jet water meter intended for the metering of cold and hot potable water
  description: >-
    Mechanical multi-jet dry dial water meter type SP designed to measure, memorise and display the volume
    of water passing through the measurement transducer at metering conditions; intended for measurement
    of volumes (consumption) of clean cold and hot water in residential use. Multi-jet rotary vane wheel
    water meter with dry mechanical indication device (5 numbered drums with last significant drum moving
    continuously and 4 continuously moving rotating pointers), brass or plastic housing, adjustment screw
    on the housing regulating the internal by-pass flow, and magnetic coupling between register and impeller.
    Installed in pipe lines in horizontal position only with the indicating device positioned on top;
    not designed to measure reverse flows. Optional parts: strainer at the inlet, non-return valve in
    the outlet tube, data output module (RS485, RS232, M-bus), pulse output module and pre-payment unit
    (ancillary device / pre-setting device according to clause 3.1.10 of OIML R 49-1; not assessed under
    this certificate and not considered metrologically relevant). Manufacturer trademarks: AIMEI, ASM.
