certified_type:
  category: Water meter
  type_designations:
  - MT-15P
  - MT-20P
  module_designation: Mechanical volumetric water meters
  description: >-
    The mechanical water meters type MT-15P and MT-20P are designed to measure, memorise and display the
    volume of water passing through the measurement transducer at metering conditions. They are mechanical
    volumetric (rotary piston) water meters intended for the measurement of volumes of clean water for
    residential and commercial use. The water meters can be installed to operate in horizontal position
    and vertical position; the water meter is not designed to measure the reverse flow.
