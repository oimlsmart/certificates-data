    Compact ultrasonic water meter with electronic indication device, based on the ultrasonic bidirectional
    transit-time principle, designed to measure, memorise and display the volume of cold potable water
    in residential use; can be installed in all positions; not designed to measure reverse flow; non-resettable
    measurements between two constant partners.
