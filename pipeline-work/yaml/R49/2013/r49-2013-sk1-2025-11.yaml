  - UWM 2401-50
  module_designation: Ultrasonic water meter
  description: >-
    Compact ultrasonic water meters UWM 2401-15 to UWM 2401-50 with electronic indication device, designed
    to measure, memorize and display the volume of clean water passing through the measurement transducers
    at metering conditions, for residential use. Measurement based on ultrasonic bidirectional transit-time
    principle (difference in time-of-flight of ultrasonic pulses downstream and upstream). Installable
    in horizontal and vertical positions; not designed to measure reverse flow.
