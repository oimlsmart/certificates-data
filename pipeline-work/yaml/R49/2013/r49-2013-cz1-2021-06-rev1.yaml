certified_type:
  category: Water meter
  type_designations:
  - Topas SONIC (TSO)
  - TOPAS Sonic
  module_designation: Not applicable
  description: >-
    Ultrasonic water meters designed to measure, memorise and display the volume at metering conditions
    of water passing through the measurement transducer. The meters consist of a brass body with connecting
    screw threads, one pair of ultrasonic transducers and an electronic indicating device formed by an
    LCD display showing volume and flow. Volume resolution of 0.001 m³ on the digital display. No buttons;
    legally non-relevant communication via NFC sensor connected on the register. Software separation with
    SW version and CRC of the legally relevant part displayed in the auto-rounding menu on the LCD. Displays
    separately delivered volume for reverse flow and forward flow every ten seconds. Powered by a 3.6
    V DC battery. Can be installed in arbitrary positions.
