certified_type:
  category: Water meter
  type_designations:
  - MAGB1
  module_designation:
  description: >-
    Electromagnetic water meter for metering cold and hot potable water, based on the inductive principle,
    with PTFE and hard rubber lining, straight inlet (5 x DN) and outlet (3 x DN) lengths, without flow
    conditioner, equipped with an electronic calculating/indicating device. Two modifications: compact
    and remote version (maximum cable length 6 m for the remote version; optional frequency output for
    remote reading). Digital display with up to 9 digits shows volume in m³ (positive, negative, total
    and auxiliary) and flow rate in m³/h; a high-resolution mode (0.001 L) for calibration is set by factory
    software. Not designed to measure reverse flow; no extra-mechanical housing or adjustments required.
    Mounting with flow axis horizontal or vertical (bottom-to-top and top-to-bottom), indicating device
    positioned at the top or at the side. Sealed at the screw-connected cover plate inside the electronics
    and at the screw covering the USB port.
