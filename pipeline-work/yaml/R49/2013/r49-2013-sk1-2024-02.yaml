certified_type:
  category: Water meter
  type_designations:
  - LXSZ
  - LXSZ-15
  - LXSZ-20
  - LXSZ-25
  module_designation: Mechanical multi-jet water meter
  description: >-
    Mechanical multi-jet wet-dial water meter designed to measure, memorize and display the volume of
    clean water passing through the measurement transducers at metering conditions; intended for residential
    and commercial use. Rotary movement of the turbine wheel (impeller) is transmitted through the gear
    transmission to the wet-type register indicating the measurement results. Installed in horizontal
    position with the indicating device positioned at the top; not designed to measure reverse flow. Non-essential
    parts: prepaid part mounted above the mechanical water meter, valve for prepaid part, LoRa RF wireless
    communication, reserved infrared communication.
