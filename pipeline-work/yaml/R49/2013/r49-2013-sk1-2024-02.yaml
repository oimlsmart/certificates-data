components:
- role: measuring mechanism
  characteristics:
    description:
      value: >-
        Impeller with an axle perpendicular to the flow direction; rotary movement transmitted through
        the gearing to the mechanical counter
      unit_symbol:
      unit_id:
- role: register and indicating device
  characteristics:
    description:
      value: >-
        Wet-dial mechanical register with 5 numbered drums (least significant drum moves continuously)
        and 4 continuously moving rotating pointers
      unit_symbol:
      unit_id:
- role: pulse counter
  characteristics:
    description:
      value: >-
        Rotating plum needle with infrared device; number of revolutions used to calculate the volume
        of water flowed (for calibration of the water meter)
      unit_symbol:
      unit_id:
- role: prepaid part (non-essential)
  characteristics:
    description:
      value: Mounted above the mechanical water meter; includes valve, module, battery and LCD display
      unit_symbol:
      unit_id:
