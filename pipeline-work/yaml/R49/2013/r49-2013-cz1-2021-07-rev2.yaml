certified_type:
  category: Water meter
  type_designations:
  - GKMV40
  - GKMV40P
  module_designation: Not applicable
  description: >-
    Positive displacement water meters with dry mechanical indicating device. Brass (type GKMV40) or composite
    (type GKMV40P) body with connecting screw threads, inlet strainer, wet volumetric chamber with oscillating
    piston, magnetic coupling (wet and dry side), O-ring, pressure plate closing the wet part, magnetic
    shields, mechanical indicating device formed by numbered rollers with eight drums and one pointer,
    register cap and clamp on cover. Shall be installed to operate in any positions; not designed to measure
    reverse flow.
