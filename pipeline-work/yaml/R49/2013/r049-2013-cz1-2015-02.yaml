  - DS 04 TAR
  module_designation:
  description: >-
    Multi jet rotary vane wheel water meters with dry mechanical indicating device (plastic can calculator)
    or super dry mechanical indicating device (plastic can calculator or copper can calculator). DS 90
    TAR and DS 04 TAR consist of a brass, bronze, iron or plastic body with connecting threads or flanges
    and inlet strainer, an adjusting screw, a wet measuring unit, a register chamber with two magnet shields
    and two corundum bearings, two O-rings, a dry mechanical indicating device, a tempered glass, two
    fixed rings, a sliding gasket and a brass, bronze or plastic cap with a lid. DS 97 TAR consist of
    a brass, bronze or plastic body with connecting threads and inlet strainer, an adjusting screw, a
    wet measuring unit, a pressure plate with magnet shield, a shield gasket, an O-ring and a separating
    plate with corundum bearings, a super dry mechanical indicating device with transparent plastic cover
    (plastic can calculator) or with copper can with tempered glass (copper can calculator), an O-ring,
    a lower plate with an agate bearing and a plastic cap with a plastic lid. Adjustment is made by an
    adjusting screw covered by an adjusting plug. Intended for mounting to horizontal pipework with the
    flow axis in the horizontal plane and the indicating device positioned at the top. Indicating devices:
    numbered rollers with five drums and four rotary pointers (DN15-DN32) or six drums and three or four
    rotary pointers (DN40-DN50), or eight drums with one rotary pointer (DN15-DN32) or one or two rotary
    pointers (DN40-DN50); calculators can be designated for inclined reading; a ten-armed star wheel is
    available for rapid testing. The water meters can be equipped with a reed impulse transmitter for
    remote reading. Markings: unit of measurement (m³), numerical value Q3 and ratio Q3/Q1 (R80, R50),
    OIML certificate of conformity number, manufacturer trademark, year of manufacture and serial number,
    direction of flow arrow, maximum admissible pressure (MAP 16), letter H, temperature class (T50, T30).
    The connection of the adjusting plug and the brass ring of the meter has to be sealed.
