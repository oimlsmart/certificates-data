certified_type:
  category: Water meter
  type_designations:
  - KWM2210
  - flowIQ® 2200
  module_designation: Not applicable
  description: >-
    KWM2210 is a family of integrated and hermetically sealed static water meters based on the ultrasonic
    measuring principle ranging from 1.6 m³/h to 4.0 m³/h. The meter body is made of PPS composite material.
    The volume measurements are made by means of bidirectional ultrasonic technique according to the transit
    time method. KWM2210 has a display indicating the registered volume, measuring unit, error codes and
    more. Furthermore, an optical eye is located on the front, whereby data reading of data loggers and
    configuration of the meter can be made for service and diagnostic purposes. KWM2210 is power supplied
    from an internal lithium battery with a lifetime up to 16 years. A separate pulse interface can be
    used for converting the data telegram into volume pulses during calibration of the meter.
