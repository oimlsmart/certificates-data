certified_type:
  category: Water meter
  type_designations:
  - MA408K
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meter MA408K with electronic indication device, with internal
    valve for local control and remote control. Measurement is based on the ultrasonic bidirectional transit-time
    principle (difference in time-of-flight of ultrasonic pulses downstream and upstream). Measures, memorizes
    and displays the volume of clean water passing through the measurement transducers at metering conditions.
    Can be installed in horizontal and vertical positions; reverse flow measurement is not relevant.
