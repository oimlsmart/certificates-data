components:
- role: flow_sensor
  type_designations: []
  characteristics:
    description: >-
      Brass cylindrical body with inlet and outlet firmly with the plastic housing for the calculator;
      inner plastic measuring support elements (pipe support down and up); two reflection sheets installed
      in the centre of the pipe; two ultrasonic transducers at the upstream and downstream of the measurement
      channel to transmit and receive ultrasonic signals.
- role: calculator_and_indication_device
  type_designations: []
  characteristics:
    description: >-
      Plastic housing of the calculator with indication device directly mounted on the flow sensor; PCBA
      board; electronic scrolling LCD display (by button) with 11 digits and indication range 99999999.999
      m³; two non-replaceable lithium batteries supply the metrology part and application functions (communication,
      detection, control, display).
- role: internal_valve
  type_designations: []
  characteristics:
    description: Internal valve for local control and remote control (non-essential part).
- role: valve_motor
  type_designations: []
  characteristics:
    description: Motor for operating the valve (non-essential part).
- role: strainer
  type_designations: []
  characteristics:
    description: Strainer (non-essential part).
- role: optical_port
  type_designations: []
  characteristics:
    description: Optical port for communication (non-essential part).
