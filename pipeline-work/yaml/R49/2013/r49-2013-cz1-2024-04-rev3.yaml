certified_type:
  category: Water meter
  type_designations:
  - LXC
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter consisting of a brass body with screw threads, a pair of ultrasonic transducers
    and an electronic indicating device formed by an LCD display equipped with a photosensitive button
    for rapid test; the display shows the delivered volume for forward flow as default. Two-part plastic
    cover with protruding brass screw threads, connected by two screws. Powered by a permanent battery
    with voltage 3.6 V and lifetime 10 years. Installation positions: H↑ horizontal with indicating device
    at top; H→ horizontal with indicating device at side; V↑ vertical with flow from bottom to top and
    indicating device at side.
