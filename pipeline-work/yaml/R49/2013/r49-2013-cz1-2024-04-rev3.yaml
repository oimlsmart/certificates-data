- name: LCD display symbols
  columns:
  - symbol
  - meaning
  column_units:
  -
  -
  description: Legend of symbols shown on the LCD display of the electronic indicating device
  footnotes: []
  rows:
  - symbol: 'signal strength icon: three bars'
    meaning: Strong signal strength, normal communication
  - symbol: 'signal strength icon: two bars'
    meaning: Good signal strength, normal communication
  - symbol: 'signal strength icon: one bar'
    meaning: Poor signal strength, unable to guarantee normal communication
  - symbol: 1↓
    meaning: Data Transfer through LoRaWAN network
  - symbol: warning triangle icon
    meaning: Warning (error) message occur in meter
  - symbol: arrow icon with ✓
    meaning: Pipe is full of water
  - symbol: arrow icon with ×
    meaning: Pipe is empty
  - symbol: battery icon, full
    meaning: Sufficient battery capacity
  - symbol: battery icon, medium
    meaning: Normal battery capacity
  - symbol: battery icon, low
    meaning: Low battery capacity alarm
  - symbol: "°C"
    meaning: Water temperature
  - symbol: kPa
    meaning: Water pressure (This feature is not supported)
  - symbol: L
    meaning: Constant display represents volume unit. Flashing indicates the meter is in verification
      mode
  - symbol: m³
    meaning: Volume unit
  - symbol: m³/h
    meaning: Flow rate
  - symbol: Bluetooth symbol
    meaning: >-
      Bluetooth (we use it internally as a symbol for Infrared communication) (This feature is not supported)
  - symbol: magnetic interference icon
    meaning: Magnetic interference (This feature is not supported)
  - symbol: water drops icon
    meaning: Water leak (This feature is not supported)
  - symbol: currency icon
    meaning: currency symbol (This feature is not supported)
  - symbol: valve icon, open
    meaning: Valve open (This feature is not supported)
  - symbol: valve icon, closed
    meaning: Valve closed (This feature is not supported)
