certified_type:
  category: Water meter
  type_designations:
  - PD97TRP
  module_designation:
  description: >-
    Rotary piston water meters type PD97TRP designed to measure, memorise and display the volume at metering
    conditions of water passing through the measurement transducer. Semi positive displacement rotary
    piston water meters with wet mechanical indicating device with protected registered drums. Consist
    of a brass body (divided into two parts connected by screw) with connecting screw threads, an inlet
    strainer, a non return valve, a wet measuring unit with a piston and mechanical transmission, rubber
    O-ring, and a mechanical indicating device protected by a plastic cover, formed by numbered rollers
    with eight drums installed in a capsule filled with water and glycerine. Can be installed to operate
    in any position with the flow axis in the horizontal, vertical (from bottom to top and from top to
    bottom) and inclined plane, with the indicating device positioned at the top and at the side. Not
    designed to measure reverse flow. Can be equipped by a reed impulse transmitter for remote reading,
    which was not tested.
