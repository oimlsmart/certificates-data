components:
- role: measurement transducer (sensor)
  type_designations:
  - MS2500
  alternatives:
  characteristics:
    construction: >-
      Steel body with connecting flanges, one pair of excitation coils, electrodes and connection to the
      converter
    liner_options:
    - liner: PTFE
      nominal_diameters:
        min: 25
        max: 350
      water_temperature:
        value: 90
        unit_symbol: "°C"
    - liner: Polypropylene
      nominal_diameters:
        min: 25
        max: 150
      water_temperature:
        value: 50
        unit_symbol: "°C"
    - liner: Rilsan
      nominal_diameters:
        min: 50
        max: 350
      water_temperature:
        value: 50
        unit_symbol: "°C"
    - liner: Ebonite
      nominal_diameters:
        min: 200
        max: 350
      water_temperature:
        value: 50
        unit_symbol: "°C"
- role: converter (electronic calculator and indicating device)
  type_designations:
  - MV110
  alternatives:
  characteristics:
    construction: Plastic and aluminium body, connection to the sensor
    display: LCD display showing volume and flow
    displayed_volume_resolution:
      value: 0.001
      unit_symbol: m³
    controls: Three buttons
    interfaces:
    - impulse output
    - current output
    - RS485
    - USB mini-B
    power_supply_variants:
    - MS2500 / MV110 HV
    - MS2500 / MV110 LV
    - MS2500 / MV110 LLV
