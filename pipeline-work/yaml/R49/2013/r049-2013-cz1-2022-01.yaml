certified_type:
  category: Water meter
  type_designations:
  - MS2500 / MV110
  module_designation: MS2500 / MV110 HV; MS2500 / MV110 LV; MS2500 / MV110 LLV
  description: >-
    Electromagnetic water meters MS2500 / MV110 designed to measure, memorise and display the volume of
    water at metering conditions. Consist of sensor MS2500 and converter MV110 in compact set-up or separate
    version with connecting cable. Sensor: steel body with connecting flanges, one pair of excitation
    coils, electrodes; available with PTFE, polypropylene, Rilsan or ebonite liner. Converter: plastic
    and aluminium body with LCD display showing volume and flow, impulse and current outputs, RS485 or
    USB mini-B interfaces, password-protected settings. Power-supply variants: HV (100-240 V AC), LV (24-36
    V AC/DC), LLV (10-48 V DC). Can be installed in any position.
