certified_type:
  category: Water meter
  type_designations:
  - KWM2231
  module_designation: Not applicable
  description: >-
    KWM2231 is a family of integrated and hermetically sealed static water meters based on the ultrasonic
    measuring principle, ranging from 1.6 m³/h to 4.0 m³/h permanent flow rate. The meter body is made
    of PPS composite material and volume measurement is performed by bidirectional ultrasonic transit
    time technique. The meter has a display indicating the registered volume, measuring unit and error
    codes, and an optical eye on the front for data reading and configuration for service and diagnostic
    purposes. It is powered by internal lithium batteries (2 x A-cell); a separate pulse interface can
    be used for converting the data telegram into volume pulses during calibration.
