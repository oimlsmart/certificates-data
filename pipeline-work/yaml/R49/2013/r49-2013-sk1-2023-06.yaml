components:
- role: flow_sensor
  type_designations: []
  alternatives:
  characteristics:
    measuring_principle: electromagnetic (Faraday's law of induction)
    description: >-
      Electromagnetic transducer: stainless-steel body with inlet and outlet, two magnets for the magnetic
      field, two measurement electrodes, grounding wire on the flanges connected with the grounding device
- role: calculator_and_indication_device
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Converter with stainless-steel base: PCB circuit board for transfer between sensors and circuit
      boards, PCB circuit board for calculation and output, electronic LCD display with two lines, magnet
      with menu operation button, battery box
    display_volume_digits: 9
    display_flow_digits: 5
    communication_interface: RS485
- role: non_essential_part
  type_designations:
  - RS485 communication
  - antenna
  alternatives: OR
  characteristics: {}
