certified_type:
  category: Water meter
  type_designations:
  - YYD-S
  module_designation: Electromagnetic water meters with electronic indication device
  description: >-
    The water meter YYD-S is a residential compact electromagnetic water meter with electronic indication
    device, designed to measure, store and display the volume of clean water passing through the measurement
    transducers at metering conditions. The measurement is based on the electromagnetic principle (Faraday's
    law of electromagnetic induction). The meter is installed in horizontal position, is equipped with
    a ground electrode or ground ring, and is designed to measure reverse flow. Non-essential parts: RS485
    communication and antenna.
