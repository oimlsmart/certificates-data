certified_type:
  category: Water meter
  type_designations:
  - LXC-15
  - LXC-20
  - LXC-25
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device designed to measure, memorise and
    display the volume of clean water in residential use. Measurement based on ultrasonic bidirectional
    transit-time principle (difference in time-of-flight of ultrasonic pulses downstream and upstream).
    Can be installed horizontally (indication device on top) or vertically. Not designed to measure reverse
    flow.
