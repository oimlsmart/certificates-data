  text: >-
    U represents V; 15 / 20 represents DN; 10248 / 10253: 102 represents numbers of software version and
    48 / 53 represent checksums
- marker: "**) "
  text: 61 represents checksum (for DN25); 8000 represents software version (for DN25)
