components:
- role: flow_sensor
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Brass cylindrical body with inlet and outlet firmly connected with the plastic housing for the calculator;
      inner plastic elements with two reflection sheets installed in the centre of the pipe; two ultrasonic
      transducers at the upstream and downstream of the measurement channel
- role: calculator_and_indication_device
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Plastic housing with indication device directly mounted on the flow sensor; magnetic sensing area
      (magnetic buttons) or light photo sensitive buttons; PCB board; electronic scrolling LCD display
      with 8 digits (LXC-15, LXC-20) or 9 digits (LXC-25); one non-replaceable lithium battery
