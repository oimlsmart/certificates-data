certified_type:
  category: Water meter
  type_designations:
  - MAGB2
  module_designation: Not applicable
  description: >-
    Electromagnetic (inductive) water meters type MAGB2, available in compact and remote versions, consisting
    of a flow sensor and an electronic calculating/indicating device. Flow sensor works on the induction
    principle with PTFE and hard rubber lining, straight inlet (0 times the diameter) and outlet (0 times
    the diameter), without flow conditioner; maximum cable length for the remote version is 10 m; designed
    to measure reverse flow. Digital display shows up to 10 digits in two lines, equipped with 6 buttons;
    normal resolution mode shows 0.001 m³ volume (and 0.001 m³/h flow rate); high resolution mode (used
    during calibration, set via factory tool secured by user, service and factory passwords) shows volume
    resolution of 0.001 L. Software version shown after reset; checksum viewable via menu Info – FW Checksum.
    May be installed in arbitrary positions with the flow axis horizontal or vertical (bottom-to-top and
    top-to-bottom) with the indicating device at the top or at the side. Optionally equipped with frequency
    output for remote reading and RS 485 (maximum cable length 30 m).
