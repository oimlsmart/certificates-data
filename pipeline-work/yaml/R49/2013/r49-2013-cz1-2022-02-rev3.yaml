certified_type:
  category: Water meter
  type_designations:
  - MS2500 / MV110
  - MS2500 / MV145
  module_designation: >-
    MS2500 / MV110 HV; MS2500 / MV110 LV; MS2500 / MV110 LLV; MS2500 / MV145 HV + lit. battery; MS2500
    / MV145 LLV + alk. battery; MS2500 / MV145 LLV + lit. battery
  description: >-
    Electromagnetic water meter designed to measure, memorise and display the volume of water at metering
    conditions. Consists of sensor MS2500 (steel body with flanges, one pair of excitation coils, electrodes;
    optional PTFE, Polypropylene, Rilsan or Ebonite liner) and converter MV110 or MV145 (plastic/aluminium
    body, LCD display, impulse and current outputs, RS485 / USB mini-B interfaces), in compact or separate
    version with connecting cable. Security seals on converter cover (mini USB-B) and housing; paired
    via COUP. numbers in separate version.
