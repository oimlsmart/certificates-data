components:
- role: measurement transducer (sensor)
  type_designations:
  - MS2500
  alternatives:
  characteristics:
    construction: steel body with connecting flanges, one pair of excitation coils, electrodes
    liner_options:
    - PTFE
    - Polypropylene
    - Rilsan
    - Ebonite
- role: converter (calculating device with electronic indicating device)
  type_designations:
  - MV110
  - MV145
  alternatives: OR
  characteristics:
    display: LCD (volume and flow)
    outputs:
    - impulse output
    - current output
    communication_interfaces:
    - RS485
    - USB mini-B
    controls: three buttons, password-protected security levels
