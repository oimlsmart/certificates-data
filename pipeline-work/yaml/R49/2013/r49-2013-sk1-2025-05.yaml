certified_type:
  category: Water meter
  type_designations:
  - SCL-61HF-100
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device designed to measure, memorise and
    display the volume of clean water passing through the measurement transducer at metering conditions,
    intended for residential use. Measurement is based on the ultrasonic bidirectional transit-time principle
    (difference in time-of-flight of ultrasonic pulses downstream and upstream). Can be installed in horizontal
    position with indication device on top or in vertical position; not designed for measurement of reverse
    flow. Integrated equipment and functions: optical interface, NB-IoT, M-Bus, RS-485, RF/Pulse/Sigfox
    (optional), LoRaWAN, W-MBus. Protected against unauthorized manipulation by two lead seals.
