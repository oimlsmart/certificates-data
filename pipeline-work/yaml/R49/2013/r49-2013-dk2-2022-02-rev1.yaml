certified_type:
  category: Water meter
  type_designations:
  - KWM4230
  module_designation: Not applicable
  description: >-
    KWM4230 is an integrated and hermetically sealed static water meter based on the ultrasonic measuring
    principle. The meter body is made of a composite housing combined with a body fully made of stainless
    steel and equipped with black coated split flanges made in cast iron. Volume measurements are made
    by means of bidirectional ultrasonic technique according to the transit time method. The meter has
    a display indicating the registered volume, measuring unit, error codes and more, plus an optical
    eye on the front for data reading and configuration. It is powered by 2 x D-cell batteries (replaceable)
    and provides a separate pulse interface for converting the data telegram into volume pulses during
    calibration of the meter.
