certified_type:
  category: Water meter
  type_designations:
  - LXCZ
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Ultrasonic water meter type LXCZ (family DN15, DN20, DN25) designed to measure, memorize and display
    the volume of water passing through the measurement transducers at metering conditions; intended for
    measurement of clean water volume in residential use. Compact residential ultrasonic water meter with
    electronic indication device; measurement based on ultrasonic bidirectional transit-time principle,
    flow measured by double-pulse system with positive and negative pulses depending on flow direction.
    Can be installed in horizontal and vertical position; not designed to measure reverse flow. Essential
    parts: brass cylindrical body firmly connected with plastic calculator housing and inner plastic pipe
    supports; flow sensor with two reflection sheets in the centre of the brass pipe section and two ultrasonic
    transducers upstream and downstream; calculator with PCB, electronic scrolling 8-digit LCD with indication
    range 99999.999 m³ and one replaceable lithium battery (Umax 3.6 V, nominal capacity 19 Ah, 10 years
    lifetime). Non-essential parts/options: filter, internal valve, motor for valve, strainer, remote
    controller for communication, pressure sensor (optional, with two non-replaceable batteries), wireless
    communication interfaces (IR, Bluetooth, WM-Bus, LoRa, LoRaWAN, NB-IoT Standard, GPRS, Cat.1, Sigfox)
    and pre-payment system.
