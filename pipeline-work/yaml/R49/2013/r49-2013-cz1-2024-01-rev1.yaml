certified_type:
  category: Water meter
  type_designations:
  - GWU
  - GWU001
  - GWU002
  - Salil
  - Intellisonic
  module_designation: Not applicable
  description: >-
    The water meters type GWU are ultrasonic water meters with an electronic indicating device, designed
    to measure, memorise and display the volume at metering conditions of water passing through the measurement
    transducer. They are also manufactured under the Model / Product names Salil / Intellisonic. The family
    covers the nominal diameters DN15 and DN20. The meters are fitted with an easily readable 9-digit
    LCD with measuring units and information field, and a 3.6 V Lithium thionyl chloride battery. An impulse
    output via optical port is optional. The meters may be installed to operate in any positions. The
    meter has a separation of software; the version and CRC of the legally relevant SW are displayed in
    the auto-rounding menu on the LCD.
