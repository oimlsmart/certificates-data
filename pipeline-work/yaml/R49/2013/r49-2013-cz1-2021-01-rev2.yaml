certified_type:
  category: Water meter
  type_designations:
  - LXSG-xxE5/RLN1
  - LXSG-xxE5/S/RLN1
  - LXSG-xxE5/RLN2
  - LXSG-xxE5/S/RLN2
  module_designation: Not applicable
  description: >-
    Multi jet rotary vane wheel water meters with dry mechanical indicating device types RLN1 and RLN2.
    Brass body (LXSG-xxE5/RLN1, LXSG-xxE5/RLN2) or plastic body (LXSG-xxE5/S/RLN1, LXSG-xxE5/S/RLN2) with
    connecting screw threads, inlet strainer and adjusting screw, wet measuring unit with plastic distributor
    with tangential holes and shaft, rotary vane wheel and cover plate, magnetic coupling, magnetic shields,
    mechanical indicating device with pointers and numbered drums, plastic cover with lid. Adjustment
    by adjusting screw protected by sealed screw. To be installed in horizontal position only with the
    indicating device at the top. Sealed by connecting the plastic cover to the adjusting screw using
    a wire with a lead (plastic) seal.
