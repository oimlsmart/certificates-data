  description: >-
    Ultrasonic water meter type UWM (meter photo in Fig. 1 marked 'Ultrasonic Water Meter Model UWM-Cr3'),
    battery powered, calculator and indicating device housed in a plastic housing; body of brass or plastic.
    Protected against unauthorised manipulation and opening by a wire seal securing the connection between
    upper and lower part of the plastic housing of the calculator and indication device (lead seal or
    plastic seal variants, Fig. 3). Marked data per section 4 (manufacturer, type, m³, year/serial number,
    Q3 and ratio Q3/Q1, flow direction arrow, MAP, temperature class, pressure loss class, replacement
    date, environmental and electromagnetic class, national approval sign). Manufacturer may use trademarks:
    AIMEI, ASM, A/S/M ®, A/S/M ® AIMEI, Ⓢ ®, Ⓢ ® AIMEI.
