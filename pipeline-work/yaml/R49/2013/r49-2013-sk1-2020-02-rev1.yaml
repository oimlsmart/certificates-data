components:
- role: flow_sensor
  characteristics:
    body: cylindrical brass body or plastic body (alternatives) with inlet and outlet threaded connections
    measurement_element: inner plastic element with two mirrors (sound path) placed in the cylindrical
      body
    sensors: two ultrasonic sensors placed on the upside of the cylindrical body
- role: calculator_and_indication_device
  characteristics:
    housing: plastic housing of the calculator with indication device directly mounted on the flow sensor
    electronics: main PCB board with LCD display and optical sensor
    display: >-
      electronic LCD non-permanent (automatic scrolling) display with 10 digits; sub-multiples of a cubic
      meter indicated by the comma and top and bottom lines
    power_source: >-
      non-replaceable lithium batteries with end-of-life indicator activated based on pre-calculated power
      consumption
