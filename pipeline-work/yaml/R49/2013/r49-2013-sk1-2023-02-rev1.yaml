components:
- role: Flow sensor
  type_designations: []
  characteristics:
    body: >-
      plastic cylindrical brass body with inlet and outlet firmly connected with the plastic housing for
      the calculator
    sound_path: inner plastic element with two mirrors placed in the cylindrical plastic body
    transducers: two ultrasonic transducers placed on the upside of the cylindrical plastic body
- role: Calculator and indication device
  type_designations: []
  characteristics:
    mounting: plastic housing of the calculator with indication device directly mounted on the flow sensor
    electronics: three PCB boards and one PCB with calculator
    display: electronic LCD display with 2 lines
