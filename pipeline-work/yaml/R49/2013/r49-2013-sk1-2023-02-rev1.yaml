  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device, designed to measure, memorise and
    display the volume of clean water in residential use at metering conditions. Measurement based on
    the ultrasonic bidirectional transit-time principle. Non-resettable measurement between two constant
    partners. Can be installed in horizontal and vertical positions; not designed to measure reverse flow.
    Non-essential parts: antenna; non-return valve (optional).
