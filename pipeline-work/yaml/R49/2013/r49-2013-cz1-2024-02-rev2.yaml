certified_type:
  category: Water meter
  type_designations:
  - sonico NANO
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter with dry dial and electronic indicating device, designed to measure, memorise
    and display the volume at metering conditions of water passing through the measurement transducer.
    Consists of a cast brass body with connecting screw threads, one pair of ultrasonic transducers and
    an electronic indicating device with LCD display showing volume and flow. Volume resolution of 0.00001
    m³ on the digital display; no buttons; legally non-relevant communication via NFC sensor connected
    on the register. Software separation is implemented. Displays volume indications every two minutes
    separately for reverse and forward flow; permanently shown volume is the difference between the two.
    Optional impulse module is not part of this certificate. Powered by a 3.6 V battery. May be installed
    in any positions.
