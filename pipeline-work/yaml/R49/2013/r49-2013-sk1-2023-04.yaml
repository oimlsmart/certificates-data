certified_type:
  category: Water meter
  type_designations:
  - U-WR2 series
  - U-WR2-15
  - U-WR2-20
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meters with electronic indication device, designed to measure,
    memorize and display the volume of clean water passing through the measurement transducers at metering
    conditions. Measurement is based on the ultrasonic bidirectional transit-time principle (difference
    in time-of-flight of ultrasonic pulses downstream and upstream). The meters can be installed to operate
    in all positions and are not designed to measure reverse flow.
