components:
- role: measuring sensor
  type_designations:
  - MUT1000EL
  - MUT2200EL
  - MUT2300
  alternatives: OR
  characteristics:
    measuring_tube:
    - condition: MUT1000EL
      value: full bore (without flanges)
    - condition: MUT2200EL
      value: full bore (with flanges)
    - condition: MUT2300
      value: reduced bore
    accuracy_class:
    - condition: MUT2200EL
      value: 2
    - condition: MUT2300
      value: 1
- role: electronic converter (indicating device)
  type_designations:
  - MC406M
  - MC406AM
  alternatives: OR
  characteristics:
    mounting_versions:
    - condition: MC406M
      value: compact or remote
    - condition: MC406AM
      value: compact or remote
    optional_hardware_module: Bluetooth&RS485 and/or 4-20 mA output
