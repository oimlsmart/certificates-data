certified_type:
  category: Water meter
  type_designations:
  - MAG5100W
  - MAG3100
  - MAG8000CT
  module_designation: Not applicable
  description: >-
    Complete water meter consisting of an electromagnetic flow sensor (MAG5100W DN50-300 or MAG3100 DN350-600)
    and a signal transmitter (MAG8000CT). A constant pulsed DC current through the coil circuit generates
    a magnetic field through the sensor bore; a conductive liquid passing through the field induces a
    differential DC voltage between the measuring electrodes. The sensor has a steel tube and steel flanges
    with an electrically insulating lining. An optional wireless communication module is available.
