certified_type:
  category: Water meter
  type_designations:
  - LXSG-15
  module_designation: Multi jet water meter intended for the metering of cold potable water
  description: >-
    Mechanical multi-jet rotary vane wheel water meter with dry mechanical indication device and brass
    body, designed to measure, memorise and display the volume of clean cold potable water passing through
    the measurement transducer at metering conditions, for residential use. Shall be installed to operate
    in the horizontal position only with the indication device positioned at the top; not designed to
    measure reverse flow. Essential parts: measuring mechanism (measuring chamber and rotary vane wheel/impeller
    with axle perpendicular to flow direction); dry-type mechanical register and indication device with
    5 numbered black drums for cubic meters and 4 continuously moving red pointers for sub-multiples of
    a cubic meter; housing with inlet and outlet connections; magnetic coupling between register and measuring
    mechanism; adjustment screw regulating the internal by-pass flow; filter fitted at the inlet.
