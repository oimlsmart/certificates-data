components:
- role: Measuring mechanism
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Consisting of the measuring chamber and the rotary vane wheel (impeller) with an axle perpendicular
      to the flow direction
- role: Register and indication device
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Liquid sealed mechanical register and indication device with 4 numbered drums (last significant
      drum moves continuously) and 4 continuously moving rotating pointers; connected to the rotary vane
      wheel (impeller) by mechanical drive
- role: Housing
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Water meter housing with inlet and outlet connections; brass body for type SL-A, plastic body for
      type SL-AP
- role: Strainer
  type_designations: []
  alternatives:
  characteristics:
    description: Strainer in the inlet of the water meter (non-essential part)
- role: Non-return valve
  type_designations: []
  alternatives:
  characteristics:
    description: Non-return valve in the outlet tube of the water meter (non-essential part)
    optional: true
- role: Pulse output module
  type_designations: []
  alternatives:
  characteristics:
    description: Integrated equipment/function of water meters type SL-A and SL-AP
    optional: true
