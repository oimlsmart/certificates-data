certified_type:
  category: Water meter
  type_designations:
  - U-WR2 series
  - U-WR2-15
  - U-WR2-20
  - U-WR2-25
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meters with electronic indication device (types U-WR2-15, U-WR2-20
    and U-WR2-25) designed to measure, memorize and display the volume of water passing through the measurement
    transducers at metering conditions. Measurement is based on the ultrasonic bidirectional transit-time
    principle (difference in time-of-flight of ultrasonic pulses downstream and upstream). Intended for
    measurement of volume of clean water in residential use. Not designed to measure reverse flow. Installable
    in all positions (R500) and H position (R800).
