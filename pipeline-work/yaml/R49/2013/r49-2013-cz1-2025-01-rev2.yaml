certified_type:
  category: Water meter
  type_designations:
  - 280W-...
  - 280W-R
  module_designation: Not applicable
  description: >-
    Ultrasonic water meters type 280W-... for metering cold potable water, based on the ultrasonic transit-time
    principle, without flow conditioner, equipped with an electronic calculating/indicating device. The
    display shows the measurements in cubic meter volume and cubic meter per hour flow rate. The meter
    is not designed to measure reverse flow. The meter is intended for mounting in any position (horizontal,
    vertical and diagonal pipework) with the indicating device positioned at the top and at the side;
    the meter body is made of brass. The digital display can show up to 9 digits and has two indication
    modes: a high resolution mode (volume resolution 0.000001 m³) used during calibration, and a normal
    resolution mode. The meter can optionally be equipped with an M-bus transmitter for remote reading.
