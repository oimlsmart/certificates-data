certified_type:
  category: Water meter
  type_designations:
  - LXSG-20
  module_designation: Not applicable
  description: >-
    Multi jet rotary vane wheel water meter with dry mechanical indicating device, designed to measure,
    memorise and display the volume at metering conditions of water passing through the measurement transducer.
    Consists of a brass body with connecting screw threads and adjusting screw, a rubber gasket, a strainer
    in front of the wet measuring unit with a plastic distributor with tangential holes and a shaft, a
    rotary vane wheel and gear box, a magnetic coupling (wet and dry side), a rubber gasket, a brass ring
    closing the water meter, magnetic shields, and a mechanical indicating device with pointers and numbered
    drums (five drums and four pointers). Adjustment is realized by adjusting screw, protected by sealed
    screw. Installed in horizontal position with the indicating device positioned at the top; not designed
    to measure reverse flow.
