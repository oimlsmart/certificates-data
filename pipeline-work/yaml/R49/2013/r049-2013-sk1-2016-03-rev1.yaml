certified_type:
  category: Water meter
  type_designations:
  - SD-A
  - SD-AP
  description: >-
    Mechanical single-jet dry dial water meters for measuring, memorising and displaying the volume of
    clean cold and hot water (consumption) in household and commercial use. Single-jet rotary vane wheel
    water meters with mechanical indication device. Type SD-A has a brass body; type SD-AP has a plastic
    body. Essential parts: measuring mechanism (measuring chamber, rotary vane wheel with axle perpendicular
    to flow direction, lower and upper tightening plates with bearing hubs), dry-type mechanical register
    with 8 numbered drums and 1 continuously moving pointer, housing with inlet and outlet thread connections,
    adjustment device (angular orientation of the seal plate or alternatively hinge plug screw), magnetic
    coupling between measuring mechanism and register. Optional parts: strainer in the inlet, non-return
    valve in the outlet tube, pulse output module. Intended for horizontal installation (H, indicating
    device positioned on top) or vertical installation (V); not designed to measure reverse flow. Software:
    not applicable.
