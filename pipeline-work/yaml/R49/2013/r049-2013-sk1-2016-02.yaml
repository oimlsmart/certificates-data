certified_type:
  category: Water meter
  type_designations:
  - SD-B
  - SD-B1
  - SD-BP
  - SD-BP1
  description: >-
    Mechanical single-jet dry dial water meter type for metering of cold water, designed to measure, memorize
    and display the volume at metering conditions of water passing through the measurement transducer;
    intended for measurement of volumes of clean cold water in household or residential use. Essential
    parts: measuring mechanism consisting of the rotary vane wheel with an axle perpendicular to the flow
    direction, lower and upper tightening plates with bearing hubs; dry type mechanical register with
    6 numbered drums and 2 continuously moving rotating pointers (register chamber casing of plastic or
    copper material); housing with inlet and outlet connections — brass body (SD-B, SD-B1) or plastic
    body (SD-BP, SD-BP1); adjustment device via external regulating; magnetic coupling for the connection
    of the measuring mechanism with the mechanical register. Non-essential parts: inlet strainer (optional),
    non-return valve (optional). Integrated equipment: pulse output (optional). Installed in horizontal
    position with the indication device positioned at the top, and in vertical position.
