components:
- role: measuring_mechanism
  characteristics:
    description: >-
      Consisting of a chamber, rotary piston and top plate with transmission shaft for connection of measuring
      part with register
- role: register
  characteristics:
    type: Liquid sealed dry type mechanical register
    register_chamber_casing_material: plastic or copper
    display: Digital drum with gearing mechanism for all figures
- role: housing
  characteristics:
    description: Brass body with inlet and outlet connections with screw threads
- role: adjustment_device
  characteristics:
    options: >-
      Without external adjustable screw or with external adjustable screw to regulate the internal by-pass
      flow of the meter
- role: magnetic_coupling
  characteristics:
    description: For the connection of the measuring mechanism with the mechanical register
- role: strainer
  characteristics:
    optional: true
- role: non_return_valve
  characteristics:
    optional: true
- role: pulse_output
  characteristics:
    optional: true
