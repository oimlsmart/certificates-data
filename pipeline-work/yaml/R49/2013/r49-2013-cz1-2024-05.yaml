certified_type:
  category: Water meter
  type_designations:
  - UL-DW
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter designed to measure, memorise and display the volume at metering conditions
    of water passing through the measurement transducer. Consists of a brass body with screw threads,
    a pair of ultrasonic transducers and an electronic indicating device formed by an LCD display equipped
    with a photosensitive button. Displays delivered volume for forward flow by default; touching the
    button twice switches to reverse flow volume. Measures reverse flow and may be installed in arbitrary
    orientation. Powered by a permanent 3.6 V battery with 16 years lifetime. Legally relevant software
    (version 7.7.1) is protected by CRC-32, alarm codes, E-SEAL model, passwords and terminal cover sealing;
    checksum (CRC-32) and software version are shown on the display. Optional M-Bus, wireless M-Bus or
    RS485 communication interfaces are not part of this certificate.
