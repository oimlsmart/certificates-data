certified_type:
  category: Water meter
  type_designations:
  - sonico EDGE
  module_designation: Not applicable
  description: >-
    Ultrasonic water meters type sonico EDGE designed to measure, memorise and display the volume at metering
    conditions of water passing through the measurement transducer. Consist of a cast iron body with connecting
    screw threads, one pair of ultrasonic transducers and an electronic indicating device formed by an
    LCD display showing volume and flow. Volume resolution of 0.0001 m³ and 0.001 m³ on the digital display.
    Software separation with SW version and CRC displayed on the LCD. Indicates delivered volume for reverse
    flow and forward flow separately every two minutes; permanently shown delivered volume is the difference
    of the two. Can be equipped by an impulse module which is not part of this certificate. Powered by
    24 V DC mains with a battery in the meter body for temporary power failure; magnetic ferrite shielding
    on mains power cable. Shall be installed to operate in arbitrary positions. Sealing by plastic seal
    on plastic meter cover and meter body screw; lock ferrite on cable sealed by security sticker and
    wire security seal.
