  module_designation: Not applicable
  description: >-
    Horizontal Woltmann water meter consisting of a cast iron body with connecting flanges, an interchangeable
    wet measurement unit with adjusting device, and a dry mechanical indicating device (Plastic Calculator
    - LYG) or super dry mechanical indicating device (Copper Can Calculator - GB). Indicating device formed
    by numbered rollers with six drums and three rotary pointers, or seven drums and two rotary pointers.
    Optionally equipped with a reed impulse transmitter for remote reading. To be installed in horizontal
    position only with the indicating device positioned at the top.
