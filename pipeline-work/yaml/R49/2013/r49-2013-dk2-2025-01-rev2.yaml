  category: Water meter
  type_designations:
  - FM320
  - SITRANS FMS300
  - SITRANS FMT020
  module_designation:
  description: >-
    Electromagnetic water meter FM320 consisting of FMS300 sensor and FMT020 transmitter. Operates on
    Faraday's law with constant pulsed DC coil current. Designed for ground water, drinking water, wastewater,
    sewage or sludge applications; for OIML R 49 usable only for cold potable water and hot water. Available
    in 17 sizes DN25–DN600. Complies with OIML R 49:2013 Annex B 'Checking facilities – Type P'.
