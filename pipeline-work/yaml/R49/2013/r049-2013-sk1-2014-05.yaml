- role: register and indication device
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Dry type mechanical register and indication device with 5 numbered drums (least significant drum
      moves continuously) and 4 continuously moving rotating pointers
- role: magnetic coupling
  type_designations: []
  alternatives:
  characteristics:
    description: Connection of the register with the measuring mechanism (rotary piston)
- role: housing
  type_designations: []
  alternatives:
  characteristics:
    description: Housing of water meter with inlet and outlet connections
