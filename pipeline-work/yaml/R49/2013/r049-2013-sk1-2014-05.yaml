certified_type:
  category: Water meter
  type_designations:
  - PD-B
  - PD-BP
  module_designation: Not applicable
  description: >-
    Mechanical volumetric (rotary piston) dry dial water meter for metering, memorising and displaying
    the volume of clean cold water in residential use. Type PD-B has a brass body; type PD-BP has a plastic
    body. Installed in horizontal position with indication device on top, or in vertical position. Optional:
    adjustment device, sieve in inlet, non-return valve in outlet, pulse output.
