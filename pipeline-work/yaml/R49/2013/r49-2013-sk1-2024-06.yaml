certified_type:
  category: Water meter
  type_designations:
  - PD-A
  - PD-AP
  module_designation: Mechanical volumetric (rotary piston) water meter
  description: >-
    Mechanical water meters type PD-A (DN15, DN20, DN25, DN40) and type PD-AP (DN15, DN20) designed to
    measure, memorize and display the volume of water passing through the measurement transducers at metering
    conditions; intended for the measurement of the volume of clean water for residential and commercial
    use; can be installed in any operating positions and prevent flow. Essential parts: measuring chamber
    (chamber, rotary piston and top plate with transmission shaft); liquid-sealed mechanical register
    with glycerine and indication device with 8 numbered drums (DN15/DN20: 4 black drums for cubic meters
    + 4 red drums for sub-multiples, last drum marked 0.00002 m3; DN25/DN40: 5 black + 3 red drums, last
    drum marked 0.0002 m3); brass body for type PD-A and plastic body for type PD-AP with inlet and outlet
    connections; non-return valve. Optional non-essential parts: sieve in the inlet; pulse output with
    reed sensor switch (K-factor 2 impulse/L); pulse output with hall effect sensor switch.
