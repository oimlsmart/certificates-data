certified_type:
  category: Water meter
  type_designations:
  - 280W-…
  - 280W-R
  - 280W-D
  module_designation:
  description: >-
    Ultrasonic transit-time water meter for cold potable water, with straight inlet (5 times the diameter)
    and outlet (3 times the diameter) length, without flow conditioner, equipped with an electronic calculating/indicating
    device with digital display (up to 9 digits), normal and high-resolution (calibration) indication
    modes, and optional M-bus transmitter for remote reading. Not designed to measure reverse flow. Two
    modifications: type 280W-R for residential applications and type 280W-D for sub-metering. Nominal
    sizes DN15 to DN25.
