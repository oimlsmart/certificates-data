certified_type:
  category: Water meter
  type_designations:
  - MTKD-S1
  module_designation: Not applicable
  description: >-
    Water meter - multi jet, dry dial. Multi jet rotary vane wheel water meters with dry mechanical indicating
    device. Consist of a measurement transducer built in a brass body with a strainer and including an
    adjusting device, and a calculator with an indicating device and antimagnetic ring. Measurement transducer
    and calculator are connected using a brass head ring or a protective hood with clips or a plastic
    lock ring around a protective hood. To be installed in horizontal position with the indicating device
    at the top; not designed to measure reverse flow.
