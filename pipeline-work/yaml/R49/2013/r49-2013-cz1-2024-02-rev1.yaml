certified_type:
  category: Water meter
  type_designations:
  - sonico NANO
  module_designation:
  description: >-
    Ultrasonic water meter with dry dial, designed to measure, memorise and display the volume at metering
    conditions of water passing through the measurement transducer. Consists of a cast brass body with
    connecting screw threads, one pair of ultrasonic transducers and an electronic indicating device formed
    by an LCD display showing volume and flow. Volume resolution on the digital display is 0.00001 m³.
    Without buttons; non-legally relevant communication with the meter is possible via an NFC sensor connected
    on the register. Displays indication of each volume every two minutes - separately delivered volume
    for reverse flow and for forward flow; permanently shown delivered volume is the difference between
    the two. Has separation of software; SW versions and CRCs are displayed in the auto-rounding menu
    on the LCD display. Can be equipped by an impulse module which is not part of this certificate. Powered
    by a 3.6 V mains-independent battery. Shall be installed to operate in any positions. Sealed by a
    plastic seal on the plastic meter cover (plastic frame holding the display glass).
