- marker: '1'
  text: >-
    This measuring instrument was previously placed on the market under the name "Badger Meter Europe
    GmbH, Nürtinger Straße 76, 72639 Neuffen, Germany"
- marker: "*"
  text: >-
    For the reduced bore (RB) version, the size mentioned is the process connection size. On the inscriptions
    of the water meter the reduced bore meter will be identified as "DNxxx RB".
