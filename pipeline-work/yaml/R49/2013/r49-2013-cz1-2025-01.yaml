  category: Water meter
  type_designations:
  - 280W-...
  - 280W-R
  - 280W-D
  - 280W-SD
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter for cold potable water based on the ultrasonic transit-time principle, designed
    to measure, memorise and display the volume at metering conditions of water passing through the measurement
    transducer. Two modifications: type 280W-R for residential applications and types 280W-D / 280W-SD
    for sub-metering. Straight inlet (5 times the diameter) and outlet (3 times the diameter) length,
    without flow conditioner, equipped with an electronic calculating/indicating device. Digital display
    up to 9 digits showing volume in m³ and flow rate in m³/h; high-resolution mode (0.000001 m³) used
    during calibration, normal resolution mode during operation. Optionally equipped with an M-bus transmitter
    for remote reading. Can be installed in any position; not designed to measure reverse flow.
