certified_type:
  category: Water meter
  type_designations:
  - GKMV40
  - GKMV40P
  module_designation: Not applicable
  description: >-
    Positive displacement water meter with dry mechanical indicating device. Brass (type GKMV40) or composite
    (type GKMV40P) body with connecting screw threads, inlet strainer, wet volumetric chamber with oscillating
    piston, magnetic coupling, O-ring, pressure plate, magnetic shields, indicating device with eight
    numbered roller drums and one pointer, register cap and clamp-on cover. May be installed in any position;
    not designed to measure reverse flow.
