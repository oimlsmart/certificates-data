certified_type:
  category: Water meter
  type_designations:
  - LXSG-15
  module_designation: Not applicable
  description: >-
    Multi jet rotary vane wheel water meter with dry mechanical indicating device, designed to measure,
    memorise and display the volume at metering conditions of water passing through the measurement transducer.
    Consists of a brass body with connecting screw threads, an inlet strainer and adjusting screw, a gliding
    ring, a wet measuring unit with an impeller with tangential holes and a shaft, a rotary vane wheel
    with bush and stone, an O-ring, a pressure plate closing the wet part and a thread ring, a magnetic
    coupling (wet and dry side), an antimagnetic ring, a mechanical indicating device with 8 numbered
    drums and 1 pointer, and a plastic head ring with plastic cover. Adjustment is realized by adjusting
    screw, access protected by sealed screw. Shall be installed in horizontal position only with the indicating
    device positioned at the top; not designed to measure reverse flow.
