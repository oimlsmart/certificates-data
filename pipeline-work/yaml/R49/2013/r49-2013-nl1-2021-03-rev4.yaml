    q4_overload: 12500
    q3_q1_ratio: 250
  description: >-
    The flow rates Q1, Q2, Q3 and Q4 can be freely chosen as long as: values Q3 and ratio Q3/Q1 are selected
    from paragraph 4.1 of OIML R49-1:2013(E); values for Q1 and Q2 are minimum values and the ratio Q2/Q1
    = 1.6; values for Q3 and Q4 are maximum values and the ratio Q4/Q3 = 1.25; the ratio Q3/Q1 is at least
    40.
