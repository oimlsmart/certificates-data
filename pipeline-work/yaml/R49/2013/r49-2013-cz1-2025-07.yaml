certified_type:
  category: Water meter
  type_designations:
  - Cordonel
  module_designation: Not applicable
  description: >-
    The water meters type Cordonel are designed to measure, memorise and display the volume at metering
    conditions of water passing through the measurement transducer. The water meter type Cordonel is a
    battery powered ultrasonic water meter working on the ultrasonic time-of-flight principle; the meter
    has three transducer pairs. The meter comprises a body with two pipe-shaped flanged end connections;
    the body has 6 openings for mounting the ultrasonic transducers as well as an opening for an optional
    pressure sensor. In the area of the measuring section the channel of measurement is constricted; body
    and measuring section are of symmetrical construction allowing bi-directional measurement with the
    same accuracy. With DN 50 to DN 125 the flow channel has a hexagonal cross-section and the ultrasonic
    measuring paths are arranged at a 120° angle to each other; with DN 150 the flow channel has a rectangular
    cross-section and the measuring paths are arranged parallel. The meter electronics is fixed in a waterproof
    IP68 register casing and calculates twice per second the transit time difference; the volume integration
    takes the invariable cross section and corrective calculations into account. The consumption value
    is shown permanently on a 9-digit, 7-segment LC display. The meters can be installed in horizontal
    and vertical position and are designed to measure reverse flow.
