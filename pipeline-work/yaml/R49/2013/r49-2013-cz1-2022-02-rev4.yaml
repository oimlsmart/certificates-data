model_family:
  family_name: MS2500
  models:
  - model_id: MS2500/MV110-HV
    label: MS2500 / MV110 HV
    attributes:
      power_supply: 100–240 V AC mains
      backup_source: 3.7 V DC, 5200 mAh battery
  - model_id: MS2500/MV110-LV
    label: MS2500 / MV110 LV
    attributes:
      power_supply: 24–36 V AC/DC
      backup_source: 3.7 V DC, 5200 mAh battery
  - model_id: MS2500/MV110-LLV
    label: MS2500 / MV110 LLV
    attributes:
      power_supply: 10–48 V DC
  - model_id: MS2500/MV145-HV-lit
    label: MS2500 / MV145 HV + lit. battery
    attributes:
      power_supply: 100–240 V AC mains
      backup_source: 3.7 V DC, 5200 mAh lithium battery
  - model_id: MS2500/MV145-LLV-alk
    label: MS2500 / MV145 LLV + alk. battery
    attributes:
      power_supply: 10–48 V DC
      backup_source: 9 V DC alkaline battery
  - model_id: MS2500/MV145-LLV-lit
    label: MS2500 / MV145 LLV + lit. battery
    attributes:
      power_supply: 10–48 V DC
      backup_source: 3.6 V DC lithium battery Li-SOCl2
components:
- role: measurement transducer (sensor)
  type_designations:
  - MS2500
  characteristics:
    construction: >-
      steel body with connecting flanges, one pair of excitation coils, electrodes, connection to converter
    liner_options:
    - liner: PTFE
      dn_range:
        min: 25
        max: 2000
      water_temperature_max: 90
    - liner: Polypropylene
      dn_range:
        min: 25
        max: 150
      water_temperature_max: 50
    - liner: Rilsan
      dn_range:
        min: 50
        max: 2000
      water_temperature_max: 50
    - liner: Ebonite
      dn_range:
        min: 200
        max: 2000
      water_temperature_max: 50
- role: electronic converter with indicating device
  type_designations:
  - MV110
  - MV145
  alternatives: OR
  characteristics:
    display: LCD display showing volume and flow
