  type_designations:
  - MS2500 / MV110
  - MS2500 / MV145
  - MS2500
  - MV110
  - MV145
  module_designation: >-
    MS2500 / MV110 HV; MS2500 / MV110 LV; MS2500 / MV110 LLV; MS2500 / MV145 HV + lit. battery; MS2500
    / MV145 LLV + alk. battery; MS2500 / MV145 LLV + lit. battery
  description: >-
    Electromagnetic water meters designed to measure, memorise and display the volume of water at metering
    conditions. Consist of sensor MS2500 and converter MV110 or MV145 in compact or separate version with
    connecting cable. Electronic indicating device with LCD display showing volume and flow; impulse and
    current outputs; RS485 or USB mini-B communication for legally non-relevant functions. Several security
    levels by passwords.
