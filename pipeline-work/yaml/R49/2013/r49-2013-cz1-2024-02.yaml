certified_type:
  category: Water meter
  type_designations:
  - sonico NANO
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter with dry dial and electronic indicating device, designed to measure, memorise
    and display the volume at metering conditions of water passing through the measurement transducer.
    Consists of a cast brass body with connecting screw threads, one pair of ultrasonic transducers and
    the electronic indicating device formed by an LCD display showing volume and flow. Display volume
    resolution 0.00001 m³. Without buttons; legally non-relevant communication possible via NFC sensor
    connected on the register. Software separation is implemented; CRC and SW version of the legally relevant
    part are displayed in the auto-rounding menu. Displays the delivered volume for reverse flow and for
    forward flow separately every two minutes; the permanently shown delivered volume is the difference
    between the two. Can be equipped by an impulse module which is not part of this certificate. Powered
    by a 3.6 V battery. Shall be installed to operate in any positions. Sealed by a plastic seal (plastic
    frame holding the display glass) forming part of the meter body.
