certified_type:
  category: Water meter
  type_designations:
  - 280W-...
  - 280W-R
  - 280W-D
  module_designation:
  description: >-
    Ultrasonic water meter for metering cold potable water based on the ultrasonic transit-time principle,
    DN15 to DN25, with straight inlet (5 times the diameter) and outlet (3 times the diameter) length,
    without flow conditioner, equipped with an electronic calculating/indicating device. Two modifications:
    type 280W-R intended for residential applications and type 280W-D for sub-metering. Not designed to
    measure reverse flow. Digital display with up to 9 digits, high resolution mode (volume resolution
    0.000001 m³) used during calibration, normal resolution mode displaying up to 000000.001 m³/h flow
    rate and 0000000.01 m³ volume. Intended for mounting to horizontal pipework with flow axis in horizontal
    plane, indicating device positioned at the top or at the side. Software version 31.0, checksum A4532301.
    Markings include unit of measurement, Q3 and R 250, OIML certificate number, manufacturer trademark,
    year/month of manufacture and serial number, flow direction arrow, MAP16, letter H, temperature class,
    pressure loss class, installation sensitivity class U5D3, environmental classes, and latest replacement
    date. Security: sealing cap permanently adhered to the 2 screws horizontally aligned with the display.
