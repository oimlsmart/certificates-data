certified_type:
  category: Water meter
  type_designations:
  - MUT2200EL/MC608A
  - MUT2200EL
  - MC608A
  module_designation:
  description: >-
    The water meter type MUT2200EL/MC608A is an induction water meter (compact version). The flow sensors
    type MUT2200EL are intended for metering cold potable water, based on an induction principle, with
    PTFE lining, with straight inlet (5 times the diameter) and outlet (3 times the diameter) length,
    without flow conditioner. The water meters are equipped with an electronic calculating/indicating
    device type MC608A. The display shows the measurements in cubic metre volume and cubic metre per hour
    flow rate. The display is a digital type with four buttons and can show up to 3 lines. The meter is
    not designed to measure reverse flow. The meter does not require any extra-mechanical housing. The
    adjustment is made by setting calibration factor (KA factor). The meter is intended for mount to the
    connecting horizontal pipework with the flow axis in the horizontal plane and with the indicating
    device positioned at the top. Tamper protection by multi-level password; the third level password
    secures metrological parameters.
