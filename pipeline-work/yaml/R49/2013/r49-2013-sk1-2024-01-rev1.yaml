components:
- role: flow_sensor
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Brass cylindrical body with inlet and outlet firmly with the plastic housing for the calculator;
      inner plastic elements (pipe support down and pipe support up); two reflection sheets installed
      in the centre of the pipe; two ultrasonic transducers at the upstream and downstream of the measurement
      channel to transmit and receive ultrasonic signals.
- role: calculator
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Plastic housing of the calculator with indication device directly mounted on the flow sensor; two
      PCB boards (main PCB board, measurement PCB board).
    software_version: '1029'
    software_checksum: A7F64A89
- role: indicating_device
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Electronic scrolling LCD display (by button); sub-multiples of a cubic metre indicated with a box
      around three digits after the decimal point.
    digits:
      value: 9
      unit_symbol:
      unit_id:
      footnote_markers: []
    indication_range:
      value: 999999.999
      unit_symbol: m³
      unit_id:
      footnote_markers: []
- role: battery
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      One non-replaceable lithium battery for metering; one additional battery for communication (non-essential
      part).
    voltage:
      value: 3.8
      unit_symbol: V
      unit_id:
      footnote_markers: []
    lifetime:
      value: 10
      unit_symbol: years
      unit_id:
      footnote_markers: []
- role: non_essential_parts
  type_designations: []
  alternatives:
  characteristics:
    description: Strainer; optical port for communication; one battery for communication.
