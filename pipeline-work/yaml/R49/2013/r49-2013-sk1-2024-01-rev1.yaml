certified_type:
  category: Water meter
  type_designations:
  - MA408
  module_designation:
  description: >-
    Residential compact ultrasonic water meter with electronic indication device, designed to measure,
    memorize and display the volume of water passing through the measurement transducers at metering conditions;
    intended for the measurement of volume of clean water in residential use. Measurement is based on
    the ultrasonic bidirectional transit-time principle (difference in time-of-flight of ultrasonic pulses
    downstream and upstream). Can be installed in horizontal and vertical positions; not designed to measure
    reverse flow.
