certified_type:
  category: Water meter
  type_designations:
  - AquaMaster4 FEW4XY.Z
  - AquaMaster4 FET4
  module_designation:
  description: >-
    Electromagnetic water meter, family AquaMaster4. Type designations FEW4XY.Z and FET4, where X is 1
    or 3 (standard or advanced), Y is 1, 2, 8 or 9 (integral/remote version, optionally sensor only) and
    Z is R (reduced bore), V (virtual full bore) or F (full bore).
