certified_type:
  category: Water meter
  type_designations:
  - MAGX2
  module_designation:
  description: >-
    Electromagnetic water meter for metering cold and hot potable water, based on an inductive principle,
    with PTFE and hard rubber lining, straight inlet (5 times the diameter) and outlet (3 times the diameter)
    length, without flow conditioner, equipped with an electronic calculating/indicating device. Two modifications:
    compact and remote version (maximum cable length for remote version 6 m). The display shows volume
    (positive, negative, total and auxiliary) in m³ and flow rate in m³/h; the meter is not designed to
    measure reverse flow. Access to metrological parameters is secured by user, service and factory passwords;
    software version and checksum can be displayed using buttons. Optional frequency output for remote
    reading or RS 485 communication. Nominal diameters DN25 to DN300 with flanged connections; mounting
    with flow axis horizontal or vertical (upward or downward), indicating device positioned at top or
    at side.
