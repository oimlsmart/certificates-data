certified_type:
  category: Water meter
  type_designations:
  - MFW
  - MFW-DN15
  - MFW-DN20
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter, type MFW, temperature class T50, accuracy class 2. The water meters type MFW
    are designed to measure, memorise and display the volume at metering conditions of water passing through
    the measurement transducer in the sense of OIML R 49:2013. They consist of a plastic body with screw
    threads, a pair of ultrasonic transducers and an electronic indicating device formed by an LCD display
    (4 menus: common information, fault display, information, detection). The meters are powered by a
    permanent battery with voltage 3.6 V and lifetime 12 years, and shall be installed in horizontal position
    with the indicating device at the top.
