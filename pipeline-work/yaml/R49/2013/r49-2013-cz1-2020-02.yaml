certified_type:
  category: Water meter
  type_designations:
  - CD TAR
  - CD97TAR
  - CD96TAR
  module_designation: Not applicable
  description: >-
    Single jet rotary vane wheel water meters with dry mechanical indicating device (plastic can calculator)
    or super dry mechanical indicating device (plastic can calculator or copper can calculator). Two sub-types,
    CD97TAR and CD96TAR, were certified. The meters consist of a brass or bronze body with connecting
    threads, inlet strainer, turbine assembly and magnetic shields; indicating devices are formed by numbered
    rollers (five drums with four rotary pointers, or eight drums with one rotary pointer), optionally
    designated for inclined reading, with a star wheel with ten arms for rapid testing. Optionally equipped
    with a reed impulse transmitter for remote reading. The water meters shall be installed to operate
    in horizontal position only with the indicating device positioned at the top (H↑).
