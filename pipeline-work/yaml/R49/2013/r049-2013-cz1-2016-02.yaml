  module_designation:
  description: >-
    Combination water meter type ISOFLO for metering cold potable water based on mechanical principles.
    Comprises the primary (main) meter (Woltman type Woltex WE with mechanical dry-dial register), the
    secondary (by-pass) meter (single jet TU1M20, TU1M25, TU1 40F or rotary piston Aquadis+ P1, Aquadis+
    P111, P290+ with mechanical dry-dial register) and a changeover valve. Equipped with two indicating
    devices (primary and secondary), mechanical dry dial with pointers and rollers, displaying volume
    in m³ and flow rate in m³/h. Not designed to measure reverse flow. Intended for horizontal pipework
    with the indicating device positioned on top. Changeover zone: Qmin(main) < Zc < 1.2 x Qn(secondary).
    Markings: unit of measurement (m³), numerical value Q3 in m³/h and ratio Q3/Q1, OIML certificate of
    conformity number, manufacturer name/trademark, year of manufacture, serial number, flow direction
    arrow, maximum admissible pressure (MAP10 or MAP16), letter H, temperature class T30, pressure loss
    class, installation sensitivity class.
