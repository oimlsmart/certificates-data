      unit_symbol:
      unit_id:
- role: secondary_meter
  type_designations:
  - TU1M20 DN20
  - TU1M25 DN25
  - TU1 40F DN40
  - Aquadis+ P1 DN20
  - Aquadis+ P111 DN25
  - P290+ DN40
  alternatives: OR
  characteristics:
    meter_type:
      value: single jet meter or rotary piston meter
      unit_symbol:
      unit_id:
    register:
      value: mechanical dry-dial
      unit_symbol:
      unit_id:
- role: changeover_valve
  type_designations: []
  alternatives:
  characteristics:
    function:
      value: >-
        closes at low flow rates so only the secondary meter operates; opens with increasing flow so primary
        and secondary meters operate together
      unit_symbol:
