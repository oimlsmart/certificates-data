certified_type:
  category: Water meter
  type_designations:
  - MA408
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meter with electronic indication device for measuring, memorizing
    and displaying the volume of clean water passing through the measurement transducers at metering conditions.
    Measurement is based on the ultrasonic bidirectional transit-time principle (difference in time-of-flight
    of ultrasonic pulses downstream and upstream). Can be installed in horizontal and vertical positions;
    not designed to measure reverse flow.
