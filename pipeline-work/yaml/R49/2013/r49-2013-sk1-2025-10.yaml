components:
- role: flow_sensor
  type_designations:
  - EUW300 flow sensor
  alternatives:
  characteristics:
    description: >-
      Hydraulic plastic body with inlet and outlet threaded connections; inner plastic tube placed in
      the body; two mirrors set to create an ultrasound path in the flow meter body; two ultrasonic transducers
      at the upstream and downstream of the measurement channel to transmit and receive ultrasonic signals.
- role: calculator_and_indication_device
  type_designations:
  - EUW300 calculator and indication device
  alternatives:
  characteristics:
    description: >-
      Plastic counter housing with meter indication device molded together with flow sensor; PCB of the
      measuring module; PCB board; electronic LCD display with 9 digits and indication range of 999999.999
      m³; two non-replaceable lithium batteries; optical port for display scrolling by magnet.
- role: communication_module_non_essential
  type_designations:
  - IoT
  alternatives:
  characteristics:
    description: IoT including LoRa/LoRaWAN/NB-IoT/LPWAN.
