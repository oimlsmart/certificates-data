certified_type:
  category: Water meter
  type_designations:
  - EUW300
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device designed to measure, memorise and
    display the volume of water passing through the measurement transducer at metering conditions. Intended
    for measurement of volume of clean water in residential, commercial and light industrial use. Measurement
    is based on the ultrasonic bidirectional transit-time principle. Can be installed to operate in horizontal
    or vertical positions and is not designed to measure the reverse flow.
