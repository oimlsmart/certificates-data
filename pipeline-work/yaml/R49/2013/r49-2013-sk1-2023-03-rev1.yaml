certified_type:
  category: Water meter
  type_designations:
  - IW2
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device, designed to measure, memorise and
    display the volume of water passing through the measurement transducer at metering conditions. Measurement
    is based on the ultrasonic method, bidirectional transit-time principle. Intended for measurement
    of volume of clean water in residential use and for non-resettable measurements between two constant
    partners. Can be installed to operate in all positions. Not designed to measure reverse flow, except
    DN15 and DN20 (class 2) which are designed to measure reverse flow. Essential parts: flow sensor (hydraulic
    brass body with inlet and outlet threaded connections, inner plastic US channel, mirrors, two ultrasonic
    transducers) and calculator with indication device directly mounted on the flow sensor (PCB board,
    two versions of 2-line LCD display, two or three non-replaceable lithium batteries with maximum lifetime
    of 22 years). Non-essential parts (optional): non-return valve, filter, interfaces (pulse output,
    NFC communication, radio communication).
