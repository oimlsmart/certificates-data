certified_type:
  category: Water meter
  type_designations:
  - MS2500 / MV110
  - MS2500 / MV210
  - MS2500 / MV145
  module_designation: >-
    MS2500 / MV110 HV, LV, LLV and MS2500 / MV210 HV, LV, LLV + SUPERCAP or Rechargeable Lithium (not
    replaceable); MS2500 / MV145 HV and MS2500 / MV145 LLV and/or Lithium or Alkaline Batteries (replaceable)
  description: >-
    Electromagnetic water meters designed to measure, memorise and display the volume of water at metering
    conditions, consisting of the MS2500 sensor and the MV110, MV210 or MV145 electronic converter in
    compact or separate version with connecting cable. Sensor: steel body with connecting flanges, one
    pair of excitation coils and electrodes, with PTFE, polypropylene, Rilsan or ebonite liner. Converter:
    plastic or aluminium housing with LCD display showing volume and flow (volume resolution 0.001 m³),
    impulse and current outputs; RS485 or USB mini-B for legally non-relevant communication. Several password-protected
    security levels.
