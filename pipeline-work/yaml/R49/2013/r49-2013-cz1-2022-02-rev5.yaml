components:
- role: Sensor (measurement transducer)
  type_designations:
  - MS2500
  alternatives:
  characteristics:
    description: >-
      Steel body with connecting flanges, one pair of excitation coils, electrodes and connection to the
      converter; several liner types available
    liners:
    - material: PTFE
      dn_range: DN 25 - DN 2000
      max_water_temperature:
        value: 90
        unit_symbol: "°C"
        unit_id:
        footnote_markers: []
    - material: Polypropylene
      dn_range: DN 25 - DN 150
      max_water_temperature:
        value: 50
        unit_symbol: "°C"
        unit_id:
        footnote_markers: []
    - material: Rilsan
      dn_range: DN 50 - DN 2000
      max_water_temperature:
        value: 50
        unit_symbol: "°C"
        unit_id:
        footnote_markers: []
    - material: Ebonite
      dn_range: DN 200 - DN 2000
      max_water_temperature:
        value: 50
        unit_symbol: "°C"
        unit_id:
        footnote_markers: []
- role: Converter (electronic indicating device)
  type_designations:
  - MV110
  - MV210
  - MV145
  alternatives: OR
  characteristics:
    body: plastic or aluminium
    display: LCD showing volume and flow
    outputs: impulse output and current output
    legally_non_relevant_communication: RS485 or USB mini-B
