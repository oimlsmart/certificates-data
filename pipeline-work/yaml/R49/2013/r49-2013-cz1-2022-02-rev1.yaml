certified_type:
  category: Water meter
  type_designations:
  - MS2500 / MV110
  - MS2500 / MV145
  module_designation: >-
    MS2500 / MV110 HV; MS2500 / MV110 LV; MS2500 / MV110 LLV; MS2500 / MV145 HV + lit. battery; MS2500
    / MV145 LLV + alk. battery; MS2500 / MV145 LLV + lit. battery
  description: >-
    Electromagnetic water meter with electronic indicating device, designed to measure, memorise and display
    the volume of water passing through the measurement transducer at metering conditions. Consists of
    the sensor MS2500 and the converter MV110 or MV145, in compact set-up or separate version with connecting
    cable. The sensor has a steel body with connecting flanges, one pair of excitation coils and electrodes,
    and is available with PTFE liner (DN25-DN350, water up to 90 °C), polypropylene liner (DN25-DN150,
    50 °C), Rilsan liner (DN50-DN350, 50 °C) or ebonite liner (DN200-DN350, 50 °C). The converter comprises
    an LCD display showing volume and flow, impulse and current outputs, and non-legally relevant communication
    via RS485 or USB mini-B. Sealing by security seals and installation seals as described in Figures
    1-4 of the certificate.
