components:
- role: sensor (measurement transducer)
  type_designations:
  - MS2500
  alternatives:
  characteristics:
    construction: >-
      steel body with connecting flanges, one pair of excitation coils, electrodes and connection to the
      converter
    liner_options:
    - material: PTFE
      nominal_diameters: DN25-DN350
      max_water_temperature:
        value: 90
        unit_symbol: "°C"
    - material: Polypropylene
      nominal_diameters: DN25-DN150
      max_water_temperature:
        value: 50
        unit_symbol: "°C"
    - material: Rilsan
      nominal_diameters: DN50-DN350
      max_water_temperature:
        value: 50
        unit_symbol: "°C"
    - material: Ebonite
      nominal_diameters: DN200-DN350
      max_water_temperature:
        value: 50
        unit_symbol: "°C"
- role: converter with electronic indicating device
  type_designations:
  - MV110
  - MV145
  alternatives: OR
  characteristics:
    display: LCD display showing volume and flow
    controls: three buttons
    outputs:
    - impulse output
    - current output
    non_legally_relevant_communication:
    - RS485
    - USB mini-B
    security: several password security levels; public-password settings do not affect legally relevant
      software
