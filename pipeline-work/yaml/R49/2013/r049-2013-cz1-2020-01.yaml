certified_type:
  category: Water meter
  type_designations:
  - sonico EDGE
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter with an electronic indicating device. The water meters type sonico EDGE are
    designed to measure, memorise and display the volume at metering conditions of water passing through
    the measurement transducer. They consist of a cast iron body with connecting screw threads, one pair
    of ultrasonic transducers and the electronic indicating device formed by an LCD display showing volume
    and flow. Volume resolution of 0.0001 m³ on the digital display. Powered by 24 V DC mains with a battery
    contained in the meter body for temporary power failure; magnetic ferrite shielding on the mains power
    cable. Installation in arbitrary positions. Separation of software: CRC and SW version of the legally
    relevant part are displayed in the auto-rounding menu on the LCD display. May be equipped by impulse
    or other communication module which is not part of this certificate.
