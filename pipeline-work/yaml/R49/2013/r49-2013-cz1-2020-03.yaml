  - LXLGC
  module_designation: Not applicable
  description: >-
    Horizontal Woltmann water meter for measuring, memorising and displaying the volume of water at metering
    conditions. Cast iron body with connecting flanges, interchangeable wet measurement unit with adjusting
    device (inlet/outlet flow straighteners with stainless steel or tungsten steel shafts, plastic turbine
    with composite axial bearings and radial sapphire bearings, transmission shaft with magnetic coupling,
    adjusting screw for DN100-DN500 or adjusting copper plate for DN40-DN80), and a dry mechanical indicating
    device (Plastic Calculator) or super dry mechanical indicating device (Copper Can Calculator). Optional
    reed impulse transmitter for remote reading. For horizontal installation only, with the indicating
    device positioned at the top.
