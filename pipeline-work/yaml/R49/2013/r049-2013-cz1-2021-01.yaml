certified_type:
  category: Water meter
  type_designations:
  - LXSG-xxE5/RLN1
  - LXSG-xxE5/S/RLN1
  - LXSG-xxE5/RLN2
  - LXSG-xxE5/S/RLN2
  module_designation: Not applicable
  description: >-
    Multi jet rotary vane wheel water meters with dry mechanical indicating device types RLN1 and RLN2
    ('xx' means nominal diameter, 15 or 20 mm). Variants: LXSG-xxE5/RLN1 brass body with indicating device
    RLN1; LXSG-xxE5/S/RLN1 plastic body with RLN1; LXSG-xxE5/RLN2 brass body with RLN2; LXSG-xxE5/S/RLN2
    plastic body with RLN2. Construction: body with connecting screw threads, inlet strainer and adjusting
    screw, plastic gasket, wet measuring unit with plastic distributor with tangential holes and a shaft,
    rotary vane wheel and cover plate, magnetic coupling (wet and dry side), rubber O-ring and plastic
    gasket, brass (or plastic) ring closing the wet part, two magnetic shields, mechanical indicating
    device with pointers and numbered drums (seven drums: 5 black and 2 red, plus two pointers), plastic
    cover with plastic lid. Adjustment via sealed adjusting screw. Installed in horizontal position only
    with the indicating device at the top. Marked with unit of measurement (m³), Q3 value and Q3/Q1 ratio,
    OIML certificate number, manufacturer trademark, manufacturing date and serial number, flow direction
    arrow, MAP, letter H↑, temperature class, pressure loss class and installation sensitivity class (Ux
    Dx).
