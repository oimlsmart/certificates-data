certified_type:
  category: Water meter
  type_designations:
  - LXC-15
  - LXC-20
  description: >-
    Compact ultrasonic water meters with electronic indication device for measurement, memorizing and
    displaying the volume of clean water in residential use. Measurement based on the ultrasonic bidirectional
    transit-time principle (difference in time-of-flight of ultrasonic pulses with and against the flow).
    Can be installed in horizontal and vertical positions; not designed to measure reverse flow. Non-essential
    parts: valve drive mechanism (DC motor, reduction gear box, position sensor), ball valve, strainer,
    optical port for communication, one replaceable battery for communication. Sealed by plastic and lead
    seals.
