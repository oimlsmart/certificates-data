certified_type:
  category: Water meter
  type_designations:
  - sonico EDGE
  module_designation: Not applicable
  description: >-
    Ultrasonic water meters with an electronic indicating device designed to measure, memorise and display
    the volume at metering conditions of water passing through the measurement transducer. The meters
    consist of a cast iron body with connecting screw threads (flanged connection), one pair of ultrasonic
    transducers and an electronic indicating device formed by an LCD display showing volume and flow.
    Displayed volume resolution is 0.0001 m³ and 0.001 m³. Legally non-relevant communication with the
    meter is possible via an optical sensor connected to the register. The meter has separation of software;
    SW versions and CRCs of the legally relevant part are displayed in the auto-rounding menu on the LCD.
    Each delivered volume (reverse and forward flow) is indicated every two minutes; the permanently shown
    volume is the difference between the two. Powered from 24 V DC mains with an internal battery for
    temporary power failure; mains power cable shielding by magnetic ferrite. May be installed in arbitrary
    positions. An optional impulse module is not part of this certificate.
