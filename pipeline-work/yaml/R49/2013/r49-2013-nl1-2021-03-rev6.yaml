- marker: "*"
  text: >-
    For the reduced bore (RB) version, the size mentioned is the process connection size. On the inscriptions
    of the water meter the reduced bore meter will be identified as "DNxxx RB".
- marker: "*"
  text: >-
    This display indication range is only available with software revision 2.0.52 or later, other software
    versions shall not be used for meter size DN600. Additionally, this display indication range is only
    available with standard cover, IP68 cover shall not be used for meter size DN600.
