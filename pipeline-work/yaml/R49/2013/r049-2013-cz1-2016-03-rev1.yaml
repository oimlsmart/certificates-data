certified_type:
  category: Water meter
  type_designations:
  - MAGB1
  module_designation:
  description: >-
    The water meter type MAGB1 is electromagnetic water meter. There are two modifications: compact and
    remote version. The water meters type MAGB1 are intended for metering cold potable water and hot water,
    based on an inductive principle, PTFE and hard rubber lining, with straight inlet (5 times the diameter)
    and outlet (3 times the diameter) length, without flow conditioner and there are equipped with an
    electronic calculating/indicating device. The maximum cable length for remote version is 6 meters.
    The display shows the measurements in cubic meter volume (positive, negative, total and auxiliary)
    and cubic meter per hour flow rate. The meter is not designed to measure reverse flow. The meter does
    not require any extra-mechanical housing or adjustments. The meter is intended for mount to the connecting
    any pipework with the flow axis in the horizontal and vertical (from bottom to top and from top to
    bottom) plane and with the indicating device positioned at the top and at the side. The meter is equipped
    with the electronic indicating device. The display is a digital type, and can show up to 9 digits.
    The normal resolution mode is used during normal operation. The water meter displays in the normal
    resolution mode up to 000000.001 m³/h flow rate and 000.001 m³ volume on the digital display. The
    water meter displays the volume resolution of 0.001 L on the digital display in the high resolution
    mode which would be used during the calibration process. This mode is set up by factory tool (software
    had to be attached). The water meters type MAGB1 can be equipped by frequency output which can be
    used for remote reading or by RS 485 (with maximum cable length 3 m).
