certified_type:
  category: Water meter
  type_designations:
  - SD-A
  - SD-AP
  module_designation:
  description: >-
    Mechanical single-jet dry dial water meter for metering of cold water, designed to measure, memorize
    and display the volume at metering conditions of water passing through the measurement transducer.
    Intended for measurement of volumes of clean cold water in household or residential use. Essential
    parts: measuring mechanism in the lower part of the meter body (rotary vane wheel with axle perpendicular
    to flow direction, lower and upper tightening plates with bearing hubs); dry type mechanical register
    (register chamber casing may be plastic) with 8 numbered drums and 1 continuously moving rotating
    pointer; housing with inlet and outlet thread connections (brass body for SD-A, plastic body for SD-AP);
    adjustment device (angular orientation of the seal plate or hinge plug screw, optionally); magnetic
    coupling for connection of measuring mechanism with mechanical register. Non-essential optional parts:
    inlet strainer, non-return valve. Optional integrated function: pulse output. Software: not applicable.
