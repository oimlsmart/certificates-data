    tightening plates with bearing hubs, in lower part of meter body)
  type_designations: []
- role: >-
    mechanical register (dry type, register chamber casing may be plastic, 8 numbered drums and 1 continuously
    moving rotating pointer)
  type_designations: []
- role: housing with inlet and outlet thread connections
  type_designations: []
  characteristics:
    type_level:
      body_material:
        value: brass (SD-A) or plastic (SD-AP)
