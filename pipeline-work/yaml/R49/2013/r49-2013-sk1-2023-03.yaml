components:
- role: flow_sensor
  characteristics:
    measuring_principle: ultrasonic, bidirectional transit-time
    body: hydraulic brass body with inlet and outlet threaded connections
    measurement_channel: >-
      inner plastic element (US channel) placed in the brass body with mirrors set to create an ultrasound
      path
    ultrasonic_transducers: >-
      two transducers at upstream and downstream of the measurement channel to transmit and receive ultrasonic
      signals
- role: calculator_and_indication_device
  characteristics:
    mounting: directly mounted on the flow sensor
    display: two versions of electronic LCD display with 2 lines
    upper_line: >-
      9 digits, indication range 999999.999 m³, sub-multiples of cubic meter indicated by three digits
      after decimal point
    lower_line: 5 digits to display the current flow rate in m³/h
    batteries: >-
      two or three non-replaceable lithium batteries, maximum lifetime 22 years, end of battery life visible
      on display menu
