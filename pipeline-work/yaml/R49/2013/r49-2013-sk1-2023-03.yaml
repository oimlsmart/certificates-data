certified_type:
  category: Water meter
  type_designations:
  - IW2
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    The ultrasonic water meter type IW2 is designed to measure, memorise and display the volume of water
    passing through the measurement transducer at metering conditions. Compact ultrasonic water meter
    with electronic indication device, intended for the measurement of volume of clean water in residential
    use and for non-resettable measurements between two constant partners. Measurement is based on the
    ultrasonic bidirectional transit-time principle. The meter can be installed to operate in all positions
    and is not designed to measure reverse flow.
