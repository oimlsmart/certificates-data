certified_type:
  category: Water meter
  type_designations:
  - Smartio
  module_designation: Not applicable
  description: >-
    Smartio water meters, nominal diameter DN20. Securing components and verification marks: the meters
    are sealed by connecting the plastic seal on the plastic meter cover; the plastic seal is part of
    the body of the water meter in the form of a plastic frame that holds the glass of the display on
    the body of the water meter, so the water meter cannot be accessed without damaging the seal. LCD
    display shows volume (m³ or GAL) and flow rate (m³/h or GPM) with indicators for volume unit, non-billing
    relevant lines, tariff number, main flow direction, radio connection status, leakage indicator, test
    mode, air-in-pipe, system alarm and battery level. Figure 2 photograph shows an example meter label
    reading: DN25, Q3=2.5 m³/h, R=1600, U=3.6 V, MAP 16, T50.
