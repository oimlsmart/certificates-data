certified_type:
  category: Water meter
  type_designations:
  - wADDAD
  description: >-
    Ultrasonic water meters type wADDAD intended for metering cold potable water, based on an ultrasonic
    transit-time principle, with straight inlet (5 times the diameter) and outlet (3 times the diameter)
    length, without flow conditioner, equipped with an electronic calculating/indicating device. Display
    shows measurements in cubic meter volume and cubic meter per hour flow rate. Not designed to measure
    reverse flow. Digital display with up to 9 digits; high resolution mode (used during calibration)
    displays volume resolution of 0.000001 m3; normal resolution mode displays up to 000000.001 m3/h flow
    rate and 0000000.01 m3 volume. Optional M-bus transmitter for remote reading. Intended for mounting
    to horizontal, vertical and diagonal pipework with the indicating device positioned at the top and
    at the side. Nominal diameters DN15 to DN25.
