certified_type:
  category: Water meter
  type_designations:
  - MAGB2
  module_designation: Not applicable
  description: >-
    Electromagnetic (inductive) water meters type MAGB2, in compact and remote version (maximum cable
    length 10 m for the remote version). Consist of an inductive flow sensor (PTFE or hard rubber lining,
    straight inlet and outlet 0 x DN, without flow conditioner) and an electronic calculating/indicating
    device with digital display (up to 10 digits in two lines, 6 buttons). Normal resolution mode displays
    up to 00000000.001 m³/h flow rate and 00000000.001 m³ volume; high resolution mode (calibration, set
    by factory tool protected by user/service/factory passwords) displays volume resolution of 0.001 L.
    Designed to measure reverse flow. Optionally equipped with frequency output for remote reading and
    RS 485 (maximum cable length 30 m). Battery powered. Installed in arbitrary positions with flow axis
    horizontal or vertical (bottom-to-top and top-to-bottom), indicating device at top or at side. Software
    version 22.28, CRC checksum 0xCB68D76D.
