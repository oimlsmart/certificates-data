certified_type:
  category: Water meter
  type_designations:
  - sonico EDGE
  module_designation: Not applicable
  description: >-
    Ultrasonic water meters type sonico EDGE designed to measure, memorise and display the volume at metering
    conditions of water passing through the measurement transducer. They consist of a cast iron body with
    connecting screw threads, one pair of ultrasonic transducers and an electronic indicating device formed
    by an LCD display showing volume and flow, with volume resolution of 0.0001 m³ and 0.001 m³. Without
    buttons; legally non-relevant communication via optical sensor on the register. Software is separated;
    SW versions and CRCs are shown in the auto-rounding menu on the LCD display. Each volume indication
    is displayed every two minutes, separately for reverse flow and forward flow; the permanently shown
    delivered volume is the difference between the two. An optional impulse module is not part of this
    certificate. Powered from mains 24 V DC with an internal battery for temporary power failure; mains
    power cable shielding via magnetic ferrite. Installed to operate in arbitrary positions.
