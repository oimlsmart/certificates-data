components:
- role: measuring mechanism (measuring transducer)
  type_designations: []
  alternatives:
  characteristics:
    description: Chamber and rotary vane wheel (impeller) with an axle perpendicular to the flow direction
- role: register and indicating device
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Dry type mechanical register and indication device with 6 numbered drums or 7 numbered drums (least
      significant drum moves continuously) and 2 continuously moving rotating pointers
