certified_type:
  category: Water meter
  type_designations:
  - MD-K
  - MD-K1
  - MD-KP
  - MD-KP1
  module_designation: Multi jet water meter intended for the metering of cold potable water
  description: >-
    Mechanical multi-jet rotary vane wheel water meters with dry mechanical indication device, designed
    to measure, memorise and display the volume of clean cold water passing through the measurement transducer
    at metering conditions; intended for the measurement of volumes of clean water in residential use.
    Types MD-K and MD-K1 consist of a brass body, types MD-KP and MD-KP1 consist of a plastic body; the
    difference between MD-K and MD-K1 (between MD-KP and MD-KP1) is a shape and composition of the register.
    To be installed to operate in the horizontal position only with the indication device positioned at
    the top; not designed to measure the reverse flow.
