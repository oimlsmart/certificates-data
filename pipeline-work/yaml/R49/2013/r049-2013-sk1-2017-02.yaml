certified_type:
  category: Water meter
  type_designations:
  - PD-A
  - PD-AP
  description: >-
    Family of mechanical volumetric (rotary piston) water meters types PD-A and PD-AP intended for metering
    the volumes (consumption) of clean cold water in residential (households) and commercial use; installed
    into pipe lines in all installation positions. Essential parts: measuring chamber (chamber, rotary
    piston and top plate with transmission shaft); mechanical register (digital drum with gearing mechanism,
    semi-dry-dial counter with glycerine, 8 digits indication); housing (PD-A brass body, PD-AP plastic
    body); non-return valve. Non-essential part: sieve in the inlet. Optional integrated pulse output
    with reed sensor switch.
