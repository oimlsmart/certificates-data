certified_type:
  category: Water meter
  type_designations:
  - BFG070
  module_designation:
  description: >-
    Electromagnetic water meters type BFG070 designed to measure, memorise and display the volume at metering
    conditions of water passing through the measurement transducer. They consist of a flow sensor and
    an electronic calculating/indicating device. The flow sensor measures based on an induction principle
    with hard rubber lining, straight inlet (5 times the diameter) and outlet (3 times the diameter) length,
    without flow conditioner; the meter is designed to measure reverse flow. The meter must be equipped
    with a plastic cover over the electronics with a conductive coating on the inside; the LCD display
    is protected by a conductive metallic foil and all components must be conductively connected. Equipped
    with electronic indicating device (LCD) showing delivered volumes in cubic meters (positive, negative,
    total); normal resolution mode displays up to 00000000.001 m³/h and 00000000.001 m³, high resolution
    mode (used during calibration, set by factory tool protected by user, service and factory passwords)
    shows volume resolution of 0.001 L. Software version is shown after reset; checksum displayed via
    Info – FW Checksum. To be installed with the flow axis in horizontal and vertical (bottom-to-top and
    top-to-bottom) planes. Securing: one of the screws connecting the meter body and counter case is connected
    with the butts on the electronic output by a wire with a seal.
