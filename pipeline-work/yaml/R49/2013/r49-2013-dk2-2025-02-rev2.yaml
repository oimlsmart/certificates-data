certified_type:
  category: Water meter
  type_designations:
  - FM520
  - FMS500
  - FMT020
  module_designation: Not applicable
  description: >-
    Electromagnetic water meter FM520, consisting of the FMS500 sensor and the FMT020 transmitter. A constant
    pulsed DC electrical current through the coil circuit results in a magnetic field through the sensor
    bore; when a conductive liquid passes through the magnetic field, a differential DC voltage proportional
    to the fluid velocity is induced between the measuring electrodes (Faraday's Law). Applications: water
    abstraction, water treatment, water distribution network (leak detection management), custody transfer
    water meters, irrigation, wastewater treatment, filtration plant, industrial water applications. For
    OIML R 49 the product can be used only for cold potable water and hot water. Available in 25 sizes
    DN50 to DN2000.
