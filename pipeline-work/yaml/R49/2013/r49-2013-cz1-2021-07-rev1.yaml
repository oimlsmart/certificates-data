certified_type:
  category: Water meter
  type_designations:
  - GKMV40
  - GKMV40P
  module_designation: Not applicable
  description: >-
    Positive displacement water meter with dry mechanical indicating device. Type GKMV40 has a brass body,
    type GKMV40P a composite body; both consist of a body with connecting screw threads, an inlet strainer,
    a wet volumetric chamber with oscillating piston, a magnetic coupling (wet and dry side), an O-ring,
    a pressure plate closing the wet part, magnetic shields, an indicating device formed by numbered rollers
    with eight drums and one pointer, a register cap and a clamp-on cover. Approved for installation in
    any position; not designed to measure reverse flow.
