certified_type:
  category: Water meter
  type_designations:
  - MA408K
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meter with electronic indication device and internal valve for
    local and remote control. Measurement is based on the ultrasonic bidirectional transit-time principle
    (difference in time-of-flight of ultrasonic pulses downstream and upstream). Intended for measurement
    of volume of clean water in residential use. Can be installed in horizontal and vertical positions;
    not designed to measure reverse flow.
