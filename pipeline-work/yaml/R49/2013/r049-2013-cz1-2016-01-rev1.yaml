certified_type:
  category: Water meter
  type_designations:
  - MUT2200EL/MC608A
  description: >-
    Induction (electromagnetic) water meter, compact version. Flow sensors type MUT2200EL are intended
    for metering cold potable water based on an induction principle, with PTFE lining, straight inlet
    (5 times the diameter) and outlet (3 times the diameter) length, without flow conditioner. Equipped
    with an electronic calculating/indicating device type MC608A; the digital display with four buttons
    can show up to 3 lines in cubic meter volume and cubic meter per hour flow rate. Adjustment is made
    by setting the calibration factor (KA factor). Intended for mounting to horizontal pipework with the
    flow axis in the horizontal plane and the indicating device positioned at the top. Designed to measure
    reverse flow with recording flow volume separately.
