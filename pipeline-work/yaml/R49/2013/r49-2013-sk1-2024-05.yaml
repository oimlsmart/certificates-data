components:
- role: Flow sensor
  type_designations: []
  characteristics:
    description: >-
      Cylindrical brass body with inlet and outlet threaded connections; inner plastic element (casing
      pipe) placed in the cylindrical brass body; two reflection sheeds installed in the center of the
      pipe at an angle of 45 degrees with the axis of the pipe section; two ultrasonic transducers at
      the upstream and downstream of the measurement channel to transmit and receive ultrasonic signals.
      The flow is measured by the difference in time-of-flight of ultrasonic pulses with flow (downstream)
      and opposite to flow (upstream).
- role: Calculator and indication device
  type_designations: []
  characteristics:
    description: >-
      Plastic housing of the calculator with indication device directly mounted on the flow sensor; main
      PCB board with LCD display and optical sensor; electronic LCD display (scrolling using optical sensor)
      with 10 digits and indication range of 999999.9999 m³; non-replaceable lithium battery, lifetime
      16 years.
- role: Non-essential part
  type_designations: []
  characteristics:
    description: Thermistor
