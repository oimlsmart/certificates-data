certified_type:
  category: Water meter
  type_designations:
  - UL-DW PLUS
  module_designation: Ultrasonic water meter
  description: >-
    Compact ultrasonic water meter with electronic indication device. It is designed to measure, memorise
    and display the volume of water passing through the measurement transducer at metering conditions.
    Intended for the measurement of volume of clean water in residential use, can be installed in all
    positions and is not designed to measure the reverse flow. The measurement is based on ultrasonic
    bidirectional transit-time principle.
