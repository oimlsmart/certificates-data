certified_type:
  category: Water meter
  type_designations:
  - Unico4
  - Unico4coder MP
  - Unico4e
  module_designation: Not applicable
  description: >-
    Single-jet impeller water meters for cold and hot water, designed according to the dry-register principle,
    with brass body and connecting screw threads. Water flows through a mechanical strainer, single-jet
    onto the impeller wheel; the flow-proportional rotary motion of the impeller is transmitted to the
    counter by a magnetic coupling; a sealing plate secured with a bayonet ring is located between impeller
    and totalizer. Unico4/Unico4coder MP water meters have a mechanical pointer roller counter with 5
    rollers and reed contact (Unico4) or pointer roller counter with 8 rollers and absolute encoder (Unico4coder
    MP). Unico4e water meters have an electronic counter that senses the magnetic coupling of the hydraulics
    by means of TMR (resistive magnet) sensors; the firmware is split and runs on two microcontrollers,
    the metrology and display being the legally relevant part, while wM-Bus/LoRaWAN/NFC communication
    is not legally relevant. Adjustment by turning the sealing plate (Unico4e also electronically by changing
    the pulse value). Installation in four positions: horizontal with indicating device at top, horizontal
    with indicating device at side, vertical flow bottom-to-top with indicating device at side, vertical
    flow top-to-bottom with indicating device at side. The mechanical counter (Unico4coder MP) is available
    with composite housing IP67 or copper housing IP68 (manufacturer information, not certified).
