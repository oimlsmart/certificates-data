certified_type:
  category: Water meter
  type_designations:
  - EEICO-UWM2201
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meter with electronic indication device designed to measure,
    store and display the volume of clean water passing through the measurement transducers at metering
    conditions. Measurement is based on the ultrasonic bidirectional transit-time principle (difference
    in time-of-flight of ultrasonic pulses with flow and opposite to flow). Can be installed in horizontal
    and vertical positions; not designed to measure reverse flow but has a reverse flow warning.
