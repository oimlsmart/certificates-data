components:
- role: flow_sensor
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Brass body with inlet and outlet firmly connected with the plastic housing for the calculator; inner
      plastic elements (pipe support-down and pipe support-up) placed in the brass body; two mirrors installed
      in the centre of the pipe; two ultrasonic transducers at the upstream and downstream of the measurement
      channel to transmit and receive ultrasonic signals.
- role: calculator_and_indication_device
  type_designations: []
  alternatives:
  characteristics:
    description: >-
      Plastic housing of the calculator with indication device directly mounted on the flow sensor; two
      PCB boards (one for measurement, one for communication).
    display: >-
      Electronic LCD display with 10 digits; sub-multiples of a cubic meter indicated after the decimal
      point and marked with a frame
    indication_range:
      value: 99999.99999
      unit_symbol: m³
      unit_id:
    battery: >-
      One non-replaceable lithium battery for metering; end of battery life indicator activated when the
      battery voltage is below 3,6 V; lifetime 15 years
- role: non_essential_parts_and_options
  type_designations: []
  alternatives:
  characteristics:
    items:
    - filter
    - local optical sensor for communication type NB-IoT module
    - magnet as a key to switch the LCD interface
    - NB-IoT antenna
    - two temperature sensors
    - integral stop valve option
