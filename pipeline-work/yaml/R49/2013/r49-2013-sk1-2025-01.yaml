certified_type:
  category: Water meter
  type_designations:
  - SCL-61H-100, R400
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device designed to measure, memorise and
    display the volume of clean water passing through the measurement transducer at metering conditions,
    intended for residential use. Measurement is based on the ultrasonic bidirectional transit-time principle:
    the flow is measured by the difference in time-of-flight of ultrasonic pulses with flow (downstream)
    and opposite to flow (upstream). Essential parts: flow sensor (cylindrical brass body with two ultrasonic
    transducers), calculator and indication device (plastic housing directly mounted on the flow sensor,
    main PCB with LCD display and optical sensor, non-replaceable lithium battery). Non-essential parts:
    thermistor; pressure sensor (optional). Software versions V1-1.1 and V1-2.2.
