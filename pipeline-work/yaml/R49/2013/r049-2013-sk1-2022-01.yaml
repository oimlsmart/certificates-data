components:
- role: measuring_mechanism
  type_designations: []
  characteristics:
    description: >-
      Measuring chamber with rotary vane wheel (impeller) with an axle perpendicular to the flow direction;
      brass housing with inlet and outlet connections; magnetic coupling and sensing elements for detecting
      rotation and sending signals to the electronic register; internal filter
- role: calculator_with_indication_device
  type_designations: []
  characteristics:
    description: >-
      Plastic housing of the calculator with indication device directly mounted on the mechanical part;
      PCB upper board flow calculator board with LCD display; electronic LCD non-permanent (automatic
      scrolling) display with 9 digits; PCB lower board analog signal process
    display_digits:
      value: 9
      unit_symbol:
      unit_id:
- role: battery
  type_designations: []
  characteristics:
    description: >-
      Non-replaceable lithium battery; end of battery life indicator activated based on pre-calculated
      power consumption
