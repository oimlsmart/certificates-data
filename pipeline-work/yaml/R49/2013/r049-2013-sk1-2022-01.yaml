certified_type:
  category: Water meter
  type_designations:
  - TH…
  - TH15
  - TH20
  - TH25
  - TH40
  - TH50
  module_designation: Mechanical multi-jet water meters with electronic indication device
  description: >-
    Water meter type series TH… (models TH15, TH20, TH25, TH40, TH50) designed to measure, memorise and
    display the volume of water passing through the measurement transducer at metering conditions. Multi-jet
    rotary vane wheel water meters with electronic indication device, intended for measurement of volumes
    of clean water in residential use. To be installed in horizontal position only with the indication
    device positioned at the top; not designed to measure reverse flow.
