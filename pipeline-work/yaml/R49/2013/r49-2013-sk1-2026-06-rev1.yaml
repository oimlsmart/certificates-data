components:
- role: flow_sensor
  type_designations: []
  alternatives:
  characteristics:
    body: brass or composite cylindrical body with inlet and outlet
    measuring_support: inner plastic elements (pipe support-down and pipe support-up) placed in the cylindrical
      body
    reflectors: two reflectors (Inlet, Outlet) installed in the centre of the meter body (pipe)
    transducers: >-
      two ultrasonic transducers at the upstream and downstream of the measurement channel to transmit
      and receive ultrasonic signals
- role: calculator_and_indication_device
  type_designations: []
  alternatives:
  characteristics:
    display: >-
      electronic scrolling LCD display with 10 digits; sub-multiples of a cubic meter indicated with a
      frame above the six digits after the decimal point
    pcba: >-
      two PCBA: measuring PCBA located on the water meter body above the transducers; main PCBA located
      under LCD display (LCD, button, optical port, wireless communication, memory, battery)
    button: "'Touch' button for switching display functions"
