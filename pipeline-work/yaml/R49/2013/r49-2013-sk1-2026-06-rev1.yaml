certified_type:
  category: Water meter
  type_designations:
  - AFlow LXC
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device for measuring, memorizing and displaying
    the volume of clean water in residential use. Measurement is based on the ultrasonic bidirectional
    transit-time principle (difference in time-of-flight of ultrasonic pulses downstream vs upstream).
    Can be installed to operate in all positions and is designed to measure reverse flow. Body available
    in brass or composite.
