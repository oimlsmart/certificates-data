certified_type:
  category: Water meter
  type_designations:
  - iES-UW400
  module_designation: Ultrasonic water meter intended for the metering of cold potable water
  description: >-
    Compact ultrasonic water meter with electronic indication device; measurement based on ultrasonic
    bidirectional transit-time principle; designed to measure, memorise and display the volume of clean
    water passing through the measurement transducer; intended for residential use and non-resettable
    measurements between two constant partners; can be installed in horizontal or vertical position; not
    designed to measure reverse flow.
