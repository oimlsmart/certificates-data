components:
- role: measuring mechanism
  characteristics:
    design: >-
      Plastic support frame with impeller with a stainless-steel shaft placed horizontally in the flow
      direction; rotating movement transferred through a screw wheel on the magnetic clutch onto the calculator;
      connected to the iron flange cover with rubber o-ring
- role: body
  characteristics:
    design: Iron body with flanged inlet and outlet connections and with front rectifier and back rectifier
- role: magnetic coupling and sensing elements
  characteristics:
    function: Detecting rotation and sending signals to the electronic register
- role: calculator with indication device
  characteristics:
    design: >-
      Plastic housing directly mounted on the mechanical part; PCB upper board (flow calculator board
      with LCD display); PCB lower board with analog signal process connector
    display: >-
      Electronic LCD non-permanent (automatic scrolling) display with 9 digits; sub-multiples of a cubic
      meter indicated in the red frame; measured volume displayed for 30 s; after reaching maximum indication
      range, counting continues from zero
    battery: >-
      Non-replaceable lithium battery; end of battery life indicator activated based on pre-calculated
      power consumption
