  module_designation: Mechanical turbine water meters (Woltmann design) with electronic indication device
  description: >-
    Water meter type series WT… (models WT50, WT80, WT100, WT150, WT200) designed to measure, memorise
    and display the volume of clean water passing through the measurement transducer at metering conditions;
    intended for residential use. Mechanical turbine water meters with the turbine axis in the flow direction
    (Woltmann design), with an electronic indication device directly mounted on the mechanical part. Shall
    be installed to operate in the horizontal position only with the indication device positioned at the
    top; not designed to measure reverse flow. Protected against unauthorised manipulation by two seals.
