certified_type:
  category: Water meter
  type_designations:
  - LXLC-xxE4a
  module_designation: Not applicable
  description: >-
    Water meter - Woltman type with dry dial. The water meters type LXLC-xxE4a are horizontal Woltman
    meters designed to measure, memorise and display the volume at metering conditions of water passing
    through the measurement transducer. They consist of a cast iron body with connecting flanges, a measuring
    unit (plastic holder with bushes for an impeller and a straightener, an impeller with a stainless
    steel shaft, a transmission with magnetic coupling to the indicating device, a flange cover with an
    adjusting screw, a plastic register cover fixed by a pin, a dry mechanical indicating device and an
    upper plastic lid) and a dry mechanical indicating device. The reading consists of numbered rollers
    with six drums and three rotary pointers; the meters are equipped with a star wheel with six arms.
    Adjustment is realized by an adjusting screw, the access to which is protected by a sealed plastic
    register cover. The meters can be installed to operate in horizontal position only, with the indicating
    device positioned at the top.
