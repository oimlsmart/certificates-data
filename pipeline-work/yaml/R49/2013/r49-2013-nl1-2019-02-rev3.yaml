- role: measuring_sensor
  type_designations:
  - FLC-1000EL
  - FLC-2200EL
  - FLC-2300
  alternatives: OR
  characteristics:
    measuring_tube: cylindrical
    bore_options:
    - bore: full
      types:
      - FLC-1000EL (without flanges)
      - FLC-2200EL (with flanges)
    - bore: reduced
