certified_type:
  category: Water meter
  type_designations:
  - 100E
  - SCL-61H-100
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device for measuring, memorising and displaying
    the volume of clean water in residential use. Measurement is based on the ultrasonic bidirectional
    transit-time principle. Can be installed in horizontal position with indication device on top or vertical
    position. Not designed to measure reverse flow. Flow sensor: cylindrical brass body with inlet and
    outlet threaded connections, inner plastic casing pipe, two reflection sheets at 45 degrees to the
    pipe axis, and two ultrasonic transducers upstream and downstream. Calculator and indication device
    mounted directly on the flow sensor with main PCB, LCD display (10 digits) and optical sensor, powered
    by a non-replaceable lithium battery.
