components:
- role: flow_sensor
  type_designations: []
  characteristics:
    body: cylindrical brass body with inlet and outlet threaded connections
    inner_element: inner plastic element (casing pipe) placed in the cylindrical brass body
    reflection_sheets: >-
      two reflection sheets installed in the centre of the pipe at an angle of 45 degrees with the axis
      of the pipe section
    transducers: two ultrasonic transducers at the upstream and downstream of the measurement channel
- role: calculator_and_indication_device
  type_designations: []
  characteristics:
    housing: plastic housing of the calculator with indication device directly mounted on the flow sensor
    electronics: main PCB board with LCD display and optical sensor
