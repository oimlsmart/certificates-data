  module_designation: Not applicable
  description: >-
    Single jet rotary vane wheel water meters with dry mechanical indicating device, designed to measure,
    memorise and display the volume at metering conditions of water passing through the measurement transducer.
    They consist of a brass body with connecting screw threads, an inlet strainer, a bottom plate, a rotary
    vane wheel and cover plate, a magnetic coupling (wet and dry side), a rubber O-ring and a plastic
    (PPO) gasket, a plastic locking ring closing the wet part with two magnetic shields, a mechanical
    indicating device with pointers and numbered drums, a plastic cover and a plastic lid. To be installed
    in horizontal position only with the indicating device positioned at the top.
