components:
- role: measuring_mechanism
  type_designations: []
  characteristics:
    construction:
      value: measuring chamber and rotary vane wheel (impeller) with an axle perpendicular to the flow
        direction
- role: register
  type_designations: []
  characteristics:
    register_type:
      value: wet mechanical register with gearing mechanism, drum register immersed in special type liquid
    number_of_numbered_drums:
      value: 5
    number_of_rotating_pointers:
      value: 4
    transmission:
      value: direct from the impeller to the gears of the reading mechanism
- role: housing
  type_designations: []
  characteristics:
    features:
      value: with inlet and outlet connections
- role: adjustment_device
  type_designations: []
  characteristics:
    function:
