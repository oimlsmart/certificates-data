certified_type:
  category: Water meter
  type_designations:
  - ML-B
  - ML-BP
  description: >-
    Mechanical multi-jet wet dial water meter for metering of clean cold water in household or residential
    use. Multi-jet rotary vane wheel water meter with mechanical indication device; measures, memorises
    and displays the volume of water passing through the measurement transducer. Type ML-B has a brass
    body, type ML-BP has a plastic body. Both types shall be installed in horizontal position with the
    indication device positioned at the top. Wet mechanical register with 5 numbered drums and 4 rotating
    pointers; adjustment screw regulates the internal by-pass flow. Optional: sieve in the inlet, non-return
    valve, pulse output.
