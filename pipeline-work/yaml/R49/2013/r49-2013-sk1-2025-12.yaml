certified_type:
  category: Water meter
  type_designations:
  - LXC15
  - LXC20
  - LXC25
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    The ultrasonic water meters LXC15, LXC20, LXC25 are residential compact ultrasonic water meters with
    electronic indication device, designed to measure, memorize and display the volume of clean water
    passing through the measurement transducers at metering conditions. The measurement is based on the
    ultrasonic bidirectional transit-time principle (difference in time-of-flight of ultrasonic pulses
    with flow and opposite to flow). The meters can be installed in horizontal or vertical positions and
    are not designed to measure the reverse flow. Essential parts: flow sensor (brass cylindrical body
    with inlet and outlet, inner plastic pipe supports, two reflection sheets and two ultrasonic transducers)
    and calculator with indication device directly mounted on the flow sensor (PCBA board, electronic
    scrolling LCD display with 9 digits and indication range of 99999.9999 m³, one non-replaceable lithium
    battery with 15 years lifetime). Optional non-essential parts: stainless steel ball valve, motor,
    and communication interfaces (optical port, pulse output, NB-IoT/GPRS/3G/4G/Cat1, MBus/RS485, LoRa/LoRaWan/Sigfox/WM-Bus).
