certified_type:
  category: Water meter
  type_designations:
  - Topas SONIC (TSO)
  - Sonic TOPAS
  module_designation: Not applicable
  description: >-
    Ultrasonic water meters type TOPAS Sonic with electronic indicating device, designed to measure, memorise
    and display the volume at metering conditions of water passing through the measurement transducer.
    The meters consist of a brass body with connecting screw threads, one pair of ultrasonic transducers
    and the electronic indicating device formed by an LCD display showing volume and flow. Volume resolution
    of 0.001 m³ on the digital display. No buttons; legally non-relevant communication with the meter
    is possible via an NFC sensor connected on the register. Software separation is applied; SW version
    and CRC of the legally relevant part are displayed in the auto-rounding menu on the LCD display. The
    meter displays the indication of each volume every ten seconds — separately for reverse flow and separately
    for forward flow. Battery powered 3.6 V DC. Can be installed to operate in arbitrary positions; internal
    pipe dimensions are the same for each size.
