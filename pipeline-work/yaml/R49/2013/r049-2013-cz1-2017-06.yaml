certified_type:
  category: Water meter
  type_designations:
  - 280W-CI
  module_designation:
  description: >-
    Ultrasonic water meters type 280W-CI intended for metering cold potable water, based on an ultrasonic
    transit-time principle, with straight inlet (5 times the diameter) and outlet (3 times the diameter)
    length, without flow conditioner, equipped with an electronic calculating/indicating device. The display
    shows measurements in cubic meter volume and cubic meter per hour flow rate. The meter is not designed
    to measure reverse flow. Intended for mounting to horizontal, vertical and diagonal pipework with
    the indicating device positioned at the top and at the side. Two indication modes: high resolution
    mode (volume resolution 0.000001 m³, used during calibration) and normal resolution mode (up to 000000.001
    m³/h flow rate and 0000000.01 m³ volume). Optionally equipped with an M-bus transmitter for remote
    reading. Sealing cap permanently adhered to the 2 screws aligned with the display to prevent tampering.
