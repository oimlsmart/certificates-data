certified_type:
  category: Water meter
  type_designations:
  - Smartio
  module_designation:
  description: >-
    Ultrasonic water meter, dry dial, designed to measure, memorise and display the volume at metering
    conditions of water passing through the measurement transducer. Consists of a cast brass body with
    connecting screw threads, one pair of ultrasonic transducers and an electronic indicating device with
    LCD display; volume resolution 0.00001 m³. Legally non-relevant communication possible via NFC sensor.
    Software separation applied. Powered by non-replaceable 3.6 V battery. Can be installed in any position.
    Optionally equipped with an impulse module, which is not part of this certificate.
