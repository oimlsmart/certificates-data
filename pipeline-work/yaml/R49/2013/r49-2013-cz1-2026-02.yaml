certified_type:
  category: Water meter
  type_designations:
  - SKW-V
  - SKW-NV
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter for residential applications, intended for metering cold potable water. Measures,
    memorises and displays the volume at metering conditions of water passing through the measurement
    transducer, based on the ultrasonic transit-time principle without flow conditioner. Equipped with
    an electronic calculating/indicating device with a digital display of up to 9 digits showing volume
    in m³ and flow rate in m³/h; two indication modes: high-resolution mode (used during calibration,
    resolution 0.000001 m³) and normal resolution mode. Can optionally be equipped with an M-bus transmitter
    for remote reading (not certified). Can be installed to operate in any position; not designed to measure
    reverse flow.
