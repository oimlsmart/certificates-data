certified_type:
  category: Water meter
  type_designations:
  - MUT2200EL/MC608A
  - MUT2200EL
  - MC608A
  module_designation:
  description: >-
    The water meter type MUT2200EL/MC608A is an induction water meter (compact version). The flow sensors
    type MUT2200EL are intended for metering cold potable water, based on an induction principle, with
    PTFE or ebonite lining, with straight inlet (5 times the diameter) and outlet (3 times the diameter)
    length, without flow conditioner. The water meters are equipped with an electronic calculating/indicating
    device type MC608A. The display shows the measurements in cubic meter volume and cubic meter per hour
    flow rate. The display is a digital type with four buttons and can show up to 3 lines. The adjustment
    is made by setting the calibration factor (KA factor). The meter is intended for mounting to horizontal
    pipework with the flow axis in the horizontal plane and with the indicating device positioned at the
    top. The meter is designed to measure reverse flow with recording flow volume separately.
