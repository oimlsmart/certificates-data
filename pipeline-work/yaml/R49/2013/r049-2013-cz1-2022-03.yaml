certified_type:
  category: Water meter
  type_designations:
  - SD15S
  module_designation: Not applicable
  description: >-
    Single jet rotary vane wheel water meters with dry mechanical indicating device, designed to measure,
    memorize and display the volume at metering conditions of water passing through the measurement transducer.
    They consist of a brass body with connecting screw threads, a strainer in front of wet measuring unit,
    a shaft, a rotary vane wheel, gear box, a magnetic coupling (wet and dry side), a rubber O-ring, a
    plastic plate closing the water meter, magnetic shields and a mechanical indicating device formed
    by numbered rollers with five drums, three pointers and pilot. Adjustment is realized by adjusting
    the position of screw; access to the adjusting screw is protected by seal. To be installed in horizontal
    position with the indicating device at the top; not designed to measure reverse flow. Sealed by connecting
    the plastic ring to the brass body by a wire with seal.
