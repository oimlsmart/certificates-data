certified_type:
  category: Water meter
  type_designations:
  - MD-K
  - MD-K1
  - MD-KP
  - MD-KP1
  description: >-
    Mechanical multi-jet dry dial water meter for metering of cold water (multi-jet rotary vane wheel
    water meter with dry mechanical register and indication device) intended for measurement of volumes
    of clean cold water in residential use. Types MD-K and MD-K1 have a brass body; types MD-KP and MD-KP1
    have a plastic body. The difference between MD-K and MD-K1, and between MD-KP and MD-KP1, is the shape
    and composition of the register. Meters are installed to operate in horizontal position only with
    the indication device positioned at the top. Essential parts: measuring mechanism (chamber and rotary
    vane wheel/impeller with axle perpendicular to flow direction), dry-type mechanical register and indication
    device with 6 numbered drums (least significant drum moving continuously) and 2 continuously moving
    pointers, magnetic coupling, housing with inlet and outlet connections, adjustment device (adjustment
    screw regulating internal by-pass flow), magnetic shield protection. Optional parts: sieve at inlet,
    non-return valve at outlet; optional pulse output. Software: not applicable. Trademarks: AIMEI, ASM.
