components:
- role: flow_sensor
  type_designations: []
  characteristics:
    principle: ultrasonic bidirectional transit-time
    description: >-
      Cylindrical plastic body with inlet and outlet threaded connections; inner plastic element (casing
      pipe) placed in the cylindrical brass and plastic body; two reflection sheeds installed at 45 degrees
      to the pipe axis; two ultrasonic transducers at the upstream and downstream of the measurement channel.
- role: calculator_and_indication_device
  type_designations: []
  characteristics:
    description: >-
      Plastic housing directly mounted on the flow sensor; main PCB board with LCD display and optical
      sensor; non-replaceable lithium battery; electronic LCD display (scrolling via optical sensor) with
      10 digits.
- role: non_essential_part
  type_designations: []
  characteristics:
    description: Thermistor.
