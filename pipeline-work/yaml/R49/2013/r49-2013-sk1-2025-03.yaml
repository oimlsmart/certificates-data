certified_type:
  category: Water meter
  type_designations:
  - SCL-61H-100C
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device, designed to measure, memorise and
    display the volume of clean water in residential use. Measurement is based on the ultrasonic bidirectional
    transit-time principle (difference in time-of-flight of ultrasonic pulses with and against the flow).
    Can be installed in horizontal position with indication device on top or in vertical position; not
    designed for measurement of reverse flow. Integrated equipment/functions: optical interface, NB-IoT,
    M-Bus, RS-485, RF, Pulse, Sigfox (optional), LoRaWAN, W-MBus. Protected against unauthorized manipulation
    by two lead seals.
