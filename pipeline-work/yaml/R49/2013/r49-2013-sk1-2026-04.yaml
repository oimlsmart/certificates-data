certified_type:
  category: Water meter
  type_designations:
  - AK-411
  module_designation: Ultrasonic water meter
  description: >-
    Compact ultrasonic water meter with electronic indication device, based on the ultrasonic bidirectional
    transit-time principle. Designed to measure, memorise and display the volume of clean water passing
    through the measurement transducer at metering conditions, for residential, commercial and light industrial
    use. Can be installed in horizontal and vertical positions; not designed to measure reverse flow.
    Non-essential parts: prepayment system with on-off valve and electronic card, communication (Mbus,
    RF, LoRa, MODbus, NB-IoT, GPRS, SMARTcard, optic), pulse output, strainer, antenna.
