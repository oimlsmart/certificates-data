certified_type:
  category: Water meter
  type_designations:
  - LXC-15
  - LXC-20
  - LXC-25
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device for measurement of volume of clean
    water in residential use. Measurement is based on the ultrasonic bidirectional transit-time principle
    (difference in time-of-flight of ultrasonic pulses downstream and upstream). Not designed to measure
    reverse flow. Can be installed in the horizontal position with indication device on top or in the
    vertical position.
