certified_type:
  category: Water meter
  type_designations:
  - MAGX2
  description: >-
    Electromagnetic water meter for metering cold potable water and hot water, based on an inductive principle,
    with PTFE and hard rubber lining, straight inlet (5 times the diameter) and outlet (3 times the diameter)
    lengths, without flow conditioner, equipped with an electronic calculating/indicating device. Two
    modifications: compact and remote (maximum cable length for remote version 6 m). Digital display with
    6 buttons, up to 9 digits in two lines, showing volume (positive, negative, total and auxiliary) in
    m³ and flow rate in m³/h; high-resolution mode (0.001 L volume) used during calibration. Optional
    frequency output for remote reading (maximum cable length 3 m). Not designed to measure reverse flow.
    Intended for mounting onto pipework with the flow axis in horizontal and vertical planes, with the
    indicating device positioned at the top or at the side. Covers nominal diameters DN25 to DN300.
