components:
- role: Water meter body and ultrasonic flow sensors
  type_designations: []
  characteristics:
    description: >-
      Brass cylindrical body with inlet and outlet threaded connections, internal plastic parts with two
      reflectors, and two ultrasonic sensors placed on the upside of the cylindrical body
- role: Calculator and indication device
  type_designations: []
  characteristics:
    description: >-
      Plastic housing of the calculator with indication device directly mounted on the water meter body;
      main PCBA unit (LCD display, button, optical port, wireless communication, memory chip, power supply);
      measuring PCBA unit (ultrasonic, temperature and pressure sensors, measurement chip); LCD electronic
      scrolling display with 10 digits (IWU100) or 11 digits (IWU110 (MWU5))
footnotes: []
