  description: >-
    Ultrasonic water meter family Iskrasonic 1000 (DN15–DN50) comprising types IWU100 and IWU110 (MWU5),
    designed to measure, memorize and display the volume of clean water in residential use. The IWU110
    (MWU5) is additionally equipped with a pre-payment system which is outside the scope of OIML certification.
    The meters can be installed in all positions and are not designed to measure reverse flow.
