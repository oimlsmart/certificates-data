certified_type:
  category: Water meter
  type_designations:
  - 280W-…
  - 280W-R
  - 280W-D
  description: >-
    Ultrasonic water meter for metering cold potable water, based on an ultrasonic transit-time principle,
    with straight inlet (5 times the diameter) and outlet (3 times the diameter) length, without flow
    conditioner, equipped with an electronic calculating/indicating device. Two modifications: type 280W-R
    intended for residential applications and type 280W-D for sub-metering. The digital display shows
    volume in m³ and flow rate in m³/h, up to 9 digits, with a high-resolution (calibration) mode and
    a normal resolution mode. The meter is not designed to measure reverse flow. Intended for mounting
    to horizontal, vertical and diagonal pipework with the indicating device positioned at the top and
    at the side. May optionally be equipped with an M-bus transmitter for remote reading.
