certified_type:
  category: Water meter
  type_designations:
  - LXSG-xxE5/RLN1
  - LXSG-xxE5/S/RLN1
  - LXSG-xxE5/RLN2
  - LXSG-xxE5/S/RLN2
  module_designation: Not applicable
  description: >-
    Multi jet rotary vane wheel water meters with dry mechanical indicating device. 'xx' in the type designation
    denotes the nominal diameter. Variants: LXSG-xxE5/RLN1 (brass body, indicating device RLN1), LXSG-xxE5/S/RLN1
    (plastic body, RLN1), LXSG-xxE5/RLN2 (brass body, RLN2), LXSG-xxE5/S/RLN2 (plastic body, RLN2). Construction:
    body with connecting screw threads, inlet strainer and adjusting screw, plastic gasket, wet measuring
    unit with plastic distributor with tangential holes and shaft, rotary vane wheel and cover plate,
    magnetic coupling (wet and dry side), rubber O-ring and plastic gasket, brass (or plastic) ring closing
    the wet part, two magnetic shields, mechanical indicating device with pointers and numbered drums,
    plastic cover with plastic lid. Indicating devices RLN1 and RLN2 have seven drums (5 black and 2 red)
    and two pointers. Adjustment by adjusting screw protected by sealed screw. To be installed in horizontal
    position only with the indicating device at the top. Sealing: plastic cover connected to the adjusting
    screw using a wire with a lead (plastic) seal.
