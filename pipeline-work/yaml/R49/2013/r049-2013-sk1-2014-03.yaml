certified_type:
  category: Water meter
  type_designations:
  - CM
  - CM1
  module_designation:
  description: >-
    Mechanical volumetric concentric (rotary piston) water meter for metering of cold water in residential
    use. Volumetric water meter with dry mechanical indication device and plastic body. To be installed
    in horizontal position with the indication device positioned at the top; intended to fit into a closed
    conduit by means of an intermediate fitting (manifold), connected via thread size G 1 1/2 at the base
    of the meter body. Optional pulse output. Trademarks: AIMEI, ASM.
