  text: >-
    With X being 1 for standard or 3 for advanced or 5 for premium (mobile Comms - MC) variant; Y being
    1, 2, 8 or 9 (integral/remote version, optionally sensor only); Z being R (reduced bore), V (virtual
    full bore) or F (full bore).
