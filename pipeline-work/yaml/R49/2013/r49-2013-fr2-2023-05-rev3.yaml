revision_history:
- revision: '0'
  date: '2023-07-06'
  changes: Initial certification
- revision: '1'
  date: '2024-04-30'
  changes: >-
    Extension of dynamic measuring range of A3 DN20 water meter to R1000 for Q3=4 m³/h at T30/T50 and
    R630 for Q3=2.5 m³/h. Addition of 20/190 and 20/165 composite bodies and 20/110 brass body.
- revision: '2'
  date: '2024-11-13'
  changes: >-
    Addition of A3 DN15mm meters with dynamic measurement R1000H and R800 in all positions for Q3=2.5
    m³/h in T30/T50 and R630H and R500 in all positions for Q3=1.6 m³/h.
- revision: '3'
  date: '2025-07-01'
  changes: >-
    Addition of A3 DN15 composite body version. Addition of 15/115 1" threaded brass body A3 DN15 version.
