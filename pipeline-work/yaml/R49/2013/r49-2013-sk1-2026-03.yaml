components:
- role: measuring_mechanism
  type_designations: []
  characteristics:
    description: >-
      Measuring chamber assembled with a rotary piston and top plate with transmission shaft for connection
      of measuring part with register
- role: register_and_indication_device
  type_designations: []
  characteristics:
    type: dry type mechanical register and indication device
    description: >-
      8 numbered drums (last significant drum moves continuously): 5 black drums for cubic meters, 3 red
      drums for sub-multiples of a cubic meter; 1 continuously moving rotating pointer marked with 0.00005
      sub-multiples of a cubic meter
- role: magnetic_coupling
  type_designations: []
  characteristics:
    description: Connection of the register part with the measuring mechanism (rotary piston)
- role: body
