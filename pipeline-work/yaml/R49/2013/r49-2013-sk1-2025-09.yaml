certified_type:
  category: Water meter
  type_designations:
  - SSM-AQUO
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device designed to measure, memorise and
    display the volume of clean water in residential use (non-resettable measurements). Measurement based
    on the ultrasonic bidirectional transit-time principle. Can be installed in all positions and is not
    designed to measure reverse flow. Hydraulic brass body (DN15 to DN40) or plastic body (DN15 and DN20);
    optional integrated radio interfaces: Wireless M-Bus, LoRaWAN, NB-IoT.
