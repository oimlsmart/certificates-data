certified_type:
  category: Water meter
  type_designations:
  - MS2500 / MV110
  - MS2500 / MV145
  module_designation: >-
    MS2500 / MV110 HV; MS2500 / MV110 LV; MS2500 / MV110 LLV; MS2500 / MV145 HV + lit. battery; MS2500
    / MV145 LLV + alk. battery; MS2500 / MV145 LLV + lit. battery
  description: >-
    Electromagnetic water meters with electronic indicating device (LCD), designed to measure, memorise
    and display the volume at metering conditions of water passing through the measurement transducer.
    Consist of sensor MS2500 (steel body with flanges, excitation coils, electrodes) and converter MV110
    or MV145, in compact set-up or separate version with connecting cable. Volume displayed with 0.001
    m³ resolution; impulse and current outputs; legally non-relevant communication via RS485 or USB mini-B.
    Power-supply modifications: MV110 HV (100-240 V AC), MV110 LV (24-36 V AC/DC), MV110 LLV (10-48 V
    DC); MV145 HV + lithium battery (100-240 V AC, 3.7 V backup), MV145 LLV + alkaline battery (10-48
    V DC, 9 V backup), MV145 LLV + lithium battery Li-SOCl2 (10-48 V DC, 3.6 V backup). Liner options:
    PTFE (DN25-DN350, 90°C), polypropylene (DN25-DN150, 50°C), Rilsan (DN50-DN350, 50°C), Ebonite (DN200-DN350,
    50°C). Can be installed in any position.
