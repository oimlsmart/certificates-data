certified_type:
  category: Water meter
  type_designations:
  - U-WR2 series
  - U-WR2-15
  - U-WR2-20
  - U-WR2-25
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meters with electronic indication device (types U-WR2-15, U-WR2-20
    and U-WR2-25) for measuring, memorizing and displaying the volume of clean water in residential use.
    Measurement is based on the ultrasonic bidirectional transit-time principle (difference in time-of-flight
    of ultrasonic pulses with and against the flow). Meters with R500 can be installed in all positions;
    R800 in H position. Not designed to measure reverse flow. Essential parts: flow sensor (plastic cylindrical
    body with two reflection sheeds and two ultrasonic transducers) and calculator with indication device
    (PCB, 9-digit electronic scrolling LCD with indication range 999999.999 m³, one non-replaceable lithium
    battery for metering). Non-essential parts: filter, local optical port for communication types LoRaWAN
    Class A, NB-IoT Standard, two-wire pulse output, three-wire pulse output, WM-Bus, M-Bus (optionally),
    antenna (optionally), one battery for communication, pressure sensor selectable.
