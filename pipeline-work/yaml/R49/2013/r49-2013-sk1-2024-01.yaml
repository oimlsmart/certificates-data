certified_type:
  category: Water meter
  type_designations:
  - MA408
  module_designation: Ultrasonic water meters with electronic indication device
  description: >-
    Residential compact ultrasonic water meter with electronic indication device, designed to measure,
    memorize and display the volume of clean water passing through the measurement transducers at metering
    conditions. The measurement is based on the ultrasonic bidirectional transit-time principle (difference
    in time-of-flight of ultrasonic pulses with and against the flow). Can be installed to operate in
    horizontal and vertical positions; not designed to measure reverse flow. Intended for measurement
    of volume of clean water in residential use.
