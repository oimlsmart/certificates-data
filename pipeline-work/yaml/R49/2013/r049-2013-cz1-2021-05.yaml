certified_type:
  category: Water meter
  type_designations:
  - ULTRIMIS (UL)
  - UL 2.5
  - UL 4
  - UL 6.3
  - UL 10
  - UL 16
  - UL 25
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter designed to measure, memorise and display the volume at metering conditions
    of water passing through the measurement transducer. Consists of a brass or composite body with connecting
    screw threads, one pair of ultrasonic transducers and an electronic indicating device formed by an
    LCD display showing volume and flow. Two indication modes: normal resolution mode and high resolution
    mode (used during calibration) with a displayed volume resolution of 0.00001 m³. No buttons; adjustment
    and reading/setting of metrological data is realised electronically using NFC, access secured by password.
    Legally non-relevant communication is possible by radio module with frequency 433 MHz, 434 MHz or
    868 MHz; the radio module is not part of this certificate. Separation of software; SW versions and
    CRCs are displayed on the LCD in the auto-rounding menu. The meters are installed to operate in arbitrary
    orientation and are not designed to measure reverse flow. Sealed by embedding the clamp-on cover to
    the meter body; equipped with electronic tamper detection shown on the LCD display.
