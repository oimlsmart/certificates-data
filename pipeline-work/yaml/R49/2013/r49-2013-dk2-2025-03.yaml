certified_type:
  category: Water meter
  type_designations:
  - KWM3231
  module_designation: Not applicable
  description: >-
    KWM3231 is an integrated and hermetically sealed static water meter based on the ultrasonic measuring
    principle, without any moving parts. The meter body is made of PPS composite material or stainless
    steel. It has a display indicating the registered volume, measuring unit and error codes, plus an
    optical eye for data reading and configuration. Power is supplied from internal lithium batteries
    (2 x A-cell), with a separate pulse interface for converting the data telegram into volume pulses
    during calibration. The meter is fully IP68 rated and may be submerged in water. The meter may only
    be opened by Kamstrup A/S.
