  - MD-AP
  module_designation:
  description: >-
    Mechanical multi-jet dry dial water meters types MD-A and MD-AP designed to measure, memorise and
    display the volume of water passing through the measurement transducer at metering conditions, intended
    for measurement of volumes (consumption) of clean cold and hot water in household and commercial use.
    Multi-jet rotary vane wheel water meters with mechanical indication device, with brass body (type
    MD-A) and plastic body (type MD-AP). Installed into pipe lines in horizontal position only with the
    indicating device positioned at the top; not designed to measure reverse flows. Essential parts: measuring
    mechanism consisting of measuring chamber and rotary vane wheel (impeller) with axle perpendicular
    to flow direction; dry type mechanical register and indication device with 5 numbered drums (last
    significant drum moves continuously) and 4 continuously moving rotating pointers for DN15, DN20, DN25,
    DN32, and 6 numbered drums and 4 pointers for DN40 and DN50; housings with inlet and outlet connections;
    adjustment device (adjustment screw regulating the internal by-pass flow); magnetic coupling connecting
    register with measuring part. Optional integrated equipment: data output module RF or MBUS; pulse
    output module. Software: not applicable.
