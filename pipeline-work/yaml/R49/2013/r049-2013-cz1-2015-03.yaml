certified_type:
  category: Water meter
  type_designations:
  - MJ-SDC PLUS
  module_designation:
  description: >-
    Multi jet rotary vane wheel water meters with dry mechanical indicating device. Consist of a brass
    body with connecting screw threads or flanges, inlet strainer and adjusting screw, a rubber gasket,
    plastic casing for an impeller with multiple inlets and outlets, stainless steel shaft with plastic
    tip, rotary vane impeller with agate bearing and magnetic ring, plastic casing for an indicating device
    with a rubber O-ring, antimagnetic protection ring, plastic shaft with a magnetic ring, a dry mechanical
    indicating device, plastic ring, rubber O-ring, glass window and brass screw head ring with a plastic
    sliding gasket and a plastic lid. Two variants of the mechanical indicating device: variant with 5
    (DN15-32) or 6 (DN40-50) numbered rollers and 4 rotary pointers, and variant with 7 (DN15-32) or 8
    (DN40-50) numbered rollers and 2 rotary pointers; a star wheel with 6 arms on the indicating device
    can be used for rapid testing. Optionally equipped with a reed impulse transmitter for remote reading,
    parts for mounting of an AMR device and an inductive pointer for AMR reading.
