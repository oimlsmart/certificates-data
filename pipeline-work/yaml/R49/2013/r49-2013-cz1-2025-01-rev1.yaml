certified_type:
  category: Water meter
  type_designations:
  - 280W-…
  - 280W-R
  module_designation: Not applicable
  description: >-
    Ultrasonic water meters type 280W-R intended for metering cold potable water, based on an ultrasonic
    transit-time principle, without flow conditioner, equipped with an electronic calculating/indicating
    device. The display shows the measurements in cubic meter volume and cubic meter per hour flow rate.
    The meter is not designed to measure reverse flow and does not require any extra-mechanical housing
    or adjustments. Body of the meter is from brass. Mounting in any position with flow axis in horizontal,
    vertical and diagonal planes, indicating device positioned at the top and at the side. Digital display
    with up to 9 digits, two indication modes (high resolution mode for calibration, volume resolution
    0.000001 m³, and normal resolution mode). Optional M-bus transmitter for remote reading.
