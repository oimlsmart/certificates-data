certified_type:
  category: Water meter
  type_designations:
  - LXC
  module_designation: Not applicable
  description: >-
    Ultrasonic water meter type LXC consisting of a brass body with screw threads, a pair of ultrasonic
    transducers and an electronic indicating device formed by an LCD display equipped with a photosensitive
    button for rapid test; the display shows the delivered volume for forward flow as a default. Two-part
    plastic cover with protruding brass screw threads, connected by two screws and prepared for ensuring
    the integrity of the water meter. Powered by a permanent battery with voltage 3.6 V and lifetime 10
    years. Installation positions: H-up horizontal with the indicating device at the top, H-side horizontal
    with the indicating device at the side, and V-up vertical with flow from bottom to top and the indicating
    device at the side. Temperature classes T30 and T50, accuracy class 2.
