certified_type:
  category: Water meter
  type_designations:
  - LXH-15
  - LXH-20
  - LXHY-15
  - LXHY-20
  - LXHY-15/S
  - LXHY-20/S
  description: >-
    Volumetric (semi-positive displacement rotary piston) water meters with wet mechanical indicating
    device with protected registered drums. Body of brass (LXH, LXHY) or composite (LXHY-15/S, LXHY-20/S),
    divided into two parts connected by screws, with connecting screw threads, inlet strainer, wet measuring
    unit with piston and mechanical transmission, rubber O-ring, and a mechanical indicating device protected
    by a plastic cover. The indicating device consists of numbered rollers with eight drums installed
    in a capsule filled with special liquid. Not designed to measure reverse flow. Intended for mounting
    on pipework with the flow axis in the horizontal and vertical (bottom-to-top and top-to-bottom) plane,
    with the indicating device positioned at the top or at the side. To prevent tampering, the brass or
    composite body parts are sealed together with a wire and lead seal.
