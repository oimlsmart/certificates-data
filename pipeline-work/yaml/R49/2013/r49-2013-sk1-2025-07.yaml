certified_type:
  category: Water meter
  type_designations:
  - SKW-CD
  module_designation: Ultrasonic water meter with electronic indication device
  description: >-
    Compact ultrasonic water meter with electronic indication device designed to measure, memorise and
    display the volume of water passing through the measurement transducer at metering conditions, intended
    for measurement of volume of clean water in residential use. Measurement is based on ultrasonic bidirectional
    transit-time principle; the flow is measured by the difference in time-of-flight of ultrasonic pulses
    with flow (downstream) and opposite to flow (upstream). Can be installed in horizontal and vertical
    positions. Not designed to measure reverse flow.
