  module_designation:
  description: >-
    Mechanical single-jet dry dial water meter for metering of cold and hot water, designed to measure,
    memorize and display the volume at metering conditions of water passing through the measurement transducer;
    intended for measurement of volumes of clean cold and hot water in household or residential use. Essential
    parts: measuring mechanism consisting of the rotary vane wheel with an axle perpendicular to the flow
    direction, lower and upper tightening plates with bearing hubs; dry type mechanical register (register
    chamber casing of plastic or copper) with 6 numbered drums and 2 continuously moving rotating pointers;
    housing with inlet and outlet connections (brass body for SD-B and SD-B1, plastic body for SD-BP and
    SD-BP1); adjustment device via external regulating; magnetic coupling connecting measuring mechanism
    with mechanical register. Optional parts: inlet strainer, non-return valve, pulse output module. Software:
    not applicable. To be installed in horizontal position with indication device positioned at the top
    or in vertical position according to Tables 1 and 2. Trademarks: AIMEI, ASM.
