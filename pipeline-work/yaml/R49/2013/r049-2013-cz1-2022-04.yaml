certified_type:
  category: Water meter
  type_designations:
  - Unico2coder MP
  module_designation: Not applicable
  description: >-
    Single-jet rotary vane wheel water meters with dry mechanical indicating device, designed to measure,
    memorise and display the volume at metering conditions of water passing through the measurement transducer.
    Consist of a brass body with connecting screw threads, a rubber gasket, a strainer in front of wet
    measuring unit with a plastic distributor with tangential holes and a shaft, a rotary vane wheel and
    gear box, a magnetic coupling (wet and dry side), a rubber gasket, a brass ring closing the water
    meter, a magnetic shield, and a mechanical indicating device with pointers and numbered drums (numbered
    rollers with eight drums and one pointer). Installed to operate in three positions: a - horizontal
    position with the indicating device at the top; b - horizontal position with the indicating device
    at side; c - vertical position with flow from bottom to top. Not designed to measure reverse flow.
    Sealing realized by encapsulating the cover (snapping hood and holding ring) to the body of the water
    meter.
