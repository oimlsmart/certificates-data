certified_type:
  category: Water meter
  type_designations:
  - DHV3000
  - DHV3200
  description: >-
    Semi positive displacement rotary piston water meters with wet mechanical indicating device with protected
    registered drums. DHV3000 has a brass body and DHV3200 a composite body, each divided into two parts
    connected by screw, with connecting screw threads, an inlet strainer, a wet measuring unit with a
    piston and mechanical transmission, rubber O-ring, and a mechanical indicating device protected by
    a plastic cover. The mechanical indicating device is formed by numbered rollers with eight drums installed
    in a capsule filled with special liquid. The meters are not designed to measure reverse flow. Intended
    for mounting on pipework with the flow axis in the horizontal or vertical (bottom-to-top and top-to-bottom)
    plane, with the indicating device positioned at the top or at the side.
