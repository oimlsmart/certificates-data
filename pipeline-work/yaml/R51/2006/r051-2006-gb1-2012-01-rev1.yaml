certified_type:
  category: Automatic catchweigher
  type_designations:
  - LI-700E
  - CWL-700E
  module_designation: N/A
  description: >-
    This pattern of an automatic catchweigher, designated the LI-700E, operates as an automatic weight or weight/price labeller
    (Category Y) and as an automatic checkweigher (category X). The instrument is designated the CWL-700E when configured
    to operate only as an automatic checkweigher (category X). The instrument comprises a self-indicating and price-computing
    weighing machine with associated thermal label printer and mechanical handling facilities. It is designed to weigh packs
    statically, at a constant rate of operation.
