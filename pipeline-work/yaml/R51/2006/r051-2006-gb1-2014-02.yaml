certified_type:
  category: Automatic checkweighing/catchweighing instrument
  type_designations:
  - MCheck2
  description: >-
    Mains-powered automatic checkweighing/catchweighing instrument designated the MCheck2, with in-feed,
    weigh head and out-feed conveyors (driven by DC motors) fitted with photocells for pack detection,
    and a touchscreen control and display pod.
