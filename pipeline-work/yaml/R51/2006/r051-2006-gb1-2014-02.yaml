components:
- role: load cell
  type_designations:
  - PC1 C3
  alternatives: OR
  characteristics:
    manufacturer: Flintec
    technology: strain gauge, analogue output (load cells with digital output not permitted)
    maximum_capacity:
      value: 30
      unit_symbol: kg
      unit_id:
    location: below the centre of the weigh conveyor
    dynamically_tested_reference: Tedea 1040 C3 (capacity 15 kg)
    replacement_conditions: >-
      Any compatible load cell(s) may be used provided: a respective OIML R60 Certificate of Conformity
      is issued for the load cell; the certificate contains the load cell types and the necessary load
      cell data required for the manufacturer's declaration of compatibility of modules and any particular
      installation requirements; a load cell marked NH is allowed only if humidity testing to R76 has
      been conducted; it is not a load cell with digital output; characteristics such as n_lc, Y, Z are
      the same or better than the load cell tested dynamically (Tedea 1040 C3, capacity 15 kg); design
      and material are the same; no oil damper is used.
