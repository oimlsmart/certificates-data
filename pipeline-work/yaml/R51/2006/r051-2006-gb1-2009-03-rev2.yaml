      value: 10 or 15
      unit_symbol: kg
    applies_to:
      value: Entry/Mid-range and Top range configurations
- role: load_cell
  type_designations:
  - Tedea Huntleigh 1260 C3
  alternatives:
  characteristics:
    emax:
      value: 50 or 75
      unit_symbol: kg
    applies_to:
      value: Heavy range configurations
- role: alternative_load_cell
  type_designations:
  - any compatible load cell with an OIML R60 Certificate of Conformity
  alternatives: OR
  characteristics:
    requires_oiml_r60_certificate:
      value: true
    digital_output_allowed:
      value: false
    oil_damper_allowed:
      value: false
    nlc_y_z_requirements:
      value: same or better than the dynamically tested Tedea 1040 C3, capacity 15 kg
    design_and_material:
      value: same as the tested load cell
    nh_mark_condition:
      value: load cell marked NH allowed only if humidity testing to R76 has been conducted on this load
        cell
- role: control_and_display_unit
  type_designations:
  - PM860
  - M6215
  alternatives: OR
  characteristics:
    display:
      value: 15-inch TFT LCD touch-screen
    mounting:
      value: >-
        Pole-mounted behind the conveyors, or included in a remote pod connected to the electrical cabinet
        by a conduit (may also be replaced by a remote pod with conduit mounted on a stand)
- role: board
  type_designations:
  - Elvis Lite
  alternatives:
  characteristics:
    note:
      value: The instrument may be fitted with this modified board
