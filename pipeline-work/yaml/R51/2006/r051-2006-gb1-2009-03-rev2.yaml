model_family:
  family_name: 9000 Series
  models:
  - model_id: 9000 Series
    label: Checkweigher / Weight or Weight-Price labeller
    attributes:
      control_and_display_unit: PM860 (15-inch TFT LCD touch-screen)
  - model_id: 9500W Series
    label: >-
      Modified construction with M6215 interface replacing PM860, fixed to the top of the electrical cabinet
      behind the conveyors
    attributes:
      interface: M6215
      control_and_display_unit:
components:
- role: load_cell
  type_designations:
  - Tedea Huntleigh 1040 C3
  alternatives:
  characteristics:
