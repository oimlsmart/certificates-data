certified_type:
  category: Checkweighing instrument
  type_designations:
  - 9000 Series
  - 9500W Series
  module_designation: Not applicable
  description: >-
    Mains-powered automatic checkweighing/catchweighing instrument designated the 9000 Series, used as
    a weight or weight-price labeller. Any type of labeller and sleeving/labelling is permitted, as well
    as their location on the instrument.
