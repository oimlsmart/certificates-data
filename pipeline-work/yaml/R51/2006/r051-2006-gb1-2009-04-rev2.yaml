certified_type:
  category: Checkweigher
  type_designations:
  - VersaWeigh
  - VersaGP
  - Versa RxC
  - Versa RxM
  - Teorema
  - Versa GP
  - Versa Chain
  description: >-
    Automatic catchweighing instruments (checkweighers). Versa constructions (VersaWeigh, Versa GP, Versa
    Rx) constructed in stainless steel as part of an integrated self-carrying cabinet on adjustable feet
    with a see-through door; Versa RxC uses the standard weighing system, Versa RxM and Versa Chain use
    the Slack Conveyor weighing system. Teorema has a conveyor supported by a floor-standing steel frame
    and a weigh unit on a steel block, connected to a remote electrical cabinet. Remote cabinets permitted
    for VersaWeigh and Versa GP provided the load cell is connected via metal conduit.
  module_designation:
