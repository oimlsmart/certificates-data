components:
- role: load cell (main constructions)
  type_designations:
  - Tedea Huntleigh 1042 C3
  - Tedea Huntleigh 1250 C3
  alternatives: OR
  characteristics:
    capacity: according to maximum capacity table
    reference_tested_load_cell: Tedea Huntleigh 1042 C3, capacity 10 kg
    conditions: >-
      R60 OIML Certificate of Conformity required; not a load cell with digital output; nlc, Y, Z same
      or better than tested load cell; same design and material; no oil damper; NH marking allowed only
      if humidity tested to R76
- role: load cell (Slack Conveyor alternative)
  type_designations:
  - Vishay Celtron LPS
  characteristics:
    capacity: according to Slack Conveyor capacity table
    reference_tested_load_cell: Vishay Celtron LPS, capacity 2 kg
    conditions: >-
      R60 OIML Certificate of Conformity required; not a load cell with digital output; nlc, Y, Z same
      or better than tested load cell; same design and material; no oil damper; NH marking allowed only
      if humidity tested to R76
- role: load_cell
  type_designations:
  - Tedea Huntleigh 1130 C3
  alternatives: OR
  characteristics:
    tested_capacity:
      value: 30
      unit_symbol: kg
      unit_id:
    compatibility_conditions:
    - >-
      Must have a respective OIML R60 Certificate of Conformity containing the load cell types and necessary
      load cell data required for the manufacturer's declaration of compatibility of modules and any particular
      installation requirements
    - >-
      A load cell marked NH is allowed only if humidity testing to R76 has been conducted on this load
      cell
    - Not a load cell with digital output
    - >-
      Characteristics such as nlc, Y, Z must be the same or better than the dynamically tested load cell
      (Tedea Huntleigh 1130 C3, capacity 30 kg)
    - Design and material must be the same
    - No oil damper is used
- role: legally_relevant_software
  type_designations:
  - V312 Version 2.0
  characteristics:
    standard_version: V312 2.0 (37.00.02.xx)
    standard_version_options:
    - Multi-Lane applications
    - >-
      Intermittent Checkweigher (Static-Weigh) applications (static weighing, restricted to Slack Conveyor
      weighing systems and maximum capacities <= 1500 g)
    - Data Matrix applications
    - OEM applications
    - Teorema applications
    dedicated_versions:
    - application: Tare/Gross applications
      version_code: 39.00.01.xx
    - application: Multiproduct applications
      version_code: 41.00.01.xx
    - application: Twin application
      version_code: 42.00.01.xx
    version_display: Version number is displayed in the Weigh menu 'Run Screen'
    storage: Held in the Weigh Engine and partially on the HMI; can only be changed at factory level via
      Ethernet
- role: remote_control_cabinet
  characteristics:
    note: >-
      VersaWeigh and Versa GP instruments may be fitted with remote cabinets provided the load cell is
      connected to the cabinet using a metal conduit; houses the electrical hardware including the control
      and display unit (HMI)
