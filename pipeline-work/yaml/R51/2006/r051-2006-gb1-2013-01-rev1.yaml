certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - L-Series 2180
  - Express
  - Force
  - L2150
  module_designation:
  description: >-
    Battery-operated automatic catchweighing instrument (Category Y) comprising an electronic indicator,
    pressure transducer and sensors mounted on a wheeled loader. The pattern automatically determines
    the load in the bucket during the lifting process; the hydraulic pressure in the loader's arms is
    converted by a pressure transducer, the output being used by the indicator to display the corresponding
    weight.
