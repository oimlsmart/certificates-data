certified_type:
  category: Checkweigher
  type_designations:
  - CW3
  module_designation: Not applicable
  description: >-
    Automatic catchweighing instrument designated CW3, operating as an automatic checkweigher (Category
    X). The instrument comprises a cabinet with user interface, weighing device, mechanical handling facilities
    and reject device, and is designed to weigh packs dynamically. Constructed in stainless steel: a fabricated
    floor-standing frame on adjustable feet carries the modular conveyor sections (in-feed, weigh platform,
    out-feed) and the main cabinet with console; the out-feed conveyor can be equipped with one of a number
    of reject devices. The load transport system may consist of conveyor belts driven by rollers or by
    sets of chains (Drag Link). Permanently installed. Control cabinet at the front houses the electrical
    hardware; console above it contains keyboard and touch-screen display; photocells at either end and
    either side of the conveyor are used for pack detection.
