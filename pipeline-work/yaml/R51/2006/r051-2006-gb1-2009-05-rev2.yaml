components:
- role: load_cell
  type_designations:
  - Tedea Huntleigh 1042 C3
  alternatives: OR
  characteristics:
    output_type: analog strain gauge (no digital output)
    tested_emax:
      value: 5
      unit_symbol: kg
      unit_id:
    substitution_conditions: >-
      Any compatible load cell(s) may be used provided: a respective OIML R60 Certificate of Conformity
      exists containing the load cell type and necessary data for the manufacturer's declaration of compatibility
      of modules; the cell is not a load cell with digital output; characteristics (nlc, Y, Z) are the
      same or better than the tested load cell (Tedea Huntleigh 1042 C3, capacity 5 kg); design and material
      are the same; no oil damper is used; a cell marked NH is allowed only if humidity testing to R76
      has been conducted.
