certified_type:
  category: Automatic checkweighing instrument
  type_designations:
  - D3
  - '08D3'
  - '09D3'
  - 10D3
  - '08T3'
  - '09T3'
  - 10T3
  description: >-
    The pattern is a mains-powered family of automatic checkweighing instruments designated the D3. The
    weighing device comprises two strain gauge load cells located below the centre of the weigh conveyor.
    Devices: semi-automatic zero-setting (not accessible to the user, calibration mode only), initial
    zero-setting, zero-tracking, automatic zero-setting during automatic operation (at least every 5 min),
    pre-set tare device (subtractive), static calibration not accessible to the user, dynamic calibration
    (not accessible to the user) or dynamic setting functionality (recorded and available to the user),
    belt speed setting, internal memory for storage of batch reports, device that acts upon significant
    faults, screen check at power-up.
