certified_type:
  category: Automatic catchweigher
  type_designations:
  - LI-700-D
  - CWL-700-D
  - LIW-700-D
  description: >-
    Automatic catchweigher designated the LI-700-D, operating as an automatic weight or weight/price labeller
    (Category Y) and as an automatic checkweigher (Category X); designated CWL-700-D when configured to
    operate only as an automatic checkweigher (Category X). Comprises a self-indicating and price-computing
    weighing machine with associated thermal label printer and mechanical handling facilities; packs are
    weighed dynamically at a constant rate of operation. Weighing system is a scale conveyor mounted on
    a load cell. Pricing, pack and labelling information is stored in PLUs. Devices: initial and semi-automatic
    zero-setting (max 4% of Max), automatic zero-setting after time interval (max 15 min), zero-tracking
    device, preset tare device, semi-automatic subtractive tare device, zero indication, price computation,
    PLUs, Ethernet and USB interfaces. Access to metrological settings secured by a switch on the A/D
    board enclosed in a metal case with tamper-evident seal; static calibration password protected with
    audit count number.
