certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - SCG-3000
  - SCG-6000
  - SCG-15000
  module_designation: Automatic Catchweighing instrument
  description: >-
    Catchweigher family SCG-xxxxx (models SCG-3000, SCG-6000, SCG-15000). Uses HBM PW15AH C3 load cell.
    Software version identification is performed during power-up; approved software version is v4.xx,
    where xx = 00-99 represents minor non-legal changes. Devices: power up test, initial zero setting
    device, automatic zero setting device (dynamic mode only), semiautomatic zero setting device (static
    mode only), zero tracking device (static mode only), no motion detection and indication, detection
    of significant fault. Interfaces: Ethernet for communication to peripherals, USB (for setup of the
    instrument only); the interface does not have to be secured.
