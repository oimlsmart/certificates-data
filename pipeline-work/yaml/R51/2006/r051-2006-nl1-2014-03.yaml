    minimum_capacity: 200 g
    maximum_number_of_scale_intervals: n ≤ 3000
    maximum_partial_weighing_ranges: 1
    weighing_ranges: Single interval
  - variant: Variant 4
    maximum_capacity: 600 g ≤ Max ≤ 6000 g
    maximum_load_transport_system_speed: 62 m/min
    minimum_capacity: 25 g
    maximum_number_of_scale_intervals: n ≤ 7500 (partial weighing range 1); n ≤ 4400 (partial weighing
      range 2); n ≤ 7500 (single interval)
    maximum_partial_weighing_ranges: 2
    weighing_ranges: Multi-interval; Single interval
  - variant: Variant 5
    maximum_capacity: 600 g ≤ Max ≤ 6000 g
    maximum_load_transport_system_speed: 80 m/min
    minimum_capacity: 35 g
    maximum_number_of_scale_intervals: n ≤ 7500 (partial weighing range 1); n ≤ 4400 (partial weighing
      range 2); n ≤ 7500 (single interval)
    maximum_partial_weighing_ranges: 2
    weighing_ranges: Multi-interval; Single interval
  description: >-
    Five certified variants of the I-Series: variants 1-3 are single-interval instruments with Max = 600
    g; variants 4-5 have Max adjustable between 600 g and 6000 g and support multi-interval operation
    with two partial weighing ranges.
