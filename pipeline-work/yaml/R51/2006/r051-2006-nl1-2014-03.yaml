    minimum_capacity: 15 g
    maximum_number_of_scale_intervals: n ≤ 3000
    maximum_partial_weighing_ranges: 1
    weighing_ranges: Single interval
  - variant: Variant 2
    maximum_capacity: 600 g
    maximum_load_transport_system_speed: 110 m/min
