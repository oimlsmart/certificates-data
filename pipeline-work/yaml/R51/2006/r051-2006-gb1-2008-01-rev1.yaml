certified_type:
  category: Checkweigher
  type_designations:
  - CW3
  module_designation: Not applicable
  description: >-
    Mains-powered automatic checkweighing instrument designated the CW3. Devices: automatic zero-setting
    device active during automatic operation (active if the time between two packs is more than 500 ms);
    pre-set tare device (subtractive); static calibration not accessible to the user; dynamic calibration
    accessible to the user; belt speed setting accessible to the user; internal memory for storage of
    batch reports; device to determine the stability of equilibrium, active during dynamic operation;
    device that acts upon significant faults; screen check at power-up. Interfaces: RS-232, USB, Ethernet.
    The PC console provides the 10 V DC excitation voltage to the load cell. May be connected to Loma
    OPC or LomaEnet systems for the collection of batch reports. Peripherals must be covered by a test
    certificate issued by a Notified Body under Annex B (MI-006) of Directive 2004/22/EC, or, if uncertified,
    meet the stated conditions (CE marking under EMC Directive 89/336/EEC; no transmission of data or
    instructions into the instrument other than printout release, transmission checking or validation;
    printing of results as received without modification; compliance with Paragraph 8.1 of Annex I).
