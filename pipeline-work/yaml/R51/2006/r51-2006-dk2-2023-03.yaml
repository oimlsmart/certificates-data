certified_type:
  category: Automatic catchweighing weighing instrument
  type_designations:
  - M2400-IWU-xLC
  module_designation: Automatic catchweighing weighing instrument
  description: >-
    The automatic catch-weighing instrument is a belt weighing scale designated M2400-IWU-xLC where x represents the number
    of load cells in the instrument and is intended for dynamic weighing. It consists of an electronic weighing indicator
    M2400 and a load receptor with 1 or 2 load cells (often designated Inline Weigher) or 4 load cells (often designated MaxiweigherII).
    The instrument can operate as a price labeller.
