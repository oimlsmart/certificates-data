certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - CMGV
  - CGMV
  module_designation: Not applicable
  description: >-
    Graduated, self-indicating, electronic, single-interval automatic catchweighing instrument (Container
    Gross Mass Verification), designed for weighing of containers. The system weighs containers statically
    during a regular lift cycle with top pick spreader and is based on pressure sensors in the lifting
    cylinders, a boom angle sensor and a proximity switch identifying the retracted boom position.
