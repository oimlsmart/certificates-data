certified_type:
  category: Load cell
  type_designations:
  - Loadmaster Alpha 50
  module_designation:
  description: >-
    This pattern of an automatic catchweighing instrument, powered by a road vehicle battery, designated the Loadmaster Alpha
    50, comprises an indicator with touchscreen and soft key controls, "Terminator" junction box, pressure transducers and
    sensors mounted on a wheeled loader. This pattern automatically determines the load in the bucket during the lifting process,
    the hydraulic pressure in the loader's arms is converted by a pressure transducer, the output being used by the indicator
    to display the corresponding weight.
