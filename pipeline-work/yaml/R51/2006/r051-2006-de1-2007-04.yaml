footnotes:
- marker: 1)
  text: This applies to multiple range instruments.
- marker: 2)
  text: This applies to multi-interval instruments.
- marker: 3)
  text: >-
    This specification applies only to weighing instruments with operation in motion (dynamic weighing) and with parameters
    being generally valid over the complete weighing range for all products. For single products having especially their own
    Price Look Up and/or their own product-specific parameters greater tare loads are allowed if they are approved by the
    verification. For start-stop weighing it is valid: T≤-Max.
- marker: 4)
  text: >-
    For weighing instruments of the categories XIII(x ≥ 2) and Y(b) the number of verification scale intervals is limited
    to ni ≤ 1000.
- marker: 5)
  text: >-
    The minimum capacity in case of start-stop-operation for category Y depends on the specification according to R51-1 No.
    2.2.2. It may be applied to corresponding category X for start-stop-operation in order to achieve smaller minimum capacities.
    Greater minimum loads may also result from the verification.
- marker: 6)
  text: >-
    For weighing instruments of the category Y the minimum loads for the operation in motion depend on the specification under
    4 and in this table. The greater value has to be taken. For weighing instruments of category X the specifications of this
    table are valid. Greater minimum loads may also result from the verification.
