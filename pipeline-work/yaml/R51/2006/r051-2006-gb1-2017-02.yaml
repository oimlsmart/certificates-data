certified_type:
  category: Automatic catchweigher
  type_designations:
  - CWS™ Loadpin
  module_designation:
  description: >-
    The CWS™ Loadpin is an automatic catchweigher designed to weigh containers statically with no operator
    intervention. The instrument comprises digital load cells, an interface unit and a control and display
    unit. The load cells and electronics are permanently installed on the spreader of container handlers;
    weight values are transmitted via the interface unit to the display unit (typically in the operator's
    cab) and to the Terminal Operating System (TOS). Enclosures are aluminium; the display unit has an
    LCD display and 8 keys (6 functional control keys, 2 navigation keys). Interfaces: RS 232 / RS 422
    / RS 485, CANBUS, Ethernet, Wifi. Devices: semi-automatic zero-setting (≤ 4% Max) via user interface
    or TOS, long term storage device, display and storage of individual and total weights. Securing: seal
    on electronics enclosures, indelible load cell serial numbers on data plate, tamper-evident label
    with Config Version counter.
