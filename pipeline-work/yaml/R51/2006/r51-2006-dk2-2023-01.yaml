certified_type:
  category: Weighing transmitter
  type_designations:
  - eWC100-C
  module_designation: Weighing transmitter for automatic catchweigher
  description: >-
    Weighing transmitter module for automatic catchweighers; tested model number is P:eWC100-C. The eWC100-C
    has neither display nor buttons. Devices: initial zero setting device (≤ 20% of Max), semi-automatic
    zero setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), semi-automatic subtractive
    tare balancing device, preset tare device, automatic tare device, event counter (TAC). Interfaces:
    RS-485, RS-232, CANopen, 2 logical inputs, 2 logical outputs; the interfaces do not have to be secured.
    Access to the configuration and calibration facility is secured by a Traceable Access Code (TAC);
    the TAC status code increments up to 65535.
