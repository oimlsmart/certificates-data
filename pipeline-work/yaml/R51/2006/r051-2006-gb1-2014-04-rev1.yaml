  - QLC-12L
  - QLC-60L
  alternatives: OR
  characteristics:
    maximum_capacity_for_dacs_g_s015:
      value: 12
      unit_symbol: kg
    maximum_capacity_for_dacs_g_s060:
      value: 60
      unit_symbol: kg
    output_signal:
      value: analog (strain gauge)
    manufacturer:
      value: Ishida Japan
    substitution_conditions:
      value: >-
        Any compatible load cell may be used provided: it has an OIML R60 Certificate of Conformity containing
        the load cell types and data required for the manufacturer's declaration of compatibility of modules
        and any installation requirements; it is not a load cell with digital output; its characteristics
        (nlc, Y, Z) are the same or better than the dynamically tested QLC-12L (Emax = 12 kg); design
        and material are the same; no oil damper is used
