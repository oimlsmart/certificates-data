certified_type:
  category: Automatic checkweigher
  type_designations:
  - DACS-G-S015
  - DACS-G-S060
  module_designation: Not applicable
  description: >-
    Family of mains-powered, dual-range automatic weighing instruments designated the DACS-G-S015 and
    DACS-G-S060 Series, operating as automatic checkweighers (Category X). Stainless steel construction:
    fabricated floor-standing frame on adjustable feet carrying in-feed, weigh and out-feed conveyors
    (conveyor type and size not restricted); strain gauge load cell located below the centre of the weigh
    conveyor; control cabinet behind the conveyors housing the electrical hardware including the ADC board
    and the dip-switches protecting legally-relevant parameters; jog-dial remote control unit (RCU) with
    LED display, function and numerical keys; photocells on the frame for pack detection; printer on the
    side of the control cabinet.
