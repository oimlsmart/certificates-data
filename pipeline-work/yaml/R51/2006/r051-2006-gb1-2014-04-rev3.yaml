certified_type:
  category: Automatic checkweigher
  type_designations:
  - DACS-G-S015
  - DACS-G-S060
  module_designation:
  description: >-
    Family of mains-powered, dual-range, automatic weighing instruments designated the DACS-G-S015 and
    DACS-G-S060 Series, operating as automatic checkweighers (Category X). Models are designated DACS-G-S015-xx/xx-xx-x
    and DACS-G-S060-xx/xx-xx-x, with x reflecting the various configurations. Stainless steel construction:
    fabricated floor-standing frame on adjustable feet carrying in-feed, weigh and out-feed conveyors
    (conveyor type and size not restricted). Control cabinet behind the conveyors houses the electrical
    hardware, including the ADC board and the dip-switches protecting the legally-relevant parameters;
    the Remote Control Unit is mounted in the upper part of the control cabinet; photocells mounted on
    the frame are used for pack detection; a printer is located on the side of the control cabinet. Weighing
    device comprises a strain gauge load cell below the centre of the weigh conveyor. Weighing controller
    comprises the A/D converter on the weigh board; processed weigh signal and photocell signal are sent
    to the DRV board controlling the infeed/outfeed conveyors. Devices: semi-automatic and automatic zero-setting,
    initial zero-setting, determination of stability of equilibrium, preset tare, static calibration (not
    available to the user), dynamic calibration (available to the user, recorded), belt speed set up,
    dynamic setting, events log, printing of batch data, display check at power up, e/10 resolution for
    testing purposes (not available to the user), e/10 resolution (d) available up to 5 s upon command
    (available to the user). Interfaces: Ethernet; USB (for extraction of stored data only). Load cell
    and dip-switches (on the ADC or MCU board) sealed via a tamper-evident solution.
