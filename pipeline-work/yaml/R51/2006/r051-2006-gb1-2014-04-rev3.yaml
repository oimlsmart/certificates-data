components:
- role: load_cell
  type_designations:
  - QLC-12L
  - QLC-60L
  alternatives: OR
  characteristics:
    QLC-12L:
      series:
        value: DACS-G-S015
      maximum_capacity:
        value: 12
        unit_symbol: kg
        unit_id:
    QLC-60L:
      series:
        value: DACS-G-S060
      maximum_capacity:
        value: 60
        unit_symbol: kg
        unit_id:
    replacement_conditions:
      value: >-
        Alternatively, any compatible load cell may be used provided: it has an OIML R60 Certificate of
        Conformity containing the load cell types and data required for the manufacturer's declaration
        of compatibility of modules and any installation requirements; it is not a load cell with digital
        output; its characteristics (n_lc, Y, Z) are the same or better than the load cell tested dynamically
        (QLC-12L, Emax = 12 kg); the design and material are the same; no oil damper is used.
- role: remote_control_unit
  type_designations:
  - jog-dial RCU
  - colour touch screen RCU
  alternatives: OR
  characteristics:
    note:
      value: >-
        The jog-dial RCU may be replaced by a colour touch screen RCU; the USB port may in that case be
        used for the connection of a remote device.
