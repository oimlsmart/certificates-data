components:
- role: load_cell
  type_designations:
  - Tedea Huntleigh 1042 C3
  alternatives: OR
  characteristics:
    technology: strain gauge
    quantity: two load cells located below the centre of the weigh conveyor
    capacity: according to technical data table (5 kg for 08D3, 10 kg for 09D3 and 10D3)
    interchange_conditions: >-
      Any compatible load cell(s) may be used provided: it has an OIML R60 Certificate of Conformity containing
      the load cell types and data required for the manufacturer's declaration of compatibility of modules;
      a load cell marked NH is allowed only if humidity testing to R76 has been conducted; it is not a
      load cell with digital output; characteristics such as nlc, Y, Z are the same or better than the
      tested load cell (Tedea Huntleigh 1042 C3, capacity 5 kg); design and material are the same; no
      oil damper is used
