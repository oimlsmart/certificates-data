certified_type:
  category: Checkweigher
  type_designations:
  - D3
  - '08D3'
  - '09D3'
  - 10D3
  module_designation: Not applicable
  description: >-
    Mains-powered family of automatic checkweighing instruments designated the D3. Devices include semi-automatic
    zero-setting, initial zero-setting, zero-tracking, automatic zero setting during automatic operation
    (at least every 5 min), pre-set tare device (subtractive), static and dynamic calibration (not user
    accessible), belt speed setting, internal memory for batch reports, device acting upon significant
    faults, and screen check at power-up. Interfaces: RS 232 and USB (only for data collection on memory
    stick).
