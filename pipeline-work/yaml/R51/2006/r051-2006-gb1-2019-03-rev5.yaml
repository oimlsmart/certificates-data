certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - 9000 Series
  - 9500W Series
  - 9000+
  - 9500+
  module_designation: Not applicable
  description: >-
    Automatic catchweigher, designated the 9000 Series, operating as an automatic weight or weight/price
    labeller (Category Y); may also operate as an automatic checkweigher (Category X). Per Alternative
    5, an instrument with M6215 interface in place of the PM860 is designated the 9500W Series; per Alternative
    9, modified instruments designated 9000+ and 9500+ run Windows 7 with legally relevant software version
    1.2.
