certified_type:
  category: Automatic catchweigher
  type_designations:
  - CWS™
  module_designation: Not applicable
  description: >-
    The CWS™ (diaphragm load cell based) is an automatic catchweigher designed to weigh containers statically
    with no operator intervention. The instrument comprises digital load cells, an interface unit and
    a control and display unit. The instrument captures the container weight automatically once the container
    has been lifted and reached a stable position. The system is designed for permanent installation on
    various types of container handlers; the load cells and electronics are permanently installed on the
    spreader. Load values are transmitted to a display unit (typically installed in the operator's cab)
    via an interface unit, and the final data is transmitted to the Terminal Operating System (TOS). Devices:
    semi-automatic zero-setting (≤ 4% Max) via user interface or TOS, long term storage device, display
    and storage of individual and total weights. Access to legally relevant parameters is password-protected;
    a non-editable Config Version counter increments on every change of a legally relevant parameter.
