  - Scaime AGC6
  - Scaime APC3
  - Scaime ABC3
  - Scaime AGC3
  - Flintec PC42 C3
  alternatives: OR
  characteristics:
    compatibility_conditions:
    - A respective OIML Certificate of Conformity (R60) must be issued for the load cell
    - >-
      The certificate must contain the load cell types and the necessary load cell data required for the
      manufacturer's declaration of compatibility of modules and any particular installation requirements;
      a load cell marked NH is allowed only if humidity testing to R76 has been conducted on this load
      cell
    - It must not be a load cell with digital output
    - >-
      The characteristics of the replacement load cell such as nlc, Y, Z must be the same or better than
      the dynamically tested load cell (HBM PW22 C3, capacity 20 kg)
    - The design of the load cells and the material must be the same
    - No oil damper is used
