certified_type:
  category: Checkweigher / weight or weight-price labeller (automatic catchweighing instrument)
  type_designations:
  - Mercury Plus
  description: >-
    Mains-powered automatic checkweighing / catchweighing instrument designated the Mercury Plus. Devices:
    automatic zero-setting device active during automatic operation (at least every 6 min); semi-automatic
    zero-setting (up to 4% Max); initial zero-setting (up to 20% Max); pre-set tare device (subtractive);
    static calibration, not accessible to the user; belt speed setting, accessible to the user; internal
    memory for storage of batch data (category X); device acting upon significant faults; screen check
    at power-up; high resolution mode (0.1e) for testing purposes, not accessible to the user; dynamic
    or static weighing selection device, accessible to the user; operation under category X or Y selection
    device, accessible to the user. Interfaces: RS 232/RS485, parallel port, Ethernet, analogue.
