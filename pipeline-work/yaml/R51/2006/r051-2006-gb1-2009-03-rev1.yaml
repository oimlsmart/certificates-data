certified_type:
  category: Checkweigher
  type_designations:
  - 9000 Series
  module_designation: Not applicable
  description: >-
    Mains-powered automatic checkweighing/catchweighing instrument designated the 9000 Series, used as
    checkweigher / weight or weight-price labeller. Stainless steel reinforced electrical cabinet housing
    the control and display unit (15" TFT LCD touch-screen; pole-mounted or alternatively contained in
    a remote pod connected by conduit); modular conveyor comprising in-feed, weigh head and out-feed conveyors
    driven by DC motors; level indicator on the weigh head conveyor; photocells along the conveyor centreline
    for pack detection. Any compatible load cell with an OIML R60 Certificate of Conformity may be used
    subject to stated compatibility conditions (R60 certificate covering the type and data needed for
    the declaration of compatibility, NH-marked cells only with R76 humidity testing, no digital output,
    characteristics n_lc, Y, Z same or better than the dynamically tested Tedea 1040 C3 15 kg cell, same
    design and material, no oil damper). Interfaces: RS232/RS485/RS422, Ethernet, Digital I/O. Devices
    include automatic zero-setting during automatic operation (at least every 3 h), semi-automatic zero-setting
    (≤ 4% max, testing mode only), initial zero-setting (≤ 20% max), subtractive pre-set tare, static
    calibration not accessible to the user, user-accessible belt speed setting, internal memory for batch
    data (category X), device acting upon significant faults, screen check at power-up, label and conformat
    editing restricted above operator level, high-resolution mode (0.1e) for testing, and a category Y-only
    or X and Y selection device.
