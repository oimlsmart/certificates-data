certified_type:
  category: Automatic catchweigher
  type_designations:
  - HI-700 TR
  description: >-
    This pattern of an automatic catchweigher, designated the HI-700 TR, operates as an automatic weight
    or weight/price labeller (Category Y) and as an automatic checkweigher (category X). The instrument
    comprises a self-indicating and price-computing weighing machine with associated mechanical handling
    facilities, tray sealing and thermal label printer. It is designed to weigh packs dynamically, at
    a constant rate of operation. Construction: stainless steel frame, scale conveyor with optional in-feed
    and out-feed conveyors (any number), tray sealing system with thermal label printer, control cabinet
    mounted in the base of the frame below the scale conveyor.
