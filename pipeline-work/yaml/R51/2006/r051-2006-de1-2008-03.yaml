    This value is valid for dynamic weighing. For weighing instruments of the category X the minimum loads depend on the used
    digital LC and for weighing instruments of the category Y additionally on the specification under 2). In case of category
    Y the greater value has to be taken. Greater minimum loads may also result from the metrological test of the LMC.
- marker: 3)
  text: >-
    This specification applies only to weighing instruments with parameters being generally valid over the complete weighing
    range for all products and weighing in motion (dynamic weighing). For single products having especially their own product
    data storage and/or their own product-specific parameters greater tare loads are allowed if they are approved by the LMC.
    A tare load ≤ - Max is allowed for start stop operation (static weighing).
