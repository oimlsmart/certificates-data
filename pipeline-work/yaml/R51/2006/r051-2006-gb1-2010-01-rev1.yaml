certified_type:
  category: Automatic catchweigher
  type_designations:
  - WIL-700
  - WIW-700
  description: >-
    Automatic catchweigher designated WIL-700 or WIW-700, operating as an automatic weight or weight/price
    labeller (Category Y); may also operate as an automatic checkweigher (Category X). Comprises a self-indicating
    and price-computing weighing machine with associated thermal label printer and mechanical handling
    facilities, designed to weigh packs dynamically or statically at a constant rate of operation.
