certified_type:
  category: Automatic checkweighing instrument
  type_designations:
  - CW³
  module_designation: Not applicable
  description: >-
    Mains-powered automatic checkweighing instrument designated the CW³, covering Lightweight, Mid-Range,
    Heavy Range, Super Heavy Range (multi-interval) and Ultra Light weight Range variants. Load transport
    system may consist of conveyor belts driven by rollers or by sets of chains (designated 'Drag Link').
    May be connected to Loma OPC, LomaEnet or TRACS systems for the collection of batch reports.
