  changes: Transport system designated 'Drag Link' added.
- revision: '3'
  date: '2010-10-07'
  changes: Heavy Range and Super Heavy Range variants added.
- revision: '4'
  date: '2011-12-22'
  changes: Ultra Light weight Range variant added.
- revision: '5'
  date: '2012-03-06'
  changes: Excitation voltage corrected to 5.5 VDC. Certificate history added.
- revision: '6'
  date: '2013-03-25'
  changes: >-
    Alternative load cell added. Max tare weight changed to T <= 10% Gross for the Ultra Light weight
    Range.
- revision: '7'
  date: '2013-05-21'
  changes: >-
    Max tare weight changed, for the Ultra Light weight Range, to T <= 10% Net for 15 g <= Net <= 50 g
    and T <= 40 g for Net > 50 g
- revision: '8'
  date: '2013-09-06'
  changes: Emax value corrected to 150 kg in Super Heavy Range technical data table.
- revision: '9'
  date: '2014-04-30'
  changes: >-
    e = 0.5 g added to the certificate (Lightweight and Midrange variants). Software and display sections
    added. TRACS system added.
- revision: '10'
  date: '2014-07-03'
  changes: >-
    125 g changed to 200 g in Lightweight and Mid-range tables (specifications and speed): Min to 200
    g: e >= 0.5 g; 200 g to Max: e >= 1 g
