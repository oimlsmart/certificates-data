certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - HSC350
  - HSC350/02
  - HSC350/03
  - HSC350/04
  - HSC350/06
  - HSC350/08
  - HSC350/15
  - HSC350/20
  - HSC350/30
  - HSC350/40
  - HSC350/60
  module_designation: Analog load cell
  description: >-
    Family of automatic catchweighing instruments designated HSC350, operating as automatic checkweighers
    (Category X) and/or weigh or weigh-price labellers (Category Y). Stainless steel construction: fabricated
    floor-standing frame on adjustable feet carrying a modular conveyor (conveyor type, number, size and
    shape not restricted), equipped with reject devices (flipper, drop flap, ram or air blast) for Category
    X and/or thermal label printers for Category Y; designed for permanent installation. Control cabinet
    behind the instrument houses the electrical hardware; a PL30 weighing indicator console with keyboard
    and displays is mounted above the cabinet; photocells (direct reading, reflex or laser type) on the
    frame provide pack detection. Approved alternatives: 1) transport system 'R chain' with two 1/4-inch
    plastic chains sliding on plastic bars; 2) PL30 indicator enclosed in the cabinet; 3) multi-lane configuration
    with one separate PL30 per lane and a common cabinet; 4) PL30 with touch screen display, long-term
    data storage device and optional integrated printer; 5) 10.2 inch touch screen HMI; 6) modified AD
    board PL555E (drawing rev 1 dated 12/12/2013) covering models HSC350/02, /04, /08, /20 and /40.
