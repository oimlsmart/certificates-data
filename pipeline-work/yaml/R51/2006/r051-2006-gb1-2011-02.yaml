certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - HSC350
  - HSC350/03
  - HSC350/06
  - HSC350/15
  - HSC350/30
  description: >-
    Family of automatic weighing instruments operating as automatic checkweighers (Category X) and/or
    weigh or weigh-price labellers (Category Y). Constructed in stainless steel: fabricated floor-standing
    frame on adjustable feet carrying a modular conveyor (conveyor type, number, size and shape not restricted).
    Category X instruments may be equipped with reject devices (flipper, drop flap, ram or air blast);
    Category Y instruments with thermal label printers. Control cabinet behind the instrument houses the
    electrical hardware; a PL30 weighing indicator console mounted above the cabinet contains the keyboard
    and displays; photocells on the frame provide pack detection. Designed for permanent installation.
    Alternatives: 'R chain' transport system (two 1/4-inch plastic chains sliding on plastic bars instead
    of rollers); PL30 indicator enclosed in the cabinet; multi-lane configuration with each lane operated
    by a separate PL30 and a common cabinet.
