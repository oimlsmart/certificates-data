  characteristics:
    description: >-
      Weighing indicator console mounted above the control cabinet, contains keyboard and displays. Alternative
      construction: PL30 enclosed in the cabinet. Multi-lane configuration: each lane operated by a separate
      PL30 with a common cabinet.
- role: load cell
  type_designations:
  - HBM SP4M C3MR
  - HBM PW6D C3MR
  - HBM PW2D C3MR
  - HBM PW16A C3MR
  alternatives: OR
  characteristics:
    technology: strain gauge, analog output (load cells with digital output not permitted)
    capacity: according to table (7 kg, 10 kg, 30 kg or 50 kg depending on model)
    tested_reference: HBM SP4M C3MR, capacity 7 kg
    substitution_requirements: >-
      Any compatible load cell with an OIML R60 Certificate of Conformity may be used, provided the certificate
      contains the load cell types and data required for the module compatibility declaration and installation
      requirements; nlc, Y and Z characteristics are the same or better than the tested load cell; same
      design and material; no oil damper used.
- role: pack detection photocells
  type_designations: []
  alternatives: OR
  characteristics:
