certified_type:
  category: Checkweigher
  type_designations:
  - CW³
  description: >-
    The pattern is a mains-powered automatic checkweighing instrument designated the CW³. The load transport
    system may consist of conveyor belts driven by rollers or by sets of chains (designated as 'Drag Link').
    The PC console provides the 5.5 VDC excitation voltage for the load cell. Devices: automatic zero
    setting device active during automatic operation (active if the time between two packs is more than
    500 ms); pre-set tare device (subtractive); static calibration not accessible to the user; dynamic
    calibration accessible to the user; belt speed setting accessible to the user; internal memory for
    storage of batch reports; device to determine the stability of equilibrium, active during dynamic
    operation; device that acts upon significant faults; screen check at power-up. Interfaces: RS 232,
    USB, Ethernet; the instrument may be connected to either the Loma OPC or LomaEnet systems for the
    collection of batch reports.
