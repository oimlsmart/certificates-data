components:
- role: Load cell
  type_designations:
  - Tedea Huntleigh 1042 C3
  alternatives: OR
  characteristics:
    technology: strain gauge
    quantity_per_instrument: 2
    location: below the centre of the weigh conveyor
    interchange_conditions: >-
      Any compatible load cell(s) may be used provided: a respective OIML R60 Certificate of Conformity
      exists containing the load cell types and data required for the manufacturer's declaration of compatibility
      of modules and installation requirements; a load cell marked NH is allowed only if humidity testing
      to R76 has been conducted; it is not a load cell with digital output; characteristics such as nlc,
      Y, Z are the same or better than the dynamically tested Tedea Huntleigh 1042 C3 (capacity 5 kg);
      design and material are the same; no oil damper is used.
- role: Indicating device
  type_designations:
  - LCD display
  - Touch screen type T3
  alternatives: OR
  characteristics:
    note: In the T3 variants the LCD display is replaced by a touch screen type T3.
- role: Metal detector
  type_designations:
  - any type
  alternatives:
  characteristics:
    location: in-feed conveyor
    fitment: optional
footnotes: []
