certified_type:
  category: Checkweigher
  type_designations:
  - D3
  - T3
  - '08D3'
  - '09D3'
  - 10D3
  - 14D3
  - 16D3
  - '08T3'
  - '09T3'
  - 10T3
  - 14T3
  - 16T3
  module_designation:
  description: >-
    Mains-powered family of automatic checkweighing instruments designated the D3 (LCD display) with touch
    screen T3 variants (LCD display replaced by touch screen type T3). The weighing device comprises two
    strain gauge load cells located below the centre of the weigh conveyor. Devices: semi-automatic zero-setting
    (≤ 4% Max), initial zero-setting (≤ 20% Max), zero-tracking (≤ 4% Max), automatic zero setting active
    during automatic operation (at least every 35 min), pre-set tare device (subtractive), static calibration
    not accessible to the user, dynamic calibration (not accessible to the user) or dynamic setting functionality
    (recorded and available to the user), belt speed setting (accessible to the user), internal memory
    for storage of batch reports, device that acts upon significant faults, screen check at power-up.
    Interfaces: RS 232 and USB (USB only for data collection on memory stick); Ethernet available as alternative.
    Instruments may be fitted with a metal detector (any type) on the in-feed conveyor. Alternative construction
    with load cell cable running externally between cabinet and weighing unit.
