certified_type:
  category: Automatic weighing instrument
  type_designations:
  - Load Sensing System version 1
  description: >-
    A graduated, self-indicating, electronic, automatic weighing instrument. The Load Sensing System version
    1 is an automatic weighing instrument with four or eight load cells integrated into the spreader twist
    locks. It is designed for weighing of containers during a normal lift cycle. The system is approved
    for container handling equipment. The Load Sensing System is an integrated part of the spreader and
    consists of a control unit, an indication unit, a CANopen network and load cells mounted on each twistlock.
    The spreader, in turn, is attached to a container handling equipment, for example a Yard Crane, Ship
    to Shore Crane, Reach Stacker or Straddle Carrier. The indicating unit can display weighing result
    from single or twin spreaders.
