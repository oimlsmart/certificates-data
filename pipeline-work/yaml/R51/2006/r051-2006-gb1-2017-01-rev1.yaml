  description: >-
    Family of mains-powered, single-interval, automatic weighing instruments (checkweighers, Category
    X) designated the TS420 Series, designed to weigh packs dynamically. The instruments comprise a cabinet,
    touch screen user interface (HMI), in-feed and out-feed conveyors, a weighing unit with weigh conveyor,
    mechanical handling facilities and sorting devices, and may be equipped with a metal detector. Constructed
    in stainless steel on a fabricated floor-standing frame with adjustable feet; photocells on the frame
    detect packs; the control cabinet houses the electrical hardware including the A/D board and flash
    card memory holding legally relevant parameters. Models are designated 420 Series with functional
    prefixes (e.g. Sentinel 420 for stand alone, Cerberus 420 for metal detection, Theia 420 for X-ray).
    Weighing device is a strain gauge load cell below the centre of the weigh conveyor. Devices: semi-automatic
    zero setting, zero tracking, initial zero setting, pre-set tare, data storage device. Interfaces:
    Ethernet and USB. CF card, HMI board and load cell connection to the electronics are sealed via a
    tamper-evident solution. Alternatively, any compatible load cell may be used provided it has a respective
    OIML R60 Certificate of Conformity with the necessary data for the declaration of compatibility of
    modules, is not a load cell with digital output, has n_lc, Y, Z the same or better than the tested
    HBM PW16AC3 (Emax = 30 kg), has the same design and material, uses no oil damper, and has sensitivity
    greater than 0.33 uV/div. Legally relevant software consists of two parts (HMI and Controller) held
    in read-only directories; parameters are secured by password and a non-editable Parameter Modification
    Counter, and calibration by password and a Calibration Count, both held on the Controller.
