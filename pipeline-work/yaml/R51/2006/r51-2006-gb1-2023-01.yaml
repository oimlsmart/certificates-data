certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - Loadmaster Alpha 100
  - LM-100
  description: >-
    Battery-operated automatic catchweighing instrument comprising a weighing module, 'Terminator' junction
    box, head unit control and display module, pressure transducers and sensors mounted on a wheeled loader.
    Automatically determines the load in the bucket during the lifting process; the hydraulic pressure
    in the loader's arms is converted by a pressure transducer, the output being used by the indicator
    to display the corresponding weight.
