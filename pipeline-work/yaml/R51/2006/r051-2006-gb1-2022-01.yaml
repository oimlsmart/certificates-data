certified_type:
  category: Automatic catchweigher
  type_designations:
  - 9000 Series
  - '9000'
  - '9500'
  - 9500W
  module_designation:
  description: >-
    Automatic catchweigher designated the 9000 Series, operating as an automatic weight or weight/price
    labeller (Category Y); may also operate as an automatic checkweigher (Category X). Comprises a weighing
    device with associated thermal label printer and mechanical handling facilities, designed to weigh
    packs dynamically. Pricing, pack and labelling information is stored in selectable Comformats.
