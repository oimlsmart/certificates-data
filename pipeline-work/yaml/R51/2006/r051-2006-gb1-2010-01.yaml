certified_type:
  category: Automatic catchweigher
  type_designations:
  - WIL-700
  - WIW-700
  module_designation:
  description: >-
    Automatic catchweigher designated WIL-700 or WIW-700, operating as automatic weight or weight-price
    labeller (Category Y) and automatic checkweigher (Category X). Self-indicating and price-computing
    weighing machine with associated thermal label printer and mechanical handling facilities; designed
    to weigh packs dynamically or statically at a constant rate of operation. Devices: initial zero-setting
    (up to 20% of Max), semi-automatic zero-setting (up to 4% of Max), automatic zero-setting after time
    interval (up to 22 min if no zero tracking occurred), zero-tracking device, preset tare device, subtractive
    semi-automatic tare device, zero indication, calibration and setup modes not accessible to the user
    (protected switch on A/D board), price computation, PLU, internal memory for batch data (Category
    X), device acting upon significant faults, screen check at power-up, Category X/Y selection device
    and static/dynamic mode selection (accessible if enabled at initial verification). Interfaces: USB,
    Ethernet.
