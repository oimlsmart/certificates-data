  description: >-
    This family of mains-powered, single-range, automatic weighing instruments is designated the DACS-GN-SE012 and DACS-GN-SE050
    Series, the instruments operate as automatic checkweighers (Category X). The instruments comprise a cabinet, user interface,
    in-feed and out-feed conveyors, weighing unit with weigh conveyor, printer (optional), mechanical handling facilities
    and reject device (optional). The instruments are designed to weigh packs dynamically.
