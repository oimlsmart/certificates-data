certified_type:
  category: Automatic catch weighing instrument
  type_designations:
  - MCheck2
  module_designation: Automatic check weighing / catch weighing instrument
  description: >-
    The automatic catch weighing instrument is an automatic weight labeller (category Y) designated MCheck2
    and is intended for dynamically weighing. The instrument may also operate as an automatic checkweigher
    (Category X). It consists of a touch-screen application controller, Marel M3210 or Marel M3310, together
    with the digital weighing module MWS2 and a load receptor. The load receptor may have transport conveyors
    before or after, a thermal label printer for printing labels with weighing information and other data
    and/or a variety of packing sorting mechanisms e.g. pusher arms, air blast rejectors.
