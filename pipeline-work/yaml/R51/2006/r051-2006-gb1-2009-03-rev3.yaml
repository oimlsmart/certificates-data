  category: Automatic catchweigher
  type_designations:
  - 9000 Series
  - 9500W Series
  module_designation:
  description: >-
    Automatic catchweigher designated the 9000 Series, operating as an automatic weight or weight/price
    labeller (Category Y). The instrument may also operate as an automatic checkweigher (Category X).
    A modified instrument with interface type M6215 replacing the PM860 is designated the 9500W Series.
