certified_type:
  category: Automatic catchweigher
  type_designations:
  - WPL-AI-S Series
  module_designation:
  description: >-
    Automatic catchweigher designated the WPL-AI-S Series, operating as an automatic weight or weight/price
    labeller (Category Y). Comprises a self-indicating and price computing weighing machine with associated
    thermal label printers and mechanical handling facilities. May also operate as an automatic checkweigher
    (Category X). Designed to weigh packs dynamically. Construction: floor-standing stainless steel frame
    on stainless steel feet; scale conveyor, in-feed and out-feed conveyors (any number); labeller (any
    number); photocells for pack detection (any number); Scale Control Unit located behind the weigh conveyor;
    Main Control Unit (MCU) located behind the out-feed conveyor; Display Unit located on a pole-mounted
    surface above the out-feed conveyor consisting of a colour LCD panel, a plastic enclosure and a touch
    screen membrane overlay. The Scale Control Unit board is sealed to prevent access to the calibration
    store button and to the load cell connection.
