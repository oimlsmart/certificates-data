certified_type:
  category: Automatic catchweigher
  type_designations:
  - CWS™ Loadpin
  description: >-
    Automatic catchweigher designed to weigh containers statically with no operator intervention. The
    instrument comprises Loadpin digital load cells, an interface unit (spreader unit) and a control and
    display unit (control unit). The load cells and electronics are permanently installed on the spreader
    of the container handler; weight values are transmitted from the load cells via the interface unit
    to the display unit and on to the Terminal Operating System (TOS). The interface and display units
    have aluminium enclosures; the display unit comprises a communications and display controller with
    an LCD display and 8 keys (6 functional control keys and 2 navigation keys). The units are powered
    by the container handler via a nominal 24 V DC external source; the interface unit supplies the strain
    gauge bridges of the load cells. Devices: semi-automatic zero-setting (≤ 4% Max) via user interface
    or TOS, long term storage device, display and storage of individual and total weights. Interfaces:
    link between interface and display unit, RS 232 / RS 422 / RS 485, CANBUS, Ethernet, Wifi. Software
    is protected by a version number and checksum held on the eMMC memory; access to legally relevant
    parameters is password-protected with a non-editable Config Version counter.
