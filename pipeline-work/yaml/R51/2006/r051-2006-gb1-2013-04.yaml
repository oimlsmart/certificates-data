certified_type:
  category: Automatic catchweigher
  type_designations:
  - LI-700-D
  - CWL-700-D
  module_designation: N/A
  description: >-
    This pattern of an automatic catchweigher, designated the LI-700-D, operates as an automatic weight or weight/price labeller
    (Category Y) and as an automatic checkweigher (category X). The instrument is designated the CWL-700-D when configured
    to operate only as an automatic checkweigher (category X). The instrument comprises a self-indicating and price-computing
    weighing machine with associated thermal label printer and mechanical handling facilities. It is designed to weigh packs
    dynamically, at a constant rate of operation. Pricing, pack and labelling information is stored in files called PLUs selectable
    by the operator for the commodity or labels being processed. Labels are printed for the above transaction data and are
    applied to the packs automatically.
