footnotes:
- marker: 1)
  text: Metrological characteristics depend on the SG-LC or EFC-LC; cf. Report No 1.12-4032862
- marker: 2)
  text: >-
    For weighing instruments of the category XIIIII(x ≥2) and Y(b) the number of verification scale intervals is limited to
    n_i≤1000.
- marker: 3)
  text: >-
    The minimum capacity in case of static weighing for category Y depends on the specification according to R51-1:2006 No
    2.2.2. In that case it may be applied to corresponding category X in the same way in order to achieve smaller minimum
    capacities.
- marker: 4)
  text: >-
    For weighing instruments of the category X the minimum loads depend on the used digital LC, and for weighing instruments
    of the category Y additionally on the specification under 1). In case of category Y the greater value has to be taken.
    Greater minimum loads may also result from the metrological test of the legal metrological control.
