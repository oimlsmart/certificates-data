certified_type:
  category: Checkweigher
  type_designations:
  - 420 Series
  - TS420 Series
  - Sentinel 420
  - Cerberus 420
  - Theia 420
  module_designation: Not applicable
  description: >-
    Family of mains-powered, single-interval, automatic weighing instruments designated the TS420 Series,
    operating as checkweighers (Category X). The instruments comprise a cabinet, touch screen user interface
    (HMI), in-feed and out-feed conveyors, weighing unit with weigh conveyor, mechanical handling facilities
    and sorting devices; they may be equipped with a metal detector. Models are designated 420 Series
    with prefixes describing the associated functions (Sentinel 420 stand alone, Cerberus 420 metal detection,
    Theia 420 X-ray). Constructed in stainless steel with a fabricated floor-standing frame on adjustable
    feet; conveyors' type and size are not restricted. Designed to weigh packs dynamically over a continuously
    running weigh conveyor, with independently adjustable in-feed, weigh and out-feed conveyor speeds.
