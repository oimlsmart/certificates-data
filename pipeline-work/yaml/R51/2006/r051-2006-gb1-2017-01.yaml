- role: load_cell
  type_designations:
  - HBM PW16AC3
  alternatives: OR
  characteristics:
    maximum_capacity:
      value: 30
      unit_symbol: kg
    output_type:
      value: analog (strain gauge, not digital output)
    minimum_sensitivity:
      value:
        min: 0.33
        max:
      unit_symbol: μV/div
    alternative_requirements:
      value: >-
        Any compatible load cell may be used provided: it has an OIML R60 Certificate of Conformity containing
        the load cell types and data required for the manufacturer's declaration of compatibility of modules
        and any particular installation requirements; it is not a load cell with digital output; its characteristics
        (n_lc, Y, Z) are the same or better than the dynamically tested HBM PW16AC3 (Emax = 30 kg); the
        design and material are the same; no oil damper is used; sensitivity is greater than 0.33 μV/div.
