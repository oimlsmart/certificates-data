certified_type:
  category: Automatic catchweigher
  type_designations:
  - SSV-Series Checkweigher (KWS5xxxBxxx)
  module_designation:
  description: >-
    Automatic catchweigher destined to be used as a checkweigher; the catchweigher is weighing dynamically
    during automatic operation. The actual accuracy class is determined at the time of putting into use.
    The maximum number of scale intervals applies per partial weighing range (multiple range instrument).
    The software identification number is displayed after pressing '?' in the upper right corner of the
    home screen, or via 'Menu' > 'Control Panel' > 'Version Info', or via 'Menu' > 'Maint. And Setting'
    > 'Device Information' > 'Version Info'.
