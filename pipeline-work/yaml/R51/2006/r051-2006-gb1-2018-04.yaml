components:
- role: Load cell (single strain gauge load cell located below the centre of the weigh conveyor)
  type_designations:
  - Tedea Huntleigh 1040 C3
  - Tedea Huntleigh 1260 C3
  alternatives: OR
  characteristics:
    entry_mid_range_load_cell: Tedea Huntleigh 1040 C3 (Emax 10 or 15 kg)
    top_range_load_cell: Tedea Huntleigh 1040 C3 (Emax 10 or 15 kg)
    heavy_range_load_cell: Tedea Huntleigh 1260 C3 (Emax 50 or 75 kg)
    interchangeability_conditions: >-
      Any compatible load cell permitted provided it has an OIML R60 Certificate of Conformity containing
      the load cell types and data required for the manufacturer's declaration of compatibility of modules;
      NH-marked cells only if R76 humidity testing was conducted; not a load cell with digital output;
      nlc, Y, Z same or better than the dynamically tested Tedea 1040 C3 (15 kg); same design and material;
      no oil damper used
- role: Thermal label printer / labeller
  type_designations:
  - Thermal label printer (linear label applicator)
  - Delford base labeller
  - Modular labeller
  - Rotary label applicator
  - Smart Date printer (on SLU)
  - Markem Cimjet printer (on SLU)
  alternatives: OR
  characteristics:
    configurations: >-
      One or two top labellers in series; base labeller via RS232 or CAN; stand-alone modular labeller(s);
      rotary label applicator; sleeving/labelling unit (SLU, 'Integrated machine'); combinations of thermal
      label printer and/or SLU/modular labeller
- role: Processing and control electronics
  type_designations:
  - Elvis board
  - PM860 Power PC Module (Motorola MPC860)
  - Elvis Lite board
  - M6215 interface
  - M10K processor board
  - M6415 interface
  alternatives: OR
  characteristics:
    display: >-
      15 inch TFT LCD with resistive touch screen (type RD6385 from Review Display Systems on the M10K
      variant)
    computing_platform: Fujitsu D2703 single board computer (Windows XP); Fujitsu Siemens 3313 motherboard
      (Windows 7)
    communication: Ethernet between PM860 interface and control/display unit; CAN and pack-timing via
      common I/O board
