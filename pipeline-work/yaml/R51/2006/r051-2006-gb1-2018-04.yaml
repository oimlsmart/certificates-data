certified_type:
  category: Automatic catchweigher (checkweigher / weight or weight-price labeller)
  type_designations:
  - 9000 Series Checkweigher / Weight or Weight-Price labeller
  - 9000 Series
  - Integrated machine
  - 9500W Series
  - 9000+
  - 9500+
  module_designation:
  description: >-
    Automatic catchweigher designated the 9000 Series, operating as an automatic weight or weight/price
    labeller (Category Y) and also as an automatic checkweigher (Category X). Comprises a weighing device
    with associated thermal label printer and mechanical handling facilities and weighs packs dynamically.
    Pricing, pack and labelling information is stored in files (Comformats) selectable for the commodity
    or labels being processed; labels are printed with the required transaction data and applied to the
    packs automatically.
