certified_type:
  category: Weighing transmitter
  type_designations:
  - ER500-C
  module_designation: Weighing transmitter for automatic catchweigher
  description: >-
    Digital load-cell amplifier (weighing transmitter) for automatic catchweighers. Software version and
    TAC number are displayed during start-up. If equipped with a display and buttons, these are for set-up
    and service purpose only. Access to set-up and calibration requires removal of a calibration jumper;
    sealing is accomplished with a brittle plastic sticker, and a Traceable Access Counter increments
    on changes to the calibration or legal part of the set-up.
