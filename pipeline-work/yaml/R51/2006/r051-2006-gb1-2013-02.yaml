certified_type:
  category: Automatic checkweigher
  type_designations:
  - DACS-G-F015 Series
  - DACS-G-F015-xx/xx-xx-x
  module_designation: Not applicable
  description: >-
    Family of mains-powered, dual-range automatic weighing instruments designated the DACS-G-F015 Series,
    operating as automatic checkweighers (Category X). Stainless steel construction: fabricated floor-standing
    frame on adjustable feet carrying the in-feed, weigh and out-feed conveyors (conveyor type and size
    not restricted). Control cabinet behind the conveyors houses the electrical hardware; an enclosure
    below the weigh conveyor houses the ADC board and the dip-switches protecting the legally-relevant
    parameters. Jog-dial Remote Control Unit with LED display mounted in the upper part of the control
    cabinet. Photocells on the frame for pack detection; printer on the side of the control cabinet. Weighing
    device is a force balance electromagnetic cell located below the centre of the weigh conveyor.
