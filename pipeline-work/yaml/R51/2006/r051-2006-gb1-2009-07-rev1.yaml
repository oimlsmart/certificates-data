certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - Venus 300
  module_designation:
  description: >-
    Mains-powered automatic checkweighing / catchweighing instrument designated the Venus 300 (checkweigher
    / weight or weight-price labeller). Any compatible load cell(s) may be used provided: a respective
    OIML R60 Certificate of Conformity is issued for the load cell; the certificate contains the load
    cell types and the necessary load cell data required for the manufacturer's declaration of compatibility
    of modules and any particular installation requirements (a load cell marked NH is allowed only if
    humidity testing to R76 has been conducted on it); it is not a load cell with digital output; the
    characteristics of the replacement load cell such as nlc, Y, Z are the same or better than the load
    cell tested dynamically (HBM PW22 C3, capacity 20 kg); the design of the load cells and the material
    are the same; no oil damper is used.
