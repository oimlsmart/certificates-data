matrix_tables:
- name: Maximum belt speed vs weighing range vs instrument type approval matrix
  columns:
  - weighing_range
  - max_belt_speed
  column_units:
  -
  - m/min
  rows:
  - weighing_range: 3 g ≤ m < 5 g (smallest range)
    max_belt_speed: 30
  - weighing_range: 30 g ≤ m < 3000 g (largest range)
    max_belt_speed: 120
  description: >-
    Page 3 contains a full approval matrix of maximum belt speed (30–120 m/min) × weighing range (from
    3 g ≤ m < 5 g up to 30 g ≤ m < 3000 g) × instrument type (KWS60xx through KWS64xx, in BFxx/BPxx/BWxx
    variants, sub-variants 1/2/3). Approved combinations are marked with a checkmark, non-applicable with
    a dash. 30 m/min applies only to the smallest weighing range; 120 m/min is approved for the widest
    set of ranges including the largest. KWS63xx and KWS64xx show no approvals at 30/60 m/min for most
    ranges. Only the extreme rows could be reconstructed from the available summary.
  footnotes: []
