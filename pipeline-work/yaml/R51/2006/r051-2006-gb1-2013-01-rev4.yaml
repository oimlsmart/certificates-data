certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - L-Series 2180
  - Express
  - Force
  - L2150
  description: >-
    Battery-operated automatic catchweighing instrument (Category Y), designated the L-Series 2180, comprising
    an electronic indicator, pressure transducer and sensors mounted on a wheeled loader. The pattern
    automatically determines the load in the bucket during the lifting process: the hydraulic pressure
    in the loader's arms is converted by a pressure transducer, the output being used by the indicator
    to display the corresponding weight. Alternatives cover modified software (MMS reporting via data
    module and wireless communication, not for legal purposes), reduced-functionality models Express and
    Force, the L2150 with modified indicator console layout and dedicated target weight key, forks instead
    of a bucket, replacement of the AAA-20710 position sensor by any compatible sensor, and mounting on
    container reach stackers (weighing inhibited when the telescopic boom is not fully retracted) or container
    forklifts.
