certified_type:
  category: battery-operated automatic catchweighing instrument (Category Y)
  type_designations:
  - L-Series 2180
  module_designation:
  description: >-
    This pattern of a battery-operated automatic catchweighing instrument (Category Y), designated the L-Series 2180, comprises
    an electronic indicator, pressure transducer and sensors mounted on a wheeled loader. This pattern automatically determines
    the load in the bucket during the lifting process, the hydraulic pressure in the loader's arms is converted by a pressure
    transducer, the output being used by the indicator to display the corresponding weight.
