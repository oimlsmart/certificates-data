certified_type:
  category: Automatic catchweigher
  type_designations:
  - LI-700E
  - CWL-700E
  module_designation:
  description: >-
    This pattern of an automatic catchweigher, designated the LI-700E, operates as an automatic weight
    or weight/price labeller (Category Y) and as an automatic checkweigher (Category X). The instrument
    is designated the CWL-700E when configured to operate only as an automatic checkweigher (Category
    X). The instrument comprises a self-indicating and price-computing weighing machine with associated
    thermal label printer and mechanical handling facilities, and is designed to weigh packs statically
    at a constant rate of operation. Construction: stainless steel frame; scale conveyor with optional
    in-feed and out-feed conveyors (any number); labeller; control cabinet located behind the conveyors.
    Devices: initial zero-setting device (≤ 4 % of Max); semi-automatic zero-setting device (≤ 4 % of
    Max); automatic zero-setting after time interval (≤ 107 min); zero-tracking device; preset tare device;
    semi-automatic tare weighing device (subtractive); zero indication; calibration not accessible to
    user; price computation; PLUs. Software: version 2.xx.xx.xxxx, displayed during the power-up sequence;
    alternatively the World View software may be used; the legally relevant software is contained within
    two dll files: HeaderDisplay.dll version 1.0.0.10 and HI710.dll version 1.0.0.79.
