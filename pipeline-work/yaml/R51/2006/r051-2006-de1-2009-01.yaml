  description: >-
    Automatic electromechanical weighing instrument as catchweigher, weigh price labeller, weigh labeller
    or checkweigher, equipped with electro-dynamic force compensation load cell (EFC-LC) with lever work,
    performed as single or multi-interval instrument or single or multiple range instrument.
