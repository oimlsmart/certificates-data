      value: 6000 / 5000
    - condition: WS10CW (Tab. 1), single range or single-interval
      value:
        min:
        max: 5000
    - condition: WS10E or WS20E (Tab. 2), multiple range or multi-interval
      value:
        min:
        max: 3000
    - condition: WS10E or WS20E (Tab. 2), single range or single-interval
      value:
        min:
        max: 6000
  - attribute: minimum_load
    axis: accuracy_class
    values:
    - condition: Y(a), Y(b)
      value:
        min: 20
        max:
      unit_symbol: g
    - condition: XIII(1), XIII(x ≥ 2)
      value:
        min: 50
        max:
      unit_symbol: g
  - attribute: tare
    axis: weighing_module_type
    values:
    - condition: WS10CW (Tab. 1)
      value: "-0.5 × Max"
    - condition: WS10E or WS20E (Tab. 2)
      value: "-0.4 × Max"
