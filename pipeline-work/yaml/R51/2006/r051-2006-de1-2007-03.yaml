footnotes:
- marker: 1)
  text: This applies to multiple range instruments.
- marker: 2)
  text: This applies to multi-interval instruments.
- marker: 3)
  text: >-
    This specification applies only to weighing instruments with parameters being generally valid over
    the complete weighing range for all products and weighing in motion (dynamic weighing). For single
    products having especially their own product data storage and/or their own product-specific parameters
    greater tare loads are allowed if they are approved by the LMC.
- marker: 4)
  text: >-
    The maximum belt speed vmax depends on the maximum load Max and the load L as follows: In case of
    Max = 3 kg: vmax ≤ 2 m/s for L ≤ 1 kg; vmax ≤ -0.333 m/s • L / kg + 2.333 m/s for L > 1 kg. In case
    of Max ≥ 6 kg: vmax ≤ 2 m/s for L ≤ 2 kg; vmax ≤ -0.167 m/s • L / kg + 2.333 m/s for L > 2 kg.
