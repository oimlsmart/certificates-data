    applicable_series:
      value: DACS-G-S015
    alternative_requirements:
      value: >-
        Any compatible load cell may be used provided: it has an OIML R60 Certificate of Conformity containing
        the load cell types and data required for the manufacturer's declaration of compatibility of modules
        and installation requirements; it is not a load cell with digital output; its n_lc, Y, Z characteristics
        are the same or better than the tested QLC-12L; the design and material are the same; no oil damper
        is used
