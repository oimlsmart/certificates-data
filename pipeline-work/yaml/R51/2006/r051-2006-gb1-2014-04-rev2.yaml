certified_type:
  category: Automatic checkweigher
  type_designations:
  - DACS-G-S015
  - DACS-G-S060
  module_designation: Not applicable
  description: >-
    Family of mains-powered, dual-range automatic weighing instruments operating as automatic checkweighers
    (Category X). Stainless steel construction: fabricated floor-standing frame on adjustable feet carrying
    the in-feed, weigh and out-feed conveyors (conveyor type and size not restricted); control cabinet
    behind the conveyors houses the electrical hardware including the ADC board and the dip-switches protecting
    the legally relevant parameters; jog-dial RCU with LED display, function and numerical keys (may be
    replaced by a colour touch screen RCU); photocells on the frame for pack detection; printer on the
    side of the control cabinet. Weighing unit comprises a strain gauge load cell located below the centre
    of the weigh conveyor. Models are designated DACS-G-S015-xx/xx-xx-x and DACS-G-S060-xx/xx-xx-x, with
    x reflecting the various configurations.
