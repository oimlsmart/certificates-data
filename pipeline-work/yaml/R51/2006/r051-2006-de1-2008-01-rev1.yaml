footnotes:
- marker: 1)
  text: >-
    For weighing instruments of the category XIII and Y(b) the number of verification scale intervals
    is limited to ni ≤ 1000.
- marker: 2)
  text: >-
    This value is valid for static weighing. The minimum capacity in case of static weighing for category
    Y depends on the specification according to R51-1:2006 No 2.2.2. In that case it may be applied to
    corresponding category X in the same way in order to achieve smaller minimum capacities.
- marker: 3)
  text: >-
    This value is valid for dynamic weighing. For weighing instruments of the category X the minimum loads
    depend on the used digital LC and for weighing instruments of the category Y additionally on the specification
    under 2). In case of category Y the greater value has to be taken. Greater minimum loads may also
    result from the metrological test of the LMC.
- marker: 4)
  text: Cf. Tab. 2
- marker: 5)
  text: >-
    This specification applies only to weighing instruments with parameters being generally valid over
    the complete weighing range for all products and weighing in motion (dynamic weighing). For single
    products having especially their own product data storage and/or their own product-specific parameters
    greater tare loads are allowed if they are approved by the LMC. A tare load ≤ - Max is allowed for
    start stop operation (static weighing).
