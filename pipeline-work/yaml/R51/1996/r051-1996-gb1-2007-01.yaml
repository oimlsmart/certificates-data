certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - Loadrite Pro LR918
  - LR918
  module_designation:
  description: >-
    Vehicle-mounted, battery-operated automatic catchweighing instrument comprising an electronic indicator,
    hydraulic pressure transducers and sensors. Automatically determines the load in the vehicle's bucket
    during the lifting process. The hydraulic pressure in the loader's arms is measured by a pressure
    transducer, the output being used by the indicator to display the corresponding weight. The indicator
    may be connected to a printer and/or a data storage device.
