certified_type:
  category: Automatic catchweigher
  type_designations:
  - HI-700
  - WI-700
  - CW-700
  - HI-700SF
  - WI-700SF
  - CW-700SF
  - MI-700
  - AP-700 UB
  module_designation: Not applicable
  description: >-
    Automatic catchweigher designated HI-700, operating as an automatic weight or weight/price labeller
    (Category Y); designated CW-700 when configured to operate only as an automatic checkweigher (category
    X). Comprises a self-indicating and price-computing weighing machine with associated thermal label
    printer and mechanical handling facilities, designed to weigh packs dynamically. The weigher and labeller
    are mounted on a single fabricated floor-standing stainless steel frame on adjustable feet. The weighing
    system comprises a scale conveyor mounted on a load cell (HBM PW15); pack detection by photocells.
    Control cabinet houses the electronics (Teraoka SBC-710 SBC Controller, ADC power supply, DSP A/D
    conversion PCB); display via colour LCD touch screen. Access to metrological settings secured by switch
    on the A/D board in a metal case with tamper-evident seal; static calibration password protected with
    audit count number.
