certified_type:
  category: Automatic catchweighing instrument
  type_designations:
  - LI-700
  - CWL-700
  module_designation:
  description: >-
    Automatic catchweigher operating as an automatic weight or weight/price labeller (Category Y); designated
    CWL-700 when configured to operate only as an automatic checkweigher (Category X). Comprises a self-indicating
    and price-computing weighing machine with associated thermal label printer and mechanical handling
    facilities, designed to weigh packs statically at a constant rate of operation. Provided with: initial
    zero-setting device, semi-automatic zero-setting device, automatic zero-setting after time interval
    or number of packs, zero-tracking device, preset tare device, semi-automatic (subtractive) tare device,
    zero indication; calibration not accessible to user; price computation.
