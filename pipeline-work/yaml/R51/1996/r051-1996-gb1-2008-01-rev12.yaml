components:
- role: load cell
  type_designations:
  - Vishay Tedea Huntleigh 240 C3
  - Tedea Huntleigh 1265 C3
  - Utilcell Type 240
  alternatives: OR
  characteristics:
    excitation_voltage_provided_by_console:
      value: 5.5
      unit_symbol: V DC
      unit_id:
    alternative_load_cell_requirements:
    - A respective OIML Certificate of Conformity (R60) is issued for the load cell
    - >-
      The certificate contains the load cell types and the necessary load cell data required for the manufacturer's
      declaration of compatibility of modules and any particular installation requirements
    - It is not a load cell with digital output
    - >-
      Characteristics n_lc, Y, Z are the same or better than the load cell tested dynamically (Vishay
      Tedea Huntleigh 240 C3, Emax = 10 kg)
    - The design of the load cells and the material are the same
    - No oil damper is used
    - Sensitivity is greater than 0.67 µV/division
    alternative_notes: >-
      The Vishay Tedea Huntleigh 240 C3 may be replaced by a Utilcell Type 240 load cell (approved under
      Certificate E-99.02.C01) of identical capacity; the Utilcell Type 240 cannot be used on the Heavy
      Range variant.
- role: PC console (display device)
  type_designations:
  - PP420
  - PP520
  - PPC70
  alternatives: OR
  characteristics:
    manufacturer: B&R
    display: 'PP420/PP520: 10.4-inch colour touch screen; PPC70: 5.7-inch colour touch screen (CW³s Range)'
