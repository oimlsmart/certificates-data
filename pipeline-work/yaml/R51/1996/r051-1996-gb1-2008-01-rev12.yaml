certified_type:
  category: Automatic checkweighing instrument
  type_designations:
  - CW³
  - CW³s
  module_designation:
  description: >-
    The pattern is a mains-powered automatic checkweighing instrument designated the CW³. The load transport
    system may consist of conveyor belts driven by rollers or by sets of chains (designated as "Drag Link").
    Devices: automatic zero setting device active during automatic operation (active if the time between
    two packs is more than 500 ms); pre-set tare device (subtractive); static calibration not accessible
    to the user; dynamic calibration accessible to the user; belt speed setting accessible to the user;
    internal memory for storage of batch reports; device to determine the stability of equilibrium, active
    during dynamic operation; device that acts upon significant faults; screen check at power-up. Interfaces:
    RS 232, USB, Ethernet. The instrument may be connected to the Loma OPC, LomaEnet or TRACS systems
    for the collection of batch reports. Software version V02.32.XX.Y.Z (or V.02.32.XX) where 02.32 reflects
    the legally relevant part of the software and XX.Y.Z (or XX) reflects changes to the non-legally relevant
    part; alternatively the version number may be V02.33.XX.Y.Z where 02.33 reflects the legally relevant
    part.
