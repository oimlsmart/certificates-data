  module_designation:
  description: >-
    Transportable evidential breath alcohol analyser equipped with an internal printer, which is part
    of the approved pattern. Measures alcohol concentration by analysis of expired alveolar air using
    the phenomenon of absorption of a beam of infrared monochromatic radiation. The verification scale
    interval applies during tests related to metrological control and manual calibration of the instrument.
