revision_history:
- revision: '0'
  date: '2020-06-18'
  changes: Initial issue
- revision: '1'
  date: '2020-11-27'
  changes: Addition of report No. NMi-2364857-02 and software update
- revision: '2'
  date: '2021-10-07'
  changes: Addition of meter types using SGM63xx measurement sensor; software updates
- revision: '3'
  date: '2022-02-11'
  changes: Addition of reports No. NMi-2893273-02 and NMi-3093042-02 for revised PCBs
- revision: '4'
  date: '2022-05-03'
  changes: Addition of G1.6 version with SGM6101; software update
- revision: '5'
  date: '2022-10-06'
  changes: >-
    Addition of new housing for MMU6 / software versions added; addition of pulse output battery cover
    for G10, G16, G25, MMU25 and MMU40 models
- revision: '6'
  date: '2022-11-22'
  changes: New combined communication version; software update
- revision: '7'
  date: '2023-08-21'
  changes: Correction of typo in revision number
- revision: '8'
  date: '2024-09-11'
  changes: Dot display MMU6, new pcb and software version
- revision: '9'
  date: '2024-10-03'
  changes: >-
    Addition of G40 with parallel SGM6325 sensors. These sensors are fitting in a new housing with new
    sealing and use a new software version.
- revision: '10'
  date: '2025-02-04'
  changes: >-
    Addition of a G10/MMU16 version which contains 2 parallel SGM6306 sensors instead of a singular SGM6104
    sensor. These sensors are fitted in a standard MMU6 housing with 1 1/4" BS746 connections and a new
    connector to the index.
- revision: '11'
  date: '2025-02-07'
  changes: Software GL26 update on MMU6 meter
- revision: '12'
  date: '2025-03-07'
  changes: >-
    Addition of software versions for G10, G16, G25, MMU25 and MMU40 types with SGM6316 and SGM6325 flow
    sensors.
- revision: '13'
  date: '2025-07-28'
  changes: Revision of GPRS G4, G6, G10, G16 and G25 gas meter
- revision: '14'
  date: '2025-11-13'
  changes: Software GL26 update on MMU6 meter
