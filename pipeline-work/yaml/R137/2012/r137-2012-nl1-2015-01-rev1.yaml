  text: >-
    On the name plate of the rotary meter the cyclic volume can be given in two possible formats: 1. with two digits behind
    the comma as stated in table 2 and 3, or 2. with a number containing 6 significant digits. In this case a HF pulse value
    can be accurately derived from the spinning rotors with an optical sensor.
