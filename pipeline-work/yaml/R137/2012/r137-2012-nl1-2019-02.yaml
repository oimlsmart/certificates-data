certified_type:
  category: Gas meter
  type_designations:
  - Caldon LEFM 38xCi
  - Caldon LEFM 34xCi
  - LEFM 340Ci
  - LEFM 341Ci
  - LEFM 342Ci
  - LEFM 343Ci
  - LEFM 344Ci
  - LEFM 380Ci
  - LEFM 388Ci
  module_designation:
  description: >-
    Ultrasonic gas meter (multi-path transit-time). LEFM 34xCi configurations: LEFM 340Ci - four measurement
    paths in one plane; LEFM 341Ci/342Ci/343Ci - four measurement paths in one plane with an additional
    horizontal check path and/or vertical diagnostic path; LEFM 344Ci - two four-path meters in one body,
    used either as two separate gas meters or in a pay or check arrangement, each with all four paths
    in one vertical plane. LEFM 38xCi: eight-path meter with eight measuring paths in a horizontal configuration;
    one long path and/or one short path may fail and the meter still meets custody-transfer requirements.
    LEFM 388Ci (dual 8-path): two eight-path meters in one body, used either as two separate gas meters
    or in a pay and check arrangement. Measuring principle described in document 10504/0-06. Bi-directional
    flow measurement supported (meter must be calibrated in both directions for bi-directional use). Standard
    electronic display; diagnostic data viewable via Modbus; totalizers indicate the volume with 9 integers.
