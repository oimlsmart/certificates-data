  description: >-
    Flow rates can be calculated as Q = v · 1/4 · π · D² · 3600, where Q = flow rate [m³/h], v = velocity
    [m/s], and D = diameter [m]. If higher values are chosen for vmin and/or lower values for vmax, it
    has to be taken into account that vmin ≤ 0.05 vmax and vt ≤ 0.2 vmax. Meter types 3414, 3415, 3416
    and 3417 can be manufactured from 4–42 inch; meter type 3418 from 8–42 inch. For minimum operating
    pressures below 7 bar(g) (standard mounts) the Qmax values must be reduced as described in the operating
    pressure characteristics.
