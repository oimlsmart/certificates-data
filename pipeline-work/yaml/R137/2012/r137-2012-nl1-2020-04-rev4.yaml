certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  - UIM-U2
  - UIM-U5
  module_designation:
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal paths. Multiple configurations
    can be combined in a single housing: 4 paths (single meter), 4+1 (4 pay and 1 check), 4+2 (4 pay and
    2 check), 4+3 (4 pay and 3 check), and 4+4 (pay and check, or 2 separate meters). With a double meter
    configuration the pay and check meters have different indicators and each meter has its own nameplate
    with a unique serial number.
