    Class 0.5 or 1.0 depending on installation conditions. Corresponding flow rates: Q = v · (1/4) · π
    · D² · 3600, where Q = flow rate [m³/h], v = velocity [m/s], D = internal diameter [m]. Higher values
    of Qmin and lower values of Qmax are allowed on condition that Qmin ≤ 0.05 · Qmax and Qmax / Qt ≥
    5. For bidirectional meters Vmin limitations apply.
