  description: >-
    Velocity limits per nominal size. Columns vmax, vmin_class_0_5_or_1_0 and vt_class_0_5_or_1_0 apply
    to unidirectional or bidirectional meters of class 0.5 or 1.0 (class depending on installation conditions);
    columns vmin_class_1_0_unidirectional and vt_class_1_0_unidirectional apply to unidirectional class
    1.0 meters ('-' = not applicable). Flow rates follow Q = v · 1/4 · π · D² · 3600 (Q in m³/h, v in
    m/s, D in m). Higher values of Qmin and lower values of Qmax are allowed on condition that Qmin ≤
    0.05·Qmax and Qmax/Qt ≥ 5.
