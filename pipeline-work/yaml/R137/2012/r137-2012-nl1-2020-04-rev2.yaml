certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal measurement paths.
    Multiple configurations can be combined in a single housing: 4 paths (single meter), 4+1, 4+2, 4+3
    and 4+4 (pay and check, or 2 separate meters). Accuracy class 0.5 and/or 1.0 depending on installation
    conditions and Qmin flow rate. In double meter configuration, the pay and check meter shall have a
    different indicator and each meter its own nameplate with unique serial number. A transducer path
    pair can be exchanged without deterioration of the metrological performance.
