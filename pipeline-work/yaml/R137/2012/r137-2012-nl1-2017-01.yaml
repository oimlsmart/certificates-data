characteristics:
  type_level:
    measurement_quantity:
      value: Gas volume
    mechanical_class:
      value: M1
    electromagnetic_class:
      value: Not applicable (the meter has no electronics)
    ambient_temperature_range:
      value:
        min: -40
        max: 70
      unit_symbol: "°C"
      unit_id: u:degree_Celsius
    gas_temperature_range:
      value:
        min: -40
        max: 70
      unit_symbol: "°C"
      unit_id: u:degree_Celsius
    orientation:
      value: Horizontal / Vertical up / Vertical down (all orientations)
    flow_direction:
      value: Uni-directional (indicated with arrow)
  config_level:
  - attribute: applicable_pressure_range
    axis: measurement_ratio
    values:
    - condition: MR 1:20 (Table 1, page 3)
      value:
        min: 0
        max: 101
      unit_symbol: bar(g)
    - condition: MR 1:30 (Table 1, page 3)
      value:
        min: 4
        max: 101
      unit_symbol: bar(g)
    - condition: MR 1:50 (Table 1, page 3)
      value:
        min: 8
        max: 101
      unit_symbol: bar(g)
    - condition: MR 1:30 (Table 2, page 4)
      value:
        min: 0
        max: 101
      unit_symbol: bar(g)
    - condition: MR 1:50 (Table 2, page 4)
      value:
        min: 4
        max: 101
      unit_symbol: bar(g)
  - attribute: applicable_pressure_range
    axis: bearing_type
    values:
    - condition: standard bearings
      value:
        min: 0
        max: 101
      unit_symbol: bar(g)
    - condition: optional bearings
      value:
        min: 4
        max: 101
      unit_symbol: bar(g)
  - attribute: minimum_straight_inlet_pipe_length
    axis: flow_straightener
    values:
    - condition: EMT-L with large flow straightener
      value: 1
      unit_symbol: DN
    - condition: EMT-L with small flow straightener
      value: 5
      unit_symbol: DN
    - condition: EMT-S (large flow straightener only)
      value: 1
      unit_symbol: DN
    - condition: EMT-Lx
      value: no requirement concerning straight inlet tubing
    - condition: EMT-Dc
      value: no requirement concerning straight inlet tubing (same as EMT-Lx)
  - attribute: flow_straightener_options
    axis: meter_type
    values:
    - condition: EMT-L
      value: large or small flow straightener
    - condition: EMT-S
      value: large flow straightener only
    - condition: EMT-Lx
      value: inlet flow straightener identical to EMT-S (identical cartridges)
    - condition: EMT-Dc
      value: two EMT-Lx cartridges in one housing; same installation conditions and flow straighteners
        as EMT-Lx
