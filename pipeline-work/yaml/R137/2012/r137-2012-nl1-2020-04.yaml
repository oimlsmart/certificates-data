certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal measurement paths.
    Multiple configurations can be combined in a single housing (4 paths single meter, 4+1, 4+2, 4+3,
    4+4). In double meter configuration the pay and check meter shall have a different indicator and each
    meter must have its own nameplate with unique serial number.
