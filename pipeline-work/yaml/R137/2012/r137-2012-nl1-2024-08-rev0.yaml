  description: >-
    Flow rates based on minimum inner diameter [1] and on maximum inner diameter [2]. Remark [1] and [2]:
    the flow rates in m³/h, as stated on the type plate, are calculated based on the actual inner diameter
    of the ultrasonic gas meter: Q = v · ¼ · π · D² · 3600, where Q = flow rate [m³/h], v = velocity [m/s],
    D = internal diameter [m]. Higher values of Qmin and lower values of Qmax are allowed on condition
    that Qmin ≤ 0.05 Qmax and Qmax / Qt ≥ 5. Installation for accuracy class 0.5, mild and severe flow
    disturbance: upstream 10D + Zanker + 5D straight pipe; downstream minimum 5D straight pipe; Zanker
    compliant flow conditioner.
  footnotes:
  - "[1]"
  - "[2]"
