footnotes:
- marker: "[1]"
  text: >-
    Applies to minimum inner diameter and to flow rates based on minimum inner diameter. Remark [1] and
    [2]: the flow rates in m³/h, as stated on the type plate, are calculated based on the actual inner
    diameter of the ultrasonic gas meter. Q = v · ¼ · π · D² · 3600, where Q = flow rate [m³/h], v = velocity
    [m/s], D = internal diameter [m].
- marker: "[2]"
  text: >-
    Applies to maximum inner diameter and to flow rates based on maximum inner diameter. Remark [1] and
    [2]: the flow rates in m³/h, as stated on the type plate, are calculated based on the actual inner
    diameter of the ultrasonic gas meter. Q = v · ¼ · π · D² · 3600, where Q = flow rate [m³/h], v = velocity
    [m/s], D = internal diameter [m].
