  description: >-
    ρmin = smallest actual density for which the meter is intended to be used; ρmax = largest actual density
    for which the meter is intended to be used. Density thresholds: Qmin columns per ρmin ≥ 6.51 kg/m³
    vs ρmin < 6.51 kg/m³; Qmax columns per ρmax < 40.52 kg/m³ vs ρmax ≥ 40.52 kg/m³. Notes: if higher
    values are chosen for Qmin and/or lower values for Qmax, Qmax/Qmin ≥ 5 must be taken into account;
    for Qt it must be taken into account that Qt ≥ Qmin and 0.1 Qmax ≤ Qt ≤ 0.2 Qmax.
