certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  description: >-
    An ultrasonic gas meter. The meter consists of a cylindrical spool piece with 4 horizontal paths.
    Multiple configurations can be combined in a single housing: 4 paths (single meter); 4+1 (4 pay and
    1 check); 4+2 (4 pay and 2 check); 4+3 (4 pay and 3 check); 4+4 (either as pay and check or as 2 separate
    meters). In a double meter configuration the pay and check meter shall have a different indicator
    with a clear distinction, and both meters must have their own nameplate with unique serial number.
    Flow rates: Q = v · ¼ · π · D² · 3600, where Q = flow rate [m³/h], v = velocity [m/s], D = internal
    diameter [m]. Higher values of Qmin and lower values of Qmax are allowed on condition that Qmin ≤
    0.05·Qmax and Qmax/Qt ≥ 5.
