footnotes:
- marker: "[1]"
  text: >-
    The maximum temperature tests are performed at +60 °C. The instrument fully complied with the requirements
    at +60 °C. However, OIML R 137 section 5.1 limits this temperature to four specific values, in this
    case +55 °C.
- marker: "[2]"
  text: >-
    If higher values are chosen for Qmin or Qt and/or lower values for Qmax, it has to be taken into account
    that the ratio Qmax / Qmin >= 20 and ratio Qmax / Qt >= 5.
