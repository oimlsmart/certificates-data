certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  module_designation:
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal ultrasonic measurement
    paths. Multiple configurations can be combined in a single housing: 4 paths (single meter), 4+1, 4+2,
    4+3 and 4+4; the 4+4 configuration can be either pay-and-check or 2 separate meters. In double meter
    configuration the pay and check meter shall have a different indicator and each meter its own nameplate
    with unique serial number. Unidirectional and bidirectional meters are covered. A transducer path
    pair or the electronics mainboard can be exchanged without deterioration of the metrological performance.
