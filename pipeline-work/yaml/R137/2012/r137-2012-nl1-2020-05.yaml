certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  module_designation:
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal paths. Multiple configurations
    can be combined in a single housing: 4 paths (single meter), 4+1 (4 pay and 1 check), 4+2, 4+3, and
    4+4 (either pay and check, or 2 separate meters). In double meter configuration the pay and check
    meter shall have a different indicator and their own nameplate with unique serial number. Flow rates
    follow Q = v · 1/4 · π · D² · 3600, with Q in m³/h, v in m/s and D in m.
