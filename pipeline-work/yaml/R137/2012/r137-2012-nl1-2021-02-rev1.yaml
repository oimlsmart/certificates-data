matrix_tables:
- name: Path configurations
  columns:
  - meter_type
  - path_configuration
  column_units:
  -
  -
  rows:
  - meter_type: LEFM 340Ci
    path_configuration: Four acoustic paths in one plane.
  - meter_type: LEFM 341Ci / 342Ci / 343Ci
    path_configuration: >-
      Four acoustic paths in one plane. With additional check or diagnostic path(s), horizontal and/or
      vertical.
  - meter_type: LEFM 344Ci
    path_configuration: >-
      2 four-path meters in series in one body, each with four paths in one vertical plane and each having
      its own electronics head. Used either as two separate meters or used as a pay and check meter.
  - meter_type: LEFM 380Ci
    path_configuration: >-
      Eight-path meter with 4+4 paths in an X-shape configuration (plane A and B). One long-path and/or
      one short-path may fail, and the meter still meets the requirements.
  - meter_type: LEFM 388Ci
    path_configuration: >-
      2 eight-path meters in series in one body, each with eight paths in a 4+4 X-shape configuration
      and each having its own electronics head. Used either as two separate meters or used as a pay and
      check meter.
  - meter_type: LEFM / SVM 389Ci
    path_configuration: >-
      Eight-path meter with 8 paths in an X-shape configuration (four paths in each of the two vertical
      planes A and B) and with additional eight verification paths: 1 vertical path for the detection
      of two-phase flow or contamination; 2 additional horizontal paths on the diameter in the vertical
      A and B plane; 5 additional paths in a single plane (plane C) with a different path angle relative
      to the A and B plane, each of the paths at the same chordal height as the paths in the A and B planes.
  description: Acoustic path configuration per meter type.
  footnotes: []
