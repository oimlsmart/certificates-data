    piping_configuration: 5D – FC – 10D – USM – 3D
  description: >-
    Minimum required inlet and outlet straight pipe lengths (D = diameter, USM = ultrasonic meter, FC
    = flow conditioner).
  footnotes:
  - The mentioned pipe lengths are minimum required lengths.
  - >-
    The flow conditioner must be constructed as given in ISO 5167-1:2013, chapter C.3.2.2, "Nova's design
    of K-Lab Perforated Plate Conditioner".
