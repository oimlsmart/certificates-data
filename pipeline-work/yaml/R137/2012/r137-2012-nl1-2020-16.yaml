  description: >-
    Ultrasonic gas meter with 5 horizontal measuring paths (reflecting for ALTOSONIC V12 (Check), direct
    for ALTOSONIC V12D (Check)), optionally with 1 additional vertical reflecting non-metrological measuring
    path (ALTOSONIC V12 Check and ALTOSONIC V12D Check always include it). Piping configuration notation:
    xxD = minimal length of straight inlet/outlet piping (x can be 0..9), FC = flow conditioner, USM =
    ultrasonic gas meter. Flow conditioner type (if applicable): KROHNE flow conditioner.
