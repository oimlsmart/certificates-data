footnotes:
- marker: "[1] (table 4)"
  text: >-
    The maximum gas temperature also depends on the chosen Qmin as specified in table 5 or 6. The resulting
    limiting value for Tmax is normative.
- marker: "[2] (table 4)"
  text: >-
    For severe flow disturbances the transducers are flush mounted (no protrusion inside the meter housing).
- marker: "[1] (tables 5 and 6)"
  text: >-
    If higher values are chosen for Qmin or Qt and/or lower values for Qmax, it has to be taken into account
    that: if ratio Qmax/Qmin ≥ 50 then Qmax/Qt ≥ 10; if ratio Qmax/Qmin ≥ 5 and < 50 then Qmax/Qt ≥ 5.
- marker: "[2] (tables 5 and 6)"
  text: >-
    The maximum Qmax depends on the transducer type and installation conditions (mild or severe flow disturbances).
- marker: "[3] (tables 5 and 6)"
  text: The maximum operating pressure (Pmax) depends on the installed transducer according table 4.
- marker: "[4] (tables 5 and 6)"
  text: Regarding pmin and pmax see also the section "Installation conditions, working pressure" on page
    6.
