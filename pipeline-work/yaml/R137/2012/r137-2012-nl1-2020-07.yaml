footnotes:
- marker: "[1]"
  text: >-
    If higher values are chosen for Qmin and/or lower values for Qmax, it has to be taken into account
    that: Qmin ≤ 0.05 Qmax and Qmax/Qt ≥ 5.
- marker: "[2]"
  text: >-
    According the manufacturers specification the following Qt restrictions are applicable: for 1:20 ≤
    Qmin/Qmax ≤ 1:50, Qt ≥ 0.2·Qmax; for 1:50 < Qmin/Qmax, Qt ≥ 0.1·Qmax.
