certified_type:
  category: Gas meter
  type_designations:
  - FLC-UFL-4F
  module_designation:
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal paths. Multiple configurations
    can be combined in a single housing: 4 paths (single meter), 4+1 (4 pay and 1 check), 4+2 (4 pay and
    2 check), 4+3 (4 pay and 3 check), 4+4 (either pay and check or 2 separate meters). In double meter
    configuration the pay and check meter shall have a different indicator with a clear distinction; both
    meters must have their own nameplate with unique serial number. A thermowell may be mounted at 2D-5D
    from the outlet of the meter. A transducer path pair and the electronics mainboard can be exchanged
    without deterioration of the metrological performance.
