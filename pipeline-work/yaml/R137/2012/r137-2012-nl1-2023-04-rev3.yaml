certified_type:
  category: Gas meter
  type_designations:
  - USM-GT400
  module_designation:
  description: >-
    Ultrasonic gas meter: cylindrical spool piece with 6 horizontal direct paths, 2 paths on each level
    evenly distributed. Available in reduced bore and full bore variants; the reduced bore version can
    have a tapering with a chamfer of 7 degrees to adjust the flange diameter to the connecting pipes.
