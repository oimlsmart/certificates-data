  description: >-
    Internal bore columns refer to footnote [2]; vmax, vt and vmin columns refer to footnote [1]. Full-bore
    variants are not available for DN650 and above (--- in original table).
  footnotes:
  - marker: "[1]"
    text: >-
      If higher values are chosen for Qmin or Qt and/or lower values for Qmax, it has to be taken into
      account that: if ratio Qmax/Qmin >= 50 then Qmax/Qt >= 10; if ratio Qmax/Qmin >= 5 and < 50 then
      Qmax/Qt >= 5.
  - marker: "[2]"
    text: >-
      Depending on the internal bore, the flow rate in m³/h can be calculated. The corresponding flow
      rates can be calculated as follows: Q = v · ¼ · π · D² · 3600, where Q = flow rate [m³/h], v = velocity
      [m/s], D = internal diameter [m].
