footnotes:
- marker: "[1]"
  text: >-
    On the name plate of the rotary meter the cyclic volume can be given in two possible formats: with
    two digits behind the comma as stated in the tables above, or with a number containing 6 significant
    digits. In this case a HF pulse value can be accurately derived from the spinning rotors with an optical
    sensor.
- marker: "[2]"
  text: These meters are equipped with a threaded connection.
- marker: "[3]"
  text: These meters can be equipped with a flange or threaded connection.
- marker: "[4]"
  text: See footnote [1] regarding the cyclic volume.
- marker: "[5]"
  text: >-
    The FMR-Dual can be delivered as a low pressure (Pmax = 21 bar) or a high pressure (Pmax = 101 bar)
    variant. The two different housings used for the specific pressure rating are given in document no.
    10372/7-02 page 12 (Pmax = 21 bar) and page 15 (Pmax = 101 bar).
