certified_type:
  category: Gas meter
  type_designations:
  - FLC-UFL-4F
  description: >-
    Ultrasonic gas meter. The meter consists of a cylindrical spool piece with 4 horizontal paths. Multiple
    configurations can be combined in a single housing: 4 paths configuration (single meter); 4+1 configuration
    (4 pay and 1 check); 4+2 configuration (4 pay and 2 check); 4+3 configuration (4 pay and 3 check);
    4+4 configuration (either as pay and check or as 2 separate meters). When equipped with a double meter
    configuration, the pay and check meter shall have a different indicator, with a clear distinction
    between pay and check, and each meter must have its own nameplate with unique serial number. Higher
    values of Qmin and lower values of Qmax are allowed on condition that Qmin <= 0.05 Qmax and Qmax/Qt
    >= 5. Corresponding flow rates calculated as Q = v * 1/4 * pi * D^2 * 3600.
