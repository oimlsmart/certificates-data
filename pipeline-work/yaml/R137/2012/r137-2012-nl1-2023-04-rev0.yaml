footnotes:
- marker: Table 2 [1]
  text: >-
    xD = Minimum straight inlet & outlet piping length; FC = Flow conditioner: CPA55E; USM = Ultrasonic
    gas meter.
- marker: Table 2 [2]
  text: A temperature sensor can optionally be placed at least 1.5D downstream of the USM outlet.
- marker: Table 3 [1]
  text: >-
    If higher values are chosen for Qmin or Qt and/or lower values for Qmax, it has to be taken into account
    that: if ratio Qmax/Qmin >= 50 then Qmax/Qt >= 10; if ratio Qmax/Qmin >= 5 and < 50 then Qmax/Qt >=
    5.
- marker: Table 3 [2]
  text: >-
    Depending on the internal bore, the flow rate in m³/h can be calculated: Q = v · 1/4 · π · D² · 3600,
    where Q = flow rate [m³/h], v = velocity [m/s], D = internal diameter [m].
