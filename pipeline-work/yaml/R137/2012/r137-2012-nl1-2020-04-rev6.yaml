  description: >-
    Vmax and Vmin columns apply to class 0.5 or 1.0 (depending on installation conditions) for unidirectional
    or bidirectional meters; the last two columns apply to class 1.0 unidirectional meters. Vt = 1/10
    Vmax. Corresponding flow rates: Q = v * 1/4 * pi * D^2 * 3600, with Q = flow rate in m3/h, v = velocity
    in m/s, D = internal diameter in m. Higher Qmin and lower Qmax values are allowed on condition that
    Qmin <= 0.05 * Qmax and Qmax / Qt >= 5. For bidirectional meters the Vmin limitations of this table
    apply. Null cells correspond to '-' (not applicable) in the certificate.
