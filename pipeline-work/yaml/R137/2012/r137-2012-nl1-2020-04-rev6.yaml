certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  module_designation:
  description: >-
    Ultrasonic gas meter. The meter consists of a cylindrical spool piece with 4 horizontal paths. Multiple
    configurations can be combined in a single housing: 4 paths (single meter), 4+1 (4 pay and 1 check),
    4+2 (4 pay and 2 check), 4+3 (4 pay and 3 check), 4+4 (pay and check or 2 separate meters). Transducer
    UIM-U2 for USM nominal sizes up to 12 inch, UIM-U5 for USM nominal sizes above 12 inch. Corresponding
    flow rates calculated as Q = v * 1/4 * pi * D^2 * 3600.
