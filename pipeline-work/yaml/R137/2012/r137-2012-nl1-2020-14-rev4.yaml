certified_type:
  category: Gas meter
  type_designations:
  - '3414'
  - '3415'
  - '3416'
  - '3417'
  - '3418'
  module_designation:
  description: >-
    Ultrasonic gas meter, manufacturers mark: Rosemount, family designation GUSM or Senior Sonic. Model
    3414: 4 measuring paths in horizontal configuration. Model 3415: model 3414 path layout and electronics,
    additionally equipped with one check path connected to a separate set of electronics. Model 3416:
    model 3414 path layout and electronics, additionally equipped with one check path and one diagnostic
    path connected to a separate set of electronics. Model 3417: composed of two model 3414 electronics
    and transducers built into a model 3417 spool piece, usable as two separate gas meters or in pay/check
    configuration. Model 3418: 8 measuring paths in horizontal configuration. Previously placed on the
    market by Daniel Measurement and Control, Inc.
