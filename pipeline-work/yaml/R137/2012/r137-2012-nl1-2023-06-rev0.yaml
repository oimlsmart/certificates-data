  description: >-
    Coriolis gas meter, manufacturers mark Micro Motion, type CMFxxx with 5700 transmitter. Destined for
    the measurement of gases, including CO2 and natural gas. The measurement sensor consists of a housing
    in which two parallel measuring tubes are mounted with one drive coil and two pick-off coils; signal
    processing is performed by the 5700 transmitter, which also controls the drive coil.
