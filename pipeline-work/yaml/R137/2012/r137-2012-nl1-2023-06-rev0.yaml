  description: >-
    Maximum Qmax is not tabulated; it is calculated with Formula 1: Qmax = S * M * SOS_gas * rho_gas,
    where S = 2 * 1/4 * pi * d^2 (d = internal diameter of the measuring tube from this table), M = maximum
    Mach number (from this table), SOS_gas = speed of sound of the gas at operating conditions, rho_gas
    = gas density at operating conditions. Qt ≤ Qmax/5 for all models. The maximum pressure pmax depends
    on the meter material group (columns A/M/L and B/H/P/Y, marked y).
  footnotes:
  - y) Indicates the type of material the meter is built of
