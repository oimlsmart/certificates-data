components:
- role: Measurement sensor
  type_designations: []
  characteristics:
    design:
      value: >-
        Housing in which two parallel measuring tubes are mounted; three coils mounted on the tubes: one
        drive coil and two pick-off coils
    signal_processing:
      value: Performed by the external device (5700 transmitter) that also controls the drive coil
    density_principle:
      value: The natural frequency of the measuring tubes depends on the density of the gas
- role: Transmitter
  type_designations:
  - '5700'
  characteristics:
    configuration_options:
      value: >-
        With integral core processor (connected directly to the flow sensor) or connected to a separate
        core processor (no integral core processor)
    documentation:
      value: Flow transmitter hardware in documentation folder no. TC8519
