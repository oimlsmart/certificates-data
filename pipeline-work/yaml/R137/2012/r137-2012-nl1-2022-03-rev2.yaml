- marker: "*"
  text: MPV, see table 2 for further specification.
- marker: 1)
  text: MPV indicates that the meter optionally can be manufactured as a Multi Position Version.
- marker: 2)
  text: SYNC indicates that the meter is always equipped with a double pair of impellers.
- marker: 3)
  text: The overload flow rate (Qr) for all rotary meters is equal to 1,2 · Qmax.
- marker: 4)
  text: >-
    The working pressure range for all rotary displacement gas meters is atmospheric up to and including
    20 bar(g).
