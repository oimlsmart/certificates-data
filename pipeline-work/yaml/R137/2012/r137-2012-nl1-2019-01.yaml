  description: >-
    Flow characteristics of the family of ultrasonic gas meters by diameter size. Flow rates: Q = v ·
    (1/4) · π · D² · 3600, where Q = flow rate [m³/h], v = velocity [m/s], D = diameter [m].
  footnotes:
  - >-
    If higher values are chosen for vmin and/or lower values for vmax it has to be taken into account
    that vmin ≤ 0.05 vmax and vt ≤ 0.2 vmax.
  - Meter type 3414, 3415, 3416 and 3417 can be manufactured from 4 - 42 inch.
  - Meter type 3418 can be manufactured from 8 - 42 inch.
