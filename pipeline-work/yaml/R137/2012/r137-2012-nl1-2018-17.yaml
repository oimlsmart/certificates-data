  module_designation:
  description: >-
    Ultrasonic gas meter (Daniel GUSM or Senior Sonic). Model 3414: 4 measuring paths in horizontal configuration.
    Model 3415: model 3414 path layout and electronics, additionally equipped with one check path connected
    to a separate set of electronics. Model 3416: model 3414 path layout and electronics, additionally
    equipped with one check path and one diagnostic path connected to a separate set of electronics. Model
    3417: two model 3414 electronics and transducers built into a model 3417 spool piece; can be used
    as two separate gas meters or in pay/check configuration. Model 3418: 8 measuring paths in horizontal
    configuration. Production locations: Daniel Measurement and Control, Inc., Houston, Texas, United
    States of America; Emerson SRL, Emerson street no. 4, 400461 Cluj-Napoca, Romania.
