      that vmin ≤ 0.05 vmax and vt ≤ 0.2 vmax.
  - marker: note-2
    text: Meter type 3414, 3415, 3416 and 3417 can be manufactured from 4 - 42 inch.
  - marker: note-3
    text: Meter type 3418 can be manufactured from 8 - 42 inch.
