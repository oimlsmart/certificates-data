footnotes:
- marker: "[1]"
  text: >-
    (Table 5) The maximum gas temperature also depends on the chosen Qmin as specified in table 5 or 6.
    The resulting limiting value for Tmax is normative
- marker: "[2]"
  text: >-
    (Table 5) For severe flow disturbances the transducers are flush mounted (no protrusion inside the
    meter housing)
- marker: "[1]"
  text: >-
    (Tables 6, 7 and 8) If higher values are chosen for Qmin or Qt and/or lower values for Qmax, it has
    to be taken into account that: if ratio Qmax/Qmin >= 50 then Qmax/Qt >= 10; if ratio Qmax/Qmin >=
    5 and < 50 then Qmax/Qt >= 5
- marker: "[2]"
  text: >-
    (Tables 6, 7 and 8) The maximum Qmax depends on the transducer type and installation conditions (mild
    or severe flow disturbances)
- marker: "[3]"
  text: >-
    (Tables 6, 7 and 8) The maximum operating pressure (Pmax) depends on the installed transducer according
    to table 5
- marker: "[4]"
  text: >-
    (Tables 6, 7 and 8) Regarding pmin and pmax see also the section 'Installation conditions, working
    pressure' on page 8
- marker: "[5]"
  text: >-
    (Tables 6, 7 and 8) Associated internal bore may differ for certain schedule sizes. In such cases
    the alternate flowrates are recalculated as follows: Q2 = (D2^2 / D1^2) · Q1, where D1 is the associated
    internal bore dimension [mm], D2 the alternate internal bore dimension [mm], Q1 the associated flowrate
    [m³/h] and Q2 the alternate internal bore flowrate [m³/h]
