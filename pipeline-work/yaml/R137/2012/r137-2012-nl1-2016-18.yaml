    Velocity limits per nominal pipe size. Corresponding flow rates calculated as Q = v · (π/4) · D² ·
    3600, where Q is flow rate in m³/h, v is velocity in m/s and D is internal diameter in m. Higher Qmin
    and lower Qmax values allowed provided Qmin ≤ 0.05 Qmax and Qmax/Qt ≥ 5.
