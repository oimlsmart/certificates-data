certified_type:
  category: Gas meter
  type_designations:
  - FSN-4P
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal paths. Multiple configurations
    can be combined in a single housing: 4 paths (single meter); 4+1 (4 pay and 1 check); 4+2 (4 pay and
    2 check); 4+3 (4 pay and 3 check); 4+4 (either pay and check or 2 separate meters). With double meter
    configuration, pay and check meter must have a different indicator and their own nameplate with unique
    serial number. A transducer path pair can be exchanged without deterioration of the metrological performance.
