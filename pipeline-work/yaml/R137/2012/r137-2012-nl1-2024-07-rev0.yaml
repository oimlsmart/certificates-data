  description: >-
    Ratio conditions apply for Qmax/Qmin >= 5 and Qmax/Qt >= 5. Maximum mass flow rate is given by Formula
    1: Qmax = M × 2 × S × SOS_gas × ρ_act × 3600, where S = (π/4) × d² is the cross-sectional area of
    the measuring tube with internal diameter d from this table [m²], M is the maximum Mach number for
    the meter [-], SOS_gas the speed of sound of the gas at operating conditions [m/s], and ρ_act the
    actual gas density at operating conditions [kg/m³].
