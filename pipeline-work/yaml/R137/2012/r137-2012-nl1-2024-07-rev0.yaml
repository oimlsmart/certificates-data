certified_type:
  category: Gas meter
  type_designations:
  - HPC020
  - '5700'
  module_designation:
  description: >-
    Coriolis gas meter, manufacturers mark Micro Motion. The HPC020 High Pressure Coriolis Meter is used
    with a 5700 transmitter. The measurement sensor consists of a housing in which two parallel measuring
    tubes are mounted with one drive coil and two pick-off coils; processing of the measurement signals
    is performed by the same external device that controls the drive coil, and the natural frequency of
    the tubes is used to determine the gas density. The 5700 transmitter either uses an integral core
    processor (direct connection to the flow sensor) or is connected to an external core processor. Transmitter
    hardware and sealing procedure are documented in folder no. TC8519. Installation: measurement sensor
    and 5700 transmitter must be electronically sealed; programmable parameters: security mode settings,
    low flow cut off settings, damping settings, slug flow settings, last measured value fault timeout
    settings. Operation: horizontal flow direction only, no reverse flow during custody transfer; no pressure,
    temperature or density correction allowed during custody transfer. Verification: zero flow calibration
    per procedure C-SP-HW-280 for custody transfer in gas applications; one full calibration curve according
    to OIML R137-1&2:2012 for gas density >= 3.8 kg/m3; calibration with gas similar to the process gas
    at an ISO17025 lab or with a reference installation traceable to (inter)national standards.
