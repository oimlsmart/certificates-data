    v_max, v_min and v_t columns apply to accuracy class 0.5 or 1.0 (depending on installation conditions)
    for unidirectional or bidirectional meters; class_1_0_unidirectional columns apply to class 1.0 unidirectional
    meters only (null = not applicable). Flow rates calculated as Q = v * 1/4 * pi * D^2 * 3600, with
    Q in m³/h, v in m/s, D in m. Higher Qmin and lower Qmax values are allowed provided Qmin <= 0.05 Qmax
    and Qmax/Qt >= 5. For bidirectional meters the v_min limitations of this table apply.
