    upstream_straight_pipe: 5D + flow conditioner + 10D
    downstream_straight_pipe: 4D
  - flow_disturbance: mild and severe
    accuracy_class: 0.5
    flow_conditioner: PTB compliant design
    upstream_straight_pipe: 5D + flow conditioner + 5D
    downstream_straight_pipe: 3D
  - flow_disturbance: mild
    accuracy_class: 1.0
    flow_conditioner: TI TWIN type (PTB & NOVA 50E compliant design)
    upstream_straight_pipe: 2D + flow conditioner + 3D
    downstream_straight_pipe: 3D
  description: >-
    Detailed installation requirements and the construction of the TI TWIN type flow conditioner are recorded
    in EU-Type examination certificate T10983. A thermowell may be mounted at 2D - 5D from the outlet
    of the meter; for bi-directional applications an additional temperature sensor can be installed 2-5D
    upstream.
  footnotes: []
