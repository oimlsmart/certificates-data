certified_type:
  category: Gas meter
  type_designations:
  - UIM-4F
  - UIM-U2
  - UIM-U5
  module_designation:
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal paths. Multiple configurations
    can be combined in a single housing: 4 paths (single meter); 4+1 (4 pay and 1 check); 4+2 (4 pay and
    2 check); 4+3 (4 pay and 3 check); 4+4 (pay and check, or 2 separate meters). Transducer type UIM-U2
    for USM nominal size ≤ 12 inch, UIM-U5 for USM nominal size > 12 inch. In a double meter configuration
    the pay and check meter shall have a different indicator and each meter its own nameplate with unique
    serial number.
