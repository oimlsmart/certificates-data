  module_designation:
  description: >-
    Ultrasonic gas meter, manufacturers mark: Rosemount (family known as GUSM or Senior Sonic). Previously
    placed on the market by manufacturer Daniel Measurement and Control, Inc.; the current manufacturer
    Micro Motion, Inc. changed the mark to Rosemount. Production locations: F-R Tecnologias De Flujo,
    S.A. de C.V., Ave. Miguel de Cervantes 111, Chihuahua 31136, Mexico; and Emerson SRL, Emerson street
    no. 4, 400461 Cluj-Napoca, Romania. Construction recorded in Documentation folder no. T11159-3.
characteristics:
  type_level:
    measured_quantity:
      value: Gas volume
    environmental_class:
      value: M1 / E2
    accuracy_class:
      value: 0.5
    ambient_temperature_range:
      value:
        min: -40
        max: 70
      unit_symbol: "°C"
      unit_id: u:degree_Celsius
    designed_for:
      value: condensing humidity
    orientation:
      value: all orientations
    power_supply_voltage:
      value:
        min: 10
        max: 36
      unit_symbol: V
    power_supply_type:
      value: DC
    minimum_measuring_range:
      value: '1:20'
    minimum_velocity_vmin:
      value: 0.5
      unit_symbol: m/s
    minimum_transition_velocity_vt:
      value: 1/10 vmax
  model_level:
  - attribute: maximum_velocity_vmax
    unit_symbol: m/s
    values:
    - model: 4 in / DN100
      value: 30.5
    - model: 6 in / DN150
      value: 30.5
    - model: 8 in / DN200
      value: 30.5
    - model: 10 in / DN250
      value: 30.5
    - model: 12 in / DN300
      value: 30.5
    - model: 14 in / DN350
      value: 30.5
    - model: 16 in / DN400
      value: 30.5
    - model: 18 in / DN450
      value:
    - model: 20 in / DN500
      value: 32.5
    - model: 24 in / DN600
      value: 30.5
    - model: 30 in / DN750
      value: 26
    - model: 36 in / DN900
      value: 23
    - model: 42 in / DN1050
      value: 21
  config_level:
  - attribute: operating_pressure_range
    axis: mount_and_transducer_configuration
    values:
    - condition: standard mounts
      value:
        min: 7
        max: 425
      unit_symbol: bar(g)
    - condition: isolated mounts on chordal paths, meter size 4 to 12 inch
      value:
        min: 0
        max: 105
      unit_symbol: bar(g)
    - condition: isolated mounts on chordal paths, meter size 14 to 42 inch
      value:
        min: 8
        max: 105
      unit_symbol: bar(g)
    - condition: T200 transducers with dedicated T200 isolated mounts, meter size 4 to 42 inch
      value:
        min: 0
        max: 259
      unit_symbol: bar
  - attribute: qmax_reduction_factor
    axis: transducer_type_and_minimum_operating_pressure
    values:
    - condition: minimum pressure between 3.5 and 7 bar(g)
      value: 0.5
    - condition: T32 transducers only, minimum pressure between 7 and 10 bar(g)
      value: 0.8
  - attribute: gas_temperature_range
    axis: transducer_type
    values:
    - condition: T11 / T12 / T21
      value:
        min: -20
        max: 55
      unit_symbol: "°C"
    - condition: T22 / T32
      value:
        min: -40
        max: 55
      unit_symbol: "°C"
    - condition: T41
      value:
        min: -50
        max: 100
      unit_symbol: "°C"
    - condition: T200
      value:
        min: -50
        max: 125
      unit_symbol: "°C"
  - attribute: inlet_piping_installation
    axis: meter_type_and_disturbance_severity
    values:
    - condition: 3414 / 3415 / 3416 / 3417, mild disturbances
      value: >-
        5D piping followed by a CPA 50E or NOVA 50E compliant design straightener followed by 10D piping
        at the inlet of the meter
    - condition: 3414 / 3415 / 3416 / 3417, mild and severe disturbances
      value: 5D piping followed by a CPA 55E straightener followed by 10D piping at the inlet of the meter
    - condition: 3418, mild and severe disturbances
      value: 5D piping at the inlet of the meter
