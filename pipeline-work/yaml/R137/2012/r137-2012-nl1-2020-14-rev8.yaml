model_family:
  family_name: GUSM or Senior Sonic
  models:
  - model_id: '3414'
    label: Model 3414
    attributes:
      measuring_paths: 4
      path_configuration: horizontal
      manufacturable_sizes_inch:
        min: 4
        max: 42
  - model_id: '3415'
    label: Model 3415
    attributes:
      measuring_paths: 4
      check_paths: 1
      path_configuration: horizontal
      description: >-
        Contains a model 3414 path layout and electronics, additionally equipped with one check path connected
        to a separate set of electronics
      manufacturable_sizes_inch:
        min: 4
        max: 42
  - model_id: '3416'
    label: Model 3416
    attributes:
      measuring_paths: 4
      check_paths: 1
      diagnostic_paths: 1
      path_configuration: horizontal
      description: >-
        Contains a model 3414 path layout and electronics, additionally equipped with one check path and
        one diagnostic path connected to a separate set of electronics
      manufacturable_sizes_inch:
        min: 4
        max: 42
  - model_id: '3417'
    label: Model 3417
    attributes:
      description: Composed of two model 3414 electronics and transducers built into a model 3417 spool
        piece
      usable_configurations:
      - two separate gas meters
      - pay / check configuration
      manufacturable_sizes_inch:
        min: 4
        max: 42
  - model_id: '3418'
    label: Model 3418
    attributes:
      measuring_paths: 8
      path_configuration: horizontal
      manufacturable_sizes_inch:
        min: 8
        max: 42
components:
- role: ultrasonic transducer
  type_designations:
  - T11
  - T12
  - T21
  - T22
  - T32
  - T41
  - T200
  alternatives: OR
  characteristics:
    note: >-
      T200 transducers are always installed with their dedicated T200 isolated mounts for meter size 4
      to 42 inch, pressure range 0 up to and including 259 bar
- role: upstream flow conditioner (installation accessory)
  type_designations:
  - CPA 50E
  - NOVA 50E
  - CPA 55E
  alternatives: OR
footnotes:
- marker: note-1
  text: >-
    If higher values are chosen for vmin and/or lower values for vmax it has to be taken into account
    that vmin ≤ 0.05 vmax and vt ≤ 0.2 vmax.
- marker: note-2
  text: >-
    Flow rates calculated as Q = v · ¼ · π · D² · 3600, where Q = flow rate [m³/h], v = velocity [m/s],
    and D = diameter [m].
