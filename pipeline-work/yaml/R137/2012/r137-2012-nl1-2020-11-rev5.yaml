certified_type:
  category: Gas meter
  type_designations:
  - FSN-4P
  description: >-
    Ultrasonic gas meter consisting of a cylindrical spool piece with 4 horizontal ultrasonic measurement
    paths. Multiple configurations can be combined in a single housing: 4-path single meter; 4+1 (4 pay
    and 1 check); 4+2; 4+3; 4+4 (pay and check, or 2 separate meters). The 3" & 4" Variant 2 (V2) meter
    is only configurable as a 4-path single meter. In double meter configurations the pay and check meters
    shall have a different indicator and their own nameplates with unique serial numbers. Flow rate calculated
    as Q = v · (1/4) · π · D² · 3600 (v = velocity, D = internal diameter); higher Qmin and lower Qmax
    values are allowed on condition that Qmin ≤ 0.05 · Qmax and Qmax / Qt ≥ 5. Installation with NOVA
    50E, PTB or TI TWIN type flow conditioners as specified for mild and/or severe flow disturbance; a
    thermowell may be mounted at 2D–5D from the outlet of the meter. A transducer path pair and the electronics
    mainboard can be exchanged without deterioration of the metrological performance.
