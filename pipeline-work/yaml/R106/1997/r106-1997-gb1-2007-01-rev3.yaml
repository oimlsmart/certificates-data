certified_type:
  category: Automatic rail weighbridge
  type_designations:
  - Railweight TSR4000
  module_designation:
  description: >-
    Rail weighbridge for weighing coupled wagons (accuracy class 0.5) or total trains (accuracy class
    0.2), fitted with Weighline transducers. Alternatively, any compatible load cell(s) with an OIML R60
    Certificate of Conformity may be used, provided a compatibility of modules calculation is made by
    the manufacturer, a standard load transmission device is used, and an NH-marked load cell is only
    allowed if humidity testing to R106 has been conducted on that load cell.
