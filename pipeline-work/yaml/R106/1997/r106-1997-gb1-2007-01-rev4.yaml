certified_type:
  category: Automatic rail weighbridge
  type_designations:
  - Railweight TSR4000
  module_designation: Not applicable
  description: >-
    Automatic rail weighbridge (Railweight TSR4000) for weighing coupled wagons or a total train in motion;
    bi-directional (train pushed/pulled); up to 16 Weighline transducers (8 pairs). Permitted alternatives:
    (1) remote operation via a permanently installed standard PC connected by serial link running a Railweight
    program (Start Weigh, Abort Weigh, End Weigh); (2) maximum capacity of 16,500 kg per wheel (33,000
    kg per axle) with Weighline transducers of 16,500 kg maximum capacity; (3) alternative Advantech PCI-6873
    motherboard with Enhance 200W Micro ATX power supply unit; (4) alternative single board computer SBC-5539-VL2
    (Modular Industrial Systems Inc.) with power supply unit SFX-0525H (Enhance Electronics UK); (5) software
    identification 'TSR4000 CIMW', approved software version 5.xxx/yy; (6) 'twin track' mode in which
    the controller dynamically selects a sub-set of active transducers per track (both tracks must have
    the same metrological characteristics; rating plate marked 'Dual track'); (7) weighing of rail wagons
    containing liquids; (8) modified pre-amplifier circuit, drawing A3-06-2643 revision 3. Alternatively,
    any compatible load cell with an OIML R60 Certificate of Conformity may be used subject to a manufacturer's
    compatibility of modules calculation and use of a standard load transmission device.
