certified_type:
  category: Automatic instrument for weighing road vehicles in motion
  type_designations:
  - CrossWIM
  module_designation: Not applicable
  description: >-
    CrossWIM is a weighing instrument designed for determining the weight of axles and the total weight
    (gross vehicle weight) of road vehicles. The weighing range for the gross vehicle weight is determined
    as the product of the weighing range of one axle and the maximum number of weighable axles: Max_GVW
    = Max_axle × A_max.
