certified_type:
  category: Load cell
  type_designations:
  - PR 6204
  module_designation: Digital load cell
  description: >-
    Digital strain gauge compression load cell. The load cells of the series PR 6204 are compact compression
    load cells for self-centering pendulum applications. The strain gauge application is hermetically
    sealed; the deep-drawn and micro plasma welded housing is made of stainless steel and filled with
    inert gas. The analog signal of the strain gauge bridge is amplified, scaled and filtered by the integrated
    module. The load cell is equipped with an interface RS485. The load cell can only be used in combination
    with a data processing device of manufacturer Sartorius.
