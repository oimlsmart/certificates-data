certified_type:
  category: Load cell
  type_designations:
  - WBK-D
  module_designation:
  description: >-
    Compression load cell, with strain gauges, equipped with electronics. The characteristics for n_max
    and Y can be reduced separately; Z is proportional or equal to n_max. Can only be used with an indicator
    that does not allow adjustment of the load cell calibration data via any interface; connecting cable
    or junction box provides sealing possibility; each load cell is supplied with an accompanying document
    with its characteristics.
