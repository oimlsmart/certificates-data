certified_type:
  category: Load cell
  type_designations:
  - PR6224/..
  module_designation:
  description: >-
    Digital strain gauge weighbridge load cell. The load cells of the series PR6224/.. are compact compression
    load cells for self-centering pendulum applications. The strain gauge application is hermetically
    sealed; the deep-drawn and micro plasma welded housing is made of stainless steel and filled with
    inert gas. The analog signal of the strain gauge bridge is amplified, scaled and filtered by the integrated
    module. The load cell is equipped with an RS485 interface. The safe overload is listed in the data
    sheet of the manufacturer, page E-2.
