certified_type:
  category: Load cell
  type_designations:
  - DEBB-220
  - DEBB-300
  module_designation: Analog load cell
  description: >-
    A bending beam load cell with strain gauges. The load cell can be a single ended beam or a double
    ended beam; each end of the beam has its own cable. The characteristics are based on a single ended
    beam; the double ended beam should be considered as two separate load cells. The characteristics for
    n_max and Y can be reduced separately.
