  description: >-
    Columns 1-2 of the original table share n = 4000 and Y = 23000; the third column covers 150-750 kg
    with n = 3000 and Y = 52000. All other characteristics (minimum dead load 0 kg, accuracy class C,
    rated output 1.0 mV/V ± 0.15 mV/V, input impedance 1080 Ω ± 50 Ω, output impedance 1000 Ω ± 10 Ω,
    temperature range -10 °C / +40 °C, pLC 0.7, humidity class CH, safe overload 150 % of Emax, recommended
    excitation 5-12 V AC/DC, excitation maximum 18 V AC/DC, aluminium alloy transducer, silicone sealing)
    are common to all capacity ranges. The certificate notes that the characteristics for n_max and Y
    can be reduced separately, and that each produced load cell is provided with an accompanying document
    with information about its characteristics.
