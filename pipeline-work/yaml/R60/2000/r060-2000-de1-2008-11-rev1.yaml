certified_type:
  category: Load cell
  type_designations:
  - PR 6221
  module_designation:
  description: >-
    Strain gauge compression load cell for weighbridges. The load cells (LC) of the series PR6221 are
    compact compression load cells for self-centering pendulum applications. The strain gauge application
    is hermetically sealed; the deep-drawn and micro plasma welded housing is made of stainless steel
    and filled with inert gas.
