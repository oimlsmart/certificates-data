  category: Load cell
  type_designations:
  - CZL601
  description: >-
    Bending beam load cell with strain gauges. The characteristics for n_max and Y can be reduced separately;
    Z is proportional or equal to n_max. Each produced load cell is provided with an accompanying document
    with information about its characteristics. Complies additionally with the national requirements of
    the United States (NIST Handbook 44 and NCWM Publication 14) per R60 DoMC-01 rev.0 and R60 DoMC-02
    rev.0.
