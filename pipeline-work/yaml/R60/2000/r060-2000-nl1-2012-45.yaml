certified_type:
  category: Load cell
  type_designations:
  - PW29
  module_designation:
  description: >-
    Single point load cell with strain gauges, tested as a part of a weighing instrument. Nomenclature:
    PW16 XX YY / ZZ K — XX describes cable ends (e.g. XH = plug version) and thread versions (metric or
    inch); YY = accuracy class; ZZ = capacity. The characteristics for n_max and Y can be reduced separately;
    Z is proportional or equal to n_max. Each produced load cell is provided with an accompanying document
    with information about its characteristics.
