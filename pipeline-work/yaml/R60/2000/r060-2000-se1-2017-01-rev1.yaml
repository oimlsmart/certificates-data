certified_type:
  category: Load cell
  type_designations:
  - '0120'
  module_designation: Digital load cell
  description: >-
    The load cell type "0120 with three-point-support" is a digital compression load cell, which can be
    integrated into twistlock applications used in spreaders or headblocks of container handling cranes.
    The ring-shaped load cell is designed for weighing of containers, but other weighing applications
    such as measurements in the rope end point or screw force measurements and other mounting positions
    are possible as well. A compression load cell, equipped with electronics.
