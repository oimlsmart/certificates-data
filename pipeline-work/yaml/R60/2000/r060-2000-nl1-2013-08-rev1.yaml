  - WBK-D
  module_designation:
  description: >-
    Compression load cell with strain gauges, equipped with electronics. Can only be used in combination
    with an indicator which does not allow adjustment of the adjustment data of the load cell using any
    interface. The connecting cable of the load cell or the junction box is provided with possibility
    to seal. Each load cell produced is provided with an accompanying document with information about
    its characteristics.
