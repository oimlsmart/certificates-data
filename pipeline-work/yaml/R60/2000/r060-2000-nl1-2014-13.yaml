  description: >-
    PA08R is certified in two capacity ranges (10 kg up to 50 kg, and 50 kg up to and including 100 kg)
    with different Y and Z ratios. Type-level rows common to all variants: minimum dead load 0 kg, accuracy
    class C, rated output 2.0 mV/V ± 0.2 mV/V, input impedance 406 Ω ± 15 Ω, temperature range -10 °C
    / +40 °C, pLC 0.7, humidity class CH, safe overload 150 % of Emax, output impedance 350 Ω ± 3 Ω, recommended
    excitation 10 V AC/DC, excitation maximum 15 V AC/DC, transducer material aluminium, atmospheric protection
    silicon rubber. The characteristics for n_max and Y can be reduced separately; Z is proportional or
    equal to n_max.
