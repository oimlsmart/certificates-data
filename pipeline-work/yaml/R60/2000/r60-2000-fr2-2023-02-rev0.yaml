- marker: 1)
  text: >-
    The characteristics for nmax, Y and Z can be reduced separately. Values of Y and Z cannot be less
    than nmax.
- marker: 2)
  text: >-
    The load cell is provided with a 4 or 6 wires system. In the 4-wire system, without remote sensing,
    the cable length is 1 m or corresponds to the length indicated on the load cell data plate (additional
    marking). The cable is shielded.
