  module_designation:
  description: >-
    HSB (stainless steel) and HAB (alloy steel) strain gauge load cells. Load cell types HSB and HAB can
    have other maximum capacities from 300 kg to 10000 kg, always respecting their metrological and constructive
    characteristics, according to OIML R60 (2000).
