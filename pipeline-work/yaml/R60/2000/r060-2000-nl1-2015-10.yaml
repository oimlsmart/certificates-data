certified_type:
  category: Load cell
  type_designations:
  - NA...
  - NA... M
  description: >-
    Single point load cell, with strain gauges. The characteristics for nmax and Y can be reduced separately;
    Z is proportional or equal to nmax. Each produced load cell is provided with an accompanying document
    with information about its characteristics. Except for the capacity range 20 kg up to and including
    100 kg, the type has been found to comply with the additional national requirements established by
    the United States of America (NIST Handbook 44 and NCWM Publication 14), included in the MAA Declaration
    of Mutual Confidence: R 60 DoMC-01 rev.0 and R 60 DoMC-02 rev.0.
