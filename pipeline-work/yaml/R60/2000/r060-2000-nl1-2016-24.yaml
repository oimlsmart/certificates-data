  description: >-
    The certificate covers four model groups (table columns) distinguished by maximum capacity range and
    rated output. Constant across all groups: minimum dead load 0 kg, accuracy class C, input impedance
    400 Ω ± 50 Ω, output impedance 350 Ω ± 5 Ω, temperature range -10 °C / +40 °C, apportionment factor
    pLC = 0.7, humidity class CH, safe overload 150 % of Emax, recommended excitation 10 V and maximum
    excitation 15 V AC/DC, transducer material alloy steel or stainless steel, atmospheric protection
    stainless steel cover. The characteristics for n_max and Y can be reduced separately. Each produced
    load cell is provided with an accompanying document with information about its characteristics.
