matrix_tables:
- name: Number of load cell intervals with Y and Z ratios
  columns:
  - max_load_cell_intervals_n
  - ratio_y_emax_over_vmin
  - ratio_z_emax_over_2dr_emax_3_to_75_kg
  - ratio_z_emax_over_2dr_emax_100_to_250_kg
  rows:
  - max_load_cell_intervals_n: 1000
    ratio_y_emax_over_vmin: 3333
    ratio_z_emax_over_2dr_emax_3_to_75_kg: 1200
    ratio_z_emax_over_2dr_emax_100_to_250_kg: 24000
  - max_load_cell_intervals_n: 2000
    ratio_y_emax_over_vmin: 6666
    ratio_z_emax_over_2dr_emax_3_to_75_kg: 2400
    ratio_z_emax_over_2dr_emax_100_to_250_kg: 24000
  - max_load_cell_intervals_n: 3000
    ratio_y_emax_over_vmin: 15000
    ratio_z_emax_over_2dr_emax_3_to_75_kg: 3600
    ratio_z_emax_over_2dr_emax_100_to_250_kg: 24000
  - max_load_cell_intervals_n: 4000
    ratio_y_emax_over_vmin: 15000
    ratio_z_emax_over_2dr_emax_3_to_75_kg: 4800
    ratio_z_emax_over_2dr_emax_100_to_250_kg: 24000
  - max_load_cell_intervals_n: 5000
    ratio_y_emax_over_vmin: 15000
    ratio_z_emax_over_2dr_emax_3_to_75_kg: 5200
    ratio_z_emax_over_2dr_emax_100_to_250_kg: 24000
  - max_load_cell_intervals_n: 6000
    ratio_y_emax_over_vmin: 20000
    ratio_z_emax_over_2dr_emax_3_to_75_kg: 6200
    ratio_z_emax_over_2dr_emax_100_to_250_kg: 24000
  description: >-
    Y = Emax / Vmin (ratio of minimum LC verification interval); Z = Emax / (2 * DR) (ratio of minimum
    dead load output return). The 5000 and 6000 interval values are marked * and apply only to the Symmetric
    and Symmetric HF range.
  footnotes:
  - "* only for the Symmetric and Symmetric HF range"
