certified_type:
  category: Load cell
  type_designations:
  - RTN
  module_designation:
  description: >-
    The HBM compression strain gauge load cell type RTN is made of stainless steel, the strain gauge application
    is encapsulated hermetically by welding and a glass feed-through. The load cell is provided with a
    shielded 4 or 6 conductor cable. The cable length is indicated in the accompanying document. The shield
    will be connected or not connected to the load cell according to customers preference.
