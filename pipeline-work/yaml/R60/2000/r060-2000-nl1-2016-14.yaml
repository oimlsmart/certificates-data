  description: >-
    The certificate covers two capacity ranges of the SLC820 load cell family. All other characteristics
    (accuracy class C, temperature range -10 °C/+40 °C, pLC = 0.8, humidity class CH, safe overload 200
    % of Emax, excitation, materials, atmospheric protection) apply to both ranges. The characteristics
    for n_max and Y can be reduced separately. Each produced load cell is provided with an accompanying
    document with information about its characteristics.
