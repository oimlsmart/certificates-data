certified_type:
  category: Load cell
  type_designations:
  - C16
  module_designation: Analog load cell
  description: >-
    Strain-gauge compression load cell for self centering pendulum application. Load cells of the type
    C16 are compression load cells for self centering pendulum applications. Using the fitting elements
    of the manufacturer, the load cell is fixed against rotation. The one column load cell body and the
    housing are made of stainless steel. The strain-gauge application is hermetically sealed. The option
    MR is indicated on the nameplate.
