  description: >-
    Characteristics constant across all capacity ranges: minimum dead load 0 kg; accuracy class C; temperature
    range -10 °C / +40 °C; fraction pLC 0.8; humidity class SH; safe overload 150% of Emax; recommended
    excitation 5 V DC; excitation maximum 5.25 V DC; transducer material aluminium; atmospheric protection
    silicon rubber; software identification as described in TC8039; data transmission: interface and data
    protocol MT-SCIS Level 0_1, filtering adaptive, sample frequency 366.21 Hz. The characteristics for
    n_max and Y can be reduced separately. Z is proportional or equal to n_max. Each produced load cell
    is provided with an accompanying document with information about its characteristics.
  footnotes: []
