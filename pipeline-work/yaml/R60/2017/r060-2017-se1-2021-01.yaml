certified_type:
  category: Load cell
  type_designations:
  - KIS-11
  module_designation: Analog load cell
  description: >-
    KIS-11 is an analog-passive shear beam load cell supported at one end with the load applied at the
    other end. KIS-11 has strain gauges that measure the strain arising from the shear forces caused by
    the load. KIS-11 has a sleeve, which makes it possible to apply the load directly over the strain
    gauges, eliminating disturbing effects from bending forces. The strain gauges are placed in an I-beam
    section and are oriented for optimal measurement of the shear force. The load cell is provided with
    a shielded cable; the shield is not connected to the load cell body. The cable has four wires plus
    shield, with the ground open at the load cell end. Wiring: RED/GREEN +Excitation, BLACK -Excitation,
    GREEN/WHITE +Signal, WHITE/RED -Signal. Markings contain the cell type, manufacturer name, serial
    number, and Emax.
