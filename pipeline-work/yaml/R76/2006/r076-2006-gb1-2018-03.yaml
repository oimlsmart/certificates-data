  - SPO1
  module_designation: Not applicable
  description: >-
    The Sartorius PMA is a family of self-indicating, single-interval, non-automatic weighing instruments
    designed to be used in paint mixing applications. The family comprises the PMA-EV (Class II) and the
    PMA-HD (Class III) types, each comprising several models. The instrument shall not be used for direct
    sales to the public. Construction: plastic construction, stainless steel load receptor, plastic display
    head, 3 feet (2 adjustable), level indicator, LCD segment display with fixed position touch keys (EVO1,
    LAB1, SPO1), LCD graphic display with touch function (VIS1), EX-link converter for voltage supply
    and data transfer (X and Y models except EVO1Y). Devices: initial zero setting device (max 20% of
    Max), zero tracking device (max 4% of Max), zero indicator (PMA-HD only), combined zero-setting and
    tare-balancing device, preset tare device (only via a PC), approximate displaying device (PMA-EV only),
    weight accumulation, weight calculating. A PC with compatible paint mixing software can be connected
    via the interfaces provided; all devices can be initiated via a PC, preset tare can only be introduced
    via a PC. Interfaces: USB either directly (S models and EVO1Y) or via Ex-link converter (EVO1X and
    LAB1X); Ethernet via Ex-link converter (VIS1X and VIS1Y models). Power supply: 5 V DC provided by
    USB; for X and Y models except EVO1Y, power is delivered from USB to the Ex-link converter and then
    to the instrument via RJ-45. Software: permitted versions are weighing instrument software BAC (ID
    05496, or 1578 for VIS models, version 00-56-02.xx) and software application APC (only VIS models,
    ID 6587, version 01-72-03.xx), where xx reflects legally non-relevant changes. Sealing: access to
    the electronics and load cell is prevented by two tamper-evident labels on the underside of the instrument;
    access to the Menu access switch is prevented by a tamper-evident label covering the switch.
