certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL3500 Series
  - CL3500-B
  - CL3500-P
  - CL5200 Series
  - CL5200-B
  - CL5200-P
  module_designation: Not applicable
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Plastic construction with operator's
    keypad, stainless steel load receptor, level indicator and integrated printer; front and rear LCD
    displays (CL3500-B) or pole-mounted double-sided LCD displays (CL3500-P). Devices: initial zero setting
    device, semi-automatic zero setting device, zero tracking device, zero indicator, net indicator, stable
    weight indicator, semi-automatic subtractive tare balancing device, preset tare, gravity compensation,
    price-computing, totalisation (including non-weighed items), PLU, fixed weight labelling, multi-vendor
    operation, calibration/set-up mode via sealed internal switch, self-service operation. Interfaces:
    RS232C, PS/2, cash drawer, Ethernet, wireless LAN, USB, CAS Wi-Fi Module model RS9110-N-11-22. The
    instruments may alternatively be designated the CL5200 series (CL5200-B, CL5200-P).
