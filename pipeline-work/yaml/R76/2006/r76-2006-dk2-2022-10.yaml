certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DB-500
  module_designation: Non-automatic weighing instrument
  description: >-
    Non-automatic weighing instrument equipped with initial zero setting device (≤ 20% of Max), semi-automatic
    zero setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), semi-automatic subtractive
    tare weighing device, preset tare, label printing, stable equilibrium, zero and net indicators, PLU
    tables and totalization. Interfaces: RS232C, cash drawer, Ethernet, wireless LAN, USB (interfaces
    do not have to be secured). Approved software version 1 BJ_1.0.1.2f, displayed at power up.
