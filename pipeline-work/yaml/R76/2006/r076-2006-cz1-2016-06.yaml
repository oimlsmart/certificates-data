  - XA xxx.4Y.yy
  - MYA xxx.4Y.yy
  module_designation:
  description: >-
    Non-automatic weighing instrument based on electromagnetic compensation, with steel/aluminum cover,
    stainless steel/aluminum plate, weighing chamber, automatic span adjustment with internal calibration
    mass and graphic display (touch screen display version). Type designations XA xxx.4Y.yy and MYA xxx.4Y.yy,
    where xxx means Max (g) and yy means special purpose of balance, e.g. version for weighing filter
    (.F), pipettes (.P), version with automatically opening doors (.A).
