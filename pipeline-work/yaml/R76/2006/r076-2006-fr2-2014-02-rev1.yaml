certified_type:
  category: Digital transmitter
  type_designations:
  - X1104-TR
  module_designation: Digital data processing module
  description: >-
    Separate module intended to be integrated in a non-automatic weighing instrument. It is intended to
    be connected on one end to 2, 3 or 4 analogue and/or digital data processing units that have an OIML-MAA-R76
    certificate, and on the other end to a compatible terminal that has an OIML-MAA-R76 certificate. The
    module X1104-TR is never directly connected to a load cell. It manages a weighing channel by summing
    values provided by the connected weighing channels. It performs processing and control of the summation,
    and digital transmission of the processed summation to the connected terminal. When associated with
    a terminal, it memorises the reference and the metrological characteristics of the complete weighing
    instrument in which it is integrated.
