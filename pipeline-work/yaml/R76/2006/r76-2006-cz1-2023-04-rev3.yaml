certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - C32.xxx.PM.yyy
  - 5Y.xxx.PM.yyy
  - C32.10.PM
  - C32.50.PM
  - C32.100.PM
  - C32.150.PM
  - C32.6/35.PM
  - 5Y.10.PM
  - 5Y.50.PM
