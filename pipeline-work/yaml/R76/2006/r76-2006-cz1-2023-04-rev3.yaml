  - 5Y.150.PM
  - 5Y.6/35.PM
  module_designation: Not applicable
  description: >-
    Electronic non-automatic weighing instruments (balances) of the C32.PM and 5Y.PM families. Devices:
    zero indicator, stability indicator, internal adjustment, service menu via switch on the main board,
    initial zero-setting, zero-tracking, semi-automatic zero setting device, subtractive tare device,
    semi-automatic and automatic tare device, tare-weighing device, preset tare device, Data Storage Device
    (Alibi memory), weighing in carat units. Instruments are equipped with a level indicator with a sensitivity
    of at least 2 mm for a tilt of 2/1000. Alibi memory: C32.PM balances save weighing results in internal
    flash memory (up to 500 000 records, archivable via USB); 5Y.PM balances use a Linux-based closed-shell
    memory module. C32.6/35.PM and 5Y.6/35.PM are dual-range models; slash-separated characteristic values
    (e.g. 6/35 kg) denote the two ranges.
