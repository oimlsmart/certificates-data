certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - LI-700E
  - HC5600
  module_designation: Not applicable
  description: >-
    Pattern of a non-automatic weighing instrument designated LI-700E, operating as a weight or weight/price
    labeller; self-indicating and price-computing weighing machine with associated thermal label printer.
    Stainless steel frame; scale conveyor with optional in-feed and out-feed conveyors (any number); labeller;
    control cabinet located behind the conveyors comprising a combined PC and LCD display (Aplex Technology
    AHM-6127A or ARCHMI-812(P)), Teraoka TPB-03484 A/D converter, TDK Lambda LS75 power supply unit and
    Pico UPS-100 UPS backup. Devices: initial zero-setting device (max 4% of Max), semi-automatic zero-setting
    device (max 4% of Max), zero-tracking device, preset tare device, semi-automatic subtractive tare
    weighing device, zero indication; calibration not accessible to user; price computation; PLUs. Interfaces:
    Ethernet, USB. Legally relevant software DPS700.dll (v2.xx.xx.xxxx, displayed at power-up); alternatively
    World View software (direct sales to the public); DLLs HeaderDisplay.dll v1.0.0.10 and DPS710.dll
    v1.0.0.29. The HC5600 is identical in construction to the LI-700E and uses the Tesco Counter application
    software (version 3.2.1, checksum-verified modules DPS700.dll and Secure.Scale.Module/dll) for checkweighing
    operation.
