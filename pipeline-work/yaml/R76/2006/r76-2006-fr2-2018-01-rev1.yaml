certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - P1401-A
  module_designation: Not applicable
  description: >-
    Electronic non-automatic weighing instrument with digital indication and two weighing ranges. Composed
    of: analog data processing unit X1309-TR, PRECIA terminal X1301 mounted on the load receptor, HBM
    SP4 analog load cell, weighing-pan type load receptor with pan holder mounted directly on the load
    cell (max 350 x 350 mm), optional secondary displays (X1301 fixed with keys deactivated or remote
    X292) and optional printer. Load cell connection sealed with self-destructive sticker; analog data
    processing unit sealed; additional software sealing via an event counter recorded on a self-destructible
    label.
