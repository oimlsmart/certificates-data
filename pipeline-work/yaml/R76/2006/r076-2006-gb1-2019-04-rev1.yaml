  module_designation:
  description: >-
    Family of Class III, mains-powered, self-indicating, price-computing, single-interval, barcode printing
    and scanning, non-automatic weighing instruments designed for direct sales to the public. Main features:
    plastic construction; operator keypad; stainless steel load receptor; front and rear LCD displays
    or pole-mounted double-sided LCD display; level indicator under the load receptor; integrated printer.
    Devices include initial/automatic/semi-automatic zero setting, zero tracking, zero/net/stable weight
    indicators, semi-automatic subtractive tare, preset tare, gravity compensation, price-computing (weighed
    and non-weighed items), hold function, check weighing, piece counting, totalisation, PLU, fixed weight
    labelling, price labelling, multi-vendor operation, barcode printing and scanning, discounts, and
    additional management functions. Interfaces: USB, RS232, RJ11 (cash drawer), RJ45 (Ethernet), WiFi.
    The instruments may alternatively be manufactured by Qidong Youming Weighing Apparatus Co., Ltd; alternative
    instrument models may operate on an 18 to 21 V DC external main adaptor, be configured with a pole-mounted
    double-sided LCD dot-matrix display (TM-xA3 to TM-xA5), or have the load receptor mounting embedded
    inside the enclosure (TM-xB series).
