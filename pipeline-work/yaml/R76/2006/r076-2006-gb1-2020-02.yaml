certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - W23
  - C01
  - C02
  - C03
  description: >-
    The W23 and C Series comprises the weighing module (A/D board) of a BPS indicator and a main PCB connected
    to a range of load cells to form a family of Class III, I/O line powered or battery-operated, self-indicating,
    dual-interval, non-automatic weighing instruments. The instrument is intended to be used for direct
    sales to the public when connected to a Point of Sale device.
