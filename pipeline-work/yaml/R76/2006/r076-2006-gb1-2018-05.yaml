certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - WM-AI
  - IP-AI
  module_designation: Not applicable
  description: >-
    The WM-AI model is a Class III, self-indicating, dual-interval, non-automatic weighing instrument
    with wrapping and label printing devices. The IP-AI model is a weigh-price labelling instrument with
    similar characteristics and operation, but without the wrapping function. The instruments are not
    designed for direct sales to the public. Main features: weighing module mounted in the in-feed conveyor
    section within a framework of fabricated stainless steel; load cell mounted in an enclosed housing
    and supporting the weighing module; user display and control interface comprising LCD touch screen
    display and keyboard; thermal label printers/applicators (maximum three printers); wrapping device
    (WM-AI only, maximum two film rolls). Devices: initial zero setting device (≤ 20% of Max), semi-automatic
    zero setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), zero indicator, net indicator,
    semi-automatic subtractive tare weighing device, preset tare device, gravity compensation, price-computing,
    PLUs, wrapping (WM-AI) and labelling (WM-AI and IP-AI) devices. Interfaces: Ethernet, USB. Sealing:
    access to the load cell, electronics and calibration switch is prevented by a tamper-evident seal.
    Permitted alternatives include an in-feed conveyor on the WM-AI, an additional under pack label printer/applicator
    in the out-feed conveyor, an externally mounted printer on the WM-AI (label applied manually), an
    additional label printer on the IP-AI, and a modified IP-AI connected to a weighing platform type
    S (see platform characteristics). A further variant uses a main board with an Intel Atom processor
    E3800 product family (E38xx models).
