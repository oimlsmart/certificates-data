        Semi-automatic zero-setting; Initial zero-setting; Zero-tracking (not mandatory); Semi-automatic
        subtractive tare weighing; Preset tare; Adjustment / gravity set-up mode via a switch on the A/D
        board; Checking the display; Price calculation; Level indicator and adjustable feet used for levelling;
        Indications other than primary indications; Price labelling instrument; PLU function
      unit_symbol:
