certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - UNI-9 B
  - UNI-9 P
  - UNI-9 BP
  - UNI-9 SS
  - UNI-9 H
  - UNI-9 XL
  - UNI-9 EV
  module_designation:
  description: >-
    A graduated, self-indicating, electronic, single or multi-interval non-automatic weighing instrument.
    UNI-9 is a single or multi-interval non-automatic weighing and price-computing instrument with label/receipt
    printer. It is approved for direct sales to the public or for price labelling. The base has four levelling
    feet and a level indicator situated at the top. Accuracy class III, number of verification scale intervals
    n ≤ 3000.
