certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MV3™ Bariatric hospital beds 5900 series
  - MV3 5900
  module_designation: Not applicable
  description: >-
    Hospital beds incorporating a Class IIII, mains and/or battery operated, self-indicating, non-automatic
    weighing instrument. Height and surface contours of the bed are adjustable; the bed includes movable
    and latchable siderails, adjustable litter deck width, and control boards. Weighing control and display
    functions are on the footboard, with a separate control panel and display. Four load cells installed
    at the four corner positions of the bed base. Adjustable litter deck width (91.44 cm, 106.68 cm and
    121.92 cm, corresponding to 36", 42" and 48"). Gravity compensation is set by selecting the appropriate
    region of operation in the maintenance menu. The hospital bed shall not be used for direct sales to
    the public. Combined semi-automatic zero setting device and semi-automatic tare balancing device;
    zero enunciator; "weight history" and "change equipment" functions.
