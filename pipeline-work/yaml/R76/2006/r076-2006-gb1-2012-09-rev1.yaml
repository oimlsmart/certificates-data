certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - LI-700E
  - HC5600
  module_designation:
  description: >-
    Non-automatic weighing instrument designated LI-700E operating as a weight or weight/price labeller;
    a self-indicating and price-computing weighing machine with associated thermal label printer. Stainless
    steel frame; scale conveyor with optional in-feed and out-feed conveyors (any number); labeller; control
    cabinet located behind the conveyors containing an Aplex Technology AHM-6127A combined PC and LCD
    display, a Teraoka TPB-03484 A/D converter, a TDK Lambda LS75 power supply unit and a Pico UPS-100
    UPS backup. Devices: initial zero-setting device (up to 4% of Max), semi-automatic zero-setting device
    (up to 4% of Max), zero-tracking device, preset tare device, semi-automatic subtractive tare device,
    zero indication; calibration not accessible to user; price computation and PLUs. Interfaces: Ethernet,
    USB. The HC5600 is identical in construction to the LI-700E and uses the Tesco Counter application
    software (version 3.2.1) with the DPS700.dll module to perform checkweighing; its metrological characteristics
    are Max = 3000 g, Min = 40 g, e = 2 g.
