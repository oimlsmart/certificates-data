certified_type:
  category: Indicator
  type_designations:
  - D-Legal
  module_designation: Non-automatic digital weighing indicator
  description: >-
    The D-Legal digital indicator consists of a D-Legal program running on a Windows PC. When the D-Legal
    program is started a window appears in the most upper part of the screen showing the weight; this
    window cannot be closed and a double click starts the standard digital indicator window. D-Legal is
    intended for use with a Dini Argeo weight transmitter, connected to the PC via USB, ethernet, serial
    port or wireless; the connecting cable or wireless connection is with an electronic board that secures
    the pairing of the weight transmitter and the D-Legal software via a special Dini Argeo protocol.
    The D-Legal software can only be activated on a PC by the manufacturer using a special software key
    that pairs the weight transmitter and the D-Legal software permanently and uniquely. D-Legal can alternatively
    be configured as a secondary display for a Dini Argeo indicator, in which configuration the zero and
    tare keys are disabled.
