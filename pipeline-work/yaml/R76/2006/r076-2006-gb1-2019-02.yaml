certified_type:
  category: Indicator
  type_designations:
  - ZK840
  module_designation:
  description: >-
    The indicating device is designated the Avery Weigh-Tronix ZK840. The indicator is self-indicating,
    mains, DC or battery-powered, and is designed to be used as part of a Class III, Non-automatic Weighing
    Instrument. The load receptor(s) may be BSQ digital bases and/or conventional platforms fitted with
    load cells. Construction: plastic (ABS) enclosure, mountable to a BSQ base or alternatively desk/wall
    mounted using an optional bracket; ISTN LCD display capable of positive and negative images; 6 operational
    keys plus touchscreen soft keys. Devices include: single or multi-range (maximum of 3 partial ranges),
    semi-automatic zero setting, zero tracking, semi-automatic subtractive tare weighing, pre-set tare,
    recall of gross indication when tare is active, determination and indication of stability of equilibrium,
    checking of display, printing, gravity compensation, real time clock, command via external device
    (PC), counting, accumulation, checkweighing, target weighing, percentage weighing, grading, pick lists,
    kitting, density formulation, % recipe, gross/net/tare/preset tare/print/zero/motion/over-under weight/%PCWT/battery
    indicators, connection to additional load receptors with identification of active load receptor(s),
    PLUs, piece weight selection, extended indicating. Interfaces: BSQ digital base interface, 3 x logic
    level inputs, 3 x open collector outputs, 2 x RS232 serial ports, 10/100 Ethernet, USB Device, USB
    Host. Sealing: calibration and legally relevant parameters protected via physical (sealed jumper on
    main board) or software means (password and incrementing counters); access to electronics, jumper
    and load cell connections prevented via tamper-evident seals or wire seals.
