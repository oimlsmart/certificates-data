certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - PW 134
  module_designation: Not applicable
  description: >-
    PW 134 is a portable weighing instrument designed for determining the weight of wheels, axles, and
    the total weight (gross vehicle weight) of road vehicles. The weighing instrument operates in non-automatic
    mode with a single weighing range. It consists of weighing platforms (load receptors with integrated
    strain gauge load cells), levelling pads, and an indication unit with legally relevant software (WSERVER,
    WTERMINAL, Firmware PSU). Platforms communicate with the indication unit via RS-485 cable or Bluetooth;
    the indication unit communicates with external clients via Ethernet or Wi-Fi.
