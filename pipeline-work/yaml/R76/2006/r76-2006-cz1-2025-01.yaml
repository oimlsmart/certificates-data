components:
- role: Weighing platform (load receptor with integrated load cells)
  type_designations:
  - T05
  - T10
  - T15
  - T20
  alternatives:
  characteristics:
    construction: >-
      Sandwich structure: base plate with strain gauge load cells and bottom cover plate with load sensor
      supports
    integrated_modules:
    - PSU module (Platform Scale Unit) with integrated A/D, temperature sensor and platform tilt sensor
    securing: CAL calibration switch secured with self-adhesive verification mark
- role: Data acquisition module — Platform Scales Unit
  type_designations:
  - PSU
  alternatives:
  characteristics:
    location: Weighing platform
    legally_relevant_software: Firmware PSU
    function: Data acquisition module from load, temperature and tilt sensors
- role: Communication and battery management module — Communication Battery Unit
  type_designations:
  - CBU
  alternatives:
  characteristics:
    location: Communication unit / Indication unit
    function: Battery charging and wireless communication module
- role: Indication unit (indicator with display and keyboard)
  type_designations:
  - Indication unit
  alternatives: OR
  characteristics:
    legally_relevant_software:
    - WSERVER
    - WTERMINAL
    communication_with_platforms: RS-485 cable or Bluetooth
    communication_with_external_clients: Ethernet or Wi-Fi
    power_source: Rechargeable battery
- role: Communication unit for wireless data transmission
  type_designations:
  - Communication unit
  alternatives: OR
  characteristics:
    communication_with_platforms: RS-485 cable or Bluetooth
    communication_with_external_clients:
    power_source: Rechargeable battery
