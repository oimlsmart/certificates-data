  category: Indicator
  type_designations:
  - IND360
  module_designation:
  description: >-
    Indicator / terminal IND360. Configurations: (a) digital load cells or weighing modules via CANbus
    interface; (b) digital load cells or weighing modules via SICSPro interface; (c) analog load cells;
    (d) analog load cells with optional ISB (intrinsic safety barrier). Mainboard software versions are
    1.xx.yyyy, where xx (00-99) represents major updates and yyyy (0000-9999) represents minor updates
    of the legally non relevant part of the software.
