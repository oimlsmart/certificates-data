  category: Non-automatic weighing instrument
  type_designations:
  - ICS4X9…
  - ICS689…
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instrument consisting of indicator type ICS4...(x) or ICS6... combined with
    analog load cells type 0785, 0795, 0805 or SLP84x, or digital load cell type SLP84xD. Compatibility
    of load cells and indicator is established by the manufacturer by means of the compatibility of modules
    form, contained in EN 45501:2015 clause F.4 or clause F.5, at the time of putting into use.
