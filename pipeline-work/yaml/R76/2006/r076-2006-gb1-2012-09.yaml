certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - LI-700E
  module_designation:
  description: >-
    Non-automatic weighing instrument designated the LI-700E, operating as a weight or weight/price labeller.
    Comprises a self-indicating and price-computing weighing machine with associated thermal label printer.
    Stainless steel frame; scale conveyor with optional in-feed and out-feed conveyors (any number); labeller;
    control cabinet located behind the conveyors. Devices: initial zero-setting device, semi-automatic
    zero-setting device, zero-tracking device, preset tare device, semi-automatic (subtractive) tare device,
    zero indication; calibration not accessible to user; price computation; PLUs. Interfaces: Ethernet,
    USB.
