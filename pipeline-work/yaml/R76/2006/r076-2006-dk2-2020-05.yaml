certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Si10S CS
  - Si30S CS
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    Family of hanging crane scales (Si10S CS and Si30S CS series; variants -S, -M and -L) with built-in
    EWI analog data processing module. Software version displayed at power-up: terminal A1.xxxx, EWI analog
    data processing module E1.xxxx (xxxx = non-legal software parts). Load cell shall have an OIML certificate
    of conformity according to OIML R60:2017 or OIML R60:2000 and shall fulfil the requirements of OIML
    R76-1:2006 Annex F. Devices: initial zero setting (≤ 20% of Max), semi-automatic zero setting (≤ 4%
    of Max), zero tracking (≤ 4% of Max), semi-automatic subtractive tare balancing, preset tare, automatic
    tare, totalization (optional), price-computing (optional, only Si30S CS), weighing of unstable samples
    (optional), extended resolution (optional for non price-computing scales), determination of stability
    of equilibrium, gravity compensation device, real time clock, printing device, alibi memory (optional),
    stable equilibrium/zero/net indicators, built-in printer (optional). Interfaces: RS232, RS485, Bluetooth,
    WiFi, USB, Ethernet, relay output module (optional), analog output module 0-20 mA / 4-20 mA / 0-10
    V DC (optional). Sealing by lead seal or self-destructive label (variants CS-S, CS-M, CS-L).
