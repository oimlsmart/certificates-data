certified_type:
  category: Indicator
  type_designations:
  - PUE 7.1
  module_designation: Indicator for non-automatic weighing instruments
  description: >-
    Electronic indicator for non-automatic weighing instruments of accuracy class III. Maximum number
    of verification scale intervals n ≤ 6000. Can be used for multi range weighing instruments and as
    a terminal according to point T.2.2 of OIML R76 (2006), with external weighing modules connected via
    a digital interface. Plastic housing with 5.7" colour TFT display with resistive touch panel. Optional
    memory module (Alibi memory) on micro SD flash card according to WELMEC 2. 5. Valid embedded software
    versions: 2.0.0 (with closed shell 171001 standard or 1.2.2 P interactive terminal, Windows Embedded
    Compact 7) and 3.0.0 P (with closed shell 191001 standard or 2.0.0 P interactive terminal, Linux).
