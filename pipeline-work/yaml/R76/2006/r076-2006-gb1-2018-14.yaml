certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL5200N Series
  - CL5200N-B
  - CL5200N-P
  module_designation: Not applicable
  description: >-
    Family of instruments designated the CL5200N Series, comprising the CL5200N-B and CL5200N-P models.
    Class III, mains-powered, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Plastic construction; operator's keypad;
    stainless steel load receptor; front and rear LCD displays (CL5200N-B); pole-mounted double-sided
    LCD display (CL5200N-P); level indicator under the load receptor; integrated printer. Devices include
    initial/automatic/semi-automatic zero-setting and zero-tracking devices, zero indicator, net indicator,
    stable weight indicator, semi-automatic subtractive tare weighing device, preset tare, gravity compensation,
    price-computing, totalisation (including non-weighed items), PLU, fixed weight labelling, multi-vendor
    operation, calibration/set-up mode via sealed internal switch, and self-service operation.
