certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - EL Series
  description: >-
    Family of Class III, mains-powered, self-indicating, price-computing, single-interval, barcode printing
    and scanning, non-automatic weighing instruments designed for direct sales to the public. Plastic
    construction; operator's keypad; stainless steel load receptor; front and rear LCD displays or pole-mounted
    double-sided LCD display; level indicator under the load receptor; integrated printer. Interfaces:
    USB, RS232, RJ11 (cash drawer), RJ45 (Ethernet), WiFi. Devices include initial/automatic/semi-automatic
    zero setting devices, zero tracking device, zero/net/stable weight indicators, semi-automatic subtractive
    tare weighing device, preset tare, gravity compensation, price computing (weighed and non-weighed
    items), hold function, check weighing, piece counting, totalisation, PLU, fixed weight labelling,
    price labelling, multi-vendor operation, calibration/set-up mode via sealed internal switch, printing,
    barcode printing and scanning, manual or percentage discount, and additional management functions.
    Named TM series in the evaluation report.
