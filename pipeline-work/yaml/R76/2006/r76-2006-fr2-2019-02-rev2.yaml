certified_type:
  category: Indicator
  type_designations:
  - X112-B
  module_designation: Separate module
  description: >-
    Indicator type X112-B, presented as a separate module intended to be integrated in a non-automatic
    weighing instrument. Metallic enclosure available as table-top, cabinet back panel or front-of-housing
    versions. Intended either to be connected to a weighing channel consisting of strain-gauge load cells
    with analogue output via a 6-wire shielded cable, or to be connected to X1409-C digital sensors via
    the PSnet interface, managing 5 independent and 4 combined measurement channels.
