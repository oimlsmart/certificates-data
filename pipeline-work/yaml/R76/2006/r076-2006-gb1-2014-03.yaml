certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - FJ3-XXX
  - GJW-XXXX
  - HJW-XXX
  - HJP-XXX
  module_designation:
  description: >-
    These weighing instruments are designated the FJ3, GJW, HJW or HJP Hanging Scales. There are designed
    to be used as a Class III Non-Automatic Weighing Instrument. The Hanging Scales are self-indicating,
    mains or battery-powered, and can operate as a single or multi range (HJP and HJW) weighing instrument.
    The indicator consists of an analogue to digital conversion circuitry, microprocessor control circuitry,
    power supply, functional keypad, non-volatile memory for storage of calibration and setup data, and
    a weight display contained within a single enclosure. Devices: initial zero setting, semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare weighing, determination of stability
    of equilibrium, preset tare, accumulation, high-resolution mode (5 sec maximum), unit switch (kg,
    t), gross/net/motion/accumulation/preset tare/weighing range indicators, remote operator keypad, hold
    function. There are no peripheral devices.
