certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - ACS-823
  description: >-
    Class III, mains-powered or battery operated, self-indicating, price-computing, single-interval, non-automatic
    weighing instrument. May be used for direct sales to the public. Plastic construction, operator's
    keypad, stainless steel load receptor, integral front and rear LCD/LED displays, LCD/LED enunciators,
    level indicator under the load receptor, adjustable feet. Devices: initial zero setting, automatic
    zero setting, semi-automatic zero setting, zero tracking, zero indicator, net indicator, semi-automatic
    subtractive tare balancing device, price-computing (weighed items only), PLUs. No accessible interfaces.
    Software identification U1.x.x; access to legally relevant parameters via calibration switch or jumper
    J2 on the main board, prevented by sealing the enclosure.
