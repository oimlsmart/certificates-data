  - JPL-30K
  module_designation:
  description: >-
    Class III, mains or battery-operated, self-indicating, price-computing, single-interval, non-automatic
    weighing instrument. Main features: plastic construction, operator's keypad, plastic load receptor,
    front face LCD display, optional rear face LCD display (standard and pole-mounted models), additional
    pole-mounted double-sided LCD display (pole-mounted model), level indicator. Devices: initial zero
    setting device, semi-automatic zero setting device, zero tracking device, zero indicator, net indicator,
    semi-automatic subtractive tare balancing device, gravity compensation, memory (totalisation of weighed
    items), totalisation (totalisation of non-weighed items). The instrument cannot be used as a self-service
    instrument. Interfaces: the instrument may have a number of RS232 ports.
