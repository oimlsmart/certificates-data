  module_designation:
  description: >-
    Non-automatic weighing instrument composed of an indicator (BM1000 series, BM1000P series, BM400 or
    BM500) and load cells (BM, ILE-SS, ILEC-SS, MC-CT, MLC 1A / MLC 1A MG, SB or UDA) covered by the referenced
    OIML certificates. Maximum capacity and verification scale interval depend on the load cell(s) used.
    The compatibility of load cells and indicator is established by the manufacturer by means of the compatibility
    of modules form, contained in OIML R 76 (2006) Annex F clause F.4, at the time of putting into use.
