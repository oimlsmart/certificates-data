  description: >-
    Characteristics of indicators BM400 or BM500 depending on whether analog load cells or digital load
    cells / weighing module are connected. Cells marked '-' in the source (not applicable) are null. Scale
    interval maxima apply as n ≤ value; the multi-interval maximum applies per partial weighing range.
    Shared for both configurations: climatic environment (temperature range 0 °C / +40 °C, humidity non-condensing,
    intended location closed), electromagnetic environment class E2, power supply 24 V DC supplied by
    230 V 50/60 Hz AC/DC plug-in power supply, software identification ETMETRO v1.0 with checksum 0xD619.
