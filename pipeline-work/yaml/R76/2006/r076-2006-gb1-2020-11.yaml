certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MP70X1
  - MP70X2
  module_designation:
  description: >-
    NCR Corporation MP70X1 & MP70X2 scanner scales: a family of self-indicating, weight only, single or
    dual-interval, non-automatic weighing instruments, suitable for direct sales to the public. Designed
    for flush-mounting in a checkout surface with frame extensions, steel framework supporting one load
    cell, barcode scanner and electronics, stainless steel load receptor, single or dual pole-mounted
    display, optional Produce Flip-Up Bar Platter and optional Customer Side Scanner (CSS). Designed for
    permanent installation, no level indicator required.
