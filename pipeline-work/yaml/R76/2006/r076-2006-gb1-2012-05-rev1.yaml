certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - ZQ375
  module_designation: Not applicable
  description: >-
    Family of self-indicating, mains or battery-powered Class III non-automatic weighing instruments designated
    ZQ375 Checkweigher, comprising the Torsion base (BSF/BSG) and Diamond base (BS) models; not designed
    for direct sales to the public. Main features: ZQ375 Indicating Device (fully described in R76/2006-GB1-12.04);
    BSF/BSG Torsion or BS Diamond base stainless steel load receptor; stainless steel column; optional
    ZQ-BAT battery box; optional ZQ-OPTO interface box (with or without beacon assembly).
