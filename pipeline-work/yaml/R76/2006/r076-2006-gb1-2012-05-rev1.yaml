  alternatives: OR
  characteristics:
    manufacturer: Vishay
    description: Stainless Steel Single Point Load cell, used in Torsion base BSG series
- role: load_cell
  type_designations:
  - FLS
  alternatives: OR
  characteristics:
    manufacturer: Avery Weigh-Tronix
    description: Stainless Steel Single Point load cell, used in Diamond base BS series
- role: load_cell
  type_designations:
  - any compatible load cell
  alternatives: OR
  characteristics:
    requirements: >-
      Must have an OIML R60 Certificate of Conformity containing the load cell types and data needed for
      the manufacturer's declaration of compatibility of modules; load cells marked NH allowed only if
      humidity-tested to R76; compatibility with indicator established via compatibility of modules calculation;
      transmission must conform to a standard type
- role: optional_accessory
  type_designations:
  - ZQ-BAT
  alternatives:
  characteristics:
    description: Battery box
- role: optional_accessory
  type_designations:
