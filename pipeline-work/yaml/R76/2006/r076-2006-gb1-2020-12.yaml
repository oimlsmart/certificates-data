certified_type:
  category: Indicator
  type_designations:
  - CheckMaster
  - LineMaster V
  - CheckMaster Ex
  description: >-
    Digital indicating device connected to a weighing platform to form a single-interval, Class III or
    IIII, non-automatic weighing instrument. Shall not be used for direct sales to the public. Construction:
    stainless steel enclosure, LCD display, operator keypad with numerical, navigation and function keys,
    lightbar. Interfaces: load cell, RS232 x 2, PIO x 9, Wi-Fi, RFID. Any compatible load cell with an
    OIML R60 Certificate of Conformity may be used, with compatibility established by the manufacturer's
    compatibility of modules calculation; a load cell marked NH is allowed only if humidity testing to
    R76 has been conducted. Software held in firmware with identification number MC8_xxx; non-editable
    TAN (traceable access number) counter increments when legally relevant parameters are changed. Sealing
    by wire and seal or tamper-evident label with securing mark; TAN value written on a tamper-evident
    label on or near the rating plate.
