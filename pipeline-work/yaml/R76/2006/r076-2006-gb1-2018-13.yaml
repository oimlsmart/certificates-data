certified_type:
  category: Indicator
  type_designations:
  - DD700
  - DD700I
  - DD700IC
  description: >-
    The indicating devices are designated the DD700, DD700IC and DD700I indicators. The indicators are
    self-indicating, mains or DC-powered, and are designed to be used as part of a Class III or IIII,
    non-automatic weighing instrument.
