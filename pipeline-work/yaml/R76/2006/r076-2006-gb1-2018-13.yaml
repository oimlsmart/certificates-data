        exists containing the load cell types and data required for the manufacturer's declaration of
        compatibility of modules; a load cell marked NH is allowed only if humidity testing to R76 has
        been conducted; compatibility established by the manufacturer's module compatibility calculation
        at verification; load cell transmission conforms to a standard type
