certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Checkmaster
  - Linemaster V
  module_designation:
  description: >-
    The instrument utilises the Checkmaster digital indicating device connected to a weighing platform
    to form a single-interval, Class III or IIII, non-automatic weighing instrument. The instrument is
    not intended to be used for direct sales to the public. Construction: stainless steel enclosure, LCD
    display, operator keypad with numerical, navigation and function keys, lightbar. Interfaces: load
    cell, 2 x RS232, 9 x PIO, Wi-Fi, RFID. Software is held in firmware on the circuit board with identification
    number MC8_xxx; a non-editable TAN (traceable access number) counter increments when legally relevant
    parameters are changed. Access to the load cell connection and electronics is prevented by sealing
    the enclosure using a wire and seal or a tamper-evident label and securing mark. Any compatible load
    cell(s) with a respective OIML R60 Certificate of Conformity may be used, subject to the compatibility
    of modules calculation.
