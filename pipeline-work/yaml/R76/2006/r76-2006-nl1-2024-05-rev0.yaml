  description: >-
    Software version compatibility of the Rainbow data processing device when digital load cells or weighing
    modules are connected. For Rainbow core versions 2.3.7 and higher the Rainbow Core is legally not
    relevant. The Rainbow version is displayed on the second page of the Terminal Info.
  footnotes:
