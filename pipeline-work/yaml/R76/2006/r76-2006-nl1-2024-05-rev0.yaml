    rainbow_core_version: 2.1.7 to 2.3.6
    rainbow_weighing_package_version: 2.1.7 to 2.2.6
    rainbow_signal_processing_version: 1.70.x
  - rainbow_core_designation: RB or rb
    rainbow_weighing_package_designation: WP or wp
