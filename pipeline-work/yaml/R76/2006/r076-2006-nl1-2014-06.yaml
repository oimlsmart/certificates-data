matrix_tables:
- name: Characteristics of the non-automatic weighing instrument
  columns:
  - characteristic
  - accuracy_class_I
  - accuracy_class_II
  rows:
  - characteristic: accuracy_class
    accuracy_class_I: "(I)"
    accuracy_class_II: "(II)"
  - characteristic: maximum_capacity
    accuracy_class_I: 120 g ≤ Max ≤ 1220 g
    accuracy_class_II: 160 g ≤ Max ≤ 10200 g
  - characteristic: verification_scale_interval
    accuracy_class_I: e ≥ 1 mg
    accuracy_class_II: e ≥ 10 mg
  - characteristic: maximum_number_of_scale_intervals
    accuracy_class_I: n ≤ 320000 divisions (per partial weighing range)
    accuracy_class_II: n ≤ 320000 divisions (per partial weighing range)
  - characteristic: maximum_partial_weighing_ranges
    accuracy_class_I: '1'
    accuracy_class_II: '1'
  - characteristic: temperature_range
    accuracy_class_I: "+15 °C / +25 °C"
    accuracy_class_II: "+10 °C / +30 °C"
  - characteristic: tare
    accuracy_class_I: T ≤ -Max
    accuracy_class_II: T ≤ -Max
  - characteristic: weighing_ranges
    accuracy_class_I: Single interval
    accuracy_class_II: Single interval
  - characteristic: power_supply_voltage
    accuracy_class_I: 100 – 240 V AC 50/60 Hz (with external adapter); 12 V DC (supplied by external adapter)
    accuracy_class_II: 100 – 240 V AC 50/60 Hz (with external adapter); 12 V DC (supplied by external
      adapter)
  - characteristic: software_identification_type_lx_ls
    accuracy_class_I: 'Version number: xx.xx ExxD01'
    accuracy_class_II: 'Version number: xx.xx ExxD01'
  - characteristic: software_identification_type_lt
    accuracy_class_I: 'Version number: xx.xx ExxD00'
    accuracy_class_II: 'Version number: xx.xx ExxD00'
  description: >-
    Values spanning both accuracy-class columns in the source table (colspan) are repeated in both columns.
    Software version legend: xx can be 00-99 or A-Z and represents the non legally relevant parts; E..D00/E..D01
    represent the legal-relevant part of the software.
  footnotes: []
