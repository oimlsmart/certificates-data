certified_type:
  category: Indicator
  type_designations:
  - X112-B
  - i20
  - i30
  - i35
  - i40
  - d20
  module_designation:
  description: >-
    The indicator type X112-B is a separate module intended to be integrated in a non automatic weighing
    instrument. It has several versions with the commercial designations i20 (general use), i30 and i35
    (appropriate for weighbridges), i40 (weighing in a process context) or d20 (as a repeater). The housing
    is metallic and presented as a table version, a cabinet back panel version or a front of housing version.
    It is intended to be connected to a weighing channel comprising analogue load cells.
