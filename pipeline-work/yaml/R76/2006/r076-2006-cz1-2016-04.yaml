certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AS xxx.X2.yyy
  - AS 82/220.X2
  - AS 62.X2
  - AS 160.X2
  - AS 220.X2
  - AS 310.X2
  module_designation: Not applicable
  description: >-
    Balance AS xxx.X2.yyy series operates on the basis of electromagnetic compensation of the weighed
    load. Symbol xxx stands for Max in g and symbol yyy stands for the special purpose of the balance
    (e.g. jewelry balance - CT). Features: full graphic display, plastic cover, stainless steel pan, weighing
    chamber, automatic internal adjustment system. Equipped with a Data Storage Device (Alibi Memory)
    per WELMEC 2.5 storing up to 500000 weighing results in internal flash memory with checksum protection.
    Devices: zero indicator, stability indicator, automatic span adjustment with internal calibration
    mass, display check, initial zero-setting, zero-tracking, data storage device (alibi memory), service
    menu via switch on main board, printer, additional display, USB, Ethernet, weighing in carat units.
    Level indicator with sensitivity of at least 2 mm for a tilt of 2/1000. Interfaces (compliant with
    5.3.6 of OIML R76): RS 232, USB 2.0, Ethernet 10/100 Mbit, optionally WiFi. Embedded software with
    fixed identification, valid software version 2.2.0. The metrological characteristics table is an example
    of some models within the approved range.
