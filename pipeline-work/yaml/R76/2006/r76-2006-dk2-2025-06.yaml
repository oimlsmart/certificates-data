certified_type:
  category: Indicator
  type_designations:
  - ZM223
  module_designation: Non-automatic weighing indicator
  description: >-
    The indicating device is designated the Avery Weigh-Tronix ZM223 and is designed to be used as part
    of a Class III or IIII non-automatic weighing instrument. It can connect to one analogue load receptor,
    or one analogue load receptor plus one BSQ digital base, or two BSQ digital load bases. The indicator
    consists of analogue-to-digital conversion, microprocessor control, power supply, keyboard, non-volatile
    memory for storage of calibration and weight data, and display contained within a single stainless-steel
    enclosure. The front has an operator LCD display (1.5-inch high 14-segment digits, annunciators, transflective
    segments for outdoor contrast, 4-colour backlight: green/red/yellow/orange) and a keyboard with 7
    keys plus 12 numeric keys. Devices: semi-automatic zero-setting, initial zero-setting, zero-tracking,
    semi-automatic subtractive tare weighing, preset tare, recall of gross indication when tare is active,
    determination and indication of stability of equilibrium, power-up test, display test, printing, PLUs,
    alibi storage device, gravity compensation, event counters, real-time clock, command via external
    device (PC), status indicators, range-in-use indicators (multi-range variant), connection to up to
    2 load receptors with load receptor number indicator. Interfaces: 2 x serial communication (2 x RS232,
    or 1 x RS232 plus 1 x QDT, or 2 x QDT), Ethernet, USB, Bluetooth, open collector outputs, 6 x programmable
    I/O (active-low inputs or open collector outputs). Optional: analog output card, STVS PCB, dual L/C
    STVS PCB, micro SD card interface. The interfaces do not have to be secured. Software comprises a
    segregated firmware OS (all legally relevant functionality, not modifiable) and a user application
    written in LUA (non-legally relevant). Securing via mainboard jumper or software securing with password-protected,
    non-resettable CAL and CONFIG event counters.
