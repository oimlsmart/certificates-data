certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - PS xxx.X2.yyy
  - PS 200/2000.X2
  - PS 250.X2
  - PS 1000.X2
  - PS 1500.X2
  - PS 6000.X2
  module_designation: Not applicable
  description: >-
    PS xxx.X2.yyy model series operates on the basis of electromagnetic compensation of the weighed load,
    with a measuring range up to 6000 g. High resolution, repeatability and measuring range are maintained
    by highly stable electronic and mechanical components and an automatic internal adjustment system.
    Balance has a full graphic display, plastic cover, stainless steel pan, and automatic internal adjustment
    system. Symbol xxx means Max (g) and symbol yyy means special purpose of the balance (e.g. jewelry
    balance - CT). Devices: zero indicator, stability indicator, automatic span adjustment with internal
    calibration mass, display checking, initial zero-setting, zero-tracking, Data Storage Device (Alibi
    Memory), service menu via switch on main board, printer, add display, USB, Ethernet, weighing in carat
    units. Level indicator with sensitivity of at least 2 mm for a tilt of 2/1000. Embedded software,
    valid version 2.2.0, cannot be modified or uploaded after securing/verification.
