certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - NCR 7812-5XXX series
  module_designation: Not applicable
  description: >-
    NCR 7812-5XXX series scanner/scale (where XXX denotes alternative approved models), Class III, mains
    operated, self-indicating, weight only, Non-Automatic Weighing Instrument. Designed for flush-mounting
    in checkout surface, having frame extensions to support the instrument in the checkout counter. Intended
    to be installed in a fixed position in checkout and self-checkout counters, consequently a levelling
    device and level indicator are not provided. Stainless steel load receptor; pole-mounted display.
    Devices: initial zero setting device, semi-automatic zero setting device, zero tracking device, automatic
    zero setting device, zero indicator, gravity compensation. Interfaces: Main power adapt, IBM 485,
    USB/USB power, RS232, Display, Scanner, ICL MDL (Interlock). Equipped with an integrated single character
    seven segment display, also used to provide audit trail information from the two event counters.
