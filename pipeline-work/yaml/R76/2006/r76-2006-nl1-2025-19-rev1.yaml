  module_designation: Not applicable
  description: >-
    Indicator type PRO. The software identification number is displayed at start-up or by pressing the
    keys in the sequence 'SETUP → INDICATOR → CONFIG → SW.VERSION'. In case sense technology is not used,
    the load cells are connected directly without junction box or extension cable. Power supply is not
    suitable for a road vehicle power supply.
