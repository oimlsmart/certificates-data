certified_type:
  category: Indicator
  type_designations:
  - DI-517
  - DI-517 SS
  module_designation: Indicator
  description: >-
    Separate indicator module intended to be integrated in a non automatic weighing instrument, to be
    connected to a weighing channel comprising analog load cells. Two versions designated DI-517 and DI-517
    SS differing by their enclosure: metal+plastic (DI-517) or stainless steel (DI-517 SS). Access to
    calibration and metrological configuration is only possible via a special position of a switch in
    the box; access to this switch is protected by the sealing device.
