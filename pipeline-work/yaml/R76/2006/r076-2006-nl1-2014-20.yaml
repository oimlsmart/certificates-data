matrix_tables:
- name: Characteristics of the non-automatic weighing instrument
  columns:
  - variant
  - accuracy_class
  - maximum_capacity
  - verification_scale_interval
  - maximum_number_of_scale_intervals
  rows:
  - variant: Class I, Max <= 320 g
    accuracy_class: I
    maximum_capacity: Max <= 320 g
    verification_scale_interval: e >= 0.001 g
    maximum_number_of_scale_intervals: n <= 320000 divisions
  - variant: Class II, Max <= 5200 g
    accuracy_class: II
    maximum_capacity: Max <= 5200 g
    verification_scale_interval: 0.1 g >= e >= 0.01 g
    maximum_number_of_scale_intervals: n <= 52000 divisions
  - variant: Class II, Max <= 8200 g
    accuracy_class: II
    maximum_capacity: Max <= 8200 g
    verification_scale_interval: e >= 1 g
    maximum_number_of_scale_intervals: n <= 8200 divisions
  description: >-
    Parameters per instrument variant. Accuracy class II spans two capacity variants. The rows actual
    scale interval (e = d or e = 10 d), weighing range (single interval), tare (T <= -Max), temperature
    range (+10 °C / +30 °C), power supply (12 V DC supplied by AC/DC plug-in power supply) and software
    identification (version 1.xx, xx = 00 to 99) apply to all variants.
  footnotes: []
