certified_type:
  category: Indicator
  type_designations:
  - IPE100 Series
  - IPE90 Series
  - IPC Series
  - IPE50 Series
  description: >-
    Indicating devices certified as weight indicators designed to be connected to a load receptor to form
    a Class III and IIII, non-automatic weighing instrument. Enclosures: ABS plastic or stainless steel;
    display: LCD or LED; function keys; connections and ports located at the back. Devices: initial zero-setting,
    semi-automatic zero setting device, zero tracking device, zero indicator, indication of stable equilibrium,
    display checking at power-up, acting upon significant faults, multiple range scale with a maximum
    of three partial weighing ranges, multi-interval scale with a maximum of three partial weighing ranges,
    semi-automatic subtractive tare weighing. Any compatible load cell may be used provided it has an
    OIML R60 Certificate of Conformity containing the load cell types and data required for the compatibility
    of modules calculation; a load cell marked NH is allowed only if humidity testing to R76 has been
    conducted.
