certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SWII
  - PRII
  - PRII-B
  - PRII-P
  - PRII-U
  - SWII-C
  - SWII-E
  - PRII-CB
  - PRII-EB
  - PRII-CP
  - PRII-EP
  - PRII-CU
  - PRII-EU
  module_designation:
  description: >-
    Family of Class III, mains- or battery-operated, self-indicating, single or dual-interval, non-automatic
    weighing instruments, designated the SWII and PRII Series, comprising the SWII, PRII-B, PRII-P and
    PRII-U models and their variants. May be used for direct sales to the public. Construction: plastic
    housing; operator's keypad; plastic (SWII) or stainless steel (SWII and PRII) load receptor; dual,
    integral or pole-mounted LCD or LED display; level indicator. Devices: initial zero setting device
    (up to 20% of Max), semi-automatic zero setting device (up to 4% of Max), zero tracking device (up
    to 4% of Max), zero indicator, net indicator, unit change (g, kg), stable weight indicator (SWII),
    semi-automatic subtractive tare balancing device, gravity compensation, price-computing, totalisation
    and PLU (PRII), piece counting, hold function and checkweighing (SWII). Interfaces: RS232C, USB. Load
    cell: CAS load cell, model SWII, capacities as per technical data table. Software designated V1.xx
    (xx reflecting minor, non-legally relevant modifications), displayed at power up; software download
    via communication ports only possible via the ICP interface (connector CON1) and protected by switches
    on main board; legally relevant parameters accessible only via the calibration switch. Sealing: access
    to the load cell, electronics, calibration and software download switches secured via a tamper-evident
    solution bearing a securing mark.
