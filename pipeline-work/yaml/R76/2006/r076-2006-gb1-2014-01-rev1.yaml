certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DPS-800s
  module_designation: Not applicable
  description: >-
    Digital indicating device designated DPS-800s indicator with optional labeller connected to a weighing
    platform to form a Class III or IIII, mains-powered self-indicating, non-automatic weighing instrument.
    May be used for direct sales to the public. Devices: initial zero setting, semi-automatic zero setting,
    zero tracking, semi-automatic subtractive tare weighing, determination of stability of equilibrium,
    indication of stability of equilibrium, zero indicator, PLUs, preset tare, price calculation. Interfaces:
    load cell 6-wire shielded connection, Ethernet, USB, RS232. Stainless steel enclosure with metallic
    supporting frame. Load cells: any compatible load cell(s) with a valid OIML R60 Certificate of Conformity,
    compatibility established via compatibility of modules calculation.
