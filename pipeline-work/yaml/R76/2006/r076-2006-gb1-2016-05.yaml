certified_type:
  category: Indicator
  type_designations:
  - WTM Series
  - WTM-200
  - WTM-500
  module_designation:
  description: >-
    Family of indicating device / weighing module designated the WTM Series, designed to be used as part
    of a single-interval, Class III or IIII, non-automatic weighing instrument. The family comprises the
    WTM-200 (weighing module) and WTM-500 (indicator) models. The indicators are self-indicating and DC-powered.
    The instruments are not designed for direct sales to the public. Plastic enclosure; WTM-500 has a
    7 segment 0.3" LED display, 4 operating buttons and 6 enunciator LEDs. Devices: initial zero setting
    device on power up, semi-automatic zero setting, zero tracking (optional), semi-automatic subtractive
    tare balancing, zero-indicator, indication of stable equilibrium, net indicator, gravity compensation,
    printing. Interfaces: load cell connection (6-wire), RS232/485, analogue output, external I/O, Ethernet,
    Profibus. Software is held in firmware with identification number V1.xx; download of software is prevented
    by a jumper (JP1) on the main board; access to legally relevant parameters is only allowed via a jumper
    on the circuit board. Sealing: access to the setup/configuration jumper is prevented by sealing the
    enclosure via a tamper-evident solution; the load cell connection is sealed via a tamper-evident solution.
