  - ALG-H series
  module_designation: Non-automatic weighing instruments
  description: >-
    The ALG-H series are class I and class II, self-indicating and non-automatic weighing instruments. The mass detection
    method of the ALG-H series is a tuning fork sensor. The instruments can be switched to the unit of measurement (momme)
    for special applications, e.g. trade with pearls. The symbol for the momme is mom(1 mom = 3.75 g).
