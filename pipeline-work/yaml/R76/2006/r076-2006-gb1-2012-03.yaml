certified_type:
  category: Indicator
  type_designations:
  - IPE100 P
  - IPE100 SS
  - IPE90 P
  - IPE90 SS
  description: >-
    Weight indicators designed to be connected to a load receptor to form Class III and IIII non-automatic
    weighing instruments. Features: ABS plastic or stainless steel enclosure, LCD or LED display, function
    keys, connections and ports located at the back. The models are technically compatible with models
    3590EXPC, 3590EXT, CPWE and CPWET as detailed in evaluation report P00251. Interfaces may include
    DC voltage input, RS-232, RS-485, control inputs/outputs, USB, Ethernet and Bluetooth. Calibration
    and setup parameters can only be accessed via the sealed switch located on the main board; any compatible
    CE-marked mains adaptor may be used.
