certified_type:
  category: Indicator
  type_designations:
  - '1080'
  module_designation:
  description: >-
    Weighing indicator, as part of a non-automatic weighing instrument, designated the 1080. Designed
    to be used as part of a Class III or IIII non-automatic weighing instrument; self-indicating, DC-powered
    and operates as a single interval instrument. Comprises processor and converter unit (CPU and A/D
    converter), LED display with 7 digits, LED indicators, operator keypad and metallic enclosure. Devices:
    semi-automatic zero setting, zero tracking, semi-automatic subtractive tare weighing, automatic tare
    weighing, determination of stability of equilibrium, accumulation, counting, target weighing, checkweighing,
    axle weighing, and gross/net/tare/print/zero/motion/accumulation/over-under weight/network indicators.
    Interfaces: load cell 6-wire shielded connection, RS232, RS485, Ethernet, USB, Profibus DP, Digital
    I/O, DeviceNet.
