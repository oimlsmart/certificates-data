certified_type:
  category: Indicator
  type_designations:
  - ZM301
  - ZM303
  - ZM305
  - ZQ375
  module_designation: ZM301, ZM303, ZM305, ZQ375 Series
  description: >-
    The family of indicating devices is designated the Avery Weigh-Tronix ZM301 / ZM303 / ZM305 / ZQ375
    Series: self-indicating, mains, DC or battery-powered indicators designed to be used as part of a
    Class III or IIII non-automatic weighing instrument. Model number coding 'Prefix-XYZ': prefix ZM301,
    ZM303 or ZM305 = Standard Indicator, ZQ375 = Check-weighing Indicator; first digit X = enclosure material
    (S = stainless enclosure, A = alloy enclosure); second digit Y = mounting orientation (D = desktop,
    G = desktop with GTN Inbound-Outbound software & keypad variant, P = panel mount); third digit Z =
    display type (1 = IBN black background with green digits, 2 = TN green background with black digits).
    ZM301 features 6 operational keys; ZM303 and ZM305 overlays are fitted with 24 operational keys including
    a numeric keypad (ZM305-SG1 overlay includes Inbound/Outbound weighing keys); ZQ375 is designed for
    check weighing and fitted with 10 operational keys. Devices/functions: semi-automatic zero setting
    (<= 4% Max), zero tracking (<= 4% Max), semi-automatic subtractive tare weighing, pre-set tare, recall
    of gross indication when tare is active, determination and indication of stability of equilibrium,
    checking of display, printing, PLUs, alibi storage device, gravity compensation, checkweighing, real
    time clock, counting, weigh labelling, command via external device (PC), accumulation, target weighing,
    batching, peak hold, simple/mid-level/advanced/percentage/grading checkweighing (ZQ375 models only),
    GTN Inbound-Outbound (ZM305-SG1 model only, with V2.x.x.x software), and gross/net/tare/preset tare/print/zero/motion/accumulation/over-under
    weight and network indicators.
