certified_type:
  category: Weighing module
  type_designations:
  - PL.xxx.PM.yyy
  - PM.xxx.yyy
  module_designation: Not applicable
  description: >-
    Weighing module (platform) for non-automatic weighing instruments. Devices: Zero indicator; Stability
    indicator; Internal adjustment; Service menu via switch on the main board; Initial zero-setting; Zero-tracking;
    Semi-automatic zero setting device; Subtractive tare device; Semi-automatic and automatic tare device;
    Tare-weighing device; Preset tare device; Data Storage Device (Alibi memory). PM weighing modules
    have no DSD of their own and are intended to use the DSD of the connected terminal. Equipped with
    RS 485 interface dedicated for connecting terminals (compliant with 5.3.6 of OIML R 76). Embedded
    weighing software version 1.0.0 or 1.0.1, fixed hardware/software environment, cannot be modified
    or uploaded after securing and/or verification; software identification possible after connecting
    terminal.
