characteristics:
  type_level:
    accuracy_class:
      value: III
      unit_symbol:
    maximum_capacity:
      value:
        min: 6
        max: 30
      unit_symbol: kg
    weighing_ranges:
      value: Single interval / Multi-interval
      unit_symbol:
    maximum_number_of_partial_weighing_ranges:
      value: 3
      unit_symbol:
    tare:
      value: T <= -Max
      unit_symbol:
    temperature_range:
      value: Matching the temperature range in the certificates involved
      unit_symbol:
    power_supply_voltage:
      value:
        min: 100
        max: 240
      unit_symbol: V
    power_supply_frequency:
      value:
        min: 50
        max: 60
      unit_symbol: Hz
    power_supply_type:
      value: AC
      unit_symbol:
    application:
      value: Intended to be used for direct sales to the public
      unit_symbol:
    software_identification_name:
      value: MT UPOSScale
      unit_symbol:
    software_identification_version:
      value: 1.x.y.z
      unit_symbol:
    software_version_constraints:
      value: x = 0..999, y = 0..999, z = 0..9999999 (x, y and z are non-legally relevant parts)
      unit_symbol:
  config_level:
  - attribute: maximum_capacity
    axis: platform_configuration
    values:
    - condition: with external weighing platforms
      value:
        min: 6
        max: 3000
      unit_symbol: kg
  - attribute: verification_scale_interval
    axis: weighing_range_type
    values:
    - condition: single interval
      value:
        min: 2
        max:
      unit_symbol: g
    - condition: multi-interval
      value:
        min: 1
        max:
      unit_symbol: g
  - attribute: maximum_number_of_scale_intervals
    axis: weighing_range_type
    values:
    - condition: single interval
      value:
        min:
        max: 6000
      unit_symbol: divisions
    - condition: multi-interval (per partial weighing range)
      value:
        min:
        max: 3000
      unit_symbol: divisions
  - attribute: initial_zero_setting_range
    axis: model_maximum_capacity
    values:
    - condition: models with Max 6 kg
      value:
        min: -2
        max: 25
      unit_symbol: "%"
    - condition: all other models
      value: 20
      unit_symbol: "%"
