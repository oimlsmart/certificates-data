  module_designation: Not applicable
  description: >-
    Weight indicators designed to be connected to a load receptor to form Class III and IIII non-automatic
    weighing instruments. Features: ABS plastic or stainless steel enclosure; LCD or LED display; function
    keys; connections and ports located at the back. Devices: initial zero-setting device, semi-automatic
    zero setting device, zero tracking device, zero indicator, indication of stable equilibrium, display
    checking at power-up, acting upon significant faults, multiple range scale and multi-interval scale
    with a maximum of three partial weighing ranges, semi-automatic subtractive tare weighing.
