        for weighing unstable samples (DB-II model); processing of non-weighed items (DB-II model); price-computing
        (weighed and non-weighed items) (DB-II model); totalisation (when connected to a printer); price
        clear and tare clear functions; piece counting (DB-II model); percentage weighing
      unit_symbol:
      unit_id:
