certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Dolphin Series
  - EB
  - EB-L
  - DBII
  - DBII-C
  - DBII-E
  - DB-1H
  - DB-1H PLUS
  module_designation: Not applicable
  description: >-
    The Dolphin Series is a family of Class III, mains or battery-operated, self-indicating, dual-interval,
    non-automatic weighing instruments. It comprises the EB, DBII and DB-1H models and their variants
    (Figures 1 to 4), using the One-Module V4. The instrument may be used for direct sales to the public.
