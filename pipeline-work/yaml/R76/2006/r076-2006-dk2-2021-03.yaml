  - LP18E
  - LP18E-L
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    Non-automatic electronic weighing instruments in accuracy class III, single interval, with load cell
    Zemic L6D (1 per instrument) and approved software version 1.2. Devices: initial zero setting device
    (≤ 20% of Max), semi-automatic zero setting device (≤ 4% of Max), automatic zero setting device (≤
    4% of Max), zero tracking device (≤ 4% of Max), zero indicator, net indicator, stable weight indicator,
    semi-automatic subtractive tare weighing device, counting (LC18 only), price-computing (LP18 only),
    price lookup table (LP18 only), calibration/set-up mode via sealed internal switch. Interfaces: none.
    Access to the load cell, electronics and calibration switch is prevented by sealing of the enclosure
    by wire and seal.
