certified_type:
  category: Indicator
  type_designations:
  - PRO
  module_designation: Not applicable
  description: >-
    Weighing indicator for single-interval or multiple-range scales, usable with analog load cells (6-wire
    interface with sense technology, may be configured as 4-wire) or with digital load cells. The indicator
    has embedded software; the software identification (version 1.x) is displayed at start-up or by pressing
    the keys in the sequence SETUP → SCALE → CONFIG SCALE.
