  module_designation:
  description: >-
    Huntleigh Healthcare Enterprise 9000, Enterprise 9100, 9000X, Citadel and Citadel Plus hospital beds
    incorporating a Class III, mains operated, self-indicating non-automatic weighing instrument with
    a CDI-1600 indicator, four load cells, contour control and weighing functions, safety sides incorporating
    attendant controls including weighing control buttons, identical weight displays and associated control
    buttons on both sides of the bed, semi-automatic zero setting device, BED EXIT alarm function and
    AUTO-COMP function.
