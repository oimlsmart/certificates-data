  - ZQ375
  module_designation:
  description: >-
    Family of Class III, mains or battery-powered, self-indicating, non-automatic weighing instruments
    (checkweighers), not designed for direct sales to the public; comprises Torsion base (BSF/BSG) and
    Diamond base (BS) models. Devices: semi-automatic zero setting and zero tracking (max 4% of Max),
    semi-automatic subtractive tare, pre-set tare, recall of gross indication, determination and indication
    of stability of equilibrium, checking of display, printing, PLUs, alibi storage, gravity compensation,
    real-time clock, command via external device (PC), checkweighing modes Sim375, Mid375, Adv375, Per375,
    Grad375, and gross/net/tare/print/zero/motion/accumulation/over-under weight/network indicators.
