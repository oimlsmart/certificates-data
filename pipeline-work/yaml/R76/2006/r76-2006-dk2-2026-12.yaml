certified_type:
  category: Indicator
  type_designations:
  - '195'
  - '225'
  module_designation: Non-automatic weighing indicator
  description: >-
    Non-automatic weighing indicator (models 195 and 225). Devices: semi-automatic zero-setting, automatic
    zero-tracking, initial zero-setting, semi-automatic subtractive tare, preset tare, net/gross indication,
    extended resolution, printing (external printer connected to interface), alibi memory (option), units
    (g, kg, t). Interfaces: USB (1x micro USB-B, 1x USB-A), logic-level inputs, eight logic-level outputs,
    analogue output (0 to 10 V or 4-20 mA), Ethernet LAN, wireless interfaces (Wi-Fi and Bluetooth), two
    serial ports (RS232/20 mil and RS232/485 connectivity), option cards. Software is segregated into
    parts; the legally relevant part includes boot loader, standard indicator and streaming of weighing
    results to RS232 or Bluetooth. Software revision displayed during power-up as XX.YY.ZZZ where XX is
    the version of the legally relevant software.
