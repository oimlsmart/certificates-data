certified_type:
  category: Indicator
  type_designations:
  - X112-B
  module_designation:
  description: >-
    The indicator type X112-B is a separate module intended to be integrated in a non automatic weighing
    instrument. It has several versions with commercial designations i20 (general use), i30 and i35 (appropriate
    for weighing bridges), i40 (weighing in a process) or d20 (as a repeater). The enclosure is metallic
    and presented as a table, cabinet back panel or front of housing version. It is intended to be connected
    to a weighing channel comprising analogue or digital strain gauge load cells.
