certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - NuBorne Infant Warmer 500
  module_designation: Not applicable
  description: >-
    Class III, mains operated, self-indicating, single-interval, non-automatic weighing instrument designed
    to be used as an infant weigher and warming bed. Steel frame on wheels with electronic height adjustment,
    canopy with radiating heat lamp, plastic bed compartment containing weighing platform and patient
    mattress. Devices: subtractive tare balancing device, net indicator, gravity compensation, short term
    data storage.
