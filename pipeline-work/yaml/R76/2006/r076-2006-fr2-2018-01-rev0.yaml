components:
- role: analog data processing unit
  type_designations:
  - X1309-TR
  alternatives:
  characteristics:
    sealing: >-
      Hardware sealing with self-destructive sticker (view from below of the load receptor) plus software
      sealing: an event counter is incremented on any change of metrological parameters, adjustment parameters,
      serial number or software version; its value is recorded in the analog data processing unit and
      marked on a self-destructible label stuck on the main terminal.
- role: terminal module (display of primary indications)
  type_designations:
  - X1301
  alternatives:
  characteristics:
    note: >-
      Compatible PRECIA terminal module covered by an OIML-MAA certificate issued by LNE; type X1301 given
      as an example, other compatible certified terminals are allowed.
    maa_certificate: R76/2006-FR2-15.01
