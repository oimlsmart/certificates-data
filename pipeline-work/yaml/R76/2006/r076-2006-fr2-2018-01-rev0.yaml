certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - P1401-A
  module_designation: Analog data processing unit
  description: >-
    Electronic non-automatic weighing instrument with digital indication and two weighing ranges. It integrates
    an analog data processing unit type X1309-TR associated with a compatible PRECIA terminal module that
    displays the primary indications and is covered by an OIML-MAA certificate issued by LNE (example:
    type X1301, certificate R76/2006-FR2-15.01). Connection to the load cell is sealed by a self-destructive
    sticker; the analog data processing unit is additionally sealed by software via an event counter whose
    value is printed on a self-destructible label on the main terminal.
