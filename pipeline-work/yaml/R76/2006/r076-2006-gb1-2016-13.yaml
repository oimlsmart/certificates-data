  - VIS1
  - LAB1
  - SPO1
  module_designation: Not applicable
  description: >-
    The Sartorius PMA is a family of self-indicating, single-interval, non-automatic weighing instruments
    designed to be used in paint mixing applications. The family comprises the PMA-EV (Class II) and the
    PMA-HD (Class III) types, each of which comprises several models. Model designation format: <variant>
    ABC, where A = S, X or Y denoting operation in standard environments, Ex-zone 1 explosive environments
    or Ex-zone 2 explosive environments respectively; for A = S and EVO1Y models B = 1, and for all other
    models B = 1, 2, 3 or 4 depending on supplied RJ-45 cable lengths of no cable, 10 m, 20 m or 30 m
    respectively; C is a placeholder for commercial name affixes. The instrument shall not be used for
    direct sales to the public. Interfaces: USB either directly (S models and EVO1Y) or via Ex-Link converter
    (EVO1X and LAB1X); Ethernet via Ex-link converter (VIS1X and VIS1Y models). A PC with compatible paint
    mixing software can be connected to the instruments by the interfaces provided; preset tare can only
    be introduced via a PC.
