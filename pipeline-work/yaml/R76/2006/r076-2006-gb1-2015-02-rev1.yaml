certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XS Series
  - XS 500
  description: >-
    The Avery Berkel XS is a mains-powered, Class III, price-computing, stand-alone non-automatic weighing
    instrument intended for direct sales to the public. It comprises a vendor's keyboard with 23 fixed
    keys and up to 59 programmable keys, a vendor's backlit LCD display with up to four numeric fields,
    one alphanumeric field and annunciators, an identical customer's backlit LCD display, an integrated
    printer with thermal print head, a two-piece plastic housing containing the load cell and electronics,
    a stainless steel load receptor and a level indicator. Devices: initial zero-setting (up to 20% of
    Max), semi-automatic zero-setting, automatic zero-setting and zero-tracking (up to 4% of Max), zero
    indicator, net indicator, semi-automatic subtractive tare balancing/weighing, preset tare, price computing,
    non-weighed items, totalisation, self-service mode of operation, and a price-labelling configuration
    in which printing below Min is not allowed. Interfaces: Ethernet (wired or integral Wi-Fi), USB, cash
    drawer. Alternatives: XS with tower-mounted customer display; XS with tower-mounted operator keyboard
    and double-sided display; XS connected to a remote customer self-serve keyboard (customer display
    may be disabled or removed); XS 500 utilising a hanging scale construction.
