certified_type:
  category: Indicator
  type_designations:
  - ZK840
  module_designation:
  description: >-
    The indicating device is designated the Avery Weigh-Tronix ZK840. The indicator is self-indicating,
    mains, DC or battery-powered, and is designed to be used as part of a Class III Non-Automatic Weighing
    Instrument. The load receptor(s) may be BSQ digital bases and/or conventional platforms fitted with
    load cells. Construction: plastic (ABS) enclosure, mountable to a BSQ base or desk/wall mounted using
    an optional bracket. ISTN LCD display capable of positive and negative images; 6 operational keys
    plus touchscreen soft keys. Devices include: single or multi-range operation (maximum of 3 partial
    ranges), semi-automatic zero setting, zero tracking, semi-automatic subtractive tare weighing, pre-set
    tare, stability determination and indication, display check, printing, gravity compensation, real
    time clock, command via external device (PC), counting, accumulation, checkweighing, target weighing,
    percentage weighing, grading, pick lists, kitting, density formulation, % recipe, connection to additional
    load receptors with identification of active load receptor(s), PLUs, piece weight selection, and extended
    indicating. Software designated AWT30-500208 version 2.x.x.x (x.x.x = non-legally relevant software);
    calibration and legally relevant parameters protected via sealed jumper or password with incrementing
    counters.
