certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SJ-..AWP/SJ-..AWP-BT series
  - SJ-3000AWP
  - SJ-3000AWP-BT
  - SJ-6000AWP
  - SJ-6000AWP-BT
  - SJ-15KAWP
  - SJ-15KAWP-BT
  - SJ-30KAWP
  - SJ-30KAWP-BT
  module_designation: Not applicable
  description: >-
    Class III, self-indicating, multi-interval non-automatic weighing instrument. Not designed for direct
    sales to the public. Devices: semi-automatic zero-setting (<=4% of Max); zero-tracking (<=4% of Max);
    semi-automatic subtractive taring (T = -Max); preset tare; zero indicator; indication of stable equilibrium.
    Interfaces: Bluetooth interface (SJ-..AWP-BT variants only). Software: legally relevant software designated
    version P-1.xx, with x reflecting non-legally relevant changes. Sealing: access to the load cell,
    electronics and calibration switch is prevented by a tamper-evident lead and wire type seal.
