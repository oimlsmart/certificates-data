certified_type:
  category: Non-automatic weighing module
  type_designations:
  - PE10-PC
  - P10b-PC
  - P10e-PC
  - P10s-PC
  - P15-PC
  - P15-F-PC
  - P18-PC
  - L10-PC
  - L15-PC
  - QP50-PC
  module_designation: Non-automatic electronic weighing module
  description: >-
    Non-automatic weighing modules consisting of a load receptor with one load cell, an electronic A/D
    board with embedded software, a power supply and a printer built into a desktop scale enclosure. All
    models have a touch screen display used as operator interface, either placed on a pole or in front
    of the desktop scale enclosure; some models have a second display screen used as customer display.
    The modules also contain a Windows motherboard with Windows 7 or 10, intended to run the weighing
    application of the complete desktop scale. The name of the modules may be followed by alphanumeric
    characters for technical, legal or commercial characterization. The modules are intended for scales
    used for direct sales to the public.
