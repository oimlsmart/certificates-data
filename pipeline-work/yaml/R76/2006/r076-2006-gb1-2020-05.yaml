certified_type:
  category: Hospital bed incorporating a non-automatic weighing instrument
  type_designations:
  - MV3™ Bariatric hospital beds 5900 series
  - MV3 5900
  module_designation: Not applicable
  description: >-
    The Stryker MV3™ Bariatric hospital bed 5900 series is a hospital bed incorporating a Class IIII,
    mains and/or battery operated, self-indicating, non-automatic weighing instrument. The height and
    surface contours of the bed are adjustable; the bed includes movable and latchable siderails, adjustable
    litter deck width, and control boards. Weighing control and display functions are on the footboard,
    and four load cells are installed at the four corner positions of the bed base. The bed shall not
    be used for direct sales to the public and shall not be used on unlevel flooring exceeding a 2.86
    degree tilt angle. There is currently no authorised interface and no authorised alternatives.
