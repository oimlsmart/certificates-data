certified_type:
  category: Indicator
  type_designations:
  - CI-600 Series
  - CI-601A
  - CI-605A
  description: >-
    Family of instruments designated the CI-600 Series, utilising the CI-601A or CI-605A digital indicating
    devices connected to a weighing platform to form a single or dual-interval, Class III or IIII, non-automatic
    weighing instrument. Main features: plastic enclosure, 4.3" LCD display, operator keypad with numerical,
    navigation and function keys, Relay In/Out option card (CI-605A), Analogue Out option card (CI-601A,
    CI-605A). Devices: initial zero setting device on power up, semi-automatic zero setting, zero tracking
    (optional), semi-automatic subtractive tare weighing, preset tare, gross/net indication, zero-indicator,
    indication of stable equilibrium, net indicator, gravity compensation, hold function, soft function
    keys (F1, F2, F3), memory storage. Interfaces: load cell connection, RS232/485, Relay In/Out (CI-605A),
    Analogue Out (CI-601A, CI-605A). Software is held in firmware with identification number V1.xx; access
    to setup/configuration mode is only allowed via a jumper located on the circuit board, sealed with
    a wire-and-seal solution. Not designed for direct sales to the public. Any compatible R60-certified
    load cell may be used subject to compatibility of modules.
