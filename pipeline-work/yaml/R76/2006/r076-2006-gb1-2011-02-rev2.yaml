  description: >-
    Indicating devices certified as weight indicators designed to be connected to a load receptor to form
    a Class III and IIII Non-Automatic Weighing Instrument. Features: ABS plastic or stainless steel enclosure;
    LCD or LED display; function keys; connections and ports located at the back. Devices: initial zero-setting,
    semi-automatic zero setting device, zero tracking device, zero indicator, indication of stable equilibrium,
    display checking at power-up, acting upon significant faults, multiple range scale with a maximum
    of three partial weighing ranges, multi-interval scale with a maximum of three partial weighing ranges,
    semi-automatic subtractive tare weighing. Interfaces: 4 or 6-wire load cell connection, DC voltage
    input, RS-232, RS-485, control inputs/outputs, USB, Ethernet, Bluetooth, RF, WiFi. Sealing: calibration
    and setup parameters accessible only via sealed switch located on the main board. Any compatible load
    cell with an OIML R60 Certificate of Conformity may be used, subject to the compatibility of modules
    calculation performed by the manufacturer at verification; load cells marked NH allowed only if humidity
    testing to R76 has been conducted.
