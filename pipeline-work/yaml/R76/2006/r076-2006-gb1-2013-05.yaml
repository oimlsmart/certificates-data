certified_type:
  category: Non-Automatic Weighing Instrument
  type_designations:
  - NCR 7812-5XXX series
  description: >-
    NCR 7812-5XXX series scanner/scale, Class III, mains operated, self-indicating, weight only, non-automatic
    weighing instrument. Designed for flush-mounting in checkout surface, having frame extensions to support
    the instrument in the checkout counter; intended to be installed in a fixed position in checkout and
    self-checkout counters, consequently no levelling device or level indicator is provided. Stainless
    steel load receptor, pole-mounted display. Devices: initial zero setting device, semi-automatic zero
    setting device, zero tracking device, automatic zero setting device, zero indicator, gravity compensation.
    Interface types: DC voltage input, RS-232, IMB-485, control inputs/outputs, USB. Equipped with an
    integrated single character seven segment display, also used to provide audit trail information from
    the two event counters. A powered USB interface can also be used to power the scale and barcode scanner.
