certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SWII
  - PWII-B
  - PRII-P
  - PRII-U
  - SWII-C
  - SWII-E
  - PRII-CB
  - PRII-EB
  - PRII-CP
  - PRII-EP
  - PRII-CU
  - PRII-EU
  module_designation:
  description: >-
    Family of instruments designated the SWII and PRII Series, comprising the SWII, PWII-B, PRII-P and
    PRII-U models and their variants. Class III, mains- or battery-operated, self-indicating, single or
    dual-interval, non-automatic weighing instruments. The SWII instruments shall not be used for direct
    sales to the public; the PRII instruments may be used for direct sales to the public. Construction:
    plastic construction, operator's keypad, plastic (SWII) or stainless steel (SWII and PRII) load receptor,
    dual/integral or pole-mounted LCD or LED display, level indicator. Devices: initial zero setting device,
    semi-automatic zero setting device, zero tracking device, zero indicator, net indicator, unit change
    (g, kg), stable weight indicator (SWII), semi-automatic subtractive tare balancing device, gravity
    compensation, price-computing (PRII), totalisation (PRII), PLU (PRII), piece counting (SWII), hold
    function (SWII), checkweighing (SWII). Interfaces: RS232C, USB. Software designated V1.xx; software
    download only possible via the ICP interface (connector CON1), protected by switches on main board;
    legally relevant parameters accessible only via the calibration switch. Sealing: access to load cell,
    electronics, calibration and software download switches secured via tamper-evident solution bearing
    a securing mark.
