certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Babyleo TN500
  description: >-
    Class III, mains operated, self-indicating, non-automatic weighing instrument designed for medical
    use as a baby weigher and incubator / warming bed. The instrument shall not be used for direct sales
    to the public. Galvanised steel supporting frame on wheels with height adjustable support structure;
    plastic bassinet frame with canopy mounted on the support structure; radiating heat lamp fixed above
    the canopy; plastic weighing platform comprising four load cells, analogue to digital converter, and
    microcontroller to process the digital weight signal (scaling); user interface comprising a touch-screen
    display and push/rotate knob; plastic mattress tray on the weighing platform; softbed mattress or
    heated mattress on the mattress tray; ventilation fan below the weighing platform; pedals to adjust
    the height of the bassinet; keys on bassinet frame to adjust the longitudinal tilt and adjust the
    height of the weighing platform. Devices: tare balancing, weigh/re-weigh/adjust functions, gravity
    compensation, data storage. Interfaces: RJ45, USB, serial port, temperature sensors, nurse call, audio
    input, scale input. Sealing by labels covering the 6 screws of the weighing platform; adjustment counter
    value on a tamper-evident label on the side of the weighing platform; geographical position counter
    value on a tamper-evident label on the back of the display.
