certified_type:
  category: Indicator
  type_designations:
  - OP-960+
  description: >-
    The OP-960+ weight indicator is designed to be connected to a load receptor to form a Class III non-automatic
    weighing instrument. Features: ABS plastic enclosure, monochrome LCD display, function keys, connections
    and ports located at the back. Interfaces: 6-wire load cell connection, DC voltage input, RS-232 (passenger
    panel), RS-232 (printer, computer), control inputs/outputs, USB.
