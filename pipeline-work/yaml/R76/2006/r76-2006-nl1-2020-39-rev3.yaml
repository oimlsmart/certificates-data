matrix_tables:
- name: Characteristics of the non-automatic weighing instrument by load cell type
  columns:
  - load_cell_used
  - accuracy_class
  - maximum_capacity
  - verification_scale_interval
  - weighing_ranges
  - maximum_number_of_scale_intervals
  - maximum_number_of_partial_weighing_ranges
  - tare
  - temperature_range
  - power_supply_voltage
  - application
  rows:
  - load_cell_used: K type / L6D type
    accuracy_class: III
    maximum_capacity: 3 kg ≤ Max ≤ 30 kg
    verification_scale_interval: e ≥ 0.5 g
    weighing_ranges: Single interval; Multi-interval
    maximum_number_of_scale_intervals: >-
      n ≤ 6000 divisions (single interval, with A/D board STB-2236), or n ≤ 3000 divisions (per partial
      weighing range)
    maximum_number_of_partial_weighing_ranges: 2
    tare: T ≤ -50% for instruments with one weighing range; T ≤ -Max1 for multi-interval instruments
    temperature_range: "-10 °C / +40 °C"
    power_supply_voltage: 100 – 240 V AC 50/60 Hz
    application: Integrated POS software; Intended to be used for direct sales to the public
  - load_cell_used: PS type
    accuracy_class: III
    maximum_capacity: 3 kg ≤ Max ≤ 30 kg
    verification_scale_interval: e ≥ 1 g
    weighing_ranges: Single interval; Multi-interval
    maximum_number_of_scale_intervals: n ≤ 3000 divisions (with A/D board STB-2236) (per partial weighing
      range)
    maximum_number_of_partial_weighing_ranges: 2
    tare: T ≤ -50% for instruments with one weighing range; T ≤ -Max1 for multi-interval instruments
    temperature_range: "-10 °C / +40 °C"
    power_supply_voltage: 100 – 240 V AC 50/60 Hz
    application: Integrated POS software; Intended to be used for direct sales to the public
  - load_cell_used: M type
    accuracy_class: III
    maximum_capacity: 30 kg ≤ Max ≤ 600 kg
    verification_scale_interval: e ≥ 10 g
    weighing_ranges: Single interval; Multi-interval
    maximum_number_of_scale_intervals: n ≤ 3000 divisions (per partial weighing range)
    maximum_number_of_partial_weighing_ranges: 2
    tare: T ≤ -50% for instruments with one weighing range; T ≤ -Max1 for multi-interval instruments
    temperature_range: "-10 °C / +40 °C"
    power_supply_voltage: 100 – 240 V AC 50/60 Hz
    application: Integrated POS software; Intended to be used for direct sales to the public
  - load_cell_used: L6E3
    accuracy_class: III
    maximum_capacity: 30 kg ≤ Max ≤ 600 kg
    verification_scale_interval: e ≥ 5 g
    weighing_ranges: Single interval; Multi-interval
    maximum_number_of_scale_intervals: >-
      n ≤ 6000 divisions (single interval, with A/D board STB-2236) or n ≤ 3000 divisions (per partial
      weighing range)
    maximum_number_of_partial_weighing_ranges: 2
    tare: T ≤ -50% for instruments with one weighing range; T ≤ -Max1 for multi-interval instruments
    temperature_range: "-10 °C / +40 °C"
    power_supply_voltage: 100 – 240 V AC 50/60 Hz
    application: Integrated POS software; Intended to be used for direct sales to the public
  description: Metrological characteristics vary with the type of load cell used in the instrument.
