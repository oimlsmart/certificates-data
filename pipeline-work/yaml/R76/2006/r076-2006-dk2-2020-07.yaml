certified_type:
  category: Indicator
  type_designations:
  - Gi610
  - Gi620
  - Gi650
  module_designation: Non-automatic electronic weighing indicators
  description: >-
    Non-automatic electronic weighing indicators. The software is divided into 3 parts: a bootloader,
    a metrological part and an application part. Devices: initial zero setting device, semi-automatic
    zero setting device, automatic zero setting device, zero tracking device, zero indicator, stable equilibrium
    indicator, semi-automatic subtractive tare device, preset tare device, net indicator, gross/net indication,
    counting device, gravity compensation, printing, extended resolution device, alibi memory. Interfaces:
    RS232C, RS485, Ethernet, CAN bus (Gi650 only), USB (Gi620 and Gi650 only), WiFi. The interface does
    not have to be secured.
