certified_type:
  category: Indicator
  type_designations:
  - D1050
  description: >-
    Weighing indicator, as part of a non-automatic weighing instrument, designated the D1050. Designed
    to be used as part of a Class III or IIII non-automatic weighing instrument; operates as single-interval,
    multi-interval or multi-range; self-indicating; mains or DC powered. Stainless steel and ABS enclosure,
    10.4" graphic LCD display, up to 4 A/D conversion modules, main board with processor. Peripheral devices:
    initial zero setting, semi-automatic zero setting, zero tracking, automatic zero setting (negative
    load indications for more than 5 s), semi-automatic subtractive tare weighing, determination and indication
    of stability of equilibrium, zero indicator, preset tare, data storage device, up to 4 load receptors
    with summation, weighbridge modes (AdR, RcD, RpD).
