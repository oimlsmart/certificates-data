certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SWII-CW
  - SWII-EW
  - SWII-CWS
  - SWII-EWS
  module_designation: Non-automatic weighing instrument
  description: >-
    Plastic construction (SWII-CW / SWII-EW) or metal construction (SWII-CWS / SWII-EWS); operator's keypad;
    stainless steel load receptor; front and optional rear LCD display(s) (SWII-CW / SWII-CWS) or front
    and optional rear LED display(s) (SWII-EW / SWII-EWS); waterproof enclosure; waterproof adaptor (optional);
    level indicator. Devices: initial zero setting device (<= 20% of Max), automatic zero setting device
    (<= 4% of Max), semi-automatic zero setting device (<= 4% of Max), zero tracking device (<= 4% of
    Max), zero indicator, net indicator, stable weight indicator, unit change (g, kg), semi-automatic
    subtractive tare balancing device, gravity compensation, piece counting, hold function, manual checkweighing,
    multi-vendor operation, 3-point calibration / set-up mode via sealed internal switch. The instruments
    have no interfaces.
