certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MP70X1
  - MP70X2
  module_designation:
  description: >-
    Zebra Technologies MP70X1 & MP70X2 scanner scales: a family of self-indicating, weight-only, single
    or dual-interval, non-automatic weighing instruments. May be used for direct sales to the public.
    Designed for flush-mounting in checkout surface, with frame extensions to support the instrument in
    the checkout counter; steel framework supporting one load cell, barcode scanner and electronics; stainless
    steel load receptor; single (MX-201) or dual (MX-202) pole-mounted display; optional Produce Flip-Up
    Bar Platter to weigh oversize objects; optional Customer Side Scanner (CSS). Designed for permanent
    installation in checkout surface, so no level indicator required; the medium size model may be fitted
    with adjustable feet. Platform dimensions: Medium 398 mm x 292 mm; Long 506 mm x 292 mm. Devices:
    initial zero setting device, semi-automatic zero setting device, zero tracking device, automatic zero
    setting device, zero indicator, gravity compensation. Sealing: load cell model and serial number stored
    in scanner secure memory and checked at boot-up; non-resettable C and P counters must be written on
    a tamper-evident label on or near the rating plate; scale modules 20-MP7-M30-02 and 20-MP7-M30-04
    have a calibration switch under a screw on the U-bar sealed with a wire or plastic seal or a tamper-evident
    label. Optional EAS Security Tag Deactivation antenna may be fitted beneath the platter weighing surface.
