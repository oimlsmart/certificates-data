certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - KTACS Series
  - KTACS-Q1
  - KTACS-Q3
  - KTACS-A4
  - KTACS-Q5
  - KTACS-Q7
  module_designation:
  description: >-
    Family of Class III, mains or battery-operated, self-indicating, single-interval, non-automatic weighing
    instruments. May be used for direct sales to the public. Plastic construction; plastic/stainless steel
    load receptor; dual integral LCD/LED display; operator keypad; LCD/LED enunciators; level indicator.
    Devices: initial zero setting device, semi-automatic zero setting device, optional zero tracking,
    zero indicator, stable weight indicator, semi-automatic subtractive tare balancing (T = -Max), price-computing,
    Price Look Up (PLU), price clear and tare clear functions. Access to the load cell connection(s) and
    calibration jumper on the main board must be prevented by a tamper-evident sealing solution. No accessible
    interfaces.
