certified_type:
  category: Indicator
  type_designations:
  - XT1000
  - XT2000
  module_designation:
  description: >-
    Thames Side Sensors XT family of digital indicators, designed to be used as part of a single range,
    Class III or IIII, non-automatic weighing instrument. The indicators are self-indicating and DC-powered.
    Not designed for direct sales to the public. Features: stainless steel enclosure (XT1000) or plastic
    enclosure (XT2000), LED display, operator keypad with 5 navigation and function keys, LED enunciators.
    Devices: initial zero setting device on power up, semi-automatic zero setting, zero tracking (optional),
    semi-automatic subtractive tare balancing, net enunciator, preset tare, zero enunciator, indication
    of stable equilibrium. Interfaces: load cell connection, RS232/485, analog output (optional), ProfiBus/ProfiNet
    (optional), EtherNet/IP (optional).
