certified_type:
  category: Indicator
  type_designations:
  - MicroPACK'R
  module_designation: Indicator module
  description: >-
    Indicator module type MicroPACK'R, presented as a separate module intended to be integrated in a non-automatic
    weighing instrument (it may also be integrated in an automatic gravimetric filling instrument (Ref(0,2))
    or in an automatic catchweigher of category XIII). It is intended to be connected to 1 or 2 weighing
    channels comprising strain gauge load cells with analogue output. It performs analogue to digital
    conversion of the signal, manages the inputs and outputs and the different communication interfaces.
    It holds in its memory the metrological parameters of each connected weighing channel; it is not possible
    to change these parameters without breaking the sealing device.
