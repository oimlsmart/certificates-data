certified_type:
  category: Indicator
  type_designations:
  - X1104-TG
  module_designation: Digital terminal module
  description: >-
    X1104-TG module is a separate module intended to be integrated in a non-automatic weighing instrument.
    X1104-TG module is a purely digital terminal module. It does not include a measurement processing
    device. It is available as a metal or composite enclosure in a table-top version, a front panel version
    or for wall mounting. This terminal can also, from software version 3.4.0, define a specific channel
    allowing the calculation of the algebraic sum of values from up to 8 measurement channels.
