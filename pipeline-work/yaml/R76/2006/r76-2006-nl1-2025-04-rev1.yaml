certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SWN-xxyy
  - ER PLUS-xxyyy
  - ER JR-xxyy
  module_designation: Not applicable
  description: >-
    Multi-interval non-automatic weighing instrument intended to be used for direct sales to the public.
    SWN-xxyy with xx = capacity of the scale and yy = CC, CE, SE, SC; ER PLUS-xxyyy with xx = capacity
    of the scale and yyy = CB, CP, CU, CUT, EB, EP, EU, MCP, MEP; ER JR-xxyy with xx = capacity of the
    scale and yy = CB, CU, CB(D), CU(D).
