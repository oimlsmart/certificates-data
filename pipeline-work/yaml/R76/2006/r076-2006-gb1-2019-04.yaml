  - TM-xA2
  module_designation:
  description: >-
    Family of instruments designated the TM Series, comprising different models. Class III, mains-powered,
    self-indicating, price-computing, single-interval, barcode printing and scanning, non-automatic weighing
    instruments designed for direct sales to the public.
  main_features:
  - Plastic construction
  - Operator's keypad
  - Stainless steel load receptor
  - Front and rear LCD displays or pole-mounted double-sided LCD display
  - Level indicator under the load receptor
  - Integrated printer
  devices:
  - Initial zero setting device
  - Automatic zero setting device
  - Semi-automatic zero setting device
  - Zero tracking device
  - Zero indicator
  - Net indicator
  - Stable weight indicator
  - Semi-automatic subtractive tare weighing device
  - Preset tare
  - Gravity compensation
  - Price-computing (weighed and non-weighed items)
  - Hold function for weighing unstable samples
  - Check weighing
  - Piece counting
  - Totalisation (including non-weighed items)
  - PLU
  - Fixed weight labelling
  - Price labelling
  - Multi-vendor operation
  - Calibration / set-up mode via sealed internal switch
  - Printing
  - Barcode printing and scanning
  - Operator manual discount or percentage discount
  - Additional management functions
  interfaces:
  - USB
  - RS232
  - RJ11 (cash drawer)
  - RJ45 (Ethernet)
  - WiFi
