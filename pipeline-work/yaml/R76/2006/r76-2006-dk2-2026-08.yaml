  module_designation: Non-automatic weighing instrument
  description: >-
    ZTP…/ZSP…/WTP…/WSP…/UTP…/USP…/UHP…/UHPS… are price computing scales intended for sales to the public.
    ZHW…/UTW…/ZTW… are intended for weighing. ZHC…/UTC… are intended for counting. Devices: zero-setting,
    automatic zero-tracking, initial zero-setting, semi-automatic zero-setting, zero-tracking, semi-automatic
    subtractive tare, semi-automatic tare, preset tare (only ZHC…/UTC…), extended resolution (only ZHW…/ZHC…/UTW…/UTC…/ZTW…),
    price look up table (PLU), hold unit price, non-weighed articles, totalization (only WTP…/WSP…/UTP…/USP…),
    check weighing device, percentage weighing, printing (external printer connected to interface), counting
    device, gravity compensation, unit g or kg. Interfaces: RS-232.
