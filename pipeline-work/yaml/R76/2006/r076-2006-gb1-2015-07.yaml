certified_type:
  category: Indicator
  type_designations:
  - ZM401
  - ZM405
  module_designation:
  description: >-
    The family of indicating devices is designated the Avery Weigh-Tronix ZM401 / ZM405 Series. The indicators
    are programmable, self-indicating, mains, DC or battery-powered, and are designed to be used as part
    of a Class III or IIII Non-Automatic Weighing Instrument. Model designation follows the format 'Prefix-XYZ':
    ZM401/ZM405 = standard indicator; S = stainless enclosure; D = desktop, P = panel mount; 3 = IBN with
    dot graphic display (black background with green digits). The ZM401 features 6 operational keys, whereas
    the ZM405 is fitted with 24 operational keys including a numeric keypad. Devices include semi-automatic
    zero setting (<= 4% Max), zero tracking (<= 4% Max), semi-automatic subtractive tare weighing, pre-set
    tare, recall of gross indication, determination and indication of stability of equilibrium, checking
    of display, printing, PLUs, alibi storage device, gravity compensation, real time clock, command via
    external device (PC), single or multi-range / multi-interval operation (maximum of 3 partial ranges),
    range in use indicators, and connection to up to 2 load receptors with load receptor number indicator.
