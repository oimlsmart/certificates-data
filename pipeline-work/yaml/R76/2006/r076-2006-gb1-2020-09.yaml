certified_type:
  category: Weighing module
  type_designations:
  - W23
  - C01
  - C02
  - C03
  description: >-
    The W23 and C Series comprises the weighing module (A/D board) of a BPS indicator and a main PCB connected
    to a range of load cells to form a family of Class III, I/O line powered or battery-operated, self-indicating,
    dual-interval, non-automatic weighing instruments. Alloy metal construction, stainless steel load
    receptor, integral LCD display, LCD/LED enunciators (STABLE, ZERO and NET), level indicator, adjustable
    feet. The W23 model has no operator keypad; the C models have a 4-key operator keypad (Light, Function,
    Zero and Tare). Interfaces: RS232, USB (optional). Intended to be used for direct sales to the public
    when connected to a Point of Sale device; may be connected to an Electronic Point of Sale (EPOS),
    Electronic Cash Register (ECR) or Electronic Fund Transfer (EFT/ECU). Software held in firmware with
    identification number V02.xx (version displayed at power-up); access to legally relevant parameters
    and download of software only possible via the calibration switch on the main board, prevented by
    sealing the enclosure. Access to electronics, load cell and calibration switch prevented by sealing
    the enclosure using a tamper-evident wire and seal solution. Gravity compensation.
