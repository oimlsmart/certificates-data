certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL7200-D Series
  - CL7200-D
  module_designation: Not applicable
  description: >-
    Class III, mains-powered, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instrument designed for direct sales to the public. Plastic construction; operator's keypad;
    stainless steel load receptor; operator front touch screen display and customer rear LCD display;
    level indicator under the load receptor; integrated printer. Fitted with one CAS load cell, model
    TPN, and may be fitted with a CAS WI-FI Module, model GWF-3M08.
