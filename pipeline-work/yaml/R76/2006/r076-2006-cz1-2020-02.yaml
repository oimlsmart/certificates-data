certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AS xxx.X2.yy PLUS
  - AS xxx.R2.yy PLUS
  - AS 82/220.X2 PLUS
  - AS 62.X2 PLUS
  - AS 160.X2 PLUS
  - AS 220.X2 PLUS
  - AS 310.X2 PLUS
  module_designation: Not applicable
  description: >-
    Balance AS xxx.X2.yy PLUS and AS xxx.R2.yy PLUS series operate on the basis of electromagnetic compensation
    of weighed load. The series features a measuring range to 310 g and measuring resolution 0.01 mg,
    0.1 mg or 1 mg respectively, maintained by highly stable electronic and mechanical components and
    an automatic internal adjustment system. X2 balances have a full graphic display, R2 balances an LCD
    display; plastic casing cover, metal bottom casing, stainless steel pan, weighing chamber. Symbol
    xxx stands for Max (g) and symbol yyy for a special purpose of the balance (e.g. jewelry balance -
    CT). xxx may also indicate switchable resolutions (e.g. AS 82/220: 0.01 mg up to 82 g, 0.1 mg up to
    maximum capacity). Equipped with level indicator (sensitivity at least 2 mm for a tilt of 2/1000)
    and devices: zero indicator, stability indicator, automatic span adjustment with internal calibration
    mass, checking the display, initial zero-setting, zero-tracking, Data Storage Device (Alibi Memory),
    service menu via switch on the main board, USB, Ethernet, weighing in carat units, printer to be connected,
    additional display to be connected. Interfaces RS 232, USB 2.0, Ethernet 10/100Mbit comply with OIML
    R76 (2006) 5.3.6 and need not be secured; WiFi available optionally. Valid software version 2.2.2
    (X2) / 4.0.2 (R2), not modifiable after securing/verification.
