  - BCLS-20L
  - BCLS-50L
  - BCLS-100L
  - BCLS-180L
  alternatives: OR
  characteristics:
    selection_rule: >-
      Any compatible load cell with a respective OIML R60 Certificate of Conformity may be used, provided
      the certificate contains the load cell types and data required for the declaration of compatibility
      of modules. A load cell marked NH is allowed only if humidity testing to R76 has been conducted.
      Compatibility is established by the manufacturer by means of the compatibility of modules calculation
      at the time of verification. The load cell transmission must conform to a standard type.
