  module_designation:
  description: >-
    Class III, mains or battery-operated, self-indicating, single or dual-interval, non-automatic weighing
    instrument consisting of a CI-200 Series indicator connected to a weighing platform. The CI-200 Series
    comprises the CI-200A, CI-201A, CI-200S and CI-200SC models. Enclosure: plastic (CI-200A, CI-201A)
    or stainless steel (CI-200S, CI-200SC); display: LED (CI-200A, CI-200S, CI-200SC) or LCD (CI-201A);
    alphanumeric keypad and battery indicators (low, charging). Devices: initial zero setting on power
    up, semi-automatic zero setting, zero tracking (optional), semi-automatic subtractive tare weighing,
    zero-indicator, indication of stable equilibrium, net indicator, gravity compensation, printing, hold
    function, counting mode (CI-201A), percent mode (CI-201A), totalisation (CI-201A), checkweighing (CI-201A
    and CI-200SC). Interfaces: load cell connection, RS232/485, USB. The instruments are not designed
    for direct sales to the public. Software is held in firmware with identification number V1.xx or V2.xx
    (xx reflects non-legally relevant changes); access to legally relevant parameters is prevented by
    a switch on the main board. Access to electronics, the switch and the load cell connection are sealed
    using a tamper-evident method.
