  - CPWE
  - DFW
  - DGT
  - KS
  module_designation: Non-automatic weighing indicators / weight transmitter
  description: >-
    Family of non-automatic weighing indicators and weight transmitters, single-interval or multi-interval
    (up to 3 intervals) and multi-range (up to 3 ranges). Software held in flash memory and not modifiable
    by the user; protected by hardware jumper on the main board or by software sealing with non-editable
    CAL and CONFIG modification counters (password-protected); legally relevant software identified by
    prefix/version with version 01 for all series. Devices include semi-automatic zero setting (≤ 4% Max),
    zero tracking (≤ 4% Max), semi-automatic subtractive tare weighing, pre-set tare, recall of gross
    indication, stability determination/indication, multi-range and multi-interval function, display check,
    printing, alibi storage, gravity compensation, event counters, manual checkweighing, real time clock,
    counting, command via external device, accumulation, battery level indicator, remote control, LCD
    or LED, peak hold (non-legal), and connection to up to 4 load receptors. Protected interfaces: RS-232,
    RS-485, Ethernet, Profibus, Profinet, DeviceNet, CANopen, Ethernet IP, EtherCAT, USB, WiFi, Bluetooth,
    RF, DC voltage input, control inputs/outputs, opto-isolated inputs, Photomosfet outputs, SENSOR digital
    input, analogue output and input. May also be connected to a tilt switch or tilt sensor.
