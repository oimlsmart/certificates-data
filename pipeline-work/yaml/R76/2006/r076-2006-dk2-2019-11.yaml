certified_type:
  category: Indicator
  type_designations:
  - X2
  - X2SS
  module_designation: Non-automatic electronic weighing indicator
  description: >-
    Non-automatic electronic weighing indicator, usable as single-interval, multi-interval or multi-range.
    Approved software version 100913 (displayed by pressing 'M+' during countdown after power up). RS232
    interface. Devices: initial zero setting device (<= 20% of Max), semi-automatic zero setting device
    (<= 4% of Max), zero tracking device (<= 4% of Max), semi-automatic subtractive tare device, gross/net
    display, totalization device, check weighing device, printing device, gravity compensation device;
    indicators for stable equilibrium, zero, gross, net and active range.
