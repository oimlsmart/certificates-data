certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - K...
  module_designation: Not applicable
  description: >-
    Nonautomatic electromechanical weighing instrument for direct sales to the public. The instrument
    consists of a weighing module, comprising the load receptor with or without a lever system, the strain
    gauge load cell and the electronics with an AD-converter for signal processing, and of an incorporated
    indicating device (Touch-Screen) for displaying the weighing results and operating the instrument.
