certified_type:
  category: Indicator
  type_designations:
  - ZK830
  - ZK830-PK0
  module_designation:
  description: >-
    The certified pattern is the Avery Weigh-Tronix ZK830, a self-indicating electronic indicator powered
    from mains (via PSU), DC or an external battery pack, designed to be used as part of a Class III non-automatic
    weighing instrument. It consists of a plastic (ABS) enclosure that may either be mounted to a BSQ
    base or alternatively desk/wall mounted using an optional bracket. An IBN LCD display (black background
    with green digits) is provided. The indicator features 6 operational keys, with an optional ZK830-PK0
    add-on keypad providing 15 additional operational keys including a numeric keypad and LED indicators.
    Load cell input variants: BSQ digital base interface, or a 5 V excitation analogue load cell interface
    option card (allows connection of a second platform, maximum 6 load cells). Interfaces: BSQ digital
    base interface, keypad option interface, 3 logic level inputs, 3 open collector outputs, 2 RS232 serial
    ports, 10/100 Ethernet and USB virtual serial port; optional internal wireless LAN card (802.11b/g).
    Devices: semi-automatic zero setting (max 4% of Max), zero tracking (max 4% of Max), semi-automatic
    subtractive tare weighing, pre-set tare, recall of gross indication when tare is active, determination
    and indication of stability of equilibrium, checking of display, printing, gravity compensation, real
    time clock, command via external device (PC), counting, accumulation, checkweighing, target weighing,
    percentage weighing, and Gross/Net/Tare/Print/Zero/Motion/Over-Under weight/%PCWT/Battery indicators;
    the ZK830-PK0 keypad option additionally provides connection to an additional load receptor with load
    receptor indicator, preset tare indicator, PLUs, piece weight selection and extended indicating. Software
    is designated AWT30-500195 version 1.x.x.x (x.x.x identifies non-legally relevant software that may
    be modified by the manufacturer); calibration and legally relevant parameters are protected via physical
    means (sealed jumper on main board) or software means (password and incrementing counters).
