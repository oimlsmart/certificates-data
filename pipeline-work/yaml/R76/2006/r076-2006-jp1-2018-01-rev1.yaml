  module_designation: Non-automatic weighing instruments
  description: >-
    Class III, self-indicating, multi-interval, non-automatic weighing instrument; not designed for direct
    sales to the public. Devices: semi-automatic zero-setting (≤ 4% of Max), zero-tracking (≤ 4% of Max),
    semi-automatic subtractive tare weighing (T = -Max), preset tare, zero indicator, indication of stable
    equilibrium. Interface: Bluetooth (SJ-..WP-BT and SJ-..AWP-BT models only). Software: legally relevant
    software is version P-1.xx, where x reflects non-legally relevant changes. Sealing: access to the
    load cell, electronics and calibration switch is prevented by a tamper-evident lead and wire type
    seal.
