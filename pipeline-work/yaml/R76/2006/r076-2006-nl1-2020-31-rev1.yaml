certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - BSF
  - BCF
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instrument, single interval or multiple range, composed of indicators ZM305,
    ZM405, ZM615 or Matrix II, an analog digital data processing device (ADPD) Avery Weigh-Tronix ZB210,
    and load cells 740 or 740 D (Técnicas de Electrónica y Automatismos S.A) or HM9B (Zemic). For each
    model, the compatibility of load cells and indicator is established by the manufacturer by means of
    the compatibility of modules form, contained in OIML R76 edition 2006 Annex F.
