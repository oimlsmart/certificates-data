certified_type:
  category: Indicator
  type_designations:
  - G5-PM-S-DC-S
  module_designation: Module indicator
  description: >-
    Module indicator intended to be integrated in a self-indicating, electronic, non-automatic weighing
    instrument. Suitable for a non-automatic self-indicating weighing instrument, Class III, single-interval
    industrial use. Essential characteristics: semi-automatic zero-setting, zero indication, zero-tracking,
    semi-automatic tare balancing, preset tare, printing, data storage device, additional functions which
    facilitate trade and management.
