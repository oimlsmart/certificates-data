  category: Non-automatic weighing instrument
  type_designations:
  - B Series
  - BPS
  - BRS
  - BLS
  module_designation: >-
    MARKET-30, TOP-A3, D24, TOP-B3, MAST, TOP-X3, TOP-A1, TOP-A4, TOP-B1, TOP-B4, TOP-X1, TOP-X4, MARKET-30T,
    TOP-A5, D24-T, TOP-B5, MAST-T, TOP-X5, SMART, ROMBI
  description: >-
    The B Series comprises a BPS indicator (model) connected to a range of load cells to form a family
    of Class III, mains or battery-operated, self-indicating, single or dual-interval, non-automatic weighing
    instruments. The BPS indicator may be designated as the BPS and their variants, BRS and BLS models
    depending upon the construction. The instrument may be used for direct sales to the public. Construction:
    plastic enclosure; plastic/stainless steel load receptor; dual, integral or pole-mounted LCD/LED display;
    operator keypad; integral printer (optional); level indicator. Devices: initial zero setting device,
    semi-automatic zero setting device, zero tracking (optional), zero indicator, stable weight indicator,
    semi-automatic additive or subtractive tare weighing, tare indicating, preset tare, gravity compensation,
    printing (optional), price-computing (weighed and non-weighed items), Price Look Up (PLU), price-labelling
    configuration (printing below Min not allowed), memory storage of transactions. Interfaces: USB, Ethernet,
    RS232; may be connected to an Electronic Point of Sale (EPOS), Electronic Cash Register (ECR) or Electronic
    Fund Transfer (EFT/ECU). Sealing: access to the electronics, load cell and calibration switch prevented
    by a tamper-evident wire and seal solution. Software held in firmware with identification number V02.xx.xx;
    access to legally relevant parameters and download of software only possible via the calibration switch
    on the main board. No authorised alternatives.
