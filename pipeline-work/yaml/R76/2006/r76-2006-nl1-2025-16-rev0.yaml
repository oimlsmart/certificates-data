  - accuracy_class: "(II)"
    model: EXR and EXP
    maximum_capacity: Max ≤ 3.1 kg
    maximum_capacity_counts: Max ≤ 15500 ct
    verification_scale_interval: e ≥ 10 mg; e ≥ 0.05 ct
    actual_scale_interval: e = d, e = 10 d
    weighing_range: Single interval
    maximum_number_of_scale_intervals: n ≤ 62000
    tare: T ≤ -Max
    temperature_range: "+10°C / +30°C"
