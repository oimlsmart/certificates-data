    verification_scale_interval: e ≥ 100 mg; e ≥ 0.5 ct
    actual_scale_interval: e = d, e = 10 d
    weighing_range: Single interval
    maximum_number_of_scale_intervals: n ≤ 82000
    tare: T ≤ -Max
    temperature_range: "+10°C / +30°C"
    power_supply: 100 – 240 V AC 50/60 Hz to 12 V DC (by external AC/DC plug-in power supply)
    balance_software_version: 1.xx (Terminal) / 1.xx (EXP or EXR base)
