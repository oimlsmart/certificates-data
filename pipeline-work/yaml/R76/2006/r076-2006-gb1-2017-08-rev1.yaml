certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - WM-AI
  - IP-AI
  module_designation:
  description: >-
    The WM-AI model is a Class III, self-indicating, dual-interval, non-automatic weighing instrument
    with wrapping and label printing devices. The IP-AI model is a weigh-price labelling instrument with
    similar characteristics and operation, but without the wrapping function. The instruments are not
    designed for direct sales to the public. Weighing module mounted in the in-feed conveyor section within
    a stainless steel framework; load cell mounted in an enclosed housing; LCD touch screen display and
    keyboard; up to three thermal label printers/applicators; wrapping device (WM-AI) with up to two film
    rolls; interfaces: Ethernet, USB. Devices: initial zero setting, semi-automatic zero setting, zero
    tracking, zero indicator, net indicator, semi-automatic subtractive tare, preset tare, gravity compensation,
    price-computing, PLUs. Access to the load cell, electronics and calibration switch is prevented by
    a tamper-evident seal.
