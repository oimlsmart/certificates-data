certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL3500 Series
  - CL3500-B
  - CL3500-P
  - CL5200-B
  - CL5200-P
  module_designation: Not applicable
  description: >-
    Family of Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Construction: plastic housing, operator's
    keypad, stainless steel load receptor, level indicator, integrated printer; displays: front and rear
    LCD (CL3500-B) or pole-mounted double-sided LCD (CL3500-P). Devices: initial zero setting device (up
    to 20% of Max), semi-automatic zero setting device (up to 4% of Max), zero tracking device (up to
    4% of Max), zero indicator, net indicator, stable weight indicator, semi-automatic subtractive tare
    balancing device, preset tare, gravity compensation, price-computing, totalisation (including non-weighed
    items), PLU, fixed weight labelling, multi-vendor operation, calibration/set-up mode via sealed internal
    switch, self-service operation. Interfaces: RS232C, PS/2, cash drawer, Ethernet, wireless LAN, USB.
    The instruments may also be designated the CL5200 series, comprising the CL5200-B and CL5200-P models.
