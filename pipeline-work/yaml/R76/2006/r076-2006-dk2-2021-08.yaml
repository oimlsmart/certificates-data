certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DSW-100
  - DSW-100C
  - DSW-100E
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    The DSW-100C has a 6-digit LCD display with appropriate indicators. The DSW-100E has two of the same
    display, one in the front and one in the rear. Interfaces: RS232, USB. Devices include initial zero
    setting device, semi-automatic zero setting device, zero tracking device, zero indicator, net indicator,
    stable weight indicator, semi-automatic subtractive tare balancing device, unit selection, gravity
    compensation, and calibration/set-up mode via sealed internal switch. Software version displayed at
    power up. Sealing by wire and seal covering access to the calibration switch, electronics and load
    cell connection.
