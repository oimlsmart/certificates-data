certified_type:
  category: Non-automatic weighing indicator
  type_designations:
  - BX222
  module_designation: Non-automatic weighing indicator
  description: >-
    Non-automatic weighing indicator for single-interval, multi-interval (up to 3 intervals) and multi-range
    (up to 3 ranges) applications. Devices include semi-automatic zero-setting, automatic zero-tracking,
    initial zero-setting, semi-automatic subtractive tare, semi-automatic tare, automatic tare, auto-clear
    tare, preset tare, temporary gross indication, extended resolution, optional check weighing, inbound/outbound
    weighbridge weighing, external and automatic printing, and optional classifying, filling, packing,
    calculated volume, alibi memory, tilt switch input, piece counting and gravity compensation. Interfaces:
    RS-232, RS-485; optional digital input/outputs or analogue outputs; optional Modbus RTU, Modbus TCP,
    Ethernet, Profinet, Profinet S2, Profibus, CANopen, EtherNet/IP, EtherCAT, CC-Link, Powerlink, IoT,
    CC-Link IE; optional Bluetooth or WiFi. Software format XX.YY, where XX is the revision of the legally
    relevant functionality and YY is the sub-revision number.
