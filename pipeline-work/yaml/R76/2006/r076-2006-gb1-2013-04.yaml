certified_type:
  category: Indicator
  type_designations:
  - WE2111
  description: >-
    WE2111 digital indicator designed to be used as part of a single/dual range/interval, Class III non-automatic
    weighing instrument. Self-indicating, DC or mains-powered. ABS plastic enclosure, six-digit LED display,
    five function keys, weighing status, multiple range/interval status, connections and ports at the
    rear. Model WE2111 is compatible with the C510 model as detailed in the associated test reports. Devices:
    extended indicating device, printing device, totalising device, initial zero setting device, zero
    tracking device, semi-automatic zero setting device, tare setting device (semi-automatic, additive
    and subtractive), preset tare device, multi-range device, multi-interval device, lb/kg switching device,
    gross/net switching device, calibration device, piece counting device, fault handling device, display
    test device (on power up), alibi memory device, zero indicator, indication of stable equilibrium.
    Interfaces: 6-wire load cell connection, DC voltage input, 2 x RS-232, RS-485, control inputs/outputs,
    2 x USB (host and slave), 2 x UARTs, 2 x IIC (optional accessory), Ethernet.
