matrix_tables:
- name: Characteristics of the non-automatic weighing instrument
  columns:
  - characteristic
  - as_r2_as_x2
  - ps_r2_ps_x2
  column_units:
  -
  -
  -
  rows:
  - characteristic: accuracy_class
    as_r2_as_x2: I
    ps_r2_ps_x2: II
  - characteristic: maximum_capacity
    as_r2_as_x2: Max ≤ 310 g, or Max ≤ 1550 ct
    ps_r2_ps_x2: Max ≤ 6000 g, or Max ≤ 30000 ct
  - characteristic: verification_scale_interval
    as_r2_as_x2: e ≥ 1 mg, or e ≥ 0.01 ct
    ps_r2_ps_x2: e ≥ 10 mg, or e ≥ 0.1 ct
  - characteristic: actual_scale_interval
    as_r2_as_x2: e = d, or e = 10 d, or e = 100 d
    ps_r2_ps_x2: e = d, or e = 10 d, or e = 100 d
  - characteristic: weighing_ranges
    as_r2_as_x2: Single interval
    ps_r2_ps_x2: Single interval, or Multiple range
  - characteristic: maximum_number_of_scale_intervals_one_weighing_range
    as_r2_as_x2: n ≤ 310000 divisions
    ps_r2_ps_x2: n ≤ 100000 divisions
  - characteristic: maximum_number_of_scale_intervals_multiple_range
    as_r2_as_x2:
    ps_r2_ps_x2: n ≤ 20000 divisions (per weighing range)
  - characteristic: maximum_number_of_weighing_ranges
    as_r2_as_x2:
    ps_r2_ps_x2: '2'
  - characteristic: tare
    as_r2_as_x2: T ≤ -Max
    ps_r2_ps_x2: T ≤ -Max
  - characteristic: temperature_range
    as_r2_as_x2: "+10 °C / +40 °C"
    ps_r2_ps_x2: "+10 °C / +40 °C"
  - characteristic: power_supply_voltage
    as_r2_as_x2: 100 – 240 V AC 50/60 Hz
    ps_r2_ps_x2: 100 – 240 V AC 50/60 Hz
  - characteristic: software_identification
    as_r2_as_x2: 'Version numbers for weighing firmware: 2.2.1 (for X2 models), 4.0.1 (for R2 models)'
    ps_r2_ps_x2: 'Version numbers for weighing firmware: 2.2.1 (for X2 models), 4.0.1 (for R2 models)'
  description: >-
    Characteristics table spanning two type groups: AS...R2.../AS...X2... (accuracy class I) and PS...R2.../PS...X2...
    (accuracy class II). The maximum number of scale intervals for multiple range applies per weighing
    range.
  footnotes: []
