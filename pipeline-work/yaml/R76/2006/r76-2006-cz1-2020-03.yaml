certified_type:
  category: Indicator
  type_designations:
  - PUE 7.1
  module_designation: Indicator for non-automatic weighing instruments
  description: >-
    Electronic indicator for non-automatic weighing instruments of accuracy class III. Can be used as
    a terminal according to point T.2.2 of OIML R 76 (2006), with external weighing modules connected
    via a digital interface; the accuracy class of the weighing instrument is then determined by the connected
    weighing module, provided the instrument does not use the measuring function of the indicator. Suitable
    for multi range weighing instruments. Plastic housing with 5.7" TFT display with resistive touch panel.
