certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MS4400I
  - M-310
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instrument, single interval, class III. Single range instrument. Principle
    of measurement: the analogue signal from one load cell is amplified and converted to a digital value.
    Functions: indication stabilization device; semi-automatic zero setting up to 4% Max; zero tracking;
    subtractive tare up to -Max; zero indication; gravity compensation feature; at overload over 9e the
    indicator displays 'Err'. Interface: Bluetooth (optional). Embedded software in IC, cannot be modified
    or uploaded via any interface; software version P 1.xx (xx is a number between 01~99). Secured by
    sealing of the main plate and a seal over the calibration test pin; event counter displayed after
    pressing the ON/OFF/ZERO key and contained in the inscriptions; gravity compensation mode secured
    with password and event counter.
