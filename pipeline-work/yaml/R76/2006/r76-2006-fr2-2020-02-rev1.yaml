certified_type:
  category: Indicator
  type_designations:
  - X241-B
  - X1104-TG
  - X241-TR
  - X241-PMNET
  - X1104-TR
  module_designation: Electronic indicator
  description: >-
    The indicator type X241-B is an electronic module with digital indication, intended to be integrated
    in a weighing instrument for regulated uses including or not direct sales to the public (DSP). The
    X241-B type indicator module systematically consists of a terminal + transmitter combination, which
    may be in the form of a single box or two. Where there are additional transmitters, they must be identified
    individually. With the X1104-TG terminal (from software version 3.4.z), X241-B can also calculate
    the algebraic sum of the values from up to 8 measurement channels, from a dedicated module per channel.
