components:
- role: terminal
  type_designations:
  - X1104-TG
  alternatives:
  characteristics:
    description: >-
      I410 terminal. From software version 3.4.0, this terminal can define a specific channel allowing
      the calculation of the algebraic sum of values from up to 8 measurement channels.
    software_identification: V3
- role: transmitter
  type_designations:
  - X241-TR
  alternatives: OR
  characteristics:
    description: Analog transmitter
    software_identification: V1 or 3
- role: transmitter
  type_designations:
  - X241-PMNET
  alternatives: OR
  characteristics:
    description: Digital transmitter, works only with the digital load cell type X970-C
    software_identification: V1
- role: transmitter
  type_designations:
  - X1104-TR
  alternatives: OR
  characteristics:
    description: >-
      Summation transmitter. Connected to minimum 2 digital or 2 analog transmitters; it manages a weighing
      channel gathering the signals from every load cell connected to the other weighing channels.
    software_identification: V1
