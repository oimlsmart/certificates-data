certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MS-XXXX Series
  - MS-4200
  - MS-4201
  - MS-4202L
  - MS-5900
  module_designation: Not applicable
  description: >-
    Family of Class III non-automatic weighing instruments for weighing persons, comprising the MS-4200,
    MS-4201, MS-4202L and MS-5900. LCD display fitted into the load receptor (5 digits, with Zero, Net
    and Hold indicators). Aluminium base enclosure containing the load cell and electronics; plastic load
    receptor with optional additional tray for baby weighing; level indicator next to the display; four
    adjustable feet for levelling. Devices: initial zero setting device, semi-automatic zero setting device,
    zero tracking device, zero indicator, net indicator, semi-automatic subtractive tare balancing device,
    hold facility, hold indicator, gravity compensation. Interfaces: Bluetooth, and USB (MS-5900 only).
    Software version P-2.xx. Sealing: access to the load cell, electronics and calibration download switches
    secured via a tamper-evident solution bearing a securing mark (manufacturer's mark or official verification
    officer's mark).
