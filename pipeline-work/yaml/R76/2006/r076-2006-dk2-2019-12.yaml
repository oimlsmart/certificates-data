certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - WE
  - CSQ
  - PC1
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    Non-automatic electronic weighing instruments of types WE, CSQ and PC1, single-interval, multi-interval
    or multi-range, accuracy class III. Devices: initial zero setting device, semi-automatic zero setting
    device, zero tracking device, semi-automatic subtractive tare balancing device, preset tare device
    (CSQ only), gross/net display (WE only), totalization device (CSQ and PC1; PC1 only when printer connected),
    counting device (CSQ and WE), printing device, gravity compensation device, and stable equilibrium,
    zero, gross, net and active range indicators. RS232 interface.
