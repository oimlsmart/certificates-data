matrix_tables:
- name: Characteristics of the indicator / terminal
  columns:
  - attribute
  - analog_load_cells
  - digital_load_cells_canbus_interface
  - digital_load_cells_sicspro_interface
  rows:
  - attribute: accuracy_class
    analog_load_cells: III or IIII
    digital_load_cells_canbus_interface: III or IIII
    digital_load_cells_sicspro_interface: I, II, III or IIII
  - attribute: weighing_ranges
    analog_load_cells: Single interval
    digital_load_cells_canbus_interface: Single interval
    digital_load_cells_sicspro_interface: Single interval, Multi-interval, Multiple range
  - attribute: max_number_of_scale_intervals_one_weighing_range
    analog_load_cells: n ≤ 10000 divisions
    digital_load_cells_canbus_interface: n ≤ 10000 divisions
    digital_load_cells_sicspro_interface: n ≤ 1000000 divisions
  - attribute: max_number_of_scale_intervals_multi_interval_or_multiple_range
    analog_load_cells:
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface: n ≤ 100000 divisions (per (partial) weighing range)
  - attribute: max_number_of_weighing_ranges
    analog_load_cells: 1
    digital_load_cells_canbus_interface: 1
    digital_load_cells_sicspro_interface: 3
  - attribute: load_cell_excitation_voltage
    analog_load_cells: 5 V DC
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface:
  - attribute: minimum_signal_input_voltage
    analog_load_cells: Umin = 0 mV
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface:
  - attribute: load_cell_power_supply
    analog_load_cells:
    digital_load_cells_canbus_interface: 12 V DC
    digital_load_cells_sicspro_interface: 12 V DC
  - attribute: minimum_input_voltage_per_verification_scale_interval
    analog_load_cells: 0.3 µV
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface:
  - attribute: minimum_load_cell_resistance
    analog_load_cells: 43 Ω
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface:
  - attribute: maximum_load_cell_resistance
    analog_load_cells: 1245 Ω
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface:
  - attribute: fraction_of_maximum_permissible_error
    analog_load_cells: 0.5
    digital_load_cells_canbus_interface: 0
    digital_load_cells_sicspro_interface: 0
  - attribute: load_cell_connection
    analog_load_cells: 6-wire (remote sensing)
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface:
  - attribute: max_cable_length_per_cross_wire_section
    analog_load_cells: 1571 m/mm²
    digital_load_cells_canbus_interface:
    digital_load_cells_sicspro_interface:
  - attribute: temperature_range
    analog_load_cells: "-10 °C / +40 °C"
    digital_load_cells_canbus_interface: "-10 °C / +40 °C"
    digital_load_cells_sicspro_interface: "-10 °C / +40 °C"
  - attribute: power_supply_voltage
    analog_load_cells: >-
      100 – 240 V AC 50 - 60 Hz (only for Harsh version), 20 - 28 V DC (for all versions) (not suitable
      for a road vehicle power supply)
    digital_load_cells_canbus_interface: >-
      100 – 240 V AC 50 - 60 Hz (only for Harsh version), 20 - 28 V DC (for all versions) (not suitable
      for a road vehicle power supply)
    digital_load_cells_sicspro_interface: >-
      100 – 240 V AC 50 - 60 Hz (only for Harsh version), 20 - 28 V DC (for all versions) (not suitable
      for a road vehicle power supply)
  description: >-
    Columns distinguish the connected load cell / weighing module type: analog load cells, or digital
    load cells / weighing modules via CANbus or SICSPro interface.
  footnotes: []
