matrix_tables:
- name: Characteristics of the non-automatic weighing instrument
  description: >-
    Transposed table: original rows are characteristics, original columns are the four instrument variants.
    Class II variants additionally specify carat (ct) ranges.
  columns:
  - characteristic
  - class_I_500_620_g
  - class_I_5000_6200_g
  - class_II_1200g_15kg
  - class_II_21_31kg
  rows:
  - characteristic: accuracy_class
    class_I_500_620_g: "(I)"
    class_I_5000_6200_g: "(I)"
    class_II_1200g_15kg: "(II)"
    class_II_21_31kg: "(II)"
  - characteristic: maximum_capacity
    class_I_500_620_g: 500 g ≤ Max ≤ 620 g
    class_I_5000_6200_g: 5000 g ≤ Max ≤ 6200 g
    class_II_1200g_15kg: 1200 g ≤ Max ≤ 15 kg / 6000 ct ≤ Max ≤ 75000 ct
    class_II_21_31kg: 21 kg ≤ Max ≤ 31 kg / 100000 ct ≤ Max ≤ 150000 ct
  - characteristic: verification_scale_interval
    class_I_500_620_g: e = 0.01 g
    class_I_5000_6200_g: e = 0.1 g
    class_II_1200g_15kg: 0.1 g ≤ e ≤ 2 g / 1 ct ≤ e ≤ 5 ct
    class_II_21_31kg: 1 g ≤ e ≤ 5 g / e = 5 ct
  - characteristic: actual_scale_interval
    class_I_500_620_g: e = d, or e = 10 d
    class_I_5000_6200_g: e = d, or e = 10 d
    class_II_1200g_15kg: e = d, or e = 10 d
    class_II_21_31kg: e = d, or e = 10 d
  - characteristic: weighing_range
    class_I_500_620_g: Single interval
    class_I_5000_6200_g: Single interval
    class_II_1200g_15kg: Single interval
    class_II_21_31kg: Single interval
  - characteristic: maximum_number_of_scale_intervals_one_weighing_range
    class_I_500_620_g: n ≤ 62000
    class_I_5000_6200_g: n ≤ 62000
    class_II_1200g_15kg: n ≤ 42000
    class_II_21_31kg: n ≤ 31000
  - characteristic: tare
    class_I_500_620_g: T ≤ -Max
    class_I_5000_6200_g: T ≤ -Max
    class_II_1200g_15kg: T ≤ -Max
    class_II_21_31kg: T ≤ -Max
  - characteristic: temperature_range
    class_I_500_620_g: 10 °C / 30 °C
    class_I_5000_6200_g: 10 °C / 30 °C
    class_II_1200g_15kg: 10 °C / 30 °C
    class_II_21_31kg: 10 °C / 30 °C
  - characteristic: power_supply_voltage
    class_I_500_620_g: 100-240 V AC 50/60 Hz / 12 V DC by AC/DC plug-in power supply
    class_I_5000_6200_g: 100-240 V AC 50/60 Hz / 12 V DC by AC/DC plug-in power supply
    class_II_1200g_15kg: 100-240 V AC 50/60 Hz / 12 V DC by AC/DC plug-in power supply
    class_II_21_31kg: 100-240 V AC 50/60 Hz / 12 V DC by AC/DC plug-in power supply
  - characteristic: software_identification_checksum
    class_I_500_620_g: '5112'
    class_I_5000_6200_g: '5112'
    class_II_1200g_15kg: '5112'
    class_II_21_31kg: '5112'
  footnotes:
  - Carat (ct) indication function is not available for GBN series.
