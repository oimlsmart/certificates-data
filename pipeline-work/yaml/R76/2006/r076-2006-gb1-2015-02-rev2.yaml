certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XS Series
  - XS 500
  module_designation: Not applicable
  description: >-
    The Avery Berkel XS Non-Automatic Weighing Instrument is a mains-powered, Class III, price-computing,
    stand-alone instrument intended for direct sales to the public. It comprises a vendor's keyboard (23
    fixed keys and up to 59 programmable keys), a vendor's backlit LCD display (up to four numeric fields,
    one alphanumeric field and several annunciators), an identical customer's backlit LCD display, an
    integrated printer using a thermal print head, a two-piece plastic housing containing the load cell
    and electronics, a stainless steel load receptor, and a level indicator.
