certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Spirit Select
  module_designation: Not applicable
  description: >-
    Hospital bed incorporating a Class III, mains operated, self-indicating, non-automatic weighing instrument.
    Main frame supported by four load cells located in the corners; main frame fitted on four wheels with
    adjustable height; mattress deck with articulated head/knee/foot sections; footboard with user interface
    (operator keypad and LCD display); head board and side rails with operator keypads. Devices: combined
    zero setting and tare balancing, change equipment function, zero indicator, net indicator, weighing
    window interlocks, sleep mode, extended indication (0.01 kg resolution on command or for up to 5 s).
