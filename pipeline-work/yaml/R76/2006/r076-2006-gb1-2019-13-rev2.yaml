certified_type:
  category: Non-automatic weighing instrument (hospital bed)
  type_designations:
  - FL36-SC
  - 200-0000
  module_designation:
  description: >-
    Umano Medical hospital beds FL36-SC series (brand names OOK<Snow>, OOK<Snow>MH and OOK<Cocoon>) and
    200-0000 series (brand name Ook Snow ALL), incorporating a Class III, mains operated, self-indicating
    non-automatic weighing instrument. Height and surface contours of the bed are adjustable; bed includes
    movable and latchable siderails and control boards. Weighing control and display functions on the
    footboard with TFT-LCD touch screen; four load cells at the four corner positions of the bed base.
    The hospital bed shall not be used for direct sales to the public.
