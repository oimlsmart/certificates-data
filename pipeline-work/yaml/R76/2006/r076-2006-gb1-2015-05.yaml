certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Magellan 9300i
  - Magellan 9400i
  module_designation: Not applicable
  description: >-
    Magellan 9300i or Magellan 9400i scanner/scale (models 939404 and 939406), Class III, mains operated,
    self-indicating, weight only, single or dual interval, Non-Automatic Weighing Instrument designed
    for direct sales to the public. Diecast base unit supports the load cell, barcode scanner assembly,
    main board and analogue boards; steel L-shaped load receptor mounted on four supporting points of
    the scale sub-assembly. Designed to be flush-mounted in a fixed position in a checkout surface; may
    be fitted with a level indicator. Devices: initial zero setting device, semi-automatic zero setting
    device, zero tracking device, automatic zero setting device, zero indicator, gravity compensation.
    Interfaces: POS terminal (RJ10), remote display (RJ4), scale host (RJ10), auxiliary port (RJ10), EAS
    port (RJ45), power (Molex 3 pin), USB, image port. Legally relevant parameters stored in EEPROM with
    software identification version numbers 1-70-28 and 2-0-0; calibration mode access only via a switch
    behind a sealing cap; tamper-evident securing of EEPROM, calibration switch and load cell.
