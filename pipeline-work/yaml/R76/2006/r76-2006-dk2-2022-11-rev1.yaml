certified_type:
  category: Indicator
  type_designations:
  - HIW0x
  - HIW0xSS
  - HIC0x
  - HIP0x
  - HCS0x
  module_designation: Non-automatic weighing indicator
  description: >-
    Non-automatic weighing indicators approved as single-interval, multi-interval (dual) and multirange
    (dual) instruments. Devices: initial zero setting device (≤ 20% of Max); semi-automatic zero setting
    device (≤ 4% of Max); zero tracking device (≤ 4% of Max); semi-automatic subtractive tare weighing
    device; printing; stable equilibrium, zero and net indicators; totalization; counting; option for
    battery operation. Interfaces: RS-232C, Ethernet, RS485, Bluetooth, USB, WiFi, 4-20 mA / 0-10 V analogue
    output, digital output via relay; the interface does not have to be secured. Approved software version
    is displayed at power up.
