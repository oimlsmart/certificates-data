certified_type:
  category: Weighing instrument
  type_designations:
  - WM-AI
  - IP-AI
  module_designation:
  description: >-
    The WM-AI model is a Class III, self-indicating, dual-interval, non-automatic weighing instrument
    with wrapping and label printing devices. The IP-AI model is a weigh-price labelling instrument with
    similar characteristics and operation, but without the wrapping function. The instruments are not
    designed for direct sales to the public. Construction: weighing module mounted in the in-feed conveyor
    section within a framework of fabricated stainless steel; load cell mounted in an enclosed housing
    supporting the weighing module; user display and control interface comprising LCD touch screen display
    and keyboard; thermal label printers / applicators (maximum three printers); wrapping device (WM-AI,
    maximum two film rolls). Devices: initial zero setting device, semi-automatic zero setting device,
    zero tracking device, zero indicator, net indicator, semi-automatic subtractive tare weighing device,
    preset tare device, gravity compensation, price-computing, PLUs, wrapping (WM-AI) and labelling (WM-AI
    and IP-AI) devices. Interfaces: Ethernet, USB. Construction variants: WM-AI fitted with an in-feed
    conveyor; additional under pack label printer / applicator fitted into the out-feed conveyor section
    for application of a product traceability scheme label to the underside of the product; WM-AI with
    the printer mounted on the outside of the cabinet, in which case the product label is applied manually;
    IP-AI fitted with an additional label printer. Legally relevant software: scale software J0776x (protected
    via physical seal on calibration switch), scale driver J0834x (changes recorded in audit trail), updater
    J0835x (changes recorded in audit trail); 'x' covers minor updates.
