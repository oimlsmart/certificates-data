certified_type:
  category: Indicator
  type_designations:
  - P1411-B
  module_designation: Indicator
  description: >-
    Module indicator type P1411-B is a separate module intended to be integrated in a non automatic weighing
    instrument. It appears as a box made of composite material that may be associated with or separated
    from the load receptor of a complete instrument. It is intended to be connected to a weighing channel
    comprising strain gauge load-cells with analogue output. It performs analogue to digital conversion
    of the signal coming from the load-cells as well as the digital processing of data.
