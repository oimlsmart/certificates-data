certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - APP
  - APW
  - APC
  - LPP
  - LPW
  - LPC
  module_designation: Non-automatic weighing instrument
  description: >-
    Family of electronic non-automatic weighing instruments. APP/LPP are price computing scales intended
    for sales to the public; APW/LPW are intended for weighing; APC/LPC are intended for counting. Available
    as single-interval, dual-range or dual-interval instruments. Software separation: legally relevant
    software version 1.11, 1.12 or 2.00; application software version 1.xx(y) (xx = 00 to 99, y = a to
    z or blank). Devices: semi-automatic zero-setting (±2% of Max), automatic zero-tracking (±2% of Max),
    initial zero-setting (±10% of Max), semi-automatic subtractive tare, semi-automatic tare, preset tare,
    extended resolution (APW/LPW/APC/LPC), price look-up table (PLU), unit weight look-up table, totalization
    (APP/LPP), check weighing device (APW/LPW/APC/LPC), percentage weighing (APW/LPW), printing (external
    printer connected to interface), counting device (APC/LPC), gravity compensation. Interfaces: RS-232
    (standard); USB, Ethernet, Wi-Fi, Bluetooth and RJ11 cashdrawer (optional).
