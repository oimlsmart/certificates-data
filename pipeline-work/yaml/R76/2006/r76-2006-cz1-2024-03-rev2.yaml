certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AS xxx.X7.yyy
  - PS xxx.X7.yyy
  - PS xxx.X7.M.yyy
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instrument, single range or multi range (multi range concerns PS xxx.X7.yyy
    only). Compact construction with display and weighing part. xxx = maximum range, yyy = optional design.
    The certificate covers two hardware versions: hardware version 1 (from the original certificate) and
    hardware version 2 (added in Revision 2, implemented in AS xxx.X7.yyy and PS xxx.X7.M.yyy only). Instruments
    operate on a Linux-based closed shell system with DSD alibi memory.
