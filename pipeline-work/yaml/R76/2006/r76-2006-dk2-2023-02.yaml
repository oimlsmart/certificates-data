certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CT100N series
  module_designation: Non-automatic weighing instrument
  description: >-
    CAS CT100N series non-automatic weighing instrument with label printing, available as single-interval
    or multi-interval (dual) versions. Devices: initial zero setting device (≤ 20% of Max), semi-automatic
    zero setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), semi-automatic subtractive
    tare weighing device, preset tare, label printing, multi-vendor operation, stable equilibrium/zero/net
    indicators, gravity compensation, PLU tables, totalization. Interfaces: RS232C, cash drawer, USB Device,
    USB Host, RS485, ZigBee, wired LAN, wireless LAN; the interfaces do not have to be secured. Software
    designated YYV1xxZ or YYV2xxZ (displayed at power up), where xx reflects non-legally relevant changes,
    YY is a 2-digit country code and Z is a function code.
