  module_designation: Non-automatic electronic weighing instrument
  description: >-
    Single interval, dual multi-interval or dual multi-range weighing instrument. Devices: initial zero
    setting device (≤ 20% of Max), semi-automatic zero setting device (≤ 4% of Max), zero tracking device
    (≤ 4% of Max), semi-automatic subtractive tare balancing device, preset tare, gravity compensation
    device, stable equilibrium, Zero, Net and active range indicators. Interfaces: RS232, USB, Ethernet,
    cash drawer, WiFi (optional).
