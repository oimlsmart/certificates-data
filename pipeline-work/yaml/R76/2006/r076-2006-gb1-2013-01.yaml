certified_type:
  category: Indicator
  type_designations:
  - XK3190-A12
  - XK3190-A12E
  description: >-
    Class III weighing indicator, powered from an AC/DC power supply, with built-in rechargeable 6 V/2.8
    Ah battery. Enclosure made from composite material in two screwed halves. Features: initial zero setting
    device on power up, semi-automatic zero setting device, zero tracking device, semi-automatic tare
    balancing device, subtractive tare device, tare indicating, zero indicating, counting, accumulating.
    Units function is disabled under this certificate so the instrument can only display weight in kg.
