certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - ZP900 Series
  - BSQ Series
  description: >-
    Family of Class III, mains, DC or battery-powered, self-indicating non-automatic weighing instruments
    (also usable as postal scales), built from Avery Weigh-Tronix BSQ Series digital bases (two-part cast
    aluminium painted enclosure, load bridge, stainless steel or aluminium weighing pan, digital load
    cell assembly type LP FPGA QDT, adjustable feet, level indicator) connected to a ZP900 series indicator
    and optionally a ZP900 series remote display. May be used for direct sales to the public. Devices:
    initial zero setting (≤ 4% Max), semi-automatic zero setting (≤ 4% Max), zero tracking (≤ 4% Max),
    single or multi-range operation (maximum of 3 partial ranges), determination and indication of stability
    of equilibrium, checking of display, gross/zero/motion/Ethernet/battery indicators, range-in-use indicators
    (multi-range variant). Sealing: jumper on ZP900 indicator main board, or software sealing via non-editable
    CALIB and CONFIG counters with password-protected access, or hardware sealing with destructible paper
    seal.
