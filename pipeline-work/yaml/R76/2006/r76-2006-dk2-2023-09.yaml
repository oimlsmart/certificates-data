certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - M2400-P03
  module_designation: Non-automatic weighing instrument
  description: >-
    Built-for-purpose class III self-indicating electronic weighing instrument with single-interval indication
    or dual or triple weighing ranges. Consists of an electronic indicator module, type M2400-P03, connected
    to one or two separate and suitable load receptor module(s). It has the possibility to perform price
    calculation, but it may not be used for direct sale to the public. The name of the instrument may
    be followed by alphanumeric characters for technical, legal or commercial characterization.
