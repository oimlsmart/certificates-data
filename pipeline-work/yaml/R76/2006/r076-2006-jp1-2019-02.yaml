certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AD-6106 series
  - AD-6107 series
  - AD-6106R
  - AD-6107R
  module_designation: Non-automatic weighing instruments
  description: >-
    Class III, self-indicating, non-automatic weighing instrument; the instruments are not designed for
    direct sales to the public. Devices: initial zero-setting device (max 10% of Max), semi-automatic
    zero-setting device (max 4% of Max), zero-tracking device (max 4% of Max), semi-automatic subtractive
    tare weighing device, preset tare device, zero indicator, indication of stable equilibrium device.
    Interfaces: serial data interface RS232C (to connect printer), Bluetooth (to connect personal computer).
    Sealing: access to the load cell, electronics and calibration switch is prevented by sealing the enclosure
    using a tamper-evident method.
