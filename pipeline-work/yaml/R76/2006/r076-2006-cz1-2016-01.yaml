certified_type:
  category: Indicator
  type_designations:
  - PUE HY10
  module_designation: Not applicable
  description: >-
    Electronic indicator for non-automatic weighing instruments of accuracy class II and III, tested as
    a part of a weighing instrument. Maximum number of verification scale intervals n ≤ 6000; can be used
    for multi range weighing instruments; temperature range -10°C/+40°C. Stainless steel housing with
    10.1" TFT display with resistive touch panel; additional platform can be attached. Devices and functions:
    multi range, determination of stability of equilibrium, indication of stable equilibrium, zero indicator,
    initial zero setting ≤ 20% Max, zero tracking ≤ 4% Max, automatic zero setting, semi-automatic zero
    setting, semi-automatic tare balancing (subtractive), calibration and set-up mode via switch on the
    main board, gravity factor set up, alibi memory. Interfaces: 2 × RS232, 2 × USB, Ethernet, 4IN/4OUT
    (per EN45501 5.3.6.1). List of additional modules: add. RS232, 4IN/4OUT (gland), 12IN/12OUT (gland),
    analog outputs (gland), PROFIBUS, RS485, CAN, Profinet, WiFi, external power supply. Optional memory
    module (Alibi memory) with embedded micro SD card per WELMEC 2.5 guideline, software running on Windows
    Embedded Compact 7, parameters per Test Report No. 6014-PT-S0027-10.
