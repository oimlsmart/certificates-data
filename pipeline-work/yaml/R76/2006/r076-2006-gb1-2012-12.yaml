certified_type:
  category: Indicator
  type_designations:
  - C510
  description: >-
    C510 digital indicator designed to be used as part of a single/dual range/interval, Class III non-automatic
    weighing instrument. Self-indicating, DC or mains-powered. Features: ABS plastic enclosure, six-digit
    LED display, five function keys, weighing status, multiple range/interval status, connections and
    ports located at the rear. Devices: extended indicating device, printing device, totalising device,
    initial zero setting device (≤ 20% of Max), zero tracking device (≤ 4% of Max), semi-automatic zero
    setting device (≤ 4% of Max), tare setting device (semi-automatic, additive and subtractive), preset
    tare device, multi-range device, multi-interval device, lb/kg switching device, gross/net switching
    device, calibration device, piece counting device, fault handling device, display test device (on
    power up), alibi memory device, zero indicator, indication of stable equilibrium. Interfaces: 6-wire
    load cell connection, DC voltage input, 2 x RS-232, RS-485, control inputs/outputs, 2 x USB (host
    and slave), 2 x UARTs, 2 x IIC (optional accessory), Ethernet.
