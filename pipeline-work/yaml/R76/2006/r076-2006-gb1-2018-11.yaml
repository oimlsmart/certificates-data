certified_type:
  category: Indicator
  type_designations:
  - RW-5002PL
  - RW-5000 Series
  module_designation: Digital indicating device
  description: >-
    The RW-5002PL digital indicating device (part of the RW-5000 Series) connected to two independent
    weighing platforms (weigh pads) to form a single or dual-interval, Class III or IIII, weighing instrument.
    Portable, self-indicating and battery-powered; shall not be used for direct sales to the public. Main
    features: plastic enclosure, LCD display, alphanumeric keypad and function keys, integrated printer,
    dual channel (two load cell connections), 7-pin load cell connectors. Devices: initial zero setting
    device on power up, semi-automatic zero setting, zero tracking (optional), zero-indicator, indication
    of stable equilibrium, gravity compensation, printing, totalisation of weights, load identification
    register. The summation of axle weights is not permitted under this certificate. Interfaces: load
    cell connection, RS232/485, USB (optional). Any compatible load cell may be used provided it holds
    an OIML R60 Certificate of Conformity containing the necessary data for the manufacturer's declaration
    of compatibility of modules; a load cell marked NH is allowed only if humidity testing to R76 has
    been conducted on it. Software is held in firmware with identification number V1.xx and is sealed;
    access to legally relevant parameters is prevented by a jumper on the main board. Sealing is by tamper-evident
    method.
