  - Flynet 100ICH
  module_designation:
  description: >-
    Family of digital indicating devices connected to a weighing platform to form a Class III or IIII,
    AC mains or DC-powered, self-indicating, non-automatic weighing instrument. The instruments shall
    not be used for direct sales to the public. Digital load cells type CPD-M and smart junction box type
    DILINK may be connected. Alternative 1: instruments fitted with an alternative motherboard designated
    'Flynet' (designation suffixed with 'Flynet'); software and metrological characteristics remain unchanged,
    with protected interfaces additionally including HDMI. Alternative 2: alternative indicators designated
    Flynet 100IH and Flynet 100ICH; software and metrological characteristics remain unchanged.
