certified_type:
  category: Indicator
  type_designations:
  - FM
  - FMR
  module_designation:
  description: >-
    This indicating device is designated the FM or FMR indicator. It is designed to be used as part of
    a Class III non-automatic weighing instrument. The indicator is self-indicating, mains or battery-powered,
    and can operate as a single interval, dual interval or dual range instrument. Construction: processor
    and converter unit comprising CPU and A/D converter, six digit segments display, operator keypad,
    plastic enclosure, LED indicators (battery status: charging or charged). Devices: initial zero setting,
    semi-automatic zero setting, zero tracking, semi-automatic subtractive tare weighing, determination
    of stability of equilibrium, preset tare, accumulation, high-resolution mode, unit switch (kg, t),
    gross/net/motion/accumulation/preset tare/weighing range indicators, remote operation via RS232/485.
