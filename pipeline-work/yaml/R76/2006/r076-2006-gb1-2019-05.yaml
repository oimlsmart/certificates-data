  module_designation:
  description: >-
    Family of weight indicating devices designed to be connected to a load receptor to form a Class III
    or IIII Non-automatic Weighing Instrument. May be fitted with a built-in printer and optional WiFi
    connectivity. Configurable with single-interval, multi-interval or multi-range weighing options, an
    external or internal AC mains adapter, and an internal rechargeable battery. Not designed for direct
    sales to the public. Enclosures: ABS plastic or stainless steel; displays: LCD, LED or touchscreen;
    function keys; connections and ports located at the back. Designation format is Family + alphanumeric
    suffix; variants include keypads (5 to 59 keys), functional waterproof keypad, various numbers of
    weighing channels, ABS/painted steel/stainless steel cases in different sizes, communication ports
    and permitted interfaces. Modified variants covered: KS series; 3590E with stainless steel case and
    graphic touch; CPWE with stainless steel case. Devices include: initial zero setting device (<= 20%
    of Max), semi-automatic zero setting (<= 4% Max), zero tracking (<= 4% Max), semi-automatic subtractive
    tare weighing, pre-set tare, recall of gross indication, determination and indication of stability
    of equilibrium, multi-range and multi-interval function, checking of display, printing, alibi storage
    device, gravity compensation, checkweighing, real time clock, counting, command via external device
    (PC), accumulation, battery level indicator, remote control, LCD or LED, peak hold, and gross/net/tare/preset
    tare/print/zero/motion/accumulation/over-under weight/network indicators. Protected interfaces: 4
    or 6 wire load cell connection, DC voltage input, RS-232, RS-485, control inputs/outputs, USB, Ethernet,
    Ethernet IP, Bluetooth, optoisolated inputs, Photomosfet outputs, SENSOR (digital in), RF, WiFi, analogue
    output and input, Profibus, Profinet, DeviceNet, CANopen, Ethercat. Software: held in Flash memory,
    not user-modifiable; sealing via physical jumper or software sealing with non-editable CAL and CONFIG
    counters on a tamper-evident label; legally relevant software identified as prefix/version with version
    01 for all series. Accessories and modifications: connection via RS232, RS485 or USB to a compatible
    NAWI (with pre-set tare, peak hold and gravity compensation disabled; not for direct sales).
