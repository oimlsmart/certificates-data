matrix_tables:
- name: Rainbow software version identification
  columns:
  - rainbow_core
  - rainbow_weighing_package
  - rainbow_signal_processing
  rows:
  - rainbow_core: RB or rb
    rainbow_weighing_package: WP or wp
    rainbow_signal_processing: SP or sp or DSP or dsp
  - rainbow_core: 1.9.7 to 2.0.6 (same version)
    rainbow_weighing_package: 1.9.7 to 2.0.6 (same version)
    rainbow_signal_processing: 1.70.x
  - rainbow_core: 2.0.7 to 2.1.6
    rainbow_weighing_package: 2.0.7 to 2.1.6
    rainbow_signal_processing: 1.70.x
  - rainbow_core: 2.1.7 to 2.3.6
    rainbow_weighing_package: 2.1.7 to 2.2.6
    rainbow_signal_processing: 1.70.x
  - rainbow_core: For Rainbow core versions 2.3.7 and higher the Rainbow core is legally not relevant
    rainbow_weighing_package: 2.2.x
    rainbow_signal_processing: 1.70.x
  - rainbow_core: For Rainbow core versions 2.3.7 and higher the Rainbow core is legally not relevant
    rainbow_weighing_package: 2.2.x
    rainbow_signal_processing: 2.0.x
  - rainbow_core:
    rainbow_weighing_package: x = 0 .. 99
    rainbow_signal_processing: x = 0 .. 99
  description: >-
    Software identification shown on terminal or display of complete weighing instrument in the form prefix
    + version; '.' = any character. First row gives the type prefixes (Rainbow core / Weighing Package
    / Signal processing); subsequent rows give permitted version combinations. x = 0 .. 99 in version
    strings.
  footnotes: []
