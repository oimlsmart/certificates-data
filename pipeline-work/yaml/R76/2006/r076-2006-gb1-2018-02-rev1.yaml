  description: >-
    Alternatively, the instruments may be fitted with one of the following ZEMIC load cells, model L6D.
    Dual values such as 6/15, 2/5 and 5/10 denote dual-interval instruments (Max1/Max2 and e1/e2). T=-
    is the maximum subtractive tare value.
