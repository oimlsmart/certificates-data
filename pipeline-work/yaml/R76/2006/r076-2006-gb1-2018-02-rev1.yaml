certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - B Series
  - BPS
  - BRS
  - BLS
  description: >-
    The B Series comprises a BPS indicator connected to a range of load cells to form a family of Class
    III, mains or battery-operated, self-indicating, single or dual-interval, nonautomatic weighing instruments.
    The BPS indicator may be designated as the BPS and their variants, BRS and BLS models depending upon
    the construction. The instrument may be used for direct sales to the public. Construction: plastic
    enclosure; plastic/stainless steel load receptor; dual, integral or pole-mounted LCD/LED display;
    operator keypad; integral printer (optional); level indicator. Software is held in firmware with identification
    number V02.xx.xx (xx.xx reflects non-legally relevant changes); access to legally relevant parameters
    only via calibration switch. Sealing by tamper-evident wire and seal solution.
