components:
- role: indicator
  type_designations:
  - BPS
  - BRS
  - BLS
  alternatives:
- role: load_cell
  type_designations:
  - >-
    Any load cell with a respective OIML R60 Certificate of Conformity containing the necessary data (standard
    transmission type; NH-marked cells allowed only if humidity tested to R76)
  - ZEMIC L6D
  alternatives: OR
