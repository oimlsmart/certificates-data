  module_designation: Non-automatic weighing instruments
  description: >-
    The GX-M series are class I and class II, self-indicating, non-automatic weighing instruments. The
    instruments are not designed for direct sales to the public. Devices: initial zero-setting device
    (<= 20 % of Max), semi-automatic zero-setting device (<= 4 % of Max), zero-tracking (<= 4 % of Max),
    semi-automatic subtractive tare weighing (T = -Max), zero indicator, indication of stable equilibrium
    device. Interfaces: USB (to connect personal computer), serial data interface RS232C (to connect printer).
    Sealing: access to the load cell, electronics and calibration switch is prevented by tamper evident
    seals.
