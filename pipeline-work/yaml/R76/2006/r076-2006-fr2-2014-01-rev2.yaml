certified_type:
  category: Indicator
  type_designations:
  - X112-B
  module_designation: Separate module (indicator)
  description: >-
    Electronic indicator type X112-B presented as a separate module intended to be integrated in a non-automatic
    weighing instrument. Commercial versions: i20 (general use), i30 and i35 (appropriate for weighing
    bridges), i40 (weighing in a process) or d20 (as a repeater). The box is metallic and presented as
    a 'table' version, a 'cabinet back panel' version or a 'front of housing' version. Intended to be
    connected to a weighing channel comprising analogue or digital strain gauge load cells. Revision 2
    added a version with a housing made of composite material, a version with housing integrating a junction
    box (i40JB), and a weight filling application (version i…EDU).
