certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - LI-700E
  - HC5600
  description: >-
    Self-indicating and price-computing non-automatic weighing instrument operating as a weight or weight/price
    labeller with associated thermal label printer. Construction: stainless steel frame; scale conveyor
    with optional in-feed and out-feed conveyors (any number); labeller; control cabinet located behind
    the conveyors. Devices: initial zero-setting device, semi-automatic zero-setting device, zero-tracking
    device, preset tare device, semi-automatic tare device (subtractive), zero indication; calibration
    not accessible to user; price computation; PLUs. Interfaces: Ethernet, USB. Software: version 2.xx.xx.xxxx
    displayed during power-up; alternatively World View software (permitted for direct sales to the public);
    legally relevant software contained in HeaderDisplay.dll version 1.0.0.10 and DPS710.dll version 1.0.0.29.
    HC5600 variant: identical in construction to the LI-700E, using the Tesco Counter application software
    (version 3.2.1) with DPS700.dll (checksum 0D37) and Secure.Scale.Module/dll (checksum 73954ba292858692bd28349bf20cda33e6a26a)
    to perform checkweighing; Max = 3000 g, Min = 40 g, e = 2 g. Any compatible load cell(s) with an OIML
    R60 Certificate of Conformity may be used, subject to compatibility of modules established by the
    manufacturer at the time of verification.
