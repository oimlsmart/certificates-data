certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL3500 Series
  - CL3500-B
  - CL3500-P
  - CL5200 series
  - CL5200-B
  - CL5200-P
  module_designation: Not applicable
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Plastic construction, operator's keypad,
    stainless steel load receptor, level indicator, integrated printer; front and rear LCD displays (CL3500-B)
    or pole-mounted double-sided LCD displays (CL3500-P). Devices include initial zero setting, semi-automatic
    zero setting, zero tracking, zero indicator, net indicator, stable weight indicator, semi-automatic
    subtractive tare balancing, preset tare, gravity compensation, price-computing, totalisation, PLU,
    fixed weight labelling, multi-vendor operation, calibration/set-up mode via sealed internal switch
    and self-service operation.
