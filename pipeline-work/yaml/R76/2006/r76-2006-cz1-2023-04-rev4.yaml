certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - C32.xxx.PM.yyy
  - 5Y.xxx.PM.yyy
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instruments of the C32.xxx.PM.yyy and 5Y.xxx.PM.yyy families, each covering
    five capacity variants (10 kg, 50 kg, 100 kg, 150 kg and dual-range 6/35 kg). Equipped with: zero
    indicator, stability indicator, internal adjustment, service menu via switch on the main board, initial
    zero-setting, zero-tracking, semi-automatic zero setting device, subtractive tare device, semi-automatic
    and automatic tare device, tare-weighing device, preset tare device, Data Storage Device (alibi memory)
    and weighing in carat units. The instruments must be equipped with a level indicator with a sensitivity
    of at least 2 mm for a tilt of 2/1000.
