  module_designation: Non-automatic electronic weighing indicator
  description: >-
    Non-automatic electronic weighing indicator certified under OIML R 76-1 (2006) for accuracy class
    III or IIII. Interfaces: RS232; Bluetooth (separate interface board). Devices: initial zero setting
    device (≤20% of Max), semi-automatic zero setting device (≤4% of Max), zero tracking device (≤4% of
    Max), semi-automatic subtractive tare balancing device, subtractive preset tare device (X722/X722E/X722S),
    gross/net display, price computing device (X7PC/X7PCS only), totalization device (disabled on X7PC/X7PCS
    unless a printer is connected), manual checkweighing device, piece counting device, printing device,
    gravity compensation device; stable equilibrium, zero, gross, net, PT and active range indicators.
    Software version displayed during turn-off sequence on X708/X708E/X708S/X722/X722E/X722S; on X7PC/X7PCS
    by pressing the 'Tare' and '5' keys simultaneously.
