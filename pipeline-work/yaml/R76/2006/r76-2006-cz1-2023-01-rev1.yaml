certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - xxx.yyy.n.HRP.zzz
  - xxx.yyy.n.HRP.EX.zzz
  module_designation: Not applicable
  description: >-
    Instrument xxx.yyy.n.HRP.zzz series (where: xxx – terminal name: 5Y, HY10 or 7.1; yyy – maximum range;
    n – optional pan size; zzz – optional design) consists of HRP weighing module which can be connected
    to 5Y, PUE HY10 or PUE 7.1 indicator. EX versions are designated xxx.yyy.n.HRP.EX.zzz. Accuracy classes
    II and III.
