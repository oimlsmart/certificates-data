certified_type:
  category: Indicator
  type_designations:
  - DD1010
  - DD1010IC
  - DD1010I
  - DD1010H
  - DD1010ICH
  - DD1010IH
  module_designation:
  description: >-
    Self-indicating, mains or DC-powered indicators designed to be used as part of Class III or IIII non-automatic
    weighing instruments. Desktop and wall-mounted versions. Devices include initial, semi-automatic and
    automatic zero setting, zero tracking, semi-automatic subtractive tare, preset tare, MPP alibi storage
    device, up to 2 load receptors, load receptor summation, weighbridge modes (AdR/RDA, RcD, RpD/RCP),
    identification of A/D converters, digital load cells and DILINK junction boxes, and encrypted weight
    data transmission in open networks or wireless transmission in protected mode per Welmec 7.2. Interfaces:
    6-wire shielded load cell connection (analogue/digital), RS232/422/485, Ethernet, Wi-Fi (internal
    antenna), 0-10 V / 0-20 mA analogue input/output, digital I/O, field bus (Profibus), USB host, SD
    card, audio. Sealing by physical protected switch or password-protected software sealing with non-resettable
    SW seal counter.
