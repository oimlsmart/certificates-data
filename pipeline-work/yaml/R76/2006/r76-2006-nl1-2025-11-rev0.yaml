certified_type:
  category: Indicator
  type_designations:
  - MWB25 Series
  module_designation: Analog load cell
  description: >-
    Indicator for use with analog load cells, supporting single-interval and multi-interval weighing ranges.
    Load cell connection: 6-wire (remote sensing) or 4-wire; when a 4-wire connection is used the load
    cells are connected directly without a junction box. Power supply: 100-240 V AC 50/60 Hz or 6-9 V
    DC battery (not suitable for a road vehicle power supply). Software version numbers: PEO0xx (LED display)
    or PCO0xx (LCD display), where xx is a number between 00 and 99; the identification number is displayed
    after pressing 'Print' and 'Hold' together to enter the manual, navigating to setting C38 and pressing
    'Print'.
