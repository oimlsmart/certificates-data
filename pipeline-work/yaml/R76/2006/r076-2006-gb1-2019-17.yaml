  - SCT Series
  module_designation:
  description: >-
    Family of weight indicating devices designed to be connected to a load receptor to form a Class III
    or IIII non-automatic weighing instrument. May be fitted with a built-in printer and optional WiFi
    connectivity. Can be configured with single-interval, multi-interval, or multi-range weighing options,
    an external or internal AC mains adapter, and an internal rechargeable battery. Enclosure of ABS plastic
    or stainless steel; LCD, LED or touchscreen display; function keys; connections and ports located
    at the back. Model designation follows the format Family + alphanumeric suffix identifying variants.
    The instruments are not designed for direct sales to the public.
