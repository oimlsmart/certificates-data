certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - GX-A series
  module_designation: Non-automatic weighing instruments
  description: >-
    The GX-A series is a class II, self-indicating, non-automatic weighing instrument. The instruments
    are not designed for direct sales to the public. Devices: initial zero-setting device, semi-automatic
    zero-setting device, zero-tracking, semi-automatic subtractive taring (T = -Max), zero indicator,
    indication of stable equilibrium device. Interfaces: serial data interface RS232C (to connect printer),
    USB interface (to connect personal computer). Sealing: access to the load cell, electronics and calibration
    switch is prevented by tamper evident seals.
