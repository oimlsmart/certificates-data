certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SM-6000 series
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instrument intended to be used for direct sales to the public. Has embedded
    software; the software identification is displayed at start-up or after pressing the key sequence
    "Menu / Maintenance / System info". The instrument can be used in a master/slave configuration, as
    a master or as a slave, and can be used as a self-service scale.
