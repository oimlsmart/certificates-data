    motorized levelling, motorized wind protector and ionizer were added. Conformity established by tests
    described in the associated Report No. 1.12-4041251, Revision 1, and the associated Test Reports No.
    1.12-4041251/10 through 1.12-4041251/15. The test results of the former test reports No. 1.12-4041251/1
    through 1.12-4041251/9 remain valid.
