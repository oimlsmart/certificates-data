certified_type:
  category: Indicator
  type_designations:
  - EM100-A
  module_designation: Analog data processing device
  description: >-
    Electronic indicator (analog data processing device) certified for use in non-automatic weighing instruments;
    weighing range may be single-interval, multi-range or multi-interval. Software version may be viewed
    by sending 'FFV' to the unit, which responds with 'Vxx.yy' or 'V:xx.yy.zz'; tested software version
    V01.60, changes from V01.60 to V02.00.00 examined. Devices: initial zero-setting (<= 20% of Max),
    semi-automatic zero-setting (<= 4% of Max), zero tracking (<= 4% of Max), semi-automatic subtractive
    tare, preset tare, automatic tare, zero detection, stable weight detection, event counter (TAC). Peripheral
    interfaces: RS485, RS232, CANopen, USB, 2 logic level inputs, 2 open-drain outputs; characterised
    as 'Protective interfaces' according to paragraph 8.4 of the Directive.
