certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - LP788
  module_designation: Not applicable
  description: >-
    Self-indicating, single interval, non-automatic weighing instrument powered by rechargeable batteries,
    intended to be used as a portable instrument for weighing road vehicles. Shall not be used for direct
    sales to the public. Must be placed on flat, level ground such that the entire underside of the weighing
    area is supported, and the bubble level indicator within its limiting mark. Groups of associated LP788
    instruments may be used for determining the total mass of a vehicle only if all wheels are supported
    simultaneously. Steel construction; integral LCD display; 4 operator push buttons; solar panel; 66
    cm x 39 cm load receptor with grip tape surface; level indicator (indicates 3° tilt limit); fixed
    steel handle. Sealing: access to the electronics, load cell and calibration jumper is prevented by
    sealing the enclosure using a wire and seal method. There are currently no authorised alternatives.
