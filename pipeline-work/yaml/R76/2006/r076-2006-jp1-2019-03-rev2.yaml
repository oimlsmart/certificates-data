certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SB series
  module_designation: Not applicable
  description: >-
    The SB series is a class III, self-indicating, non-automatic weighing instrument. The instruments
    are not designed for direct sales to the public. Devices: semi-automatic zero-setting device (≤ 4%
    of Max), semi-automatic subtractive tare weighing device, zero indicator, indication of stable equilibrium
    device. Sealing: access to the load cell, electronics and calibration switch is prevented by a tamper-evident
    seal on the base of the instrument. Legally relevant software: version V.xx.01.xx (Scale BOX) and
    V.xx.03.xx (Terminal), with x reflecting non-legally relevant changes.
