certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - xxx.yyy.n.HRP.zzz
  - xxx.yyy.n.HRP.EX.zzz
  module_designation: Not applicable
  description: >-
    Series xxx.yyy.n.HRP.zzz (xxx – terminal name: 5Y, HY10 or 7.1; yyy – maximum range; n – optional
    pan size; zzz – optional design) consists of HRP weighing module which can be connected to 5Y, PUE
    HY10 or PUE 7.1 indicator. EX version xxx.yyy.n.HRP.EX.zzz operates with PUE HX5.EX indicator through
    dedicated power supplies PM01.EX (for terminals) and PM02.EX (for platforms).
