certified_type:
  category: Weighing module
  type_designations:
  - PL.xxx.PM.yyy
  - PM.xxx.yyy
  module_designation: Not applicable
  description: >-
    Weighing module (platform) for non-automatic weighing instruments. Devices: zero indicator, stability
    indicator, internal adjustment, service menu via switch on the main board, initial zero-setting, zero-tracking,
    semi-automatic zero setting device, subtractive tare device, semi-automatic and automatic tare device,
    tare-weighing device, preset tare device, Data Storage Device (Alibi memory). PM weighing modules
    (platforms) have no DSD; they are intended to use the DSD of the connected terminal. Equipped with
    RS 485 interface dedicated for connecting terminals, complying with paragraph 5.3.6 of OIML R76. Embedded
    weighing software version 1.0.0 or 1.0.1, used in a fixed hardware and software environment and cannot
    be modified or uploaded via any interface or by other means after securing and/or verification; software
    identification possible after connecting terminal. Must be equipped with a level indicator with a
    sensitivity of at least 2 mm for a tilt of 2/1000.
