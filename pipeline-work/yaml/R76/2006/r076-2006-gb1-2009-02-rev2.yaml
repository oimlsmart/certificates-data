certified_type:
  category: Indicator
  type_designations:
  - WPI-700
  - WPI-701
  - WPI-702
  module_designation:
  description: >-
    Indicating device designated WPI-700, designed to be used as part of a Class III or IIII non-automatic
    weighing instrument designated WPI-701 (single scale) and WPI-702 (dual scale). Operates as single
    or dual interval, self-indicating, mains-powered, may include a labeller. Main features: processor
    and converter unit comprising Teraoka TPB-2930 CPU and Teraoka TPB-03324 6-wire A/D converter; colour
    TFT-LCD touch screen; waterproof metallic enclosure. Devices: initial zero setting, semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare weighing, determination and indication
    of stability of equilibrium, zero indicator, PLUs, preset tare, price calculation, dual scale operation
    (WPI-702). Interfaces: load cell 6-wire connection, Ethernet, USB. Legal software version 2.xx.xx.xxxx
    with metrological code in DPS700.dll protected by checksum; alternative World View software (HeaderDisplay.dll
    version 1.0.0.10, DPS710.dll version 1.0.0.29) permits use for direct sales to the public. Calibration/configuration
    password-protected and gated by A/D switch inside the enclosure. An alternative construction (modified
    A/D board TPB-03484, Commel LV-67H main board, CIT-400W-Micro-ATX-Silent-PSU power supply) is also
    covered.
