  module_designation:
  description: >-
    Weighing modules/indicators for non-automatic weighing instruments, for single-interval, multi-interval
    or multi-range applications. Permitted devices: initial zero setting (≤20% Max), semi-automatic zero
    setting (≤4% Max), zero tracking (≤4% Max), semi-automatic and automatic subtractive tare devices,
    printing and totalization devices, unit toggling devices (g and kg only), sealed gravity compensation
    device; stable equilibrium, zero and net indicators. RS232 interface (does not have to be secured).
