certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MS-6110
  module_designation:
  description: >-
    Self-indicating, non-automatic weighing instrument for weighing persons; shall not be used for direct
    sales to the public. LCD display fitted into load receptor (5 digits) with Zero, Net, Weight lock,
    Bluetooth and Hold indicators; four buttons (2 x On/Off, Zero/Tare, Hold/BMI); aluminium base enclosure
    containing the load cell and electronics; plastic load receptor; level indicator next to the display;
    four adjustable feet. Devices include initial zero setting device, combined semi-automatic zero setting
    and subtractive tare device, zero tracking device, zero and net indicators, hold facility and hold
    indicator, gravity compensation, weight lock and BMI function. Access to electronics, load cell and
    software prevented by destructible sealing stickers.
