certified_type:
  category: Indicator
  type_designations:
  - P1405-B
  module_designation: Not applicable
  description: >-
    Separate module intended to be integrated in a non-automatic weighing instrument. Commercial designation
    is i25-Touch; it appears as a metallic box. It is intended to be connected to a weighing channel comprising
    analogue load-cells. It includes analogue to digital conversion of the signal coming from the load-cells
    as well as digital processing of data.
