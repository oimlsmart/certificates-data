  - CI-607D
  module_designation:
  description: >-
    Family of digital indicating devices designated the CI-600 Series (CI-601A, CI-605A or CI-607A) which,
    connected to a weighing platform, form a single or dual-interval, Class III or IIII, non-automatic
    weighing instrument. The instruments are not designed for direct sales to the public. D-variants are
    designed for connection to a digital load cell. Plastic enclosure, 4.3" LCD display, operator keypad;
    interfaces include load cell connection and RS232/485; optional Relay In/Out and Analogue Out cards.
    Software held in firmware with identification number V1.xx; sealing by tamper-evident method covering
    electronics, configuration switch and load cell connection.
