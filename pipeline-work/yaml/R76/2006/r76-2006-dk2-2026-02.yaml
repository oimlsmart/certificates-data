certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - FCx…
  module_designation: Non-automatic weighing instrument
  description: >-
    Self-indicating desktop scales of class III with single-interval, dual-range or dual-interval weighing
    range. FCW / FCS are with waterproof housing. The scales are housed in an enclosure made of ABS plastic
    except FCS which is housed in a stainless-steel housing. The display can be with white or colour backlight.
