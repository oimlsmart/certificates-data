certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SWII PLUS Series
  - SWII-CW
  - SWII-EW
  description: >-
    Family of Class III, mains- or battery-operated, self-indicating, single or dual-interval, waterproof,
    non-automatic weighing instruments, which may be used for direct sales to the public. Plastic construction
    with stainless steel load receptor, operator's keypad, level indicator; front LCD display (SWII-CW)
    or LED display (SWII-EW), optional rear LCD (SWII-CW) or LED (SWII-EW) display. Devices: initial zero
    setting device, semi-automatic zero setting device, automatic zero setting device, zero tracking device,
    zero indicator, net indicator, unit change (g, kg), stable weight indicator, semi-automatic subtractive
    tare balancing device, gravity compensation, piece counting, hold function, checkweighing, 3-point
    calibration. The instrument has no interfaces. Software designated V4.xx; access to the load cell,
    electronics and calibration switch is prevented by a tamper-evident seal on the base of the instrument.
