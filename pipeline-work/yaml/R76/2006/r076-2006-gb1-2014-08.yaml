certified_type:
  category: Indicator
  type_designations:
  - DD700
  - DD700IC
  - DD700I
  description: >-
    Self-indicating indicators, mains or DC-powered, designed to be used as part of Class III or IIII
    non-automatic weighing instruments. Devices: initial, semi-automatic and automatic zero setting, zero
    tracking, semi-automatic subtractive tare weighing, preset tare, stability of equilibrium determination
    and indication, zero indicator, MPP Alibi storage device, multiplexed scale inputs (up to 2 scales
    via function key), counting mode, load receptor summation, weighbridge modes (AdR/RDA, RcD, RpD/RCP),
    identification of A/D converter and digital load cells / DILINK junction box, weight data transmission
    per Welmec 7.2 (encrypted, protected mode), optional connection to external PC, connection to digital
    load cells type CPD-M and smart junction box type DILINK. Interfaces: 6-wire shielded load cell connection
    (analogue/digital), RS232/422/485, Ethernet, 0-10 V / 0-20 mA analogue input/output, digital I/O,
    field bus (Profibus...), USB host, USB client. Access to calibration and metrological configuration
    only via protected switch. Load cells: any compatible load cell with a valid R60 OIML Certificate
    of Conformity, per manufacturer's compatibility of modules calculation; NH-marked cells only if humidity
    tested to R76.
