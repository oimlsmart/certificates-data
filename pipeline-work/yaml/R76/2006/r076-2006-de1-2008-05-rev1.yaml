  module_designation:
  description: >-
    Non-automatic price-computing weighing instrument for direct sales to the public, consisting of a
    weighing module (load receptor with or without lever system, strain gauge load cell and electronics
    with an AD-converter for signal processing) and an incorporated indicating device (Touch-Screen) for
    displaying the weighing results and to operate the instrument.
