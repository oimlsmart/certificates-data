certified_type:
  category: Indicator
  type_designations:
  - X1309-TR
  module_designation: Analogue data processing unit
  description: >-
    Analogue data processing unit type X1309-TR is a separate module intended to be integrated in a non
    automatic weighing instrument. It is in the form of an electronic card that is closed with a metallic
    cover. It is intended to be connected to a weighing channel comprising strain gauges load-cells with
    analogue output. It performs analogue to digital conversion of the signal and has in its memory all
    setting parameters of the whole instrument as well as the signature of the associated terminal. Sealing
    is by a sealing sticker intended to prevent access to the card.
