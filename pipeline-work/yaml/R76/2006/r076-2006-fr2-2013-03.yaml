certified_type:
  category: Module
  type_designations:
  - WT-12
  module_designation:
  description: >-
    Analogue and digital data processing unit (module) designed to be incorporated in a non-automatic
    weighing instrument. It can manage from one to four channels of physical measurements (analogue or
    digital) and four summation channels from the physical measurement channels. The module does not include
    a display device. Housed in a metal or stainless steel enclosure which can be integrated into a compatible
    display terminal module or located externally to it. Access to calibration and metrological configuration
    is only possible after switching a pushbutton, secured by a sealing device.
