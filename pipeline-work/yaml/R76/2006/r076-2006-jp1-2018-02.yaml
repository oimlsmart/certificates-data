certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - HV-..C
  - HV-..CP
  - HV-15KC
  - HV-15KCP
  - HV-60KC
  - HV-60KCP
  - HV-200KC
  - HV-200KCP
  - HV-300KC
  - HV-300KCP
  - HV-600KC
  - HV-600KCP
  description: >-
    The HV model is a class III, self-indicating, multi-interval non-automatic weighing instrument, not
    designed for direct sales to the public. Devices: semi-automatic zero-setting (<= 4% of Max), zero-tracking
    (<= 4% of Max), semi-automatic subtractive tare weighing (T = -Max), preset tare, zero indicator,
    indication of stable equilibrium, printing (built into the HV-..KCP variants). Interfaces: RS232C
    serial data interface (printer), USB interface (personal computer), comparator output / switch input
    interface. Sealing: access to the load cell, electronics and calibration switch is prevented by a
    tamper-evident lead and wire type seal.
