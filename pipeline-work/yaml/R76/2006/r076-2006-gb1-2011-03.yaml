certified_type:
  category: Indicator
  type_designations:
  - '9010'
  module_designation:
  description: >-
    The indicating device is designated the 9010 weight indicator and is designed to be connected to a
    load receptor to form a Class III and IIII non-automatic weighing instrument. Features: stainless
    steel enclosure; LCD touch screen; optional labeller. Devices: initial zero setting device on power
    up; zero tracking; preset tare; stability of equilibrium; net indicator; printing; price-computing;
    PLU (Conformat); average weight operation. Interfaces: Ethernet (labeller and communication); USB
    (dongle only). Sealing: calibration and setup parameters can only be accessed via a Marel dongle and
    are protected by an incrementing counter; the load cell connection is protected via physical sealing.
    Legally relevant software is held in firmware on the circuit board, identification version number
    1.1.
