certified_type:
  category: Indicator
  type_designations:
  - PUE HX7
  module_designation: Indicator for non-automatic weighing instruments
  description: >-
    Electronic indicator for non-automatic weighing instruments with single range or multi range, accuracy
    class III. PUE HX7 weighing indicator is a device intended to make industrial scales operating on
    the basis of load cells. Equipped with a stainless-steel housing of high IP and 7" colour display,
    operated using 22-key membrane keypad with programmable function keys. Standard design offers RS232,
    USB type A, Ethernet, I/O interfaces; optionally equipped with an internal battery. Integrates with
    receipt and label printers, barcode scanners and PC accessories. Can be used as a terminal according
    to point T.2.2 of OIML R76 (2006).
