  category: Non-automatic weighing instrument
  type_designations:
  - MP70X1
  - MP70X2
  module_designation:
  description: >-
    Non-automatic weighing instrument in two variants: MP70X1 single interval and MP70X2 multi-interval;
    'X' denotes alternative variants not affecting metrological parameters. Intended to be used for direct
    sales to the public. When pressing and holding the zero button (<0>) for a period of at least 3 seconds
    at stable condition, the operator display shows software identification, calibration counter (in the
    form "C xxx") and parameter counter (in the form "P xxx").
