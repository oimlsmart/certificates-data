  module_designation: Non-automatic weighing instrument
  description: >-
    Electronic non-automatic weighing instrument. The name of the instrument may be followed by alphanumeric
    characters for technical, legally or commercial characterization of the instrument. Primary functions/devices:
    self-test function, initial zero-setting (within 10% of Max), semi-automatic zero-setting (within
    2% of Max), zero-tracking (within 2% of Max), semi-automatic tare (up to 100% of Max), auxiliary indicating
    device, extended indicating device, counting function, percentage weighing function, accumulation
    function, printing device, gravity compensation, mains or battery operated, remote display. The software
    is separated into a weighing system software and an application software; version format x.yy(z),
    where yy and (z) do not influence the legal function of the software.
