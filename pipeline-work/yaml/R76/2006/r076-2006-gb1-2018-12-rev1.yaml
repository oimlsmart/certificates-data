certified_type:
  category: Indicator
  type_designations:
  - DD1050
  - DD1050i
  - DD2050
  - DD2060X-Series
  module_designation:
  description: >-
    These indicating devices are designated the DD1050, DD1050i, DD2050 and DD2060X-Series. They are designed
    to be used as part of a Class III or IIII non-automatic weighing instrument. They operate as single
    interval, multi-interval or multi-range, are self-indicating and mains or DC-powered. Any compatible
    load cell with a valid OIML R60 Certificate of Conformity may be used, subject to the manufacturer's
    compatibility of modules calculation; a load cell marked NH is allowed only if humidity testing to
    R76 has been conducted on it.
