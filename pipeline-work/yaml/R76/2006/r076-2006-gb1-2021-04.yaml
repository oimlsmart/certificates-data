certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CS-700
  - BC-802
  - CS-700 low profile
  module_designation: Not applicable
  description: >-
    Family of Class III, self-indicating, single-interval, non-automatic weighing instruments, suitable
    for direct sales to the public. Metal construction with stainless steel load receptor and operator's
    keypad with 2 keys. CS-700: integrated scanner, standalone LCD display with optional second display,
    fixed installation. BC-802: integrated LCD display, level indicator at the back and adjustable feet.
    Alternative construction CS-700 low profile has the same metrological characteristics, main board,
    display board, load cell and software as the CS-700 scanner scale.
