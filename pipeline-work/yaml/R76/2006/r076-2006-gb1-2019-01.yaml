certified_type:
  category: Indicator
  type_designations:
  - ZM505
  - ZM510
  - ZM605
  - ZM615
  module_designation:
  description: >-
    Family of programmable, self-indicating weighing indicators, mains, DC or battery powered, for use
    as part of Class III or IIII non-automatic weighing instruments. Model designation format 'Prefix-XYZ':
    first digit X = enclosure material (S = stainless enclosure); second digit Y = mounting orientation
    (D = desktop, P = panel mount); third digit Z = display type (3 = IBN with dot graphic, black background
    with green digits; 4 = dot graphic, green background with black dots, capable of negative image; 5
    = large dot graphic, green backlight with black dots, capable of negative image). Devices: semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare weighing, pre-set tare, recall of gross
    indication when tare is active, determination and indication of stability of equilibrium, checking
    of display, printing, PLUs, alibi storage device, gravity compensation, real time clock, command via
    external device (PC), and gross/net/tare/preset tare/print/zero/motion/accumulation/over-under weight/network/battery
    indicators. Single or multi-range / multi-interval (maximum of 3 partial ranges), range in use indicators
    (multi-range variant), connection to up to 4 load receptors with load receptor number indicator, connection
    to digital load cells. Interfaces: load cell 4-wire or 6-wire shielded connection, 3 x logic level
    inputs, 3 x open collector outputs, 3 x RS232 serial ports, 10/100 Ethernet, 2 x USB Host. Optional
    interface & PCB cards: analogue output card (0-10 VDC and 4-20 mA outputs), current loop card (4-20
    mA loop and RS485/RS422), internal wireless LAN card (802.11b/g), USB device card, load cell interface
    boards (5 V and 10 V excitation), Bluetooth card, DeviceNet card, Profibus card, Ethernet to PoE supply
    side card, quad DC input/output cards, quad AC input/output cards, external I/O expansion card, programmable
    digital I/O card.
