certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - ICS...
  description: >-
    Electronic non-automatic weighing instrument (indicator type ICS...) for accuracy classes (II), (III)
    or (IIII); supports single-interval, multi-interval and multiple-range weighing. May be composed of
    weighing modules (MBA..., MPD..., MMA..., PBD655), analog data processing devices (DigiCell, LE-DigiCell)
    and load cells (SLP331D, SLP330D, SLP332D). Software identification format AA-BB-01.dd.ee-FF-G, where
    AA, BB, FF and G are alphanumerical or numerical characters describing the configuration (language,
    application, etc.), dd.ee is the status of the non-relevant software part, and 01 is the legally relevant
    software identification.
