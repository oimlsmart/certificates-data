  category: Non-automatic weighing instrument
  type_designations:
  - Magellan 9300i
  - Magellan 9400i
  - '939404'
  - '939406'
  module_designation:
  description: >-
    Scanner/scale (models 939404 and 939406), Class III, mains operated, self-indicating, weight only,
    single or dual interval, non-automatic weighing instrument. Designed for direct sales to the public
    and to be flush-mounted in a fixed position in a checkout surface; may be fitted with a level indicator.
    Devices: initial zero setting device, semi-automatic zero setting device, zero tracking device, automatic
    zero setting device, zero indicator, gravity compensation. Interfaces: POS terminal (RJ10), remote
    display (RJ4), scale host (RJ10), auxiliary port (RJ10), EAS port (RJ45), power (Molex 3 pin), USB,
    image port. Legally relevant parameters (scale configuration and calibration) stored in EEPROM; access
    to calibration mode only by switch behind a sealing cap. Components that may not be dismantled or
    adjusted by the user (EEPROM, calibration switch, load cell) secured by a tamper-evident solution
    bearing a securing mark.
