certified_type:
  category: Non-automatic electronic weighing instrument
  type_designations:
  - IP20a
  - IP20b
  - PEa
  - PEb
  - PEe
  - PEs
  - PHE
  - AW20
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    Non-automatic electronic weighing instrument, single interval, multi interval (dual) or multirange
    (dual). Software is separated into weighing software, application software, printing software and
    keyboard software; version placeholders: xx and yy can be 00 to 99, z can be absent or a to z. Devices:
    initial zero setting device (≤ 20% of Max), semi-automatic zero setting device (≤ 4% of Max), zero
    tracking device (≤ 4% of Max), semi-automatic subtractive tare balancing device, preset tare, price-computing
    (except AW20), non-weighed articles (except AW20), built-in printer (except AW20), manual check-weighing
    (AW20), gravity compensation device, stable equilibrium/zero/net/active range indicators. Interfaces:
    RS232, USB, Ethernet, cash drawer (except PHE/AW20), RS485 (AW20, optional), analog output (AW20,
    optional), Bluetooth (AW20, optional), WiFi (optional).
