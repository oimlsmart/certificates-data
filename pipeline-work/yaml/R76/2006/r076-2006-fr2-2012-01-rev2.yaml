certified_type:
  category: Indicator
  type_designations:
  - IDL
  - IDL 40
  - IDL 50
  - IDL 55
  module_designation:
  description: >-
    Indicator type IDL for non automatic weighing instruments, presented as a separate module intended
    to be integrated in a non automatic weighing instrument. It has 3 versions designated IDL 40, IDL
    50 and IDL 55 that differ by the display resolution of their graphic screen. The box may be made of
    metal+plastic or of stainless steel. It may be connected either to a weighing channel comprising analog
    load cells or to a weighing channel comprising digital load cells.
