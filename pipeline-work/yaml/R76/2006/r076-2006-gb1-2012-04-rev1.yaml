certified_type:
  category: Indicator
  type_designations:
  - ZM301
  - ZM303
  - ZQ375
  module_designation: Indicator
  description: >-
    The family of indicating devices is designated the Avery Weigh-Tronix ZM301 / ZM303 / ZQ375 Series.
    The indicators are self-indicating, mains, DC or battery-powered, and are designed to be used as part
    of a Class III or IIII, non-automatic weighing instrument. Construction coding 'Prefix-XYZ': prefix
    ZM301 or ZM303 = Standard Indicator, ZQ375 = Check-weighing Indicator; first digit X = enclosure material
    (S = Stainless enclosure, A = Alloy enclosure); second digit Y = mounting orientation (D = Desktop,
    P = Panel Mount); third digit Z = display type (1 = IBN black background with green digits, 2 = TN
    green background with black digits). Peripheral devices include semi-automatic zero setting (<= 4%
    Max), zero tracking (<= 4% Max), semi-automatic subtractive tare weighing, pre-set tare, recall of
    gross indication when tare is active, determination of stability of equilibrium, indication of stability
    of equilibrium, checking of display, printing, PLUs, alibi storage device, gravity compensation, checkweighing,
    real time clock, counting, weigh labelling, command via external device (PC), accumulation, target
    weighing, batching, peak hold, and ZQ375-only checkweighing applications (Sim375, Mid375, Adv375,
    Per375, Grad375).
