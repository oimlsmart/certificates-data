certified_type:
  category: Weighing module
  type_designations:
  - HRP xxx.n.yyy
  - PL.xxx.n.HRP.yyy
  - HRP.EX xxx.n.yyy
  - PL.xxx.n.HRP.EX.yyy
  module_designation: Not applicable
  description: >-
    Weighing module for NAWI instruments of accuracy class II or III. The weighing result and its status
    are determined by embedded software in real time and transmitted in digital form via a protected interface
    to a weighing indicator operating as a terminal for displaying and/or printing weighing results.
