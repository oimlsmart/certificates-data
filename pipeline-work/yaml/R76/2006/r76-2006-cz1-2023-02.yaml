certified_type:
  category: Non-automatic weighing instruments
  type_designations:
  - XA xxx.4Y.yyy PLUS
  - XA xxx.5Y.yyy
  - MYA xxx.4Y.yyy PLUS
  - MYA xxx.5Y.yyy
  - UYA xxx.4Y.yyy PLUS
  - UYA xxx.5Y.yyy
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instruments of hybrid design running under Linux operating system. Devices:
    zero indicator, stability of equilibrium determination, second interval indication, set-up mode via
    a jumper on the digital module board, automatic span adjustment with internal calibration mass, checking
    the display, initial zero-setting, zero-tracking, printer, add display, PC keyboard, USB, Ethernet,
    WiFi, RFID, HDMI, USB C. The instruments must be equipped with a level indicator with a sensitivity
    of at least 2 mm for a tilt of 2/1000. Software download is impossible when an instrument is verified;
    software identification is possible after pressing the ON/OFF button. Equipped with DSD alibi memory
    (embedded flash, FAT32 or ext3 file allocation, closed shell system) that automatically saves weighing
    records with net and tare values, units, date and time, and load receptor designation, compliant with
    Welmec 2.5 date format requirements.
