  module_designation: Not applicable
  description: >-
    Non-automatic weighing instruments (balances) of the C32.PM and 5Y.PM families. Devices: zero indicator,
    stability indicator, internal adjustment, service menu via switch on the main board, initial zero-setting,
    zero-tracking, semi-automatic zero setting device, subtractive tare device, semi-automatic and automatic
    tare device, tare-weighing device, preset tare device, Data Storage Device (Alibi memory), weighing
    in carat units. Interfaces C32.PM: 2 x RS 232, USB-A 2.0, USB-B 2.0, Ethernet, optionally WiFi. Interfaces
    5Y.PM: USB C, Ethernet, RFID, HDMI, WiFi. C32.PM uses embedded terminal software L1.0.0 and weighing
    software version 1.0.0 or 1.0.1. 5Y.PM uses embedded software version 1.0.0 or 1.0.1 with Linux terminal
    software LL2.0 (closed shell). The instruments must be equipped with a level indicator with a sensitivity
    of at least 2 mm for a tilt of 2/1000.
