certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AS xxx.X7.yyy
  - PS xxx.X7.yyy
  - PS xxx.X7.M.yyy
  module_designation:
  description: >-
    Non-automatic weighing instruments, single range or multi range (single/multi range option concerns
    PS xxx.X7.yyy only), of compact construction with display and weighing part. xxx denotes maximum range,
    yyy optional design. The certificate covers two hardware versions: hardware version 1 (introduced
    with the first version of the certificate, embedded software 2.2.2 or 2.2.3) and hardware version
    2 (introduced as an alternative in Revision 2 for AS xxx.X7.yyy and PS xxx.X7.M.yyy and extended to
    PS xxx.X7.yyy in Revision 3, embedded software 3.0.1 and 1.0.2 or 1.0.3). The X7 family operates on
    a Linux closed shell system with DSD alibi memory per WELMEC 2.5; the weighing instrument must be
    used exclusively with the power supply unit delivered by the manufacturer.
