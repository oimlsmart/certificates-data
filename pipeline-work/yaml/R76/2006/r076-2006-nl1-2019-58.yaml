matrix_tables:
- name: Characteristics of the non-automatic weighing instrument
  columns:
  - attribute
  - PS-160 B
  - PS-160 P
  rows:
  - attribute: Maximum capacity
    PS-160 B: 30 kg or 35 kg
    PS-160 P: 6 kg ≤ Max ≤ 30 kg
  - attribute: Verification scale interval
    PS-160 B: e ≥ 0.5 g
    PS-160 P: e ≥ 1 g
  - attribute: Minimum load
    PS-160 B: 10 g
    PS-160 P: 20 g (5 g for postal use)
  - attribute: Weighing range(s)
    PS-160 B: Multi-interval
    PS-160 P: Single interval; Multi-interval
  - attribute: Maximum number of scale intervals (one weighing range)
    PS-160 B: "-"
    PS-160 P: n ≤ 7500
  - attribute: Maximum number of scale intervals (multi-interval)
    PS-160 B: n ≤ 4000 (per partial weighing range)
    PS-160 P: n ≤ 7500 (per partial weighing range)
  - attribute: Maximum number of partial weighing ranges
    PS-160 B: '4'
    PS-160 P: '3'
  - attribute: Temperature range
    PS-160 B: 0 °C / +40 °C
    PS-160 P: "-10 °C / +40 °C"
  - attribute: Power supply voltage
    PS-160 B: 100 – 240 V AC 50/60 Hz
    PS-160 P: 100 – 240 V AC 50/60 Hz
  - attribute: Software identification (version number)
    PS-160 B: 1.xx
    PS-160 P: 1.xx
  description: >-
    The two data columns correspond to the two variants named in the type designation PS-160 (B or P);
    the note '5 g (for postal use)' appears in the second column. Accuracy class (III) applies to both
    variants. Power supply voltage row spans both columns.
  footnotes: []
