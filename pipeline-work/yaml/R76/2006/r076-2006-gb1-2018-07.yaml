  description: >-
    Instrument series with: 3 feet, 2 adjustable; level indicator; LCD segment display with fixed position
    touch keys (models EVO1*, LAB1*, SPO1*); LCD graphic display with touch function (models VIS1*); EX-link
    converter for voltage supply and data transfer (models EVO1X*, LAB1X*, VIS1X*, VIS1Y*). A PC with
    compatible paint mixing software can be connected to the instruments by the interfaces provided; all
    devices can be initiated via a PC; preset-tare can only be introduced via a PC. Interfaces: USB either
    directly (models SPO1S*, EVO1S*, EVO1Y*) or via Ex-Link converter (models EVO1X*, LAB1X*); Ethernet
    via Ex-link converter (models VIS1X*, VIS1Y*). The instrument is fitted with one strain gauge load
    cell as per technical data, manufactured by Bizerba. The instrument operates on a 5 V DC power supply
    provided by USB; for models LAB1X*, EVO1X*, VIS1X*, VIS1Y* power is delivered from USB to Ex-link
    converter, and then to the instrument via RJ-45. Software: permitted versions BAC (software ID 05496,
    1578 for VIS models, version 00-56-02.xx) and APC (only VIS models, software ID 6587, version 01-72-03.xx),
    where xx reflects legally non-relevant changes. Access to the legally relevant parameters and download
    of software is only possible via the Menu access switch. Sealing: access to the electronics and load
    cell is prevented by two tamper evident labels on the underside of the instrument; access to the Menu
    access switch is prevented by a tamper evident label covering the switch.
