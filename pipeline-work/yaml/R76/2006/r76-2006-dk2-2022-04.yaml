  - CL5500N-R
  - CL5500N-P
  module_designation: Non-automatic weighing instrument
  description: >-
    Electronic weighing instrument series with single-interval and multi-interval (dual) weighing range.
    Devices: initial zero setting device (max 20% of Max), semi-automatic zero setting device (max 4%
    of Max), zero tracking device (max 4% of Max), automatic zero setting, semi-automatic subtractive
    tare weighing device, preset tare, label printing, stable equilibrium/zero/net indicators, gravity
    compensation, PLU tables, totalization. Interfaces: RS232C, cash drawer, Ethernet, wireless LAN, USB;
    the interfaces do not have to be secured. Software is designated "YY V3.xx.xZZZZZ" where YY is a 2-digit
    country code (numbers, letters, symbols or blank), xx.x reflects non-legally relevant changes, and
    ZZZZZ is a dealer or function code; this information is displayed at power up.
