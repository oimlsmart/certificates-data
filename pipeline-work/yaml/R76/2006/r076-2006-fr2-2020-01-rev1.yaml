certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - eNod4 WSC
  description: >-
    Electronic non-automatic weighing instruments with digital indication, with or without levers, with
    one weighing range with single interval. They integrate an indicator module Scaime type eNod4 WT intended
    to be connected to one or several load cells with analog output. The indicator module can be in a
    single housing or in separate housings, with the transmitter and terminal parts in separate boxes.
    The load cell has an OIML R60 certificate and is not marked NH; compatibility of indicator and load
    cell(s) is established by the manufacturer by means of the compatibility of modules form of OIML R76/2006
    annex F.
