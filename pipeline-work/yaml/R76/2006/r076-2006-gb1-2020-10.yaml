certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MP70X1
  - MP70X2
  description: >-
    Zebra Technologies MP70X1 & MP70X2 scanner scales: a family of self-indicating, weight-only, single
    or dual-interval, non-automatic weighing instruments, suitable for direct sales to the public. Designed
    for flush-mounting in checkout surface with frame extensions to support the instrument in the checkout
    counter; steel framework supporting one load cell, barcode scanner and electronics; stainless steel
    load receptor; single or dual pole-mounted display; optional Produce Flip-Up Bar Platter and optional
    Customer Side Scanner (CSS). Designed for permanent installation in checkout surface, therefore no
    level indicator required (levelled at installation; medium size model may be fitted with adjustable
    feet). In the type designations 'X' denotes alternative approved models, variables not affecting metrological
    parameters. Remote pole displays may be replaced by alternative 'Primary Weight Indication' on an
    approved EPOS customer/operator display.
