matrix_tables:
- name: Software identification IND400
  columns:
  - description
  - version
  - remarks
  rows:
  - description: Standard
    version: 1.xx.yyyy
    remarks: For analog, and SICSpro scale types
  - description: Standard
    version: 2.xx.yyyy
    remarks: For analog, SICSpro and PowerDeck scale types
  description: >-
    xx is a number between 00 and 99 representing major updates of the non-legally relevant part of the
    software; yyyy is a number between 0000 and 9999 representing minor updates of the non-legally relevant
    part of the software.
  footnotes: []
- name: Rainbow software version compatibility (digital load cells or weighing module)
  columns:
  - rainbow_core
  - rainbow_weighing_package
  - rainbow_signal_processing
  rows:
  - rainbow_core: RB or rb
    rainbow_weighing_package: WP or wp
    rainbow_signal_processing: SP or sp or DSP or dsp
  - rainbow_core: 1.9.7 to 2.0.6 (same version)
    rainbow_weighing_package: 1.9.7 to 2.0.6 (same version)
    rainbow_signal_processing: 1.70.x
  - rainbow_core: 2.0.7 to 2.1.6
    rainbow_weighing_package: 2.0.7 to 2.1.6
    rainbow_signal_processing: 1.70.x
  - rainbow_core: 2.1.7 to 2.3.6
    rainbow_weighing_package: 2.1.7 to 2.2.6
    rainbow_signal_processing: 1.70.x
  - rainbow_core: For Rainbow core versions 2.3.7 and higher the Rainbow Core is legally not relevant
    rainbow_weighing_package: 2.2.x
    rainbow_signal_processing: 1.70.x
  - rainbow_core: For Rainbow core versions 2.3.7 and higher the Rainbow Core is legally not relevant
    rainbow_weighing_package: 2.2.x
    rainbow_signal_processing: 2.0.x
  description: >-
    Digital load cell or weighing module software may alternatively be AP…, APPL… or Appl… (application
    software, where . = any character). x is a number between 0 and 99 representing minor updates of the
    non-legally relevant part of the software. For Rainbow core versions 2.3.7 and higher the Rainbow
    Core is legally not relevant.
  footnotes: []
