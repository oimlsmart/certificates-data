  - PS xxx.R2.yyy
  - PS 200/2000.R2
  - PS 250.R2
  - PS 1000.R2
  - PS 1500.R2
  - PS 6000.R2
  module_designation:
  description: >-
    Instrument PS xxx.R2.yyy model series operates on basis of electromagnetic compensation of weighed
    load. This series features a measuring range up to 6000 g. Instrument has LCD display, plastic cover,
    stainless steel plate, automatic internal adjustment system. Symbol xxx stands for Max (g) and symbol
    yyy stands for special purpose of balance e.g. jewelry balance – CT.
