certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MU1
  module_designation: Non-automatic weighing instrument
  description: >-
    The MU1 instrument is a class III or IIII, non-automatic weighing instrument with single-interval
    or dual-range, comprising an MU1 analog data processing unit, a load receptor, and a PC with display.
    The MU1 analog data processing unit is a single chip microprocessor based unit running on USB bus
    power; the PC user interface software presents the user interface, controls, and primary indications.
    Software is split into a metrological and an operational part; identification of the MU1 firmware
    can be observed on command from the PC user interface.
