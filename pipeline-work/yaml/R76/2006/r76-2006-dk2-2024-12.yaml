certified_type:
  category: Indicator
  type_designations:
  - CTI-1200 series
  - CTI-1200A
  - CTI-1201A
  - CTI-1200S
  - CTI-1200SC
  module_designation: Non-automatic weighing instrument
  description: >-
    Weighing indicator series. Plastic construction (CTI-1200A and CTI-1201A); metal construction (CTI-1200S
    and CTI-1200SC); alphanumeric keypad; LCD display and indicators (CTI-1201A); LED display and indicators
    (CTI-1200A, CTI-1200S and CTI-1200SC); battery indicator. Software designated V1.xx or V2.xx, displayed
    at power up; access to legally relevant parameters only via calibration switch on the main board,
    sealed by enclosure.
