  description: >-
    Family of indicating devices designed to be used as part of a single-interval Class III or IIII non-automatic
    weighing instrument. Self-indicating, mains or DC powered, LED display, 4 function keys. Not designed
    for direct sales to the public. Plastic enclosure (wall-mounted Target 260S, Target 260D, Status 290P)
    or stainless steel enclosure (desktop Status 290S). External connectors on the Target 260D; internal
    connectors via glands on Target 260S, Status 290P and Status 290S. Devices: semi-automatic zero setting
    (<= 4% Max), semi-automatic subtractive tare weighing, gross/net indication, zero-indicator, indication
    of stable equilibrium, net indicator, printing. Interfaces: load cell connection, analogue output
    with RS232, CAN Bus, Profibus DP, Ethernet TCP/IP, Ethernet IP, Profinet, EtherCAT, relay output (3),
    digital input (2). Any compatible load cell with a valid OIML R60 Certificate of Conformity may be
    used, subject to the manufacturer's compatibility of modules calculation; a load cell marked NH is
    allowed only if humidity testing to R76 has been conducted. Access to electronics and USB port secured
    by tamper-evident label; load cell connection (and junction box when applicable) secured by wire-and-seal
    or tamper-evident label. Firmware download only possible via the sealed USB port.
