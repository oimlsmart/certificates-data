certified_type:
  category: Indicator
  type_designations:
  - ZM505
  - ZM510
  - ZM605
  - ZM615
  description: >-
    Family of programmable, self-indicating indicators, mains, DC or battery-powered, designated the Avery
    Weigh-Tronix ZM505 / ZM510 / ZM605 / ZM615 Series, designed to be used as part of a Class III or IIII
    Non-Automatic Weighing Instrument. Interfaces: load cell 4-wire or 6-wire shielded connection, 3 x
    logic level inputs, 3 x open collector outputs, 3 x RS232 serial ports, 10/100 Ethernet, 2 x USB Host.
