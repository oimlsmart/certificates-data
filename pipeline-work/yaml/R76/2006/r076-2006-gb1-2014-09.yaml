certified_type:
  category: Non-Automatic Weighing Instrument
  type_designations:
  - NCR 7879-2XXX
  - NCR 7879-5XXX
  module_designation:
  description: >-
    NCR 7879-2XXX and 7879-5XXX series (where XXX denotes alternative approved models) scanner/scale,
    accuracy class III, mains operated, self-indicating, weight only, non-automatic weighing instrument.
    Designed for flush-mounting in checkout surface; can be used in Self Check-Out Systems (SCO); steel
    framework supporting a barcode scanner, electronics, and four load cells; NCR 7825 remote pole-mounted
    display unit; integrated barcode imagers; interface for POS connection; remote power supply module.
    The 7879-5XXX has frame extensions to support the instrument in the checkout counter and a smaller
    load receptor than the 7879-2XXX; the 7879-2XXX can be mounted into an optional stainless steel mounting
    bracket and has a 2.5 cm longer extended weigh plate; the 7879-5XXX features an optional stainless
    steel weigh plate comprising two separate sheets covering the weighing platform. Equipped with an
    integrated single character seven segment display also used to provide audit trail information from
    two event counters; the calibration button can be sealed using label or lead and wire methods.
