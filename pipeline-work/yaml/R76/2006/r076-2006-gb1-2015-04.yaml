components:
- role: digital base
  type_designations:
  - BSQ Series
  - BSQ-0912-035
  - BSQ-1214-035
  - BSQ-1214-080
  characteristics:
    construction: Two-part cast aluminium painted enclosure
    equipment:
    - load bridge
    - stainless steel weighing pan
    - digital load cell assembly type LP FPGA QDT
    - adjustable feet
    - level indicator
    designation_format: >-
      Prefix-XXYY-CCC, where XX = nominal weigh pan depth in inches, YY = nominal weigh pan width in inches,
      CCC = capacity in kg; prefix BSQ = standard base
- role: load cell
  type_designations:
  - LP FPGA QDT
  characteristics:
    description: Digital load cell assembly
- role: indicator
  type_designations:
  - ZP900 series
  characteristics:
    construction: PCB, LCD display and 6 operational keys housed in an enclosure
    designation_format: >-
      ZP900-XXYY-CCC-XYZ, where XX = nominal weigh pan depth in inches, YY = nominal weigh pan width in
      inches, CCC = maximum capacity of platform in kg, X = enclosure material (P = plastic ABS), Y =
      mounting method (B = base mount, D = desk mount, H = hybrid, P = pole mount, R = remote display
      pole mount, T = table top remote display), Z = indicator / remote display type (1 = IBN, black background
      with green digit)
    power_supply: Sourced from the digital base
- role: remote display
  type_designations:
  - ZP900 series
  characteristics:
    optional: true
    construction: Identical to indicator but without the operational keys
    power_supply: Sourced from the digital base
- role: software (digital base)
  type_designations:
  - AWT30-500191
  characteristics:
    version: 1.x.x.x
    note: >-
      x.x.x refers to identification of non-legally relevant software, which may be modified by the manufacturer
- role: software (indicator)
  type_designations:
  - AWT30-500196
  characteristics:
    version: 1.x.x.x
    note: >-
      x.x.x refers to identification of non-legally relevant software, which may be modified by the manufacturer
