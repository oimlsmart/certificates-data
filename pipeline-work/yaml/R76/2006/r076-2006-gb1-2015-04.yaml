certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - ZP900 Series
  module_designation: Not applicable
  description: >-
    Family of non-automatic weighing instruments, which may also be used as postal scales, utilising digital
    bases designated the Avery Weigh-Tronix BSQ Series, connected to a ZP900 series indicator and an optional
    ZP900 series remote display to form Class III, mains, DC or battery-powered, self-indicating non-automatic
    weighing instruments. The instruments may be used for direct sales to the public.
