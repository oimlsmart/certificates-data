certified_type:
  category: Indicator
  type_designations:
  - DD1010
  - DD1010IC
  - DD1010I
  - DD1010H
  - DD1010ICH
  - DD1010IH
  module_designation:
  description: >-
    Self-indicating electronic indicators, mains or DC-powered, designed to be used as part of Class III
    or IIII non-automatic weighing instruments. Desktop and wall-mounted versions with 5.7" graphic LCD
    display, A/D conversion module (up to 2) and main board with processor. Devices include initial/semi-automatic/automatic
    zero setting, zero tracking, semi-automatic subtractive tare, preset tare, MPP Alibi storage device,
    up to 2 load receptors with summation, weighbridge modes (AdR/RDA, RcD, RpD/RCP), identification of
    weighing boards, digital load cells and DILINK junction box, and encrypted weight data transmission
    per Welmec 7.2. Interfaces: 6-wire shielded load cell connection, RS232/422/485, Ethernet, Wi-Fi,
    0-10 V / 0-20 mA analogue I/O, digital I/O, field bus (Profibus), USB host, SD card, audio. Any compatible
    load cell with a valid R60 OIML Certificate of Conformity may be used; load cells marked NH are allowed
    only if humidity testing to R76 has been conducted.
