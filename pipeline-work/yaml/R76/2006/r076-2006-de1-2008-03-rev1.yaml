revision_history:
- revision: '1'
  date: '2010-08-30'
  changes: >-
    Issued because new weighing instruments type BD SI 200 and variants in stainless steel were added.
    Conformity established by tests described in report No. 1.12-4036945, Revision 1, and the associated
    test reports No. 1.12-4036945/6, No. 1.12-4036945/7 and No. 1.12-4036945/8 (all BD SI 200). The test
    results of the former test reports No. 1.12-4036945/6 (Samples 1-4, BG SI 200), No. 1.12-4036945/7
    (Samples 1-4, DG SI 300), No. 1.12-4036945/8 (Samples 1-6, BG SI 200), [report number not legible]
    (Samples 1-5, DG SI 300) and No. 1.12-4036945/5 (Sample 1, DX SI 300) remain valid.
