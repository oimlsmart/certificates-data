components:
- role: indicating device
  type_designations:
  - Checkmaster
  characteristics:
    enclosure: Stainless steel
    display: LCD
    interfaces:
    - Load cell
    - RS232 x2
    - PIO x9
    - Wi-Fi
    software_identification: MC8_xxx
    software_description: >-
      Held in firmware on the circuit board; non-editable TAN (traceable access number) counter increments
      when legally relevant parameters are changed; software version number and TAN counter displayed
      at power-up.
    sealing: >-
      Enclosure sealed using wire and seal or tamper-evident label with securing mark (manufacturer's/representative's
      mark or official verification officer's mark); TAN counter value written on tamper-evident label
      on or near the rating plate.
- role: weighing platform
  type_designations: []
- role: load cell
  type_designations:
  alternatives: OR
  characteristics:
    requirement: >-
      Any compatible load cell(s) may be used provided: a respective OIML R60 Certificate of Conformity
      exists; the certificate contains the load cell types and data required for the manufacturer's declaration
      of compatibility of modules and installation requirements; load cells marked NH allowed only if
      R76 humidity testing has been conducted; compatibility established via compatibility of modules
      calculation at verification; standard transmission type.
