certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Checkmaster
  module_designation: Not applicable
  description: >-
    Single-interval, Class III or IIII, non-automatic weighing instrument formed by the Checkmaster digital
    indicating device connected to a weighing platform. Not intended to be used for direct sales to the
    public. Stainless steel enclosure; LCD display; operator keypad with numerical, navigation and function
    keys; lightbar.
