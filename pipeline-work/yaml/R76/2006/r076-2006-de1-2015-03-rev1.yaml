certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SARTOCOWAT
  description: >-
    Non-automatic electromechanical weighing instrument without lever works, designed as multi-interval
    and multiple range instrument. The weighing ranges with Max, Min, e, d and number of verification
    scale intervals may be chosen within the limits of No. 3.2 of R 76-1, considering the limiting values
    of the weighing modules. With Revision 1, a variant of weighing module BD SI and a new housing material
    were added.
