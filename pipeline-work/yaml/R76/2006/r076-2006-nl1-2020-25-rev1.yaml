- marker: 1)
  text: 6-Digit format for the 7-segment display
- marker: 2)
  text: >-
    The software version is identified with 0.00.xxxx, where "xxxx" can be a number between 0002 and 9999
    which represents non metrological relevant changes by the manufacturer. Scales with software version
    0.00.xxxx have a separate main board / Rito Herman board.
- marker: 3)
  text: >-
    The software version is identified with 1.00.xxx, where "xxx" can be a number between 004 and 999
    which represents non metrological relevant changes by the manufacturer. Scales with software version
    1.00.xxx have a combined main board.
