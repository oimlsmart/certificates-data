revision_history:
- revision: '00'
  date: '2019-09-24'
  changes: First issue
- revision: '01'
  date: '2020-09-21'
  changes: Extension to the types BC-EA to BC-EH, BC-AA to BC-AH
- revision: '02'
  date: '2020-11-03'
  changes: Editorial changes
- revision: '03'
  date: '2021-04-15'
  changes: Rebranding, new design
- revision: '04'
  date: '2021-08-12'
  changes: Extension to the type BC-EK, version of software
- revision: '05'
  date: '2022-06-16'
  changes: Version of software added, reinforcement of power connector (only in documentation)
- revision: '06'
  date: '2024-06-24'
  changes: >-
    Extension to the types BC-QA, BC-QB, BC-QC, BC-QD, BC-QE, BC-QG. Optimized weighing system of the
    types BC-AA, BC-AB, BC-EA, BC-EB.
- revision: '07'
  date: '2024-07-18'
  changes: Editorial changes
- revision: '08'
  date: '2024-10-30'
  changes: >-
    Change of the socket for power supply from SMD (Surface Mounted Device) to THT (Through Hole Technology).
    Therefore, modification of the mainboard has been conducted.
- revision: '09'
  date: '2025-08-28'
  changes: >-
    Extension by variants of BC-E (BSA Serie: different draft shield, different colors, fewer applications,
    no isoCAL)
