certified_type:
  category: Data processing device
  type_designations:
  - Vx4
  module_designation: Analog data processing device (separate module)
  description: >-
    Analog data processing device type Vx4, evaluated as part of a non-automatic weighing instrument,
    not intended for direct sale to the public. Presented as a separate module intended to be integrated
    in a non-automatic weighing instrument. It can be connected to one or more measurement channels (maximum
    of 4) consisting of strain gauge load cells with analogue output. It performs the analog/digital conversion
    of the signal coming from the load cells and stores all the adjustment parameters of the complete
    weighing instrument. It takes the form of a stainless steel box powered by 12 or 24 VDC via a DC voltage
    source or a road vehicle battery.
