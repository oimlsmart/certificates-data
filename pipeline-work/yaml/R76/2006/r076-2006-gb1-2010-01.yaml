  module_designation:
  description: >-
    Weighing indicator for use as part of a Class III or IIII non-automatic weighing instrument; self-indicating,
    dc-powered, single- or multi-interval. Processor and converter unit comprising CPU and A/D converter;
    operator keypad with dedicated keys and soft keys; construction marked as 5 on the rating plate. Devices:
    semi-automatic zero setting (<= 20% Max), zero tracking (<= 4% Max), semi-automatic subtractive tare
    weighing or balancing, preset tare, determination of stability of equilibrium, PLUs, multi-scale (maximum
    of two), totalisation, truck weighing, counting, target weighing, checkweighing, gross/net/tare/preset
    tare/print/zero/motion/accumulation/over-under weight indicators. Protected interfaces: load cell
    4- or 6-wire shielded connection, 1 or 2 RS232/RS485/20 mA, 1 x serial output (to external output
    module), 10/100 Base T Ethernet, trip outputs, control inputs, external PC-style keyboard (IBM PS/2).
    Optional boards: load cell interface board (second platform, up to 16 load cells, 2 analogue outputs
    voltage or current), digital expansion board (two serial ports configurable as RS232/RS485/RS422,
    pulse input, BCD interface), SRAM expansion board, Anybus expansion board (Profibus DP, DeviceNet,
    ControlNet, EthernetmodbusTCP, EthernetIP); up to 16 remote I/O interfaces. Internal DSD (electronic
    tallyroll) via SRAM expansion board stores date, time, transaction ID and net weight per transaction,
    capacity for a minimum of 4 months data (72,000 transaction records at 600 records/day for 120 days).
