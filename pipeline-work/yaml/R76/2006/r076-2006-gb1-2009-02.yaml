certified_type:
  category: Indicator
  type_designations:
  - WPI-700
  - WPI-701
  - WPI-702
  description: >-
    Weighing indicator designated WPI-700, designed to be used as part of a Class III or IIII non-automatic
    weighing instrument designated WPI-701 (single scale) or WPI-702 (dual scale). Operates as single
    or dual interval, is self-indicating and mains-powered, and may include a labeller. Processor and
    converter unit comprising a Teraoka TPB-2930 CPU and a Teraoka TPB-03324 6-wire A/D converter; touch
    screen (colour TFT-LCD module); waterproof metallic enclosure. Devices: initial zero setting, semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare weighing, determination of stability
    of equilibrium, indication of stability of equilibrium, zero indicator, PLUs, preset tare, price calculation,
    dual scale operation (WPI-702). Interfaces: load cell 6-wire connection, Ethernet, USB.
