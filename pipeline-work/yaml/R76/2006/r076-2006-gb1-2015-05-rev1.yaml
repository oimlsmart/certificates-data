certified_type:
  category: Non-automatic weighing instrument (scanner/scale)
  type_designations:
  - Magellan 9300i
  - Magellan 9400i
  - '939404'
  - '939406'
  module_designation: Not applicable
  description: >-
    Class III, mains operated, self-indicating, weight only, single or dual interval Non-Automatic Weighing
    Instrument designed for direct sales to the public. The diecast base unit supports the load cell,
    barcode scanner assembly, main board and analogue boards; the scale sub-assembly is mounted on the
    load cell and the steel 'L' shaped load receptor is mounted on the four supporting points. Designed
    to be flush-mounted in a fixed position in a checkout surface; may be fitted with a level indicator.
    Devices: initial zero setting device, semi-automatic zero setting device, zero tracking device, automatic
    zero setting device, zero indicator, gravity compensation. Interfaces: POS terminal (RJ10), remote
    display (RJ4), scale host (RJ10), auxiliary port (RJ10), EAS port (RJ45), power (Molex 3 pin), USB,
    image port. Markings: Max, Min, e=, accuracy class, serial number, manufacturer's mark or name, certificate
    number, special temperature limits (+10 °C to +40 °C); labels affixed on the sub platter underneath
    the load receptor. Legally relevant parameters (scale configuration and calibration) stored in EEPROM
    with software version numbers 1-70-28 and 2-0-0; access to calibration mode only by operating a switch
    behind a sealing cap; EEPROM, calibration switch and load cell secured by a tamper-evident solution
    bearing a securing mark.
