- role: load_cell
  type_designations:
  - HBM PW15AHC3
  alternatives: OR
  characteristics:
    load_cell_type: Stainless Steel Single Point Load cell
    used_with_base_series: BSF Torsion
    used_with_base_models:
    - BSF-99-3
    - BSF-99-6
    - BSF-1214-15
    - BSF-1214-30
