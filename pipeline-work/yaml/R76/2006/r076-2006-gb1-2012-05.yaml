  description: >-
    This family of instruments is designated the ZQ375 Checkweigher and comprises the Torsion base and
    Diamond base models. The instruments are Class III, mains or battery-powered, self-indicating, non-automatic
    weighing instruments, and are not designed for direct sales to the public.
