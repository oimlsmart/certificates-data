certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - BBA...-400...
  - BBD...-400...
  - BBK...-400...
  module_designation:
  description: >-
    Non-automatic weighing instrument for accuracy class (II) or (III) or (IIII), composed of indicator/terminal
    IND400 with analog load cells, digital load cells or weighing modules, and the Rainbow data processing
    device. For each model, the compatibility of load cells and indicator is established by the manufacturer
    by means of the compatibility of modules form, contained in OIML R 76-1:2006 Annex F.
