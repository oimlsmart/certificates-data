certified_type:
  category: Indicator
  type_designations:
  - CDI-1600
  module_designation:
  description: >-
    The CDI-1600 is a self-indicating, mains-powered indicator designed to be used as part of a single
    range, single or dual-scale, Class III or IIII, non-automatic weighing instrument. Features: stainless
    steel enclosure fitted with panel mount bracket or tilt stand; colour LCD display; 27-button keypad
    (5 function keys, 5 primary scale function keys, 4 navigation keys, enter key, 12-key numeric keypad);
    connections and ports located on the bottom face. Devices: semi-automatic zero setting, zero tracking,
    semi-automatic subtractive tare weighing, preset tare, zero indicator, indication of stable equilibrium,
    gross/net/tare display, single or dual-scale, totalisation, display check at power up, printing. Interfaces:
    6-wire load cell connection, RS232/RS485, Ethernet, USB, digital I/O, PS/2. Legally relevant software
    designated version V2.xx.xx; legally relevant parameters (Service menu) accessible only via calibration
    switch on the CPU board. Access to load cell connection(s) and calibration switch is prevented by
    sealing the enclosure (wire-and-seal or tamper-evident sticker with securing mark).
