certified_type:
  category: Indicator
  type_designations:
  - DD700
  - DD700IC
  - DD700I
  description: >-
    Self-indicating indicators, mains or DC powered, designed to be used as part of Class III or IIII
    non-automatic weighing instruments. DD700: ABS enclosure; DD700IC: stainless steel enclosure with
    cable connectors; DD700I: stainless steel enclosure with cable glands and optional multicolour LED
    bar. Alternative construction: DD700 Panel mount version with casing of stainless steel and iron designed
    for rack placement.
