  module_designation: Analog data processing device
  description: >-
    Analog data processing device (module) for non-automatic weighing instruments. Devices: initial zero-setting,
    semi-automatic zero-setting, zero tracking, semi-automatic subtractive tare, preset tare, automatic
    tare, event counter (TAC). Peripheral interfaces: RS485, RS232, CANopen, 2 logic level inputs, 2 open-drain
    outputs, characterised "Protective interfaces" according to paragraph 8.4 in the Directive. Software
    version viewable via "FFV" command responding with 'Vxx.yy' or 'V:xx.yy.zz'.
