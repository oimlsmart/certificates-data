certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - BCA01A
  - BCA01B
  - BCA01C
  module_designation: Not applicable
  description: >-
    Non-automatic electromechanical weighing instrument for persons. The weighing instrument consists
    of a weighing platform with four strain gauge load cells, an indication for displaying the weighing
    result and a membrane keyboard to operate the instrument. The weighing ranges with Max, Min, e, d
    and number of verification scale intervals may be chosen within the limits of No. 3.2 of R 76-1 and
    of table 1.
