certified_type:
  category: Indicator
  type_designations:
  - MATRIX II
  module_designation:
  description: >-
    This indicating device, designated the MATRIX II, is designed to be used as part of a single or dual
    range, Class III or IIII, non-automatic weighing instrument. The indicator is self-indicating, and
    mains-powered or DC-powered. The instrument is not designed for direct sales to the public. Stainless
    steel enclosure, LCD display, operator keypad with 29 keys. Interfaces: analog load cell connection,
    digital load cell connection, RS232/485, PS/2, Ethernet (optional).
