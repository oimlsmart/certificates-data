certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - PB
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    Non-automatic electronic weighing instrument, type PB. Single interval or multi interval (dual). Power
    supply: 12 VDC supplied by external 100-240 VAC/DC adapter; optional a rechargeable 6 VDC battery
    or 4 x 1.5 VDC standard non-rechargeable batteries (C-type) may be used. Software designation yy4xx
    (yy = optional country specific code, xx = non-legal minor changes in the software); this information
    is displayed at power up. Devices: initial zero setting device (≤ 20% of Max), semi-automatic zero
    setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), zero indicator, net indicator, stable
    weight indicator, semi-automatic subtractive tare balancing device, gravity compensation, totalisation,
    weighing unstable samples, low battery indicator, calibration/set-up mode via sealed internal switch.
    Interfaces: RS232, Bluetooth.
