certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - M-300
  - M300
  description: >-
    Class III, mains or battery-powered, self-indicating non-automatic weighing instrument designed to
    record the weight of a baby. Shall not be used for direct sales to the public. LCD display (5 digits,
    with Zero, Net and Hold indicators) fitted into the load receptor; three buttons (Tare, Hold, On/Off/Zero);
    aluminium base enclosure containing the load cell and electronics; plastic load receptor with tray
    for baby weighing; level indicator next to the display; four adjustable feet for levelling. Sealed
    with tamper-evident labels over one of the screws in the base plate and over the service-button access
    hole.
