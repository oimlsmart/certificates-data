certified_type:
  category: Indicator
  type_designations:
  - CW90-A
  - CW90-E
  - CW90X-A
  - CW90X-E
  module_designation:
  description: >-
    Weighing indicators, as part of a non-automatic weighing instrument, designed to be used as part of
    Class III or IIII non-automatic weighing instruments. Self-indicating, mains or DC-powered, operating
    as single-interval instruments. Controller housed in stainless steel enclosure; LED display with enunciators
    (stability, zero, gross/net, units, tare, preset tare, percentage); UNDER, ACCEPT and OVER bands;
    function and navigation keys; numeric keypad (CW90-A and CW90-E only). Devices: semi-automatic zero
    setting, zero-tracking, subtractive semi-automatic tare balancing, pre-set tare, checkweighing, printing,
    direct sales to the public (if preset tare is disabled). Protected interfaces: load cell 4 or 6-wire
    connection, RS232, 20mA current loop, Ethernet TCP/IP (wired, shielded cable required), Wireless LAN
    Card Wi-Fi 802.11 A/B, USB, fiber optic, digital I/O (braided cable with added ferrite required).
