certified_type:
  category: Indicator
  type_designations:
  - LCA-2
  module_designation: Non-automatic weighing instrument
  description: >-
    Electronic weighing indicator (module) for non-automatic weighing instruments. Weighing range: single-interval,
    multi-range or multi-interval (triple). Devices: semi-automatic zero-setting device (range ±2% of
    Max), automatic zero-tracking device (range ±2% of Max), initial zero-setting device (range ±10% of
    Max), semi-automatic subtractive tare device, printing, operator information messages, and zero /
    stable equilibrium / net indicators. Interfaces: RS-232 / RS485C and RS422; the interfaces do not
    have to be secured. Software revision level is displayed during the power-up sequence; approved software
    version is 1.x.y, where x and y are subversion numbers for error correction and minor changes of non-legal
    functionality.
