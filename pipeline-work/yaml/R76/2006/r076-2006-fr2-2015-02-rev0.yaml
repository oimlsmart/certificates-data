certified_type:
  category: Indicator
  type_designations:
  - X241-PMNET
  module_designation: Digital data processing unit
  description: >-
    Digital data processing unit type X241-PMNET presented as a separate module intended to be integrated
    in a non-automatic weighing instrument. It may be in a metallic box or in the form of an electronic
    card integrated in the box of the compatible terminal to which it is connected. It is intended to
    be connected to one or several load cells with digital output having an OIML-MAA-R60 certificate (directly
    or through a junction box), to the PMNET communication network, and to a compatible terminal having
    an OIML-MAA-R76 certificate.
