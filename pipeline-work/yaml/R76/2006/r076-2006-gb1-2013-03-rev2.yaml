certified_type:
  category: Indicator
  type_designations:
  - C510
  - C520
  - C530
  description: >-
    Digital indicating device for use as part of a single/dual range/interval, Class III non-automatic
    weighing instrument. Self-indicating, DC or mains-powered. C510 features: ABS plastic enclosure, six
    digit LED display, five function keys, weighing status, multiple range/interval status, connections
    and ports located at the rear. Devices: extended indicating device, printing device, totalising device,
    initial zero setting device, zero tracking device, semi-automatic zero setting device, tare setting
    device (semi-automatic, balancing, subtractive or additive), preset tare device, multi-range device,
    multi-interval device, lb/kg switching device, gross/net switching device, calibration device, piece
    counting device, fault handling device, display test device on power up, alibi memory device, zero
    indicator, indication of stable equilibrium.
