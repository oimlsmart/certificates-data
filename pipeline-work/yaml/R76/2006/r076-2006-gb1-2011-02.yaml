certified_type:
  category: Indicator
  type_designations:
  - 3590EXPC
  - 3590EXT
  - CPWE
  - CPWET
  module_designation:
  description: >-
    Weight indicators designed to be connected to a load receptor to form a Class III and IIII non-automatic
    weighing instrument. Features: ABS plastic or stainless steel enclosure; LCD or LED display; function
    keys; connections and ports located at the back. Interfaces: 4 or 6-wire load cell connection, DC
    voltage input, RS-232, RS-485, control inputs/outputs, USB, Ethernet, Bluetooth. Sealing via sealed
    switch located on the main board.
