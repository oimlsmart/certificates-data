certified_type:
  category: Indicator
  type_designations:
  - CTI-600A
  - CTI-600D
  module_designation: Non-automatic weighing instrument
  description: >-
    Non-automatic weighing instrument: plastic construction, keypad with numerical, navigation and function
    keys, 4.3" LCD display and indicators. Software designated "V1.xx". Devices: initial zero setting
    device, semi-automatic zero setting device, zero tracking device, zero indicator, gross/net indicator,
    stable indicator, semi-automatic subtractive tare balancing device, preset tare, gravity compensation,
    hold function, soft function keys, memory storage. Interfaces: RS232/RS485, USB, Relay IN/OUT, Analogue
    OUT.
