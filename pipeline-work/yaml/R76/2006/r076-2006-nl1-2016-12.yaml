certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CBS-1000
  - CS-1000
  module_designation:
  description: >-
    Any load cell(s) may be used under this certificate, provided: there is an OIML Certificate of Conformity
    (R 60) issued for the load cell by an issuing authority; the certificate contains the load cell types
    and the necessary load cell data required for the compatibility checking of modules (OIML R 76 Annex
    F) and any particular installation requirements; a load cell marked NH is allowed only if humidity
    testing to OIML R 76 has been conducted on this load cell. Compatibility of load cells and indicator
    is established by the manufacturer by means of the compatibility of modules form (OIML R 76 Annex
    F) at the time of putting into use.
