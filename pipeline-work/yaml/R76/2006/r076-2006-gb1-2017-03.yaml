certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - 4800MLF
  - 4800XLF
  description: >-
    The SR Instruments 4800MLF series and 4800XLF series are self-indicating, single-interval, non-automatic
    weighing instruments, designed for medical use to weigh patients. Three-piece plastic housing with
    load hanging joints above and below for attachment, which allow the load cell to pivot freely. Devices:
    initial zero-setting device (+10% of Max), zero indicator, stable weight indicator, gravity compensation,
    automatic shut-off after pre-designated time. The instrument has no approved interfaces.
