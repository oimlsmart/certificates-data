  category: Non-automatic weighing instrument
  type_designations:
  - L-EQ Series
  - L-EQ-4/8
  - L-EQ-8/16
  - L-EQ-10/20
  - L-EQ-20/40
  - L-EQ-m/n-P
  module_designation: Not applicable
  description: >-
    Family of Class III, mains or battery-powered, self-indicating, single-interval, non-automatic weighing
    instruments designated the Torrey L-EQ Series, suitable for direct sales to the public. Stainless
    steel construction with stainless steel load receptor, operator's keypad with 9 keys, front display,
    level indicator under the load receptor, adjustable feet. Devices: initial zero setting device, semi-automatic
    zero setting device, zero tracking device, zero indicator (ZERO), semi-automatic subtractive tare
    balancing, net indicator (NET), checkweighing, HIGH/LOW annunciators. Load cell: Medidata model M022.
    Interfaces: RS232 and tare footswitch connector. Software identification 'L19L5'. Alternative version
    L-EQ-m/n-P series with identical metrological characteristics but different stainless-steel load receptor;
    instruments may alternatively be manufactured by Sammic S.L.
