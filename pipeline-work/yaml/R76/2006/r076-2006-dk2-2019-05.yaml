certified_type:
  category: Indicator
  type_designations:
  - 47-11
  module_designation: Non-automatic electronic weighing indicator
  description: >-
    Non-automatic electronic weighing indicator. The name of the instrument may be followed by alphanumeric
    characters for technical, legally or commercial characterisation of the instrument. Interfaces: load
    cell input; RS485/RS232; USB; external display connection; Ethernet TCP/IP. Devices: initial zero
    setting device (±20% of Max); semi-automatic zero setting device (±2% of Max); zero tracking device
    (±2% of Max); automatic zero-setting device (±2% of Max); semi-automatic subtractive tare device;
    preset tare device; printing device; data storage device; price computing device; real time clock;
    extended resolution device (temporary); stable equilibrium, zero, gross and net indicators.
