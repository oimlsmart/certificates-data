certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - OP-960+ Baggage Scale
  - ABS-960+ Baggage Scale
  description: >-
    Class III, self-indicating, single-interval, non-automatic weighing instrument. Comprises an Operator
    Panel (OP-960+) connected to a load receptor; a Passenger Panel (PP-950-960) may also be connected
    via RS-485. The load receptor incorporates a conveyor and may be fitted with a motorised conveyor;
    it shall be permanently installed.
