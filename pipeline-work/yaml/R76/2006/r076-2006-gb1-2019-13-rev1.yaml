certified_type:
  category: Non-automatic Weighing Instrument
  type_designations:
  - FL36-SC
  - 200-0000
  description: >-
    Umano Medical hospital beds FL36-SC series (brand names OOK<Snow>, OOK<Snow>MH and OOK<Cocoon>) and
    200-0000 series (brand name Ook Snow ALL) incorporating a Class III, mains operated, self-indicating
    non-automatic weighing instrument. Height and surface contours of the bed are adjustable; includes
    movable and latchable siderails and control boards. TFT-LCD touch screen display; weighing control
    and display functions on the footboard; four load cells installed at the four corner positions of
    the bed base; gravity compensation via accelerometer sensor on the main board; combined semi-automatic
    zero setting device and semi-automatic tare balancing device. Not to be used for direct sales to the
    public. Load cell cable and analogue-to-digital converting PCB sealed with tamper-evident labels;
    calibration counter value written on the rating plate.
