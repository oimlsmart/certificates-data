certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CB-xxxC
  - CB-xxxE
  module_designation: Non-automatic weighing instrument
  description: >-
    Non-automatic weighing instrument of accuracy class III, single-interval or multi-interval (dual),
    with initial zero setting device (≤ 20% of Max), semi-automatic zero setting device (≤ 4% of Max),
    automatic zero setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), semi-automatic subtractive
    tare weighing device, label printing, multi-vendor operation, stable equilibrium, zero and net indicators,
    and gravity compensation. Interfaces: RS232C, USB, RS485, Bluetooth (the interfaces do not have to
    be secured). Software designated "V1.xx" (xx represents minor non-legal changes).
