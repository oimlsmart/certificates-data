certified_type:
  category: Weighing instrument
  type_designations:
  - ABS-960+
  module_designation:
  description: >-
    ABS-960+ Baggage Scale: Class III, self-indicating, single interval, non-automatic weighing instrument.
    May be used for direct sales to the public. Comprises an Operator Panel (OP-960+) connected to a load
    receptor; a Passenger Panel (PP-950-960) may also be connected via RS-485. The load receptor may be
    fitted with a motorised conveyor. Devices include initial zero-setting, semi-automatic zero setting,
    zero tracking, zero indicator, indication of stable equilibrium, display checking at power-up, totalisation
    function, bag counting, acting upon significant faults, and remote operation via computer. Sealing
    of the Operator Panel enclosure and load cell connection is by tamper-evident method.
