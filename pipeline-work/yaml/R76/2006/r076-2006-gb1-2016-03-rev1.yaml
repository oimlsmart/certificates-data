certified_type:
  category: Indicator
  type_designations:
  - ZM505 / ZM510 / ZM605 / ZM615 Series
  - ZM505
  - ZM510
  - ZM605
  - ZM615
  module_designation: Not applicable
  description: >-
    Family of programmable, self-indicating, mains, DC or battery-powered indicators designed to be used
    as part of Class III or IIII non-automatic weighing instruments. Construction designation 'Prefix-XYZ':
    model prefix ZM505/ZM510/ZM605/ZM615 = standard indicator; X = enclosure material (S = stainless enclosure);
    Y = mounting orientation (D = desktop, P = panel mount); Z = display type (3 = IBN dot graphic, black
    background with green digits; 4 = dot graphic, green background with black dots, capable of negative
    image; 5 = large dot graphic, green backlight with black dots, capable of negative image). Devices:
    semi-automatic zero setting (max 4% Max), zero tracking (max 4% Max), semi-automatic subtractive tare
    weighing, pre-set tare, recall of gross indication when tare active, determination and indication
    of stability of equilibrium, checking of display, printing, PLUs, alibi storage, gravity compensation,
    real time clock, command via external device (PC), single or multi-range/multi-interval operation
    (max 3 partial ranges), range in use indicators, connection to up to 4 load receptors with load receptor
    number indicator, and connection to digital load cells. Standard interfaces: 4-wire or 6-wire shielded
    load cell connection, 3 logic level inputs, 3 open collector outputs, 3 RS232 serial ports, 10/100
    Ethernet, 2 USB host ports. Optional interface cards/PCBs: analogue output (0-10 VDC, 4-20 mA), current
    loop (4-20 mA, RS485/RS422), wireless LAN 802.11b/g, USB device, 5V or 10V excitation load cell interface
    boards, Bluetooth, DeviceNet, Profibus, Ethernet PoE pass-through, quad DC input/output, quad AC input/output,
    external I/O expansion, programmable digital I/O. Legally relevant software AWT30-500208, protected
    by sealed jumper or password/incrementing counters. May be connected to a maximum of two Avery Weigh-Tronix
    BSQ series digital bases.
