certified_type:
  category: Indicator
  type_designations:
  - ZM301
  - ZM303
  - ZM305
  - ZQ375
  description: >-
    Family of self-indicating indicators (Avery Weigh-Tronix ZM301 / ZM303 / ZM305 / ZQ375 Series), mains,
    DC or battery-powered, for use as part of Class III or IIII Non-Automatic Weighing Instruments. Model
    designation format Prefix-XYZ: X = enclosure material (S = stainless, A = alloy), Y = mounting orientation
    (D = desktop, G = desktop with GTN inbound-outbound software and keypad variant, P = panel mount),
    Z = display type (1 = IBN black background with green digits, 2 = TN green background with black digits).
    Software designated AWT30-500161 version 1.x.x.x or 2.x.x.x; version 1.x.x.x software may not be fitted
    to the ZM305 series, which requires version 2.x.x.x or higher.
