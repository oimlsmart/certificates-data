      value: 4 or 6-core with braided outer screen, flexible PVC overall jacket, 0.5 mm² per core
    interfaces:
      value: >-
        Load cell 4-wire or 6-wire shielded connection; 3 x logic level inputs; 3 x open collector outputs;
        2 x RS232 serial ports; 10/100 Ethernet; USB Host
    devices_and_functions:
      value: >-
        Semi-automatic zero setting, zero tracking, semi-automatic subtractive tare weighing, pre-set
        tare, recall of gross indication when tare is active, determination and indication of stability
        of equilibrium, checking of display, printing, PLUs, alibi storage device, gravity compensation,
        checkweighing, real time clock, counting, weigh labelling, command via external device (PC), accumulation,
        target weighing, batching, peak hold, simple checkweighing Sim375 / mid-level checkweighing Mid375
        / advanced checkweighing Adv375 / percentage checkweighing Per375 / grading checkweighing Grad375
        (ZQ375 models only), GTN inbound-outbound (ZM305-SG1 model only, with V2.x.x.x software), gross/net/tare/preset
        tare/print/zero/motion/accumulation/over-under weight and network indicators
    software_designation:
      value: AWT30-500161
