certified_type:
  category: Indicator
  type_designations:
  - CDI-1600
  module_designation:
  description: >-
    Class III or IIII, self-indicating, single-interval, single or dual-scale non-automatic weighing instrument;
    not designed for direct sales to the public. Stainless steel enclosure fitted with panel mount bracket
    or tilt stand; colour LCD display; 27-button keypad (5 function keys, 5 primary scale function keys,
    4 navigation keys, enter key, 12-key numeric keypad); connections and ports located on the bottom
    face. Devices: semi-automatic zero setting (≤ 4% of Max), zero tracking (≤ 4% of Max), semi-automatic
    subtractive tare weighing (T = -Max), preset tare, zero indicator, indication of stable equilibrium,
    gross/net/tare display, single or dual-scale, totalisation, display check at power up, printing, data
    storage device (alibi memory). Any compatible load cell(s) may be used provided an OIML R60 Certificate
    of Conformity exists containing the load cell types and data required for the manufacturer's declaration
    of compatibility of modules; a load cell marked NH is allowed only if humidity testing to R76 has
    been conducted on it; load cell transmission must conform to a standard type. Interfaces: RS232/RS485,
    Ethernet, USB, digital I/O, PS/2. Legally relevant software is designated version V2.xx.xx; access
    to legally relevant parameters and software download only possible by pressing the calibration switch
    on the CPU board. Sealing: access to load cell connection(s) and the calibration switch must be prevented
    by a tamper-evident solution. No authorised alternatives.
