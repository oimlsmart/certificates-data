certified_type:
  category: Indicator
  type_designations:
  - X241-TR
  module_designation: Analog data processing unit
  description: >-
    Analogue data processing unit type X241-TR is a separate module intended to be integrated in a non
    automatic weighing instrument. It is in the form of an electronic card that may be included in a metallic
    box or in the box of the associated terminal. It is intended to be connected to a weighing channel
    comprising strain gauge load cells with analogue output. It performs analogue to digital conversion
    of the signal and has in its memory all setting parameters of the whole instrument as well as the
    signature of the associated terminal.
