certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CS Series
  description: >-
    Non-automatic weighing instrument of accuracy class (III). Supported weighing range configurations:
    single interval, multi-interval and multiple range. The software identification is displayed permanently
    in the weighing window, or it is displayed when the text 'Version' located in the weighing window
    is pressed. Intended to be used for direct sales to the public.
