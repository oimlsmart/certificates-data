certified_type:
  category: Indicator
  type_designations:
  - DD1050
  - DD1050i
  - DD2050
  description: >-
    Indicating devices designed to be used as part of a Class III or IIII non-automatic weighing instrument.
    They operate as single interval, multi-interval or multi-range, are self-indicating and mains or DC-powered.
    Devices include: initial zero setting, semi-automatic zero setting, zero tracking, automatic zero
    setting (negative load indications for more than 5 s), semi-automatic subtractive tare weighing, determination
    and indication of stability of equilibrium, zero indicator, preset tare, MPP Alibi storage device,
    support for up to 4 load receptors and load receptor summation, weighbridge modes (AdR/RDA, RcD, RpD/RCP),
    identification and recognition of A/D converters and digital load cells, and weight data transmission
    in open networks or wireless transmission in protected mode complying with Welmec 7.2. Optional connection
    to an external PC for printing of measurement data (integrated printer on the DD2050). Sealing: physical
    via protected switch, or software via password protection with a non-resettable SW seal counter.
