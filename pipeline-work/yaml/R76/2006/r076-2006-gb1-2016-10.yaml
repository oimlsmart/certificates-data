certified_type:
  category: Indicator
  type_designations:
  - T82XWT
  description: >-
    The T82XWT weight indicating device designed to be connected to a load receptor to form a Class III
    and IIII, non-automatic weighing instrument. Features: stainless steel enclosure; LCD or LED display,
    graphic touch; function keys; connections and ports located at the back. Devices include initial zero-setting,
    semi-automatic zero setting, zero tracking, semi-automatic subtractive tare weighing, pre-set tare,
    recall of gross indication when tare is active, determination and indication of stability of equilibrium,
    multi-range and multi-division function, checking of display, printing, alibi storage device, gravity
    compensation, checkweighing, real time clock, counting, command via external device (PC), accumulation,
    battery level indicator, remote control, peak hold, and gross/net/tare/preset tare/print/zero/motion/accumulation/over-under
    weight/network indicators. Sealing: calibration and setup parameters accessible only via sealed switch
    on the main board. Load cells: any compatible load cell(s) with a valid OIML R60 Certificate of Conformity,
    per compatibility of modules calculation.
