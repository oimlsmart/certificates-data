certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DD1010
  - DD1010IC
  - DD1010I
  - DD1010H
  - DD1010ICH
  - DD1010IH
  - DD1010 Flynet
  - DD1010IC Flynet
  - DD1010I Flynet
  - DD1010H Flynet
  - DD1010ICH Flynet
  - DD1010IH Flynet
  module_designation: Not applicable
  description: >-
    Family of digital indicating devices designated DD1010, DD1010I, DD1010IC, DD1010H, DD1010IH and DD1010ICH
    (each also available with the alternative 'Flynet' motherboard, designation suffixed 'Flynet') connected
    to a weighing platform to form a Class III or IIII, AC mains or DC-powered, self-indicating, non-automatic
    weighing instrument. The instruments shall not be used for direct sales to the public. Devices: initial
    zero setting, semi-automatic zero setting, zero tracking, automatic zero setting (negative load indications
    for more than 5 s), semi-automatic subtractive tare weighing, preset tare, MPP Alibi storage device,
    up to 2 load receptors with summation, weighbridge modes (AdR/RDA, RcD, RpD/RCP), identification and
    recognition of A/D converters, digital load cells and DILINK junction box, encrypted weight data transmission
    to a remote indicator (load receptor and indicator must be simultaneously visible), optional connection
    to an external PC. Interfaces (max 30 m): load cell 6-wire shielded connection (analogue/digital),
    TTL 5V (not fitted with analogue load cell connection), RS232/422/485, Ethernet, Wi-Fi on core module
    (internal antenna), 0-10 V / 0-20 mA analogue input/output, digital I/O, field bus (Profibus...),
    USB host, SD card, audio; Flynet models additionally offer HDMI in place of TTL 5V. Sealing: physical
    sealing measures, common serial numbers, wire-and-seal, or software solution using recognition of
    unique S/N; SD card access prevented by tamper-evident seal; calibration/metrological configuration
    protected via physically protected switch or password with non-resettable 'SW seal counter'.
