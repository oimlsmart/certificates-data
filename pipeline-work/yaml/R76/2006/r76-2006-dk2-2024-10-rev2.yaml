certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - ProCuity MedSurg Bed
  module_designation: Non-automatic weighing instrument
  description: >-
    Non-automatic weighing instrument integrated in the ProCuity MedSurg bed. Devices: semi-automatic
    subtractive tare device; exchange equipment function*; weight logging device; operator information
    messages; gravity compensation device (sealed); stable equilibrium and net indicators. The scale has
    no interfaces. The legal software for the scale has its own version and checksum, which can be found
    in the setting menu.
