  - FG-60KCLWP
  - FG-60KACLWP
  - FG-150KCLWP
  - FG-150KACLWP
  module_designation: Non-automatic weighing instruments
  description: >-
    The FG-CWP series and FG-ACWP series are class III, self-indicating, non-automatic weighing instruments.
    The instruments are not designed for direct sales to the public. Bluetooth communication interface
    (to connect Personal computer). The legally relevant software is designated version P-1.xx, with x
    reflecting non-legally relevant changes. Access to the calibration switch is prevented by a tamper-evident
    lead and wire type seal.
