certified_type:
  category: Indicator
  type_designations:
  - DD1010
  - DD1010I
  - DD1010IC
  - DD1010H
  - DD1010IH
  - DD1010ICH
  description: >-
    Self-indicating digital weighing indicators, mains or DC powered, designed to be used as part of Class
    III or IIII non-automatic weighing instruments. Available in desktop and wall-mounted versions. Devices:
    initial zero setting, semi-automatic zero setting, zero tracking, automatic zero setting (negative
    load indications for more than 5 s), semi-automatic subtractive tare weighing, preset tare, determination
    and indication of stability of equilibrium, zero indicator, MPP alibi storage device, up to 2 load
    receptors with summation, weighbridge modes (AdR/RDA, RcD, RpD), identification and recognition of
    the A/D converter of each weighing channel and of digital load cells / DILINK junction box (new calibration
    required if not recognised at power up), weight data transmission in open networks or wireless transmission
    in protected mode per Welmec 7.2 (encrypted; load receptor and indicator must be simultaneously visible),
    optional connection to external PC with printing from the MPP alibi storage device. Sealing: physical
    (protected switch) or software (password protection with non-resettable SW seal counter and change
    logging). Interfaces: load cell 6-wire shielded connection (analogue/digital), RS232/422/485, Ethernet,
    Wi-Fi (internal antenna), 0-10 V / 0-20 mA analogue input/output, digital I/O, field bus (Profibus...),
    USB host, SD card, audio.
