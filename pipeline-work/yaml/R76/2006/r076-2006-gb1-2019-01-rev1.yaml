certified_type:
  category: Indicator
  type_designations:
  - ZM505
  - ZM510
  - ZM605
  - ZM615
  description: >-
    Family of programmable, self-indicating indicating devices (Avery Weigh-Tronix ZM505 / ZM510 / ZM605
    / ZM615 Series), mains, DC or battery powered, for use as part of Class III or IIII non-automatic
    weighing instruments. Model designation format "Prefix-XYZ": first digit X = enclosure material (S
    = stainless enclosure); second digit Y = mounting orientation (D = desktop, P = panel mount); third
    digit Z = display type (3 = IBN with dot graphic, black background with green digits; 4 = dot graphic,
    green background with black dots, capable of negative image; 5 = large dot graphic, green backlight
    with black dots, capable of negative image). ZM505/ZM605/ZM615 feature 29 operational keys (numeric
    keypad + 5 soft keys F1-F5); ZM510 features 48 operational keys (QWERTY keypad + 5 soft keys F1-F5).
    Devices: semi-automatic zero setting (<=4% Max), zero tracking (<=4% Max), semi-automatic subtractive
    tare weighing, pre-set tare, recall of gross indication when tare is active, determination and indication
    of stability of equilibrium, checking of display, printing, PLUs, alibi storage device, gravity compensation,
    real time clock, command via external device (PC), single or multi-range / multi-interval operation
    (maximum 3 partial ranges), range-in-use indicators (multi-range variant), connection to up to 4 load
    receptors with load receptor number indicator, connection to digital load cells, gross/net/tare/preset
    tare/print/zero/motion/accumulation/over-under weight/network/battery indicators. Standard interfaces:
    load cell 4-wire or 6-wire shielded connection, 3 x logic level inputs, 3 x open collector outputs,
    3 x RS232 serial ports, 10/100 Ethernet, 2 x USB Host. Optional interface/PCB cards: analogue output
    (0-10 VDC, 4-20 mA), current loop (4-20 mA, RS485/RS422), internal wireless LAN (802.11b/g), USB device,
    load cell interface board with 5 V excitation (second platform, max 6 load cells), load cell interface
    board with 10 V excitation (second platform, max 16 load cells), Bluetooth, DeviceNet, Profibus, Ethernet-to-PoE,
    quad DC input (4 x 4-30 VDC opto-isolated), quad DC output (4 x 3-60 VDC solid state relay), quad
    AC input (4 x 120-240 VAC opto-isolated), quad AC output (4 x 20-240 VAC solid state relay), external
    I/O expansion, programmable digital I/O (8 logic level I/O, pulse counter, frequency measurement,
    quadrature decode, PWM). Sealing: sealed jumper on main board or software means (password and incrementing
    counters); tamper-evident or wire seals prevent access to electronics, jumper and load cell connections.
    Load cells: any compatible load cell(s) with a respective OIML R60 Certificate of Conformity may be
    used; load cells marked NH allowed only if humidity testing to R76 has been conducted; compatibility
    established by manufacturer's compatibility of modules calculation at verification; load cell transmission
    must conform to a standard type.
