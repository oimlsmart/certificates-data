matrix_tables:
- name: Characteristics of the non-automatic weighing instrument
  columns:
  - attribute
  - PS-178
  - PS-160 (30 kg or 35 kg)
  - PS-160 (6 kg <= Max <= 30 kg)
  rows:
  - attribute: accuracy_class
    PS-178: "(III)"
    PS-160 (30 kg or 35 kg): "(III)"
    PS-160 (6 kg <= Max <= 30 kg): "(III)"
  - attribute: maximum_capacity
    PS-178: 35 kg
    PS-160 (30 kg or 35 kg): 30 kg or 35 kg
    PS-160 (6 kg <= Max <= 30 kg): 6 kg <= Max <= 30 kg
  - attribute: verification_scale_interval
    PS-178: e >= 0.5 g
    PS-160 (30 kg or 35 kg): e >= 0.5 g
    PS-160 (6 kg <= Max <= 30 kg): e >= 1 g
  - attribute: minimum_capacity
    PS-178: 20 e; 5 e (for postal use)
    PS-160 (30 kg or 35 kg): 20 e; 5 e (for postal use)
    PS-160 (6 kg <= Max <= 30 kg): 20 e; 5 e (for postal use)
  - attribute: weighing_ranges
    PS-178: Multi-interval
    PS-160 (30 kg or 35 kg): Multi-interval
    PS-160 (6 kg <= Max <= 30 kg): Single interval or Multi-interval
  - attribute: max_scale_intervals_single_range
    PS-178: "-"
    PS-160 (30 kg or 35 kg): "-"
    PS-160 (6 kg <= Max <= 30 kg): n <= 7500
  - attribute: max_scale_intervals_multi_interval_per_partial_range
    PS-178: n <= 4000 (per partial weighing range)
    PS-160 (30 kg or 35 kg): n <= 4000 (per partial weighing range)
    PS-160 (6 kg <= Max <= 30 kg): n <= 7500 (per partial weighing range)
  - attribute: maximum_number_of_partial_weighing_ranges
    PS-178: '4'
    PS-160 (30 kg or 35 kg): '4'
    PS-160 (6 kg <= Max <= 30 kg): '3'
  - attribute: tare
    PS-178: T <= -(Max1 - e1)
    PS-160 (30 kg or 35 kg): "-"
    PS-160 (6 kg <= Max <= 30 kg): "-"
  - attribute: temperature_range
    PS-178: "-10 °C / +40 °C"
    PS-160 (30 kg or 35 kg): "-10 °C / +40 °C"
    PS-160 (6 kg <= Max <= 30 kg): "-10 °C / +40 °C"
  - attribute: power_supply_voltage
    PS-178: >-
      12 V DC via 100-240 V AC 50/60 Hz plug-in power supply; alternatively 9 V DC via external battery
      or 12 V DC via RS232 interface
    PS-160 (30 kg or 35 kg): 12 V DC via 100-240 V AC 50/60 Hz plug-in power supply
    PS-160 (6 kg <= Max <= 30 kg): 12 V DC via 100-240 V AC 50/60 Hz plug-in power supply
  - attribute: software_version
    PS-178: 1.xx (xx between 10 and 99, non-legally relevant software)
    PS-160 (30 kg or 35 kg): 1.xx (xx between 03 and 99, non-legally relevant software)
    PS-160 (6 kg <= Max <= 30 kg): 1.xx (xx between 03 and 99, non-legally relevant software)
