certified_type:
  category: Indicator
  type_designations:
  - MATAS PB16
  - MATAS P16B
  description: >-
    Indicating device designed to be used as part of a single/multi-interval, Class III or IIII, non-automatic
    weighing instrument. Self-indicating and mains-powered. The instruments are not designed for direct
    sales to the public. Main features: aluminium enclosure, LED display, operator keypad with 7 navigation
    and function keys, LED enunciators. Devices: initial zero setting device on power up, semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare balancing, gross/net/zero enunciators,
    indication of stable equilibrium, gravity compensation. Interfaces: load cell connection, RS232, USB
    printer, LAN. Software held in firmware with identification number SOFt 1.x; access to legally relevant
    parameters prevented by jumper JP1 on the main board. Any compatible R60-certified load cell may be
    used subject to compatibility of modules.
