certified_type:
  category: Indicator
  type_designations:
  - ZM510-SD4
  module_designation:
  description: >-
    Avery Weigh-Tronix ZM510-SD4 indicating device: programmable, self-indicating, mains-powered, designed
    to be used as part of a Class III or IIII Non-Automatic Weighing Instrument. Designation format 'Prefix-XYZ':
    ZM510 = standard indicator; S = stainless enclosure; D = desktop mounting; 4 = dot graphic display
    (green background with black dots). Features 48 operational keys including a QWERTY keypad and 5 soft
    keys (F1-F5). Devices: semi-automatic zero setting (≤4% Max), zero tracking (≤4% Max), semi-automatic
    subtractive tare weighing, pre-set tare, recall of gross indication when tare active, determination
    and indication of stability of equilibrium, checking of display, printing, PLUs, alibi storage, gravity
    compensation, real-time clock, command via external device (PC), status indicators (Gross, Net, Tare,
    Preset tare, Print, Zero, Motion, Accumulation, Over/Under weight, Network, Battery), single or multi-range
    / multi-interval operation, range-in-use indicators (multi-range variant), connection to digital load
    cells. Standard interfaces: load cell 4-wire or 6-wire shielded connection, 3 logic level inputs,
    3 open collector outputs, 2 RS232 serial ports, 10/100 Ethernet, USB host. Legally relevant software
    AWT30-500208, protected via sealed jumper on main board or password with incrementing counters.
