certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Marsden M-300
  - Marsden M300
  module_designation: Not applicable
  description: >-
    Class III, mains or battery-powered, self-indicating non-automatic weighing instrument designed to
    record the weight of a baby; shall not be used for direct sales to the public. LCD display fitted
    into load receptor: 5 digits, with Zero, Net and Hold indicators. Three buttons (Tare, Hold, On/Off/Zero).
    Aluminium base enclosure containing the load cell and electronics. Plastic load receptor with tray
    for baby weighing. Level indicator next to the display. Four adjustable feet for levelling. Sealed
    by tamper-evident label over a base-plate screw (preventing opening of the housing) and over the access
    hole of the calibration service button.
