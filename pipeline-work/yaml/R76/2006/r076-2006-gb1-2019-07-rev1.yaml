certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Magellan 9300i
  - Magellan 9400i
  module_designation: Not applicable
  description: >-
    Magellan 9300i or Magellan 9400i scanner/scale (models 939404 and 939406), Class III, mains operated,
    self-indicating, weight only, single or dual interval, non-automatic weighing instrument designed
    for direct sales to the public. Diecast base unit supports the load cell, barcode scanner assembly,
    main board and analogue boards; the steel L-shaped load receptor is mounted on the four supporting
    points of the scale sub-assembly. Designed to be flush-mounted in a fixed position in a checkout surface
    and may be fitted with a level indicator. Legally relevant parameters (scale configuration and calibration)
    are stored in EEPROM; access to calibration mode only via a switch behind a sealing cap; software
    version numbers 1-70-28 and 2-0-0. Interfaces: POS terminal (RJ10), remote display (RJ4), scale host
    (RJ10), auxiliary port (RJ10), EAS port (RJ45), power (Molex 3 pin), USB, image port. Securing by
    tamper-evident solution bearing a manufacturer's and/or verification officer's mark.
