certified_type:
  category: Weighing module for NAWI
  type_designations:
  - HRP xxx.n.yyy
  - PL.xxx.n.HRP.yyy
  - HRP.EX xxx.n.yyy
  - PL.xxx.n.HRP.EX.yyy
  module_designation: Not applicable
  description: >-
    Weighing module for non-automatic weighing instruments (NAWI) of accuracy class II or III. The module
    determines the weighing result and its status via embedded software in real time and transmits the
    result in digital form via a protected interface to a weighing indicator operating as a terminal for
    displaying and/or printing weighing results. Available as HRP standard version and HRP.EX version,
    the latter powered through the dedicated power supply PM02.EX.
