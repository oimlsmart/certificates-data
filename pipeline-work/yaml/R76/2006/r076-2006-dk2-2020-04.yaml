certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SWII
  - PRII
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    SWII and PRII non-automatic electronic weighing instruments (single and multi interval, dual). Devices:
    initial zero setting device (≤ 20% of Max), semi-automatic zero setting device (≤ 4% of Max), zero
    tracking device (≤ 4% of Max), zero indicator, net indicator, stable weight indicator, unit change
    (g, kg), semi-automatic subtractive tare balancing device, gravity compensation, price-computing (PRII
    except D-types), totalisation (PRII except D-types, only allowed if all transactions are printed),
    PLU (PRII except D-types), piece counting (SWII and PRII-D types), hold function (SWII and PRII-D
    types), manual checkweighing (SWII and PRII-D types).
