certified_type:
  category: Indicator
  type_designations:
  - CI-2001 Series
  - CI-2001
  - CI-2001A
  - CI-2001B
  description: >-
    Indicating device CI-2001 designed to be used as part of a single range, Class III or IIII, non-automatic
    weighing instrument. The indicators are self-indicating and mains-powered; not designed for direct
    sales to the public. Plastic or stainless steel enclosure; LED display and LED enunciators (CI-2001A)
    or LCD display and LCD enunciators (CI-2001B); operator keypad with 6 navigation and function keys.
    Software held in firmware with identification number V1.xx, displayed at power-up; access to legally
    relevant parameters prevented by a switch on the main board; access to electronics, the switch and
    the load cell connection sealed using a tamper-evident method.
