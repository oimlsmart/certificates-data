certified_type:
  category: Indicator
  type_designations:
  - ID510
  - ID511
  - ID551PN
  module_designation: Non-automatic weighing indicator
  description: >-
    Single-interval non-automatic weighing indicator. Devices: initial zero setting device (≤ 20% of Max),
    semi-automatic zero setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), semi-automatic
    subtractive tare balancing device, zero indicator, net indicator, stable weight indicator, weighing
    of unstable items, totalisation (except for ID551PN), indication of active scale (ID551PN), manual
    checkweighing (ID511). Approved software R1.01 dated 2018/01/29, displayed at power up. Interfaces
    (do not have to be secured): RS232, RS485, Ethernet, ProfiBus DP, Modbus RTU, Modbus-TCP, ProfiNet,
    CC-link, Ethernet/IP, Ethernet/CAT, CC-link IE, 4-20 mA current loop, digital input, digital output,
    Bluetooth.
