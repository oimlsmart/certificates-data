certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - UDS-series
  - UDS-300
  - UDS-300D
  - UDS-600-WP
  - UDS-700-WP
  module_designation: Non-automatic weighing instruments
  description: >-
    The UDS-series is a class III, self-indicating, non-automatic weighing instrument; the instruments
    are not designed for direct sales to the public. Devices: initial zero-setting device (≤20% of Max),
    semi-automatic zero-setting device (≤4% of Max), zero-tracking (≤4% of Max), semi-automatic subtractive
    tare weighing (T = -Max), zero indicator, indication of stable equilibrium device. Interfaces: serial
    data interface RS232C, ZigBee, Bluetooth. Legally relevant software version V 1.01, where a trailing
    'x' reflects non-legally relevant changes. Sealing: access to the calibration switch is prevented
    by a tamper-evident lead and wire type seal. Capacity configurations are shared across types: the
    seven configurations (up to Max 30 kg) apply to UDS-300 and UDS-300D; the first six configurations
    (up to Max 15 kg) apply to UDS-600-WP and UDS-700-WP. Dual values (a/b) denote multi-interval instruments:
    first value applies to the lower partial range/interval, second to the upper.
