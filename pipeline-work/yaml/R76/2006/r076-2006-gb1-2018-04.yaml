certified_type:
  category: Self-service checkout
  type_designations:
  - 7360 SelfServ checkout
  description: >-
    Complete self-service checkout till comprising a Class III, weight only, scanner/scale (flush mounted);
    15" touch-screen LCD display with integral PC hardware; payment devices (card payment device, note
    input, coin input, note change output, coin change output); receipt printer; and PC hardware running
    price-computing Point of Sale software. Security scale in bagging area (not used for legal purposes).
    Devices: totalising, price computing, printing, preset-tare, stability indicator, stability interlock,
    weight disturbance interlock, zero-tracking, initial zero-setting, semi-automatic zero setting (scanner/scale
    features).
