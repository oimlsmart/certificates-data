certified_type:
  category: Non-automatic electronic weighing instrument
  type_designations:
  - DL…
  - DSP…
  - DSW…
  module_designation: Non-automatic electronic weighing instrument
  description: >-
    DL, DSP and DSW are models within the DL series. The DL, DSP and DSW models use the same mainboard,
    and the scale body is identical across all three models; DSP and DSW are optional versions based on
    the DL model. DSW is equipped with a pole rear display with one weight window. DSP is equipped with
    a pole rear display with three windows showing unit price, total price and weight. The DSP… scale
    may be connected to a POS system using the DL… CON2 protocol.
