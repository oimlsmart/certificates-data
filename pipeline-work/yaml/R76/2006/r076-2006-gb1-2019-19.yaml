certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Cargo platform scales
  - CRF-1.5t
  - CRF-3t
  - CPF-3t
  - CPF-7t
  - CPF-10t
  - CVS-10t
  - CVS-20t
  module_designation: Not applicable
  description: >-
    Cargo platform scales comprising an Atrax CDI-1600 indicator connected to a weighing platform, forming
    a family of Class III, self-indicating, single-interval, non-automatic weighing instruments. The instruments
    are not designed for direct sales to the public. Indicator features: stainless steel enclosure with
    panel mount bracket or tilt stand, colour LCD display, 27-button keypad, connections and ports on
    bottom face. Platform frames: CRF (Cargo Roller Frame) with rollers or conveyor belt on SBM-2T mounts;
    CPF (Cargo Platform Frame) with or without rollers on SBM-5T mounts; CVF (Cargo Vehicle Frame) pit-mounted
    heavy-duty platform with weigh beam modules on DSB-25klb mounts (4 or 6 load mounts). Loads are transferred
    on and off the platform after static weighing only. Legally relevant software version V2.xx.xx.
