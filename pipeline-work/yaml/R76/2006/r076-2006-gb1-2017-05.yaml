certified_type:
  category: Indicator
  type_designations:
  - SWIFT RAIL
  - SWIFT PANEL
  - SWIFT COM
  module_designation: Not applicable
  description: >-
    SWIFT family of digital indicators designed to be used as part of a single range, Class III or IIII,
    non-automatic weighing instrument. SWIFT RAIL and SWIFT PANEL are self-indicating and DC-powered;
    SWIFT COM has no integral display or keypad and is DC-powered. Enclosures: plastic (SWIFT PANEL) or
    stainless steel (SWIFT RAIL and SWIFT COM). Devices: initial zero setting device on power up (<= 20%
    Max), semi-automatic zero setting (<= 4% Max), zero tracking (optional, <= 4% Max), semi-automatic
    subtractive tare balancing (T = - Max), net enunciator, preset tare, zero enunciator, indication of
    stable equilibrium. Interfaces: load cell connection, RS232/485, analog output (optional), ProfiBus/ProfiNet
    (optional), EtherNet/IP (optional). The instrument is not designed for direct sales to the public.
    Firmware identification number 'V1.xxxx'; download of software and access to legally relevant parameters
    prevented by a sealing switch (SWIFT RAIL and SWIFT PANEL) or by software sealing with a non-editable
    CAL-COUNTER (all models).
