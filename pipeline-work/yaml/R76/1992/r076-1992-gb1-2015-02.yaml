certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL7200 Series
  - CL7200-U
  module_designation: Not applicable
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Construction: plastic construction,
    operator's keypad, stainless steel load receptor, operator front touch screen display and customer
    rear LCD display, level indicator, integrated printer. Devices: initial zero setting device (≤ 20%
    of Max), semi-automatic zero setting device (≤ 4% of Max), zero tracking device (≤ 4% of Max), automatic
    zero setting device (≤ 4% of Max), zero indicator, net indicator, stable weight indicator, semi-automatic
    subtractive tare balancing device, preset tare, gravity compensation, price-computing, totalisation
    (including non-weighed items), PLU, fixed weight labelling, multi-vendor operation, calibration/set-up
    mode via sealed internal switch, self-service operation, modular display (with fixed legally relevant
    areas). Interfaces: RS232C, cash drawer, Ethernet, wireless LAN, USB. Sealing: access to the load
    cell, electronics, calibration and software download switches is prevented by wire-and-seal or tamper
    evident label. Software download only possible via USB interface, protected by switches on the sealed
    main board.
