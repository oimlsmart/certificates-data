  category: Non-automatic weighing instrument
  type_designations:
  - '7725'
  module_designation: Not applicable
  description: >-
    Charder 7725 Baby weigher — non-automatic weighing instrument. LCD fitted into load receptor: 5 digits
    with zero, net and hold indicators. Tare, Hold, On/Off and Zero buttons. Steel base enclosure and
    plastic load receptor with tray for baby weighing. Initial zero setting, semi-automatic zero setting,
    zero tracking, semi-automatic subtractive tare balancing, hold facility.
