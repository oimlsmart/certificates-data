  module_designation:
  description: >-
    Nonautomatic electromechanical weighing instruments without lever systems. The weighing instruments
    consist of a weighing platform with four strain gauge planar beam load cells and of an indicating
    and operation unit for displaying the weighing results and operate the instruments. The weighing ranges
    with Max, Min, e and number of verification scale intervals may be chosen within the limits of No.
    3.2 of R 76-1 and of the tables 1 and 2.
