certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - JL…-C
  - PL…-S
  module_designation: Not applicable
  description: >-
    Non-automatic electromechanical weighing instrument with or without lever works; compact weighing
    instrument with built-in display, keyboard and data interface. The weighing ranges (Max, verification
    scale intervals, number of verification scale intervals and scale intervals) may be selected within
    the limiting values of table 1. The JL…-C is meant for use as a 'jeweller instrument' and differs
    metrologically from a PL…-S instrument only in that carat is preset as a fixed unit; in all other
    respects the two instruments do not differ metrologically.
