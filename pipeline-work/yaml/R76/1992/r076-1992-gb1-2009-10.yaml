certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AP
  module_designation: Not applicable
  description: >-
    Angel Series, AP Model: Class III, mains-operated, self-indicating, price-computing, single or dual-interval,
    non-automatic weighing instrument. Steel construction; operator's keypad; stainless steel load receptor;
    pole-mounted double-sided VFD display; level indicator. Devices: initial zero setting device, semi-automatic
    zero setting device, zero tracking device, zero indicator, net indicator, semi-automatic subtractive
    tare balancing device, gravity compensation, price-computing, totalisation (including non-weighed
    items), PLU. Interfaces: may have a number of RS232 ports.
