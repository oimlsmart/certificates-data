certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - LI-700
  module_designation:
  description: >-
    Weight/weight-price labeller. Self-indicating and price-computing weighing machine with associated
    thermal label printer. The load cell may be an HBM PW15, capacity 30 kg, or any compatible load cell
    holding an OIML R60 Certificate of Conformity containing the necessary load cell data for the manufacturer's
    declaration of compatibility of modules; a load cell marked NH is allowed only if humidity testing
    to R76 has been conducted on it.
