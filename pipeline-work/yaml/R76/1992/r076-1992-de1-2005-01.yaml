  - M711x2
  module_designation:
  description: >-
    Non-automatic mechanical weighing instrument with lever system. The weighing instrument consists of
    a weighing platform with lever system and a sliding weight device at eye level or at waist level for
    determining and reading the weighing result. Weighing ranges with Max, Min, e, d and number of verification
    scale intervals may be chosen within the limits of No. 3.2 of R 76-1 and of Table 1.
