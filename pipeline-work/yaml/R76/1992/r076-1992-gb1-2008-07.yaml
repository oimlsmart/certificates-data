certified_type:
  category: Indicator
  type_designations:
  - Torrey PI
  - Torrey WI
  module_designation:
  description: >-
    Non-automatic weighing instrument comprising the Torrey PI & WI electronic weight indicators connected
    to a compatible R60 load cell, forming a Class III self-indicating instrument. Construction: LCD display,
    operator keypad, plastic construction, four-wire load cell connection. Devices: subtractive tare,
    gross and net indication, semi-automatic tare, preset tare (PI only), battery indicator, unit indicator,
    AC/DC power supply indicator, motion indicator (PI only), semi-automatic zero-setting, zero-tracking,
    initial zero-setting. Ten dedicated function keys (ON/OFF, ZERO, TARE, PRINT, SEMI AUTO TARE, UNIT,
    CLEAR, numerical keys (PI only), BACKLIGHT, ENTER (PI only)). Protected interfaces: RJ-11 4-wire load
    cell connection, RS232 connection.
