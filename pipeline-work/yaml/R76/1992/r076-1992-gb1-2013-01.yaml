certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - PR PLUS Series
  - PR PLUS-B
  - PR PLUS-P
  description: >-
    Family designated the PR Series, comprising the PR PLUS-B and PR PLUS-P models. Class III, mains or
    battery-operated, self-indicating, price-computing, dual-interval, non-automatic weighing instruments
    designed for direct sales to the public. Plastic construction; operator's keypad; stainless steel
    load receptor; base-mounted operator and customer LED displays (PR PLUS-B); pole-mounted operator
    and customer LED displays (PR PLUS-P); level indicator. Devices: initial zero setting device, semi-automatic
    zero setting device, zero tracking device, zero indicator, net indicator, stable weight indicator,
    low battery indicator, semi-automatic subtractive tare balancing device, gravity compensation, price-computing,
    PLU, calibration/set-up mode via sealed internal switch. Interfaces: none. Seals: calibration and
    setup parameters can only be accessed via the sealed switch located on the main board.
