certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DPS-700
  - CM-700
  module_designation: Digital indicator
  description: >-
    This instrument utilises either the digital indicating device designated the DPS-700 indicator with
    optional labeller, or its compact version designated the CM-700, connected to a weighing platform
    to form a Class III or IIIII, mains-powered, self-indicating non-automatic weighing instrument. Main
    features: processor and converter unit comprising a Teraoka TPB-2930 CPU and a Teraoka TPB-2786 A/D
    converter; touch screen (colour TFT-LCD module); optional labeller type Digi DPS 700 thermal printer;
    metallic supporting frame (DPS-700 only). Devices: initial zero setting, semi-automatic zero setting,
    zero tracking, semi-automatic subtractive tare weighing, determination of stability of equilibrium,
    indication of stability of equilibrium, zero indicator, PLUs, preset tare, price calculation. Load
    cell: any compatible load cell may be used provided it has a valid OIML R60 Certificate of Conformity
    containing the load cell types and data required for the manufacturer's declaration of compatibility
    of modules; compatibility of load cells and indicator is established by the manufacturer by means
    of the compatibility of modules calculation; a load cell marked NH is allowed only if humidity testing
    to R76 has been conducted. Interfaces: load cell 4- or 6-wire connection, Ethernet, USB, keyboard.
    Software: version number 2.xx.xx.xxxx displayed during power-up; the legal metrological code is contained
    in DPS700.dll protected by a checksum; alternatively the instrument may use the World View software
    with HeaderDisplay.dll (Version 1.0.0.10) and DPS710.dll (Version 1.0.0.29); direct sales to the public
    are permitted when using the World View software.
