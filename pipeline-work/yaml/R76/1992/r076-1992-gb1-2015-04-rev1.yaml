certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL5200J Series
  - CL5200J-B
  - CL5200J-P
  module_designation:
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Plastic construction, operator keypad,
    stainless steel load receptor, level indicator, integrated printer, front and rear LCD displays (CL5200J-B)
    or pole-mounted double-sided LCD displays (CL5200J-P). Devices include initial/semi-automatic zero
    setting, zero tracking, zero/net/stable-weight indicators, semi-automatic subtractive tare, preset
    tare, gravity compensation, price-computing, totalisation, PLU, fixed weight labelling, multi-vendor
    operation, self-service operation, and calibration/set-up mode via sealed internal switch. Interfaces:
    RS232C, cash drawer, Ethernet, wireless LAN, USB.
