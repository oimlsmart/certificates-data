certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Dolphin Series
  - EB
  - DB-II
  - DB-1H
  - EBI
  - DBI
  - DB+-II
  - DB-II PLUS
  - DB+-1H
  - DB-1H PLUS
  description: >-
    Class III, mains or battery-operated, self-indicating, dual-interval, non-automatic weighing instruments
    designated Dolphin Series comprising the EB, DB-II and DB-1H models and their variants. Main features:
    steel construction; operator's keypad; stainless steel load receptor; pole-mounted display; level
    indicator. Devices: initial zero setting device (max 20% of Max); semi-automatic zero setting device
    (max 4% of Max); zero tracking device (max 4% of Max); zero indicator; net indicator; semi-automatic
    subtractive tare balancing device; gravity compensation; counting/check weighing/weighing unstable
    samples modes (DB-II model); price-computing (EB model).
