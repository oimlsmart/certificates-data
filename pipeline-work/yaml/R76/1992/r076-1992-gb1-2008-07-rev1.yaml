certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Torrey PI
  - Torrey WI
  - Torrey WI-W
  description: >-
    Non-automatic weighing instrument comprising the Torrey PI, WI and WI-W electronic weight indicators
    connected to a platform incorporating compatible OIML R60 load cell(s), forming a Class III self-indicating
    instrument. The WI-W version uses the same components as the WI, fitted with gaskets to make the indicator
    waterproof. Indicators have LCD display, operator keypad, plastic construction and four-wire load
    cell connection. Devices: subtractive tare, gross/net indication, semi-automatic tare, pre-set tare
    (PI only), battery indicator, unit indicator, AC/DC power supply indicator, motion indicator (PI only),
    semi-automatic zero-setting, zero-tracking, initial zero-setting. Protected interfaces: RJ-11 4-wire
    load cell connection, RS232 connection. Any compatible load cell with a valid OIML R60 Certificate
    of Conformity may be used, subject to the manufacturer's compatibility of modules calculation; load
    cells marked NH are allowed only if humidity testing to R76 has been conducted.
