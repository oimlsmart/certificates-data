certified_type:
  category: Non-Automatic Weighing Instrument
  type_designations:
  - MP62xx
  - MP65xx
  module_designation: Not applicable
  description: >-
    Zebra Technologies MP62xx & MP65xx (where xx denotes alternative approved models) scanner/scale, Class
    III, mains operated, self-indicating, weight only. Designed for flush-mounting in a checkout surface
    with frame extensions to support the instrument in the checkout counter; intended to be installed
    in a fixed position, so no levelling device or level indicator is provided. Stainless steel load receptor;
    pole-mounted display. Equipped with an audit trail consisting of two event counters (calibration counter
    'C' and configuration counter 'P') shown on an integrated seven-segment display and on the Zebra Technologies
    remote display when installed.
