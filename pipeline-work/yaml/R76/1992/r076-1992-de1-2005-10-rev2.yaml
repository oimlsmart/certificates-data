certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - M704x2
  - M764x2
  - COS01A
  - COS01B
  - COS01C
  description: >-
    Non-automatic electromechanical weighing instrument for persons. The weighing instrument consists
    of a weighing platform with one strain gauge shear-beam load cell, an indicator for displaying the
    weighing result and a membrane keyboard to operate the instrument. The weighing ranges with Max, Min,
    e, d and number of verification scale intervals may be chosen within the limits of No. 3.2 of R 76-1
    and of Table 1.
