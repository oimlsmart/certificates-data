certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - LI-700
  module_designation:
  description: >-
    Non-automatic weighing instrument designated LI-700, operating as a weight or weight/price labeller.
    Comprises a self-indicating and price-computing weighing machine with associated thermal label printer.
    Devices: initial zero-setting device, semi-automatic zero-setting device, zero-tracking device, preset
    tare device, semi-automatic tare device (subtractive), zero indication, price computation; calibration
    not accessible to user. Interfaces: USB, Serial (RS232), Ethernet. Legally relevant software version
    2.xx.xx.xxxx (metrological code in DPS700.dll, checksum-protected); alternatively the World View software
    (HeaderDisplay.dll Version 1.0.0.10, DPS710.dll Version 1.0.0.29), which permits use for direct sales
    to the public.
