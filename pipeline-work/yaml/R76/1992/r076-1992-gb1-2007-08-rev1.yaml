  - IM 100
  - IM 202
  - IM 300
  - IM 400
  module_designation:
  description: >-
    Mains-powered, Class III, price-computing, stand-alone non-automatic weighing instruments intended
    for use in the presence of a customer. Equipment: vendor's keyboard (except IM 300), vendor's backlit
    LCD display (except IM 300), customer's backlit LCD display, stainless steel load receptor, level
    indicator, integrated printer, two-piece plastic housing that contains the load cell, tower-mounted
    double-sided backlit LCD display unit (IM 202 and IM 400).
