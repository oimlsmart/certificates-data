certified_type:
  category: Weighing instrument
  type_designations:
  - CT100 Series
  - CT100-B
  - CT100-P
  - CT100-R
  module_designation: Not applicable
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Construction: plastic housing, operator
    keypad, stainless steel load receptor, operator LCD display, pole-mounted customer LCD display, level
    indicator, integrated printer. Devices: initial zero setting device, semi-automatic zero setting device,
    zero tracking device (around Gross or Net zero), zero indicator, net indicator, stable weight indicator,
    semi-automatic subtractive tare weighing device, gravity compensation, price-computing, totalisation
    (including non-weighed items), PLU, fixed weight labelling, multi-vendor operation, calibration/set-up
    mode via sealed internal switch. Interfaces (some optional): RS232C, cash drawer, USB Device, USB
    Host, RS485, ZigBee, wired LAN, wireless LAN. The instrument may alternatively be fitted with a Preset
    Tare device, in which case the semi-automatic tare device is a balancing tare device with Tare and
    Preset Tare values limited to Max.
