certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Magellan 8502
  - Magellan 8504
  description: >-
    Class III, mains-powered, self-indicating non-automatic weighing instruments fitted with a barcode
    scanner. The diecast base unit supports the load cell, barcode scanner assembly, main board and analogue
    boards; the scale sub-assembly is mounted on the load cell and the steel L-shaped load receptor is
    mounted on the four supporting points on the scale sub-assembly. Protected interfaces: POS terminal
    (RJ10), remote display (RJ4), auxiliary port (RJ10), scale host (RJ10), EAS port (RJ4), power (Molex
    6). Optional one-piece Sensormatic EAS coil assembly. Additional LCD customer/operator display model
    8300RD with single or dual display configuration.
