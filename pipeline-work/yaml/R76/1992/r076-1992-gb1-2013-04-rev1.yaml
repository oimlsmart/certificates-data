certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MP62xx
  - MP65xx
  module_designation: Not applicable
  description: >-
    Scanner/scale, Class III, mains operated, self-indicating, weight only, non-automatic weighing instrument.
    Designed for flush-mounting in checkout surface with frame extensions to support the instrument in
    the checkout counter; intended to be installed in a fixed position, so no levelling device or level
    indicator is provided. Stainless steel load receptor, pole-mounted display. Devices: initial zero
    setting device, semi-automatic zero setting device, zero tracking device, automatic zero setting device,
    zero indicator, gravity compensation. Interfaces: DC voltage input, RS-232, IMB-485, control inputs/outputs,
    USB. Audit trail via two event counters ('C' calibration counter and 'P' configuration parameter counter)
    shown on an integrated seven segment display and simultaneously on the Motorola Solutions remote display
    when installed.
