certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XM Series
  - XM 100
  - XM 200
  - XM 400
  - XM 410
  - XM 420
  - XM 500
  - XM 601
  - XM 603
  description: >-
    Mains-powered, Class III, price-computing, stand-alone non-automatic weighing instruments intended
    for direct sales to the public. Die-cast chassis and plastic housing containing the load cell and
    electronics; stainless steel load receptor. Devices: initial zero-setting, semi-automatic zero-setting,
    automatic zero-setting, zero-tracking, zero indicator, net indicator, semi-automatic subtractive tare
    balancing/weighing, preset tare, price computing, automatic tilt sensor/compensation device, price-labelling
    configuration (printing below Min not allowed). Interfaces: Ethernet (wired or R.F. connectivity),
    USB.
