certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - ABW120
  - AWB120
  module_designation: Not applicable
  description: >-
    Class III, mains or battery-operated, self-indicating, single-interval, non-automatic weighing instrument,
    designated the AWB120. Not designed for direct sales to the public. Main features: pole-mounted LCD
    display with function keys and LED indicators (low battery, checkweighing); indicator plastic enclosure;
    aluminium die-casting load receptor (420 x 520 mm) with stainless steel pan; level indicator (at the
    base of the pole) and adjustable feet. Devices: initial zero setting device, semi-automatic zero setting
    device, zero tracking device, zero indicator, net indicator, determination of stable equilibrium,
    stable equilibrium indicator, semi-automatic subtractive tare balancing device, checking of display,
    weight accumulation, printing, checkweighing, coarse filter mode to allow weighing of unstable samples.
    Interface: RS232. Sealing: weighing platform bears the serial number of the rating plate located on
    the indicator, secured by sealing or destructible form; calibration mode is password-protected with
    non-editable counters CALxxx and OPTxxx displayed at power-up and written on a tamper-evident label.
