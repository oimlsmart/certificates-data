certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Flinttec M300
  module_designation: Not applicable
  description: >-
    The Flinttec M300 Infant Scale is a Class III, mains or battery-powered, self-indicating non-automatic
    weighing instrument designed to record the weight of a baby. Construction: LCD display fitted into
    load receptor (5 digits, with Zero, Net and Hold indicators); three buttons (Tare, Hold, On/Off/Zero);
    aluminium base enclosure containing the load cell and electronics; plastic load receptor with tray
    for baby weighing; level indicator next to the display; four adjustable feet for levelling. Devices:
    initial zero setting device (<= 20% of Max), semi-automatic zero setting device (<= 4% of Max), zero-tracking
    device, zero indicator, semi-automatic subtractive tare balancing device, Net indicator, Hold facility,
    Hold indicator. Interface: DC voltage input. Sealing: destructible label over one of the screws in
    the base plate and over the access hole of the calibration service button. Software version V1.00
    is displayed when the Hold button is pressed for more than 8 seconds. Low battery indication 'lo bAt'
    appears when battery voltage falls below 2.1 V DC or mains adaptor voltage falls below 4.4 V DC.
