certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - BBK4
  - VIPER
  description: >-
    Non-automatic weighing instruments for accuracy class II or class III multi-interval; types BBK4 and
    VIPER
characteristics:
  config_level:
  - attribute: max_number_of_verification_scale_intervals_n
    axis: accuracy_class
    values:
    - condition: II
      value:
        min:
        max: 61000
      unit_symbol: divisions
    - condition: III multi-interval (per weighing range)
      value:
        min:
        max: 10000
      unit_symbol: divisions
  - attribute: maximum_capacity
    axis: accuracy_class
    values:
    - condition: II
      value:
        min: 0.61
        max: 35.1
      unit_symbol: kg
    - condition: III multi-interval
      value:
        min: 1.5
        max: 60
      unit_symbol: kg
  - attribute: maximum_capacity_additional_load_receptor
    axis: accuracy_class
    values:
    - condition: III multi-interval
      value:
        min: 1.5
        max: 6000
      unit_symbol: kg
  - attribute: verification_scale_interval_e
    axis: accuracy_class
    values:
    - condition: II
      value:
        min: 10
        max:
      unit_symbol: mg
    - condition: III multi-interval
      value:
        min: 1
        max:
      unit_symbol: g
  - attribute: scale_interval_relation
    axis: accuracy_class
    values:
    - condition: II
      value: e = d or e = 10d
    - condition: III multi-interval
      value: e = d
  - attribute: temperature_range
    axis: accuracy_class
    values:
    - condition: II
      value:
        min: 10
        max: 30
      unit_symbol: "°C"
    - condition: III multi-interval
      value:
        min: 5
        max: 35
      unit_symbol: "°C"
