certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XM Series
  - XM 100
  - XM 200
  - XM 400
  - XM 500
  - XM 601
  - XM 603
  module_designation:
  description: >-
    Avery Berkel XM 100, XM 200, XM 400, XM 500, XM 601 and XM 603 non-automatic weighing instruments:
    mains-powered, Class III, price-computing, stand-alone instruments intended for direct sales to the
    public. Maximum capacities are between 6 kg and 30 kg (except XM 500: Max 15 kg, e = 5 g only). Die-cast
    chassis and plastic housing containing the load cell and electronics; stainless steel load receptor;
    vendor's TFT WVGA colour touch-screen display/keyboard with separate 17-key tactile keypad; customer's
    TFT WVGA colour display; cassette printer using thermal print head.
