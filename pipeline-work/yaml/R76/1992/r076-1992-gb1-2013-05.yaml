certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - FW500 Series
  module_designation: Not applicable
  description: >-
    The FW500 Series comprises the FW500-C and FW500-E models, which are dual-interval, Class III, non-automatic
    weighing instruments. Self-indicating, mains or battery-powered, may be used for direct sales to the
    public. Construction: plastic construction; front LCD (FW500-C) or LED (FW500-E) displays with keypads;
    optional rear LCD (FW500-C) or LED (FW500-E) displays; stainless steel load receptor; level indicator.
    Devices: initial zero setting device (<= 20% of Max); semi-automatic zero setting device (<= 4% of
    Max); zero tracking device (<= 4% of Max); zero indicator; net indicator; stable weight indicator;
    semi-automatic subtractive tare balancing device; low battery indicator; hold function; gravity compensation;
    calibration/set-up mode via sealed internal switch. Interfaces: none. Calibration and setup parameters
    can only be accessed via the sealed switch located on the main board. Note: Emax in the technical
    data table refers to the actual measuring range and does not include the dead load for the instrument.
