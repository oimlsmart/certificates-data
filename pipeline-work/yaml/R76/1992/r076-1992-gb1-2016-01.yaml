certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL5200-xN Series
  - CL5200-BN
  - CL5200-PN
  module_designation:
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Plastic construction, operator's keypad,
    stainless steel load receptor, front and rear LCD display, pole-mounted double-sided display, level
    indicator, integrated printer. Calibration/set-up mode via sealed internal switch; access to load
    cell, electronics, calibration and software download switches prevented by wire-and-seal or tamper
    evident label.
