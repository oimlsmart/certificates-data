certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - PR PLUS Series
  - PR PLUS-B
  - PR PLUS-P
  description: >-
    Family of instruments designated the PR Series, comprising the PR PLUS-B and PR PLUS-P models: Class
    III, mains or battery-operated, self-indicating, price-computing, dual-interval, non-automatic weighing
    instruments. May be used for direct sales to the public. Plastic construction, operator's keypad,
    stainless steel load receptor, level indicator. Devices: initial zero setting device, semi-automatic
    zero setting device, zero tracking device, zero indicator, net indicator, stable weight indicator,
    low battery indicator, semi-automatic subtractive tare balancing device, gravity compensation, price-computing,
    PLU, calibration/set-up mode via sealed internal switch. Software identification V4xx; access to legally
    relevant parameters and download of software prevented by sealing the enclosure. Access to the electronics,
    load cell and calibration switch prevented by sealing the enclosure using a tamper-evident method.
