certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL7200 Series
  - CL7200-U
  - CL7200-S
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Construction: plastic housing, operator's
    keypad, stainless steel load receptor, operator front touch screen display, customer rear LCD display,
    level indicator, integrated printer. Devices: initial zero setting device (up to 20% of Max), semi-automatic
    zero setting device (up to 4% of Max), zero tracking device (up to 4% of Max), automatic zero setting
    device (up to 4% of Max), zero indicator, net indicator, stable weight indicator, semi-automatic subtractive
    tare balancing device, preset tare, gravity compensation, price computing, totalisation (including
    non-weighed items), PLU, fixed weight labelling, multi-vendor operation, calibration/set-up mode via
    sealed internal switch, self-service operation, modular display (with fixed legally relevant areas),
    self-service operation (CL7200-S). Interfaces: RS232C, cash drawer, Ethernet, wireless LAN, USB. Software
    designated V3.xx.x, displayed at power up; software download only possible via the USB interface and
    protected by switches on the sealed main board. Sealing: access to the load cell, electronics, calibration
    and software download switches prevented by wire seal or tamper-evident label.
