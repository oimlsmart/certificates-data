certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - M375x1
  - M376x1
  - M376x2
  description: >-
    Non-automatic electromechanical baby weighing instrument. Types: M375x1 (multi-interval instrument),
    M376x1 and M376x2 (multiple range instruments). The weighing instrument consists of a weighing platform
    with four strain gauge planar beam load cells, an indication for displaying the weighing result and
    membrane switches to operate the instrument. e = d for all weighing ranges.
