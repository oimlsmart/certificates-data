certified_type:
  category: Indicator
  type_designations:
  - DP-2400V5
  - DP-2701
  - DP-3100
  - DP-3300
  description: >-
    Charder DP-2400V5, DP-2701, DP-3100, DP-3300 indicating devices, accuracy class III. The Professional
    version of the DP-2400V5 features initial zero-setting on power up, semi-automatic zero-setting, zero-tracking,
    semi-automatic tare balancing, preset tare, eleven dedicated keys, ten numeric keys and an LCD with
    annunciators. The Normal and Simple versions have reduced functionality with fewer keys. The DP-2701,
    DP-3100 and DP-3300 versions have the same technical characteristics but different housings.
