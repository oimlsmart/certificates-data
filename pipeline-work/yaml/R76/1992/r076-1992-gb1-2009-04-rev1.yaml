certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - GSE 60-Series
  - 675 Bench Scale
  module_designation:
  description: >-
    Non-automatic weighing instruments comprising the GSE 60-Series electronic weight indicators connected
    to a compatible R60 load cell and the 675 Bench Scale. The family utilises digital indicating devices
    (GSE 60-Series) connected to a weighing platform to form single or multi-range, Class III or IIII,
    self-indicating, non-automatic weighing instruments. The GSE 60-Series controller housing is fabricated
    from stainless steel plate and comprises the 460, 465, 560, 562, 660, 661, 662, 663 and 665 models;
    universal, wall, panel or desk-top mount configuration; VFD or LCD display and keypad. Devices: semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare weighing/balancing, preset tare, indication
    of stability of equilibrium, zero indicator, price calculation, price labelling, totalisation, printing
    key, multi-range option (max 3 weighing ranges), multi-scale option (additional internal A/D module
    card, max 7 additional modules), compound scale functionality, Data Storage Device (max 999999 data
    sets), counting mode. The GSE 675 Bench Scale comprises the same electronics and software as the GSE
    60-Series with an integrated load cell platform and a different enclosure.
