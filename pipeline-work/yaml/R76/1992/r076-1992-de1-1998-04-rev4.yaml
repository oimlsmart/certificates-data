certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - BD BH 110
  - DS BH 310
  - DT BH 210
  - DT BH 310
  module_designation:
  description: >-
    Nonautomatic electromechanical weighing instrument consisting of a weighing platform with one load
    cell of electromagnetic force compensation (class I) or one strain-gauge load cell (class II and III),
    an incorporated indicating device for displaying the weighing results, and a keypad to operate the
    instrument. The weighing ranges with Max, Min, e, d and number of verification scale intervals may
    be chosen within the limits of No. 3.2 of R 76-1 and of Table 1.
