- revision: '3'
  date: '2005-09-27'
  changes: >-
    New variants of type BC BL 100 and BD BL 100 with new weighing ranges were added. Conformity established
    by tests described in report No. 1.14-01059339 (Revision 3) and the associated test reports No. 1.14-01059339/1
    (Sample 3, BC BL 100) and No. 1.14-01059339/5 (Sample 2, BD BL 100). The test results of the former
    test reports No. 1.14-01059339/1 through /7 remain valid.
