  category: Non-automatic weighing instrument
  type_designations:
  - NCR 7878-2000
  - NCR 7874-5000
  - NCR 7878-2XXX
  - NCR 7874-5XXX
  module_designation:
  description: >-
    Mains powered, Class III, scanner/scale, non-automatic weighing instrument designed for flush-mounting
    in checkout surface. Steel framework supporting a barcode scanner, electronics, and a Flintec PBNS-30
    scale module containing four loadcells. Interface for POS connection. NCR 7874-5000 has a smaller
    load receptor than the 7878-2000, can be mounted into an optional stainless steel mounting bracket
    and has a 2.5 cm longer extended weigh plate; the optional stainless steel weigh plate of the 7874-5XXX
    series comprises two separate sheets covering the weighing platform. The X's in the model numbers
    7878-2XXX and 7874-5XXX represent numeric variables not affecting the metrological characteristics
    of the instrument.
