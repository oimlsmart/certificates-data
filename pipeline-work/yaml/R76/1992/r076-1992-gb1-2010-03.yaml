  alternatives: OR
  characteristics:
    alternative: >-
      Any compatible load cell may be used provided: a respective OIML R60 Certificate of Conformity is
      issued for the load cell; the certificate contains the load cell types and the necessary load cell
      data required for the manufacturer's declaration of compatibility of modules and any particular
      installation requirements; a load cell marked NH is allowed only if humidity testing to R76 has
      been conducted on this load cell; compatibility of load cells and indicator is established by the
      manufacturer by means of the compatibility of modules calculation
