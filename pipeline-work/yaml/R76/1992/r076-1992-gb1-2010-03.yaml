certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CASTON Series
  - CASTON II
  - CASTON III
  module_designation: Not applicable
  description: >-
    Class III, battery powered, self-indicating, single-interval, non-automatic weighing instrument (crane
    scale), designated the CASTON Series. The Series comprises the CASTON II and CASTON III models. Steel
    construction, operator's keypad, "One-Module" weighing module, LCD or LED display, upper lift eye
    bolt and lower hook. Devices: initial zero setting device on power up, semi-automatic zero setting,
    zero tracking, semi-automatic subtractive tare balancing, zero-indicator, indication of stable equilibrium,
    net indicator, hold function, gravity compensation.
