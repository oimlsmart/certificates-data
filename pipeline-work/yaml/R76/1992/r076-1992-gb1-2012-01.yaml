certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CT100 Series
  - CT100-B
  - CT100-P
  - CT100-R
  module_designation: Not applicable
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed to be used for direct sales to the public. Plastic construction; operator's
    keypad; stainless steel load receptor; operator LCD display; pole-mounted customer LCD display; level
    indicator; integrated printer (base-mounted on CT100-B and CT100-P models, pole-mounted on CT100-R
    model). Devices: initial zero setting device, semi-automatic zero setting device, zero tracking device,
    zero indicator, net indicator, stable weight indicator, semi-automatic subtractive tare weighing device,
    gravity compensation, price-computing, totalisation (including non-weighed items), PLU, fixed weight
    labelling, multi-vendor operation, calibration/set-up mode via sealed internal switch.
