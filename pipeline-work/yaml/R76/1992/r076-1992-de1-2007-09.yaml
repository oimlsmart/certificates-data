certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - E200
  module_designation:
  description: >-
    Non-automatic electromechanical weighing instrument with or without lever system. Designed as platform-,
    hopper-, wall-mounted-, crane- or overhead track scale, with or without lever system. The weighing
    instrument is equipped with a lever system or directly introduces the force into one or more load
    cells. The weighing ranges comprising Max, verification scale intervals, number of verification scale
    intervals and scale intervals may be selected considering the limiting values in table 1.
