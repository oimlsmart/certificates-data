certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AV…-C
  - AS…-C
  module_designation:
  description: >-
    Non-automatic electromechanical weighing instrument with or without lever works. Compact weighing
    instrument with built-in display, keyboard and data-interface. The weighing ranges comprising Max,
    verification scale intervals, number of verification scale intervals and scale intervals may be selected
    considering the limiting values in Table 1; this also applies for weighing results indicated in carat.
    Option of not having an incorporated span adjustment device (added in Revision 1).
