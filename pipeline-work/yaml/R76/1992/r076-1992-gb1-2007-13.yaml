certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DPS-700
  - CM-700
  module_designation:
  description: >-
    Non-automatic weighing instrument formed by connecting the DPS-700 or CM-700 indicator to a weighing
    platform. Class III or IIII, mains-powered, self-indicating. Devices: initial zero setting, semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare weighing, determination of stability
    of equilibrium, indication of stability of equilibrium, zero indicator, PLUs, preset tare, price calculation.
    Load cell: any compatible load cell meeting the conditions specified in 2.2 of Certificate UK/2834.
