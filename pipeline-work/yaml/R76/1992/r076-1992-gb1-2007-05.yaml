certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MS-4100
  - MS-4200
  description: >-
    MS-4100 and MS-4200 person weigher non-automatic weighing instruments. LCD fitted into load receptor:
    5 digits with zero, net and hold indicators. Tare, Hold, and two On/Zero/Off buttons (display orientation
    depends on which button is pressed). Aluminium base enclosure, and plastic load receptor with optional
    tray for baby weighing. Initial zero setting, semi-automatic zero setting, zero tracking, semi-automatic
    subtractive tare balancing, hold facility. Tede 1022 or Tede LPS load cell. The MS-4100 and MS-4200
    are identical except for slightly different top covers.
