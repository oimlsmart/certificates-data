certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - 9760.xx
  module_designation: Not applicable
  description: >-
    Non-automatic electromechanical vehicle mounted weighing instrument. Design as vehicle mounted weighing
    instrument without lever system; the force is introduced into four load cells. Also available as multi-interval
    or multiple range weighing instrument. The weighing ranges with Max, Min, verification scale interval
    and number of verification scale intervals may be selected taking into account the limiting values
    in Table 1 and No. 3.2 of the associated Report in accordance with Nos. 2 and 3 of R76-1. Due to the
    modular construction, the fractions of the error limit p_i of the individual modules must comply with:
    1 >= p_i1^2 + p_i2^2 + ... + p_in^2 (No. 3.5.4 of R76-1).
