- role: load_cell
  type_designations:
  - CAS SW
  alternatives: OR
  characteristics:
    manufacturer: CAS
    capacities: as in technical data
    alternative_requirement: >-
      Any compatible load cell(s) may be used provided a respective OIML R60 Certificate of Conformity
      exists containing the load cell types and the necessary load cell data required for the manufacturer's
      declaration of compatibility of modules and any particular installation requirements; a load cell
      marked NH is allowed only if humidity testing to R76 has been conducted on that load cell; compatibility
      of load cells and indicator established via the compatibility of modules calculation at the time
      of verification; load cell transmission must conform to a standard type.
