certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - FW500 Series
  - FW500-C
  - FW500-E
  - FW500-C6
  - FW500-E6
  - FW500-C15
  - FW500-E15
  - FW500-C30
  - FW500-E30
  module_designation:
  description: >-
    The FW500 Series comprises the FW500-C and FW500-E models, which are dual-interval, Class III, non-automatic
    weighing instruments. Self-indicating, mains or battery powered, and may be used for direct sales
    to the public. Plastic construction; front LCD (FW500-C) or LED (FW500-E) display with keypad; optional
    rear LCD (FW500-C) or LED (FW500-E) display; stainless steel load receptor; level indicator. Devices:
    initial zero setting device, semi-automatic zero setting device, zero tracking device, zero indicator,
    net indicator, stable weight indicator, semi-automatic subtractive tare balancing device, low battery
    indicator, hold function, gravity compensation, calibration/set-up mode via sealed internal switch.
    Interfaces: none. Software held in firmware with identification number V1.xx; access to legally relevant
    parameters prevented by a jumper on the main board; sealing by tamper-evident method.
