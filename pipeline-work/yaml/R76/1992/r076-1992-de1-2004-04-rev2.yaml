certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XP...
  - XS...
  module_designation:
  description: >-
    Non-automatic electromechanical weighing instrument with or without lever works, comprising the modules
    load receptor and indicating and operating device, which are built in separate housings. The indicating
    and operating device is connected via a short cable, so it is placed directly next to the load receptor.
    The weighing ranges comprising Max, verification scale intervals, number of verification scale intervals
    and scale intervals may be selected considering the limiting values in table 1; this also applies
    for weighing results indicated in carat.
