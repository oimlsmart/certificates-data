certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XT Series
  - XT 100
  - XT 101
  - XT 200
  - XT 300
  - XT 400
  module_designation: Not applicable
  description: >-
    The Avery Berkel XT Series non-automatic weighing instruments are mains-powered, Class III, price-computing,
    stand-alone instruments intended for direct sales to the public. Maximum capacities are between 6
    kg and 30 kg. Features include a vendor's TFT WVGA colour touch-screen display/keyboard with up to
    20 programmable keys (XT 100, XT 101, XT 200), customer displays (fixed or tower mounted depending
    on model), a cassette printer using a thermal print head, die-cast chassis and plastic housing containing
    the load cell and electronics, stainless steel load receptor, and level indicator.
