certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XM 100
  - XM 200
  - XM 400
  - XM 500
  description: >-
    XM Series non-automatic weighing instruments: mains-powered, Class III, price-computing, stand-alone
    instruments intended for direct sales to the public. Maximum capacities are between 6 kg and 30 kg
    (except XM 500: Max 15 kg, e = 5 g only). Vendor's TFT, WVGA colour touch-screen display/keyboard
    with up to 20 programmable keys and separate 17-key tactile keypad; customer's TFT, WVGA colour display;
    cassette printer using thermal print head; die-cast chassis and plastic housing containing the load
    cell and electronics; stainless steel load receptor.
