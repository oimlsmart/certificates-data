certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - BC II...
  description: >-
    Non-automatic price-computing weighing instrument for direct sales to the public. The weighing instrument
    consists of a weighing module, comprising the load receptor with or without a lever system, the strain
    gauge load cell and the electronics with an AD-converter for signal processing, of an incorporated
    indicating device for displaying the weighing results, and of a keypad to operate the instrument.
    The weighing ranges with Max, Min, e, d and number of verification scale intervals may be chosen within
    the limits of No. 3.2 of R 76-1 and of Table 1. Max ≤ 30 kg with built-in load receptor.
