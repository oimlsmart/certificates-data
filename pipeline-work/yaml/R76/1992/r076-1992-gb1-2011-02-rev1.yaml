certified_type:
  category: Indicator
  type_designations:
  - PDI
  - PDI-S
  description: >-
    Digital indicating device (PDI) connected to a weighing platform to form a single or dual-interval
    Class III self-indicating weighing instrument; mains powered and may be used for direct sales to the
    public. Construction: plastic enclosure, pole-mounted LCD display, 4 keys (Zero, Tare, function, on/off),
    enunciators (Zero, Stability of equilibrium, Net, Communication). The PDI-S variant has the indicator
    fitted within a pole-mounted stainless steel enclosure.
