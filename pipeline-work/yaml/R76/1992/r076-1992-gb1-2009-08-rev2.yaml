certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AWB120
  - S133
  description: >-
    Class III, mains or battery-operated, self-indicating, single-interval, non-automatic weighing instrument
    designated the AWB120. Pole-mounted LCD display with function keys and LED indicators (low battery,
    checkweighing); indicator plastic enclosure; aluminium die-casting load receptor (420 x 520 mm) with
    stainless steel pan; level indicator at the base of the pole and adjustable feet. Devices: initial
    zero setting device, semi-automatic zero setting device, zero tracking device, zero indicator, net
    indicator, determination of stable equilibrium, stable equilibrium indicator, semi-automatic subtractive
    tare balancing device, checking of display, weight accumulation, printing, checkweighing, coarse filter
    mode to allow weighing of unstable samples. Alternative designation: instrument re-badged with the
    Salter Brecknell name and designated the S133.
