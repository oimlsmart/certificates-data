certified_type:
  category: Weighing instrument
  type_designations:
  - M985x2
  module_designation: Not applicable
  description: >-
    Non-automatic electromechanical weighing instrument for persons without lever system; multi-interval
    instrument. The weighing instrument consists of four load receptors each equipped with a shear-beam
    strain gauge load cell, and one or two indication and operation units for displaying the weighing
    result and a membrane keyboard to operate the instrument.
