certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - GLP-W...
  description: >-
    Nonautomatic, electromechanical, pricecomputing weighing instrument. The weighing instrument consists
    of an indicator, comprising a microprocessor-system for further signal processing and control of the
    balance operation with thermal printer, LC-display, indicating weight with price, tare values and
    additional information, and of a weighing module, comprising the load receptor and the strain gauge
    load cell. The A/D converter for signal processing may be incorporated either in the indicator or
    in the weighing module. The weighing ranges with Max, Min, e, d and number of verification scale intervals
    may be chosen within the limits of No. 3.2 of R 76-1 and of table 1.
