certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - 301x
  module_designation: Not applicable
  description: >-
    Non-automatic electromechanical weighing instrument with or without lever system. Design as flight
    baggage, vehicle, platform or container scale, wall-mounted or overhead track scale, with or without
    lever system, also as multi-interval or multiple range weighing instrument; introduces the force into
    one or more load cells. The weighing ranges with Max, Min, verification scale interval and number
    of verification scale intervals may be selected within the limiting values of Table 1, Nos. 3.2 and
    3.3 of the associated Report, in accordance with Nos. 2 and 3 of R76-1. Due to the modular construction,
    the fractions p_i of the maximum permissible error of the individual modules must comply with: 1 ≥
    p_i1² + p_i2² + ... + p_in² (No. 3.5.4 of R76-1).
