certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - F805
  module_designation: Not applicable
  description: >-
    Non-automatic platform-, hopper-, wall-mounted- or overhead track scale, with or without lever system.
    Non-automatic electromechanical weighing instrument whose design is composed of the weighing indicator
    with a color-touch screen, a load receptor equipped with different load cells, mechanical constructions,
    maximum capacities, verification scale intervals, etc., in accuracy classes III and IIII. The weighing
    ranges with Max, Min, e and number of verification scale intervals may be chosen within the limits
    of No. 3.2 of R 76-1 and of Table 1.
