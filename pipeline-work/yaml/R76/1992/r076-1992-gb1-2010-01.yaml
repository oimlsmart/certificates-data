certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - XM 100
  - XM 200
  - XM 400
  description: >-
    The Avery Berkel XM 100, XM 200 and XM 400 non-automatic weighing instruments are mains-powered, Class
    III, price-computing, stand-alone instruments intended for direct sales to the public. Maximum capacities
    are between 6 kg and 30 kg. The XM 100 comprises a customer and operator display; the XM 200 comprises
    a tower mounted customer display; the XM 400 comprises a tower mounted operator keyboard and double-sided
    display. Vendor's TFT, WVGA colour touch-screen display/keyboard and separate 17-key tactile keypad
    with fixed function and numeric keys; customer's TFT, WVGA colour display; die-cast chassis and plastic
    housing; stainless steel load receptor. Devices: initial zero-setting; semi-automatic zero-setting;
    automatic zero-setting; zero-tracking; zero indicator; net indicator; semi-automatic subtractive tare
    balancing/weighing; preset tare; price computing; automatic tilt sensor/compensation device (weight
    indication prevented for tilt greater than 5 degrees in longitudinal and transverse directions); price-labelling
    configuration, in which case printing below Min is not allowed. Interfaces: Ethernet (wired or RF
    connectivity); USB.
