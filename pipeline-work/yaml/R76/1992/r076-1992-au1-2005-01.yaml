certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AC-4000D
  module_designation:
  description: >-
    Ishida model AC-4000D self-indicating, price-computing, multi-interval electronic non-automatic weighing
    instrument. Intended for pre-packaging use and not intended for trading direct with the public (notice
    provided). Fitted with an integral label printer. Capabilities for tare and preset-tare (including
    pre-set tare values associated with product look-up tables), initial and semi-automatic zero setting
    devices and a zero-tracking device. Composed of three separate modules: basework/platform, printer
    unit (contains the main board of the instrument, including the A/D board) and display/keyboard. RS-232
    and Ethernet interfacing capabilities available; only the Ethernet option was installed on the sample
    instrument. Powered by mains supply. Load receptor nominal dimensions 400 mm x 254 mm; the sample
    was provided with a level bubble beneath the platter, with a window in the platter required so the
    bubble could be seen without removing the load receptor.
