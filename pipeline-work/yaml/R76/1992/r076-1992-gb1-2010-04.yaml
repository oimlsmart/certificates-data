certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SW Series
  - ED
  - ER PLUS
  - ER PLUS-M
  - SW-1
  - SW-1S
  - SW-1C
  - SW-1W
  - SW-1LR
  - SW-1WR
  - ER JR
  - PW-II
  description: >-
    Class III, mains or battery-operated, self-indicating, dual-interval, non-automatic weighing instruments
    designated SW Series and comprising the ED, ER PLUS, ER PLUS-M, SW-1, ER JR and PW-II models and their
    variants. Main features: steel construction, operator's keypad, stainless steel load receptor, level
    indicator, operator and customer display. Check weighing and weighing unstable samples modes available
    on SW-1S, SW-1C, SW-1W, SW-1LR, SW-1WR, ER JR, PW-II and ED models only.
