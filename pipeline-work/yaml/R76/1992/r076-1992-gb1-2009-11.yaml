certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - 758 CSV
  module_designation:
  description: >-
    Non-automatic weighing instrument utilising the digital indicating device designated the 758 CSV series
    indicator connected to a weighing platform; Class III, mains or battery-operated, self-indicating.
    Stainless steel enclosure (may be painted); 5 digit, 13 mm high, 7 segment LCD weight indicator display;
    3 digit, 13 mm high, 7 segment LCD body mass index display; 4 digit, 9 mm high, 7 segment LCD height
    entry display; keyboard with 10 numeric keys and 9 function keys.
