certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - PDI
  module_designation: Digital indicating device
  description: >-
    Instrument designated the PDI, utilising the PDI digital indicating device connected to a weighing
    platform to form a single or dual-interval, Class III, weighing instrument. Self-indicating and mains-powered;
    may be used for direct sales to the public. Construction: plastic enclosure; pole-mounted LCD display;
    4 keys (Zero, Tare, function, on/off); enunciators (Zero, Stability of equilibrium, Net, Communication).
    Devices: initial zero setting device on power up; semi-automatic zero setting; zero tracking (optional);
    semi-automatic subtractive tare balancing; zero-indicator; indication of stable equilibrium; net indicator;
    gravity compensation; printing. Calibration and setup parameters accessible only via the sealed switch
    located on the main board.
