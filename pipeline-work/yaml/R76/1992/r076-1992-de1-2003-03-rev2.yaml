  category: Non-automatic weighing instrument
  type_designations:
  - PL...-S
  - JL-C
  - JL-G
  module_designation: Not applicable
  description: >-
    Non-automatic electromechanical weighing instrument with or without lever works; compact weighing
    instrument with built-in display, keyboard and data interface. The weighing ranges with Max, Min,
    e and number of verification scale intervals may be chosen within the limits of No. 3.2 of R 76-1
    and of Table 1. JL-C is meant for use as a jeweller instrument with carat preset as fixed unit; JL-G
    has gram as fixed unit; otherwise both do not differ metrologically from a PL...-S instrument.
