certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MP62xx
  - MP65xx
  description: >-
    Scanner/scale, accuracy class III, mains operated, self-indicating, weight only, non-automatic weighing
    instrument. Designed for flush-mounting in a checkout surface with frame extensions; intended for
    fixed installation in a checkout counter (no leveling device or level indicator provided); stainless
    steel load receptor; pole-mounted display. Devices: initial zero setting device, semi-automatic zero
    setting device, zero tracking device, automatic zero setting device, zero indicator, gravity compensation.
    Audit trail: two event counters ('C' = number of calibrations, 'P' = number of configuration parameter
    changes) provided by an integrated seven-segment display, also shown on the Motorola Solutions remote
    display when installed.
