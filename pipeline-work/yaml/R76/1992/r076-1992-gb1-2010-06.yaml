certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CI-200 Series
  - CI-200A
  - CI-201A
  - CI-200S
  - CI-200SC
  module_designation:
  description: >-
    Class III, mains or battery-operated, self-indicating, single or dual-interval, non-automatic weighing
    instrument consisting of a CI-200 Series indicator connected to a weighing platform. Features: alphanumeric
    keypad, battery indicators (low, charging), initial zero setting device on power up, semi-automatic
    zero setting, optional zero tracking, semi-automatic subtractive tare weighing, zero-indicator, indication
    of stable equilibrium, net indicator, gravity compensation, printing, hold function. Any compatible
    load cell may be used provided it holds an OIML R60 Certificate of Conformity containing the required
    load cell data; a load cell marked NH is allowed only if humidity testing to R76 has been conducted
    on it; compatibility is established by the manufacturer by means of the compatibility of modules calculation.
