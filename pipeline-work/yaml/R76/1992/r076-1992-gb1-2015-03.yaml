certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - GP
  - GPE
  module_designation: Not applicable
  description: >-
    GP and GPE series of multi-divisional non-automatic weighing instruments, mains or battery powered,
    accuracy class III, price-computing, stand-alone instruments intended for direct sales to the public.
    Maximum capacities are between 3 kg and 3000 kg. Construction depends on the model number; the designation
    follows the format 'Family'+'suffix', where the family is GP or GPE and the suffix comprises alphanumeric
    characters identifying different variants. Features include environmental protection against dust,
    water and insects; LCD, LED and touch displays; high-speed thermal printer; die-cast chassis and plastic
    housing containing the load cell and electronics; stainless steel and aluminium load receptor; mechanical
    and membrane keyboard; level indicator.
