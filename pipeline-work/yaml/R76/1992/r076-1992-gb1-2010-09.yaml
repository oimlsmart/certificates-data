certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - 720i-1A
  - 720i-1E
  - 720i-2A
  - 720i-2E
  description: >-
    720i Class III or IIII, mains or DC-powered, self-indicating, single or multi-interval/range, non-automatic
    weighing instrument consisting of a 720i indicator (720i-1A, 720i-1E, 720i-2A or 720i-2E) connected
    to a weighing platform. Devices: semi-automatic zero setting device, zero-tracking device, subtractive
    semi-automatic tare balancing device, pre-set tare device, gross and net indicator, display test device,
    time and date function, truck modes, multi-interval/multi-range, alibi memory, local/remote configuration.
    Interfaces: load cell 4 or 6-wire connection, RS232, RS485, analogue output, 20 mA current loop, digital
    I/O (24 channels), Ethernet TCP/IP, USB connector, PS2 keyboard, pulse input interface, bus interface
    (Profibus, Device-Net, Ethernet IP, Control-Net).
