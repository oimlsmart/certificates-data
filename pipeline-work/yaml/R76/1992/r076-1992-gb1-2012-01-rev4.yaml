certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CT100 Series
  - CT100-B
  - CT100-P
  - CT100-R
  - CT100 PLUS-B
  - CT100 PLUS-P
  module_designation: Not applicable
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Plastic construction with operator keypad,
    stainless steel load receptor, operator LCD display, pole-mounted customer LCD display, level indicator
    and integrated printer (base-mounted on CT100-B and CT100-P, pole-mounted on CT100-R). Devices include
    initial zero setting, semi-automatic zero setting, zero tracking, zero indicator, net indicator, stable
    weight indicator, semi-automatic subtractive tare, gravity compensation, price-computing, totalisation,
    PLU, fixed weight labelling, multi-vendor operation and calibration/set-up mode via sealed internal
    switch. CT100 PLUS models are fitted with a modified integrated printer.
