certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SW Series
  - ED
  - ER PLUS
  - ER PLUS M
  - SW-1
  - SW-1S
  - SW-1C
  - SW-1W
  - SW-1LR
  - SW-1WR
  - ER JR
  - PW-II
  module_designation: Not applicable
  description: >-
    Class III, mains or battery-operated, self-indicating, non-automatic weighing instruments designated
    SW Series, comprising the ED, ER PLUS, ER PLUS-M, SW-1, ER JR and PW-II models and their variants,
    in single-interval and dual-interval versions. Construction: steel construction, operator's keypad,
    stainless steel load receptor, level indicator, operator and customer display. Devices: initial zero
    setting device, semi-automatic zero setting device, zero tracking device, zero indicator, net indicator,
    semi-automatic subtractive tare balancing device, gravity compensation; check weighing and weighing
    unstable samples modes (SW-1S, SW-1C, SW-1W, SW-1LR, SW-1WR, ER JR, PW-II and ED models only). Any
    compatible CE-marked mains adaptor may be used. Sealing: access to the load cell and calibration switch
    is prevented by sealing the enclosure using a wire-and-seal or tamper-evident sticker.
