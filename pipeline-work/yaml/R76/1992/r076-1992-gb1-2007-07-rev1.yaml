certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Enterprise 9000
  - Enterprise 9100
  module_designation:
  description: >-
    Huntleigh Healthcare Enterprise 9000 or Enterprise 9100 hospital bed with weighing facility. The beds
    incorporate Class III non-automatic weighing instruments with weighing control buttons and weight
    displays in both safety sides, an 'AUTO_COMP' function allowing the weight value to be frozen while
    medical equipment is added or removed without disturbing the patient, an extended indicating device
    temporarily giving an interval of 0.1 kg, and optional local gravity adjustment. Alternative construction:
    the headboard is mounted off the mattress platform instead of the base-frame. The Enterprise 9000
    and Enterprise 9100 have identical weighing equipment but different medical facilities.
