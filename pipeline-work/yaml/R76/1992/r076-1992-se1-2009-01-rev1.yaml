  module_designation: Not applicable
  description: >-
    A graduated, self-indicating, electronic, single or multi-interval non-automatic weighing instrument.
    UNI 5 and UNI-7 is a multi-interval non-automatic weighing and price-computing instrument with label/receipt
    printer. It is approved for direct sales to the public. Base with four levelling feet and a level
    indicator. Protective interfaces: Ethernet (RJ-45 and Wireless), RS-232C, CF Card and USB.
