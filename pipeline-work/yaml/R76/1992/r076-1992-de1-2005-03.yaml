  - SLSC2MR
  module_designation:
  description: >-
    Non-automatic electromechanical weighing instrument without lever system, consisting of an indication
    and operation unit for displaying the weighing result and operating the instrument, including a strain
    gauge double bending-beam tension load cell. The weighing ranges with Max, Min, e and number of verification
    scale intervals may be chosen within the limits of No. 3.2 of R76-1 and of Table 1.
