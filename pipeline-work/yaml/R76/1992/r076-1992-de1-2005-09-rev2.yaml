revision_history:
- revision: '2'
  date: '2007-02-28'
  changes: >-
    Issued because the maximum number of verification scale intervals was increased to 61000 for class
    (II) instruments. Conformity established in Report N° 1.12-4020116, Revision 2 and by tests described
    in Test Report N° 1.12-4020116/5; the test results of the former Test Reports No. 1.12-4020116/1,
    No. 1.12-4020116/2, No. 1.12-4020116/3 and No. 1.12-4020116/4 remain valid.
matrix_tables:
- name: Table 1 – Limiting values for selectable weighing ranges
  columns:
  - attribute
  - accuracy_class_I
  - accuracy_class_II
  rows:
  - attribute: max
    accuracy_class_I: 65 g … 260 g
    accuracy_class_II: 210 g … 4100 g
  - attribute: verification_scale_interval_e
    accuracy_class_I: 0.001 g
    accuracy_class_II: 0.01 g … 0.1 g
  - attribute: scale_interval_d
    accuracy_class_I: 0.0001 g
    accuracy_class_II: 0.001 g … 0.01 g
  - attribute: number_of_verification_scale_intervals_n
    accuracy_class_I: "≤ 260000"
    accuracy_class_II: "≤ 61000"
  - attribute: tare_balancing_range
    accuracy_class_I: "≤ 100 % of Max"
    accuracy_class_II: "≤ 100 % of Max"
  - attribute: temperature_range
    accuracy_class_I: 10 °C … 30 °C
    accuracy_class_II: 10 °C … 30 °C
  description: >-
    Weighing ranges comprising Max, verification scale intervals, number of verification scale intervals
    and scale intervals may be selected considering the limiting values; this also applies for weighing
    results indicated in carat. Tare-balancing range and temperature range apply to both accuracy classes.
  footnotes: []
