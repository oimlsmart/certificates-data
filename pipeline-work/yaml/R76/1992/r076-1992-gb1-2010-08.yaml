certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - "#821G"
  module_designation:
  description: >-
    Class III or IIII, mains or battery-operated, self-indicating, single-interval, non-automatic weighing
    instrument. It consists of a #821G indicator connected to a weighing platform. Main features: LCD
    display, operator's keypad (numerical and function keys), stainless steel casing. Devices: initial
    zero-setting, semi-automatic zero setting, zero-tracking, semi-automatic subtractive tare weighing,
    zero-indicator, determination of stability of equilibrium, net indicator, units change (kg or g),
    weight bar, totalisation. Any compatible load cell may be used provided it has a respective OIML R60
    Certificate of Conformity containing the necessary data for the manufacturer's declaration of compatibility
    of modules; compatibility of load cells and indicator is established by means of the compatibility
    of modules calculation.
