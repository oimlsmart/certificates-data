certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - Magellan 8502
  - Magellan 9502
  description: >-
    Electronic nonautomatic weighing instrument intended for direct sales to the public - weighing and
    barcode scanning of items in a check-out situation. Intended to be installed in a fixed position (in
    a recess within the check-out counter); a levelling device and level indicator are not provided. The
    display is single sided and shall be located such that all primary indications are clearly and simultaneously
    displayed to both the vendor and the customer. The load receptor has nominal dimensions of 307 mm
    x 283 mm (dimensions do not include the vertical section of the load receptor). The model 9502 is
    similar to the model 8502 but incorporates a Sensormatic electronic article surveillance (EAS) antenna
    and associated circuitry for security purposes, modified scanning optics, and a relocated load cell.
    The instrument is available with the load cell at the left or right of the platform.
