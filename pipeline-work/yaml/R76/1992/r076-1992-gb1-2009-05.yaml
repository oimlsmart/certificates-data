certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - GSE 350-Series
  - GSE 350 SS
  - GSE 355 SS
  - GSE 350 Zinc Die Cast
  - GSE 350IS
  - GSE 355IS
  - '562'
  module_designation:
  description: >-
    Family of non-automatic weighing instruments formed by GSE 350-Series digital weight indicators connected
    to a weighing platform; single or multi-range, Class III or IIII, self-indicating. Devices: semi-automatic
    zero setting, zero tracking, semi-automatic subtractive tare weighing/balancing, preset tare (GSE
    355 SS only), indication of stability of equilibrium, zero indicator, printing key, counting mode.
