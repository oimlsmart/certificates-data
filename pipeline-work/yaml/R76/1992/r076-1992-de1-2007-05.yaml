certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - CE II...
  module_designation: Not applicable
  description: >-
    Nonautomatic electromechanical weighing instrument. The weighing instrument consists of a weighing
    module, comprising the load receptor with or without a lever system, the strain gauge load cell and
    the electronics with an AD-converter for signal processing, of an incorporated indicating device for
    displaying the weighing results, and of a keypad to operate the instrument. The weighing ranges with
    Max, Min, e, d and number of verification scale intervals may be chosen within the limits of No. 3.2
    of R 76-1 and of Table 1.
