certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AWB120
  module_designation: Not applicable
  description: >-
    Class III, mains or battery-operated, self-indicating, single-interval, non-automatic weighing instrument.
    Pole-mounted LCD display with function keys and LED indicators (low battery, checkweighing); indicator
    plastic enclosure; aluminium die-casting load receptor (420x520 mm) with stainless steel pan; level
    indicator and adjustable feet. Devices: initial zero setting device, semi-automatic zero setting device,
    zero tracking device, zero indicator, net indicator, determination of stable equilibrium, stable equilibrium
    indicator, semi-automatic subtractive tare balancing device, checking of display, weight accumulation,
    printing, checkweighing, coarse filter mode to allow weighing of unstable samples.
