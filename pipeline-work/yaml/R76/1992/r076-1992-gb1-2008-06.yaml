certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MS-4400
  module_designation:
  description: >-
    Charder MS-4400 Baby Hoist Scale, a non-automatic weighing instrument. LCD display fitted into top
    cover: 5 digits, with Zero, Net and Hold indicators. Three buttons (On/Off/Zero, Tare and Hold). Plastic
    enclosure containing the load cell and electronics. Hanging scale feature for baby weighing. Weight
    lock feature. Low battery indicator. Power saving and auto shut off. Devices: initial zero setting
    device, semi-automatic zero setting device, zero indicator, semi-automatic subtractive tare balancing
    device, net indicator, hold facility, weight lock indicator.
