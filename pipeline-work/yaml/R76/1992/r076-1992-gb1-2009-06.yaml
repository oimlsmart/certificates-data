certified_type:
  category: Indicator
  type_designations:
  - BI920
  - BI920-OP
  description: >-
    Non-automatic weighing instrument designated the BI920 'Baggage Indicator', comprising an operator
    panel (BI920-OP) connected to a load receptor. The Avery Weigh-Tronix model BI920 Baggage Indicator
    is designed for airport check-in counter baggage weighing. It consists of an operator's panel with
    an LCD display which shows weight, weigh accumulator and bag count, and a passenger LED display which
    also shows weight, weigh accumulator and bag count.
