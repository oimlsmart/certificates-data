  module_designation:
  description: >-
    Huntleigh Healthcare Enterprise 9000 or Enterprise 9100 hospital bed with weighing facility. Class
    III non-automatic weighing instruments incorporated in hospital beds. Weighing control buttons and
    weight displays in both safety sides. AUTO_COMP function, which allows the weight value to be frozen
    while medical equipment is added or removed, without disturbing the patient. Extended indicating device
    temporarily giving interval of 0.1 kg. The Enterprise 9000 and Enterprise 9100 have identical weighing
    equipment, but different medical facilities.
