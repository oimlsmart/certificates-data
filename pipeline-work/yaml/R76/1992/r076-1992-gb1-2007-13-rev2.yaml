certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DPS-700
  - CM-700
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instrument formed by connecting the DPS-700 digital indicating device with
    optional labeller, or its compact version designated the CM-700, to a weighing platform. Class III,
    mains-powered, self-indicating. Main features: processor and converter unit comprising a Teraoka TPB-2930
    CPU and a Teraoka TPB-2786 A/D converter; touch screen (colour TFT-LCD module); labeller type Digi
    DPS 700 thermal printer (optional); metallic supporting frame (DPS-700 only). Devices: initial zero
    setting; semi-automatic zero setting; zero tracking; semi-automatic subtractive tare weighing; determination
    of stability of equilibrium; indication of stability of equilibrium; zero indicator; PLUs; preset
    tare; price calculation.
