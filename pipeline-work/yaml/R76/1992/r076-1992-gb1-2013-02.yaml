certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - M-300
  module_designation: Not applicable
  description: >-
    Class III, mains or battery-powered, self-indicating, Non-Automatic Weighing Instrument (baby scale),
    designed to record the weight of a baby. LCD display fitted into load receptor with Zero, Net and
    Hold indicators; aluminium base enclosure containing the load cell and electronics; plastic load receptor
    with tray; level indicator next to the display; four adjustable feet.
