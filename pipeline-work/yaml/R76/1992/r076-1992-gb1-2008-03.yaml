certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - D70b
  description: >-
    Class III or IIII, mains-powered, self-indicating, non-automatic weighing instrument comprising the
    D70b weight indicator connected to a load receptor. Main features: 7-segment LCD display, operator's
    keypad, serial ports for connection of peripherals, plastic casing. Devices: initial zero setting
    device on power up, semi-automatic zero setting, zero tracking, semi-automatic subtractive tare weighing,
    zero-indicator, indication of stable equilibrium, net indicator. Load cell cable from One-Module to
    load cell junction box uses 6 screened conductors.
