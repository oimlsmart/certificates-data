certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - FS-30Ki
  - FS-6Ki
  - FS-15Ki
  module_designation:
  description: >-
    Non-Automatic Weighing Instrument of 30 kg maximum capacity with additional functionality of displaying
    LO/OK/HI limits on the indicator for check weighing (not included in this approval). Stainless steel
    weigh platform and pole mounted backlit LCD display. Powered by mains power supply (220-240 V AC);
    may also work on a 6 V sealed lead acid battery. Serial interface connectivity for peripheral devices
    (peripheral devices not covered under this approval). Capabilities for tare and preset-tare including
    pre-set tare values associated with product look-up tables. Level bubble and four adjustable feet
    for levelling.
