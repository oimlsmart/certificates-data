  category: Non-automatic weighing instrument
  type_designations:
  - M375x1
  - M376x1
  module_designation:
  description: >-
    Non-automatic electromechanical baby weighing instruments. The weighing instrument consists of a weighing
    platform with four strain gauge planar beam load cells, an indication for displaying the weighing
    result and membrane switches to operate the instrument. The weighing ranges with Max, Min, e, d and
    number of verification scale intervals may be chosen within the limits of No. 3.2 of R 76-1 and of
    Table 1.
