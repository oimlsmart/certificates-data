certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - NCR 7878-2000
  - NCR 7874-5000
  description: >-
    Mains powered, Class III, scanner/scale, non-automatic weighing instrument designed for flush-mounting
    in checkout surface. Steel framework supporting a barcode scanner, electronics, and a Flintec PBNS-30
    scale module containing four load cells, with NCR 7825 remote display unit, NCR 7878 barcode scanner,
    and interface for POS connection. The NCR 7874-5000 has a smaller load receptor than the 7878-2000,
    can be mounted into an optional stainless steel mounting bracket and has a 2.5 cm longer extended
    weigh plate.
