certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Angel Series AP+
  module_designation: Not applicable
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instrument. Steel construction, operator's keypad, stainless steel load receptor, pole-mounted
    double-sided VFD display, level indicator. Devices include gravity compensation, price-computing,
    totalisation (including non-weighed items) and PLU.
