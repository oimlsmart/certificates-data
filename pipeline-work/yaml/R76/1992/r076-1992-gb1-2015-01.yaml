certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - MP Series
  module_designation: Not applicable
  description: >-
    Family of instruments designated the MP Series, comprising a CI-200 Series indicator connected to
    load cells fitted on a pallet truck. Class III, battery-operated, self-indicating, single-interval,
    non-automatic weighing instruments. May be used for direct sales to the public. Construction: CI-200A
    or CI-201A indicator; load receptor comprising 2 forks supported by 3 wheels; integrated battery located
    in the column; load receptor height sensor; tilt sensor; brakes; optional printer.
