certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Enterprise 9000
  - Enterprise 9100
  - 9000X
  - Citadel
  description: >-
    Huntleigh Healthcare Enterprise 9000, Enterprise 9100, 9000X and Citadel hospital beds incorporating
    a Class III, mains operated, self-indicating Non-Automatic Weighing Instrument. Main features: hospital
    bed with contour control and weighing functions; four load cells; safety sides incorporating attendant
    controls including weighing control buttons; identical weight displays and associated control buttons
    on both sides of the bed. Devices: semi-automatic zero setting device; verification scale interval
    0.5 kg, but with extended indicating device temporarily giving interval of 0.1 kg; BED EXIT alarm
    function if weight decreases to 50% or less; AUTO-COMP function allowing the weight to be held steady
    while equipment is added.
