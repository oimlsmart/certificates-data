certified_type:
  category: Weighing instrument
  type_designations:
  - Magellan 8502
  - Magellan 9502
  - Magellan 8504
  description: >-
    Electronic nonautomatic weighing instrument intended for direct sales to the public - weighing and
    barcode scanning of items in a check-out situation. Intended to be installed in a fixed position (in
    a recess within the check-out counter), consequently no levelling device or level indicator is provided.
    The display is single sided and shall be located such that all primary indications are clearly and
    simultaneously displayed to both vendor and customer. Load receptor nominal dimensions 307 mm x 283
    mm (dimensions do not include the vertical section of the load receptor). Model 9502 is similar to
    the 8502 but incorporates a Sensormatic EAS antenna and associated circuitry, modified scanning optics,
    and a relocated load cell available at the left or right of the platform. Model 8504 is similar to
    the 8502 but may incorporate an EAS antenna of a different type to that used in the 9502 and the orientation
    of the load cell has been changed.
