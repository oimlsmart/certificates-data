certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - 47-10-XX
  - 47-10V-XX
  module_designation: Not applicable
  description: >-
    A graduated, self-indicating, electronic, non-automatic weighing instrument; a non-automatic floor
    scale, class III, with single or multi-interval electronic indicating device, for industrial use.
    The instrument consists of a rectangular platform or U-frame with four load cells connected to an
    indicator. Supplementary devices: semi-automatic zero setting and initial zero-setting, zero indication
    and zero-tracking, semi-automatic tare balancing, printing, piece counting, signal test mode, and
    data storage device (DSD) called alibi weight memory.
