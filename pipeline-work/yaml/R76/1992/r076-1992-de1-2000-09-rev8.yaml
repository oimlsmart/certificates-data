    Types YAC01..., YAC02..., TN, TN-X and isi... Weighing modules: Types BD BF, BC BF, BF BF, BE BK,
    HC BF, HA BD, KC BN and YCO02IS-0CE. The weighing instrument consists of a weighing platform with
    one electromagnetic force compensation load cell or one or more strain gauge load cells and of an
    indicating device for displaying the weighing results, and of a keypad to operate the instrument.
    All indicating and operator terminals and weighing modules mentioned may be combined.
