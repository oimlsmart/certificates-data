certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - M704x2
  - M764x2
  - COS01A
  module_designation:
  description: >-
    Non-automatic electromechanical weighing instrument for persons, consisting of a weighing platform
    with one strain gauge shear-beam load cell, an indication for displaying the weighing result and a
    membrane keyboard to operate the instrument. The weighing ranges with Max, Min, e, d and number of
    verification scale intervals may be chosen within the limits of No. 3.2 of R 76-1 and of Table 1.
    The types COS01A and BIS01A-E are equipped with identical electronic components.
