certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - GFK..M
  - GFK 60M
  - GFK 150M
  - GFK 300M
  module_designation:
  description: >-
    GFK..M non-automatic weighing instrument formed by connecting the GK indicator to a weighing platform.
    Class III, mains or battery-powered self-indicating, non-automatic weighing instrument. Main features:
    main PCB with processor type ATMEGA64; 6-digit (plus symbols and indicators) LCD screen with 9 LEDs
    to its left; 20-key keypad (numerical and functions); plastic enclosure. Devices: initial zero setting;
    semi-automatic zero setting; zero tracking; zero indicator; semi-automatic subtractive tare weighing;
    net indicator; determination of stability of equilibrium; indication of stability of equilibrium;
    parts counting; percent weighing; checkweighing; live animal weighing; accumulation; real-time clock.
