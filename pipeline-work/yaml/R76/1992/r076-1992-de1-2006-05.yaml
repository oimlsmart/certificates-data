certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - ST...
  description: >-
    Nonautomatic electromechanical weighing instrument consisting of a weighing platform with strain-gauge
    or EMC load cells, an indicating device for displaying the weighing results, and a keypad to operate
    the instrument. The weighing ranges with Max, Min, e, d and number of verification scale intervals
    may be chosen within the limits of No. 3.2 of R 76-1 and of table 1 or table 2.
