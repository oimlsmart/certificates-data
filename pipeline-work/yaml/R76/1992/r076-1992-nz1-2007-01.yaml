certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - FS-6Ki
  - FS-15Ki
  - FS-30Ki
  module_designation:
  description: >-
    The A & D Mercury Model FS-30Ki is a Non Automatic Weighing Instrument of 30 kg maximum capacity.
    The instrument has the additional functionality of displaying 'LO/OK/HI' limits on the indicator for
    check weighing but this is not included in this approval. The instrument has a stainless steel weigh
    platform and a pole mounted backlit LCD display, a level bubble and four adjustable feet for levelling.
    The instrument may also work on a 6V sealed lead acid battery. The instrument has serial interface
    connectivity for providing connections to peripheral devices; the peripheral devices are not covered
    under this approval. The instrument was powered by mains power supply (220-240 V AC). The instrument
    has capabilities for tare and preset-tare (including pre-set tare values associated with product look-up
    tables).
