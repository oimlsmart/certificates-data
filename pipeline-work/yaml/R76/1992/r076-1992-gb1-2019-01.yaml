certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SWII
  - PRII
  module_designation:
  description: >-
    Class III, mains- or battery-operated, self-indicating, single or dual-interval, non-automatic weighing
    instruments of the SWII and PRII Series, comprising the SWII, PRII-B, PRII-P and PRII-U models and
    their variants. May be used for direct sales to the public. Plastic construction with operator keypad
    and level indicator; load receptor plastic (SWII) or stainless steel (SWII and PRII); dual, integral
    or pole-mounted LCD or LED display. Devices: initial zero setting device, semi-automatic zero setting
    device, zero tracking device, zero indicator, net indicator, unit change (g, kg), stable weight indicator
    (SWII), semi-automatic subtractive tare balancing device, gravity compensation, price-computing (PRII),
    totalisation (PRII), PLU (PRII), piece counting (SWII), hold function (SWII), checkweighing (SWII).
    Software designated V1.xx; software download only possible via the ICP interface (connector CON1)
    and protected by switches on the main board; legally relevant parameters accessible only via the calibration
    switch. Access to the load cell, electronics, calibration and software download switches secured via
    a tamper-evident solution bearing a securing mark. Interfaces: RS232C, USB.
