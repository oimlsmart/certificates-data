  description: >-
    Graduated, self-indicating, electronic, single or multi-interval non-automatic weighing and price-computing
    instrument with label/receipt printer. Approved for direct sales to the public or for price labelling.
    The base has four levelling feet and a level indicator. Protective interfaces: Ethernet (RJ-45 and
    Wireless), RJ, USB and RS-232C.
