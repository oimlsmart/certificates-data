    maximum_tare_effect: "-Max1"
  - pattern: UNI-3 L1EV
    max_capacity: 15
    min_capacity: 100
    scale_interval: e = 5 g
    maximum_tare_effect: -5.995
  - pattern: UNI-3 L2
    max_capacity: 30
    min_capacity: 100
    scale_interval: e1 = 5 g (0-14.995 kg); e2 = 10 g (15-30 kg)
    maximum_tare_effect: -14.995
  - pattern: UNI-3 L2EV
    max_capacity: 30
    min_capacity: 200
    scale_interval: e = 10 g
    maximum_tare_effect: -14.99
  - pattern: UNI-3 L2H
    max_capacity: 30
    min_capacity: 200
    scale_interval: e = 10 g
    maximum_tare_effect: -14.99
  description: >-
    The patterns header row spans all five types (UNI-3 L1, UNI-3 L1EV, UNI-3 L2, UNI-3 L2EV, UNI-3 L2H)
    while the data table has four columns; the first four patterns map to the four columns in order and
    the last column (Max 30 kg, Min 200 g, e = 10 g) is taken to cover both UNI-3 L2EV and UNI-3 L2H.
    Temperature range (-10°C to +40°C) and power supply (200-240V AC, 50/60 Hz) apply to all patterns.
