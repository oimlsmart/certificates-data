certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CASTON Series
  - CASTON II
  - CASTON III
  description: >-
    CASTON Series Class III, battery powered, self-indicating, single-interval, non-automatic weighing
    instruments (crane scales). Steel construction; operator's keypad; 'One-Module' weighing module; LCD
    or LED display; upper lift eye bolt and lower hook. Devices: initial zero setting device on power
    up, semi-automatic zero setting, zero tracking, semi-automatic subtractive tare balancing, zero-indicator,
    indication of stable equilibrium, net indicator, hold function, gravity compensation.
