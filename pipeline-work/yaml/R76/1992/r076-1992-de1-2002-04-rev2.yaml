certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - CE...
  description: >-
    Nonautomatic electromechanical weighing instrument consisting of a weighing platform with one strain-gauge
    load cell, an incorporated indicating device for displaying the weighing results, and a keypad to
    operate the instrument. The weighing ranges with Max, Min, e, d and number of verification scale intervals
    may be chosen within the limits of No. 3.2 of R 76-1 and of Table 1.
