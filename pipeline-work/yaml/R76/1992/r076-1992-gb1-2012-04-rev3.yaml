certified_type:
  category: Indicator
  type_designations:
  - ZM301
  - ZM303
  - ZM305
  - ZQ375
  description: >-
    The family of indicating devices are designated the Avery Weigh-Tronix ZM301 / ZM303 / ZM305 / ZQ375
    Series. The indicators are self-indicating, mains, DC or battery-powered, and are designed to be used
    as part of a Class III or IIII, Non-Automatic Weighing Instrument. Indicator construction designation
    follows the format Prefix-XYZ: prefix ZM301, ZM303 or ZM305 = Standard Indicator, ZQ375 = Check-weighing
    Indicator; first digit X = enclosure material (S = Stainless, A = Alloy); second digit Y = mounting
    orientation (D = Desktop, G = Desktop with GTN Inbound-Outbound software & keypad variant, P = Panel
    Mount); third digit Z = display type (1 = IBN black background with green digits, 2 = TN green background
    with black digits).
