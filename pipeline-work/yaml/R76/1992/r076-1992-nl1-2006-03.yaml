  category: Non-automatic weighing instrument
  type_designations:
  - DS-650...
  module_designation:
  description: >-
    Family of non-automatic weighing instruments designated DS-650..., covered in two variants: instrument
    with load cell type K (6 kg <= Max <= 30 kg or Max <= 30 lb, e >= 2 g) and instrument with load cell
    type P (3 kg <= Max <= 30 kg or Max <= 60 lb, e >= 1 g). Max 3000 divisions per partial weighing range,
    maximum of two partial weighing ranges, subtractive tare T <= -Max1, temperature range -10 degC /
    +40 degC.
