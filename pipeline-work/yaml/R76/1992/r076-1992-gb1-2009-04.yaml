certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - GSE 60-Series
  - '460'
  - '465'
  - '560'
  - '562'
  - '661'
  - '662'
  - '663'
  - '665'
  - '675'
  module_designation: Not applicable
  description: >-
    Non-automatic weighing instruments comprising the GSE 60-Series electronic weight indicators connected
    to a compatible R60 load cell and the 675 Bench Scale. Single or multi-range, Class III or IIII, self-indicating
    instruments. The GSE 60-Series controller housing is fabricated from stainless steel plate and comprises
    the 460, 465, 560, 562, 661, 662, 663 and 665 models, available in universal, wall, panel or desk-top
    mount configuration, with a VFD or LCD front panel display and keypad. Alternative construction: the
    GSE 675 Bench Scale has the same electronics and software as the GSE 60-Series, with the indicator
    having an integrated load cell platform and a different enclosure.
