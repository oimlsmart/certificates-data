certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - AP PLUS
  - AP PLUS-EX
  - AP PLUS-MX
  - AP PLUS-M
  - AP PLUS-EC
  - AD PLUS
  module_designation: Not applicable
  description: >-
    AP PLUS Series, AP PLUS Model (and variants) and AD PLUS Series, AD PLUS Model: Class III, mains-operated,
    self-indicating, price-computing, single or dual-interval, non-automatic weighing instruments. Steel
    construction, stainless steel load receptor, VFD display (AD PLUS Model), pole-mounted double-sided
    VFD display (AP PLUS Model), level indicator. Devices: initial zero setting device, semi-automatic
    zero setting device, zero tracking device, zero indicator, net indicator, semi-automatic subtractive
    tare balancing device, gravity compensation, price-computing (AP PLUS Model), totalisation including
    non-weighed items (AP PLUS Model), PLU (AP PLUS Model).
