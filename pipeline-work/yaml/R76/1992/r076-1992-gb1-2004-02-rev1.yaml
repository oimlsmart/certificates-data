certified_type:
  category: Indicator
  type_designations:
  - 820i
  - 920i
  module_designation:
  description: >-
    This indicating device, designated the 820i or 920i indicator, has the following devices: Semi-automatic
    zero setting device (<=4% of Max); Zero-tracking device (<=0.5d/s within 4% Max); Subtractive tare
    device; Gross and Net Indicator; Semi automatic tare device; Pre set tare device; Display test device;
    Time and date function. The indicator housing is fabricated from stainless steel plate. The front
    panel has a backlit LCD display and a twenty-seven key keyboard, five of the twenty seven keys are
    programmable software keys.
