certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL5500 Series
  - CL5500-B
  - CL5500-P
  - CL5500-R
  - CL5500-S
  - CL5500-H
  module_designation:
  description: >-
    Single or dual-interval, Class III, non-automatic weighing instruments. Self-indicating, mains-powered,
    may be used for direct sales to the public. Construction: plastic construction, stainless steel load
    receptor, level indicator, integrated printer, operator's keypad, front and rear LCD displays (CL5500-B),
    pole-mounted front and rear LCD displays (CL5500-P, CL5500-R, CL5500-S), pole-mounted keyboard (CL5500-S),
    hanging scale construction (CL5500-H). Devices: initial zero setting device (<= 20% of Max), semi-automatic
    zero setting device (<= 4% of Max), zero tracking device (<= 4% of Max), zero indicator, net indicator,
    stable weight indicator, semi-automatic subtractive tare balancing device, preset tare, gravity compensation,
    price-computing, totalisation (including non-weighed items), PLU, fixed weight labelling, multi-vendor
    operation, calibration/set-up mode via sealed internal switch. Interfaces: RS232C, PS/2, cash drawer,
    Ethernet, wireless LAN, USB. Sealing: calibration and setup parameters can only be accessed via the
    sealed switch located on the main board. Load cell: CAS load cell, model TP.
