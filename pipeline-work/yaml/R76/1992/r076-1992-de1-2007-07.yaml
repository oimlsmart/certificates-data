matrix_tables:
- name: Table 1 - Limiting values for weighing ranges
  columns:
  - attribute
  - III
  - IIII
  rows:
  - attribute: Max (maximum capacity)
    III: 2 kg ... 600 t
    IIII: 2 kg ... 600 t
  - attribute: n ≤ 1)
    III: 8000
    IIII: 1000
  - attribute: partial range n_i ≤ 2)
    III: 4000
    IIII: 1000
  - attribute: Max / e1 ≤ 2) or Max_r / e1 ≤ 3)
    III: 15000
    IIII: 5000
  - attribute: tare-balancing range
    III: 100 % of Max
    IIII: 100 % of Max
  - attribute: preset tare range
    III: 100 % of Max 1); 100 % of Max1 2)
    IIII: 100 % of Max 1); 100 % of Max1 2)
  - attribute: temperature range
    III: "-30 °C / +40 °C 4)"
    IIII: "-30 °C / +40 °C 4)"
  description: >-
    The weighing ranges comprising Max, verification scale intervals, number of verification scale intervals
    and scale intervals may be selected considering the limiting values in table 1. Symbol definitions:
    n_i = Number of scale intervals for each partial weighing range; e1 = Scale interval of the lowest
    partial weighing range; Max_r = Max of the largest range for a multiple weighing range instrument.
