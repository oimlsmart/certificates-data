certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - DISOMAT Tersus
  module_designation: Not applicable
  description: >-
    Non-automatic electromechanical weighing instrument with or without lever works. Designed as weighbridge,
    road vehicle scale, rail-weighbridge, hopper scale, crane scale, overhead scale track as well as mobile
    instrument in conveyor systems. The weighing instrument is equipped with a lever system or directly
    introduces the force into one or more load cells.
