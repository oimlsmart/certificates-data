certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - NT...
  description: >-
    Nonautomatic electromechanical weighing instrument. The weighing instrument consists of a weighing
    platform with strain-gauge load cell and/or a weighing module, comprising the load receptor, the strain
    gauge load cell or the electromagnetic force compensation load cell, and the electronics with AD-converter
    for signal processing, the microprocessor system with software module 'NT-Scale' for further signal
    processing and control of the balance operation, LC-display, indicating weight, tare values and additional
    information. Weighing ranges with Max, Min, e, d and number of verification scale intervals may be
    chosen within the limits of No. 3.2 of R 76-1 and of Table 1. Class (II) only with digital weighing
    module and Max <= 65 kg.
