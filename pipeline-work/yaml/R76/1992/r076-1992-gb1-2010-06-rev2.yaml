certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CI-200 Series
  - CI-200A
  - CI-201A
  - CI-200S
  - CI-200SC
  module_designation: Not applicable
  description: >-
    Class III, mains or battery-operated, self-indicating, single or dual-interval, non-automatic weighing
    instrument. It consists of a CI-200 Series indicator connected to a weighing platform. Devices include:
    initial zero setting device on power up, semi-automatic zero setting, zero tracking (optional), semi-automatic
    subtractive tare weighing, zero-indicator, indication of stable equilibrium, net indicator, gravity
    compensation, printing, hold function, counting mode (CI-201A), percent mode (CI-201A), totalisation
    (CI-201A), checkweighing (CI-201A and CI-200SC).
