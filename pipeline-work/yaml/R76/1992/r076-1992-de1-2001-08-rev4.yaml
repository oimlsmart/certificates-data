certified_type:
  category: Nonautomatic weighing instrument
  type_designations:
  - BC BL 100
  - BD BL 100
  - BD BL 200
  - BF BL 500
  description: >-
    Nonautomatic electromechanical weighing instrument. The weighing instrument is equipped with built-in,
    front-mounted or separate display, keyboard and interface. It may be designed with two indicating
    devices. The type BC BL 100 may have parts of the electronics arranged in a separate housing. The
    weighing ranges with Max, Min, e, d and number of verification scale intervals may be chosen within
    the limits of No. 3.2 of R76-1 and of tables 1 and 2.
