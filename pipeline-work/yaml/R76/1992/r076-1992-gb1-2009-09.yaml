certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - Oxford/Hoyer Elevate
  module_designation:
  description: >-
    The Oxford/Hoyer Elevate is an electrically-operated, battery-powered Class III non-automatic weighing
    instrument (patient lift) manufactured by Joerns Healthcare, with a maximum capacity of 200 kg. The
    load cell is mounted between the internal faces of the mast; the two-piece plastic housing contains
    the electronics manufactured by IMS Inc. The hand control unit is used to lower and raise the boom
    and operate the legs. Devices: combined semi-automatic zero-setting and tare balancing devices, stable
    equilibrium indicator (HOLD), and digital averaging mode to allow weighing of unstable weights.
