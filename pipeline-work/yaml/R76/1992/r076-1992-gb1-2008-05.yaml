certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - "#821E"
  module_designation:
  description: >-
    Class III, battery-powered, self-indicating, non-automatic weighing instrument comprising the #821E
    weight indicator connected to a load receptor and a compatible load cell. Main features: LCD display,
    operator's keypad, stainless steel casing. Devices: semi-automatic zero setting, semi-automatic subtractive
    tare weighing, zero-indicator, determination of stability of equilibrium, indication of stability
    of equilibrium, net indicator. No peripherals may be connected under this certificate.
