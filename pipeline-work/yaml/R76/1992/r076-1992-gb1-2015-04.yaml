certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CL5200J Series
  - CL5200J-B
  - CL5200J-P
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instruments designed for direct sales to the public. Construction: plastic, operator's keypad,
    stainless steel load receptor, level indicator, integrated printer; CL5200J-B has front and rear LCD
    displays, CL5200J-P has pole-mounted double-sided LCD displays. Devices: initial zero setting device
    (max 20% of Max), semi-automatic zero setting device (max 4% of Max), zero tracking device (max 4%
    of Max), zero indicator, net indicator, stable weight indicator, semi-automatic subtractive tare weighing
    device, preset tare, gravity compensation, price-computing, totalisation (including non-weighed items),
    PLU, fixed weight labelling, multi-vendor operation, calibration/set-up mode via sealed internal switch,
    self-service operation. Interfaces: RS232C, cash drawer, Ethernet, wireless LAN, USB. Software designated
    V2.xx.x or V3.xx.x, with xx.x reflecting non-legally relevant changes; access to legally relevant
    parameters only possible via the calibration switch. Access to electronics, load cell and calibration
    switch prevented by tamper-evident sealing solutions.
