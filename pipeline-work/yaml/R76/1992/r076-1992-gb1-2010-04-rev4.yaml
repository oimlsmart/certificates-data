certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - SW Series
  - ED
  - ER PLUS
  - ER PLUS M
  - SW-1
  - ER JR
  - PW-II
  module_designation: Not applicable
  description: >-
    Class III, mains or battery-operated, self-indicating, non-automatic weighing instruments designated
    SW Series, comprising the ED, ER PLUS, ER PLUS-M, SW-1, ER JR and PW-II models and their variants.
    Plastic construction, operator's keypad, stainless steel load receptor, level indicator, operator
    and customer display. Devices: initial zero setting device, semi-automatic zero setting device, zero
    tracking device, zero indicator, net indicator, semi-automatic subtractive tare balancing device,
    gravity compensation, check weighing and weighing unstable samples modes (SW-1S, SW-1C, SW-1W, SW-1LR,
    SW-1WR, ER JR, PW-II and ED models only), processing of non-weighed items, price computation (weighed
    and non-weighed items), totalisation (when connected to a printer), Price Clear and Tare Clear functions,
    3-point calibration. Sealing: access to load cell and calibration switch prevented by wire-and-seal
    or tamper-evident sticker on the enclosure. Software designated V2.xx.x or V3.xx.x, displayed at power
    up; download via RS232 port requires access to main board (jumper JP1).
