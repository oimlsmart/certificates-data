certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - PB
  module_designation:
  description: >-
    PB Series, PB Model, Class III, mains-operated, self-indicating, dual-interval, non-automatic weighing
    instrument. Stainless steel frame, PVC sheet load receptor, indicator comprising LCD display and keypad,
    level indicator and adjustable feet. Construction variant: wall mounted indicator. Devices: initial
    zero setting device, semi-automatic zero setting device, zero tracking device, zero indicator, semi-automatic
    subtractive tare balancing device, net indicator, gravity compensation, totalisation, hold function,
    low battery indicator. Interfaces: RS232 ports.
