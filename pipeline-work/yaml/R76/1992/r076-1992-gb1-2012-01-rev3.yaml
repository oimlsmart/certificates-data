certified_type:
  category: Non-automatic weighing instrument
  type_designations:
  - CT100 Series
  - CT100-B
  - CT100-P
  - CT100-R
  - CT100 PLUS-B
  - CT100 PLUS-P
  module_designation:
  description: >-
    Class III, mains-operated, self-indicating, price-computing, single or dual-interval, non-automatic
    weighing instrument designed for direct sales to the public. Construction: plastic housing, operator's
    keypad, stainless steel load receptor, operator LCD display, pole-mounted customer LCD display, level
    indicator, integrated printer (base-mounted on CT100-B and CT100-P; pole-mounted on CT100-R). Devices:
    initial zero setting device, semi-automatic zero setting device, zero tracking device (around Gross
    or Net zero), zero indicator, net indicator, stable weight indicator, semi-automatic subtractive tare
    weighing device, gravity compensation, price-computing, totalisation (including non-weighed items),
    PLU, fixed weight labelling, multi-vendor operation, calibration/set-up mode via sealed internal switch.
    Interfaces (some optional): RS232C, cash drawer, USB Device, USB Host, RS485, ZigBee, wired LAN, wireless
    LAN. Software identified by version number displayed at power-up, shall be 1.xx (xx = non-legally
    relevant modifications); download not possible without breaking the seal. Load cell, EPROM and calibration
    switch protected by sealing the enclosure via wire-and-seal or tamper-evident label. Optional Preset
    Tare device: semi-automatic tare then acts as balancing tare device, with Tare and Preset Tare values
    limited to Max1. CT100 PLUS variants fitted with a modified integrated printer.
