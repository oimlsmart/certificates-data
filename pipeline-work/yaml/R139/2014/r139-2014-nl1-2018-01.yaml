certified_type:
  category: CNG dispenser
  type_designations:
  - E30 CNG
  module_designation:
  description: >-
    A CNG dispenser as either a single stage system or as a multi-stage system (2 or 3 stages). The extension
    "x" "xx" in the type designation E30 CNG "x" "xx" are the "frame models" and are a non-essential indication.
    The dispenser consists of one measurement transducer (meter) and one calculating/indicating device
    (calculator); the same housing can comprise one or more measuring systems, and one calculating/indicating
    device may be a common part of the measuring systems. The CNG dispenser can be used with or without
    sequential control. The CNG is delivered from a high-pressure storage tank or from a high-pressure
    compressor; the measured quantity together with the price to pay are displayed and registered by the
    electronic counter/calculator.
