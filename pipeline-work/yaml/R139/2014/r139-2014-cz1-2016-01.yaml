certified_type:
  category: Fuel dispenser
  type_designations:
  - OCEAN BMP 40xx.Oxx/CNG
  - BMP40ab.Oxy/CNG
  - OCEAN MOD 40xx.OEx/CNG
  - MOD40ab.Oxy/CNG
  module_designation: Not applicable
  description: >-
    CNG dispenser type OCEAN BMP 40xx.Oxx/CNG is designed for measurement of quantities of the natural
    compressed gas. The dispenser may be designed for one to three sequential fillings and consists of
    shut off valves, strainers, electromagnetic valves, back valves, mass meters, pressure transducers,
    manometers, hoses with break away couplings, delivery nozzles with three way valve, measurement transducers
    with electronic transmitters, electronic calculator and indicating devices. The CNG dispenser type
    OCEAN MOD 40xx.OEx/CNG is a module which is incorporated into a standard liquid dispenser and/or LPG
    dispenser, with calculator(s) and indicating device(s) mounted beside the indicating device of the
    main dispenser. The CNG dispenser can be equipped with up to four measurement systems, each connected
    to its own electronic calculator, and can fill up to four cars simultaneously.
