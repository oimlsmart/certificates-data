certified_type:
  category: Fuel dispenser
  type_designations:
  - STD11
  module_designation:
  description: >-
    CNG dispenser type STD11 is designed for measurement of quantities of the natural compressed gas.
    CNG dispenser may be designed for one to four sequential filling and consists of ball valves for shut
    off, check valves, solenoid valves, pressure relief valve, measuring device, pressure transducers,
    temperature transducer, hoses with break away couplings, delivery nozzles with three way valve, electronic
    calculator and indicating devices.
