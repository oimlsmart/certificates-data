certified_type:
  category: Fuel dispenser
  type_designations:
  - V-line 47xx.xxx/CNG
  module_designation:
  description: >-
    Dispenser for compressed natural gas (CNG). The CNG dispenser consists of shut-off valves, solenoid
    valve(s) with non-return valve(s), strainer(s), measurement transducer(s), electronic calculator,
    pressure transducer(s), manometer(s), temperature transmitter, hose(s) with break-away coupling, delivery
    nozzle(s) with three-way valve and indicating device(s). Type V-line 47xx.xxx/CNG is assembled from
    body, dispensing module V-line 8690.xxx/CNG and electronic calculator with indicating device; the
    dispensing module V-line 8690.xxx/CNG can also be built into liquid fuel and/or LPG dispensers. The
    dispenser may be designed for one to three sequential fillings and one-sided or double-sided design.
    It is equipped with an ambient temperature transmitter to compensate maximum filling pressure, which
    does not affect the metrological characteristics of the measuring system.
