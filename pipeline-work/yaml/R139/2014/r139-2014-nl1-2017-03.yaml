certified_type:
  category: Fuel dispenser
  type_designations:
  - E30 CNG
  module_designation:
  description: >-
    A CNG dispenser, as either a single stage system or as a multi-stage system. Type: E30 CNG "x" "xx",
    where the extension "x" "xx" are the frame models, a non-essential indication. Each measuring instrument
    consists at least of one measurement transducer (meter) and one calculating/indicating device (calculator).
    The same housing can comprise one or more measuring systems; the dispenser can be built as a single
    stage system (one gas supply) or as a multi stage system connected to 2 or 3 gas supplies differing
    in pressure.
