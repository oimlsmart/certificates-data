certified_type:
  category: Fuel dispenser
  type_designations:
  - OCEAN BMP 40xx.Oxx/CNG
  - OCEAN MOD 40xx.Oxx/CNG
  - BMP40ab.Oxy /CNG
  - MOD40ab.Oxy /CNG
  - BMP4014.OED /CNG/H2
  - MOD4014.OED /CNG/H2
  - BMP4024.OED /CNG/H2
  - MOD4024.OED /CNG/H2
  - BMP4034.OED /CNG/H2
  - MOD4034.OED /CNG/H2
  - BMP4032.OED /CNG
  module_designation: type OCEAN BMP 40xx.Oxx/CNG
  description: >-
    Dispenser for compressed natural gas (CNG). Model code BMP40ab.Oxy/CNG / MOD40ab.Oxy/CNG: y = dispenser/module
    orientation (D double-sided, R single-sided right, L single-sided left); x = design (E EURO with hose
    column height 1900 mm, S SMART, W TOWER); b = number of dispensing hoses; a = number of pressure banks
    connected to dispenser input (1, 2 or 3); 40/O = OCEAN dispenser line; MOD = additional dispensing
    module incorporated into a standard liquid and/or LPG dispenser. The CNG dispenser consists of shut
    off valves, strainers, electromagnetic valves, back valves, mass meters, pressure transducers, manometers,
    hoses with break away couplings, delivery nozzles with three way valve, measurement transducers with
    electronic transmitters, electronic calculator and indicating devices. It may be designed for one
    to three sequential fillings and may be equipped with a preset function; up to four measurement systems
    can be connected, each to its own electronic calculator, allowing up to four cars to be filled simultaneously.
