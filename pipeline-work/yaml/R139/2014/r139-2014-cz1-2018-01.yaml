certified_type:
  category: Fuel dispenser
  type_designations:
  - OCEAN BMP 40xx.Oxx/CNG
  - OCEAN MOD 40xx.Oxx/CNG
  module_designation: OCEAN BMP 40xx.Oxx/CNG
  description: >-
    Dispenser for compressed natural gas (CNG), OCEAN dispenser line. Type designation structure BMP 40ab.Oxy/CNG:
    BMP marks all TATSUNO EUROPE dispensers, 40 marks the OCEAN dispenser line, a = number of pressure
    banks connected to the dispenser input, b = number of dispensing hoses located in the dispenser, O
    marks the OCEAN model dispenser line, x = dispenser design (E = EURO, S = SMART, W = TOWER), y = dispenser
    orientation (D = double-sided, R = single-sided right, L = single-sided left). MOD 40ab.Oxy/CNG marks
    the additional dispensing module incorporated into a standard liquid dispenser and/or LPG dispenser;
    for the module a = 1, 2 or 3 and x = E (EURO) is a model with hose column height 1900 mm. The CNG
    dispenser consists of shut-off valves, strainers, electromagnetic valves, back valves, mass meters,
    pressure transducers, manometers, hoses with break-away couplings, delivery nozzles with three-way
    valve, measurement transducers with electronic transmitters, electronic calculator and indicating
    devices. It may be designed for one to three sequential fillings, can be equipped with up to four
    measurement systems (each connected to its own electronic calculator) and can fill up to four cars
    simultaneously. An ambient temperature sensor compensates the maximum filling pressure. The dispenser
    can be connected to a payment terminal / POS system which does not affect the metrological characteristics.
    Under the metrological seal the zero flow rate and calibration factor can be set up directly through
    the CNG dispenser.
