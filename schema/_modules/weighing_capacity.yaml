# Module: weighing_capacity
#
# Capacity / interval characteristics for weighing instruments.
#
# Used by: R50 (continuous totalising), R51 (catchweighers), R61 (gravimetric
# filling), R76 (non-automatic weighing), R106 (automatic weighing),
# R134 (weigh-in-motion)
# NOT used by: R60 (load cells — uses its own load-cell vocabulary; see R60.yaml)

characteristics:
  maximum_capacity:
    description: Maximum capacity (Max)
    type: range
    common_units: [kg, t, g]
    note: Often a matrix across model variants — see model_family
    synonyms:
      - maximum_capacity_max
      - max_capacity
      - maximum_load_max
      - max_load

  minimum_capacity:
    description: Minimum capacity (Min)
    type: numeric
    common_units: [kg, g, mg]
    synonyms:
      - minimum_capacity_min
      - min_capacity
      - minimum_load_min
      - minimum_load
      - min_load

  scale_interval:
    description: Verification scale interval (e)
    type: numeric
    common_units: [g, kg, mg]
    synonyms:
      - verification_scale_interval
      - scale_interval_e
      - scale_interval_d
      - e

  number_of_scale_intervals:
    description: Maximum number of verification intervals (n)
    type: int
    synonyms:
      - max_number_of_scale_intervals
      - maximum_number_of_scale_intervals
      - n_max
      - nmax
      - number_of_verification_intervals

  measuring_range:
    description: Range description (e.g. "Single interval")
    type: string
    synonyms:
      - measurement_range
      - range_of_measurement
      - range

  tare:
    description: Tare-related field (range or balancing mode)
    type: string

  weighing_range:
    description: Single/multi interval
    type: enum
    values: ["Single interval", "Multi-interval", "Multi-range"]
