# Module: mechanical_speed
#
# Speed characteristics for vehicle/dynamic weighing instruments.
#
# Used by: R21 (taximeters), R51 (catchweighers — belt speed), R106 (automatic
#          weighing), R134 (weigh-in-motion)

characteristics:
  maximum_speed:
    description: Maximum operating speed
    type: range
    common_units: [km/h, m/s, m/min]

  minimum_speed:
    description: Minimum operating speed
    type: range
    common_units: [km/h, m/s, m/min]
