# Module: warmup_adjustment
#
# Warm-up and recalibration timing. Small module — only some certs declare these.

characteristics:
  warm_up_time:
    description: Warm-up time before metrological performance holds
    type: numeric
    unit_symbol: min
    allow_text_values: [Not needed, none, None, "Not applicable"]

  adjustment_period:
    description: Recommended recalibration period
    type: numeric
    unit_symbol: months
