definitions:
  Unit:
    description: |
      Structured unit reference. Composed of a unitsml unit_id (closed enum
      from unitsdb/units.yaml), an optional SI prefix (closed enum from
      unitsdb/prefixes.yaml), and optional application qualifiers
      (current_type, pressure_reference) that are not unitsdb concepts.
    type: object
    properties:
      unit_id:
        description: Canonical unitsml unit identifier (e.g. u:meter, u:volt).
        enum_file: _units.yaml
        enum: []  # populated at load time from the top-level units.enum above
      prefix:
        description: SI prefix from unitsdb/prefixes.yaml (e.g. p:milli). Null if none.
        type: [string, "null"]
      current_type:
        description: Electrical current qualifier — for AC vs DC of voltage/ampere units.
        type: [string, "null"]
        enum: [AC, DC, null]
      pressure_reference:
        description: Pressure reference qualifier — gauge / absolute / differential.
        type: [string, "null"]
        enum: [gauge, absolute, differential, null]
    additionalProperties: false

  Quantity:
    description: Physical quantity from unitsdb/quantities.yaml.
    type: object
    properties:
      quantity_id:
        description: Canonical unitsml quantity identifier (e.g. q:length).
        type: string
      dimension_id:
        description: Reference to a unitsml dimension (e.g. NISTd1).
        type: string
    additionalProperties: false
