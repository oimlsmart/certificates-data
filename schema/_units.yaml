_meta:
  source: unitsdb v2.0.0
  source_path: https://github.com/unitsml/unitsdb
  note: |-
    All units, prefixes, and quantities are referenced by their unitsml ID
    (u:meter, p:milli, q:length). These are ASCII, unambiguous, and
    cross-reference https://github.com/unitsml/unitsdb.

    Surface symbols (V, Ω, m) are display hints rendered at view time,
    never stored in cert data. Renderers look up the symbol via unit_id.

    Closed enum: any unit/prefix/quantity not in this file is invalid.
