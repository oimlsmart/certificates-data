    symbols:
    - { unicode: "kg/min", ascii: "kg/min", id: "kg_per_min" }
    root_units:
    - { power: 1,  unit_reference: { type: unitsml, id: u:kilogram } }
    - { power: -1, unit_reference: { type: unitsml, id: u:minute } }
    quantity_references:
    - { type: unitsml, id: q:mass_flow_rate }

  u:kilogram_per_cubic_meter:
    names:
    - { value: "kilogram per cubic meter", lang: en }
    short: kilogram_per_cubic_meter
    symbols:
    - { unicode: "kg/m³", ascii: "kg/m3", id: "kg_per_m3" }
    root_units:
    - { power: 1,  unit_reference: { type: unitsml, id: u:kilogram } }
    - { power: -3, unit_reference: { type: unitsml, id: u:meter } }
