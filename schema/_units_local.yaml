# Word-form and spelling aliases to canonical unitsml ids. These are not
# new units — they map the corpus's prose spellings onto unitsdb units so
# compound atoms resolve (revs/litre -> u:revolution + u:liter).
aliases:
  u:liter: [litre, liter]
  u:minute: [minute]
  u:hour: [hour]
  u:second: [second]
  u:us_gallon: ["US gal"]
  u:inch: [inch]
  u:lux: [lux]

# Symbol meanings only the recommendation can decide. A bare symbol whose
# unitsdb claimants collide (d = scale division / day / darcy; D = diameter
# / debye / darcy) resolves ONLY through a matching row here — same
# recommendation family and symbol — and stays honestly unresolved
# otherwise. Global symbol disambiguation is forbidden by evidence: the
# same glyph carries different meanings across recommendations and
# renderings, and OCR errors make pattern-guessing unsound.
disambiguation:
- symbol: d
  r: [R61, R76, R134]
  unit_id: u:division
  notes: "Weighing instruments: actual scale interval (d), sibling of the verification interval e."
- symbol: D
  r: [R49, R117, R137]
  unit_id: u:diameter
  notes: "Fluid-meter installation: straight lengths in pipe diameters."
- symbol: in
  r: [R76, R51, R49, R117, R137]
  unit_id: u:inch
  notes: "Display sizes and threaded connections: ordinary inch, not the US survey inch."
- symbol: lb
  r: [R76, R60]
  unit_id: u:av_pound
  notes: "Imperial capacity columns: avoirdupois pound, not troy."

# Currency symbol spellings to ISO 4217 alpha-3 codes. Currency is not a
# unit of measurement — the resolver emits it on the record's own currency
# field (price per litre: currency EUR + unit_id u:liter), never as a u: id.
currencies:
  EUR: ["€", "EURO", "EUR"]
