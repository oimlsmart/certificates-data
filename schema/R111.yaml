---
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://oimlsmart.org/schemas/R111.yaml"
title: "OIML R111 (Weights of Accuracy Classes E1, E2, F1, F2, M1, M2, M3) Certificate Schema"
description: |
  OIML R111 "Weights of accuracy classes E1, E2, F1, F2, M1, M2, M3".
  Standard mass pieces — cylindrical, sheet, or wire weights covering nominal
  masses from 1 mg to 5 t per R111-1 §3.
type: object
required: [certificate, certified_type, characteristics, recommendation]
properties:
  certificate:           { $ref: "_core.yaml#/definitions/Certificate" }
  issuing_authority:     { $ref: "_core.yaml#/definitions/IssuingAuthority" }
  applicants:            { $ref: "_core.yaml#/definitions/PartyList" }
  manufacturers:         { $ref: "_core.yaml#/definitions/PartyList" }
  certified_type:        { $ref: "#/definitions/CertifiedType" }
  characteristics:       { $ref: "#/definitions/Characteristics" }
  recommendation:
    type: object
    required: [id, edition, scheme]
    properties:
      id:          { type: string, const: R111 }
      edition:     { type: integer, enum: [2004] }
      amendment:   { type: [string, integer, "null"] }
      scheme:      { type: string, enum: [A, B] }
      accuracy_classes:
        type: array
        items:
          oneOf:
          - type: string
          - type: number
          - $ref: "#/definitions/AccuracyClass"
  test_reports:          { $ref: "_core.yaml#/definitions/TestReportList" }
  revision_history:      { $ref: "_core.yaml#/definitions/RevisionHistory" }
  model_family:          { $ref: "_core.yaml#/definitions/ModelFamily" }
  components:
    type: array
    items: { $ref: "_core.yaml#/definitions/Component" }
  footnotes:             { $ref: "_core.yaml#/definitions/FootnoteList" }
  matrix_tables:         { $ref: "#/definitions/MatrixTableList" }
  d011_tests_applicable:
    description: Weights do not undergo D 11 environmental tests (passive mechanical artefacts).
    type: array
    items: { $ref: "#/definitions/D011TestReference" }
    default: []

definitions:
  AccuracyClass:
    description: OIML R111-1 §5 weight accuracy class.
    allOf:
    - $ref: "_core.yaml#/definitions/StructuredValue"
    - properties:
        value:
          type: [string, "null"]
          oneOf:
          - const: E1
            description: Class E1 — highest precision, primary reference standard
          - const: E2
            description: Class E2 — high precision, secondary reference standard
          - const: F1
            description: Class F1 — high-precision working standard
          - const: F2
            description: Class F2 — working standard
          - const: M1
            description: Class M1 — medium-grade working weight
          - const: M2
            description: Class M2 — lower-grade working weight
          - const: M3
            description: Class M3 — service-grade weight

  CertifiedType:
    type: object
    required: [category, type_designations]
    properties:
      category: { type: string }
      type_designations:
        type: array
        minItems: 1
        items: { type: string }
      module_designation: { type: [string, "null"] }
      description: { type: [string, "null"] }

  Characteristics:
    type: object
    properties:
      type_level:
        type: object
        additionalProperties: { $ref: "_core.yaml#/definitions/StructuredValue" }
        properties:
          accuracy_class:                          { $ref: "#/definitions/AccuracyClass" }
          accuracy_type:                           { $ref: "_core.yaml#/definitions/StructuredValue" }
          material:                                { $ref: "_core.yaml#/definitions/StructuredValue" }
          range_of_density:                        { $ref: "_core.yaml#/definitions/StructuredValue" }
          density:                                 { $ref: "_core.yaml#/definitions/StructuredValue" }
          susceptibility:                          { $ref: "_core.yaml#/definitions/StructuredValue" }
          magnetism_class:                         { $ref: "_core.yaml#/definitions/StructuredValue" }
          surface_roughness:                       { $ref: "_core.yaml#/definitions/StructuredValue" }
          mass_range:                              { $ref: "_core.yaml#/definitions/StructuredValue" }
          nominal_mass:                            { $ref: "_core.yaml#/definitions/StructuredValue" }
          conventional_mass:                       { $ref: "_core.yaml#/definitions/StructuredValue" }
          maximum_permissible_error:               { $ref: "_core.yaml#/definitions/StructuredValue" }
          construction:                            { $ref: "_core.yaml#/definitions/StructuredValue" }
          shape:                                   { $ref: "_core.yaml#/definitions/StructuredValue" }
          marking:                                 { $ref: "_core.yaml#/definitions/StructuredValue" }
          adjustment_cavity:                       { $ref: "_core.yaml#/definitions/StructuredValue" }
          temperature_range:                       { $ref: "_modules/d011_environmental.yaml#/definitions/TemperatureRange" }
          humidity_class:                          { $ref: "_modules/d011_environmental.yaml#/definitions/ClimaticClass" }
          mechanical_environment_class:            { $ref: "_modules/d011_environmental.yaml#/definitions/MechanicalClass" }
      model_level:
        type: array
        items: { $ref: "#/definitions/ModelLevelEntry" }
      config_level:
        type: array
        items: { $ref: "#/definitions/ConfigLevelEntry" }

  ModelLevelEntry:
    type: object
    required: [attribute, values]
    properties:
      attribute: { type: string }
      unit_symbol: { type: [string, "null"] }
      unit_id:    { type: [string, "null"] }
      values:
        type: array
        items:
          type: object
          required: [model, value]
          properties:
            model:            { type: string }
            value:            { $ref: "_core.yaml#/definitions/ValueOrScalar" }
            footnote_markers:
              type: array
              items: { type: string }

  ConfigLevelEntry:
    type: object
    required: [attribute, axis, values]
    properties:
      attribute: { type: string }
      axis:      { oneOf: [ { type: string }, { type: "null" } ] }
      unit_symbol: { type: [string, "null"] }
      unit_id:    { type: [string, "null"] }
      values:
        type: array
        items:
          type: object
          required: [condition, value]
          properties:
            condition: { type: string }
            value:     { $ref: "_core.yaml#/definitions/ValueOrScalar" }

  MatrixTableList:
    description: Preserved structured tables (e.g. per-mass MPE tables).
    type: array
    items:
      type: object
      required: [name, columns, rows]
      properties:
        name:        { type: string }
        description: { type: [string, "null"] }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        footnotes:
          type: array
          items: { type: string }

  D011TestReference:
    description: Reference to an OIML D 11:2013 performance test (unused for R111).
    type: object
    required: [test_id]
    properties:
      test_id:          { type: string, pattern: '^d011_t\d{2}_' }
      test_level_index: { type: integer, minimum: 1, maximum: 5 }
      notes:            { type: string }
